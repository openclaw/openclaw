    behaviors:
      extractable: true
      expert_routing: false
    fields: []
  - name: slack
    label: Slack
    description: A Slack message or conversation worth keeping.
    kind: page
    primitive: temporal
    directory: slack/
    path_prefixes:
      - slack/
    aliases:
      - slack-message
      - slack-thread
    behaviors:
      extractable: true
      expert_routing: false
    fields: []
  - name: meeting
    label: Meeting
    description: A meeting and the discussion, context, and notes around it.
    kind: page
    primitive: temporal
    directory: meetings/
    path_prefixes:
      - meetings/
      - meeting/
    aliases: []
    behaviors:
      extractable: true
      expert_routing: false
    fields:
      - name: occurred_at
        label: Occurred at
        type: string
        required: false
  - name: conversation
    label: Conversation
    description: An exchange between people, from an interview to an informal chat.
    kind: page
    primitive: temporal
    directory: conversations/
    path_prefixes:
      - conversations/
    aliases: []
    behaviors:
      extractable: true
      expert_routing: false
    fields: []
  - name: writing
    label: Writing
    description: Something you are authoring, from an early draft to a finished piece.
    kind: page
    primitive: media
    directory: writing/
    path_prefixes:
      - writing/
    aliases:
      - draft
      - post-draft
    behaviors:
      extractable: true
      expert_routing: false
    fields: []
  - name: project
    label: Project
    description: An ongoing initiative with a purpose, context, and work to follow.
    kind: page
    primitive: concept
    directory: projects/
    path_prefixes:
      - projects/
      - project/
    aliases:
      - initiative
      - workstream
    behaviors:
      extractable: false
      expert_routing: false
    fields:
      - name: status
        label: Project status
        type: string
        required: false
        values:
          - active
          - paused
          - completed
          - cancelled
    layout:
      question: what is it for, where does it stand, what shaped it, who is involved,
        and what is due or undecided?
      sections:
        - heading: Key decisions
          guidance: "decisions that still shape the project, newest first, one bullet
            each: what was decided, who decided, when, and why. A decision a later
            one replaced drops off; its claim keeps the history."
        - heading: Milestones
          guidance: "significant outcomes and targets with their dates: launched,
            released, merged, deployed, and upcoming target dates. Not meetings,
            reviews, CI runs or interim pull-request status, and not a log of
            reports."
        - heading: People
          guidance: who leads it, who works on it and who has a stake, with each person's
            role on this project.
        - heading: Commitments and deadlines
          guidance: open commitments with owner and due date when known. A finished
            commitment moves to Milestones or drops off.
        - heading: Open questions
          guidance: unresolved decisions and risks, with who owns each.
        - heading: Related
          guidance: parent project, workstream pages and closely related pages, one line
            each.
      notes: State says where things stand. These sections hold the specifics State
        would otherwise accumulate, so a fact belongs in one place, not both. A
        workstream, component or phase of the project stays a State topic unless it
        qualifies as its own page
        ([splitting](profiles.md#the-default-is-no-change)).
