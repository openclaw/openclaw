# Adapted from gbrain-base-v2 at 7cdc3e30a; see docs/ONTOLOGY.md and THIRD_PARTY_NOTICES.md.
format: knowledge-ontology-v1
name: knowledge-default
version: 1.0.0
description: Default Knowledge ontology. Behavior flags are declarations only;
  no extraction or expert services are enabled.
extends: null
definitions:
  - name: person
    label: Person
    description: Someone you know, work with, or want to learn about.
    kind: page
    primitive: entity
    directory: people/
    path_prefixes:
      - people/
      - person/
    aliases:
      - people
      - contact
      - individual
      - founder
      - partner
      - partner-profile
    behaviors:
      extractable: false
      expert_routing: true
    fields:
      - name: role
        label: Role
        type: string
        required: false
    layout:
      question: what is their role, what are they working on, what do they believe and
        prefer, how do they relate to the user, and what is open with them?
      sections:
        - heading: What They're Building
          guidance: current projects and things shipped.
        - heading: What They Believe
          guidance: opinions, beliefs and positions, attributed.
        - heading: What Motivates Them
          guidance: ambition and career arc.
        - heading: Hobby Horses
          guidance: topics they keep returning to.
        - heading: Communication Style
          guidance: only what was observed directly or what they said about themselves;
            label each line observed, self-described or inferred. One data point is
            a source note, not a pattern.
        - heading: Assessment
          guidance: the user's assessment. Never overwrite it.
        - heading: Trajectory
          guidance: ascending, pivoting, plateauing.
        - heading: Relationship
          guidance: how they relate to the user.
        - heading: Network
          guidance: who they work with, amplify or argue with.
        - heading: Contact
          guidance: how to reach them, without email addresses or phone numbers.
        - heading: Open Threads
          guidance: commitments they made or are owed, with dates.
      notes: A preference or decision a person states goes on their page; don't turn
        it into a project or company policy.
  - name: company
    label: Company
    description: A business or organization. This broad type also includes products
      in the current vocabulary.
    kind: page
    primitive: entity
    directory: companies/
    path_prefixes:
      - companies/
      - company/
      - products/
      - orgs/
    aliases:
      - yc-company
      - product
      - org
      - people-org
      - organization
      - startup
      - business
    behaviors:
      extractable: false
      expert_routing: true
    fields: []
    layout:
      question: what does it do, how does it relate to the user's work, what is the
        state of that relationship, and who are the contacts?
      sections:
        - heading: Relationship
          guidance: how it relates to the user's work (partner, sponsor, vendor, customer,
            competitor) and the state of any agreement, with amounts and dates as
            the sources state them.
        - heading: People
          guidance: contacts and their roles.
        - heading: Engagements
          guidance: active joint work, linking each project page.
        - heading: Open Threads
          guidance: pending items, with owners and dates when known.
      notes: >-
        State covers what they do, stage and key numbers.


        Joint work with its own history belongs on its project page, linked from
        Engagements, not narrated here.
  - name: media
    label: Media
    description: Articles, books, videos, podcasts, and other content you consume.
    kind: page
    primitive: media
    directory: media/
    path_prefixes:
      - media/
      - videos/
      - articles/
      - essays/
      - books/
      - podcasts/
      - blog/
      - posts/
    aliases:
      - article
      - video
      - essay
      - book
      - podcast
      - blog-post
      - youtube-video
      - podcast-episode
    behaviors:
      extractable: true
      expert_routing: false
    fields: []
  - name: tweet
    label: Tweet
    description: A social post or thread worth keeping and referring back to.
    kind: page
    primitive: media
    directory: tweets/
    path_prefixes:
      - tweets/
      - twitter/
    aliases:
      - tweet-single
      - tweet-thread
      - tweet-bundle
      - tweet-stub
      - twitter-post
    behaviors:
      extractable: true
      expert_routing: false
    fields: []
  - name: social-digest
    label: Social Digest
    description: A collected view of social activity over a period of time.
    kind: page
    primitive: temporal
    directory: digests/social/
    path_prefixes:
      - digests/social/
    aliases:
      - social-digest-daily
      - social-digest-monthly
    behaviors:
      extractable: false
      expert_routing: false
    fields: []
  - name: analysis
    label: Analysis
    description: Research and interpretation that help you make sense of a subject.
    kind: page
    primitive: media
    directory: wiki/analysis/
    path_prefixes:
      - wiki/analysis/
      - analysis/
    aliases:
      - pricing-analysis
      - hiring-analysis
      - market-analysis
      - competitive-analysis
      - research
      - organization-research
    behaviors:
      extractable: true
      expert_routing: false
    fields: []
  - name: atom
    label: Atom
    description: A small, standalone annotation. Separate from an evidence-backed claim.
    kind: page
    primitive: annotation
    directory: atoms/
    path_prefixes:
      - atoms/
    aliases:
      - atom-extraction
      - atom-manual
      - atom-lore
      - content-atom
      - lore
    behaviors:
      extractable: false
      expert_routing: false
    fields: []
  - name: concept
    label: Concept
    description: An idea, topic, or definition you want to understand.
    kind: page
    primitive: concept
    directory: wiki/concepts/
    path_prefixes:
      - wiki/concepts/
      - wiki/concept/
    aliases:
      - concept-stub
      - definition
    behaviors:
      extractable: true
      expert_routing: false
    fields: []
    layout:
      question: what does it mean, how does it work here, what is it not, and what
        rules govern it?
      sections:
        - heading: How it works
          guidance: the mechanism or practice as it operates now.
        - heading: Distinctions
          guidance: what it is easily confused with, and the difference.
        - heading: Decisions and policies
          guidance: adopted rules that govern it, with who decided and why. A proposal is
            not a policy.
        - heading: Examples
          guidance: one or two concrete cases.
        - heading: Open questions
          guidance: what is unresolved, with who owns it.
      notes: >-
        Explain the concept as it stands, not the history of the discussions about
        it.


        A concept page never uses project headings (Key decisions, Milestones,
        People, Commitments and deadlines). A dated run of the practice (one
        release, one incident) is an event claim, or its own project page when it
        qualifies; the concept page states the rule it established.
  - name: source
    label: Source
    description: Reference material or a transcript that other knowledge draws on.
    kind: page
    primitive: media
    directory: sources/
    path_prefixes:
      - sources/
      - source/
    aliases:
      - sources/article
      - source/article
      - transcript
      - ref
    behaviors:
      extractable: true
      expert_routing: false
    fields:
      - name: source_role
        label: Source role
        type: string
        required: false
        values:
          - canonical
          - snapshot
      - name: provider
        label: Provider
        type: string
        required: false
      - name: source_key
        label: Source key
        type: string
        required: false
      - name: coverage_start
        label: Coverage start
        type: string
        required: false
      - name: coverage_end
        label: Coverage end
        type: string
        required: false
      - name: observed_at
        label: Observed at
        type: string
        required: false
      - name: source_revision
        label: Source revision
        type: string
        required: false
      - name: manifest_sha256
        label: Manifest SHA-256
        type: string
        required: false
      - name: item_count
        label: Item count
        type: number
        required: false
      - name: completeness
        label: Completeness
        type: string
        required: false
        values:
          - complete
          - partial
          - unknown
      - name: watermark
        label: Watermark
        type: string
        required: false
  - name: deal
    label: Deal
    description: An investment opportunity, agreement, or transaction in progress.
    kind: page
    primitive: temporal
    directory: deals/
    path_prefixes:
