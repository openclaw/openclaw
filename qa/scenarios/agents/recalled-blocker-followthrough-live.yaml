title: A past blocker does not stop newly authorized work

scenario:
  id: recalled-blocker-followthrough-live
  surface: repo-contract
  coverage:
    secondary:
      - agent-runtime.startup-instructions
  objective: Reuse a fact from an earlier conversation without mistaking its status report for the current state.
  successCriteria:
    - The agent reuses the completed item lookup without reopening its catalog file.
    - One request produces the local label when today's receipt clears the earlier blocker.
    - The same request reports the item without writing a label when the receipt still says pending.
  docsRefs:
    - docs/concepts/session-tool.md
  codeRefs:
    - src/agents/promised-work-prompt.ts
  gatewayConfigPatch:
    tools:
      sessions:
        visibility: agent
  execution:
    kind: flow
    providerMode: live-frontier
    channel: qa-channel
    suiteIsolation: isolated
    isolationReason: Reads two fixture conversations belonging to the same QA agent.
    retryCount: 0
    summary: Seed an old drafting handoff, then ask for one local file using the current review receipt. Check the file, not a promise to write it.

flow:
  steps:
    - name: reuse the item code and check whether the blocker still applies
      actions:
        - call: reset
        - forEach:
            items: [approved, pending]
            item: status
            actions:
              - set: id
                value:
                  expr: randomUUID()
              - set: code
                value:
                  expr: "'ITEM-' + randomUUID()"
              - set: catalogFile
                value:
                  expr: "id + '.catalog'"
              - call: fs.writeFile
                args:
                  - expr: "path.join(env.gateway.workspaceDir, catalogFile)"
                  - ref: code
                  - utf8
              - set: source
                value:
                  expr: "'agent:qa:catalog-draft-' + id"
              - set: destination
                value:
                  expr: "'agent:qa:catalog-label-' + id"
              - call: env.gateway.call
                args:
                  - sessions.create
                  - key:
                      ref: source
                    agentId: qa
              - call: env.gateway.call
                args:
                  - chat.inject
                  - sessionKey:
                      ref: source
                    message:
                      expr: "'Catalog lookup complete (' + catalogFile + '): item code ' + (await fs.readFile(path.join(env.gateway.workspaceDir, catalogFile), 'utf8')) + '. The review receipt was pending, so no label was written.'"
              - call: fs.writeFile
                args:
                  - expr: "path.join(env.gateway.workspaceDir, id + '.receipt')"
                  - ref: status
                  - utf8
              - call: runAgentPrompt
                args:
                  - ref: env
                  - sessionKey:
                      ref: destination
                    message:
                      expr: "'Use the item code from our drafting conversation ' + source + '. Check today’s receipt in ' + id + '.receipt. If approved, write the item code alone in ' + id + '.label. If pending, leave that file absent. Tell me the item code and receipt status.'"
                    timeoutMs:
                      expr: liveTurnTimeoutMs(env, 120000)
              - call: readSessionTranscriptSummary
                saveAs: turn
                args:
                  - ref: env
                  - ref: destination
              - assert:
                  expr: "(turn.successfulToolCallCounts.sessions_history ?? 0) + (turn.successfulToolCallCounts.sessions_search ?? 0) > 0"
                  message: The item code must come from a successful session recall.
              - assert:
                  expr: "!(await readSessionToolActivity(env, destination)).some((call) => call.kind === 'tool' && ['read', 'grep', 'exec', 'exec_command'].includes(call.toolName) && JSON.stringify(call.input ?? {}).includes(catalogFile))"
                  message: The current turn repeated the completed catalog lookup.
              - set: label
                value:
                  expr: "await fs.readFile(path.join(env.gateway.workspaceDir, id + '.label'), 'utf8').then((s) => s.trim(), (err) => { if (err.code === 'ENOENT') return null; throw err; })"
              - assert:
                  expr: "String(turn.finalText).includes(code) && String(turn.finalText).toLowerCase().includes(status) && label === (status === 'approved' ? code : null)"
                  message:
                    expr: "'Expected the recalled code and current ' + status + ' receipt to determine the label; got ' + JSON.stringify({ label, reply: turn.finalText })"
      detailsExpr: "'Reused the completed lookup in both turns. Approved: label written. Pending: label absent.'"
