title: Operator chat credential guidance reaches the model

scenario:
  id: operator-chat-credential-guidance
  surface: repo-contract
  coverage:
    primary:
      - agent-runtime.startup-instructions
  gatewayConfigPatch:
    tools:
      deny: [openclaw, gateway, secrets]
  objective: Verify the real agent request does not forbid an authorized key supplied in private chat when guided credential tools are unavailable.
  successCriteria:
    - A real Gateway assembles the initial model request with control tools unavailable.
    - Its model-facing safety instructions do not forbid accepting API keys in chat.
    - The instructions explicitly permit completing the user's credential task without echoing the value.
  docsRefs:
    - docs/concepts/system-prompt.md
    - docs/channels/qa-channel.md
  codeRefs:
    - src/agents/credential-safety-prompt.ts
    - src/agents/system-prompt.ts
  execution:
    kind: flow
    channel: qa-channel
    summary: Capture the real Gateway's model request through the mock provider and check its effective credential guidance.
    config:
      requiredProviderMode: mock-openai
      prompt: I'm away from my computer. Can I give you my integration API key in this private chat so you can update my OpenClaw config?

flow:
  steps:
    - name: gives the model usable private-chat credential guidance
      actions:
        - assert:
            expr: "env.providerMode === config.requiredProviderMode"
            message: Effective prompt proof requires the mock-openai request capture.
        - call: waitForGatewayHealthy
          args:
            - ref: env
            - 60000
        - call: reset
        - set: requestCursorBefore
          value:
            expr: "(await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor"
        - call: runAgentPrompt
          args:
            - ref: env
            - sessionKey: agent:qa:operator-chat-credential-guidance
              to: dm:operator-credential-guidance
              message:
                ref: config.prompt
              timeoutMs:
                expr: "liveTurnTimeoutMs(env, 60000)"
        - set: requests
          value:
            expr: "(await fetchJson(`${env.mock.baseUrl}/debug/requests?after=${requestCursorBefore}`)).filter((request) => String(request.allInputText ?? '').includes(config.prompt))"
        - assert:
            expr: "requests.length > 0 && String(requests[0].allInputText ?? '').includes('For user-requested login or pairing in a group')"
            message: Missing real model-facing credential guidance for the operator turn.
        - set: safetyInstructions
          value:
            expr: "String(requests[0].allInputText)"
        - assert:
            expr: "!safetyInstructions.includes('Never collect tokens, API keys, or passwords in chat.')"
            message: Model-facing safety guidance forbids the authorized private-chat key handoff.
        - assert:
            expr: "safetyInstructions.includes('Use or store credentials the user supplies as requested') && safetyInstructions.includes('without repeating its value')"
            message: Model-facing guidance does not permit the authorized edit and non-echoing reply.
      detailsExpr: "'modelRequestCaptured=true; credentialGuidance=permissive; nonEchoInstruction=true'"
