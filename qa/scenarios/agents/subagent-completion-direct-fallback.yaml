title: Subagent direct fallback, quiet completions, and yielded replies

scenario:
  id: subagent-completion-direct-fallback
  surface: subagents
  coverage:
    primary:
      - agent-runtime.subagent-turns-delivery
    secondary:
      - agent-runtime.subagent-turns-subagents
      - channels.qa-channel-final-reply
  objective: Prove visible unsent parent output uses direct fallback, ordinary parent silence stays quiet, and a deliberately yielded requester gets one consolidated final reply, with sanitization and restart safety.
  gatewayConfigPatch:
    tools:
      alsoAllow:
        - message
    agents:
      entries:
        qa:
          tools:
            alsoAllow:
              - message
  successCriteria:
    - Visible but unsent parent completions trigger exact-once direct fallback with protected internal metadata stripped.
    - Exact worker NO_REPLY stays private while a non-yielded parent explicitly reports missing child output visibly exactly once.
    - An ordinary empty parent completion stays quiet after the requester has already received its parent acknowledgement.
    - A deliberately yielded requester receives one consolidated parent reply after silent or empty settlement output, with tools disabled during recovery and no direct child-result fallback.
    - Gateway restart does not replay prior terminal payloads or synthesize interruption notices for already-settled handoffs, and a post-restart direct fallback is delivered exactly once.
    - A private parent consumes a child-only nonce and media reference, spawns a second child with messaging denied, records its reviewed outcome internally, and does not send or replay either result on the channel.
  docsRefs:
    - docs/tools/subagents.md
    - docs/help/testing.md
    - docs/channels/qa-channel.md
  codeRefs:
    - extensions/qa-lab/src/execution-identity-storage-inspection.ts
    - src/agents/agent-run-terminal-reply.ts
    - src/agents/subagents/announce/subagent-announce-delivery.ts
    - src/agents/subagents/registry/subagent-registry-lifecycle.ts
    - extensions/qa-lab/src/providers/mock-openai/server.ts
  execution:
    kind: flow
    providerMode: mock-openai
    retryCount: 0
    summary: Exercise terminal-reply dispositions through mock provider, ephemeral Gateway, native subagent state, and qa-channel capture.
    config:
      requiredProviderMode: mock-openai
      cases:
        - name: visible
          mode: fallback
          marker: QA-SUBAGENT-TERMINAL-VISIBLE-OK
          expectedSendCount: 1
          expectedFallbackReceiptCount: 1
          expectedMessageCount: 0
        - name: silent
          mode: fallback
          marker: QA-SUBAGENT-TERMINAL-SILENT-REPRESENTED
          expectedSendCount: 1
          expectedFallbackReceiptCount: 0
          expectedMessageCount: 1
        - name: fallback
          mode: fallback
          marker: QA-SUBAGENT-TERMINAL-FALLBACK-OK
          expectedSendCount: 1
          expectedFallbackReceiptCount: 1
          expectedMessageCount: 0
        - name: visible
          mode: quiet
          marker: QA-SUBAGENT-TERMINAL-VISIBLE-OK
          expectedSendCount: 0
          expectedFallbackReceiptCount: 0
          expectedMessageCount: 0
        - name: silent
          mode: yielded
          marker: "Reviewed worker result: QA-SUBAGENT-TERMINAL-SILENT-REPRESENTED"
          expectedSendCount: 1
          expectedFallbackReceiptCount: 0
          expectedMessageCount: 0
        - name: fallback
          mode: yielded
          marker: "Reviewed worker result: QA-SUBAGENT-TERMINAL-FALLBACK-OK"
          expectedSendCount: 1
          expectedFallbackReceiptCount: 0
          expectedMessageCount: 0
      restartMarker: QA-SUBAGENT-TERMINAL-RESTART-OK
      settledToolRetryNeedle: "Do not repeat completed tool calls or restart from scratch. Do not call tools in this step."
      metadataSentinel: QA-SUBAGENT-TERMINAL-INTERNAL-MUST-NOT-LEAK
      parentAcknowledgment: Worker started.
      parentProgressTexts:
        - "<b>Working</b>"
        - "<b>Working</b>\nSub-agent: running"
        - "<b>Working</b>\nLast activity: Sub-agent"

flow:
  steps:
    - name: proves terminal-reply channel behavior including restart recovery
      actions:
        - set: publishTerminalDiagnostic
          value:
            lambda:
              params: [artifact]
              async: true
              expr: |
                (async () => {
                  const { publishQaSuiteArtifactFiles } = await qaImport('./suite-artifacts.js');
                  const { redactQaGatewayDebugText } = await qaImport('./gateway-log-redaction.js');
                  const filePath = path.join(env.outputDir, 'subagent-terminal-diagnostic.json');
                  const content = redactQaGatewayDebugText(JSON.stringify(artifact));
                  await publishQaSuiteArtifactFiles({ outputDir: env.outputDir, files: [{ filePath, content }] });
                  if (await fs.readFile(filePath, 'utf8') !== content) throw new Error('Terminal diagnostic readback mismatch');
                  return { artifact: path.basename(filePath), captureStage: artifact.captureStage };
                })()
        - set: snapshotTerminalRequests
          value:
            lambda:
              params: [requests]
              expr: |
                requests.map(request => {
                  const bounded = (value, limit) => {
                    const json = JSON.stringify(value);
                    return json === undefined ? null : json.length > limit ? { omitted: true, serializedCharacters: json.length } : value;
                  };
                  return {
                    cursor: request.cursor, sessionId: request.sessionId, body: bounded(request.body, 262144),
                    prompt: bounded(request.prompt, 32768), toolOutput: bounded(request.toolOutput, 32768),
                    requestKind: request.requestKind, outcome: request.outcome, errorCode: request.errorCode,
                    plannedToolName: request.plannedToolName, plannedWireToolName: request.plannedWireToolName,
                    plannedToolArgs: bounded(request.plannedToolArgs, 32768), plannedToolCallId: request.plannedToolCallId,
                    plannedToolItemId: request.plannedToolItemId, toolOutputCallId: request.toolOutputCallId
                  };
                })
        - set: diagnosticPreflight
          value:
            expr: "await publishTerminalDiagnostic({ captureStage: 'preflight', scenarioId: 'subagent-completion-direct-fallback' })"
        - set: activePhase
          value: bootstrap
        - set: suiteRequestCursor
          value:
            expr: "(await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor"
        - set: activeRequestCursor
          value:
            ref: suiteRequestCursor
        - set: suiteEventCursor
          value:
            expr: state.getSnapshot().cursor
        - try:
            actions:
              - assert:
                  expr: "env.providerMode === config.requiredProviderMode"
                  message:
                    expr: "`expected provider mode ${config.requiredProviderMode}, got ${env.providerMode}`"
              - call: waitForGatewayHealthy
                args:
                  - ref: env
                  - 120000
              - call: waitForQaChannelReady
                args:
                  - ref: env
                  - 120000
              - set: verdicts
                value:
                  expr: "[]"
              - set: completionProofs
                value:
                  expr: "[]"
              # The native subagent owner records terminal execution and delivery.
              # Read isolated fixture facts; public history and channel captures prove delivery.
              - set: readSettledTerminalRun
                value:
                  lambda:
                    params:
                      - caseName
                      - priorRunIds
                    async: true
                    expr: "(await readNativeQaSubagentRuns(env)).find((run) => !(priorRunIds ?? []).includes(run.runId) && run.label === `qa-terminal-${caseName}` && run.execution.status === 'terminal' && run.execution.outcome?.status === 'ok' && run.delivery?.status === 'delivered')"
              # Direct fallback must record the exact child's native receipt; quiet and
              # yielded controls must not use that path even when output text looks similar.
              - set: readDirectFallbackReceipts
                value:
                  lambda:
                    params:
                      - run
                    async: true
                    expr: "(await env.gateway.call('chat.history', { agentId: 'qa', sessionKey: run.requesterSessionKey, limit: 100, maxChars: 20000 }, { timeoutMs: 10000 })).messages?.filter((message) => message.role === 'assistant' && message.provider === 'openclaw' && message.model === 'automation-result' && String(message.__openclaw?.idempotencyKey ?? '').startsWith(`outbound-delivery:announce:v1:${run.childSessionKey}:${run.runId}:text-direct:`)) ?? []"
              - forEach:
                  items:
                    expr: config.cases
                  item: terminalCase
                  actions:
                    - set: activePhase
                      value:
                        expr: "`public:${terminalCase.mode}:${terminalCase.name}`"
                    - set: startIndex
                      value:
                        expr: state.getSnapshot().messages.length
                    - set: requestCursor
                      value:
                        expr: "env.mock ? (await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor : 0"
                    - set: activeRequestCursor
                      value:
                        ref: requestCursor
                    - set: priorCaseRunIds
                      value:
                        expr: "(await readNativeQaSubagentRuns(env)).map((run) => run.runId)"
                    - set: conversationId
                      value:
                        expr: "`terminal-${terminalCase.mode}-${terminalCase.name}-${randomUUID().slice(0, 8)}`"
                    - sendInbound:
                        accountId: default
                        conversation:
                          id:
                            ref: conversationId
                          kind: direct
                        senderId:
                          ref: conversationId
                        senderName: QA Terminal Reply Operator
                        text:
                          expr: "`Subagent terminal reply QA check: ${terminalCase.name}. Spawn one native worker, then ${(terminalCase.mode === 'yielded') ? 'yield until the worker finishes' : 'finish the parent turn without waiting'}. ${terminalCase.mode === 'quiet' ? 'Keep ordinary completion quiet. ' : ''}Do not use ACP.`"
                    # Visible unsent parent text requires direct fallback; ordinary silence
                    # stays quiet. Each non-yielded control must also observe its initial ACK.
                    - call: waitForCondition
                      saveAs: terminalRun
                      args:
                        - lambda:
                            async: true
                            expr: |
                              (async () => {
                                await env.mock?.terminalRequesters?.settle(env.gateway);
                                const run = await readSettledTerminalRun(terminalCase.name, priorCaseRunIds);
                                if (!run) return undefined;
                                if (terminalCase.expectedFallbackReceiptCount > 0 && (await readDirectFallbackReceipts(run)).length === 0) return undefined;
                                const outbound = state.getSnapshot().messages.slice(startIndex).filter((candidate) => candidate.direction === 'outbound' && candidate.conversation.id === conversationId);
                                if (!(terminalCase.mode === 'yielded') && !outbound.some((candidate) => !candidate.deleted && String(candidate.text ?? '').trim() === config.parentAcknowledgment)) return undefined;
                                const matchingCount = outbound.filter((candidate) => String(candidate.text ?? '').trim() === terminalCase.marker).length;
                                return terminalCase.expectedSendCount === 0 || matchingCount >= terminalCase.expectedSendCount ? run : undefined;
                              })().catch(() => undefined)
                        - 60000
                        - 250
                    - set: caseOutbound
                      value:
                        expr: "state.getSnapshot().messages.slice(startIndex).filter((candidate) => candidate.direction === 'outbound' && candidate.conversation.id === conversationId)"
                    - set: matchingOutbound
                      value:
                        expr: "caseOutbound.filter((candidate) => String(candidate.text ?? '').trim() === terminalCase.marker)"
                    - set: caseRequests
                      value:
                        expr: "env.mock ? await fetchJson(`${env.mock.baseUrl}/debug/requests?after=${requestCursor}`) : []"
                    - set: publicDiagnosticCheckpoint
                      value:
                        expr: "await publishTerminalDiagnostic({ captureStage: 'public-case-observed', activePhase, requestCursor, requestCount: caseRequests.length, requests: snapshotTerminalRequests(caseRequests.slice(0, 4)), omittedRequestCount: Math.max(0, caseRequests.length - 4) })"
                    - set: directFallbackReceipts
                      value:
                        expr: "await readDirectFallbackReceipts(terminalRun)"
                    - assert:
                        expr: "directFallbackReceipts.length === terminalCase.expectedFallbackReceiptCount && directFallbackReceipts.every((message) => message.content.filter((block) => block.type === 'text').map((block) => block.text).join('') === terminalCase.marker)"
                        message:
                          expr: "`terminal ${terminalCase.name}: unexpected direct-fallback receipt: ${JSON.stringify(directFallbackReceipts)}`"
                    - assert:
                        expr: "caseOutbound.filter((message) => !message.deleted && String(message.text ?? '').trim() === config.parentAcknowledgment).length === ((terminalCase.mode === 'yielded') ? 0 : 1)"
                        message:
                          expr: "`terminal ${terminalCase.name}: spawning parent did not acknowledge its completed turn`"
                    - set: appendDirectFallbackProof
                      value:
                        expr: "completionProofs.push({ case: terminalCase.name, mode: terminalCase.mode, runId: terminalRun.runId, receiptKeys: directFallbackReceipts.map((message) => message.__openclaw.idempotencyKey) })"
                    - assert:
                        expr: "matchingOutbound.length === terminalCase.expectedSendCount"
                        message:
                          expr: "`terminal ${terminalCase.name}: expected ${terminalCase.expectedSendCount} outbound, got ${matchingOutbound.length}; messages=${JSON.stringify(state.getSnapshot().messages.slice(-10))} requests=${JSON.stringify(caseRequests)} logs=${JSON.stringify((env.gateway.logs?.().split('\\n') ?? []).filter((line) => /qa-channel|subagent|announce|completion|requester/i.test(line)).slice(-30))}`"
                    - assert:
                        expr: "caseOutbound.filter((candidate) => !candidate.deleted && String(candidate.text ?? '').trim()).every((candidate) => ((terminalCase.mode !== 'yielded' && String(candidate.text ?? '').trim() === config.parentAcknowledgment) || (terminalCase.expectedSendCount > 0 && String(candidate.text ?? '').trim() === terminalCase.marker)) || (transport.id === 'crabline' && transport.requiredPluginIds.includes('telegram') && config.parentProgressTexts.includes(String(candidate.text ?? '').trim())))"
                        message:
                          expr: "`terminal ${terminalCase.name}: unexpected completion text or raw child output; outbound=${recentOutboundSummary(state)}`"
                    - assert:
                        expr: "caseOutbound.every((candidate) => !String(candidate.text ?? '').includes(config.metadataSentinel) && !String(candidate.text ?? '').includes('BEGIN_OPENCLAW_INTERNAL_CONTEXT'))"
                        message:
                          expr: "`terminal ${terminalCase.name}: protected internal metadata leaked; outbound=${recentOutboundSummary(state)}`"
                    - assert:
                        expr: "caseOutbound.every((candidate) => String(candidate.text ?? '').trim() !== 'NO_REPLY')"
                        message:
                          expr: "`terminal ${terminalCase.name}: exact silence token leaked to the channel; outbound=${recentOutboundSummary(state)}`"
                    - assert:
                        expr: "caseOutbound.every((candidate) => !String(candidate.text ?? '').includes(`Agent couldn't generate a response`))"
                        message:
                          expr: "`terminal ${terminalCase.name}: unexpected failure diagnostic; outbound=${recentOutboundSummary(state)}`"
                    - assert:
                        expr: "caseOutbound.every((candidate) => !String(candidate.text ?? '').includes(`Yield:`))"
                        message:
                          expr: "`terminal ${terminalCase.name}: yield raced child completion; outbound=${recentOutboundSummary(state)}`"
                    - set: parentRequests
                      value:
                        expr: "caseRequests.filter((request) => request.sessionId === caseRequests.find((candidate) => candidate.plannedToolName === 'sessions_spawn' && candidate.plannedToolArgs?.label === `qa-terminal-${terminalCase.name}`)?.sessionId)"
                    - set: parentFinalizationRequests
                      value:
                        expr: "parentRequests.filter((request) => String(request.prompt ?? '').includes(config.settledToolRetryNeedle))"
                    - assert:
                        expr: "parentFinalizationRequests.length === ((terminalCase.mode === 'yielded') ? 1 : 0) && parentFinalizationRequests.every((request) => !Array.isArray(request.body?.tools) || request.body.tools.length === 0)"
                        message:
                          expr: "`terminal ${terminalCase.name}: incorrect tool-free requester finalization: ${JSON.stringify(parentFinalizationRequests)}`"
                    - assert:
                        expr: "caseRequests.filter((request) => request.plannedToolName === 'sessions_spawn' && request.plannedToolArgs?.label === `qa-terminal-${terminalCase.name}`).length === 1"
                        message:
                          expr: "`terminal ${terminalCase.name}: sessions_spawn not observed; requests=${JSON.stringify(caseRequests)}`"
                    - assert:
                        expr: "caseRequests.filter((request) => request.plannedToolName === 'sessions_yield').length === ((terminalCase.mode === 'yielded') ? 1 : 0) && caseRequests.filter((request) => request.plannedToolName === 'message').length === terminalCase.expectedMessageCount"
                        message:
                          expr: "`terminal ${terminalCase.name}: parent did not preserve its deliberate yield or repeated delivery work; requests=${JSON.stringify(caseRequests)}`"
                    - assert:
                        expr: "terminalRun.label === `qa-terminal-${terminalCase.name}` && terminalRun.execution.status === 'terminal' && terminalRun.execution.outcome?.status === 'ok' && terminalRun.delivery?.status === 'delivered'"
                        message:
                          expr: "`terminal ${terminalCase.name}: native lifecycle did not settle authoritatively; run=${JSON.stringify(terminalRun)}`"
                    - set: appendVerdict
                      value:
                        expr: "verdicts.push({ case: terminalCase.name, conversationId, runId: terminalRun.runId, deliveryStatus: terminalRun.delivery?.status, inputDisposition: terminalCase.name, representation: (terminalCase.mode === 'yielded') ? 'consolidated parent final after tool-free recovery' : terminalCase.mode === 'quiet' ? 'quiet ordinary completion' : 'visible-unsent parent completion fallback or explicit report', restart: false, mode: terminalCase.mode, parentFinalizationCount: parentFinalizationRequests.length, expectedTerminalSendCount: terminalCase.expectedSendCount, actualTerminalSendCount: matchingOutbound.length, capturedTerminalPayloads: matchingOutbound.map((message) => String(message.text ?? '')), auxiliaryChannelEvents: caseOutbound.filter((message) => !matchingOutbound.includes(message)).map((message) => String(message.text ?? '')), silenceTokenLeaked: caseOutbound.some((message) => String(message.text ?? '').trim() === 'NO_REPLY'), internalMetadataLeak: caseOutbound.some((message) => String(message.text ?? '').includes(config.metadataSentinel)), pass: true })"
              # Denying outbound messaging must not disable the parent's orchestration tools.
              - set: activePhase
                value: private-config
              - call: patchConfig
                args:
                  - env:
                      ref: env
                    patch:
                      expr: "({ tools: { deny: ['message'] }, agents: { entries: { qa: { tools: { deny: ['message'] } } } } })"
              - call: waitForGatewayHealthy
                args:
                  - ref: env
                  - 180000
              - call: waitForQaChannelReady
                args:
                  - ref: env
                  - 180000
              # Earlier public controls share this parent session. Scope tool receipts
              # to the private ingress so their intentional message sends stay outside it.
              - set: privateParentSessionKey
                value:
                  expr: "(await readSettledTerminalRun(config.cases[config.cases.length - 1].name)).requesterSessionKey"
              - call: readSessionTranscriptSummary
                saveAs: privateTranscriptBefore
                args:
                  - ref: env
                  - ref: privateParentSessionKey
              - set: privateTelegramWire
                value:
                  expr: "transport.id === 'crabline' && transport.requiredPluginIds.includes('telegram')"
              - set: readTelegramWire
                value:
                  lambda:
                    async: true
                    expr: "privateTelegramWire ? (await fs.readFile(path.join(env.outputDir, 'artifacts/crabline/telegram-provider-server.jsonl'), 'utf8')).split('\\n').slice(0, -1).filter(Boolean).map((line) => JSON.parse(line)) : []"
              - set: privateWireCursor
                value:
                  expr: "(await readTelegramWire()).length"
              - set: privateStartIndex
                value:
                  expr: state.getSnapshot().messages.length
              - set: privateEventCursor
                value:
                  expr: state.getSnapshot().cursor
              - call: fs.writeFile
                args:
                  - expr: "path.join(env.gateway.workspaceDir, 'qa-private-result.png')"
                  - expr: imageUnderstandingValidPngBase64
                  - base64
              - set: privateRequestCursor
                value:
                  expr: "(await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor"
              - set: activePhase
                value: private
              - set: activeRequestCursor
                value:
                  ref: privateRequestCursor
              - set: privateConversationId
                value:
                  expr: "`terminal-private-${randomUUID().slice(0, 8)}`"
              - sendInbound:
                  accountId: default
                  conversation:
                    id:
                      ref: privateConversationId
                    kind: direct
                  senderId:
                    ref: privateConversationId
                  senderName: QA Private Completion Operator
                  text: "Subagent terminal reply QA check: private. Review the first child internally, use its result to start a second child, and keep both completion reports private."
                saveAs: privateIngress
              - call: waitForCondition
                saveAs: privateRuns
                args:
                  - lambda:
                      async: true
                      expr: "(async () => { await env.mock?.terminalRequesters?.settle(env.gateway); const runs = await readNativeQaSubagentRuns(env, privateParentSessionKey); const selected = ['qa-terminal-private-first', 'qa-terminal-private-second'].map((label) => runs.find((run) => run.label === label)); return selected.every((run) => run?.execution.status === 'terminal' && run.execution.outcome?.status === 'ok' && run.delivery?.status === 'delivered') ? selected : undefined; })()"
                  - 90000
                  - 250
              - set: privateRequests
                value:
                  expr: "await fetchJson(`${env.mock.baseUrl}/debug/requests?after=${privateRequestCursor}`)"
              - set: privateSpawns
                value:
                  expr: "privateRequests.filter((request) => request.outcome === 'success' && request.plannedToolName === 'sessions_spawn')"
              - assert:
                  expr: "privateSpawns.length === 2 && privateSpawns.every((request) => request.plannedToolArgs?.completionTarget === 'parent') && /QA-PARENT-PRIVATE-CHILD1-[A-F0-9]{32}/.test(privateSpawns[1].plannedToolArgs.task)"
                  message:
                    expr: "`private parent did not consume the first result to spawn exactly one second child: ${JSON.stringify(privateSpawns)}`"
              # Inspect the actual request: compatible endpoints retain runtime
              # carriers in the user role, separately from the user-authored turn.
              - set: privateCompletionProjection
                value:
                  expr: |-
                    (async () => {
                      const { normalizeResponsesInput, extractLastUserText, extractCurrentRuntimeContextTexts } = await qaImport('./providers/mock-openai/mock-openai-input.js');
                      const input = normalizeResponsesInput(privateSpawns[1].body?.input);
                      const readText = (item) => typeof item?.content === 'string' ? item.content.trim() : Array.isArray(item?.content) ? item.content.filter((part) => part.type === 'input_text' || part.type === 'text').map((part) => part.text).join('\n').trim() : '';
                      const userText = extractLastUserText(input).trim();
                      const runtimeContext = [...input.filter((item) => item.role === 'developer' || item.role === 'system').map(readText), ...extractCurrentRuntimeContextTexts(input.filter((item) => item.role === 'user'))].join('\n');
                      return { userText, runtimeContext };
                    })()
              - assert:
                  expr: "privateCompletionProjection.userText.includes('Continue the OpenClaw runtime event.') && !/QA-PARENT-PRIVATE-CHILD1-|MEDIA:/.test(privateCompletionProjection.userText) && privateCompletionProjection.runtimeContext.includes('Internal task completion event') && /MEDIA:[^\\n]*qa-private-result\\.png/.test(privateCompletionProjection.runtimeContext)"
                  message:
                    expr: "`The private completion was not split into runtime context and a generic user turn: ${JSON.stringify({ projection: privateCompletionProjection, childSessionKeys: privateRuns.map((run) => run.childSessionKey) })}`"
              - set: privateParentIds
                value:
                  expr: "privateSpawns.map((request) => request.sessionId)"
              - assert:
                  expr: "privateParentIds[0] && privateParentIds[0] === privateParentIds[1] && privateRuns[0].requesterSessionKey === privateRuns[1].requesterSessionKey && privateRuns[0].requesterSessionKey === privateParentSessionKey"
                  message: Private continuation changed its parent session.
              - call: readEffectiveTools
                saveAs: privateTools
                args:
                  - ref: env
                  - expr: privateRuns[0].requesterSessionKey
              - assert:
                  expr: "!privateTools.has('message') && privateTools.has('sessions_spawn')"
                  message: Private parent tool inventory did not preserve orchestration while denying messaging.
              - call: readSessionTranscriptSummary
                saveAs: privateTranscript
                args:
                  - ref: env
                  - expr: privateRuns[0].requesterSessionKey
                  - expr: "({ afterEventCursor: privateTranscriptBefore.eventCursor, includeCodeModeControl: true })"
              - set: privateSpawnReceipts
                value:
                  expr: "privateSpawns.map((request) => privateTranscript.successfulToolCallEvents?.find((event) => event.name === (request.plannedWireToolName ?? request.plannedToolName) && event.toolCallId === (env.runtimeId !== 'codex' && request.plannedToolItemId ? `${request.plannedToolCallId}|${request.plannedToolItemId}` : request.plannedToolCallId)))"
              - assert:
                  expr: "privateSpawnReceipts.length === 2 && privateSpawnReceipts.every(Boolean) && new Set(privateSpawnReceipts.map((event) => event.toolCallId)).size === 2 && [...new Set(privateSpawns.map((request) => request.plannedWireToolName ?? request.plannedToolName))].every((wire) => privateTranscript.successfulToolCallCounts[wire] === privateSpawnReceipts.filter((event) => event.name === wire).length) && privateSpawnReceipts[1].timestamp >= privateRuns[0].execution.endedAt && !(privateTranscript.successfulToolCallCounts.message > 0) && privateRequests.every((request) => request.plannedToolName !== 'message')"
                  message:
                    expr: "`private continuation lacks committed tool chronology or tried external messaging: runs=${JSON.stringify(privateRuns)} transcript=${JSON.stringify(privateTranscript)}`"
              - set: activePhase
                value: private-outbound-settlement
              # Native settlement precedes channel flush. qa-channel replaces the full-text
              # preview carrying tool metadata; wait for that deletion plus its final.
              # Crabline's state contains sends only, so Telegram's raw recorder owns
              # supplementary wire checks without a per-message retirement claim.
              - call: waitForCondition
                args:
                  - lambda:
                      expr: "(() => { const messages = state.getSnapshot().messages.slice(privateStartIndex).filter((message) => message.direction === 'outbound'); const acknowledgments = messages.filter((message) => !message.deleted && message.conversation.id === privateConversationId && String(message.text ?? '').trim() === config.parentAcknowledgment); return messages.length === 2 && acknowledgments.length === 1 && (privateTelegramWire || messages.filter((message) => message.deleted).length === 1) ? messages : undefined; })()"
                  - 60000
                  - 250
              - set: privateOutbound
                value:
                  expr: "state.getSnapshot().messages.slice(privateStartIndex).filter((message) => message.direction === 'outbound')"
              - set: privateAcknowledgments
                value:
                  expr: "privateOutbound.filter((message) => !message.deleted && String(message.text ?? '').trim() === config.parentAcknowledgment)"
              - set: isPrivateKickoffText
                value:
                  lambda:
                    params:
                      - text
                    # Only the required ingress turn's public spawn status is visible;
                    # private child labels, result prose, and media remain forbidden.
                    expr: "config.parentAcknowledgment.startsWith(String(text ?? '').trim()) || (privateTelegramWire && ['<b>Working</b>', '<b>Working</b>\\nSub-agent: running', '<b>Working</b>\\nLast activity: Sub-agent'].includes(String(text ?? '').trim()))"
              - assert:
                  expr: "privateIngress.id && privateOutbound.length === 2 && privateAcknowledgments.length === 1 && privateOutbound.every((message) => message.conversation.id === privateConversationId && (privateTelegramWire || message.replyToId === privateIngress.id) && (message.attachments?.length ?? 0) === 0 && isPrivateKickoffText(message.text))"
                  message:
                    expr: "`private completion emitted unexpected text or media on a channel: ${JSON.stringify(privateOutbound)}`"
              # The qa-channel history retains even subsequently edited/deleted payloads.
              - set: privateOutboundEvents
                value:
                  expr: "state.getSnapshot().events.filter((event) => event.cursor > privateEventCursor && ['outbound-message', 'message-edited', 'message-deleted'].includes(event.kind) && event.message?.direction === 'outbound')"
              - assert:
                  expr: "privateOutboundEvents.filter((event) => event.kind === 'outbound-message').length === privateOutbound.length && privateOutboundEvents.every((event) => privateOutbound.some((message) => message.id === event.message.id) && event.message.conversation.id === privateConversationId && (privateTelegramWire || event.message.replyToId === privateIngress.id) && (event.message.attachments?.length ?? 0) === 0 && isPrivateKickoffText(event.message.text))"
                  message:
                    expr: "`private completion leaked a transient text or media payload: ${JSON.stringify(privateOutboundEvents)}`"
              - set: privateWirePayloads
                value:
                  expr: "(await readTelegramWire()).slice(privateWireCursor).filter((event) => event.type === 'api' && /\\/(?:send|editMessage|copyMessage|forwardMessage)[A-Za-z]*$/.test(event.path ?? '') && !event.path.endsWith('/sendChatAction'))"
              - assert:
                  expr: "!privateTelegramWire || (privateWirePayloads.filter((event) => event.path.endsWith('/sendMessage')).length === 2 && privateWirePayloads.every((event) => event.accepted === true && /\\/(?:sendMessage|editMessageText)$/.test(event.path) && String(event.body?.chat_id) === String(transport.buildAgentDelivery({ target: `dm:${privateConversationId}` }).to) && isPrivateKickoffText(event.body?.text) && !/QA-PARENT-PRIVATE-CHILD1-|QA-PARENT-PRIVATE-CHILD2-DONE|qa-private-result\\.png|NO_REPLY/.test(JSON.stringify(event.body))))"
                  message: Telegram wire capture contained private text, media, or another message target.
              - forEach:
                  items:
                    ref: privateRuns
                  item: privateRun
                  actions:
                    - set: privateFallbackReceipts
                      value:
                        expr: "await readDirectFallbackReceipts(privateRun)"
                    - assert:
                        expr: "privateFallbackReceipts.length === 0"
                        message: Private result reached the direct channel fallback.
              - set: appendPrivateVerdict
                value:
                  expr: "verdicts.push({ case: 'private', conversationId: privateConversationId, runIds: privateRuns.map((run) => run.runId), deliveryStatus: 'delivered', privateSpawnReceiptCount: privateSpawnReceipts.length, messageToolDenied: !privateTools.has('message'), mediaReferenceConsumed: true, outboundAttachmentCount: privateOutboundEvents.reduce((count, event) => count + (event.message.attachments?.length ?? 0), 0), expectedTerminalSendCount: 0, actualTerminalSendCount: privateAcknowledgments.length - 1, kickoffTransportSendCount: privateOutbound.length, previewRetirementVerified: !privateTelegramWire, capturedTerminalPayloads: [], pass: true })"
              # Every prior run is now terminal and delivery-settled, so restart from
              # the lifecycle boundary rather than waiting an arbitrary grace period.
              - set: preRestartOutbound
                value:
                  expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound' && verdicts.some((verdict) => verdict.conversationId === message.conversation.id)).map((message) => ({ id: message.id, conversationId: message.conversation.id, text: String(message.text ?? '') }))"
              - set: preRestartTerminalPayloads
                value:
                  expr: "preRestartOutbound.filter((message) => verdicts.some((verdict) => verdict.capturedTerminalPayloads.includes(message.text)))"
              - set: activePhase
                value: restart-config
              - set: restartPatch
                value:
                  expr: "({ tools: { deny: [] }, agents: { entries: { qa: { tools: { deny: [] } } } }, gateway: { controlUi: { allowedOrigins: [`http://127.0.0.1:${64000 + Math.floor(Math.random() * 999)}`] } } })"
              - call: patchConfig
                args:
                  - env:
                      ref: env
                    patch:
                      ref: restartPatch
                    replacePaths:
                      - tools.deny
                      - agents.entries.qa.tools.deny
                      - gateway.controlUi.allowedOrigins
              - call: env.gateway.restart
              - call: waitForGatewayHealthy
                args:
                  - ref: env
                  - 180000
              - call: waitForQaChannelReady
                args:
                  - ref: env
                  - 180000
              - set: restartStartIndex
                value:
                  expr: state.getSnapshot().messages.length
              - set: restartConversationId
                value:
                  expr: "`terminal-restart-${randomUUID().slice(0, 8)}`"
              - set: restartRequestCursor
                value:
                  expr: "(await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor"
              - set: activePhase
                value: restart
              - set: activeRequestCursor
                value:
                  ref: restartRequestCursor
              - sendInbound:
                  accountId: default
                  conversation:
                    id:
                      ref: restartConversationId
                    kind: direct
                  senderId:
                    ref: restartConversationId
                  senderName: QA Restart Operator
                  text: "Subagent terminal reply QA check: restart. Spawn one native worker, then finish the parent turn without waiting. Do not use ACP."
              - call: waitForCondition
                saveAs: restartRun
                args:
                  - lambda:
                      async: true
                      expr: "(async () => { await env.mock?.terminalRequesters?.settle(env.gateway); const run = await readSettledTerminalRun('restart'); if (!run || (await readDirectFallbackReceipts(run)).length === 0) return undefined; const delivered = state.getSnapshot().messages.slice(restartStartIndex).some((candidate) => candidate.direction === 'outbound' && candidate.conversation.id === restartConversationId && String(candidate.text ?? '').trim() === config.restartMarker); return delivered ? run : undefined; })().catch(() => undefined)"
                  - 60000
                  - 250
              - set: restartMatches
                value:
                  expr: "state.getSnapshot().messages.slice(restartStartIndex).filter((candidate) => candidate.direction === 'outbound' && candidate.conversation.id === restartConversationId && String(candidate.text ?? '').trim() === config.restartMarker)"
              - set: restartRequests
                value:
                  expr: "await fetchJson(`${env.mock.baseUrl}/debug/requests?after=${restartRequestCursor}`)"
              - set: restartParentFinalizationRequests
                value:
                  expr: "restartRequests.filter((request) => request.sessionId === restartRequests.find((candidate) => candidate.plannedToolName === 'sessions_spawn')?.sessionId && String(request.prompt ?? '').includes(config.settledToolRetryNeedle))"
              - assert:
                  expr: "restartRequests.filter((request) => request.plannedToolName === 'sessions_spawn').length === 1 && restartRequests.filter((request) => request.plannedToolName === 'sessions_yield').length === 0 && !restartRequests.some((request) => request.plannedToolName === 'message') && restartParentFinalizationRequests.length === 0"
                  message:
                    expr: "`restart completion repeated work or used yielded recovery instead of direct fallback: ${JSON.stringify(restartRequests)}`"
              - set: restartFallbackReceipts
                value:
                  expr: "await readDirectFallbackReceipts(restartRun)"
              - assert:
                  expr: "restartFallbackReceipts.length === 1 && restartFallbackReceipts[0].content.filter((block) => block.type === 'text').map((block) => block.text).join('') === config.restartMarker"
                  message:
                    expr: "`restart completion did not use its exact direct-fallback owner: ${JSON.stringify(restartFallbackReceipts)}`"
              - set: appendRestartFallbackProof
                value:
                  expr: "completionProofs.push({ case: 'restart', runId: restartRun.runId, receiptKeys: restartFallbackReceipts.map((message) => message.__openclaw.idempotencyKey) })"
              - assert:
                  expr: "restartMatches.length === 1"
                  message:
                    expr: "`restart completion expected exactly one outbound, got ${restartMatches.length}; outbound=${recentOutboundSummary(state)}`"
              - assert:
                  expr: "state.getSnapshot().messages.slice(restartStartIndex).filter((candidate) => candidate.direction === 'outbound' && candidate.conversation.id === restartConversationId).every((candidate) => !String(candidate.text ?? '').includes(`Agent couldn't generate a response`))"
                  message:
                    expr: "`restart completion produced a failure diagnostic: outbound=${recentOutboundSummary(state)}`"
              - assert:
                  expr: "restartRun.label === 'qa-terminal-restart' && restartRun.execution.status === 'terminal' && restartRun.execution.outcome?.status === 'ok' && restartRun.delivery?.status === 'delivered'"
                  message:
                    expr: "`restart completion native lifecycle did not settle authoritatively; run=${JSON.stringify(restartRun)}`"
              # Use a new durably delivered run as the observation boundary. By then,
              # restart recovery must not have replayed or invented output for settled runs.
              - set: postRestartOutbound
                value:
                  expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound' && verdicts.some((verdict) => verdict.conversationId === message.conversation.id)).map((message) => ({ id: message.id, conversationId: message.conversation.id, text: String(message.text ?? '') }))"
              - set: postRestartTerminalPayloads
                value:
                  expr: "postRestartOutbound.filter((message) => verdicts.some((verdict) => verdict.capturedTerminalPayloads.includes(message.text)))"
              - set: postRestartUnexpectedPayloads
                value:
                  expr: "postRestartOutbound.filter((message) => !preRestartOutbound.some((before) => before.id === message.id))"
              - assert:
                  expr: "JSON.stringify(postRestartTerminalPayloads) === JSON.stringify(preRestartTerminalPayloads)"
                  message:
                    expr: "`Gateway restart replayed or lost a prior terminal payload: before=${JSON.stringify(preRestartTerminalPayloads)} after=${JSON.stringify(postRestartTerminalPayloads)}`"
              - assert:
                  expr: "postRestartUnexpectedPayloads.length === 0"
                  message:
                    expr: "`Gateway restart synthesized output for already-settled handoffs: ${JSON.stringify(postRestartUnexpectedPayloads)}`"
              - set: privatePostRestartWire
                value:
                  expr: "(await readTelegramWire()).slice(privateWireCursor).filter((event) => event.type === 'api' && /\\/(?:send|editMessage|copyMessage|forwardMessage)[A-Za-z]*$/.test(event.path ?? '') && !event.path.endsWith('/sendChatAction'))"
              - assert:
                  expr: "privatePostRestartWire.every((event) => /\\/(?:sendMessage|editMessageText)$/.test(event.path) && !/QA-PARENT-PRIVATE-CHILD1-|QA-PARENT-PRIVATE-CHILD2-DONE|qa-private-result\\.png|NO_REPLY/.test(JSON.stringify(event.body)))"
                  message: Telegram replayed private text or media after restart.
              - set: privatePostRestartEvents
                value:
                  expr: "state.getSnapshot().events.filter((event) => event.cursor > privateEventCursor && ['outbound-message', 'message-edited', 'message-deleted'].includes(event.kind) && event.message?.direction === 'outbound')"
              - assert:
                  expr: "privatePostRestartEvents.every((event) => (event.message.attachments?.length ?? 0) === 0 && !/QA-PARENT-PRIVATE-CHILD1-|QA-PARENT-PRIVATE-CHILD2-DONE|qa-private-result\\.png|NO_REPLY/.test(JSON.stringify(event.message)))"
                  message:
                    expr: "`Gateway restart exposed a private result on a channel: ${JSON.stringify(privatePostRestartEvents)}`"
              - set: appendRestartVerdict
                value:
                  expr: "verdicts.push({ case: 'restart', conversationId: restartConversationId, runId: restartRun.runId, deliveryStatus: restartRun.delivery?.status, inputDisposition: 'visible-unsent-parent', restart: true, mode: 'fallback', preRestartTerminalMessageCount: preRestartTerminalPayloads.length, postRestartTerminalPayloadCount: postRestartTerminalPayloads.length, priorTerminalPayloadReplayCount: postRestartTerminalPayloads.length - preRestartTerminalPayloads.length, unexpectedPostRestartPayloadCount: postRestartUnexpectedPayloads.length, unexpectedPostRestartPayloads: postRestartUnexpectedPayloads.map((message) => message.text), expectedTerminalSendCount: 1, actualTerminalSendCount: restartMatches.length, capturedTerminalPayloads: restartMatches.map((message) => String(message.text ?? '')), silenceTokenLeaked: false, internalMetadataLeak: false, pass: true })"
              - assert:
                  expr: "verdicts.length === 8 && verdicts.every((verdict) => verdict.pass === true)"
                  message:
                    expr: "`terminal reply verdict matrix incomplete: ${JSON.stringify(verdicts)}`"
            catchAs: terminalFlowError
            catch:
              - set: rethrowTerminalFailure
                value:
                  expr: "(() => { throw new Error(`[${activePhase}] ${terminalFlowError instanceof Error ? terminalFlowError.message : String(terminalFlowError)}`, { cause: terminalFlowError }); })()"
            finally:
              - set: terminalDiagnostics
                value:
                  expr: |
                    (async () => {
                      // Keep the first completion, current phase, and latest request even if a fixture loops.
                      const bounded = (value, limit) => {
                        const json = JSON.stringify(value);
                        return json === undefined ? null : json.length > limit ? { omitted: true, serializedCharacters: json.length } : value;
                      };
                      const [requests, runList] = await Promise.all([
                        fetchJson(`${env.mock.baseUrl}/debug/requests?after=${suiteRequestCursor}`),
                        readNativeQaSubagentRuns(env).then(runs => ({ runs })).catch(error => ({ runs: [], captureError: String(error) }))
                      ]);
                      const phaseRequests = requests.filter(request => request.cursor > activeRequestCursor);
                      const selectedRequests = [...new Map([...requests.slice(0, 4), ...phaseRequests.slice(0, 8), ...requests.slice(-2)].map(request => [request.cursor, request])).values()];
                      const selected = snapshotTerminalRequests(selectedRequests);
                      const runs = (runList.runs ?? []).slice(0, 20).map(run => ({
                        runId: run.runId, label: run.label, execution: run.execution, delivery: run.delivery,
                        childSessionKey: run.childSessionKey
                      }));
                      const outbound = state.getSnapshot().events.filter(event => event.cursor > suiteEventCursor && ['outbound-message', 'message-edited', 'message-deleted'].includes(event.kind));
                      const artifact = { captureStage: 'final', activePhase, suiteRequestCursor, activeRequestCursor, suiteEventCursor,
                        requestCount: requests.length, omittedRequestCount: requests.length - selected.length, requests: selected,
                        runCount: runList.runs?.length ?? 0, runs, runCaptureError: runList.captureError,
                        outboundEventCount: outbound.length, outboundEvents: bounded(outbound.slice(-20), 65536),
                        failure: typeof terminalFlowError === 'undefined' ? null : String(terminalFlowError) };
                      return await publishTerminalDiagnostic(artifact);
                    })().catch(error => {
                      const primary = typeof terminalFlowError === 'undefined' ? 'scenario completed' : String(terminalFlowError);
                      throw new Error(`[${activePhase}] ${primary}; diagnostic capture failed: ${String(error)}`, { cause: error });
                    })
      detailsExpr: "JSON.stringify({ harness: 'qa-channel + qa-lab bus + ephemeral Gateway child + mock-openai', verdicts, completionProofs }, null, 2)"
