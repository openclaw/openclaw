title: Native image generation

scenario:
  id: native-image-generation
  surface: image-generation
  coverage:
    primary:
      - media.image-routing
    secondary:
      - media.image-routing-native-image-generation
  objective: Verify image_generate appears when configured, returns a real saved media artifact, and delivers it once.
  successCriteria:
    - image_generate appears in the effective tool inventory.
    - Agent triggers native image_generate.
    - Tool output returns a saved MEDIA path and the file exists.
    - The generated-media completion produces exactly one outbound channel delivery containing one PNG attachment whose bytes match the generated file.
  docsRefs:
    - docs/tools/image-generation.md
    - docs/providers/openai.md
  codeRefs:
    - src/agents/tools/image-generate-tool.ts
    - extensions/qa-lab/src/providers/mock-openai/server.ts
  execution:
    kind: flow
    summary: Verify image_generate appears when configured and returns a real saved media artifact.
    channel: qa-channel
    config:
      prompt: "Image generation check: generate a QA lighthouse image and summarize it in one short sentence."
      promptSnippet: "Image generation check"
      generatedNeedle: "QA lighthouse"

flow:
  steps:
    - name: enables image_generate and saves a real media artifact
      actions:
        - call: ensureImageGenerationConfigured
          args:
            - ref: env
        - call: createSession
          saveAs: sessionKey
          args:
            - ref: env
            - Image generation
            - agent:qa:image-generate
        - call: readEffectiveTools
          saveAs: tools
          args:
            - ref: env
            - ref: sessionKey
        - assert:
            expr: "tools.has('image_generate')"
            message: image_generate not present after imageGenerationModel patch
        - call: reset
        - set: generationStartedAt
          value:
            expr: Date.now()
        - call: runAgentPrompt
          args:
            - ref: env
            - sessionKey:
                ref: sessionKey
              message:
                expr: config.prompt
              timeoutMs:
                expr: liveTurnTimeoutMs(env, 45000)
        - call: waitForOutboundMessage
          saveAs: outbound
          args:
            - ref: state
            - lambda:
                params: [candidate]
                expr: "candidate.conversation.id === 'qa-operator'"
            - expr: liveTurnTimeoutMs(env, 45000)
        - assert:
            expr: "!env.mock || ((await fetchJson(`${env.mock.baseUrl}/debug/requests`)).find((request) => String(request.allInputText ?? '').includes(config.promptSnippet))?.plannedToolName === 'image_generate')"
            message:
              expr: "`expected image_generate, got ${String((await fetchJson(`${env.mock.baseUrl}/debug/requests`)).find((request) => String(request.allInputText ?? '').includes(config.promptSnippet))?.plannedToolName ?? '')}`"
        - call: resolveGeneratedImagePath
          saveAs: generatedPath
          args:
            - env:
                ref: env
              promptSnippet:
                expr: config.promptSnippet
              startedAtMs:
                ref: generationStartedAt
              timeoutMs: 15000
        - assert:
            expr: "typeof generatedPath === 'string' && generatedPath.length > 0"
            message: image generation did not produce a saved media path
        - call: fs.stat
          saveAs: generatedImageStat
          args:
            - ref: generatedPath
        - assert:
            expr: "generatedImageStat.isFile() && generatedImageStat.size > 0"
            message: image generation did not produce a nonempty saved media file
        - call: fs.readFile
          saveAs: generatedImageBytes
          args:
            - ref: generatedPath
        - call: sleep
          args:
            - 3000
        - set: outboundMessages
          value:
            expr: "state.getSnapshot().messages.filter((candidate) => candidate.direction === 'outbound' && candidate.conversation.id === 'qa-operator')"
        - assert:
            expr: >-
              outboundMessages.length === 1
              && Array.isArray(outboundMessages[0].attachments)
              && outboundMessages[0].attachments.length === 1
              && outboundMessages[0].attachments[0].kind === 'image'
              && outboundMessages[0].attachments[0].mimeType === 'image/png'
              && typeof outboundMessages[0].attachments[0].contentBase64 === 'string'
              && outboundMessages[0].attachments[0].contentBase64.length > 0
              && Buffer.from(outboundMessages[0].attachments[0].contentBase64, 'base64').equals(generatedImageBytes)
            message:
              expr: >-
                (async () => {
                  const classifyError = (value) => {
                    if (typeof value !== 'string' || !value.trim()) return null;
                    if (/auth|api.?key|credential|unauthori[sz]ed/i.test(value)) return 'authentication';
                    if (/timeout|network|fetch|connection|econn/i.test(value)) return 'network';
                    if (/deliver|transport|channel/i.test(value)) return 'delivery';
                    if (/tool|unavailable|not available/i.test(value)) return 'tool-availability';
                    return 'other';
                  };
                  const mockRequests = env.mock
                    ? await fetchJson(`${env.mock.baseUrl}/debug/requests`).catch(() => [])
                    : [];
                  const providerRequests = (Array.isArray(mockRequests) ? mockRequests : []).slice(-12).map((request) => ({
                    cursor: typeof request.cursor === 'number' ? request.cursor : null,
                    model: typeof request.model === 'string' ? request.model : null,
                    plannedToolName: typeof request.plannedToolName === 'string' ? request.plannedToolName : null,
                    declaredTools: [
                      ...(Array.isArray(request.body?.tools) ? request.body.tools : []),
                      ...(Array.isArray(request.body?.dynamicTools) ? request.body.dynamicTools : []),
                    ].map((tool) => typeof tool?.name === 'string' ? tool.name : null).filter(Boolean),
                    instructionMentionsImageTool: /\bimage_generate\b/i.test(String(request.instructions ?? '')),
                    isTaskCompletion: /\[Internal task completion event\]/i.test(String(request.allInputText ?? '')),
                    hasToolOutput: typeof request.toolOutput === 'string' && request.toolOutput.length > 0,
                    toolOutputStructuredError: request.toolOutputStructuredError === true,
                  }));
                  const generatedRequests = env.mock
                    ? await fetchJson(`${env.mock.baseUrl}/debug/image-generations`).catch(() => [])
                    : [];
                  const imageRequests = (Array.isArray(generatedRequests) ? generatedRequests : []).map((request) => ({
                    model: typeof request.model === 'string' ? request.model : null,
                    count: typeof request.n === 'number' ? request.n : null,
                  }));
                  const taskPayload = await runQaCli(env, ['tasks', 'list', '--json'], {
                    timeoutMs: liveTurnTimeoutMs(env, 10000),
                    json: true,
                  }).catch(() => null);
                  const imageTasks = (Array.isArray(taskPayload?.tasks) ? taskPayload.tasks : [])
                    .filter((task) => task.taskKind === 'image_generation' || String(task.sourceId ?? '').startsWith('image_generate:'))
                    .map((task) => ({
                      status: typeof task.status === 'string' ? task.status : null,
                      deliveryStatus: typeof task.deliveryStatus === 'string' ? task.deliveryStatus : null,
                      errorCategory: classifyError(task.error),
                    }));
                  const deliveries = outboundMessages.map((message) => ({
                    id: typeof message.id === 'string' ? message.id : null,
                    deleted: message.deleted === true,
                    deletedAt: typeof message.deletedAt === 'number' ? message.deletedAt : null,
                    attachmentCount: Array.isArray(message.attachments) ? message.attachments.length : 0,
                    matchesGeneratedImage: Array.isArray(message.attachments)
                      && message.attachments.some((attachment) => typeof attachment.contentBase64 === 'string'
                        && attachment.contentBase64.length > 0
                        && Buffer.from(attachment.contentBase64, 'base64').equals(generatedImageBytes)),
                    attachments: (Array.isArray(message.attachments) ? message.attachments : []).map((attachment) => ({
                      kind: typeof attachment.kind === 'string' ? attachment.kind : null,
                      mimeType: typeof attachment.mimeType === 'string' ? attachment.mimeType : null,
                      byteLength: typeof attachment.contentBase64 === 'string'
                        ? Buffer.byteLength(attachment.contentBase64, 'base64')
                        : null,
                      matchesGeneratedImage: typeof attachment.contentBase64 === 'string'
                        && attachment.contentBase64.length > 0
                        && Buffer.from(attachment.contentBase64, 'base64').equals(generatedImageBytes),
                    })),
                    category: /image generation failed/i.test(String(message.text ?? ''))
                      ? 'image-generation-failure'
                      : Array.isArray(message.attachments) && message.attachments.some((attachment) => attachment.kind === 'image')
                        ? 'generated-image-attachment'
                      : /\bMEDIA:/i.test(String(message.text ?? ''))
                        ? 'generated-media'
                        : /acknowledged/i.test(String(message.text ?? ''))
                          ? 'generic-acknowledgment'
                          : 'other',
                    hasLighthouseCaption: /lighthouse/i.test(String(message.text ?? '')),
                    hasMediaDirective: /\bMEDIA:/i.test(String(message.text ?? '')),
                  }));
                  return `expected exactly one generated-media delivery, saw ${outboundMessages.length}; artifact=${JSON.stringify({ isFile: generatedImageStat.isFile(), size: generatedImageStat.size })}; providerRequests=${JSON.stringify(providerRequests)}; imageRequests=${JSON.stringify(imageRequests)}; imageTasks=${JSON.stringify(imageTasks)}; deliveries=${JSON.stringify(deliveries)}`;
                })()
      detailsExpr: "`${outbound.text}\\nIMAGE_PATH:${generatedPath}`"
