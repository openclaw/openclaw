title: Native image generation

scenario:
  id: native-image-generation
  surface: image-generation
  coverage:
    primary:
      - media.image-routing
    secondary:
      - media.image-routing-native-image-generation
  objective: Verify image_generate appears when configured, returns a real saved media artifact, and delivers it once.
  successCriteria:
    - image_generate appears in the effective tool inventory.
    - Agent triggers native image_generate.
    - Configured live Codex proof records matching tool_search call/output discovery linked to the successful image_generate result.
    - Persisted history records exactly one successful generation action, independently of status queries.
    - Tool output returns a saved MEDIA path and the file exists.
    - The generated-media completion produces exactly one outbound channel delivery containing the saved PNG bytes.
  docsRefs:
    - docs/tools/image-generation.md
    - docs/providers/openai.md
  codeRefs:
    - src/agents/tools/image-generate-tool.ts
    - extensions/qa-lab/src/providers/mock-openai/server.ts
  execution:
    kind: flow
    liveConfiguredRuntime:
      id: codex
      model: openai/gpt-5.5
    summary: >-
      For native Codex discovery proof, select --provider-mode live-frontier --model openai/gpt-5.5 --alt-model openai/gpt-5.5.
      Other model selections retain their general runtime route.
      Verify image_generate appears when configured and returns a real saved media artifact.
    channel: qa-channel
    config:
      prompt: "Image generation check: generate a QA lighthouse image and summarize it in one short sentence."
      promptSnippet: "Image generation check"
      generatedNeedle: "QA lighthouse"

flow:
  steps:
    - name: enables image_generate and saves a real media artifact
      actions:
        - call: ensureImageGenerationConfigured
          args:
            - ref: env
        - call: createSession
          saveAs: sessionKey
          args:
            - ref: env
            - Image generation
            - expr: "`agent:qa:image-generate:${randomUUID()}`"
        - call: readEffectiveTools
          saveAs: tools
          args:
            - ref: env
            - ref: sessionKey
        - assert:
            expr: "tools.has('image_generate')"
            message: image_generate not present after imageGenerationModel patch
        - call: reset
        - set: generationStartedAt
          value:
            expr: Date.now()
        - call: runAgentPrompt
          args:
            - ref: env
            - sessionKey:
                ref: sessionKey
              message:
                expr: config.prompt
              timeoutMs:
                expr: liveTurnTimeoutMs(env, 45000)
        - set: mediaCompletionDeadline
          value:
            expr: Date.now() + liveTurnTimeoutMs(env, 45000)
        - call: waitForOutboundMessage
          saveAs: outbound
          args:
            - ref: state
            - lambda:
                params: [candidate]
                expr: "candidate.conversation.id === 'qa-operator' && candidate.attachments?.length > 0"
            - expr: Math.max(0, mediaCompletionDeadline - Date.now())
        - call: waitForCondition
          args:
            - lambda:
                async: true
                expr: >-
                  await (async () => {
                    const result = await env.gateway.call('tools.invoke', {
                      name: 'image_generate', args: { action: 'status' }, sessionKey, agentId: 'qa'
                    });
                    const details = result.output?.details;
                    if (result.ok !== true || result.toolName !== 'image_generate'
                        || result.output?.isError === true || details?.action !== 'status'
                        || typeof details.active !== 'boolean') {
                      throw new Error('image generation status could not establish completion');
                    }
                    return details.active ? undefined : true;
                  })()
            - expr: Math.max(0, mediaCompletionDeadline - Date.now())
        - assert:
            expr: "!env.mock || ((await fetchJson(`${env.mock.baseUrl}/debug/requests`)).find((request) => String(request.allInputText ?? '').includes(config.promptSnippet))?.plannedToolName === 'image_generate')"
            message:
              expr: "`expected image_generate, got ${String((await fetchJson(`${env.mock.baseUrl}/debug/requests`)).find((request) => String(request.allInputText ?? '').includes(config.promptSnippet))?.plannedToolName ?? '')}`"
        - call: resolveGeneratedImagePath
          saveAs: generatedPath
          args:
            - env:
                ref: env
              promptSnippet:
                expr: config.promptSnippet
              startedAtMs:
                ref: generationStartedAt
              timeoutMs: 15000
        - assert:
            expr: "typeof generatedPath === 'string' && generatedPath.length > 0"
            message: image generation did not produce a saved media path
        - call: fs.stat
          saveAs: generatedImageStat
          args:
            - ref: generatedPath
        - assert:
            expr: "generatedImageStat.isFile() && generatedImageStat.size > 0"
            message: image generation did not produce a nonempty saved media file
        - call: fs.readFile
          saveAs: generatedImageBytes
          args:
            - ref: generatedPath
        - call: readSessionTranscriptSummary
          saveAs: generatedImageTranscript
          args:
            - ref: env
            - ref: sessionKey
        - set: imageHistory
          value:
            expr: "await env.gateway.call('chat.history', { sessionKey, limit: 100, maxChars: 131072 }, { timeoutMs: liveTurnTimeoutMs(env, 15000) })"
        - set: imageToolMessages
          value:
            expr: "projectQaToolMessages(imageHistory.messages ?? [])"
        - set: generationCalls
          value:
            expr: >-
              imageToolMessages.flatMap((message, messageIndex) =>
                message.role === 'assistant' && Array.isArray(message.content)
                  ? message.content.flatMap((item) =>
                      ['toolCall', 'toolUse', 'tool_use'].includes(item?.type)
                      && item.name === 'image_generate'
                      && typeof item.id === 'string' && item.id.length > 0
                      && (normalizeLowercaseStringOrEmpty((item.arguments ?? item.input)?.action) || 'generate') === 'generate'
                        ? [{ callId: item.id, messageIndex }] : [])
                  : [])
        - set: completedGenerations
          value:
            expr: >-
              generationCalls.filter((call) => imageToolMessages.some((message, messageIndex) =>
                messageIndex > call.messageIndex && message.role === 'toolResult'
                && message.toolName === 'image_generate' && message.toolCallId === call.callId
                && message.isError === false))
        - set: outboundMessages
          value:
            expr: "state.getSnapshot().messages.filter((candidate) => candidate.direction === 'outbound' && candidate.conversation.id === 'qa-operator')"
        - set: mediaDeliveries
          value:
            expr: "outboundMessages.filter((candidate) => candidate.attachments?.length > 0)"
        - assert:
            expr: >-
              mediaDeliveries.length === 1
              && !mediaDeliveries[0].deleted
              && mediaDeliveries[0].attachments.length === 1
              && mediaDeliveries[0].attachments[0].kind === 'image'
              && mediaDeliveries[0].attachments[0].mimeType === 'image/png'
              && typeof mediaDeliveries[0].attachments[0].contentBase64 === 'string'
              && Buffer.from(mediaDeliveries[0].attachments[0].contentBase64, 'base64').equals(generatedImageBytes)
            message:
              expr: "`expected exactly one generated-image delivery with bytes matching ${generatedPath}; saw ${mediaDeliveries.length} media deliveries in ${outboundMessages.length} messages; transcript=${formatTransportTranscript(state, { conversationId: 'qa-operator' })}`"
        - set: persistedDeliveryPayloads
          value:
            expr: >-
              (await qaImport('openclaw/plugin-sdk/qa-runtime')).mergeAttemptToolMediaPayloads({
                payloads: [{ text: generatedImageTranscript.finalText }],
                toolMediaUrls: [generatedPath]
              })
        - set: persistedReply
          value:
            expr: "(await qaImport('openclaw/plugin-sdk/channel-outbound')).createOutboundPayloadPlan(persistedDeliveryPayloads ?? [])[0]?.parts.text"
        - assert:
            expr: >-
              completedGenerations.length === 1
              && typeof generatedImageTranscript.finalText === 'string'
              && generatedImageTranscript.finalText.trim().length > 0
              && persistedReply === mediaDeliveries[0].text
            message:
              expr: "`generated image completion was not persisted to the requester session: ${JSON.stringify({ completedGenerations: completedGenerations.length, persistedReply, deliveredReply: mediaDeliveries[0].text })}`"
        - set: imageSearchDiscoveryDetails
          value: tool_search discovery not required for this runtime
        - if:
            expr: >-
              !env.mock
              && env.runtimeId === 'codex'
              && env.runtimeSelection === 'configured'
            then:
              - call: requireToolSearchDiscoveryEvidence
                saveAs: imageSearchDiscovery
                args:
                  - ref: env
                  - sessionKey:
                      ref: sessionKey
                    toolName: image_generate
                    expectedCallId:
                      expr: completedGenerations[0].callId
                    expectedSuccess: true
              - set: imageSearchDiscoveryDetails
                value:
                  expr: >-
                    `image_generate tool_search discovery
                    ${formatToolSearchDiscoveryReceipt('happy', imageSearchDiscovery)}`
      detailsExpr: "`${outbound.text}\\n${imageSearchDiscoveryDetails}\\nIMAGE_PATH:${generatedPath}`"
