title: Gateway RPC account health

scenario:
  id: gateway-rpc-account-health
  surface: observability
  category: observability.health-and-repair
  coverage:
    primary:
      - observability.gateway-rpc-health
      - observability.per-account-enable-disable-settings
  objective: Prove authenticated Gateway health and status RPCs reflect real per-account configuration reloads and bound slow or non-settling channel hooks.
  successCriteria:
    - Authenticated health and channels.status RPCs report two running QA channel accounts, while status exposes both account summaries.
    - A real CAS config.patch disables one named account and the Gateway applies the new runtime revision.
    - Only the selected account configuration leaf changes.
    - The default sibling remains enabled and running while the disabled account is configured, stopped, and operator-visible.
    - Verbose health without an explicit CLI timeout completes all six delayed accounts after the legacy 10-second client deadline.
    - A non-settling channel probe hook returns a partial health snapshot after the Gateway-owned deadline with five admitted accounts timed out and one queued account skipped.
    - A follow-up authenticated health RPC returns six skipped accounts and zero timed-out accounts while the five non-cancellable hook promises remain unsettled.
  docsRefs:
    - docs/gateway/health.md
    - docs/gateway/protocol.md
  codeRefs:
    - src/gateway/server-methods/health.ts
    - src/gateway/server-methods/channels.ts
    - test/e2e/qa-lab/runtime/gateway-rpc-account-health-hook-deadlines.ts
    - test/e2e/qa-lab/runtime/gateway-rpc-account-health.ts
  execution:
    kind: script
    path: test/e2e/qa-lab/runtime/gateway-rpc-account-health.ts
    summary: Starts isolated real Gateway children, proves account reloads, crosses the verbose-health CLI RPC boundary with delayed hooks, and captures bounded partial results for non-settling hooks.
    args:
      - --artifact-base
      - ${outputDir}
