title: Migrated proactive automation live contract
scenario:
  id: heartbeat-shared-runtime-live-contract
  surface: cron
  category: automation.heartbeat
  coverage:
    primary:
      - automation.heartbeat-scheduling
      - automation.chat-announce-delivery
    secondary:
      - automation.wake-and-cooldown-handling
      - gateway.agent-and-automation-apis
  gatewayConfigPatch:
    agents:
      defaults:
        heartbeat:
          every: 24h
          isolatedSession: true
          target: qa-channel
          to: dm:qa-heartbeat-live-contract
          directPolicy: allow
          prompt: "QA migrated proactive automation. Follow the current automation scratch checklist. Use NO_REPLY when nothing needs attention."
    tools:
      allow: [automations]
  objective: Prove a migrated heartbeat is an ordinary editable automation with natural scheduling, scratch policy, silent completion, and exact channel delivery.
  successCriteria:
    - Doctor converts the legacy configuration into an ordinary agentTurn job.
    - Naturally scheduled quiet and alert turns update scratch through the automations tool.
    - NO_REPLY records an intentional non-delivery and the alert delivers exactly once.
    - Empty scratch skips execution on the next natural scheduled occurrence.
  docsRefs:
    - docs/gateway/heartbeat.md
    - docs/automation/cron-jobs.md
  codeRefs:
    - src/commands/doctor-heartbeat-task-migration.ts
    - src/cron/service/timer-execution.ts
    - src/cron/isolated-agent/run.ts
  execution:
    kind: flow
    suiteIsolation: isolated
    isolationReason: Migrates legacy configuration and edits only its resulting job in an ephemeral Gateway.
    channel: qa-channel
    retryCount: 0
    timeoutMs: 600000
    summary: >-
      Run with --provider-mode live-frontier --scenario heartbeat-shared-runtime-live-contract.
      Use source-owned model defaults. Every occurrence fires from its persisted
      schedule; no cron.run, wake, or retired heartbeat tool is used.
    config:
      requiredProviderMode: live-frontier
      monitorReadyTimeoutMs: 30000
      conversationId: qa-heartbeat-live-contract
      promptNeedle: QA migrated proactive automation.
      cases:
        - name: quiet
          notify: false
        - name: alert
          notify: true
flow:
  steps:
    - name: naturally runs migrated quiet and alert automation turns
      actions:
        - assert:
            expr: "env.providerMode === config.requiredProviderMode"
            message: This scenario requires the live provider lane.
        - call: waitForGatewayHealthy
          args: [{ ref: env }, 120000]
        - call: waitForQaChannelReady
          args: [{ ref: env }, 120000]
        - set: monitorReadyDeadline
          value: { expr: "Date.now() + config.monitorReadyTimeoutMs" }
        - call: waitForCondition
          saveAs: monitor
          args:
            - lambda:
                async: true
                params: []
                expr: "env.gateway.call('cron.list', {includeDisabled: true}, {deadlineMs: monitorReadyDeadline}).then((inventory) => inventory.jobs.find((job) => Boolean(job.id) && job.agentId === 'qa' && job.payload?.kind === 'agentTurn' && job.payload.message.includes(config.promptNeedle) && job.enabled === true))"
            - ref: config.monitorReadyTimeoutMs
            - 250
        - assert:
            expr: "Boolean(monitor?.id) && monitor.enabled && monitor.payload.kind === 'agentTurn'"
            message: Expected Doctor's converted ordinary automation.
        - set: verdicts
          value: { expr: "[]" }
        - forEach:
            items: { expr: config.cases }
            item: phase
            actions:
              - call: reset
              - set: marker
                value: { expr: "`QA-AUTOMATION-${phase.name}-${randomUUID().slice(0, 8)}`" }
              - set: replacementScratch
                value: { expr: "`Completed ${marker}. No further action is requested.`" }
              - call: env.gateway.call
                args:
                  [
                    cron.scratch.set,
                    {
                      id: { ref: monitor.id },
                      content: Review the current automation instructions.,
                    },
                  ]
              - set: startedAt
                value: { expr: "Date.now()" }
              - set: scheduledAt
                value: { expr: "new Date(startedAt + 12000).toISOString()" }
              - call: env.gateway.call
                args:
                  - cron.update
                  - id: { ref: monitor.id }
                    patch:
                      enabled: true
                      deleteAfterRun: false
                      schedule: { kind: at, at: { ref: scheduledAt } }
                      payload:
                        kind: agentTurn
                        skipIfScratchEmpty: true
                        message:
                          expr: "`Use the automations tool to replace this job's scratch with exactly ${JSON.stringify(replacementScratch)}. Job ID: ${monitor.id}. After the scratch write succeeds, finish with exactly ${phase.notify ? marker : 'NO_REPLY'}. Do not create jobs or send messages through tools.`"
                  - timeoutMs: 30000
              - call: waitForCronRunCompletion
                saveAs: completed
                args:
                  - callGateway: { expr: "env.gateway.call.bind(env.gateway)" }
                    jobId: { ref: monitor.id }
                    afterTs: { ref: startedAt }
                    timeoutMs: { expr: "liveTurnTimeoutMs(env, 180000)" }
              - assert:
                  expr: "completed.status === 'ok' && completed.runAtMs >= new Date(scheduledAt).getTime()"
                  message: { expr: "JSON.stringify(completed)" }
              - call: env.gateway.call
                saveAs: scratch
                args: [cron.scratch.get, { id: { ref: monitor.id } }]
              - assert:
                  expr: "scratch.scratch?.content === replacementScratch"
                  message: The ordinary automation did not persist its scratch replacement.
              - if:
                  expr: phase.notify
                  then:
                    - call: waitForOutboundMessage
                      args:
                        - ref: state
                        - lambda:
                            params: [message]
                            expr: "message.direction === 'outbound' && message.conversation.kind === 'direct' && message.conversation.id === config.conversationId && message.text.trim() === marker"
                        - expr: "liveTurnTimeoutMs(env, 60000)"
                  else:
                    - assert:
                        expr: "completed.deliveryStatus === 'not-delivered' || completed.deliveryStatus === 'not-requested'"
                        message: Quiet completion must record a deliberate non-delivery.
              - set: outbound
                value:
                  {
                    expr: "getTransportSnapshot().messages.filter((message) => message.direction === 'outbound' && !message.deleted)",
                  }
              - assert:
                  expr: "phase.notify ? outbound.length === 1 && outbound[0].text.trim() === marker : outbound.length === 0"
                  message:
                    {
                      expr: "JSON.stringify(outbound.map((message) => ({conversation: message.conversation, text: message.text})))",
                    }
              - set: recorded
                value:
                  {
                    expr: "verdicts.push({phase: phase.name, jobId: monitor.id, natural: true, status: completed.status, deliveryStatus: completed.deliveryStatus, outboundCount: outbound.length})",
                  }
      detailsExpr: "JSON.stringify(verdicts)"
    - name: naturally skips the same automation when its scratch is empty
      actions:
        - call: reset
        - call: env.gateway.call
          args: [cron.scratch.set, { id: { ref: monitor.id }, content: "" }]
        - set: emptyStartedAt
          value: { expr: "Date.now()" }
        - call: env.gateway.call
          args:
            - cron.update
            - id: { ref: monitor.id }
              patch:
                enabled: true
                schedule:
                  { kind: at, at: { expr: "new Date(emptyStartedAt + 12000).toISOString()" } }
            - timeoutMs: 30000
        - call: waitForCronRunCompletion
          saveAs: emptyRun
          args:
            - callGateway: { expr: "env.gateway.call.bind(env.gateway)" }
              jobId: { ref: monitor.id }
              afterTs: { ref: emptyStartedAt }
              timeoutMs: { expr: "liveTurnTimeoutMs(env, 120000)" }
        - assert:
            expr: "emptyRun.status === 'skipped' && /scratch/i.test(String(emptyRun.summary ?? emptyRun.error ?? ''))"
            message: { expr: "JSON.stringify(emptyRun)" }
        - assert:
            expr: "getTransportSnapshot().messages.every((message) => message.direction !== 'outbound')"
            message: Empty scratch unexpectedly delivered a message.
      detailsExpr: "JSON.stringify({jobId: monitor.id, natural: true, status: emptyRun.status})"
