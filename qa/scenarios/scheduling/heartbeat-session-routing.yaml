title: Automation and legacy wake routing after Gateway restart

scenario:
  id: heartbeat-session-routing
  surface: automation
  category: automation.heartbeat
  coverage:
    primary:
      - automation.heartbeat-scheduling
    secondary:
      - session-memory.session-routing
  objective: >-
    Verify an ordinary automation and explicit legacy wake requests use their
    distinct authoritative sessions after a Gateway restart.
  successCriteria:
    - An ordinary automation created before restart records history and delivery only in its configured session.
    - An explicit wake records history and delivery only in its explicitly requested session.
    - The main session receives neither automation nor explicit-wake content.
    - After a real Gateway restart, both wake paths preserve their routing boundaries without duplicate delivery.
  docsRefs:
    - docs/gateway/heartbeat.md
    - docs/concepts/session.md
  codeRefs:
    - src/cron/session-run.ts
    - src/auto-reply/reply/session-event-handoff.ts
    - src/gateway/server-methods/cron.ts
    - test/e2e/qa-lab/runtime/gateway-heartbeat-session-routing.e2e.test.ts
  execution:
    kind: vitest
    path: test/e2e/qa-lab/runtime/gateway-heartbeat-session-routing.e2e.test.ts
    summary: >-
      Run a real Gateway with a deterministic capture channel and provider,
      restart it, then run the persisted automation and explicit legacy wake and assert
      session history and delivery isolation.
