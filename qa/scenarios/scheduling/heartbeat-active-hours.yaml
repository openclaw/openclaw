title: Ordinary automation active-hours evidence

scenario:
  id: heartbeat-active-hours
  surface: automation
  category: automation.heartbeat
  coverage:
    secondary:
      - automation.active-hours
      - automation.heartbeat-scheduling
  objective: Prove ordinary cron runs honor active hours and persisted policy updates.
  successCriteria:
    - An ordinary session automation runs while its configured window is open.
    - An ordinary automation skips execution and delivery during quiet hours.
    - Updating the persisted active-hours policy allows the next run.
  docsRefs:
    - docs/automation/cron-jobs.md
  codeRefs:
    - src/cron/active-hours.ts
    - src/cron/service/timer-execution.ts
    - test/e2e/qa-lab/runtime/heartbeat-active-hours-runtime.ts
    - test/e2e/qa-lab/runtime/heartbeat-active-hours-runtime.test.ts
  execution:
    kind: vitest
    path: test/e2e/qa-lab/runtime/heartbeat-active-hours-runtime.test.ts
    summary: Prove active execution, quiet-hours suppression, and updated automation behavior.
