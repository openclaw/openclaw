title: Internal event turns spawn real subagents

scenario:
  id: internal-event-subagent-spawn-live
  surface: cron
  runtimePairLane: extended
  coverage:
    primary:
      - automation.wake-and-cooldown-handling
      - agent-runtime.subagent-turns-subagents
    secondary:
      - automation.cron-rpcs
      - automation.background-process-status
      - agent-runtime.tool-fs-read
  regressionRefs:
    - openclaw/openclaw#132890
  gatewayConfigPatch:
    tools:
      codeMode: false
      exec:
        host: gateway
        security: full
        ask: off
        notifyOnExit: true
  objective: Prove real cron and process completion events start internal turns that successfully delegate work through the configured live runtime.
  successCriteria:
    - A naturally fired main-session systemEvent creates a successful native child through sessions_spawn.
    - With cron disabled, a background exec completes during an active second turn and creates exactly one child after that turn settles.
    - Each parent transcript records a successful sessions_spawn call, and the matching native child run completes successfully.
    - Each child successfully reads and returns a fresh marker that was absent from every parent instruction.
  docsRefs:
    - docs/automation/cron-jobs.md
    - docs/gateway/background-process.md
    - docs/tools/subagents.md
  codeRefs:
    - src/auto-reply/reply/session-event-handoff.ts
    - src/agents/bash-tools.exec-runtime.ts
    - src/agents/subagents/spawn/subagent-spawn.ts
  execution:
    kind: flow
    suiteIsolation: isolated
    isolationReason: Owns main-session cron and background-process event turns with real child runs and an isolated QA delivery route.
    channel: qa-channel
    retryCount: 0
    timeoutMs: 900000
    summary: Run with --provider-mode live-frontier --runtime-pair openclaw,codex to exercise embedded and Codex app-server event turns. No provider or tool mocks are accepted.
    config:
      requiredProviderMode: live-frontier
      parentSessionKey: agent:qa:main
      fireDelayMs: 5000
      originalTarget: dm:qa-operator
      secondTurnTarget: dm:qa-busy-operator
      cases:
        - exec
        - cron

flow:
  steps:
    - name: real internal events delegate through their configured runtime
      actions:
        - assert:
            expr: "env.providerMode === config.requiredProviderMode && !env.mock"
            message: This proof requires a real configured provider.
        - call: waitForGatewayHealthy
          args:
            - ref: env
            - 120000
        - call: waitForQaChannelReady
          args:
            - ref: env
            - 120000
        - set: verdicts
          value:
            expr: "[]"
        - set: execToolName
          value:
            expr: "env.runtimeId === 'codex' ? 'gateway_exec' : 'exec'"
        - forEach:
            items:
              expr: config.cases
            item: eventKind
            actions:
              - call: patchConfig
                args:
                  - env:
                      ref: env
                    patch:
                      cron:
                        enabled:
                          expr: "eventKind === 'cron'"
              - call: env.gateway.call
                saveAs: cronStatus
                args: [cron.status, {}]
              - assert:
                  expr: "cronStatus.enabled === (eventKind === 'cron')"
                  message:
                    expr: "`Wrong scheduler state for ${eventKind} event proof: ${JSON.stringify(cronStatus)}`"
              - set: attemptId
                value:
                  expr: randomUUID()
              - set: childLabel
                value:
                  expr: "`qa-event-${eventKind}-${attemptId}`"
              - set: childFile
                value:
                  expr: "`qa-event-child-${attemptId}.txt`"
              - set: expectedMarker
                value:
                  expr: "`QA-EVENT-CHILD-${randomUUID()}`"
              - call: fs.writeFile
                args:
                  - expr: path.join(env.gateway.workspaceDir, childFile)
                  - expr: "`${expectedMarker}\n`"
                  - utf8
              - set: eventInstruction
                value:
                  expr: |-
                    `Act on this ${eventKind} completion by calling the OpenClaw sessions_spawn tool exactly once, with runtime subagent, cleanup keep, and label ${childLabel}.
                    The child task is: "Use the OpenClaw filesystem read tool to read ${childFile} in the workspace. Reply with the exact single-line contents and nothing else. You must actually read the file. Do not use exec, process, or another subagent."
                    Do not read the file yourself or guess its contents. After the spawn is accepted, finish this turn with NO_REPLY. Do not call sessions_yield. Do not spawn another child when this child's result arrives. This request explicitly authorizes the one child.`
              - call: readSessionTranscriptSummary
                saveAs: parentBefore
                args:
                  - ref: env
                  - expr: config.parentSessionKey
                  - allowEmpty: true
              - set: attemptStartedAt
                value:
                  expr: Date.now()
              - if:
                  expr: "eventKind === 'cron'"
                  then:
                    - set: scheduledAt
                      value:
                        expr: "new Date(Date.now() + config.fireDelayMs).toISOString()"
                    - call: env.gateway.call
                      saveAs: job
                      args:
                        - cron.add
                        - agentId: qa
                          name:
                            expr: "`qa-event-spawn-${attemptId}`"
                          enabled: true
                          deleteAfterRun: true
                          schedule:
                            kind: at
                            at:
                              ref: scheduledAt
                          sessionTarget: main
                          wakeMode: now
                          payload:
                            kind: systemEvent
                            text:
                              ref: eventInstruction
                        - timeoutMs: 30000
                    - assert:
                        expr: "Boolean(job.id) && job.sessionTarget === 'main' && job.payload?.kind === 'systemEvent'"
                        message: Cron did not retain the main-session systemEvent contract.
                    - call: waitForCronRunCompletion
                      saveAs: cronRun
                      args:
                        - callGateway:
                            expr: env.gateway.call.bind(env.gateway)
                          jobId:
                            expr: job.id
                          afterTs:
                            ref: attemptStartedAt
                          timeoutMs:
                            expr: liveTurnTimeoutMs(env, 240000)
                    - assert:
                        expr: "cronRun.status === 'ok' && Number.isSafeInteger(cronRun.runAtMs) && cronRun.runAtMs >= Date.parse(scheduledAt)"
                        message:
                          expr: "`cron did not naturally fire successfully: ${JSON.stringify(cronRun)}`"
                  else:
                    - set: scriptFile
                      value:
                        expr: "`qa-event-process-${attemptId}.cjs`"
                    - set: gateFile
                      value:
                        expr: "`qa-event-release-${attemptId}`"
                    - set: completionFile
                      value:
                        expr: "`qa-event-completed-${attemptId}.json`"
                    - set: completionOutput
                      value:
                        expr: "`DELEGATE label=${childLabel} file=${childFile}`"
                    - assert:
                        expr: completionOutput.length <= 180
                        message: Completion metadata must fit the exec notification snippet.
                    # The initiating turn cannot know the child label or file:
                    # only this process's eventual completion output supplies them.
                    - call: fs.writeFile
                      args:
                        - expr: path.join(env.gateway.workspaceDir, scriptFile)
                        - expr: |-
                            `const fs = require('node:fs');
                            const deadline = Date.now() + 300000;
                            const timer = setInterval(() => {
                              if (Date.now() >= deadline) { clearInterval(timer); process.exitCode = 2; return; }
                              if (!fs.existsSync(${JSON.stringify(gateFile)})) return;
                              clearInterval(timer);
                              fs.writeFileSync(${JSON.stringify(completionFile)}, JSON.stringify({ completedAt: Date.now() }));
                              process.stdout.write(${JSON.stringify(completionOutput + '\n')});
                            }, 100);
                            `
                        - utf8
                    - set: execCommand
                      value:
                        expr: "`node ${scriptFile}`"
                    - call: runAgentPrompt
                      args:
                        - ref: env
                        - sessionKey:
                            expr: config.parentSessionKey
                          message:
                            expr: |-
                              `Start this background job using the OpenClaw ${execToolName} tool with command ${JSON.stringify(execCommand)} and background=true. Do not use the model runtime's native shell.
                              In this initiating turn call no other tools. Do not inspect the script or any files, poll the process, wait for it, or create a subagent. After the tool reports a running session, finish this turn with exactly QA-PROCESS-STARTED-${attemptId}.
                              Its completion will arrive later as a separate notification containing DELEGATE label=<label> file=<file>. I authorize you to act on that future completion: call sessions_spawn exactly once with runtime subagent, cleanup keep, and that label. Tell the child to use only the OpenClaw filesystem read tool to read that workspace file and return its exact single-line contents; the child must actually read it. Do not read or inspect it yourself. After spawning, finish that turn with NO_REPLY. Do not call sessions_yield. Do not spawn again when the child completes.`
                          timeoutMs:
                            expr: liveTurnTimeoutMs(env, 240000)
                    - call: readSessionTranscriptSummary
                      saveAs: initialTurn
                      args:
                        - ref: env
                        - expr: config.parentSessionKey
                        - afterEventCursor:
                            expr: parentBefore.eventCursor
                    - call: readSessionToolActivity
                      saveAs: initialActivity
                      args:
                        - ref: env
                        - expr: config.parentSessionKey
                        - afterEventCursor:
                            expr: parentBefore.eventCursor
                    - set: initialTools
                      value:
                        expr: "initialActivity.filter((activity) => activity.kind === 'tool')"
                    - assert:
                        expr: "initialTools.length === 1 && initialTools[0].toolName === execToolName && initialTools[0].isError === false && initialTools[0].input?.command === execCommand && initialTools[0].input?.background === true && initialTools[0].result?.details?.status === 'running' && typeof initialTools[0].result.details.sessionId === 'string' && initialTools[0].result.details.sessionId.length > 0 && initialTurn.finalText.trim() === `QA-PROCESS-STARTED-${attemptId}`"
                        message:
                          expr: "`initial turn must start only one OpenClaw exec and then finish: ${JSON.stringify({ tools: initialTurn.assistantToolCallCounts, successfulTools: initialTurn.successfulToolCallCounts, finalText: initialTurn.finalText })}`"
                    - call: env.gateway.call
                      saveAs: initialHistory
                      args:
                        - chat.history
                        - sessionKey:
                            expr: config.parentSessionKey
                          limit: 100
                        - timeoutMs: 30000
                    - assert:
                        expr: "(initialHistory.messages ?? []).some((message) => message.role === 'assistant' && Array.isArray(message.content) && message.content.some((block) => ['toolCall', 'toolUse', 'tool_use'].includes(block.type) && block.name === execToolName && (block.arguments ?? block.input)?.command === execCommand && (block.arguments ?? block.input)?.background === true))"
                        message: Parent did not invoke the exact OpenClaw background exec command.
                    - set: parentBefore
                      value:
                        ref: initialTurn
                    - set: busyScript
                      value:
                        expr: "`qa-event-busy-${attemptId}.cjs`"
                    - set: busyStartedFile
                      value:
                        expr: "`qa-event-busy-started-${attemptId}`"
                    - set: busyReleaseFile
                      value:
                        expr: "`qa-event-busy-release-${attemptId}`"
                    - call: fs.writeFile
                      args:
                        - expr: path.join(env.gateway.workspaceDir, busyScript)
                        - expr: |-
                            `const fs = require('node:fs');
                            fs.writeFileSync(${JSON.stringify(busyStartedFile)}, 'active');
                            const deadline = Date.now() + 240000;
                            const timer = setInterval(() => {
                              if (Date.now() >= deadline) { clearInterval(timer); process.exitCode = 2; return; }
                              if (!fs.existsSync(${JSON.stringify(busyReleaseFile)})) return;
                              clearInterval(timer);
                              process.stdout.write(${JSON.stringify('QA-BUSY-WORK-DONE\n')});
                            }, 100);`
                        - utf8
                    - call: startAgentRun
                      saveAs: busyRun
                      args:
                        - ref: env
                        - sessionKey:
                            expr: config.parentSessionKey
                          taskTracking: false
                          to:
                            expr: config.secondTurnTarget
                          message:
                            expr: |-
                              `Use the OpenClaw ${execToolName} tool to run node ${busyScript} with yieldMs=1000. If it returns a process session, use the OpenClaw process tool with action=poll and timeout=30000 repeatedly until that process exits. Do not poll any other process. Do not interrupt this work for background notifications, read files, or spawn children in this turn. When this exact process exits successfully, finish with exactly QA-BUSY-TURN-DONE-${attemptId}.`
                          timeoutMs: 30000
                    - call: waitForCondition
                      saveAs: busyStartedMarker
                      args:
                        - lambda:
                            async: true
                            expr: "fs.readFile(path.join(env.gateway.workspaceDir, busyStartedFile), 'utf8').then((value) => value === 'active' ? value : undefined).catch((error) => { if (error.code === 'ENOENT') return undefined; throw error; })"
                        - expr: liveTurnTimeoutMs(env, 120000)
                        - 100
                    - assert:
                        expr: "busyStartedMarker === 'active'"
                        message: Busy process did not write its exact started marker.
                    - set: busyStartedAt
                      value:
                        expr: Date.now()
                    - call: env.gateway.call
                      saveAs: busyBeforeRelease
                      args:
                        - agent.wait
                        - runId:
                            expr: busyRun.runId
                          timeoutMs: 1
                        - timeoutMs: 30000
                    - assert:
                        expr: "busyBeforeRelease.status === 'timeout' && busyBeforeRelease.timeoutPhase === 'gateway_draining' && busyBeforeRelease.providerStarted !== false"
                        message: Second turn already ended before the original process was released.
                    - set: releasedAt
                      value:
                        expr: Date.now()
                    - call: fs.writeFile
                      args:
                        - expr: path.join(env.gateway.workspaceDir, gateFile)
                        - release
                        - utf8
                    - call: waitForCondition
                      saveAs: processCompletion
                      args:
                        - lambda:
                            async: true
                            expr: "fs.readFile(path.join(env.gateway.workspaceDir, completionFile), 'utf8').then(JSON.parse).catch(() => undefined)"
                        - 30000
                        - 100
                    - assert:
                        expr: "Number.isSafeInteger(processCompletion.completedAt) && processCompletion.completedAt >= releasedAt"
                        message: Background process did not complete after release during the second turn.
                    - call: env.gateway.call
                      saveAs: busyAfterCompletion
                      args:
                        - agent.wait
                        - runId:
                            expr: busyRun.runId
                          timeoutMs: 1
                        - timeoutMs: 30000
                    - assert:
                        expr: "busyAfterCompletion.status === 'timeout' && busyAfterCompletion.timeoutPhase === 'gateway_draining' && busyAfterCompletion.providerStarted !== false"
                        message: The process completion interrupted or ended the active second turn.
                    # In-flight tools need not be in the durable transcript yet.
                    # Task creation, not a late tool result, owns child acceptance.
                    - call: runQaCli
                      saveAs: busyTasks
                      args:
                        - ref: env
                        - [tasks, list, --json, --runtime, subagent]
                        - timeoutMs:
                            expr: liveTurnTimeoutMs(env, 60000)
                          json: true
                    - set: busyChildren
                      value:
                        expr: "(busyTasks.tasks ?? []).filter((task) => task.label === childLabel && task.requesterSessionKey === config.parentSessionKey && task.createdAt >= attemptStartedAt)"
                    - assert:
                        expr: "busyChildren.length === 0"
                        message:
                          expr: "`Child task accepted before the active second turn settled: ${JSON.stringify(busyChildren.map(({ taskId, createdAt, status }) => ({ taskId, createdAt, status })))}`"
                    - set: busyReleasedAt
                      value:
                        expr: Date.now()
                    - call: fs.writeFile
                      args:
                        - expr: path.join(env.gateway.workspaceDir, busyReleaseFile)
                        - release
                        - utf8
                    - call: waitForAgentRun
                      saveAs: busyWaited
                      args:
                        - ref: env
                        - expr: busyRun.runId
                        - expr: liveTurnTimeoutMs(env, 240000)
                    - assert:
                        expr: "['ok', 'completed', 'succeeded'].includes(busyWaited.status) && Number.isFinite(busyWaited.endedAt)"
                        message:
                          expr: "`second turn failed: ${JSON.stringify(busyWaited)}`"
                    - set: observeExecCompletion
                      value:
                        expr: "() => ({ attemptId, cronEnabled: cronStatus.enabled, busyStartedMarker, busyStartedAt, releasedAt, processCompletedAt: processCompletion.completedAt, busyBeforeRelease, busyAfterCompletion, busyReleasedAt, busyEndedAt: busyWaited.endedAt, busyWaitStatus: busyWaited.status, childrenWhileBusy: busyChildren.length, transportAccountId: transport.accountId, expectedBusyTarget: config.secondTurnTarget, expectedChildTarget: config.originalTarget, messages: state.getSnapshot().messages.filter((message) => message.direction === 'outbound').map((message) => ({ accountId: message.accountId, conversation: message.conversation, deleted: message.deleted === true, busyMarker: String(message.text ?? '').includes(`QA-BUSY-TURN-DONE-${attemptId}`), childMarker: String(message.text ?? '').includes(expectedMarker) })) })"
                    - call: fs.writeFile
                      args:
                        - expr: "path.join(env.outputDir, `exec-completion-${env.runtimeId}-before-wait.json`)"
                        - expr: "JSON.stringify(observeExecCompletion(), null, 2)"
                        - utf8
                    - try:
                        actions:
                          - waitForOutbound:
                              conversation:
                                id:
                                  expr: config.secondTurnTarget.replace(/^dm:/, '')
                                kind: direct
                              textIncludes:
                                expr: "`QA-BUSY-TURN-DONE-${attemptId}`"
                              timeoutMs:
                                expr: liveTurnTimeoutMs(env, 60000)
                        catchAs: busyDeliveryError
                        catch:
                          - call: fs.writeFile
                            args:
                              - expr: "path.join(env.outputDir, `exec-completion-${env.runtimeId}-failure.json`)"
                              - expr: "JSON.stringify(observeExecCompletion(), null, 2)"
                              - utf8
                          - throw:
                              expr: "`Busy-turn outbound marker was not observed: ${String(busyDeliveryError)}; lifecycle=${JSON.stringify(observeExecCompletion())}`"
              - call: waitForCondition
                saveAs: completedChild
                args:
                  - lambda:
                      async: true
                      expr: |-
                        (await readNativeQaSubagentRuns(env, config.parentSessionKey)).find((run) => run.label === childLabel && run.requesterSessionKey === config.parentSessionKey && run.createdAt >= attemptStartedAt && run.execution.status === 'terminal' && run.execution.outcome?.status === 'ok' && typeof run.childSessionKey === 'string' && Number.isFinite(run.execution.endedAt))
                  - expr: liveTurnTimeoutMs(env, 300000)
                  - 1000
              - call: readSessionTranscriptSummary
                saveAs: parentAfter
                args:
                  - ref: env
                  - expr: config.parentSessionKey
                  - afterEventCursor:
                      expr: parentBefore.eventCursor
              - assert:
                  expr: "parentAfter.successfulToolCallCounts.sessions_spawn === 1 && parentAfter.assistantToolCallCounts.sessions_spawn === 1 && (parentAfter.assistantToolCallCounts.read ?? 0) === 0 && (eventKind === 'exec' || ['exec', 'process', 'gateway_exec', 'gateway_process'].every((name) => (parentAfter.assistantToolCallCounts[name] ?? 0) === 0))"
                  message:
                    expr: "`${eventKind} wake must attempt and successfully spawn exactly once without reading the child marker itself: ${JSON.stringify({ attempts: parentAfter.assistantToolCallCounts, successful: parentAfter.successfulToolCallCounts })}`"
              - if:
                  expr: "eventKind === 'exec'"
                  then:
                    - assert:
                        expr: "parentAfter.assistantToolCallCounts[execToolName] === 1 && parentAfter.successfulToolCallCounts[execToolName] === 1"
                        message:
                          expr: "`Settled second turn must contain exactly one successful busy exec: ${JSON.stringify({ attempts: parentAfter.assistantToolCallCounts, successful: parentAfter.successfulToolCallCounts })}`"
                    - assert:
                        expr: "Number.isFinite(completedChild.createdAt) && completedChild.createdAt >= busyWaited.endedAt"
                        message:
                          expr: "`Child task was created before the second turn ended: ${JSON.stringify({ childCreatedAt: completedChild.createdAt, busyEndedAt: busyWaited.endedAt, processCompletedAt: processCompletion.completedAt, busyReleasedAt })}`"
              - call: readSessionTranscriptSummary
                saveAs: childTranscript
                args:
                  - ref: env
                  - expr: completedChild.childSessionKey
              - assert:
                  expr: "(childTranscript.successfulToolCallCounts.read ?? 0) >= 1 && childTranscript.finalText.trim() === expectedMarker"
                  message:
                    expr: "`${eventKind} child did not read and return its hidden marker: ${JSON.stringify({ tools: childTranscript.successfulToolCallCounts, finalText: childTranscript.finalText })}`"
              - assert:
                  expr: "(parentAfter.successfulToolCallEvents ?? []).some((event) => event.name === 'sessions_spawn' && event.timestamp >= attemptStartedAt && event.timestamp <= completedChild.execution.endedAt && (eventKind !== 'exec' || event.timestamp >= processCompletion.completedAt))"
                  message: Child spawn chronology does not follow the real event producer.
              - set: appendVerdict
                value:
                  expr: "verdicts.push({ source: eventKind, providerMode: env.providerMode, model: env.primaryModel, parent: config.parentSessionKey, child: completedChild.childSessionKey, spawnAccepted: true, childSucceeded: true, childReadVerified: true, cronEnabled: eventKind === 'cron', target: config.originalTarget })"
      detailsExpr: JSON.stringify(verdicts)
    - name: fences a process completion from a reset successor
      actions:
        - set: resetAttempt
          value:
            expr: randomUUID()
        - set: staleMarker
          value:
            expr: "`QA-STALE-PROCESS-${resetAttempt}`"
        - set: resetGate
          value:
            expr: "`qa-reset-release-${resetAttempt}`"
        - set: resetFinished
          value:
            expr: "`qa-reset-finished-${resetAttempt}`"
        - set: resetScript
          value:
            expr: "`qa-reset-process-${resetAttempt}.cjs`"
        - call: fs.writeFile
          args:
            - expr: path.join(env.gateway.workspaceDir, resetScript)
            - expr: |-
                `const fs = require('node:fs');
                const deadline = Date.now() + 240000;
                const timer = setInterval(() => {
                  if (Date.now() >= deadline) { clearInterval(timer); process.exitCode = 2; return; }
                  if (!fs.existsSync(${JSON.stringify(resetGate)})) return;
                  clearInterval(timer);
                  fs.writeFileSync(${JSON.stringify(resetFinished)}, 'finished');
                  process.stdout.write(${JSON.stringify(staleMarker + '\n')});
                }, 100);`
            - utf8
        - call: runAgentPrompt
          args:
            - ref: env
            - sessionKey:
                expr: config.parentSessionKey
              message:
                expr: "`Start node ${resetScript} using OpenClaw ${execToolName} with background=true, call no other tools, and finish with exactly QA-RESET-PROCESS-STARTED.`"
              timeoutMs:
                expr: liveTurnTimeoutMs(env, 120000)
        - call: readRawQaSessionStore
          saveAs: beforeResetStore
          args:
            - ref: env
        - call: env.gateway.call
          saveAs: resetResult
          args:
            - sessions.reset
            - key:
                expr: config.parentSessionKey
              reason: reset
            - timeoutMs:
                expr: liveTurnTimeoutMs(env, 60000)
        - assert:
            expr: "resetResult.ok === true && Boolean(resetResult.entry?.lifecycleRevision) && resetResult.entry.lifecycleRevision !== beforeResetStore[config.parentSessionKey]?.lifecycleRevision"
            message: Reset must advance the session lifecycle before the old process exits.
        - call: fs.writeFile
          args:
            - expr: path.join(env.gateway.workspaceDir, resetGate)
            - release
            - utf8
        - call: waitForCondition
          saveAs: resetFinishedMarker
          args:
            - lambda:
                async: true
                expr: "fs.readFile(path.join(env.gateway.workspaceDir, resetFinished), 'utf8').then((value) => value === 'finished' ? value : undefined).catch((error) => { if (error.code === 'ENOENT') return undefined; throw error; })"
            - 30000
            - 100
        - assert:
            expr: "resetFinishedMarker === 'finished'"
            message: Reset process did not write its exact finished marker.
        - call: runAgentPrompt
          args:
            - ref: env
            - sessionKey:
                expr: config.parentSessionKey
              message: "Reply exactly QA-RESET-SUCCESSOR-READY. Do not use any tools."
              timeoutMs:
                expr: liveTurnTimeoutMs(env, 120000)
        - call: env.gateway.call
          saveAs: successorHistory
          args:
            - chat.history
            - sessionKey:
                expr: config.parentSessionKey
              limit: 100
            - timeoutMs: 30000
        - assert:
            expr: "!JSON.stringify(successorHistory.messages ?? []).includes(staleMarker) && JSON.stringify(successorHistory.messages ?? []).includes('QA-RESET-SUCCESSOR-READY')"
            message: The reset successor received stale process completion context or did not remain usable.
        - assert:
            expr: "!state.getSnapshot().messages.some((message) => message.direction === 'outbound' && String(message.text ?? '').includes(staleMarker))"
            message: A stale process notification escaped to a channel after reset.
      detailsExpr: "JSON.stringify({ resetFenced: true, oldProcessExited: true, resetFinishedMarker, successorLifecycleRevision: resetResult.entry.lifecycleRevision })"
