title: Telegram partial failure recovery

scenario:
  id: telegram-partial-failure-recovery
  surface: channels
  category: channels.conversation-routing-and-delivery
  coverage:
    primary:
      - channels.streaming-final-reply
  regressionRefs:
    - openclaw/openclaw#120626
  objective: Verify Telegram recovers provider failures in one logical message whether or not a streaming preview became visible.
  successCriteria:
    - One native Telegram message retains the partial and terminal recovery for the current inbound turn.
    - A failure before any visible partial produces one fallback Telegram message.
  codeRefs:
    - extensions/telegram/src/bot-message-dispatch-turn.ts
    - extensions/telegram/src/draft-stream.ts
    - extensions/qa-lab/src/providers/mock-openai/server.ts
    - extensions/qa-lab/src/live-transports/telegram/adapter.runtime.ts
  gatewayConfigPatch:
    agents:
      defaults:
        model:
          fallbacks: []
      entries:
        qa:
          model:
            fallbacks: []
    channels:
      telegram:
        replyToMode: all
        streaming:
          mode: partial
  execution:
    kind: flow
    channel: telegram
    summary: Inject provider failures before and after Telegram accepts a streaming preview, then verify one correlated native recovery message remains.
    config:
      requiredProviderMode: mock-openai
      partialMarker: TELEGRAM-VISIBLE-PARTIAL-BEFORE-FAILURE
      recoveryMarker: "⚠️"

flow:
  steps:
    - name: preserves a visible partial in one recovered message
      actions:
        - assert:
            expr: env.providerMode === config.requiredProviderMode
            message: this Telegram recovery scenario requires mock-openai
        - call: waitForGatewayHealthy
          args: [{ ref: env }, 60000]
        - call: waitForTransportReady
          args: [{ ref: env }, 60000]
        - resetTransport: true
        # Live Telegram correlates native replies to the inbound; other drivers use bus outbound order.
        - set: readRecoveryMessages
          value:
            lambda:
              params: [inbound, outboundStart]
              expr: "typeof readTelegramMessages === 'function' ? readTelegramMessages(inbound.id).map((message) => ({ id: `${message.chatId}:${message.messageId}`, text: message.text })) : getTransportSnapshot().messages.filter((message) => message.direction === 'outbound').slice(outboundStart).map((message) => ({ id: message.id, text: message.text }))"
        - set: visibleOutboundStart
          value:
            expr: "getTransportSnapshot().messages.filter((message) => message.direction === 'outbound').length"
        - set: delivery
          value:
            expr: "transport.buildAgentDelivery({ target: 'group:telegram-partial-failure-room' })"
        - set: sessionKey
          value:
            expr: "buildAgentSessionKey({ agentId: 'qa', channel: delivery.channel, accountId: transport.accountId, peer: { kind: 'group', id: delivery.replyTo }, dmScope: env.cfg.session?.dmScope, identityLinks: env.cfg.session?.identityLinks })"
        - sendInbound:
            conversation: { id: telegram-partial-failure-room, kind: group }
            senderId: qa-telegram-recovery-operator
            senderName: Telegram Recovery Operator
            text: "@openclaw Telegram visible partial failure QA check"
          saveAs: visibleInbound
        - call: waitForCondition
          args:
            - lambda:
                params: []
                expr: "readRecoveryMessages(visibleInbound, visibleOutboundStart).find((message) => message.text.includes(config.partialMarker))"
            - 75000
          saveAs: visiblePartial
        - call: waitForCondition
          args:
            - lambda:
                async: true
                params: []
                expr: "(await env.gateway.call('sessions.list', {}, { timeoutMs: 30000 })).sessions?.some((session) => session.key === sessionKey && session.hasActiveRun === false) ? readRecoveryMessages(visibleInbound, visibleOutboundStart).find((message) => message.id === visiblePartial.id && message.text.includes(config.partialMarker) && message.text.includes(config.recoveryMarker)) : undefined"
            - 75000
        - set: visibleMessages
          value:
            expr: "readRecoveryMessages(visibleInbound, visibleOutboundStart)"
        - assert:
            expr: "visibleMessages.length === 1 && visibleMessages[0].id === visiblePartial.id && visibleMessages[0].text.includes(config.partialMarker) && visibleMessages[0].text.includes(config.recoveryMarker)"
            message:
              expr: "`expected one correlated Telegram recovery; saw ${JSON.stringify(visibleMessages)}`"
      detailsExpr: "JSON.stringify({ count: visibleMessages.length, initialText: visiblePartial.text, finalText: visibleMessages[0].text })"

    - name: sends one fallback when no partial became visible
      actions:
        - resetTransport: true
        - set: unsentOutboundStart
          value:
            expr: "getTransportSnapshot().messages.filter((message) => message.direction === 'outbound').length"
        - sendInbound:
            conversation: { id: telegram-partial-failure-room, kind: group }
            senderId: qa-telegram-recovery-operator
            senderName: Telegram Recovery Operator
            text: "@openclaw Telegram unsent failure QA check"
          saveAs: unsentInbound
        - call: waitForCondition
          args:
            - lambda:
                async: true
                params: []
                expr: "(await env.gateway.call('sessions.list', {}, { timeoutMs: 30000 })).sessions?.some((session) => session.key === sessionKey && session.hasActiveRun === false) ? readRecoveryMessages(unsentInbound, unsentOutboundStart).find((message) => message.text.includes(config.recoveryMarker)) : undefined"
            - 75000
        - set: unsentMessages
          value:
            expr: "readRecoveryMessages(unsentInbound, unsentOutboundStart)"
        - assert:
            expr: "unsentMessages.length === 1 && unsentMessages[0].text.includes(config.recoveryMarker) && !unsentMessages[0].text.includes(config.partialMarker)"
            message:
              expr: "`expected one correlated Telegram fallback without partial text; saw ${JSON.stringify(unsentMessages)}`"
      detailsExpr: "JSON.stringify({ count: unsentMessages.length, text: unsentMessages[0].text })"
