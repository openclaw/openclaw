title: Matrix E2EE media hold answers an encrypted captionless attachment and the text sent after it as one turn
scenario:
  id: matrix-e2ee-media-hold
  surface: channels
  coverage:
    primary:
      - matrix.encrypted-media-upload-download
  execution:
    kind: flow
    channel: matrix
    providerMode: mock-openai
    timeoutMs: 180000
    retryCount: 0
    config:
      matrixConfigOverrides:
        encryption: true
        mediaHoldMs: 8000
        startupVerification: off
      matrixTopology:
        defaultRoomKey: main
        rooms:
          - encrypted: true
            key: e2ee-media-hold
            kind: group
            members:
              - driver
              - observer
              - sut
            name: Matrix QA E2EE Media Hold Room
            requireMention: true

flow:
  module: ./live-transports/matrix/scenarios/scenario-runtime-media-hold.js
  call: runMatrixQaE2eeMediaHoldScenario
  args:
    - expr: "scenarioContext"
