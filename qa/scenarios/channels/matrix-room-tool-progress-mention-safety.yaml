title: Matrix streaming keeps tool-progress mentions inert
scenario:
  id: matrix-room-tool-progress-mention-safety
  surface: channels
  coverage:
    primary:
      - matrix.message-presentation-metadata
  execution:
    kind: flow
    channel: matrix
    timeoutMs: 60000
    retryCount: 0
    suiteIsolation: isolated
    isolationReason: Changes Matrix streaming progress configuration and must not race an active shared-worker turn during channel reload.
    config:
      matrixConfigOverrides:
        streaming:
          mode: partial
          progress:
            commandText: raw
        toolProfile: coding

flow:
  module: ./live-transports/matrix/scenarios/scenario-runtime-room.js
  call: runToolProgressMentionSafetyScenario
  args:
    - expr: "scenarioContext"
