title: Slack disabled channel warns and does not trigger
scenario:
  id: slack-channel-disabled-warning
  surface: channels
  coverage:
    primary:
      - slack.channel-allowlists
  execution:
    kind: flow
    channel: slack
    # Leave the fixed negative-observation window enough time to run its
    # structured-log verifier before the enclosing flow deadline expires.
    timeoutMs: 20000
    retryCount: 1
    suiteIsolation: isolated
flow:
  module: ./live-transports/slack/scenario-runtime.js
  call: runSlackScenario
  args:
    - { expr: slackScenarioContext }
    - { moduleExport: slackQaChannelDisabledWarningScenario }
