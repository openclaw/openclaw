title: Slack unmentioned thread follow-up admitted via workspace participation
scenario:
  id: slack-thread-participation-workspace
  surface: channels
  coverage:
    primary:
      - slack.mention-gating
    secondary:
      - slack.thread-participation
  execution:
    kind: flow
    channel: slack
    timeoutMs: 180000
    retryCount: 0
    suiteIsolation: isolated
flow:
  module: ./live-transports/slack/scenario-runtime.js
  call: runSlackScenario
  args:
    - { expr: slackScenarioContext }
    - { moduleExport: slackQaThreadParticipationWorkspaceScenario }
