title: Telegram history replays a core-named plugin's media path as unchanged text

scenario:
  id: telegram-plugin-core-name-media-history
  surface: channels
  coverage:
    primary:
      - plugins.plugin-tools
    secondary:
      - channels.media-roots
      - telegram.media-and-rich-content
  regressionRefs:
    - openclaw/openclaw#101866
  objective: Verify that a managed image path returned by a non-bundled plugin tool registered under a core tool name reaches the next turn's provider request as unchanged text, never as an image or file input.
  successCriteria:
    - music_generate runs from the run-owned fixture plugin, since no music provider gives the run a core tool of that name.
    - The first reply, delivered through the real Telegram plugin, names the plugin's image under the managed media store.
    - The second turn's final provider request carries no input_image or input_file part.
    - That request's channel history, replayed in the current turn's runtime context, carries the first reply with the plugin path byte for byte.
    - The earlier assistant message in that request carries the first reply unchanged too.
  docsRefs:
    - docs/channels/telegram.md
    - docs/plugins/building-plugins.md
    - docs/reference/prompt-caching.md
  codeRefs:
    - src/plugins/tools.ts
    - src/agents/embedded-agent-tool-media.ts
    - src/agents/embedded-agent-runner/run/images.ts
    - src/channels/inbound-event/session-transcript-context.runtime.ts
    - extensions/qa-lab/src/providers/mock-openai/mock-openai-tool-plan.ts
  execution:
    kind: flow
    channel: telegram
    providerMode: mock-openai
    retryCount: 0
    timeoutMs: 240000
    suiteIsolation: isolated
    isolationReason: Installs a run-owned plugin that registers music_generate and restarts the ephemeral Gateway.
    transportPolicy:
      directMessageOnly: true
    summary: Through Crabline Telegram and mock-openai, call a non-bundled music_generate that returns a managed image, then inspect the next turn's final provider request.
    config:
      requiredProviderMode: mock-openai
      requiredChannelDriver: crabline
      conversationId: "100001"
      senderId: "100001"
      pluginId: qa-core-named-media
      toolDescription: QA core-named media fixture returns one managed image.
      pngBase64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO7Z0nQAAAAASUVORK5CYII=
      fixtureSource: |-
        import { definePluginEntry } from "__PLUGIN_ENTRY_URL__";
        export default definePluginEntry({
          id: "qa-core-named-media",
          name: "QA core-named media fixture",
          register(api) {
            const { mediaPath, description } = api.pluginConfig;
            api["registerTool"]({
              name: "music_generate",
              label: "music_generate",
              description,
              parameters: { type: "object", properties: { prompt: { type: "string" } } },
              execute: async () => ({
                content: [{ type: "text", text: `Generated music at ${mediaPath}` }],
                details: { media: { mediaUrls: [mediaPath] } },
              }),
            }, { name: "music_generate" });
          },
        });

flow:
  steps:
    - name: a non-bundled plugin serves music_generate
      actions:
        - assert:
            expr: env.providerMode === config.requiredProviderMode
            message: this deterministic history proof requires mock-openai
        - call: waitForGatewayHealthy
          args: [{ ref: env }, 60000]
        - call: waitForTransportReady
          args: [{ ref: env }, 60000]
        - set: marker
          value:
            expr: "`QA-CORE-NAMED-${randomUUID().slice(0, 8)}`"
        - set: pluginPath
          value:
            expr: path.join(env.gateway.runtimeEnv.OPENCLAW_STATE_DIR, "media", "generated", `${marker.toLowerCase()}.png`)
        - set: fixtureDir
          value:
            expr: path.join(env.gateway.tempRoot, config.pluginId)
        - call: env.gateway.restartAfterStateMutation
          args:
            - lambda:
                async: true
                params: [ctx]
                expr: |-
                  (async () => {
                    const { pathToFileURL } = await qaImport("node:url");
                    const pluginEntryUrl = pathToFileURL(path.join(env.repoRoot, "dist/plugin-sdk/plugin-entry.js")).href;
                    await fs.mkdir(fixtureDir, { recursive: true });
                    await fs.writeFile(path.join(fixtureDir, "index.js"), config.fixtureSource.replace("__PLUGIN_ENTRY_URL__", pluginEntryUrl), "utf8");
                    await fs.writeFile(path.join(fixtureDir, "package.json"), JSON.stringify({ name: "@openclaw/qa-core-named-media-fixture", version: "0.0.0", type: "module", openclaw: { extensions: ["./index.js"] } }), "utf8");
                    await fs.writeFile(path.join(fixtureDir, "openclaw.plugin.json"), JSON.stringify({
                      id: config.pluginId,
                      activation: { onStartup: true },
                      contracts: { tools: ["music_generate"] },
                      configSchema: {
                        type: "object", additionalProperties: false,
                        required: ["mediaPath", "description"],
                        properties: { mediaPath: { type: "string" }, description: { type: "string" } },
                      },
                    }), "utf8");
                    await fs.mkdir(path.dirname(pluginPath), { recursive: true });
                    await fs.writeFile(pluginPath, Buffer.from(config.pngBase64, "base64"));
                    const cfg = JSON.parse(await fs.readFile(ctx.configPath, "utf8"));
                    cfg.plugins ??= {};
                    cfg.plugins.allow = [...new Set([...(cfg.plugins.allow ?? []), config.pluginId])];
                    cfg.plugins.load ??= {};
                    cfg.plugins.load.paths = [...new Set([...(cfg.plugins.load.paths ?? []), fixtureDir])];
                    cfg.plugins.entries ??= {};
                    cfg.plugins.entries[config.pluginId] = { enabled: true, config: { mediaPath: pluginPath, description: config.toolDescription } };
                    cfg.tools ??= {};
                    cfg.tools.alsoAllow = [...new Set([...(cfg.tools.alsoAllow ?? []), config.pluginId])];
                    await fs.writeFile(ctx.configPath, `${JSON.stringify(cfg, null, 2)}\n`, "utf8");
                  })()
        - call: waitForGatewayHealthy
          args: [{ ref: env }, 60000]
        - call: waitForTransportReady
          args: [{ ref: env }, 60000]
        - resetTransport: true
      detailsExpr: "`fixture ${config.pluginId} serves ${pluginPath}`"
    - name: the next provider request replays the path as text
      actions:
        - set: firstCursor
          value:
            expr: "(await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor"
        - set: firstIndex
          value:
            expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound').length"
        - sendInbound:
            conversation:
              id: { ref: config.conversationId }
              kind: direct
            senderId: { ref: config.senderId }
            senderName: QA Media Trust Operator
            text:
              expr: |-
                'QA tool plan: ' + JSON.stringify({ calls: [{ name: 'music_generate', args: { prompt: 'QA trust melody' } }], reply: `${marker} plugin {{media:0}}` })
        - waitForOutbound:
            conversation:
              id: { ref: config.conversationId }
              kind: direct
            sinceIndex: { ref: firstIndex }
            textIncludes: { ref: marker }
            timeoutMs:
              expr: liveTurnTimeoutMs(env, 90000)
          saveAs: firstReply
        - set: firstRequests
          value:
            expr: "await fetchJson(`${env.mock.baseUrl}/debug/requests?after=${firstCursor}`)"
        - assert:
            expr: "firstRequests.some((request) => String(request.toolOutput ?? '').includes(`Generated music at ${pluginPath}`))"
            message:
              expr: "`music_generate did not run from the fixture plugin; tool outputs: ${JSON.stringify(firstRequests.map((request) => String(request.toolOutput ?? '').slice(0, 300)))}`"
        - assert:
            expr: firstReply.text.includes(pluginPath)
            message:
              expr: "`first reply did not name the plugin path: ${firstReply.text}`"
        - set: secondCursor
          value:
            expr: "(await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor"
        - set: secondIndex
          value:
            expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound').length"
        - set: secondMarker
          value:
            expr: "`${marker}-SECOND`"
        - sendInbound:
            conversation:
              id: { ref: config.conversationId }
              kind: direct
            senderId: { ref: config.senderId }
            senderName: QA Media Trust Operator
            text:
              expr: "`Reply exactly: ${secondMarker}`"
        - waitForOutbound:
            conversation:
              id: { ref: config.conversationId }
              kind: direct
            sinceIndex: { ref: secondIndex }
            textIncludes: { ref: secondMarker }
            timeoutMs:
              expr: liveTurnTimeoutMs(env, 60000)
        - set: secondRequest
          value:
            expr: "(await fetchJson(`${env.mock.baseUrl}/debug/requests?after=${secondCursor}`)).findLast((request) => String(request.prompt ?? '').includes(secondMarker))"
        - assert:
            expr: Boolean(secondRequest)
            message: no provider request carried the second prompt
        - set: mockInput
          value:
            expr: await qaImport("./providers/mock-openai/mock-openai-input.js")
        - set: secondInput
          value:
            expr: mockInput.normalizeResponsesInput(secondRequest.body?.input)
        - set: mediaParts
          value:
            expr: |-
              JSON.stringify(secondInput).match(/"type":"input_(?:image|file)"/g) ?? []
        - assert:
            expr: "mediaParts.length === 0 && secondRequest.imageInputCount === 0"
            message:
              expr: "`the replayed plugin path became provider media: ${JSON.stringify({ mediaParts, imageInputCount: secondRequest.imageInputCount })}`"
        - set: firstReplyText
          value:
            expr: "`${marker} plugin ${pluginPath}`"
        - set: history
          value:
            expr: "mockInput.extractCurrentRuntimeContextTexts(secondInput).join('\\n')"
        - assert:
            expr: history.includes(firstReplyText)
            message:
              expr: "`the current turn's channel history did not replay the first reply unchanged (${firstReplyText}): ${history.slice(-600)}`"
        - set: assistantJson
          value:
            expr: "JSON.stringify(secondInput.filter((item) => item.role === 'assistant'))"
        - assert:
            # Compare in the JSON encoding, which escapes Windows separators.
            expr: assistantJson.includes(JSON.stringify(firstReplyText).slice(1, -1))
            message:
              expr: "`the earlier assistant message did not carry the first reply unchanged (${firstReplyText}): ${assistantJson.slice(0, 600)}`"
      detailsExpr: "JSON.stringify({ pluginPath, mediaParts: mediaParts.length, imageInputCount: secondRequest.imageInputCount, history: history.slice(Math.max(0, history.indexOf(firstReplyText) - 80), history.indexOf(firstReplyText) + firstReplyText.length) })"
