title: Telegram context command reply

scenario:
  id: telegram-context-command
  surface: channels
  category: channels.channel-actions-commands-and-approvals
  coverage:
    primary:
      - telegram.built-in-commands
  objective: Verify Telegram returns the prompt budget through native command routing.
  successCriteria:
    - The context command returns the prompt budget card.
    - The context command returns the context list shortcut.
  codeRefs:
    - src/auto-reply/reply/commands-context-report.ts
    - extensions/qa-lab/src/live-transports/telegram/adapter.runtime.ts
  execution:
    kind: flow
    channel: telegram
    summary: Run Telegram context and verify the prompt budget and list shortcut.
    config:
      expectedAll: [Prompt budget, /context list]

flow:
  steps:
    - name: context returns prompt budget
      actions:
        - resetTransport: true
        - set: startIndex
          value:
            expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound').length"
        - sendInbound:
            conversation: { id: telegram-command-room, kind: channel }
            senderId: qa-command-operator
            senderName: QA Command Operator
            text: /context
            nativeCommand: { name: context }
        - waitForOutbound:
            conversation: { id: telegram-command-room, kind: channel }
            sinceIndex: { ref: startIndex }
            textIncludes: /context list
            timeoutMs: 60000
          saveAs: reply
        - assert:
            expr: "config.expectedAll.every((needle) => reply.text.includes(needle))"
            message:
              expr: "`context reply missing expected text: ${reply.text}`"
      detailsExpr: reply.text
