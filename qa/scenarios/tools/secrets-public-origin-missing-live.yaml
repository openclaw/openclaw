title: Missing secure-input route reaches the agent and the chat

scenario:
  id: secrets-public-origin-missing-live
  surface: tools
  coverage:
    secondary:
      - security.secrets-storage
  objective: Verify an embedded agent receives actionable capability guidance when a chat credential request has no configured Control UI origin.
  gatewayConfigPatch:
    gateway:
      controlUi:
        enabled: true
    tools:
      codeMode: false
      toolSearch: false
  successCriteria:
    - The live agent calls secrets.request for a synthetic entry.
    - The correlated model-visible result names the missing route and a safe next step.
    - The originating chat receives the blocker and a completed reply without collecting a value.
  docsRefs:
    - docs/tools/secrets.md
  codeRefs:
    - src/agents/tools/secrets-tool.ts
    - src/agents/tools/question-prompt-send.ts
    - src/agents/agent-tool-definition-adapter.ts
  execution:
    kind: flow
    runtime: openclaw
    suiteIsolation: isolated
    isolationReason: Requires an absent public origin and an empty credential store.
    channel: qa-channel
    retryCount: 0
    summary: Request a synthetic entry through a real embedded agent and inspect its tool result and completed chat delivery.
    config:
      requiredProviderMode: live-frontier

flow:
  steps:
    - name: reports the unavailable entry route to both recipients
      actions:
        - assert:
            expr: "env.providerMode === config.requiredProviderMode"
            message: This scenario requires a live model.
        - call: waitForGatewayHealthy
          args: [{ ref: env }, 120000]
        - call: waitForTransportReady
          args: [{ ref: env }, 120000]
        - set: hasPublicOrigin
          value:
            expr: "Boolean((await env.gateway.call('config.get', {})).config?.gateway?.publicOrigin)"
        - assert:
            expr: "!hasPublicOrigin"
            message: The isolated Gateway must not have a public origin.
        - resetTransport: true
        - sendInbound:
            conversation:
              id: qa-secure-input
              kind: direct
            senderId: qa-operator
            senderName: QA Operator
            text: 'Call secrets once with action=request, name=QA_SECURE_INPUT_PROBE, reason="QA secure-input check", timeoutSeconds=30. Then explain the result and next step. Do not retry, change configuration, or request credentials in chat.'
          saveAs: inbound
        - call: transport.waitForCompletedReply
          args:
            - inbound: { ref: inbound }
              gateway: { expr: env.gateway }
              timeoutMs: { expr: "liveTurnTimeoutMs(env, 180000)" }
          saveAs: reply
        - call: readSessionToolActivity
          args: [{ ref: env }, "agent:qa:main"]
          saveAs: activity
        - set: requests
          value:
            expr: "activity.filter((call) => call.toolName === 'secrets' && call.input?.action === 'request' && call.input?.name === 'QA_SECURE_INPUT_PROBE')"
        - assert:
            expr: "requests.length === 1 && requests[0].completed"
            message: The agent must complete exactly one synthetic credential request.
        - set: modelResult
          value:
            expr: "JSON.stringify(requests[0].result?.content)"
        - assert:
            expr: "modelResult.includes('gateway.publicOrigin') && modelResult.includes('Open a trusted Control UI or native app and retry') && modelResult.includes('Never send credentials in chat')"
            message: The model-visible tool result lost the secure-input capability guidance.
        - set: outbound
          value:
            expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound' && !message.deleted && message.conversation.id === inbound.conversation.id)"
        - assert:
            expr: "outbound.some((message) => message.text.includes('Credential request unavailable here')) && Boolean(reply.text.trim())"
            message: The originating chat did not receive the blocker and a completed reply.
      detailsExpr: "JSON.stringify({ modelResult, reply: reply.text, outboundCount: outbound.length })"
