title: Cloud worker mid-turn machine loss

scenario:
  id: cloud-worker-midturn-loss
  surface: gateway
  category: gateway.session-apis
  coverage:
    secondary:
      - gateway.session-apis-sessions-list
  objective: Prove a paired-node worker can disappear during a streamed turn without losing or duplicating its already committed transcript prefix, silently hanging the turn, or breaking redispatch context; prove that real worker disk-space projections are evicted after reclaim.
  successCriteria:
    - A managed-worktree qa-channel session dispatches to a real paired-node worker through an isolated Gateway.
    - The mock model persists two assistant/tool-result checkpoints, then pauses during a fifth streamed message.
    - Killing the proof-owned worker process preserves the exact committed history prefix, including all four checkpoint messages once and in order, before its paired node disconnects.
    - The interrupted streamed message and one same-run visible failure notice are appended to durable history in order, while the turn emits a chat error and the placement records a bounded terminal reason.
    - Reconnecting the same paired node and redispatching the session produces one successful recovery turn whose inference context contains each checkpoint exactly once, excluding the display-only interrupted text and failure notice.
    - The real paired-node worker runs the disk-space probe and exposes its projection through `sessions.list`.
    - Reclaiming the worker causes a later `sessions.list` read to return the reclaimed placement without a stale disk-space projection.
  docsRefs:
    - docs/gateway/cloud-workers/session-lifecycle.md
    - docs/concepts/qa-e2e-automation.md
    - docs/channels/qa-channel.md
  codeRefs:
    - src/worker/embedded-agent-transcript.runtime.ts
    - src/gateway/worker-environments/transcript-commit.ts
    - src/gateway/worker-environments/worker-turn-launcher.ts
    - src/gateway/worker-environments/placement-disk-space.ts
    - src/gateway/session-row-projection.ts
    - test/e2e/qa-lab/runtime/cloud-worker-midturn-loss-proof.ts
  execution:
    kind: script
    path: test/e2e/qa-lab/runtime/cloud-worker-midturn-loss-proof.ts
    summary: Dispatches a managed-worktree qa-channel session to a proof-owned paired-node worker, kills its process and disconnects its node during a streamed message, and verifies the exact committed prefix, interrupted-reply preservation, visible failure, and redispatch context.
    timeoutMs: 900000
    args:
      - --artifact-base
      - ${outputDir}
