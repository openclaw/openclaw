title: OTEL trace smoke

scenario:
  id: otel-trace-smoke
  surface: telemetry
  coverage:
    primary:
      - observability.otlp-http-traces-otel
    secondary:
      - observability.otlp-http-traces-qa-lab
  objective: Verify a real QA-channel agent turn exports privacy-safe, protobuf-decoded traces to a bounded local OTLP receiver.
  successCriteria:
    - The diagnostics-otel plugin starts with trace, metric, and log export enabled.
    - A minimal QA-channel agent turn completes.
    - A local receiver accepts and decodes a real OTLP protobuf trace from that agent turn.
    - The received trace contains the canonical OpenClaw run span.
    - Raw prompt content capture remains disabled and the secret marker is absent from exported trace bytes.
  plugins:
    - diagnostics-otel
  gatewayConfigPatch:
    logging:
      file: .artifacts/qa-e2e/otel-smoke-gateway.jsonl
      level: info
    diagnostics:
      enabled: true
      otel:
        enabled: true
        protocol: http/protobuf
        traces: true
        metrics: true
        logs: true
        sampleRate: 1
        flushIntervalMs: 1000
        captureContent: false
  docsRefs:
    - docs/gateway/opentelemetry.md
    - docs/concepts/qa-e2e-automation.md
  codeRefs:
    - extensions/diagnostics-otel/src/service.ts
    - test/e2e/qa-lab/runtime/qa-otel-smoke-runtime.ts
    - extensions/qa-lab/src/otel-trace-receiver.ts
    - extensions/qa-lab/src/suite.ts
  execution:
    kind: flow
    summary: Receive and decode privacy-safe real OTLP traces from a QA-channel agent turn.
    config:
      prompt: "OTEL QA marker: reply exactly `OTEL-QA-OK`. Do not repeat OTEL-QA-SECRET."
      expectedReply: OTEL-QA-OK

flow:
  steps:
    - name: receives real OTLP traces from a privacy-safe qa-channel turn
      actions:
        - call: startQaOtlpTraceReceiver
          saveAs: otelReceiver
          args:
            - disallowedNeedles:
                - OTEL-QA-SECRET
        - call: restartGatewayWithConfigPatch
          args:
            - env:
                ref: env
              patch:
                diagnostics:
                  otel:
                    endpoint:
                      expr: otelReceiver.endpoint
        - call: waitForGatewayHealthy
          args:
            - ref: env
            - 60000
        - call: waitForQaChannelReady
          args:
            - ref: env
            - 60000
        - call: reset
        - set: startCursor
          value:
            expr: state.getSnapshot().messages.length
        - call: runAgentPrompt
          args:
            - ref: env
            - sessionKey: agent:qa:otel-trace-smoke
              message:
                expr: config.prompt
              timeoutMs:
                expr: liveTurnTimeoutMs(env, 30000)
        - call: waitForCondition
          saveAs: outbound
          args:
            - lambda:
                expr: "state.getSnapshot().messages.slice(startCursor).filter((candidate) => candidate.direction === 'outbound' && candidate.conversation.id === 'qa-operator' && String(candidate.text ?? '').trim().length > 0).at(-1)"
            - expr: liveTurnTimeoutMs(env, 30000)
            - expr: "env.providerMode === 'mock-openai' ? 100 : 250"
        - assert:
            expr: "String(outbound.text ?? '').trim().length > 0"
            message: "expected non-empty qa output"
        - assert:
            expr: "String(outbound.text ?? '').includes(config.expectedReply)"
            message: "expected qa output to include the response sentinel"
        - call: waitForCondition
          saveAs: exportedSpans
          args:
            - lambda:
                expr: "otelReceiver.spans.some((span) => span.name === 'openclaw.run') ? [...otelReceiver.spans] : undefined"
            - expr: liveTurnTimeoutMs(env, 30000)
            - 100
        - assert:
            expr: "exportedSpans.some((span) => span.name === 'openclaw.run')"
            message: expected the real QA agent turn to export a decoded openclaw.run trace span
        - assert:
            expr: "otelReceiver.requests.some((request) => request.path === '/v1/traces' && request.status === 200 && request.spanCount > 0)"
            message: expected a successful OTLP protobuf trace request containing real spans
        - assert:
            expr: "otelReceiver.leakedNeedles.size === 0"
            message: privacy-disabled trace export leaked the secret QA prompt marker
