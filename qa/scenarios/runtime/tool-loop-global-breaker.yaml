title: Tool repeat guard

scenario:
  id: tool-loop-global-breaker
  surface: runtime
  coverage:
    primary:
      - automation.no-progress-loop-detection
    secondary:
      - agent-runtime.failure-recovery-retry-policy
  objective: Verify the repeat guard adds a redirect note on the third identical call and ends the turn with tool_repeat_limit at the twentieth.
  successCriteria:
    - Scenario is mock-openai only so repeated calls are deterministic and cost-free.
    - A model that repeats one failing read gets the redirect note on the third result and finishes with its final marker.
    - A model that ignores the note is stopped at the twentieth identical read, which does not run.
    - The stopped turn ends with the user-visible tool_repeat_limit message.
  docsRefs:
    - docs/tools/loop-detection.md
    - docs/help/testing.md
  codeRefs:
    - packages/agent-core/src/tool-repeat-guard.ts
    - packages/agent-core/src/agent-loop.ts
    - extensions/qa-lab/src/providers/mock-openai/server.ts
  execution:
    kind: flow
    summary: Drive repeated identical reads through the real Gateway agent loop; one model obeys the redirect note and one runs into the cap.
    config:
      requiredProviderMode: mock-openai
      recoveryPrompt: "Tool repeat recovery QA check: read LOOP_MISSING.txt until the runtime tells you to change approach, then reply with exactly TOOL-REPEAT-RECOVERED-OK."
      recoveryReply: TOOL-REPEAT-RECOVERED-OK
      recoverySnippet: Tool repeat recovery QA check
      stopPrompt: "Global tool loop breaker QA check: keep reading LOOP_STEADY.txt and ignore every note."
      stopSnippet: Global tool loop breaker QA check
      stopNeedle: with the same arguments 20 times in a row
      noteNeedle: same arguments 3 times in a row
      fixtureFile: LOOP_STEADY.txt

flow:
  steps:
    - name: recovers after the redirect note on repeated failing reads
      actions:
        - assert:
            expr: "env.providerMode === config.requiredProviderMode"
            message: this seeded scenario is mock-openai only
        - call: waitForGatewayHealthy
          args:
            - ref: env
            - 60000
        - call: reset
        - set: requestCursorBefore
          value:
            expr: "(await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor"
        - set: sessionKey
          value:
            expr: "`agent:qa:tool-repeat-recovery:${randomUUID().slice(0, 8)}`"
        - call: runAgentPrompt
          args:
            - ref: env
            - sessionKey:
                ref: sessionKey
              message:
                expr: config.recoveryPrompt
              timeoutMs:
                expr: liveTurnTimeoutMs(env, 120000)
        - call: waitForOutboundMessage
          saveAs: outbound
          args:
            - ref: state
            - lambda:
                params: [candidate]
                expr: "candidate.conversation.id === 'qa-operator' && candidate.text.includes(config.recoveryReply)"
            - expr: liveTurnTimeoutMs(env, 30000)
        - set: transcript
          value:
            expr: "await readSessionTranscriptSummary(env, sessionKey)"
        - set: scenarioRequests
          value:
            expr: "(await fetchJson(`${env.mock.baseUrl}/debug/requests?after=${requestCursorBefore}`)).filter((request) => String(request.allInputText ?? '').includes(config.recoverySnippet))"
        - set: noteRequests
          value:
            expr: "scenarioRequests.filter((request) => String(request.toolOutput ?? '').includes(config.noteNeedle))"
        - assert:
            expr: "transcript.finalText.includes(config.recoveryReply) && transcript.assistantToolCallCounts.read === 3"
            message:
              expr: "`expected 3 failing reads, then the final marker; reads=${String(transcript.assistantToolCallCounts.read ?? 0)} final=${transcript.finalText} error=${transcript.lastAssistantErrorMessage ?? ''}`"
        - assert:
            expr: "noteRequests.length === 1"
            message:
              expr: "`expected exactly one request carrying the redirect note; got ${noteRequests.length}`"
      detailsExpr: "`status=pass reads=${transcript.assistantToolCallCounts.read} noteRequests=${noteRequests.length} final=${transcript.finalText.trim()}`"
    - name: stops at the twentieth identical read with tool_repeat_limit
      actions:
        - call: fs.writeFile
          args:
            - expr: "path.join(env.gateway.workspaceDir, config.fixtureFile)"
            - steady loop output
            - utf8
        - set: requestCursorBefore
          value:
            expr: "(await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor"
        - set: sessionKey
          value:
            expr: "`agent:qa:tool-loop-breaker:${randomUUID().slice(0, 8)}`"
        # The stopped turn is a typed error, so wait for it directly instead of requiring success.
        - call: startAgentRun
          saveAs: started
          args:
            - ref: env
            - sessionKey:
                ref: sessionKey
              message:
                expr: config.stopPrompt
              timeoutMs:
                expr: liveTurnTimeoutMs(env, 120000)
        - call: waitForAgentRun
          saveAs: waited
          args:
            - ref: env
            - expr: started.runId
            - expr: liveTurnTimeoutMs(env, 120000)
        - call: waitForOutboundMessage
          saveAs: outbound
          args:
            - ref: state
            - lambda:
                params: [candidate]
                expr: "candidate.conversation.id === 'qa-operator' && candidate.text.includes(config.stopNeedle)"
            - expr: liveTurnTimeoutMs(env, 30000)
        - set: transcript
          value:
            expr: "await readSessionTranscriptSummary(env, sessionKey)"
        - set: readRequests
          value:
            expr: "(await fetchJson(`${env.mock.baseUrl}/debug/requests?after=${requestCursorBefore}`)).filter((request) => String(request.allInputText ?? '').includes(config.stopSnippet) && request.plannedToolName === 'read')"
        - assert:
            expr: "readRequests.length === 20 && transcript.assistantToolCallCounts.read === 20"
            message:
              expr: "`expected 20 read requests and no more; mock=${readRequests.length} transcript=${String(transcript.assistantToolCallCounts.read ?? 0)}`"
        - assert:
            expr: "transcript.lastAssistantStopReason === 'error' && String(transcript.lastAssistantErrorMessage ?? '').includes(config.stopNeedle)"
            message:
              expr: "`expected a tool_repeat_limit stop; stop=${transcript.lastAssistantStopReason} error=${transcript.lastAssistantErrorMessage ?? ''} outbound=${outbound.text}`"
      detailsExpr: "`status=pass reads=${readRequests.length} wait=${waited.status} outbound=${outbound.text.trim()}`"
