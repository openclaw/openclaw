title: Gateway agent and automation RPC evidence

scenario:
  id: gateway-rpc-automation
  surface: gateway
  category: gateway.gateway-rpc-apis-and-events
  coverage:
    primary:
      - gateway.agent-and-automation-apis
  objective: Verify the real Gateway persists cron RPC mutations, routes the legacy wake RPC to ordinary session execution, and cancels a Gateway-created agent run.
  successCriteria:
    - Cron add, get, list, update, and remove RPCs expose the persisted job state after each mutation.
    - A legacy wake RPC with mode now reaches the real provider and commits its concrete reply to the explicitly requested session.
    - Ordinary session completion does not fabricate a legacy heartbeat reporting event.
    - This scenario proves session history, with no external channel delivery claim.
    - A real agent RPC returns the admitted run identity.
    - chat.abort cancels that exact session run, and agent.wait observes its terminal lifecycle.
  docsRefs:
    - docs/gateway/protocol.md
    - docs/automation/cron-jobs.md
    - docs/concepts/session.md
  codeRefs:
    - src/gateway/server-methods/cron.ts
    - src/gateway/server-methods/chat-abort-runtime.ts
    - test/e2e/qa-lab/runtime/gateway-rpc-automation.e2e.test.ts
  execution:
    kind: vitest
    path: test/e2e/qa-lab/runtime/gateway-rpc-automation.e2e.test.ts
    summary: Run one isolated real-Gateway scenario over cron CRUD, legacy-wake session execution, and Gateway-created agent run admission, abort, and wait.
