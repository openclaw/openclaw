title: "Runtime tool fixture — session_status"

scenario:
  id: runtime-tool-session-status
  surface: runtime-tools
  runtimePairLane: core
  coverage:
    primary:
      - gateway.session-apis-session-status
  objective: Verify session_status preserves arguments and result shape across OpenClaw and Codex.
  successCriteria:
    - Effective tools expose session_status.
    - Live Codex proof records matching tool_search call/output receipts linked to both target results.
    - The mock provider plans exactly one happy-path session_status call.
    - The mock provider plans one denied-input failure-path session_status call.
    - Runtime parity coverage hard-fails call/result drift in the core runtime-pair lane.
  docsRefs:
    - qa/scenarios/index.yaml
  codeRefs:
    - src/agents/tools/session-status-tool.ts
    - extensions/qa-lab/src/runtime-tool-fixture.ts
  execution:
    kind: flow
    liveConfiguredRuntime:
      id: codex
      model: openai/gpt-5.5
    summary: >-
      For native Codex discovery proof, select --provider-mode live-frontier --model openai/gpt-5.5 --alt-model openai/gpt-5.5.
      Other model selections retain their general runtime route.
      Exercise the session_status runtime tool family.
    config:
      toolName: session_status
      toolCoverage:
        family: session_status
        actualTool: session_status
        bucket: openclaw-dynamic-integration
        expectedLayer: openclaw-dynamic
        capabilityLayer: openclaw-dynamic-searchable
        required: true
        codexDefaultImpact: P4
        qaImpact: P1
        action: hard gate searchable discovery and call/result proof in live Codex plus the core runtime-pair lane
        reason: session_status is deferred behind the OpenClaw namespace for Codex and must be discovered before its target call/result can count as live proof.
      promptSnippet: "target=session_status"
      failurePromptSnippet: "failure target=session_status"

flow:
  steps:
    - name: exercises session_status happy and failure paths
      actions:
        - call: runRuntimeToolFixture
          saveAs: result
          args:
            - ref: env
            - ref: config
      detailsExpr: result
