title: "Runtime tool fixture — web_search"

scenario:
  id: runtime-tool-web-search
  surface: runtime-tools
  runtimePairLane: core
  coverage:
    primary:
      - web-search.web-search-exposure
  objective: Verify web_search preserves arguments and result shape across OpenClaw and Codex.
  successCriteria:
    - Effective tools expose web_search.
    - Live Codex proof records matching tool_search call/output receipts linked to both target results.
    - The mock provider plans exactly one happy-path web_search call.
    - The mock provider plans one denied-input failure-path web_search call.
    - Runtime parity coverage hard-fails call/result drift in the core runtime-pair lane.
  plugins:
    - qa-lab
  gatewayConfigPatch:
    tools:
      web:
        search:
          enabled: true
          provider: qa-lab-search
  docsRefs:
    - qa/scenarios/index.yaml
  codeRefs:
    - src/agents/tools/web-search.ts
    - extensions/qa-lab/src/qa-web-search-provider.ts
    - extensions/qa-lab/src/runtime-tool-fixture.ts
  execution:
    kind: flow
    liveConfiguredRuntime:
      id: codex
      model: openai/gpt-5.5
    summary: >-
      For native Codex discovery proof, select --provider-mode live-frontier --model openai/gpt-5.5 --alt-model openai/gpt-5.5.
      Other model selections retain their general runtime route.
      Exercise the web_search runtime tool family.
    config:
      toolName: web_search
      toolCoverage:
        family: web_search
        actualTool: web_search
        bucket: openclaw-dynamic-integration
        expectedLayer: openclaw-dynamic
        capabilityLayer: openclaw-dynamic-searchable
        required: true
        codexDefaultImpact: P4
        qaImpact: P1
        action: hard gate searchable discovery and call/result proof in live Codex plus the core runtime-pair lane
        reason: web_search is deferred behind the OpenClaw namespace for Codex and must be discovered before its target call/result can count as live proof.
      promptSnippet: "target=web_search"
      failurePrompt: "tool search qa failure target=web_search. Call web_search exactly once with query OPENCLAW_QA_WEB_SEARCH_DENIED_INPUT and then summarize the failure."
      failurePromptSnippet: "failure target=web_search"

flow:
  steps:
    - name: exercises web_search happy and failure paths
      actions:
        - call: runRuntimeToolFixture
          saveAs: result
          args:
            - ref: env
            - ref: config
      detailsExpr: result
