retain_codable_properties: true
retain_swift_ui_previews: true
retain_objc_accessible: true
retain_unused_protocol_func_params: true
retain_assign_only_properties: true
relative_results: true
disable_update_check: true
# CI builds this index first: an explicit index path makes Periphery skip its build.
# Periphery excludes .build sources, including first-party plugin output.
index_store_path:
  - ../../.cache/periphery-swift/debug/index/store
index_exclude:
  - ../../.cache/periphery-swift/checkouts/**
report_include:
  - Sources/**
