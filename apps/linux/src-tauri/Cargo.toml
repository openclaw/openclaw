[package]
name = "openclaw-desktop-linux"
version = "0.1.0"
description = "OpenClaw desktop companion for Linux"
edition = "2021"
rust-version = "1.97.1"

[[bin]]
name = "openclaw-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
mdns-sd = { version = "0.21.3", default-features = false }
openclaw-gateway-client = { path = "../../../crates/openclaw-gateway-client" }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# macos-private-api backs Quick Chat's transparent window. Tauri gates
# `WebviewWindowBuilder::transparent` behind it on macOS, and the feature must
# stay in sync with `app.macOSPrivateApi` in tauri.conf.json or tauri-build
# fails. It is inert on Linux and Windows.
tauri = { version = "2.11.5", features = [
  "image-png",
  "macos-private-api",
  "tray-icon",
  "unstable",
] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }
# Defer Windows cleanup until the installer launches successfully.
# Return to crates.io once an eligible release includes this fix.
# Preserve 2.10.1's network features instead of enabling OS proxy discovery.
tauri-plugin-updater = { version = "=2.11.0", git = "https://github.com/steipete/plugins-workspace.git", rev = "63e8185eb184cf0af6b665f631e2314c7b14d9c6", default-features = false, features = ["rustls-tls", "zip"] }
tauri-plugin-window-state = "2.4.1"
tauri-utils = { version = "2.9.3", features = ["config-json5"] }
tokio = { version = "1.53.1", features = ["macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
uuid = { version = "1.26.1", features = ["v4"] }
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18.5", features = ["png"] }
gtk = "0.18.2"
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
x11 = { version = "2.21.0", features = ["xlib"] }
tauri-plugin-notifications = { git = "https://github.com/steipete/tauri-plugin-notifications.git", rev = "35d04a6af588a5d5d438da0320c7d95a877cfe14" }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSBitmapImageRep", "NSEvent", "NSImage", "NSImageRep", "NSPanel", "NSResponder", "NSSavePanel", "NSToolbar", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSDictionary", "NSError", "NSKeyValueObserving", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKDownload", "WKDownloadDelegate", "WKFrameInfo", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKSnapshotConfiguration", "WKNavigation", "WKNavigationDelegate", "WKScriptMessage", "WKScriptMessageHandler", "WKUserContentController", "objc2-app-kit", "block2"] }
security-framework = "3.7.0"
tauri-plugin-notifications = { git = "https://github.com/steipete/tauri-plugin-notifications.git", rev = "35d04a6af588a5d5d438da0320c7d95a877cfe14", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.61.2"
tauri-plugin-notifications = { git = "https://github.com/steipete/tauri-plugin-notifications.git", rev = "35d04a6af588a5d5d438da0320c7d95a877cfe14" }
