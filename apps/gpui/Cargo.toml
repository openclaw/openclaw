[package]
name = "openclaw-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Native OpenClaw Gateway chat client"

[workspace]

[dependencies]
gpui-kit = { version = "=0.6.6", features = ["tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-bash", "tree-sitter-markdown", "tree-sitter-markdown-inline", "tree-sitter-go", "tree-sitter-swift"] }
openclaw-gateway-client = { path = "../../crates/openclaw-gateway-client" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
async-channel = "2"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3.34", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
dirs = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
crypto_box = "0.9.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
rsa = { version = "0.9.10", default-features = false, features = ["std", "u64_digit"] }
url = "2"
percent-encoding = "2"
zeroize = "1"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }

# Match the TextView parser when projecting remote images to explicit links.
markdown = "=1.0.0"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "=0.57.0", default-features = false, features = ["os-webview"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDate", "NSUUID"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibilityProtocols", "NSAppearance", "NSApplication", "NSCell", "NSEvent", "NSImage", "NSMenu", "NSMenuItem", "NSView"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore"] }

# Local accessibility proof; replace these paths with upstream releases before shipping.
[patch.crates-io]
wry = { path = "/Users/steipete/Projects/oss/wry" }
gpui-component = { path = "/Users/steipete/Projects/oss/gpui-kit/crates/component" }
gpui-base = { path = "/Users/steipete/Projects/oss/gpui-kit/crates/base" }
gpui-kit-assets = { path = "/Users/steipete/Projects/oss/gpui-kit/crates/assets" }
gpui-pre-macos = { path = "/Users/steipete/Projects/oss/gpui-pre-macos" }
accesskit = { path = "/Users/steipete/Projects/oss/accesskit/common" }
accesskit_consumer = { path = "/Users/steipete/Projects/oss/accesskit/consumer" }
accesskit_macos = { path = "/Users/steipete/Projects/oss/accesskit/platforms/macos" }
