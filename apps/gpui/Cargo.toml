[package]
name = "openclaw-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Native OpenClaw Gateway chat client"

[workspace]

[dependencies]
gpui-kit = { version = "=0.6.6", features = ["tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-bash", "tree-sitter-markdown", "tree-sitter-markdown-inline", "tree-sitter-go", "tree-sitter-swift"] }
openclaw-gateway-client = { path = "../../crates/openclaw-gateway-client" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
async-channel = "2"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3.34", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
dirs = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
crypto_box = "0.9.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
rsa = { version = "0.9.10", default-features = false, features = ["std", "u64_digit"] }
url = "2"
percent-encoding = "2"
zeroize = "1"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }

# Match the TextView parser when projecting remote images to explicit links.
markdown = "=1.0.0"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "=0.57.0", default-features = false, features = ["os-webview"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDate", "NSUUID"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibilityProtocols", "NSAppearance", "NSApplication", "NSCell", "NSEvent", "NSImage", "NSMenu", "NSMenuItem", "NSView"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore"] }

# Pinned forks retain the tested accessibility and background-activation fixes.
# GPUI input: https://github.com/longbridge/gpui-kit/pull/3246 (reverted),
# followed by https://github.com/longbridge/gpui-kit/pull/3254.
# AccessKit: https://github.com/AccessKit/accesskit/pull/812.
# Wry: https://github.com/tauri-apps/wry/pull/1866.
[patch.crates-io]
wry = { git = "https://github.com/steipete/wry", rev = "77d9f7d4f349924aba40c2ade794de65ae700743" }
gpui-component = { git = "https://github.com/steipete/gpui-kit", rev = "9e8e78db77c97ccde8051ce6946a5e37e914500c" }
gpui-base = { git = "https://github.com/steipete/gpui-kit", rev = "9e8e78db77c97ccde8051ce6946a5e37e914500c" }
gpui-kit-assets = { git = "https://github.com/steipete/gpui-kit", rev = "9e8e78db77c97ccde8051ce6946a5e37e914500c" }
accesskit = { git = "https://github.com/steipete/accesskit", rev = "42d99621d8e7276649442c54967a44153cac6294" }
accesskit_consumer = { git = "https://github.com/steipete/accesskit", rev = "42d99621d8e7276649442c54967a44153cac6294" }
accesskit_macos = { git = "https://github.com/steipete/accesskit", rev = "42d99621d8e7276649442c54967a44153cac6294" }
