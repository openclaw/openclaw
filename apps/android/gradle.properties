org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED -XX:+UseParallelGC -XX:ReservedCodeCacheSize=512m
# Keep toolchain and plugin deprecations from returning as successful CI noise.
org.gradle.warning.mode=fail
# Gradle 9.9.2 internal dependency transport backoff; this does not retry tests.
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=5000
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
android.uniquePackageNames=false
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=false
android.newDsl=true
