rules:
  - id: openclaw-dangerous-host-env-override-pivots
    languages: [typescript, javascript]
    message: Review dangerous environment keys supplied as host-execution overrides; this boundary heuristic does not prove a sanitizer bypass.
    severity: ERROR
    # Inherited environment and policy blocklists are not caller-supplied overrides.
    # Match override keys at the existing boundaries, not comparisons or arbitrary strings.
    patterns:
      - pattern-either:
          - pattern: |
              sanitizeHostExecEnv({ ..., overrides: { ..., $KEY: $VALUE, ... }, ... })
          - pattern: |
              sanitizeSystemRunEnvOverrides({ ..., overrides: { ..., $KEY: $VALUE, ... }, ... })
      - metavariable-regex:
          metavariable: $KEY
          regex: >-
            (?i)^['"]?\s*(GIT_SSH_COMMAND|GIT_EXEC_PATH|GIT_TEMPLATE_DIR|YARN_RC_FILENAME|CC|CXX|CMAKE_C_COMPILER|CMAKE_CXX_COMPILER|RUSTC_WRAPPER|CARGO_BUILD_RUSTC|CARGO_BUILD_RUSTC_WRAPPER|MAKEFLAGS|MFLAGS|GIT_CONFIG_[A-Z0-9_]+|NPM_CONFIG_[A-Z0-9_]+|CARGO_REGISTRIES_[A-Z0-9_]+|TF_VAR_[A-Z0-9_]+)\s*['"]?$
    metadata:
      ghsa: GHSA-J425-WHC4-4JGC
      advisory-url: https://github.com/openclaw/openclaw/security/advisories/GHSA-J425-WHC4-4JGC
      detector-bucket: precise
      source-run: 2026-04-17T07-37-10Z
