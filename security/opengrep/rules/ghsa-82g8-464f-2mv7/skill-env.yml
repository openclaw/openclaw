rules:
  - id: openclaw-skill-env-host-injection
    languages: [typescript, javascript]
    message: Skill env overrides are copied into process.env without host-env safety sanitization.
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: $CONFIG.skills.entries
      - pattern: resolveSkillConfig(...)
      - pattern: skillConfig.env
      - pattern: skillConfig.apiKey
      - pattern: $ENTRY.metadata.primaryEnv
      - pattern: $ENTRY.metadata?.primaryEnv
      - pattern: $SNAPSHOT.skills
      - patterns:
          - pattern: $PARAM.skillConfig
      - patterns:
          - pattern-inside: |
              function $F(..., $ENTRY: SkillConfig, ...) { ... }
          - pattern: $ENTRY
    pattern-propagators:
      # OpenGrep's tuple loop bindings need explicit propagation into accumulated maps.
      - pattern: |
          for (const [$KEY, $VALUE] of Object.entries($INPUT)) {
            ...
            $OUTPUT[$ANY] = $VALUE;
            ...
          }
        from: $INPUT
        to: $OUTPUT
      - pattern: |
          for (const [$KEY, $VALUE] of Object.entries($INPUT)) {
            ...
            $OUTPUT[$KEY] = $ANY;
            ...
          }
        from: $INPUT
        to: $OUTPUT
      - pattern: $ENV[$KEY] = $VALUE
        from: $KEY
        to: $ENV
      - pattern: $ENV[$KEY] = $VALUE
        from: $VALUE
        to: $ENV
    pattern-sanitizers:
      - pattern: sanitizeSkillEnvOverrides(...).allowed
        exact: true
      - patterns:
          - pattern-inside: |
              const $RESULT = sanitizeSkillEnvOverrides(...);
              ...
          - pattern-not-inside: |
              const $RESULT = sanitizeSkillEnvOverrides(...);
              ...
              $RESULT.allowed = $OTHER;
              ...
          - pattern: $RESULT.allowed
        exact: true
    pattern-sinks:
      - patterns:
          - pattern: |
              for (const [$KEY, $VALUE] of Object.entries($ENV)) {
                ...
                process.env[$KEY] = $ANY;
                ...
              }
          - focus-metavariable: $ENV
      - patterns:
          - pattern: |
              for (const [$KEY, $VALUE] of Object.entries($ENV)) {
                ...
                process.env[$ANY] = $VALUE;
                ...
              }
          - focus-metavariable: $ENV
      - patterns:
          - pattern: process.env[$KEY] = $VALUE
          - focus-metavariable: $VALUE
      - patterns:
          - pattern: process.env[$KEY] = $VALUE
          - focus-metavariable: $KEY
      - patterns:
          - pattern: process.env.$KEY = $VALUE
          - focus-metavariable: $VALUE
      - patterns:
          - pattern: Object.assign(process.env, ..., $ENV, ...)
          - focus-metavariable: $ENV
      - patterns:
          - pattern: process.env = $ENV
          - focus-metavariable: $ENV
      - patterns:
          - pattern-inside: |
              const $HOST = process.env;
              ...
          - pattern-either:
              - pattern: $HOST[$KEY] = $VALUE
              - pattern: $HOST.$KEY = $VALUE
          - focus-metavariable: $VALUE
      - patterns:
          - pattern-inside: |
              const $HOST = process.env;
              ...
          - pattern: $HOST[$KEY] = $VALUE
          - focus-metavariable: $KEY
      - patterns:
          - pattern-inside: |
              const $HOST = process.env;
              ...
          - pattern: Object.assign($HOST, ..., $ENV, ...)
          - focus-metavariable: $ENV
    metadata:
      ghsa: GHSA-82G8-464F-2MV7
      advisory-url: https://github.com/openclaw/openclaw/security/advisories/GHSA-82G8-464F-2MV7
      detector-bucket: precise
      source-run: 2026-04-17T07-37-10Z
