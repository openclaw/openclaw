[package]
name = "openclaw-node-host"
version = "0.1.0"
description = "Reusable Rust OpenClaw node runtime and headless host"
edition = "2021"
rust-version = "1.93"
publish = false
license = "MIT"

[features]
default = ["builtin-transport"]
# The standalone openclaw-node requires this feature and owns its multi-thread
# executor and OS signals; embedders provide those policies themselves.
builtin-transport = [
  "openclaw-gateway-client/builtin-transport",
  "tokio/rt-multi-thread",
  "tokio/signal",
]

[dependencies]
futures-util = "0.3.34"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hmac = "0.13.0"
openclaw-gateway-client = { path = "../openclaw-gateway-client", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
zeroize = "1.9.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[bin]]
name = "openclaw-node"
path = "src/main.rs"
required-features = ["builtin-transport"]

[dev-dependencies]
tokio-tungstenite = "0.30.0"

[[test]]
name = "node_session"
required-features = ["builtin-transport"]

[[test]]
name = "node_lifecycle"
required-features = ["builtin-transport"]

[[test]]
name = "runtime_capacity"
required-features = ["builtin-transport"]
