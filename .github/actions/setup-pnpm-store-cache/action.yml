name: Setup pnpm
description: Prepare pnpm from the repository packageManager and restore its store cache.
inputs:
  package-manager-file:
    description: package.json file that owns the packageManager pnpm pin.
    required: false
    default: "package.json"
  lockfile-path:
    description: pnpm lockfile used to key the store cache.
    required: false
    default: "pnpm-lock.yaml"
  node-version:
    description: Expected Node.js version already installed by actions/setup-node.
    required: false
    default: ""
  cache-mode:
    description: Cache authority for this setup action (off, restore, or read-write).
    required: false
    default: "off"
outputs:
  pnpm-version:
    description: Resolved pnpm version activated by the setup action.
    value: ${{ steps.pnpm-version.outputs.pnpm-version }}
  project-dir:
    description: Directory containing the packageManager file used for pnpm resolution.
    value: ${{ steps.setup-pnpm.outputs.project-dir }}
  store-cache-hit:
    description: Whether the pnpm store cache restored an exact key.
    value: ${{ steps.pnpm-store-cache.outputs.cache-hit }}
  store-cache-primary-key:
    description: Exact pnpm store cache key used for restore/save.
    value: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}
  store-path:
    description: Configured pnpm store root, including bootstrap archives and registry metadata.
    value: ${{ steps.pnpm-store.outputs.path }}
runs:
  using: composite
  steps:
    - name: Validate pnpm setup inputs
      id: setup-pnpm
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.cache-mode }}
        PACKAGE_MANAGER_FILE: ${{ inputs.package-manager-file }}
        REQUESTED_NODE_VERSION: ${{ inputs.node-version }}
      run: |
        set -euo pipefail
        case "$CACHE_MODE" in
          off|restore|read-write) ;;
          *)
            echo "::error::Invalid cache-mode input: '$CACHE_MODE' (expected off, restore, or read-write)"
            exit 2
            ;;
        esac
        project_dir="$(dirname "$PACKAGE_MANAGER_FILE")"
        if [[ ! -f "$PACKAGE_MANAGER_FILE" ]]; then
          echo "::error::package manager file not found: $PACKAGE_MANAGER_FILE"
          exit 1
        fi
        echo "project-dir=$project_dir" >> "$GITHUB_OUTPUT"

        requested_node="${REQUESTED_NODE_VERSION:-${NODE_VERSION:-}}"
        source "$GITHUB_ACTION_PATH/ensure-node.sh"
        openclaw_ensure_node "$requested_node"
        package_manager="$(node -e "const fs = require('node:fs'); const path = require('node:path'); const pkg = JSON.parse(fs.readFileSync(path.resolve(process.argv[1]), 'utf8')); process.stdout.write(pkg.packageManager || '')" "$PACKAGE_MANAGER_FILE")"
        case "$package_manager" in
          pnpm@*) ;;
          *)
            echo "::error::Expected packageManager to pin pnpm, got '${package_manager:-<empty>}'"
            exit 1
            ;;
        esac
        echo "package-manager=$package_manager" >> "$GITHUB_OUTPUT"

    - name: Resolve pnpm store path
      id: pnpm-store
      if: ${{ inputs.cache-mode != 'off' && runner.os != 'Windows' }}
      shell: bash
      run: |
        set -euo pipefail
        # Restore the configured root before pnpm runs. Its versioned content
        # directory and authenticated bootstrap archives share one payload.
        store_path="${PNPM_CONFIG_STORE_DIR:-$GITHUB_WORKSPACE/.cache/openclaw-pnpm-store}"
        store_path="$(node -p 'require("node:path").resolve(process.argv[1])' "$store_path")"
        mkdir -p "$store_path"
        echo "PNPM_CONFIG_STORE_DIR=$store_path" >> "$GITHUB_ENV"
        echo "PNPM_CONFIG_CACHE_DIR=${PNPM_CONFIG_CACHE_DIR:-$store_path/cache}" >> "$GITHUB_ENV"
        echo "path=$store_path" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm store cache
      id: pnpm-store-cache
      if: ${{ inputs.cache-mode != 'off' && runner.os != 'Windows' }}
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ steps.setup-pnpm.outputs.package-manager }}-${{ hashFiles(inputs.lockfile-path) }}
        restore-keys: |
          pnpm-store-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ steps.setup-pnpm.outputs.package-manager }}-

    - name: Setup pnpm from packageManager
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        PACKAGE_MANAGER: ${{ steps.setup-pnpm.outputs.package-manager }}
      run: |
        set -euo pipefail
        package_manager="$PACKAGE_MANAGER"
        image_corepack_home="$(node "$GITHUB_ACTION_PATH/seed-pnpm-from-image.mjs" "$package_manager")"
        if [[ -n "$image_corepack_home" ]]; then
          export COREPACK_HOME="$image_corepack_home"
          echo "COREPACK_HOME=$COREPACK_HOME" >> "$GITHUB_ENV"
        fi
        if [ -n "${PNPM_HOME:-}" ]; then
          mkdir -p "$PNPM_HOME"
          corepack enable --install-directory "$PNPM_HOME"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
        else
          corepack enable
        fi
        for attempt in 1 2 3; do
          if corepack prepare "$package_manager" --activate; then
            exit 0
          fi
          sleep $((attempt * 5))
        done
        corepack prepare "$package_manager" --activate

    - name: Record pnpm version
      id: pnpm-version
      shell: bash
      env:
        PROJECT_DIR: ${{ steps.setup-pnpm.outputs.project-dir }}
      run: |
        set -euo pipefail
        pnpm_version="$(cd "$PROJECT_DIR" && pnpm -v)"
        echo "pnpm-version=$pnpm_version" >> "$GITHUB_OUTPUT"
