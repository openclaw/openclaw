name: Setup test Bun
description: Install the checksum-pinned Linux x64 Bun fork used by test lanes.
runs:
  using: composite
  steps:
    - name: Install pinned Bun test runtime
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS/$RUNNER_ARCH" != "Linux/X64" ]]; then
          echo "::error::The pinned Bun test runtime requires Linux/X64."
          exit 1
        fi

        # Built from openclaw/bun commit 57fadf566d797870759abbe103206ee3981a9323.
        # WebKit commit f20ce7744553c910bcf16a33faf976af208de091.
        bun_dir="$(mktemp -d "$RUNNER_TEMP/openclaw-test-bun.XXXXXX")"
        release_url="https://github.com/openclaw/bun/releases/download/openclaw-v1.4.3-20260930-57fadf566d-webkit-f20ce77445"
        archive="$bun_dir/bun-linux-x64.zip"
        for asset in bun-linux-x64.zip SHA256SUMS manifest.json; do
          curl --fail --location --no-progress-meter --show-error \
            --connect-timeout 10 --max-time 300 \
            --retry 3 --retry-all-errors --retry-max-time 300 \
            --output "$bun_dir/$asset" "$release_url/$asset" \
            2> >(sed 's/^Warning: /::warning::/' >&2)
        done
        # Check published metadata as well as the independent pins below.
        (
          cd "$bun_dir"
          for asset in bun-linux-x64.zip manifest.json; do
            awk -v asset="$asset" '$2 == asset { print }' SHA256SUMS | sha256sum --check -
          done
        )
        printf '%s  %s\n' \
          '62452aa42cd54ce1bcd6862fc4305a59f515561b0d80d90bff7b39e7d8c5a05d' \
          "$archive" | sha256sum --check -
        unzip -p "$archive" bun-linux-x64/bun > "$bun_dir/bun"
        printf '%s  %s\n' \
          "$(jq -er '.assets[] | select(.name == "bun-linux-x64.zip") | .executable.sha256' "$bun_dir/manifest.json")" \
          "$bun_dir/bun" | sha256sum --check -
        printf '%s  %s\n' \
          '1bca0225c01e3e0adabecec958f66c8e4cdfb16fbc3fbdef2f4aa145f13538d9' \
          "$bun_dir/bun" | sha256sum --check -
        chmod 755 "$bun_dir/bun"
        "$bun_dir/bun" --version
        "$bun_dir/bun" --revision
        rm "$archive" "$bun_dir/SHA256SUMS" "$bun_dir/manifest.json"
        echo "$bun_dir" >> "$GITHUB_PATH"
