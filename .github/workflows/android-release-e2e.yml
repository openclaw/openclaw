name: Android Release E2E

on:
  workflow_call:
    inputs:
      target_sha:
        type: string
        required: true
      client_sha:
        description: Optional frozen stable-release client source SHA
        type: string
        default: ""
      client_release_tag:
        description: Published stable repository release identifying client_sha
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      target_sha:
        description: Optional exact candidate Gateway SHA (defaults to dispatch ref)
        type: string
        default: ""
      client_sha:
        description: Optional frozen stable-release client source SHA (paired with client_release_tag)
        type: string
        default: ""
      client_release_tag:
        description: Published stable repository release identifying client_sha
        type: string
        default: ""

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ inputs.target_sha || github.sha }}
      CLIENT_SHA: ${{ inputs.client_sha }}
      CLIENT_RELEASE_TAG: ${{ inputs.client_release_tag }}
    steps:
      - name: Initialize failure proof and validate target
        shell: bash
        run: |
          set -euo pipefail
          export PROOF_PATH="$RUNNER_TEMP/android-release-e2e-proof.json"
          echo "PROOF_PATH=$PROOF_PATH" >> "$GITHUB_ENV"
          echo "GATEWAY_SELECTION_DIR=$RUNNER_TEMP/android-release-gateway-selection" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os, re
          sha = os.environ["TARGET_SHA"]
          with open(os.environ["PROOF_PATH"], "w") as out:
              json.dump({"schema": 1, "status": "failed",
                         "targetSha": sha if re.fullmatch(r"[a-f0-9]{40}", sha) else None,
                         "errors": ["workflow-setup-incomplete"]}, out)
          PY
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ -n "$CLIENT_SHA" || -n "$CLIENT_RELEASE_TAG" ]]; then
            [[ -n "$CLIENT_SHA" && -n "$CLIENT_RELEASE_TAG" ]] || exit 1
          fi
          if [[ -z "$CLIENT_SHA" ]]; then
            [[ "$TARGET_SHA" == "$GITHUB_SHA" ]] || exit 1
          fi

      - name: Checkout exact qualification target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify target and require target-owned harness
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          test -f scripts/android-release-e2e.ts
          test -f scripts/ios-release-gateway.ts

      - name: Checkout independent candidate Gateway
        if: inputs.client_sha != '' && inputs.target_sha != '' && inputs.target_sha != github.sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          path: .openclaw/tmp/candidate-gateway
          persist-credentials: false

      - name: Checkout frozen stable client source
        if: inputs.client_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.client_sha }}
          fetch-tags: true
          path: .openclaw/tmp/stable-client
          persist-credentials: false

      - name: Prepare candidate Gateway toolchain
        if: inputs.client_sha != ''
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.22.1"
          install-bun: "false"
          cache-mode: "off"

      - name: Build candidate Gateway and prepare stable client dependencies
        if: inputs.client_sha != ''
        run: |
          pnpm build:runtime
          if [[ "$TARGET_SHA" != "$GITHUB_SHA" ]]; then
            pnpm --dir .openclaw/tmp/candidate-gateway install --frozen-lockfile
            pnpm --dir .openclaw/tmp/candidate-gateway build:runtime
          fi
          pnpm --dir .openclaw/tmp/stable-client install --frozen-lockfile

      - name: Prepare stable Gateway selection
        if: inputs.client_sha == ''
        id: gateway-preparation
        uses: ./.github/actions/prepare-mobile-release-gateway
        with:
          artifact-name: android-release-gateway-selection-${{ github.run_id }}

      - name: Setup Android toolchain and standard emulator images
        id: android-toolchain
        uses: ./.github/actions/setup-android-toolchain
        with:
          cache-mode: "off"
          install-screenshot-emulators: "true"

      - name: Qualify phone and controlled Wear boundary
        env:
          OPENCLAW_GRADLE_JAVA_HOME: ${{ steps.android-toolchain.outputs.gradle-java-home }}
        run: |
          client_args=()
          if [[ -n "$CLIENT_SHA" ]]; then
            client_args=(--client-root "$GITHUB_WORKSPACE/.openclaw/tmp/stable-client" --client-sha "$CLIENT_SHA" --client-release-tag "$CLIENT_RELEASE_TAG")
            client_args+=(--harness-sha "$GITHUB_SHA")
            if [[ "$TARGET_SHA" != "$GITHUB_SHA" ]]; then
              client_args+=(--candidate-root "$GITHUB_WORKSPACE/.openclaw/tmp/candidate-gateway")
            fi
          fi
          pnpm android:release:validate -- \
            --target-sha "$TARGET_SHA" --output "$PROOF_PATH" \
            --selection-dir "$GATEWAY_SELECTION_DIR" \
            --artifacts-dir "$RUNNER_TEMP/android-release-e2e" "${client_args[@]}"

      - name: Retain sanitized qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-release-e2e-proof.json
            ${{ runner.temp }}/android-release-e2e/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
