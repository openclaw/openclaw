name: Shared OpenClawKit Periphery

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  # Admission precedes scope skips: isolate passive drafts before they can cancel useful work.
  # Keep conversion events in the PR group as an intentional cancellation signal.
  group: >-
    ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.action != 'converted_to_draft'
      && format('{0}-passive-draft-{1}', github.workflow, github.run_id)
      || format('shared-openclawkit-periphery-{0}', github.event.pull_request.number || github.sha) }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  scope:
    name: Detect shared OpenClawKit scan scope
    runs-on: ubuntu-24.04
    outputs:
      should-scan: ${{ steps.scope.outputs.should-scan }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Detect changed paths
        id: scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            if (context.eventName === "workflow_dispatch") {
              core.setOutput("should-scan", "true");
              return;
            }
            if (context.payload.pull_request?.draft) {
              core.setOutput("should-scan", "false");
              return;
            }

            // pull_request checks out GitHub's synthetic merge commit. Its first
            // parent is the exact base tree used to produce the tested result.
            const protocolInputs = JSON.parse(require("node:fs").readFileSync("scripts/native-protocol-inputs.json", "utf8"));
            const result = await exec.getExecOutput("git", [
              "diff",
              "--quiet",
              "HEAD^1",
              "HEAD",
              "--",
              "apps/ios/",
              "apps/macos/",
              "apps/shared/OpenClawKit/",
              ...protocolInputs.directories.map((directory) => `${directory}/`),
              ...protocolInputs.files,
              ".github/workflows/shared-openclawkit-periphery.yml",
              "scripts/install-periphery.sh",
              "scripts/lib/swift-toolchain.sh",
              "scripts/periphery-intersection.mjs",
              "scripts/ios-configure-signing.sh",
              "scripts/ios-write-swift-filelist.mjs",
              "scripts/ios-write-swift-filelist.mts",
              "scripts/ios-write-version-xcconfig.sh",
              "test/scripts/periphery-intersection.test.ts",
            ], { ignoreReturnCode: true, silent: true });
            if (result.exitCode !== 0 && result.exitCode !== 1) {
              throw new Error(`git diff failed with exit code ${result.exitCode}`);
            }
            core.setOutput("should-scan", String(result.exitCode === 1));

  scan-ios:
    name: Scan shared kit from iOS
    needs: scope
    if: ${{ needs.scope.outputs.should-scan == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Verify Xcode
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "false"

      - name: Install Watch Rust toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          watch_toolchain="$(awk -F '"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$watch_toolchain"
          rustup toolchain install "$watch_toolchain" --profile minimal --component rust-src

      - name: Identify Watch RTC cache inputs
        id: ios-cache-inputs
        run: |
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "OPENCLAW_WATCH_RTC_CACHE_DIR=$RUNNER_TEMP/openclaw-watch-rtc-libraries" >> "$GITHUB_ENV"

      # Consume the exact cache published by trusted main CI; this workflow never writes it.
      - name: Restore Watch RTC build inputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ${{ runner.temp }}/openclaw-watch-rtc-libraries
          key: watch-rtc-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache-inputs.outputs.xcode }}-${{ hashFiles('apps/shared/OpenClawWatchRTC/Cargo.lock', 'apps/shared/OpenClawWatchRTC/Cargo.toml', 'apps/shared/OpenClawWatchRTC/rust-toolchain.toml', 'apps/shared/OpenClawWatchRTC/build.sh', 'apps/shared/OpenClawWatchRTC/src/**', 'apps/ios/project.yml') }}

      - name: Install iOS scan tooling
        run: |
          periphery_dir="$RUNNER_TEMP/openclaw-periphery"
          ./scripts/install-periphery.sh "$periphery_dir"
          echo "$periphery_dir" >> "$GITHUB_PATH"
          swift_tools_dir="$RUNNER_TEMP/openclaw-swift-tools"
          # Homebrew's xcodegen bottle can arrive corrupted on runner images;
          # use the repo's pinned, checksummed release installer like ci.yml.
          ./scripts/install-xcodegen.sh "$swift_tools_dir"
          "$swift_tools_dir/xcodegen" --version
          ./scripts/install-swift-tools.sh "$swift_tools_dir"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"
          "$swift_tools_dir/swiftformat" --version
          "$swift_tools_dir/swiftlint" version

      - name: Generate iOS project
        run: |
          set -euo pipefail
          ./scripts/ios-configure-signing.sh
          ./scripts/ios-write-version-xcconfig.sh
          node scripts/ios-write-swift-filelist.mjs
          cd apps/ios
          xcodegen generate

      - name: Build iOS consumer index
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/shared-periphery-ios"
          mkdir -p "$output_dir"
          cd apps/ios
          # Match Periphery's build-for-testing contract, with a fresh run-owned index.
          /usr/bin/time -p xcodebuild \
            -project OpenClaw.xcodeproj -scheme OpenClaw -parallelizeTargets \
            -derivedDataPath "$RUNNER_TEMP/shared-periphery-ios-derived" \
            -destination 'generic/platform=iOS Simulator' \
            build-for-testing CODE_SIGNING_ALLOWED=NO ENABLE_BITCODE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf COMPILER_INDEX_STORE_ENABLE=YES \
            INDEX_ENABLE_DATA_STORE=YES \
            2>&1 | tee "$output_dir/build.log"

      - name: Scan shared kit
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/shared-periphery-ios"
          mkdir -p "$output_dir"
          cd apps/ios
          set +e
          periphery scan \
            --config .periphery.yml \
            --skip-build \
            --index-store-path "$RUNNER_TEMP/shared-periphery-ios-derived/Index.noindex/DataStore" \
            --format json \
            --report-include '../shared/OpenClawKit/Sources/**' \
            --retain-files '**/GenerateGatewayProtocol/GatewayModels.swift' \
            --write-results "$output_dir/periphery.json" \
            >"$output_dir/periphery.stdout.json" \
            2>"$output_dir/periphery.stderr.log"
          periphery_status="$?"
          set -e
          printf '%s\n' "$periphery_status" >"$output_dir/periphery.status"
          if [ ! -s "$output_dir/periphery.json" ]; then
            cp "$output_dir/periphery.stdout.json" "$output_dir/periphery.json"
          fi

      # Failed-job reruns retain successful producer artifacts from the original attempt.
      # Keep artifact slots run-scoped; rerun producers overwrite their slot.
      - name: Upload iOS consumer report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shared-periphery-ios-${{ github.run_id }}
          path: ${{ runner.temp }}/shared-periphery-ios
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  scan-macos:
    name: Scan shared kit from macOS
    needs: scope
    if: ${{ needs.scope.outputs.should-scan == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Verify Xcode
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "false"
          install-deps: "false"

      - name: Install native asset dependencies
        env:
          CI: "true"
        run: >-
          pnpm install --frozen-lockfile --prefer-offline --optional
          --filter '@openclaw/mermaid-renderer...'
          --filter '@openclaw/gateway-protocol...'
          --config.ignore-scripts=false
          --config.engine-strict=false
          --config.enable-pre-post-scripts=true
          --config.side-effects-cache=true

      - name: Prepare Apple Mermaid assets
        run: node scripts/prepare-apple-mermaid.mjs

      - name: Install Periphery
        run: |
          periphery_dir="$RUNNER_TEMP/openclaw-periphery"
          ./scripts/install-periphery.sh "$periphery_dir"
          echo "$periphery_dir" >> "$GITHUB_PATH"

      - name: Build macOS consumer index
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/shared-periphery-macos"
          mkdir -p "$output_dir"
          cd apps/macos
          swift package --scratch-path ../../.cache/periphery-swift clean
          /usr/bin/time -p swift build --build-system native --scratch-path ../../.cache/periphery-swift --build-tests --enable-index-store \
            2>&1 | tee "$output_dir/build.log"

      - name: Scan shared kit
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/shared-periphery-macos"
          cd apps/macos
          set +e
          periphery scan \
            --config .periphery.yml \
            --skip-build \
            --format json \
            --report-include '../shared/OpenClawKit/Sources/**' \
            --retain-files '**/GenerateGatewayProtocol/GatewayModels.swift' \
            --write-results "$output_dir/periphery.json" \
            >"$output_dir/periphery.stdout.json" \
            2>"$output_dir/periphery.stderr.log"
          periphery_status="$?"
          set -e
          printf '%s\n' "$periphery_status" >"$output_dir/periphery.status"
          if [ ! -s "$output_dir/periphery.json" ]; then
            cp "$output_dir/periphery.stdout.json" "$output_dir/periphery.json"
          fi

      - name: Upload macOS consumer report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shared-periphery-macos-${{ github.run_id }}
          path: ${{ runner.temp }}/shared-periphery-macos
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  intersect:
    name: Intersect shared OpenClawKit dead code
    needs: [scope, scan-ios, scan-macos]
    if: ${{ always() && needs.scope.outputs.should-scan == 'true' && needs.scan-ios.result != 'cancelled' && needs.scan-macos.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Download iOS consumer report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: shared-periphery-ios-${{ github.run_id }}
          path: ${{ runner.temp }}/shared-periphery-ios

      - name: Download macOS consumer report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: shared-periphery-macos-${{ github.run_id }}
          path: ${{ runner.temp }}/shared-periphery-macos

      - name: Setup supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Intersect exact Swift identities
        run: |
          node scripts/periphery-intersection.mjs \
            --ios-results "$RUNNER_TEMP/shared-periphery-ios/periphery.json" \
            --ios-status "$RUNNER_TEMP/shared-periphery-ios/periphery.status" \
            --macos-results "$RUNNER_TEMP/shared-periphery-macos/periphery.json" \
            --macos-status "$RUNNER_TEMP/shared-periphery-macos/periphery.status" \
            --output "$RUNNER_TEMP/shared-periphery-intersection/periphery.json"

      - name: Upload shared intersection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shared-periphery-intersection-${{ github.run_id }}
          path: ${{ runner.temp }}/shared-periphery-intersection
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
