name: iOS Release E2E

on:
  workflow_call:
    inputs:
      target_sha:
        type: string
        required: true
      client_sha:
        description: Optional frozen stable-release client source SHA
        type: string
        default: ""
      client_release_tag:
        description: Published stable repository release identifying client_sha
        type: string
        default: ""
      mode:
        type: string
        default: stock
      resource_diagnostics:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      target_sha:
        description: Optional exact candidate Gateway SHA (defaults to dispatch ref)
        type: string
        default: ""
      client_sha:
        description: Optional frozen stable-release client source SHA (paired with client_release_tag)
        type: string
        default: ""
      client_release_tag:
        description: Published stable repository release identifying client_sha
        type: string
        default: ""
      mode:
        description: Stock qualification or four matched stock/SimSlim pairs
        type: choice
        options: [stock, compare]
        default: stock
      resource_diagnostics:
        description: Collect the temporary resource timeline
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

jobs:
  qualify:
    # Composite cache-off inputs do not revoke the runner cache token.
    cache-mode: none
    runs-on: xcode-27-xlarge
    timeout-minutes: 240
    env:
      TARGET_SHA: ${{ inputs.target_sha || github.sha }}
      CLIENT_SHA: ${{ inputs.client_sha }}
      CLIENT_RELEASE_TAG: ${{ inputs.client_release_tag }}
      E2E_MODE: ${{ inputs.mode }}
    steps:
      - name: Initialize failure proof and validate inputs
        id: start
        shell: bash
        run: |
          set -euo pipefail
          export PROOF_PATH="$RUNNER_TEMP/ios-release-e2e-proof.json"
          echo "PROOF_PATH=$PROOF_PATH" >> "$GITHUB_ENV"
          echo "GATEWAY_SELECTION_DIR=$RUNNER_TEMP/ios-release-gateway-selection" >> "$GITHUB_ENV"
          echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os, re
          sha = os.environ["TARGET_SHA"]
          mode = os.environ["E2E_MODE"]
          with open(os.environ["PROOF_PATH"], "w") as out:
              json.dump({"schema": 2, "kind": "qualification", "status": "failed", "trials": [],
                         "targetSha": sha if re.fullmatch(r"[a-f0-9]{40}", sha) else None,
                         "harnessSha": None,
                         "mode": mode if mode in ("stock", "compare") else None,
                         "errors": ["workflow-setup-incomplete"]}, out)
          PY
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$E2E_MODE" == stock || "$E2E_MODE" == compare ]] || exit 1
          if [[ -n "$CLIENT_SHA" || -n "$CLIENT_RELEASE_TAG" ]]; then
            [[ -n "$CLIENT_SHA" && -n "$CLIENT_RELEASE_TAG" ]] || exit 1
          fi
          if [[ -z "$CLIENT_SHA" ]]; then
            [[ "$TARGET_SHA" == "$GITHUB_SHA" ]] || exit 1
          fi

      - name: Reserve host CPU for release qualification
        timeout-minutes: 2
        run: sudo -n /usr/bin/mdutil -i off /System/Volumes/Data

      - name: Checkout exact qualification target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify target and require target-owned harness
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          test -f scripts/ios-release-e2e.ts
          test -f scripts/lib/ios-release-e2e-native.ts
          test -f test/helpers/openclaw-test-instance.ts

      - name: Verify frozen published client before execution
        id: stable-client
        if: inputs.client_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stable-release-source.mjs --verify-client

      - name: Prepare candidate Gateway toolchain
        if: inputs.client_sha != ''
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.22.1"
          install-bun: "false"
          cache-mode: "off"

      - name: Probe candidate install/build/runtime isolation
        if: inputs.client_sha != ''
        run: python3 scripts/probe-native-candidate-isolation.py

      - name: Checkout independent candidate Gateway
        if: inputs.client_sha != '' && inputs.target_sha != '' && inputs.target_sha != github.sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          path: .openclaw/tmp/candidate-gateway
          persist-credentials: false

      - name: Checkout frozen stable client source
        if: inputs.client_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.stable-client.outputs.sha }}
          fetch-tags: true
          path: .openclaw/tmp/stable-client
          persist-credentials: false

      - name: Verify checked-out stable client
        if: inputs.client_sha != ''
        run: test "$(git -C .openclaw/tmp/stable-client rev-parse HEAD)" = "$CLIENT_SHA"

      - name: Build qualification harness and prepare stable client dependencies
        if: inputs.client_sha != ''
        run: |
          pnpm build:runtime
          pnpm --dir .openclaw/tmp/stable-client install --frozen-lockfile

      - name: Prepare stable Gateway selection
        if: inputs.client_sha == ''
        id: gateway-preparation
        uses: ./.github/actions/prepare-mobile-release-gateway
        with:
          artifact-name: ios-release-gateway-selection-${{ github.run_id }}
          record-install-clock: "true"

      - name: Select Xcode and install pinned native tools
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain
          swift_tools_dir="$RUNNER_TEMP/ios-release-e2e-tools"
          ./scripts/install-xcodegen.sh "$swift_tools_dir"
          ./scripts/install-swift-tools.sh "$swift_tools_dir"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          client_root="${GITHUB_WORKSPACE}"
          if [[ -n "$CLIENT_SHA" ]]; then client_root="$GITHUB_WORKSPACE/.openclaw/tmp/stable-client"; fi
          watch_toolchain="$(awk -F '"' '/^channel =/ { print $2; exit }' "$client_root/apps/shared/OpenClawWatchRTC/rust-toolchain.toml")"
          test -n "$watch_toolchain"
          rustup toolchain install "$watch_toolchain" --profile minimal --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install pinned comparison meter
        id: simslim
        if: inputs.mode == 'compare'
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/ios-release-e2e-simslim"
          ./scripts/install-simslim.sh "$install_dir"
          echo "binary=$install_dir/simslim" >> "$GITHUB_OUTPUT"

      - name: Finish shared toolchain installation clock
        id: install-end
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Qualify native pairing and chat
        env:
          OPENCLAW_CI_SIMSLIM_BINARY: ${{ steps.simslim.outputs.binary }}
          OPENCLAW_IOS_RESOURCE_DIAGNOSTICS: ${{ inputs.resource_diagnostics && '1' || '0' }}
        run: |
          client_args=()
          if [[ -n "$CLIENT_SHA" ]]; then
            client_args=(--client-root "$GITHUB_WORKSPACE/.openclaw/tmp/stable-client" --client-sha "$CLIENT_SHA" --client-release-tag "$CLIENT_RELEASE_TAG")
            client_args+=(--harness-sha "$GITHUB_SHA")
            if [[ "$TARGET_SHA" != "$GITHUB_SHA" ]]; then
              client_args+=(--candidate-root "$GITHUB_WORKSPACE/.openclaw/tmp/candidate-gateway")
            fi
          fi
          node scripts/ios-resource-timeline.mjs --output "$RUNNER_TEMP/ios-resource-timeline.jsonl" -- \
            node --import ./scripts/tsx.mjs scripts/ios-release-e2e.ts \
            --mode "$E2E_MODE" --target-sha "$TARGET_SHA" --output "$PROOF_PATH" \
            --gateway-selection "$GATEWAY_SELECTION_DIR" "${client_args[@]}"

      - name: Complete sanitized timing proof
        if: always()
        env:
          START_EPOCH: ${{ steps.start.outputs.epoch }}
          INSTALL_START: ${{ steps.gateway-preparation.outputs.install-start-epoch }}
          INSTALL_END: ${{ steps.install-end.outputs.epoch }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python3 - <<'PY'
          import json, os, time
          path = os.environ["PROOF_PATH"]
          with open(path) as source:
              proof = json.load(source)
          proof["workflowSha"] = os.environ["WORKFLOW_SHA"]
          proof["overallMs"] = round((time.time() - int(os.environ["START_EPOCH"])) * 1000)
          start, end = os.environ["INSTALL_START"], os.environ["INSTALL_END"]
          proof["sharedInstallerMs"] = (int(end) - int(start)) * 1000 if start and end else None
          with open(path, "w") as out:
              json.dump(proof, out, indent=2)
          PY

      - name: Upload sanitized proof only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-e2e-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-release-e2e-proof.json
            ${{ runner.temp }}/ios-resource-timeline.jsonl
          if-no-files-found: error
          retention-days: 14
