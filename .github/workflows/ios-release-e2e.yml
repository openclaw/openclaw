name: Release 37 iOS share diagnostic (nonqualification)
run-name: release37-ios-share-${{ inputs.diagnostic_id }}
on:
  workflow_dispatch:
    inputs:
      diagnostic_id:
        description: Unique request identifier for read-only reconciliation
        required: true
        type: string
      artifact_recipient_certificate:
        description: Public X.509 encryption certificate; private key stays off runner
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release37-ios-share-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - name: Initialize private evidence and verify recipient
        shell: bash
        env:
          RECIPIENT_CERT: ${{ inputs.artifact_recipient_certificate }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/ios-share-private"
          printf '%s\n' "$RECIPIENT_CERT" > "$RUNNER_TEMP/ios-share-private/recipient.pem"
          openssl x509 -in "$RUNNER_TEMP/ios-share-private/recipient.pem" -noout
          printf preflight | openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -out "$RUNNER_TEMP/ios-share-private/preflight.p7m" "$RUNNER_TEMP/ios-share-private/recipient.pem"
      - name: Checkout frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a27b5ab63e3c4efc4b700f60ae468b0ce529f0cd
          persist-credentials: false
      - name: Checkout reviewed diagnostic observer only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .diagnostic-control
          persist-credentials: false
          sparse-checkout: scripts/diagnostics/release37-ios-share.py
          sparse-checkout-cone-mode: false
      - name: Verify exact source and record identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a27b5ab63e3c4efc4b700f60ae468b0ce529f0cd
          git rev-parse HEAD > "$RUNNER_TEMP/ios-share-private/source.txt"
          git -C .diagnostic-control rev-parse HEAD > "$RUNNER_TEMP/ios-share-private/observer-source.txt"
          shasum -a 256 .diagnostic-control/scripts/diagnostics/release37-ios-share.py > "$RUNNER_TEMP/ios-share-private/observer.sha256"
      - name: Prepare frozen Node dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.22.1"
          install-bun: "false"
          cache-mode: "off"
      - name: Prepare frozen native tools
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain > "$RUNNER_TEMP/ios-share-private/toolchain.log" 2>&1
          tools="$RUNNER_TEMP/ios-share-tools"
          ./scripts/install-xcodegen.sh "$tools" >> "$RUNNER_TEMP/ios-share-private/toolchain.log" 2>&1
          ./scripts/install-swift-tools.sh "$tools" >> "$RUNNER_TEMP/ios-share-private/toolchain.log" 2>&1
          echo "$tools" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          toolchain="$(awk -F '"' '/^channel =/ {print $2; exit}' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src >> "$RUNNER_TEMP/ios-share-private/toolchain.log" 2>&1
      - name: Run unchanged attachment driver with passive share-service capture
        shell: bash
        env:
          IOS_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/ios-share-private
        run: |
          set -euo pipefail
          python3 .diagnostic-control/scripts/diagnostics/release37-ios-share.py > "$RUNNER_TEMP/ios-share-private/controller.log" 2>&1
      - name: Seal diagnostic evidence without publishing raw logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          evidence="$RUNNER_TEMP/ios-share-private"
          test -f "$evidence/recipient.pem"
          if test -d apps/ios/build/LifecycleTestResults; then
            cp -R apps/ios/build/LifecycleTestResults "$evidence/"
          fi
          tar -czf "$RUNNER_TEMP/ios-share-evidence.tar.gz" -C "$RUNNER_TEMP" ios-share-private
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in "$RUNNER_TEMP/ios-share-evidence.tar.gz" -out "$RUNNER_TEMP/ios-share-evidence.p7m" "$evidence/recipient.pem"
          shasum -a 256 "$RUNNER_TEMP/ios-share-evidence.p7m" > "$RUNNER_TEMP/ios-share-evidence.sha256"
      - name: Upload encrypted diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release37-ios-share-${{ inputs.diagnostic_id }}
          path: |
            ${{ runner.temp }}/ios-share-evidence.p7m
            ${{ runner.temp }}/ios-share-evidence.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Remove task-owned plaintext evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/ios-share-private"
          rm -f -- "$RUNNER_TEMP/ios-share-evidence.tar.gz"
          rm -rf -- "$GITHUB_WORKSPACE/apps/ios/build/LifecycleTestResults"
