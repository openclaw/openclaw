name: Docs Sync Publish Repo

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - package.json
      - scripts/docs-list.js
      - scripts/docs-sync-publish.mjs
      - scripts/docs-sync-publish-policy.py
      - scripts/check-docs-mdx.mjs
      - scripts/check-docs-mdx.mts
      - scripts/lib/arg-utils.runtime.mjs
      - scripts/lib/numeric-options.mjs
      - scripts/lib/docs-markdown.mjs
      - scripts/lib/docs-redirects.mjs
      - scripts/lib/tsx-cli-shim.mjs
      - scripts/lib/local-check-runtime.mts
      - .github/workflows/docs-sync-publish.yml
      - "!docs/AGENTS.md"
      - "!docs/.i18n/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # All mirror writers, including manual runs, share one noncanceling queue.
  group: docs-sync-publish
  cancel-in-progress: false
  queue: max

jobs:
  sync-publish-repo:
    runs-on: ubuntu-latest
    env:
      OPENCLAW_DOCS_SYNC_TOKEN: ${{ secrets.OPENCLAW_DOCS_SYNC_TOKEN }}
      OPENCLAW_DOCS_MDX_CACHE: ${{ github.workspace }}/.artifacts/docs-mdx-cache.json
    steps:
      - name: Skip publish sync without token
        if: env.OPENCLAW_DOCS_SYNC_TOKEN == ''
        run: echo "OPENCLAW_DOCS_SYNC_TOKEN is not configured; skipping docs publish repo sync."

      - name: Checkout source repo
        if: env.OPENCLAW_DOCS_SYNC_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep ancestry for skip_stale_source, without downloading old file bodies.
          # Sparse checkout enables blob:none; cone mode also keeps root manifests.
          fetch-depth: 0
          sparse-checkout: |
            docs
            scripts
            .github/codex/prompts

      - name: Checkout ClawHub docs source
        if: env.OPENCLAW_DOCS_SYNC_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/clawhub
          ref: main
          path: clawhub-source
          fetch-depth: 1
          persist-credentials: false
          token: ${{ env.OPENCLAW_DOCS_SYNC_TOKEN || github.token }}

      - name: Prepare Git owner
        if: env.OPENCLAW_DOCS_SYNC_TOKEN != ''
        uses: openclaw/openclaw/.github/actions/git-owner@88095dc00eef288c3829909d4dc64a9e249fa7ef

      - name: Setup Node
        if: env.OPENCLAW_DOCS_SYNC_TOKEN != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - name: Clone publish repo
        if: env.OPENCLAW_DOCS_SYNC_TOKEN != ''
        run: |
          set -euo pipefail
          exec python3 -I -S "$CI_GIT_OWNER" --policy - <<'PYTHON'
          import os
          import subprocess
          import sys
          from ci_git_owner import run_git, GitFailure, FetchTimeout, backoff, check_cancelled

          workspace = os.environ["GITHUB_WORKSPACE"]
          publish = os.path.join(workspace, "publish")
          for attempt in range(1, 6):
              check_cancelled()
              # Delete only this fixed entry, including a file or symlink, after
              # the previous Git tree has been verified extinct.
              subprocess.run(["rm", "-rf", publish], check=True)
              try:
                  run_git(workspace, "clone",
                          f"https://x-access-token:{os.environ['OPENCLAW_DOCS_SYNC_TOKEN']}@github.com/openclaw/docs.git",
                          publish, timeout=120)
                  raise SystemExit(0)
              except (GitFailure, FetchTimeout):
                  print(f"Clone attempt {attempt} failed; retrying.", flush=True)
                  backoff(attempt * 2)
          print("Failed to clone publish repo after retries.", file=sys.stderr)
          raise SystemExit(1)
          PYTHON

      - name: Hold unresolved docs mirror candidates
        if: env.OPENCLAW_DOCS_SYNC_TOKEN != ''
        working-directory: publish
        run: |
          set -euo pipefail
          exec python3 -I -S "$CI_GIT_OWNER" --policy "$GITHUB_WORKSPACE/scripts/docs-sync-publish-policy.py" guard

      - name: Sync docs into publish repo
        if: env.OPENCLAW_DOCS_SYNC_TOKEN != ''
        run: |
          set -euo pipefail
          clawhub_sha="$(cd "$GITHUB_WORKSPACE/clawhub-source" && python3 -I -S "$CI_GIT_OWNER" --checkout-git 0 rev-parse HEAD)"
          node scripts/docs-sync-publish.mjs \
            --target "$GITHUB_WORKSPACE/publish" \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --clawhub-repo "$GITHUB_WORKSPACE/clawhub-source" \
            --clawhub-source-repo "openclaw/clawhub" \
            --clawhub-source-sha "$clawhub_sha"

      # This is a disposable compiler artifact, not a dependency/runtime cache.
      # The combined action saves only after a successful trusted-main job.
      - name: Cache successful docs validation
        if: env.OPENCLAW_DOCS_SYNC_TOKEN != '' && github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/docs-mdx-cache.json
          key: docs-mdx-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: docs-mdx-v1-${{ runner.os }}-

      - name: Commit publish repo sync
        id: prepare
        if: env.OPENCLAW_DOCS_SYNC_TOKEN != ''
        working-directory: publish
        run: |
          set -euo pipefail
          exec python3 -I -S "$CI_GIT_OWNER" --policy "$GITHUB_WORKSPACE/scripts/docs-sync-publish-policy.py" prepare

      - name: Publish validated docs through a pull request
        if: steps.prepare.outputs.ready == 'true'
        working-directory: publish
        env:
          DOCS_PUBLISH_HEAD: ${{ steps.prepare.outputs.head }}
          DOCS_PUBLISH_BASE: ${{ steps.prepare.outputs.base }}
          DOCS_PUBLISH_TREE: ${{ steps.prepare.outputs.tree }}
        run: |
          set -euo pipefail
          exec python3 -I -S "$CI_GIT_OWNER" --policy "$GITHUB_WORKSPACE/scripts/docs-sync-publish-policy.py" publish
