name: Package Acceptance

on:
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: "Assertion of the called workflow identity: dispatch/call at the desired ref and supply its matching SHA/ref; package_ref independently selects package source"
        required: true
        default: main
        type: string
      source:
        description: Package candidate source
        required: true
        default: npm
        type: choice
        options:
          - npm
          - ref
          - url
          - trusted-url
          - artifact
      package_ref:
        description: Trusted package source ref when source=ref
        required: true
        default: main
        type: string
      package_spec:
        description: Published package spec when source=npm
        required: false
        default: openclaw@beta
        type: string
      package_url:
        description: HTTPS .tgz URL when source=url or source=trusted-url
        required: false
        default: ""
        type: string
      package_sha256:
        description: Expected package SHA-256; required for source=url, source=trusted-url, or source=artifact
        required: false
        default: ""
        type: string
      trusted_source_id:
        description: Named trusted source policy when source=trusted-url
        required: false
        default: ""
        type: string
      artifact_run_id:
        description: GitHub Actions run id when source=artifact
        required: false
        default: ""
        type: string
      artifact_name:
        description: Artifact name containing one .tgz when source=artifact
        required: false
        default: package-under-test
        type: string
      artifact_id:
        description: Immutable GitHub artifact id when source=artifact
        required: false
        default: ""
        type: string
      artifact_digest:
        description: GitHub artifact service SHA-256 digest without the sha256 prefix
        required: false
        default: ""
        type: string
      artifact_run_attempt:
        description: Producer run attempt when source=artifact
        required: false
        default: ""
        type: string
      package_file_name:
        description: Exact package tarball filename when source=artifact
        required: false
        default: ""
        type: string
      package_source_sha:
        description: Exact source commit recorded in the package when source=artifact
        required: false
        default: ""
        type: string
      package_version:
        description: Exact package version when source=artifact
        required: false
        default: ""
        type: string
      shared_image_policy:
        description: Shared Docker image transport for package acceptance
        required: true
        default: no-push-artifact
        type: choice
        options:
          - existing-only
          - no-push-artifact
      shared_image_artifact_namespace:
        description: Unique artifact namespace when shared_image_policy=no-push-artifact
        required: false
        default: package-acceptance
        type: string
      suite_profile:
        description: "Acceptance profile: smoke, package, telegram, product, full, or custom"
        required: true
        default: package
        type: choice
        options:
          - smoke
          - package
          - telegram
          - product
          - full
          - custom
      docker_lanes:
        description: Comma/space separated Docker lanes when suite_profile=custom
        required: false
        default: ""
        type: string
      published_upgrade_survivor_baseline:
        description: Published OpenClaw package baseline for the published-upgrade-survivor Docker lane
        required: false
        default: openclaw@latest
        type: string
      published_upgrade_survivor_baselines:
        description: Optional baseline list; use supported-lines for latest/previous/extended/floor, last-stable-4, all-since-2026.4.23, release-history, or exact versions
        required: false
        default: ""
        type: string
      published_upgrade_survivor_scenarios:
        description: Optional scenario list for published-upgrade-survivor/update-migration; use reported-issues for known upgrade failure shapes
        required: false
        default: ""
        type: string
      telegram_mode:
        description: Optional Telegram QA lane for the resolved package candidate
        required: true
        default: none
        type: choice
        options:
          - none
          - mock-openai
          - live-frontier
      telegram_scenarios:
        description: Optional comma-separated Telegram scenario ids
        required: false
        default: ""
        type: string
      advisory:
        description: Treat acceptance failures as advisory for the caller
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      advisory:
        description: Treat acceptance failures as advisory for the caller
        required: false
        default: false
        type: boolean
      telegram_advisory:
        description: Treat only Telegram acceptance failures as advisory
        required: false
        default: false
        type: boolean
      workflow_ref:
        description: "Assertion of the called workflow identity: dispatch/call at the desired ref and supply its matching SHA/ref; package_ref independently selects package source"
        required: false
        default: main
        type: string
      source:
        description: "Package candidate source: npm, ref, url, trusted-url, or artifact"
        required: true
        type: string
      package_ref:
        description: Trusted package source ref when source=ref
        required: false
        default: main
        type: string
      package_spec:
        description: Published package spec when source=npm
        required: false
        default: openclaw@beta
        type: string
      target_context_ref:
        type: string
      package_url:
        description: HTTPS .tgz URL when source=url or source=trusted-url
        required: false
        default: ""
        type: string
      package_sha256:
        description: Expected package SHA-256; required for source=url, source=trusted-url, or source=artifact
        required: false
        default: ""
        type: string
      trusted_source_id:
        description: Named trusted source policy when source=trusted-url
        required: false
        default: ""
        type: string
      artifact_run_id:
        description: GitHub Actions run id when source=artifact
        required: false
        default: ""
        type: string
      artifact_name:
        description: Artifact name containing one .tgz when source=artifact
        required: false
        default: package-under-test
        type: string
      artifact_id:
        description: Immutable GitHub artifact id when source=artifact
        required: false
        default: ""
        type: string
      artifact_digest:
        description: GitHub artifact service SHA-256 digest without the sha256 prefix
        required: false
        default: ""
        type: string
      artifact_run_attempt:
        description: Producer run attempt when source=artifact
        required: false
        default: ""
        type: string
      package_file_name:
        description: Exact package tarball filename when source=artifact
        required: false
        default: ""
        type: string
      package_source_sha:
        description: Exact source commit recorded in the package when source=artifact
        required: false
        default: ""
        type: string
      package_version:
        description: Exact package version when source=artifact
        required: false
        default: ""
        type: string
      shared_image_policy:
        description: "Shared Docker image transport: existing-only or no-push-artifact"
        required: false
        default: no-push-artifact
        type: string
      shared_image_artifact_namespace:
        description: Unique artifact namespace when shared_image_policy=no-push-artifact
        required: false
        default: package-acceptance
        type: string
      candidate_artifact_json:
        description: Immutable Docker image artifact tuple from Full Release Validation
        required: false
        default: ""
        type: string
      prepublish_plugin_registry_json:
        description: Immutable prerelease plugin registry tuple from the package producer
        required: false
        default: ""
        type: string
      suite_profile:
        description: "Acceptance profile: smoke, package, telegram, product, full, or custom"
        required: false
        default: package
        type: string
      docker_lanes:
        description: Comma/space separated Docker lanes when suite_profile=custom
        required: false
        default: ""
        type: string
      published_upgrade_survivor_baseline:
        description: Published OpenClaw package baseline for the published-upgrade-survivor Docker lane
        required: false
        default: openclaw@latest
        type: string
      published_upgrade_survivor_baselines:
        description: Optional baseline list; use supported-lines for latest/previous/extended/floor, last-stable-4, all-since-2026.4.23, release-history, or exact versions
        required: false
        default: ""
        type: string
      published_upgrade_survivor_scenarios:
        description: Optional scenario list for published-upgrade-survivor/update-migration; use reported-issues for known upgrade failure shapes
        required: false
        default: ""
        type: string
      allow_frozen_target_scenario_omissions:
        description: Trusted opt-in to omit survivor scenarios absent from a canonical frozen target
        required: false
        default: false
        type: boolean
      telegram_mode:
        description: Optional Telegram QA lane for the resolved package candidate
        required: false
        default: none
        type: string
      telegram_scenarios:
        description: Optional comma-separated Telegram scenario ids
        required: false
        default: ""
        type: string
    outputs:
      package_artifact_digest:
        description: GitHub artifact service digest for the canonical package
        value: ${{ jobs.resolve_package.outputs.package_artifact_digest }}
      package_artifact_id:
        description: Immutable GitHub artifact id for the canonical package
        value: ${{ jobs.resolve_package.outputs.package_artifact_id }}
      package_artifact_run_attempt:
        description: Producer run attempt for the canonical package artifact
        value: ${{ jobs.resolve_package.outputs.package_artifact_run_attempt }}
      package_artifact_run_id:
        description: Producer run id for the canonical package artifact
        value: ${{ jobs.resolve_package.outputs.package_artifact_run_id }}
      package_file_name:
        description: Canonical package tarball filename
        value: ${{ jobs.resolve_package.outputs.package_file_name }}
      package_source_sha:
        description: Source commit recorded in the canonical package
        value: ${{ jobs.resolve_package.outputs.package_source_sha }}
      package_sha256:
        description: Canonical OpenClaw package SHA-256
        value: ${{ jobs.resolve_package.outputs.package_sha256 }}
      package_version:
        description: Canonical OpenClaw package version
        value: ${{ jobs.resolve_package.outputs.package_version }}
    secrets:
      OPENCLAW_TRUSTED_PACKAGE_TOKEN:
        required: false
      OPENAI_API_KEY:
        required: false
      OPENAI_BASE_URL:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      ANTHROPIC_API_KEY_OLD:
        required: false
      ANTHROPIC_API_TOKEN:
        required: false
      FACTORY_API_KEY:
        required: false
      BYTEPLUS_API_KEY:
        required: false
      CEREBRAS_API_KEY:
        required: false
      DEEPINFRA_API_KEY:
        required: false
      DEEPSEEK_API_KEY:
        required: false
      DASHSCOPE_API_KEY:
        required: false
      GROQ_API_KEY:
        required: false
      KIMI_API_KEY:
        required: false
      MODELSTUDIO_API_KEY:
        required: false
      MOONSHOT_API_KEY:
        required: false
      MISTRAL_API_KEY:
        required: false
      MINIMAX_API_KEY:
        required: false
      OPENCODE_API_KEY:
        required: false
      OPENCODE_ZEN_API_KEY:
        required: false
      OPENCLAW_LIVE_BROWSER_CDP_URL:
        required: false
      OPENCLAW_LIVE_SETUP_TOKEN:
        required: false
      OPENCLAW_LIVE_SETUP_TOKEN_MODEL:
        required: false
      OPENCLAW_LIVE_SETUP_TOKEN_PROFILE:
        required: false
      OPENCLAW_LIVE_SETUP_TOKEN_VALUE:
        required: false
      GEMINI_API_KEY:
        required: false
      GOOGLE_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      QWEN_API_KEY:
        required: false
      FAL_KEY:
        required: false
      RUNWAY_API_KEY:
        required: false
      DEEPGRAM_API_KEY:
        required: false
      TOGETHER_API_KEY:
        required: false
      VYDRA_API_KEY:
        required: false
      XAI_API_KEY:
        required: false
      ZAI_API_KEY:
        required: false
      Z_AI_API_KEY:
        required: false
      BYTEPLUS_ACCESS_KEY_ID:
        required: false
      BYTEPLUS_SECRET_ACCESS_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      OPENCLAW_CODEX_AUTH_JSON:
        required: false
      OPENCLAW_CODEX_CONFIG_TOML:
        required: false
      OPENCLAW_CLAUDE_JSON:
        required: false
      OPENCLAW_CLAUDE_CREDENTIALS_JSON:
        required: false
      OPENCLAW_CLAUDE_SETTINGS_JSON:
        required: false
      OPENCLAW_CLAUDE_SETTINGS_LOCAL_JSON:
        required: false
      OPENCLAW_GEMINI_SETTINGS_JSON:
        required: false
      FIREWORKS_API_KEY:
        required: false
      OPENCLAW_QA_CONVEX_SITE_URL:
        required: false
      OPENCLAW_QA_CONVEX_SECRET_CI:
        required: false

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: package-acceptance-${{ github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"
  PACKAGE_ARTIFACT_NAME: package-under-test-${{ github.run_id }}-${{ github.run_attempt }}
  TELEGRAM_PLUGIN_REGISTRY_ARTIFACT_NAME: package-acceptance-telegram-plugin-registry-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  resolve_package:
    name: Resolve package candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tooling_sha: ${{ steps.tooling.outputs.sha }}
      docker_lanes: ${{ steps.profile.outputs.docker_lanes }}
      include_live_suites: ${{ steps.profile.outputs.include_live_suites }}
      include_openwebui: ${{ steps.profile.outputs.include_openwebui }}
      include_release_path_suites: ${{ steps.profile.outputs.include_release_path_suites }}
      package_artifact_name: ${{ steps.profile.outputs.package_artifact_name }}
      package_artifact_digest: ${{ steps.upload_package.outputs.artifact-digest }}
      package_artifact_id: ${{ steps.upload_package.outputs.artifact-id }}
      package_artifact_run_attempt: ${{ github.run_attempt }}
      package_artifact_run_id: ${{ github.run_id }}
      package_file_name: ${{ steps.resolve.outputs.package_file_name }}
      package_source_sha: ${{ steps.resolve.outputs.package_source_sha }}
      package_sha256: ${{ steps.resolve.outputs.sha256 }}
      package_version: ${{ steps.resolve.outputs.package_version }}
      prepublish_plugin_registry_json: ${{ steps.registry_identity.outputs.json }}
      published_upgrade_survivor_baseline: ${{ steps.resolved_admission.outputs.baseline }}
      published_upgrade_survivor_baselines: ${{ steps.resolved_admission.outputs.baselines }}
      published_upgrade_survivor_baseline_scope: ${{ steps.resolved_admission.outputs.baseline_scope }}
      published_upgrade_survivor_scenarios: ${{ inputs.published_upgrade_survivor_scenarios }}
      telegram_enabled: ${{ steps.profile.outputs.telegram_enabled }}
      telegram_mode: ${{ steps.profile.outputs.telegram_mode }}
      telegram_scenarios: ${{ steps.profile.outputs.telegram_scenarios }}
    steps:
      - name: Resolve called package tooling identity
        id: tooling_identity
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
          WORKFLOW_REF: ${{ inputs.workflow_ref }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const message = 'Invalid package tooling identity or workflow_ref assertion. Dispatch or call package-acceptance.yml at the desired ref and set workflow_ref to its captured SHA, full ref, or corresponding branch/tag name; package_ref independently selects package source.';
          let job;
          try {
            job = JSON.parse(process.env.JOB_CONTEXT);
          } catch {
            throw new Error(message);
          }
          const prefix = 'openclaw/openclaw/.github/workflows/package-acceptance.yml@';
          const ref = typeof job?.workflow_ref === 'string' && job.workflow_ref.startsWith(prefix)
            ? job.workflow_ref.slice(prefix.length) : '';
          const namedRef = /^refs\/(?:heads|tags)\/([^\x00-\x20\x7f~^:?*[\]\\]+)$/.exec(ref);
          const validNamedRef = namedRef && namedRef[0] === ref && !ref.includes('..') && !ref.includes('@{') &&
            !ref.endsWith('.') && ref.split('/').every(part => part && !part.startsWith('.') && !part.endsWith('.lock'));
          const sha = job?.workflow_sha;
          if (job?.workflow_repository !== 'openclaw/openclaw' ||
              process.env.GITHUB_REPOSITORY !== 'openclaw/openclaw' ||
              typeof sha !== 'string' || sha.length !== 40 || !/^[0-9a-f]{40}$/.test(sha) ||
              (!validNamedRef && ref !== sha)) {
            throw new Error(message);
          }
          const assertions = new Set([sha, ref]);
          if (validNamedRef) assertions.add(namedRef[1]);
          if (!assertions.has(process.env.WORKFLOW_REF)) throw new Error(message);
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\n`);
          NODE

      - name: Checkout package workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tooling_identity.outputs.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Validate exact package tooling checkout
        id: tooling
        env:
          EXPECTED_TOOLING_SHA: ${{ steps.tooling_identity.outputs.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const expected = process.env.EXPECTED_TOOLING_SHA;
          if (expected?.length !== 40 || !/^[0-9a-f]{40}$/.test(expected) || sha !== expected) {
            throw new Error('package tooling checkout must match the captured called workflow SHA before setup');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\n`);
          NODE

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          node-version: ${{ env.NODE_VERSION }}
          install-bun: ${{ inputs.source == 'ref' && 'true' || 'false' }}
          install-deps: "true"

      - name: Select acceptance profile
        id: profile
        env:
          ADMISSION_TOOLING_ROOT: ${{ github.workspace }}
          ADMISSION_TOOLING_SHA: ${{ steps.tooling.outputs.sha }}
          SOURCE: ${{ inputs.source }}
          SUITE_PROFILE: ${{ inputs.suite_profile }}
          CUSTOM_DOCKER_LANES: ${{ inputs.docker_lanes }}
          TELEGRAM_MODE: ${{ inputs.telegram_mode }}
          TELEGRAM_SCENARIOS: ${{ inputs.telegram_scenarios }}
        shell: bash
        run: |
          set -euo pipefail
          node "$ADMISSION_TOOLING_ROOT/scripts/preflight-frozen-target-contracts.mjs" \
            --verify-tooling "$ADMISSION_TOOLING_ROOT" "$ADMISSION_TOOLING_SHA"

          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { createPackageAcceptanceSelection } from './scripts/plan-release-workflow-matrix.mjs';
          const selection = createPackageAcceptanceSelection({
            suiteProfile: process.env.SUITE_PROFILE,
            dockerLanes: process.env.CUSTOM_DOCKER_LANES,
            telegramMode: process.env.TELEGRAM_MODE,
            telegramScenarios: process.env.TELEGRAM_SCENARIOS,
          });
          for (const [key, value] of Object.entries(selection)) {
            appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `package_artifact_name=${process.env.PACKAGE_ARTIFACT_NAME}\n`);
          NODE

      - name: Validate prerelease plugin registry input
        id: registry_input
        env:
          CANDIDATE_ARTIFACT_JSON: ${{ inputs.candidate_artifact_json || '' }}
          PREPUBLISH_PLUGIN_REGISTRY_JSON: ${{ inputs.prepublish_plugin_registry_json || '' }}
        shell: bash
        run: |
          set -euo pipefail
          normalize_registry_tuple() {
            local json="$1"
            local source="$2"
            [[ -n "${json// }" ]] || return 0
            jq -cer \
              --arg source "$source" \
              '
                def digits: test("^[1-9][0-9]*$");
                def hex64: test("^[a-f0-9]{64}$");
                def fields: [
                  "prepublishPluginRegistryArtifactName", "prepublishPluginRegistryArtifactId",
                  "prepublishPluginRegistryArtifactDigest", "prepublishPluginRegistryArtifactRunId",
                  "prepublishPluginRegistryArtifactRunAttempt", "prepublishPluginRegistryManifestSha256"
                ];
                def tuple:
                  . as $input
                  | reduce fields[] as $field ({}; .[$field] = $input[$field])
                  | .prepublishPluginRegistryArtifactId |= tostring
                  | .prepublishPluginRegistryArtifactRunId |= tostring
                  | .prepublishPluginRegistryArtifactRunAttempt |= tostring;
                if type != "object" then error("not an object") else . end
                | . as $input
                | [fields[] as $field | select($input | has($field))] as $present
                | if ($present | length) == 0 and $source == "candidate" then empty
                  elif ($present | length) != 6 or
                    ($source == "direct" and ((keys | sort) != (fields | sort)))
                  then error("incomplete or unexpected fields")
                  else tuple
                  end
                | . as $tuple
                | select(
                    (
                      .prepublishPluginRegistryArtifactName ==
                        ("docker-e2e-prepublish-plugin-registry-" +
                        $tuple.prepublishPluginRegistryArtifactRunId + "-" +
                        $tuple.prepublishPluginRegistryArtifactRunAttempt) or
                      .prepublishPluginRegistryArtifactName ==
                        ("package-acceptance-telegram-plugin-registry-" +
                        $tuple.prepublishPluginRegistryArtifactRunId + "-" +
                        $tuple.prepublishPluginRegistryArtifactRunAttempt)
                    ) and
                    ([
                      .prepublishPluginRegistryArtifactId,
                      .prepublishPluginRegistryArtifactRunId,
                      .prepublishPluginRegistryArtifactRunAttempt
                    ] | all(.[]; digits)) and
                    ([
                      .prepublishPluginRegistryArtifactDigest,
                      .prepublishPluginRegistryManifestSha256
                    ] | all(.[]; hex64))
                  )
              ' <<< "$json" 2>/dev/null || {
                echo "Prerelease plugin registry JSON must contain one complete immutable tuple." >&2
                exit 1
              }
          }

          candidate_registry="$(normalize_registry_tuple "$CANDIDATE_ARTIFACT_JSON" candidate)"
          direct_registry="$(normalize_registry_tuple "$PREPUBLISH_PLUGIN_REGISTRY_JSON" direct)"
          if [[ -n "$candidate_registry" && -n "$direct_registry" &&
                "$candidate_registry" != "$direct_registry" ]]; then
            echo "Prerelease plugin registry inputs disagree." >&2
            exit 1
          fi
          printf 'json=%s\n' "${direct_registry:-$candidate_registry}" >> "$GITHUB_OUTPUT"

      - name: Validate package artifact input identity
        id: input_artifact
        if: inputs.source == 'artifact'
        env:
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          ARTIFACT_RUN_ATTEMPT: ${{ inputs.artifact_run_attempt }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          EXPECTED_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          EXPECTED_PACKAGE_FILE_NAME: ${{ inputs.package_file_name }}
          EXPECTED_PACKAGE_SOURCE_SHA: ${{ inputs.package_source_sha }}
          EXPECTED_PACKAGE_VERSION: ${{ inputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ||
                ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ||
                -z "${ARTIFACT_NAME// }" ||
                ! "$ARTIFACT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ||
                ! "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ||
                ! "$EXPECTED_PACKAGE_FILE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.tgz$ ||
                ! "$EXPECTED_PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ||
                ! "$EXPECTED_PACKAGE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ||
                -z "${EXPECTED_PACKAGE_VERSION// }" ]]; then
            echo "source=artifact requires the complete immutable artifact and package identity tuple." >&2
            exit 1
          fi
          [[ "$ARTIFACT_NAME" == *"-${ARTIFACT_RUN_ID}-${ARTIFACT_RUN_ATTEMPT}" ]] || {
            echo "Package artifact name does not bind the declared producer run attempt." >&2
            exit 1
          }
          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          jq -e \
            --arg digest "sha256:${ARTIFACT_DIGEST}" \
            --arg id "$ARTIFACT_ID" \
            --arg name "$ARTIFACT_NAME" \
            --arg run_id "$ARTIFACT_RUN_ID" \
            '
              (.id | tostring) == $id and
              .name == $name and
              .expired == false and
              .digest == $digest and
              (.workflow_run.id | tostring) == $run_id
            ' <<< "$artifact_json" >/dev/null || {
              echo "Package artifact identity does not match the requested immutable tuple." >&2
              exit 1
            }
          attempt_json="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}/attempts/${ARTIFACT_RUN_ATTEMPT}"
          )"
          jq -e \
            --arg attempt "$ARTIFACT_RUN_ATTEMPT" \
            --arg run_id "$ARTIFACT_RUN_ID" \
            '(.id | tostring) == $run_id and (.run_attempt | tostring) == $attempt' \
            <<< "$attempt_json" >/dev/null || {
            echo "Package artifact producer run attempt does not match the requested tuple." >&2
            exit 1
          }
          {
            echo "artifact_digest=$ARTIFACT_DIGEST"
            echo "run_attempt=$ARTIFACT_RUN_ATTEMPT"
            echo "run_id=$ARTIFACT_RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Download package artifact input
        if: inputs.source == 'artifact'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: .artifacts/package-candidate-input
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Resolve known package source
        id: known_source
        if: inputs.source == 'ref'
        env:
          PACKAGE_REF: ${{ inputs.package_ref }}
        run: |
          bash scripts/github/resolve-openclaw-ref.sh \
            --ref "$PACKAGE_REF" --github-output "$GITHUB_OUTPUT"

      - name: Acquire known package source
        if: inputs.source == 'ref'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.known_source.outputs.sha }}
          path: .frozen-target
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Plan known package source admission
        id: known_selection
        if: inputs.source == 'ref'
        env:
          ADMISSION_WORKFLOW: package
          ADMISSION_INPUTS: ${{ toJSON(inputs) }}
          ADMISSION_SELECTED_ROOT: ${{ github.workspace }}/.frozen-target
          ADMISSION_SELECTED_SHA: ${{ steps.known_source.outputs.sha }}
          ADMISSION_TOOLING_ROOT: ${{ github.workspace }}
          ADMISSION_TOOLING_SHA: ${{ steps.tooling.outputs.sha }}
          ADMISSION_WORKFLOW_REF: ${{ format('{0}/.github/workflows/package-acceptance.yml@{1}', github.repository, steps.tooling.outputs.sha) }}
          ADMISSION_STAGE: known-source
        run: |
          set -euo pipefail
          umask 077
          node "$ADMISSION_TOOLING_ROOT/scripts/preflight-frozen-target-contracts.mjs" --workflow-request > "$RUNNER_TEMP/frozen-admission-request.json"
          node "$ADMISSION_TOOLING_ROOT/scripts/preflight-frozen-target-contracts.mjs" --plan "$RUNNER_TEMP/frozen-admission-request.json" > "$RUNNER_TEMP/frozen-admission-selection.json"

      - name: Acquire known package contract objects
        if: inputs.source == 'ref'
        env:
          ADMISSION_SELECTED_ROOT: ${{ github.workspace }}/.frozen-target
          ADMISSION_SELECTED_SHA: ${{ steps.known_source.outputs.sha }}
        run: &package_contract_acquisition |
          set -euo pipefail
          if [[ "$(jq -r '.sourceHistory' "$RUNNER_TEMP/frozen-admission-selection.json")" == true ]]; then
            if [[ "$(git -C "$ADMISSION_SELECTED_ROOT" rev-parse --is-shallow-repository)" == true ]]; then
              git -C "$ADMISSION_SELECTED_ROOT" fetch --unshallow --filter=blob:none --no-tags origin "$ADMISSION_SELECTED_SHA"
            fi
            git -C "$ADMISSION_SELECTED_ROOT" fetch --filter=blob:none --no-tags origin '+refs/heads/extended-stable/*:refs/remotes/origin/extended-stable/*'
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const paths = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/frozen-admission-selection.json`, 'utf8')).sourcePaths;
          const git = (...args) => execFileSync('git', ['-C', process.env.ADMISSION_SELECTED_ROOT, ...args], { timeout: 120000, maxBuffer: 64 * 1024 * 1024 });
          if (!paths.length) process.exit(0);
          const objects = git('ls-tree', '-r', '--format=%(objectname)', process.env.ADMISSION_SELECTED_SHA, '--', ...paths).toString().trim().split('\n').filter(Boolean);
          if (objects.length > 4096) throw new Error('selected contract closure exceeds limit');
          let bytes = 0;
          for (const oid of new Set(objects)) {
            const size = Number(git('cat-file', '-s', oid).toString());
            if (size > 16 * 1024 * 1024 || (bytes += size) > 64 * 1024 * 1024) throw new Error('selected contract bytes exceed limit');
            git('cat-file', 'blob', oid);
          }
          NODE

      - name: Admit known package source before packing
        if: inputs.source == 'ref'
        env:
          ADMISSION_TOOLING_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          env -i PATH="$PATH" LANG=C.UTF-8 \
            node "$ADMISSION_TOOLING_ROOT/scripts/preflight-frozen-target-contracts.mjs" \
            "$RUNNER_TEMP/frozen-admission-request.json" > "$RUNNER_TEMP/frozen-admission-known-source.json"

      - name: Resolve package candidate
        id: resolve
        env:
          SOURCE: ${{ inputs.source }}
          PACKAGE_REF: ${{ steps.known_source.outputs.sha || inputs.package_ref }}
          PACKAGE_SPEC: ${{ inputs.package_spec }}
          PACKAGE_URL: ${{ inputs.package_url }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          PACKAGE_FILE_NAME: ${{ inputs.package_file_name }}
          PACKAGE_SOURCE_SHA: ${{ inputs.package_source_sha }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          PREPUBLISH_PLUGIN_REGISTRY_JSON: ${{ steps.registry_input.outputs.json }}
          PUBLISHED_ARTIFACT: ${{ fromJSON(inputs.candidate_artifact_json || '{}').packagePublished == true }}
          TELEGRAM_MODE: ${{ inputs.telegram_mode }}
          TRUSTED_SOURCE_ID: ${{ inputs.trusted_source_id }}
          OPENCLAW_TRUSTED_PACKAGE_TOKEN: ${{ secrets.OPENCLAW_TRUSTED_PACKAGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir=""
          if [[ "$SOURCE" == "artifact" ]]; then
            artifact_dir=".artifacts/package-candidate-input"
            artifact_tarball="${artifact_dir}/${PACKAGE_FILE_NAME}"
            [[ -f "$artifact_tarball" ]] || {
              echo "Declared package tarball is missing from the selected artifact." >&2
              exit 1
            }
            artifact_sha256="$(sha256sum "$artifact_tarball" | awk '{print $1}')"
            [[ "$artifact_sha256" == "$PACKAGE_SHA256" ]] || {
              echo "Selected artifact package SHA-256 differs from package_sha256." >&2
              exit 1
            }
          fi

          set --
          if [[ -z "$PREPUBLISH_PLUGIN_REGISTRY_JSON" &&
                "${PUBLISHED_ARTIFACT:-false}" != "true" &&
                "$TELEGRAM_MODE" != "none" &&
                ("$SOURCE" == "ref" || "$SOURCE" == "artifact") ]]; then
            set -- \
              --plugin-registry-output-dir .artifacts/package-acceptance-telegram-plugin-registry \
              --required-plugin-packages-json '["@openclaw/codex"]'
          fi

          node --import tsx scripts/resolve-openclaw-package-candidate.mts \
            --source "$SOURCE" \
            --package-ref "$PACKAGE_REF" \
            --package-spec "$PACKAGE_SPEC" \
            --package-url "$PACKAGE_URL" \
            --package-sha256 "$PACKAGE_SHA256" \
            --trusted-source-id "$TRUSTED_SOURCE_ID" \
            --artifact-dir "${artifact_dir:-.}" \
            --output-dir .artifacts/docker-e2e-package \
            --output-name openclaw-current.tgz \
            --metadata .artifacts/docker-e2e-package/package-candidate.json \
            --github-output "$GITHUB_OUTPUT" \
            "$@"
          echo "package_file_name=openclaw-current.tgz" >> "$GITHUB_OUTPUT"
          if [[ "$SOURCE" == "artifact" ]]; then
            jq -e \
              --arg digest "$PACKAGE_SHA256" \
              --arg source_sha "$PACKAGE_SOURCE_SHA" \
              --arg version "$PACKAGE_VERSION" \
              '
                .name == "openclaw" and
                .sha256 == $digest and
                .packageSourceSha == $source_sha and
                .version == $version
              ' .artifacts/docker-e2e-package/package-candidate.json >/dev/null || {
              echo "Resolved package identity differs from the declared immutable tuple." >&2
              exit 1
            }
          fi

      - name: Plan frozen source admission
        id: frozen_selection
        env:
          ADMISSION_WORKFLOW: package
          ADMISSION_INPUTS: ${{ toJSON(inputs) }}
          ADMISSION_SELECTED_ROOT: ${{ github.workspace }}/.frozen-target
          ADMISSION_TOOLING_ROOT: ${{ github.workspace }}
          ADMISSION_TOOLING_SHA: ${{ steps.tooling.outputs.sha }}
          ADMISSION_WORKFLOW_REF: ${{ format('{0}/.github/workflows/package-acceptance.yml@{1}', github.repository, steps.tooling.outputs.sha) }}
          ADMISSION_SELECTED_SHA: ${{ steps.resolve.outputs.package_source_sha }}
          ADMISSION_PACKAGE_SOURCE_SHA: ${{ steps.resolve.outputs.package_source_sha }}
          ADMISSION_PACKAGE_SHA256: ${{ steps.resolve.outputs.sha256 }}
          ADMISSION_PACKAGE_VERSION: ${{ steps.resolve.outputs.package_version }}
          ADMISSION_BASELINES_RESOLVED: "false"
          ADMISSION_STAGE: resolved-package
        run: |
          set -euo pipefail
          umask 077
          node "$ADMISSION_TOOLING_ROOT/scripts/preflight-frozen-target-contracts.mjs" --workflow-request > "$RUNNER_TEMP/frozen-admission-request.json"
          node "$ADMISSION_TOOLING_ROOT/scripts/preflight-frozen-target-contracts.mjs" --plan "$RUNNER_TEMP/frozen-admission-request.json" > "$RUNNER_TEMP/frozen-admission-selection.json"
          printf 'upgrade_baselines_required=%s\n' "$(jq -er 'any(.obligations[]; .kind == "upgrade-baselines") | tostring' "$RUNNER_TEMP/frozen-admission-selection.json")" >> "$GITHUB_OUTPUT"

      - name: Resolve published upgrade survivor baselines
        id: upgrade_survivor_baselines
        if: steps.frozen_selection.outputs.upgrade_baselines_required == 'true'
        env:
          CANDIDATE_VERSION: ${{ steps.resolve.outputs.package_version }}
          CANDIDATE_PUBLISHED: ${{ inputs.source == 'npm' || fromJSON(inputs.candidate_artifact_json || '{}').packagePublished == true }}
          FALLBACK_BASELINE: ${{ inputs.published_upgrade_survivor_baseline }}
          REQUESTED_BASELINES: ${{ inputs.published_upgrade_survivor_baselines }}
          TARGET_CONTEXT_REF: ${{ inputs.target_context_ref }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fallback_baseline="$FALLBACK_BASELINE"
          npm_versions_json=""
          npm_dist_tags_json=""
          if [[ "$fallback_baseline" == "openclaw@latest" ||
                "$REQUESTED_BASELINES" == *"supported-lines"* ||
                "$REQUESTED_BASELINES" == *"release-history"* ||
                "$REQUESTED_BASELINES" == *"all-since-"* ||
                "$REQUESTED_BASELINES" == *"last-stable-"* ]]; then
            npm_versions_json="$RUNNER_TEMP/openclaw-npm-versions.json"
            npm view openclaw versions --json --silent --prefer-online > "$npm_versions_json"
          fi
          if [[ "$REQUESTED_BASELINES" == *"supported-lines"* ]]; then
            npm_dist_tags_json="$RUNNER_TEMP/openclaw-npm-dist-tags.json"
            npm view openclaw dist-tags --json --silent --prefer-online > "$npm_dist_tags_json"
          fi
          if [[ "$fallback_baseline" == "openclaw@latest" ]]; then
            fallback_baseline="$(node scripts/lib/release-upgrade-baseline.mjs \
              --candidate-version "$CANDIDATE_VERSION" \
              --candidate-published "$CANDIDATE_PUBLISHED" \
              --target-context-ref "$TARGET_CONTEXT_REF" \
              --versions-json "$npm_versions_json")"
          fi
          releases_json=""
          if [[ "$REQUESTED_BASELINES" == *"release-history"* || "$REQUESTED_BASELINES" == *"all-since-"* || "$REQUESTED_BASELINES" == *"last-stable-"* ]]; then
            releases_json=".artifacts/package-candidate-input/openclaw-releases.json"
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,publishedAt,isPrerelease > "$releases_json"
          fi
          args=(
            --requested "$REQUESTED_BASELINES"
            --fallback "$fallback_baseline"
            --candidate-version "$CANDIDATE_VERSION"
            --candidate-published "$CANDIDATE_PUBLISHED"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ -n "$npm_versions_json" ]]; then
            args+=(--npm-versions-json "$npm_versions_json")
          fi
          if [[ -n "$npm_dist_tags_json" ]]; then
            args+=(--npm-dist-tags-json "$npm_dist_tags_json")
          fi
          if [[ -n "$releases_json" ]]; then
            args+=(
              --releases-json "$releases_json"
              --history-count 6
              --include-version 2026.4.23
              --pre-date 2026-03-15T00:00:00Z
            )
          fi
          node --import tsx scripts/resolve-upgrade-survivor-baselines.mts "${args[@]}" >/dev/null
          echo "baseline=$fallback_baseline" >> "$GITHUB_OUTPUT"

      - name: Pin published upgrade baseline versions
        id: exact_baselines
        if: steps.frozen_selection.outputs.upgrade_baselines_required == 'true'
        env:
          BASELINE: ${{ steps.upgrade_survivor_baselines.outputs.baseline }}
          BASELINES: ${{ steps.upgrade_survivor_baselines.outputs.baselines }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { normalizeUpgradeSurvivorBaselineSpec, parseUpgradeSurvivorBaselineSpecs } from './scripts/lib/upgrade-survivor-policy.mjs';
          import { resolveNpmJsonString } from './scripts/lib/npm-json-output.mts';
          const captured = new Map();
          const exact = raw => {
            const spec = normalizeUpgradeSurvivorBaselineSpec(raw);
            if (!spec) throw new Error('missing upgrade baseline');
            if (!captured.has(spec)) {
              const value = /^openclaw@[0-9]/u.test(spec) ? spec :
                normalizeUpgradeSurvivorBaselineSpec(resolveNpmJsonString(JSON.parse(execFileSync('npm',
                  ['view', spec, 'version', '--json', '--silent', '--prefer-online'],
                  { encoding: 'utf8', timeout: 60000, maxBuffer: 1024 * 1024 }))));
              if (!/^openclaw@[0-9]/u.test(value ?? '')) throw new Error('upgrade baseline did not resolve to an exact version');
              captured.set(spec, value);
            }
            return captured.get(spec);
          };
          const baseline = exact(process.env.BASELINE);
          const baselines = parseUpgradeSurvivorBaselineSpecs(process.env.BASELINES).map(exact);
          appendFileSync(process.env.GITHUB_OUTPUT, `baseline=${baseline}\nbaselines=${(baselines.length ? baselines : [baseline]).join(' ')}\n`);
          NODE

      - name: Finalize frozen source admission
        id: resolved_admission
        env:
          ADMISSION_TOOLING_ROOT: ${{ github.workspace }}
          BASELINE: ${{ steps.exact_baselines.outputs.baseline }}
          BASELINES: ${{ steps.exact_baselines.outputs.baselines }}
          BASELINE_SCOPE: ${{ steps.upgrade_survivor_baselines.outputs.baseline_scope }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          const requestPath = `${process.env.RUNNER_TEMP}/frozen-admission-request.json`;
          const request = JSON.parse(readFileSync(requestPath, 'utf8'));
          const plan = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/frozen-admission-selection.json`, 'utf8'));
          const options = request.options;
          if (plan.obligations.some(entry => entry.kind === 'upgrade-baselines')) {
            options.upgradeSurvivorBaseline = process.env.BASELINE;
            options.upgradeSurvivorBaselines = process.env.BASELINES;
            options.upgradeSurvivorBaselineScope = process.env.BASELINE_SCOPE;
            options.baselinesResolved = true;
            writeFileSync(requestPath, `${JSON.stringify(request)}\n`, { mode: 0o600 });
          }
          for (const [key, value] of Object.entries({
            baseline: options.upgradeSurvivorBaseline,
            baselines: options.upgradeSurvivorBaselines,
            baseline_scope: options.upgradeSurvivorBaselineScope,
          })) {
            if (/[\r\n]/u.test(value)) {
              let delimiter = 'OPENCLAW_ADMISSION_OUTPUT';
              const lines = value.split(/\r\n|\r|\n/u);
              while (lines.includes(delimiter)) delimiter += '_';
              appendFileSync(process.env.GITHUB_OUTPUT, `${key}<<${delimiter}\n${value}\n${delimiter}\n`);
            } else {
              appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
            }
          }
          NODE
          node "$ADMISSION_TOOLING_ROOT/scripts/preflight-frozen-target-contracts.mjs" --plan "$RUNNER_TEMP/frozen-admission-request.json" > "$RUNNER_TEMP/frozen-admission-selection.json"

      - name: Validate resolved package source
        env:
          PACKAGE_SOURCE_SHA: ${{ steps.resolve.outputs.package_source_sha }}
          KNOWN_SOURCE_SHA: ${{ steps.known_source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo "Exact package source is required for selected source-contract admission." >&2
            exit 1
          }
          [[ -z "$KNOWN_SOURCE_SHA" || "$KNOWN_SOURCE_SHA" == "$PACKAGE_SOURCE_SHA" ]] || {
            echo "Resolved package source differs from the admitted pre-pack source." >&2
            exit 1
          }
          bash scripts/github/resolve-openclaw-ref.sh \
            --ref "$PACKAGE_SOURCE_SHA" --expected-sha "$PACKAGE_SOURCE_SHA"

      - name: Acquire resolved package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.package_source_sha }}
          path: .frozen-target
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Acquire selected contract objects
        env:
          ADMISSION_SELECTED_ROOT: ${{ github.workspace }}/.frozen-target
          ADMISSION_SELECTED_SHA: ${{ steps.resolve.outputs.package_source_sha }}
        run: *package_contract_acquisition

      - name: Admit frozen source contracts
        id: frozen_admission
        env:
          ADMISSION_TOOLING_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          env -i PATH="$PATH" LANG=C.UTF-8 \
            node "$ADMISSION_TOOLING_ROOT/scripts/preflight-frozen-target-contracts.mjs" \
            "$RUNNER_TEMP/frozen-admission-request.json" > "$RUNNER_TEMP/frozen-admission.json"
          printf 'digest=%s\n' "$(jq -er '.digest' "$RUNNER_TEMP/frozen-admission.json")" >> "$GITHUB_OUTPUT"

      - name: Upload frozen admission diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frozen-source-admission-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/frozen-admission.json
            ${{ runner.temp }}/frozen-admission-known-source.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload package-under-test artifact
        id: upload_package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.PACKAGE_ARTIFACT_NAME }}
          path: |
            .artifacts/docker-e2e-package/openclaw-current.tgz
            .artifacts/docker-e2e-package/package-candidate.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload Telegram prerelease plugin registry artifact
        id: upload_telegram_registry
        if: steps.resolve.outputs.plugin_registry_manifest_sha256 != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.TELEGRAM_PLUGIN_REGISTRY_ARTIFACT_NAME }}
          path: .artifacts/package-acceptance-telegram-plugin-registry/
          retention-days: 14
          if-no-files-found: error

      - name: Prepare prerelease plugin registry identity
        id: registry_identity
        env:
          GENERATED_ARTIFACT_DIGEST: ${{ steps.upload_telegram_registry.outputs.artifact-digest }}
          GENERATED_ARTIFACT_ID: ${{ steps.upload_telegram_registry.outputs.artifact-id }}
          GENERATED_MANIFEST_SHA256: ${{ steps.resolve.outputs.plugin_registry_manifest_sha256 }}
          SUPPLIED_REGISTRY_JSON: ${{ steps.registry_input.outputs.json }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$GENERATED_ARTIFACT_ID" ]]; then
            [[ -z "$SUPPLIED_REGISTRY_JSON" ]] || {
              echo "Package Acceptance generated a registry despite a supplied immutable tuple." >&2
              exit 1
            }
            SUPPLIED_REGISTRY_JSON="$(
              jq -cn \
                --arg prepublishPluginRegistryArtifactName "$TELEGRAM_PLUGIN_REGISTRY_ARTIFACT_NAME" \
                --arg prepublishPluginRegistryArtifactId "$GENERATED_ARTIFACT_ID" \
                --arg prepublishPluginRegistryArtifactDigest "$GENERATED_ARTIFACT_DIGEST" \
                --arg prepublishPluginRegistryArtifactRunId "$GITHUB_RUN_ID" \
                --arg prepublishPluginRegistryArtifactRunAttempt "$GITHUB_RUN_ATTEMPT" \
                --arg prepublishPluginRegistryManifestSha256 "$GENERATED_MANIFEST_SHA256" \
                '$ARGS.named'
            )"
          fi
          printf 'json=%s\n' "$SUPPLIED_REGISTRY_JSON" >> "$GITHUB_OUTPUT"

      - name: Summarize package candidate
        env:
          INPUT_ARTIFACT_DIGEST: ${{ steps.input_artifact.outputs.artifact_digest }}
          INPUT_ARTIFACT_ID: ${{ inputs.artifact_id }}
          INPUT_ARTIFACT_RUN_ATTEMPT: ${{ steps.input_artifact.outputs.run_attempt }}
          INPUT_ARTIFACT_RUN_ID: ${{ steps.input_artifact.outputs.run_id }}
          OUTPUT_ARTIFACT_DIGEST: ${{ steps.upload_package.outputs.artifact-digest }}
          OUTPUT_ARTIFACT_ID: ${{ steps.upload_package.outputs.artifact-id }}
          PACKAGE_SHA256: ${{ steps.resolve.outputs.sha256 }}
          PACKAGE_VERSION: ${{ steps.resolve.outputs.package_version }}
          PACKAGE_REF: ${{ inputs.package_ref }}
          TRUSTED_SOURCE_ID: ${{ inputs.trusted_source_id }}
          SOURCE: ${{ inputs.source }}
          SUITE_PROFILE: ${{ inputs.suite_profile }}
          WORKFLOW_REF: ${{ inputs.workflow_ref }}
          PUBLISHED_UPGRADE_SURVIVOR_BASELINE: ${{ steps.resolved_admission.outputs.baseline }}
          PUBLISHED_UPGRADE_SURVIVOR_BASELINES: ${{ steps.resolved_admission.outputs.baselines }}
          PUBLISHED_UPGRADE_SURVIVOR_BASELINE_SCOPE: ${{ steps.resolved_admission.outputs.baseline_scope }}
          PUBLISHED_UPGRADE_SURVIVOR_SCENARIOS: ${{ inputs.published_upgrade_survivor_scenarios }}
        shell: bash
        run: |
          {
            echo "## Package acceptance"
            echo
            echo "- Source: \`${SOURCE}\`"
            echo "- Workflow ref: \`${WORKFLOW_REF}\`"
            if [[ "${SOURCE}" == "ref" ]]; then
              echo "- Package ref: \`${PACKAGE_REF}\`"
            fi
            if [[ "${SOURCE}" == "trusted-url" ]]; then
              echo "- Trusted source: \`${TRUSTED_SOURCE_ID}\`"
            fi
            echo "- Version: \`${PACKAGE_VERSION}\`"
            echo "- SHA-256: \`${PACKAGE_SHA256}\`"
            echo "- Artifact id: \`${OUTPUT_ARTIFACT_ID}\`"
            echo "- Artifact digest: \`${OUTPUT_ARTIFACT_DIGEST}\`"
            echo "- Artifact producer: run \`${GITHUB_RUN_ID}\`, attempt \`${GITHUB_RUN_ATTEMPT}\`"
            if [[ "$SOURCE" == "artifact" ]]; then
              echo "- Input artifact id: \`${INPUT_ARTIFACT_ID}\`"
              echo "- Input artifact digest: \`${INPUT_ARTIFACT_DIGEST}\`"
              echo "- Input artifact producer: run \`${INPUT_ARTIFACT_RUN_ID}\`, attempt \`${INPUT_ARTIFACT_RUN_ATTEMPT}\`"
            fi
            echo "- Profile: \`${SUITE_PROFILE}\`"
            echo "- Published upgrade survivor baseline: \`${PUBLISHED_UPGRADE_SURVIVOR_BASELINE}\`"
            echo "- Published upgrade survivor baselines: \`${PUBLISHED_UPGRADE_SURVIVOR_BASELINES}\`"
            echo "- Published upgrade survivor baseline scope: \`${PUBLISHED_UPGRADE_SURVIVOR_BASELINE_SCOPE}\`"
            echo "- Published upgrade survivor scenarios: \`${PUBLISHED_UPGRADE_SURVIVOR_SCENARIOS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  package_integrity:
    name: Package integrity
    needs: resolve_package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout package workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_package.outputs.tooling_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup package validation dependencies
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "false"
          install-deps: "true"

      - name: Download package-under-test artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.resolve_package.outputs.package_artifact_id }}
          path: .artifacts/docker-e2e-package
          run-id: ${{ needs.resolve_package.outputs.package_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Enforce public package integrity
        env:
          EXPECTED_PACKAGE_SHA256: ${{ needs.resolve_package.outputs.package_sha256 }}
          OPENCLAW_PACKAGE_TARBALL_CHECK_TIMINGS: "0"
        shell: bash
        run: |
          set -euo pipefail
          package=".artifacts/docker-e2e-package/openclaw-current.tgz"
          actual_sha256="$(sha256sum "$package" | awk '{print $1}')"
          [[ "$actual_sha256" == "$EXPECTED_PACKAGE_SHA256" ]] || {
            echo "Canonical package artifact SHA-256 differs from the resolver output." >&2
            exit 1
          }
          node scripts/check-openclaw-package-tarball.mjs "$package"

  npm_12_install_sh:
    name: npm 12 install.sh acceptance
    needs: [resolve_package, package_integrity]
    if: inputs.suite_profile != 'telegram'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout package workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_package.outputs.tooling_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download package-under-test artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.resolve_package.outputs.package_artifact_id }}
          path: .artifacts/docker-e2e-package
          run-id: ${{ needs.resolve_package.outputs.package_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Validate prerelease plugin registry artifact identity
        if: needs.resolve_package.outputs.prepublish_plugin_registry_json != ''
        env:
          ARTIFACT_DIGEST: ${{ fromJSON(needs.resolve_package.outputs.prepublish_plugin_registry_json || '{}').prepublishPluginRegistryArtifactDigest || '' }}
          ARTIFACT_ID: ${{ fromJSON(needs.resolve_package.outputs.prepublish_plugin_registry_json || '{}').prepublishPluginRegistryArtifactId || '' }}
          ARTIFACT_NAME: ${{ fromJSON(needs.resolve_package.outputs.prepublish_plugin_registry_json || '{}').prepublishPluginRegistryArtifactName || '' }}
          ARTIFACT_RUN_ATTEMPT: ${{ fromJSON(needs.resolve_package.outputs.prepublish_plugin_registry_json || '{}').prepublishPluginRegistryArtifactRunAttempt || '' }}
          ARTIFACT_RUN_ID: ${{ fromJSON(needs.resolve_package.outputs.prepublish_plugin_registry_json || '{}').prepublishPluginRegistryArtifactRunId || '' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/docker/shared-image-artifact.sh \
            verify-upload "Prerelease plugin registry" \
            "$ARTIFACT_ID" "$ARTIFACT_NAME" "$ARTIFACT_DIGEST" \
            "$ARTIFACT_RUN_ID" "$ARTIFACT_RUN_ATTEMPT"

      - name: Download prerelease plugin registry artifact
        if: needs.resolve_package.outputs.prepublish_plugin_registry_json != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ fromJSON(needs.resolve_package.outputs.prepublish_plugin_registry_json || '{}').prepublishPluginRegistryArtifactId || '' }}
          path: .artifacts/prepublish-plugin-registry
          run-id: ${{ fromJSON(needs.resolve_package.outputs.prepublish_plugin_registry_json || '{}').prepublishPluginRegistryArtifactRunId || '' }}
          github-token: ${{ github.token }}

      - name: Run install.sh with npm 12
        env:
          EXPECTED_PACKAGE_SHA256: ${{ needs.resolve_package.outputs.package_sha256 }}
          EXPECTED_PACKAGE_VERSION: ${{ needs.resolve_package.outputs.package_version }}
          OPENCLAW_DOCKER_E2E_SELECTED_SHA: ${{ needs.resolve_package.outputs.package_source_sha }}
          OPENCLAW_PREPUBLISH_PLUGIN_REGISTRY_CANDIDATE_VERSION: ${{ needs.resolve_package.outputs.package_version }}
          OPENCLAW_PREPUBLISH_PLUGIN_REGISTRY_DIR: ${{ needs.resolve_package.outputs.prepublish_plugin_registry_json != '' && format('{0}/.artifacts/prepublish-plugin-registry', github.workspace) || '' }}
          OPENCLAW_PREPUBLISH_PLUGIN_REGISTRY_MANIFEST_SHA256: ${{ fromJSON(needs.resolve_package.outputs.prepublish_plugin_registry_json || '{}').prepublishPluginRegistryManifestSha256 || '' }}
        shell: bash
        run: |
          set -euo pipefail
          package="$PWD/.artifacts/docker-e2e-package/openclaw-current.tgz"
          [[ "$(sha256sum "$package" | awk '{print $1}')" == "$EXPECTED_PACKAGE_SHA256" ]]
          npm_tool="$RUNNER_TEMP/openclaw-npm12-tool"
          install_home="$RUNNER_TEMP/openclaw-npm12-home"
          install_prefix="$RUNNER_TEMP/openclaw-npm12-prefix"
          mkdir -p "$install_home" "$install_prefix"
          npm install -g --prefix "$npm_tool" npm@12.0.2
          export PATH="$npm_tool/bin:$install_prefix/bin:$PATH"
          [[ "$(npm --version)" == "12.0.2" ]]
          HOME="$install_home" \
            NPM_CONFIG_CACHE="$RUNNER_TEMP/openclaw-npm12-cache" \
            NPM_CONFIG_PREFIX="$install_prefix" \
            OPENCLAW_VERSION="$package" \
            bash scripts/e2e/lib/prepublish-plugin-registry.sh \
              bash scripts/install.sh --install-method npm --no-prompt --no-onboard
          source scripts/docker/install-sh-common/version-parse.sh
          installed_version="$(extract_openclaw_semver "$("$install_prefix/bin/openclaw" --version)")"
          [[ "$installed_version" == "$EXPECTED_PACKAGE_VERSION" ]] || {
            echo "Installed OpenClaw version $installed_version differs from expected $EXPECTED_PACKAGE_VERSION." >&2
            exit 1
          }
          pending="$install_prefix/lib/node_modules/openclaw/.openclaw-lifecycle-pending"
          legacy_guard="$install_prefix/lib/node_modules/openclaw/dist/openclaw-install-guard"
          [[ ! -e "$pending" ]]
          [[ ! -e "$legacy_guard" ]]

  docker_acceptance:
