# TASK-ONLY BR DIAGNOSTIC BRANCH. Do not land this replacement workflow.
name: Package Acceptance
on:
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed proof workflow SHA, matching dispatch ref
        required: true
        type: string
      artifact_run_id:
        description: Final-source CI package producer run
        required: true
        type: string
      artifact_run_attempt:
        description: Exact producer attempt
        required: true
        type: string
      artifact_id:
        description: Immutable final-source package artifact ID
        required: true
        type: string
      artifact_name:
        description: Exact producer artifact name
        required: true
        type: string
      artifact_digest:
        description: GitHub artifact archive SHA-256 without prefix
        required: true
        type: string
      package_file_name:
        description: Exact .tgz member filename
        required: true
        type: string
      package_sha256:
        description: Exact package bytes SHA-256
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: br-beta-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  beta_native:
    name: BR beta to exact repair under native systemd
    if: github.repository == 'openclaw/openclaw'
    runs-on: ubuntu-24.04
    # Canonical ci-published-driver-update.update omits a job timeout too.
    # Its effective job default and all finite native/update bounds are retained.
    env:
      EXPECTED_SOURCE: bcae09093b5a06099cd3a3f0f3d5f4e4b499ad7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 2
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Verify immutable producer identity and disk reserve
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ inputs.workflow_ref }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_RUN_ATTEMPT: ${{ inputs.artifact_run_attempt }}
          PACKAGE_FILE: ${{ inputs.package_file_name }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/br-beta-native
          test "$WORKFLOW_REF" = "$GITHUB_SHA"
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ && "$ARTIFACT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ && "$PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ && "$PACKAGE_FILE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.tgz$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > .artifacts/br-beta-native/artifact-identity.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/attempts/$ARTIFACT_RUN_ATTEMPT" > .artifacts/br-beta-native/producer-identity.json
          jq -e --arg id "$ARTIFACT_ID" --arg name "$ARTIFACT_NAME" --arg digest "sha256:$ARTIFACT_DIGEST" --arg run "$ARTIFACT_RUN_ID" --arg source "$EXPECTED_SOURCE" --arg attempt "$ARTIFACT_RUN_ATTEMPT" \
            '(.id|tostring)==$id and .name==$name and .name==("published-driver-candidate-"+$source+"-"+$attempt) and .digest==$digest and .expired==false and (.workflow_run.id|tostring)==$run and .workflow_run.head_sha==$source' .artifacts/br-beta-native/artifact-identity.json
          jq -e --arg run "$ARTIFACT_RUN_ID" --arg attempt "$ARTIFACT_RUN_ATTEMPT" --arg source "$EXPECTED_SOURCE" \
            '(.id|tostring)==$run and (.run_attempt|tostring)==$attempt and .head_sha==$source' .artifacts/br-beta-native/producer-identity.json
          df -B1 "$PWD" /tmp /home > .artifacts/br-beta-native/disk-before.txt
          df -i "$PWD" /tmp /home > .artifacts/br-beta-native/inodes-before.txt
          for volume in "$PWD" /tmp /home; do
            available=$(df -B1 --output=avail "$volume" | tail -1 | tr -d ' ')
            test "$available" -ge 4294967296
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const input=Object.fromEntries(['WORKFLOW_REF','EXPECTED_SOURCE','ARTIFACT_ID','ARTIFACT_NAME','ARTIFACT_DIGEST','ARTIFACT_RUN_ID','ARTIFACT_RUN_ATTEMPT','PACKAGE_FILE','PACKAGE_SHA256'].map(key=>[key,process.env[key]]));
          input.baseline='2026.11.5-beta.1';
          input.controls={
            nativeRed:{source:'c2e42733200da8eadaf78d13dbdb357383b08274',baseline:'2026.11.5-beta.1',result:'FAIL: actual published-beta candidate future-config startup',postfailureState:'UNPROVEN: full postfailure state oracle was not reached'},
            unitRed:{source:'20a3488d3af532df0d9a47d86ee6119bbf93718c',run:41778471511,job:126404706346,testBlob:'b16e45ec418cf3c56fb9b69999b2c95b25172572',unfixedGuardBlob:'430ef00e28b18a349d34ff2b913bb24191837bff',qualification:'retained compatible identical regression bytes against unchanged pre-fix guard'},
            currentNegativeCI:{source:'bcae09093b5a06099cd3a3f0f3d5f4e4b499ad7f',run:41784433080,job:126423705808,result:'PASS: eight startup guard cases and four data-risk preflight cases',startupTestBlob:'b16e45ec418cf3c56fb9b69999b2c95b25172572',fixedGuardBlob:'d0fe4e289ec38efa78a13a40f381e2346729a3cb',dataRiskTestBlob:'449d490a002f7a6650c563621304da47e695d217'},
            limitations:'Retained source-compatible witnesses only; no new protected native scenario and no paired native RED run',pairedNativeRed:'UNRUN: canonical15min envelope',
          };
          input.externalRegistry='not used; package archives and installed registry manifests/identities exported without dependency trees';
          fs.writeFileSync('.artifacts/br-beta-native/input.json',JSON.stringify(input,null,2)+'\n');
          NODE
      - name: Download exact final-source candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: .artifacts/br-beta-native/package-input
          merge-multiple: true
          digest-mismatch: error
      - name: Verify consumed package bytes and source
        timeout-minutes: 1
        env:
          PACKAGE_FILE: ${{ inputs.package_file_name }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
        run: |
          set -euo pipefail
          package="$PWD/.artifacts/br-beta-native/package-input/$PACKAGE_FILE"
          actual=$(sha256sum "$package" | cut -d ' ' -f1)
          test "$actual" = "$PACKAGE_SHA256"
          tar -xOf "$package" package/dist/build-info.json > .artifacts/br-beta-native/candidate-build.json
          tar -xOf "$package" package/package.json > .artifacts/br-beta-native/candidate-manifest.json
          jq -e --arg source "$EXPECTED_SOURCE" '.commit==$source and .version=="2026.10.10" and (.buildId|type)=="string"' .artifacts/br-beta-native/candidate-build.json
          jq -e '.name=="openclaw" and .version=="2026.10.10"' .artifacts/br-beta-native/candidate-manifest.json
      - name: Published beta update and original-state restore proof
        timeout-minutes: 15
        env:
          PACKAGE_FILE: ${{ inputs.package_file_name }}
        run: |
          set -euo pipefail
          sudo "$(command -v node)" scripts/e2e/lib/upgrade-survivor/br-beta-native.mjs \
            "$PWD/.artifacts/br-beta-native/package-input/$PACKAGE_FILE" \
            "$PWD/.artifacts/br-beta-native/native" 2026.11.5-beta.1
      - name: Settle owned service/processes and export timeout or failure state
        if: always()
        timeout-minutes: 1
        run: |
          sudo "$(command -v node)" --input-type=module - "$PWD/.artifacts/br-beta-native/native" <<'NODE'
          import {closeoutOwned} from './scripts/e2e/lib/upgrade-survivor/br-beta-native-evidence.mjs';
          if(!closeoutOwned(process.argv[2])) process.exitCode=1;
          NODE
      - name: Seal all proof bytes before runner teardown
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          root="$PWD/.artifacts/br-beta-native"
          if [ -d "$root" ]; then
            sudo "$(command -v node)" --input-type=module - "$root" <<'NODE'
          import {manifestTree} from './scripts/e2e/lib/upgrade-survivor/br-beta-native-evidence.mjs';
          manifestTree(process.argv[2]);
          NODE
            sudo tar -cf "$RUNNER_TEMP/br-beta-native-proof.tar" -C "$root" .
            sudo chmod 0644 "$RUNNER_TEMP/br-beta-native-proof.tar"
            sha256sum "$RUNNER_TEMP/br-beta-native-proof.tar" > "$RUNNER_TEMP/br-beta-native-proof.tar.sha256"
          fi
      - name: Export package, registries, captures, backup, restore and receipts
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: br-beta-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/br-beta-native-proof.tar
            ${{ runner.temp }}/br-beta-native-proof.tar.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
