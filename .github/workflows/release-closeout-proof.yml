name: Release closeout behavior proof

on:
  pull_request:
    paths:
      - .github/workflows/release-closeout-proof.yml
      - scripts/release-closeout-*-proof.mjs
      - scripts/plugin-clawhub-pack-isolated.mjs
      - scripts/plugin-clawhub-publish.sh
      - scripts/lib/plugin-npm-package-manifest.mjs
      - scripts/lib/plugin-npm-runtime-build.mjs
      - src/infra/update-candidate-*.ts
      - src/infra/update-global*.ts
      - scripts/preinstall-package-manager-warning.mjs
      - scripts/postinstall-bun-cli-launcher.mjs
      - scripts/lib/bun-cli-launcher.*
      - test/scripts/release-closeout-upgrade-proof.test.ts
  workflow_dispatch:

# Deliberately no publisher, environment, secrets, OIDC, or write permissions.
permissions:
  contents: read

concurrency:
  group: release-closeout-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  isolation:
    name: Real Docker packing boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-pnpm-store-cache
        with:
          cache-mode: off
      - name: Install tooling without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Materialize integrity-pinned pack CLI
        run: bash scripts/materialize-clawhub-cli.sh .github/release/clawhub-cli "$PWD/.clawhub-cli"
      - name: Pull exact production isolation image
        run: docker pull docker.io/library/node:24.22.1-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
      - name: Prove real packing, denied host effects, failure and cancellation cleanup
        run: |
          node scripts/release-closeout-isolation-proof.mjs --self-test
          node scripts/release-closeout-isolation-proof.mjs
      - name: Remove only this proof’s containers after runner cancellation
        if: always()
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {spawnSync} from "node:child_process";
          const root = ".artifacts/closeout-isolation-proof";
          if (fs.existsSync(root + "/containers.json")) {
            for (const name of JSON.parse(fs.readFileSync(root + "/containers.json", "utf8"))) {
              if (!/^clawhub-pack-[0-9]+-[0-9]+-[0-9]+$/.test(name)) throw new Error("Invalid proof container name");
              const result = spawnSync("bash", [root + "/workflow-cleanup.sh"], {env: {PATH:process.env.PATH, PACK_CONTAINER_NAME:name}, stdio:"inherit", timeout:30000});
              if (result.error || result.status !== 0) throw new Error("Proof container cleanup failed");
            }
          }
          NODE
      - name: Upload synthetic-only proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: closeout-isolation-proof-${{ github.run_id }}
          include-hidden-files: true
          path: .artifacts/closeout-isolation-proof/
          if-no-files-found: error
          retention-days: 14
  upgrade:
    name: Real latest-stable snapshot and Bun upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: "true"
          cache-mode: off
      - uses: ./.github/actions/setup-test-bun
      - name: Check proof guard negative controls
        run: node scripts/run-vitest.mjs run --config test/vitest/vitest.tooling.config.ts test/scripts/release-closeout-upgrade-proof.test.ts
      - name: Build exact closeout source
        run: pnpm build
      - name: Package exact closeout source (not the frozen release)
        id: candidate
        run: |
          OPENCLAW_RUN_NODE_SKIP_DTS_BUILD=0 node --import ./scripts/tsx.mjs scripts/write-unified-entry-dts.ts
          node scripts/package-openclaw-for-docker.mjs --skip-build --allow-unreleased-changelog --output-dir .artifacts/closeout-upgrade-candidate --output-name candidate.tgz
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum .artifacts/closeout-upgrade-candidate/candidate.tgz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Prove Node upgrade with synthetic settings
        id: node-proof
        env:
          PROOF_HEAD: ${{ steps.candidate.outputs.head }}
          PROOF_SHA256: ${{ steps.candidate.outputs.sha256 }}
        run: node scripts/release-closeout-upgrade-proof.mjs --lane node --candidate "$PWD/.artifacts/closeout-upgrade-candidate/candidate.tgz" --sha256 "$PROOF_SHA256" --head "$PROOF_HEAD" --out "$PWD/.artifacts/closeout-upgrade-proof/node"
      - name: Prove Bun-only upgrade in disposable container
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        id: bun-proof
        env:
          PROOF_HEAD: ${{ steps.candidate.outputs.head }}
          PROOF_SHA256: ${{ steps.candidate.outputs.sha256 }}
        run: |
          set -euo pipefail
          bun_bin=$(node --import ./scripts/tsx.mjs --input-type=module -e 'import {execFileSync} from "node:child_process";import {requirePinnedBun} from "./scripts/lib/pinned-bun.mts";process.stdout.write(execFileSync(requirePinnedBun(), ["-e", "console.log(require(\"node:fs\").realpathSync(process.execPath))"], {encoding:"utf8"}))')
          mkdir -p .artifacts/closeout-upgrade-proof/bun
          printf '#!/bin/sh\nexit 127\n' > .artifacts/closeout-upgrade-proof/node-unavailable
          chmod 755 .artifacts/closeout-upgrade-proof/node-unavailable
          docker pull docker.io/library/node:24.22.1-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
          docker run --rm --name "closeout-bun-${{ github.run_id }}-${{ github.run_attempt }}" --user "$(id -u):$(id -g)" --network bridge --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 --memory 6g \
            --mount "type=bind,src=$PWD,dst=$PWD,readonly" \
            --mount "type=bind,src=$PWD/.artifacts/closeout-upgrade-proof/bun,dst=$PWD/.artifacts/closeout-upgrade-proof/bun" \
            --mount "type=bind,src=$bun_bin,dst=/proof-bun,readonly" \
            --mount "type=bind,src=$PWD/.artifacts/closeout-upgrade-proof/node-unavailable,dst=/usr/local/bin/node,readonly" \
            --mount "type=bind,src=$PWD/.artifacts/closeout-upgrade-proof/node-unavailable,dst=/usr/bin/node,readonly" \
            --mount "type=bind,src=$PWD/.artifacts/closeout-upgrade-proof/node-unavailable,dst=/usr/bin/nodejs,readonly" \
            --workdir "$PWD" --entrypoint /bin/bash \
            docker.io/library/node:24.22.1-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a -euc '
              # Node is unavailable via readonly failure sentinels, never emulated.
              # Keep the bind-owner uid for real private-snapshot ownership checks.
              export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              exec /proof-bun scripts/release-closeout-upgrade-proof.mjs --lane bun --candidate "$PWD/.artifacts/closeout-upgrade-candidate/candidate.tgz" --sha256 "$1" --head "$2" --out "$PWD/.artifacts/closeout-upgrade-proof/bun"
            ' proof "$PROOF_SHA256" "$PROOF_HEAD"
      - name: Verify both real upgrade lanes
        if: ${{ !cancelled() && steps.node-proof.outcome == 'success' && steps.bun-proof.outcome == 'success' }}
        env:
          PROOF_HEAD: ${{ steps.candidate.outputs.head }}
          PROOF_SHA256: ${{ steps.candidate.outputs.sha256 }}
        run: node scripts/release-closeout-upgrade-proof.mjs --verify --node-proof .artifacts/closeout-upgrade-proof/node --bun-proof .artifacts/closeout-upgrade-proof/bun --head "$PROOF_HEAD" --sha256 "$PROOF_SHA256" > .artifacts/closeout-upgrade-proof/result.json
      - name: Remove only this proof’s Bun container
        if: always()
        run: |
          name="closeout-bun-${{ github.run_id }}-${{ github.run_attempt }}"
          if ! output=$(docker rm --force "$name" 2>&1); then
            [[ "$output" == *"No such container"* ]] || { printf '%s\n' "$output" >&2; exit 1; }
          fi
      - name: Upload synthetic-only proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: closeout-upgrade-proof-${{ github.run_id }}
          include-hidden-files: true
          path: |
            .artifacts/closeout-upgrade-proof/**/*.json
            .artifacts/closeout-upgrade-proof/**/*.jsonl
            .artifacts/closeout-upgrade-proof/**/*.log
            .artifacts/closeout-upgrade-proof/**/activated-launcher.sh
            !.artifacts/closeout-upgrade-proof/**/runtime/**
          if-no-files-found: error
          retention-days: 14
