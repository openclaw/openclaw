name: Linux App

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "apps/linux/**"
      - "scripts/lib/openclaw-bun.json"
      - "scripts/stage-openclaw-bun.sh"
      - "test/scripts/stage-openclaw-bun.test.ts"
      - ".github/workflows/linux-app.yml"
      - ".github/workflows/linux-app-release.yml"
      - "!apps/linux/README.md"
      - "!apps/linux/omarchy/README.md"
  workflow_dispatch:
    inputs:
      windows_only:
        description: "Run only Windows desktop validation and installer packaging"
        type: boolean
        default: false
      desktop_runtime:
        description: "Runtime for the Linux bundles; AOT requires a prebuilt standalone artifact"
        type: choice
        options: [jit, aot]
        default: jit
      aot_run_id:
        description: "Successful same-repository push or manual workflow run containing the AOT artifact"
        type: string
        default: ""
      aot_artifact_name:
        description: "Artifact with the Linux x64 standalone manifest, executable, and runtime at its root"
        type: string
        default: ""

concurrency:
  # Passive draft events must not cancel useful validation; conversion intentionally does.
  group: >-
    ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.action != 'converted_to_draft'
      && format('{0}-passive-draft-{1}', github.workflow, github.run_id)
      || format('linux-app-{0}-{1}', github.workflow, github.event.pull_request.number || github.sha) }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || !inputs.windows_only) }}
    name: Build Linux companion
    # Match the release build base for native tests and manually built bundles.
    runs-on: ubuntu-22.04
    # Leave room for cold source packaging and the native desktop proof afterward.
    timeout-minutes: 105
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            at-spi2-core \
            build-essential \
            curl \
            dbus-x11 \
            ffmpeg \
            file \
            gir1.2-atspi-2.0 \
            gnome-keyring \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good \
            gstreamer1.0-tools \
            imagemagick \
            libatk-adaptor \
            libayatana-appindicator3-dev \
            libegl1 \
            libgles2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            mesa-utils \
            openbox \
            patchelf \
            unzip \
            pciutils \
            procps \
            psmisc \
            python3-gi \
            wget \
            wmctrl \
            x11-utils \
            xauth \
            xdg-utils \
            xdotool \
            xvfb

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/linux/src-tauri/target
          key: linux-app-v2-${{ runner.os }}-${{ hashFiles('apps/linux/src-tauri/Cargo.lock') }}
          restore-keys: |
            linux-app-v2-${{ runner.os }}-

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "false"

      - name: Test native dashboard authentication and runtime boundaries
        run: |
          node --test \
            apps/linux/scripts/test-native-control-auth.mjs \
            apps/linux/scripts/test-runtime-boundary.mjs \
            apps/linux/scripts/test-stage-runtime.mjs \
            apps/linux/scripts/test-stage-package.mjs

      - name: Test packaged runtime ABI scanner
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s apps/linux/tests -p 'test_packaged_runtime_smoke.py'

      - name: Test desktop sharing proof report ordering
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s apps/linux/tests -p 'test_desktop_sharing_reports.py'

      - name: Test native first-run accessibility role matching
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s apps/linux/tests -p 'test_first_run.py'

      - name: Check Rust formatting
        working-directory: apps/linux/src-tauri
        run: cargo +stable fmt --check

      - name: Test Omarchy desktop handoff
        run: |
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -m unittest discover \
            -s apps/linux/omarchy -p 'test_*.py'

      - name: Run Rust tests
        working-directory: apps/linux/src-tauri
        run: cargo +stable test --locked --all-targets

      - name: Build native inline browser candidate
        working-directory: apps/linux/src-tauri
        run: |
          node ../scripts/stage-runtime.mjs --runtime-only
          # The native fixture supplies its CLI at the same build-time boundary.
          python3 ../tests/stage_onboarding_runtime.py target/desktop-runtime
          cargo +stable build --locked

      - name: Test native inline browser
        id: inline-browser
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/linux-inline-browser"
          xvfb-run -a -s '-screen 0 1280x1024x24' dbus-run-session -- \
            /usr/bin/python3 apps/linux/tests/first_run.py \
            apps/linux/src-tauri/target/debug/openclaw-desktop --inline-browser \
            --artifacts-dir "${RUNNER_TEMP}/linux-inline-browser" \
            2>&1 | tee "${RUNNER_TEMP}/linux-inline-browser/run.log"

      - name: Upload native inline browser proof
        if: always() && steps.inline-browser.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-inline-browser
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/linux-inline-browser

      - name: Test native Gateway switching
        id: gateway-switch
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/linux-gateway-switch"
          xvfb-run -a -s '-screen 0 1440x1080x24' dbus-run-session -- \
            /usr/bin/python3 apps/linux/tests/first_run.py \
            apps/linux/src-tauri/target/debug/openclaw-desktop --gateway-switch \
            --artifacts-dir "${RUNNER_TEMP}/linux-gateway-switch" \
            2>&1 | tee "${RUNNER_TEMP}/linux-gateway-switch/run.log"
          mkdir -p "${RUNNER_TEMP}/linux-gateway-switch/onboarding"
          node scripts/run-node-package-bin.mts vite build --config apps/linux/tests/fixtures/vite.onboarding.config.ts
          xvfb-run -a -s '-screen 0 1440x1080x24' dbus-run-session -- \
            /usr/bin/python3 apps/linux/tests/first_run.py \
            apps/linux/src-tauri/target/debug/openclaw-desktop --gateway-onboarding \
            --artifacts-dir "${RUNNER_TEMP}/linux-gateway-switch/onboarding" \
            2>&1 | tee "${RUNNER_TEMP}/linux-gateway-switch/onboarding/run.log"
          # Startup failure requires the same fixture CLI compiled into this candidate.
          mkdir -p "${RUNNER_TEMP}/linux-gateway-switch/startup-failure"
          xvfb-run -a -s '-screen 0 1280x1024x24' dbus-run-session -- \
            /usr/bin/python3 apps/linux/tests/first_run.py \
            apps/linux/src-tauri/target/debug/openclaw-desktop --local-start-failure \
            --artifacts-dir "${RUNNER_TEMP}/linux-gateway-switch/startup-failure" \
            2>&1 | tee "${RUNNER_TEMP}/linux-gateway-switch/startup-failure/run.log"

      - name: Upload native Gateway switching proof
        if: always() && steps.gateway-switch.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-gateway-switch
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/linux-gateway-switch

      - name: Test native desktop sharing
        id: desktop-sharing
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/linux-desktop-sharing"
          xvfb-run -a -s '-screen 0 1440x1080x24' dbus-run-session -- \
            /usr/bin/python3 apps/linux/tests/first_run.py \
            apps/linux/src-tauri/target/debug/openclaw-desktop --desktop-sharing \
            --artifacts-dir "${RUNNER_TEMP}/linux-desktop-sharing" \
            2>&1 | tee "${RUNNER_TEMP}/linux-desktop-sharing/run.log"

      - name: Upload native desktop sharing proof
        if: always() && steps.desktop-sharing.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-desktop-sharing
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/linux-desktop-sharing

      - name: Test native Quick Chat
        id: quick-chat
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/linux-quick-chat"
          xvfb-run -a -s '-screen 0 1440x1080x24' dbus-run-session -- \
            /usr/bin/python3 apps/linux/tests/first_run.py \
            apps/linux/src-tauri/target/debug/openclaw-desktop --quick-chat \
            --artifacts-dir "${RUNNER_TEMP}/linux-quick-chat" \
            2>&1 | tee "${RUNNER_TEMP}/linux-quick-chat/run.log"

      - name: Upload native Quick Chat proof
        if: always() && steps.quick-chat.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-quick-chat
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/linux-quick-chat

      - name: Stage AppImage GStreamer plugins
        if: github.event_name == 'workflow_dispatch'
        run: |
          plugins="${RUNNER_TEMP}/openclaw-gstreamer-plugins"
          apps/linux/scripts/stage-appimage-gstreamer.sh "$plugins" \
            | tee "${RUNNER_TEMP}/openclaw-gstreamer-elements.tsv"
          echo "GSTREAMER_PLUGINS_DIR=$plugins" >> "$GITHUB_ENV"

      - name: Validate prebuilt AOT artifact source
        if: github.event_name == 'workflow_dispatch' && inputs.desktop_runtime == 'aot'
        env:
          GH_TOKEN: ${{ github.token }}
          AOT_RUN_ID: ${{ inputs.aot_run_id }}
          AOT_ARTIFACT_NAME: ${{ inputs.aot_artifact_name }}
        run: |
          set -euo pipefail
          [[ "$AOT_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::aot_run_id must be a workflow run ID"
            exit 1
          }
          [[ "$AOT_ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || {
            echo "::error::aot_artifact_name must be a plain artifact name"
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AOT_RUN_ID" |
            jq -e --arg repository "$GITHUB_REPOSITORY" '
              .status == "completed" and .conclusion == "success" and
              .head_repository.full_name == $repository and
              (.event == "push" or .event == "workflow_dispatch")
            ' > /dev/null || {
              echo "::error::AOT artifacts must come from a successful push or manual workflow in this repository"
              exit 1
            }

      - name: Download prebuilt AOT runtime
        if: github.event_name == 'workflow_dispatch' && inputs.desktop_runtime == 'aot'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.aot_run_id }}
          name: ${{ inputs.aot_artifact_name }}
          path: ${{ runner.temp }}/desktop-aot

      - name: Prepare pinned AppImage tools
        if: github.event_name == 'workflow_dispatch'
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/openclaw-tauri-cache
        run: | # zizmor: ignore[github-env] trusted checked-in helper returns the native runtime path
          set -euo pipefail
          apps/linux/scripts/tauri-appimage-tools.sh prepare
          apps/linux/scripts/tauri-appimage-tools.sh verify pre-build
          runtime_file=$(apps/linux/scripts/tauri-appimage-tools.sh runtime-path)
          printf 'LDAI_RUNTIME_FILE=%s\n' "$runtime_file" >> "$GITHUB_ENV"

      - name: Build Linux companion bundles
        if: github.event_name == 'workflow_dispatch'
        working-directory: apps/linux/src-tauri
        env:
          # appimagetool strips fail on CI runners; Tauri documents NO_STRIP for Actions.
          NO_STRIP: "true"
          XDG_CACHE_HOME: ${{ runner.temp }}/openclaw-tauri-cache
          OPENCLAW_DESKTOP_RUNTIME: ${{ inputs.desktop_runtime || 'jit' }}
          OPENCLAW_DESKTOP_AOT_ARTIFACT: ${{ runner.temp }}/desktop-aot
        # Validation builds have no TAURI_SIGNING_PRIVATE_KEY, and the configured updater
        # pubkey makes the bundler hard-require it. Skip updater artifacts here;
        # linux-app-release.yml builds the signed updater bundles.
        run: pnpm dlx @tauri-apps/cli@2.11.4 build --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":false,"useLocalToolsDir":false}}'

      - name: Finalize AppImage
        if: github.event_name == 'workflow_dispatch'
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/openclaw-tauri-cache
        run: apps/linux/scripts/finalize-appimage.sh apps/linux/src-tauri/target/release/bundle/appimage

      - name: Test packaged first-run setup choices
        id: first-run
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' dbus-run-session -- \
            /usr/bin/python3 apps/linux/tests/first_run.py \
            apps/linux/src-tauri/target/release/openclaw-desktop \
            2>&1 | tee "${RUNNER_TEMP}/linux-first-run.log"

      - name: Upload first-run failure log
        if: github.event_name == 'workflow_dispatch' && failure() && steps.first-run.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-first-run-failure
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/linux-first-run.log

      - name: Test packaged AppImage runtime
        id: packaged-runtime
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          shopt -s nullglob
          appimages=(apps/linux/src-tauri/target/release/bundle/appimage/*.AppImage)
          if [[ ${#appimages[@]} -ne 1 ]]; then
            echo "Expected one AppImage, found ${#appimages[@]}"
            exit 1
          fi
          xvfb-run -a -s '-screen 0 1280x1024x24' dbus-run-session -- \
            /usr/bin/python3 apps/linux/tests/packaged_runtime_smoke.py \
            "${appimages[0]}" \
            --output "${RUNNER_TEMP}/linux-packaged-runtime" \
            --require-fuse \
            --shell-container \
              "archlinux@sha256:4e77cf2ea5f410e6f8be5abf93ccf17ce2436e87a138c167208356711a405dbd"

      - name: Upload packaged runtime failure evidence
        if: github.event_name == 'workflow_dispatch' && failure() && steps.packaged-runtime.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packaged-runtime-failure
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/linux-packaged-runtime

      - name: Upload bundles
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openclaw-linux-companion
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/linux/src-tauri/target/release/bundle/deb/*.deb
            apps/linux/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Remove uploaded Linux bundles before caching
        working-directory: apps/linux/src-tauri
        # Bundles are outputs; keep staged manifests and resources that Cargo watches.
        run: >-
          node -e "require('node:fs').rmSync('target/release/bundle', { recursive: true, force: true });"

  test-macos:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || !inputs.windows_only) }}
    name: Test macOS companion
    # This app also ships macOS desktop-test bundles, but the only job that
    # compiles them (linux-app-release.yml build_macos) runs behind a manual
    # dispatch input. Without a per-PR check, a macOS-gated Tauri API can break
    # the macOS target for weeks unnoticed - `WebviewWindowBuilder::transparent`
    # did exactly that.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Setup Node.js
        shell: /bin/bash -e {0}
        run: |
          set -euo pipefail
          # Rust tests run inline Node scripts without workspace packages.
          source .github/actions/setup-pnpm-store-cache/ensure-node.sh
          openclaw_ensure_node "24.22.1"

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/linux/src-tauri/target
          key: macos-app-${{ runner.os }}-${{ hashFiles('apps/linux/src-tauri/Cargo.lock') }}
          restore-keys: |
            macos-app-${{ runner.os }}-

      - name: Test macOS companion
        working-directory: apps/linux/src-tauri
        # `test` rather than `check`: it additionally links and runs the
        # binaries, which is the only way macOS link-time breakage (a missing
        # Swift runtime rpath, say) shows up at all. `--all-targets` keeps the
        # compile coverage `check --all-targets` used to give.
        run: cargo +stable test --locked --all-targets

  test-windows-power:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Test Windows desktop
    # Match the regular Windows installer build runner.
    runs-on: windows-2022
    timeout-minutes: 105
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          install-bun: "false"

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/linux/src-tauri/target
            ${{ runner.temp }}/openclaw-desktop-npm-cache/_cacache
          key: windows-app-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/linux/src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}-payload-v3
          restore-keys: |
            windows-app-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify native Windows power lifecycle
        working-directory: apps/linux/src-tauri
        shell: pwsh
        # This fixture needs only std and kernel32; Cargo also builds an unused app binary.
        run: |
          $nativePowerTest = Join-Path $env:RUNNER_TEMP "native-keep-awake.exe"
          rustc +stable --edition=2021 --test tests/native_keep_awake.rs -o $nativePowerTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $nativePowerTest native_power_lifecycle --nocapture

      - name: Verify Windows runtime, installer, and desktop boundaries
        working-directory: apps/linux/src-tauri
        run: |
          node --test ../scripts/test-stage-runtime.mjs ../scripts/test-stage-package.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable test --locked --bin openclaw-desktop

      - name: Build Windows installer without publishing
        working-directory: apps/linux/src-tauri
        env:
          npm_config_cache: ${{ runner.temp }}/openclaw-desktop-npm-cache
          # Cold Windows declarations can exceed the package builder's 45-minute default.
          OPENCLAW_DOCKER_PACKAGE_BUILD_TIMEOUT_MS: "3600000"
        # Favor packaging speed for validation; release installers keep the default compression.
        run: pnpm dlx @tauri-apps/cli@2.11.4 build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false,"windows":{"nsis":{"compression":"zlib"}}}}'

      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openclaw-windows-desktop
          retention-days: 14
          if-no-files-found: error
          path: apps/linux/src-tauri/target/release/bundle/nsis/*.exe

      - name: Remove regenerated installer payloads before caching
        working-directory: apps/linux/src-tauri
        # Staging and NSIS regenerate these; Cargo may reuse its copied profile resources.
        run: >-
          node -e "const fs = require('node:fs'); for (const path of ['target/desktop-runtime', 'target/release/nsis', 'target/release/bundle/nsis']) fs.rmSync(path, { recursive: true, force: true });"
