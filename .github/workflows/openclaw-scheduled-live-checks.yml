name: OpenClaw Scheduled Live And E2E Checks

on:
  schedule:
    - cron: "23 4 * * *"
    - cron: "41 6 * * 1"
  workflow_dispatch:
    inputs:
      every_file_only:
        description: Run only the every-file lane (no credentialed live checks)
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: openclaw-scheduled-live-checks-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  every_file_plan:
    if: github.repository == 'openclaw/openclaw' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '23 4 * * *')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_files: ${{ steps.plan.outputs.has_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: "off"
      - name: Plan scheduled every-file tests
        id: plan
        run: node --import tsx scripts/ci-scheduled-test-plan.mts

  every_file_tests:
    name: ${{ matrix.check_name }}
    needs: [every_file_plan]
    if: github.repository == 'openclaw/openclaw' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '23 4 * * *') && needs.every_file_plan.outputs.has_files == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.every_file_plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: "off"
          semantic-checks: "true"
      - name: Build Node test runtime
        id: node-test-runtime
        if: matrix.pretest_build_mode != null
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_BUILD_PRIVATE_QA: ${{ matrix.pretest_build_mode == 'private-qa' && '1' || '0' }}
          VITEST: "1"
        run: pnpm build qaRuntime
      - name: Run scheduled every-file tests
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_E2E_USE_PREBUILT_DIST: ${{ steps.node-test-runtime.outcome == 'success' && matrix.pretest_build_mode == 'private-qa' && '1' || '' }}
          OPENCLAW_CI_TEST_RUNTIME: node
          OPENCLAW_CI_TEST_RUNTIME_POLICY: node
          FROZEN_TARGET: "false"
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          OPENCLAW_NODE_TEST_GROUPS_GZIP_BASE64: ${{ matrix.groups_gzip_base64 || '' }}
          OPENCLAW_NODE_TEST_GROUPS_JSON: ${{ matrix.groups && toJson(matrix.groups) || '' }}
          OPENCLAW_NODE_TEST_CONFIGS_JSON: ${{ toJson(matrix.configs) }}
          OPENCLAW_NODE_TEST_ENV_JSON: ${{ toJson(matrix.env) }}
          OPENCLAW_NODE_TEST_INCLUDE_PATTERNS_JSON: ${{ toJson(matrix.includePatterns) }}
          OPENCLAW_NODE_TEST_TARGETS_JSON: ${{ toJson(matrix.targets) }}
          OPENCLAW_NODE_TEST_TARGET_VOLUMES_GZIP_BASE64: ${{ matrix.target_volumes_gzip_base64 || '' }}
          OPENCLAW_NODE_TEST_VITEST_ARGS_JSON: "[]"
          OPENCLAW_VITEST_SHARD_NAME: ${{ matrix.shard_name }}
          OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: "300000"
          OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: ${{ matrix.plan_concurrency }}
          OPENCLAW_NODE_TEST_PLAN_CONTINUE_ON_FAILURE: "1"
        run: node --import tsx scripts/ci-run-node-test-shard.mts

  live_and_openwebui_checks:
    if: github.repository == 'openclaw/openclaw' && ((github.event_name == 'workflow_dispatch' && !inputs.every_file_only) || github.event.schedule == '23 4 * * *')
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    uses: ./.github/workflows/openclaw-live-and-e2e-checks-reusable.yml
    with:
      ref: ${{ github.sha }}
      include_repo_e2e: true
      include_release_path_suites: true
      include_openwebui: true
      include_live_suites: true
      allow_unreleased_changelog: true
      enable_prepublish_plugin_registry: true
      shared_image_artifact_namespace: scheduled-live
      shared_image_policy: no-push-artifact
    secrets:
      ABLITERATION_API_KEY: ${{ secrets.ABLITERATION_API_KEY }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
      OPENCLAW_LIVE_R2_ACCOUNT_ID: ${{ secrets.OPENCLAW_LIVE_R2_ACCOUNT_ID }}
      OPENCLAW_LIVE_R2_BUCKET: ${{ secrets.OPENCLAW_LIVE_R2_BUCKET }}
      OPENCLAW_LIVE_R2_ACCESS_KEY_ID: ${{ secrets.OPENCLAW_LIVE_R2_ACCESS_KEY_ID }}
      OPENCLAW_LIVE_R2_SECRET_ACCESS_KEY: ${{ secrets.OPENCLAW_LIVE_R2_SECRET_ACCESS_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
      OPENCLAW_LIVE_GITHUB_COPILOT_TOKEN: ${{ secrets.OPENCLAW_LIVE_GITHUB_COPILOT_TOKEN }}
      OPENCLAW_GOOGLE_MEET_LIVE_MEETING: ${{ secrets.OPENCLAW_GOOGLE_MEET_LIVE_MEETING }}
      OPENCLAW_GOOGLE_MEET_CLIENT_ID: ${{ secrets.OPENCLAW_GOOGLE_MEET_CLIENT_ID }}
      OPENCLAW_GOOGLE_MEET_CLIENT_SECRET: ${{ secrets.OPENCLAW_GOOGLE_MEET_CLIENT_SECRET }}
      OPENCLAW_GOOGLE_MEET_REFRESH_TOKEN: ${{ secrets.OPENCLAW_GOOGLE_MEET_REFRESH_TOKEN }}
      GRADIUM_API_KEY: ${{ secrets.GRADIUM_API_KEY }}
      INWORLD_API_KEY: ${{ secrets.INWORLD_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      VOLCENGINE_TTS_API_KEY: ${{ secrets.VOLCENGINE_TTS_API_KEY }}
      OPENCLAW_DISCORD_SMOKE_BOT_TOKEN: ${{ secrets.OPENCLAW_DISCORD_SMOKE_BOT_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_API_KEY_OLD: ${{ secrets.ANTHROPIC_API_KEY_OLD }}
      ANTHROPIC_API_TOKEN: ${{ secrets.ANTHROPIC_API_TOKEN }}
      FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
      BYTEPLUS_API_KEY: ${{ secrets.BYTEPLUS_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      MODELSTUDIO_API_KEY: ${{ secrets.MODELSTUDIO_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      NOVITA_API_KEY: ${{ secrets.NOVITA_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
      OPENCLAW_LIVE_BROWSER_CDP_URL: ${{ secrets.OPENCLAW_LIVE_BROWSER_CDP_URL }}
      OPENCLAW_LIVE_SETUP_TOKEN: ${{ secrets.OPENCLAW_LIVE_SETUP_TOKEN }}
      OPENCLAW_LIVE_SETUP_TOKEN_MODEL: ${{ secrets.OPENCLAW_LIVE_SETUP_TOKEN_MODEL }}
      OPENCLAW_LIVE_SETUP_TOKEN_PROFILE: ${{ secrets.OPENCLAW_LIVE_SETUP_TOKEN_PROFILE }}
      OPENCLAW_LIVE_SETUP_TOKEN_VALUE: ${{ secrets.OPENCLAW_LIVE_SETUP_TOKEN_VALUE }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PIXVERSE_API_KEY: ${{ secrets.PIXVERSE_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      VYDRA_API_KEY: ${{ secrets.VYDRA_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      ZAI_CODING_API_KEY: ${{ secrets.ZAI_CODING_API_KEY }}
      Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
      BYTEPLUS_ACCESS_KEY_ID: ${{ secrets.BYTEPLUS_ACCESS_KEY_ID }}
      BYTEPLUS_SECRET_ACCESS_KEY: ${{ secrets.BYTEPLUS_SECRET_ACCESS_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENCLAW_CODEX_AUTH_JSON: ${{ secrets.OPENCLAW_CODEX_AUTH_JSON }}
      OPENCLAW_CODEX_CONFIG_TOML: ${{ secrets.OPENCLAW_CODEX_CONFIG_TOML }}
      OPENCLAW_CLAUDE_JSON: ${{ secrets.OPENCLAW_CLAUDE_JSON }}
      OPENCLAW_CLAUDE_CREDENTIALS_JSON: ${{ secrets.OPENCLAW_CLAUDE_CREDENTIALS_JSON }}
      OPENCLAW_CLAUDE_SETTINGS_JSON: ${{ secrets.OPENCLAW_CLAUDE_SETTINGS_JSON }}
      OPENCLAW_CLAUDE_SETTINGS_LOCAL_JSON: ${{ secrets.OPENCLAW_CLAUDE_SETTINGS_LOCAL_JSON }}
      OPENCLAW_GEMINI_SETTINGS_JSON: ${{ secrets.OPENCLAW_GEMINI_SETTINGS_JSON }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}

  weekly_upgrade_survivors:
    if: github.repository == 'openclaw/openclaw' && github.event_name == 'schedule' && github.event.schedule == '41 6 * * 1'
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    uses: ./.github/workflows/openclaw-live-and-e2e-checks-reusable.yml
    with:
      ref: ${{ github.sha }}
      include_repo_e2e: false
      include_release_path_suites: false
      include_openwebui: false
      include_live_suites: false
      allow_unreleased_changelog: true
      docker_lanes: update-migration
      published_upgrade_survivor_baselines: 2026.7.1 2026.8.1
      published_upgrade_survivor_scenarios: base mobile-pairing-reconnect watchos-direct-node
      shared_image_artifact_namespace: scheduled-upgrade-survivors
      shared_image_policy: no-push-artifact
