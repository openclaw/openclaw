name: iOS Store Release

run-name: iOS ${{ github.event_name == 'schedule' && github.event.schedule == '0 11 * * 1' && 'Store release (weekly)' || (((github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') || inputs.operation == 'testflight') && 'TestFlight distribution' || format('Store {0}', inputs.operation)) }}

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: America/Los_Angeles
    - cron: "0 11 * * 1"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      operation:
        description: Stage an App Store release, distribute TestFlight, or capture screenshots
        required: true
        default: release
        type: choice
        options:
          - release
          - testflight
          - screenshots
      resource_diagnostics:
        description: Collect the temporary resource timeline (screenshots operation only)
        type: boolean
        default: true
      startup_probe:
        description: Observe idle host and iPhone simulator before screenshots (temporary, no upload)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ios-release
  cancel-in-progress: false
  queue: max

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  screenshots:
    name: Capture release screenshots without uploading
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'screenshots' && github.repository == 'openclaw/openclaw'
    permissions:
      contents: read
    runs-on: xcode-27-xlarge
    timeout-minutes: 90
    steps:
      - name: Checkout screenshot source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify screenshot source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          install-bun: "false"
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0.7"
          bundler: "4.0.22"
          bundler-cache: false
          working-directory: apps/ios

      - name: Install locked Fastlane bundle
        working-directory: apps/ios
        run: |
          set -euo pipefail
          bundle _4.0.22_ install --jobs 4 --retry 3
          bundle _4.0.22_ check
          test "$(bundle _4.0.22_ exec ruby -e 'require "fastlane"; print Fastlane::VERSION')" = "2.241.0"

      - name: Select Xcode and install pinned native tools
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain
          swift_tools_dir="$RUNNER_TEMP/ios-screenshot-tools"
          ./scripts/install-xcodegen.sh "$swift_tools_dir"
          ./scripts/install-swift-tools.sh "$swift_tools_dir"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          watch_toolchain="$(awk -F '\"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$watch_toolchain"
          rustup toolchain install "$watch_toolchain" --profile minimal --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Capture iPhone, iPad, and Watch screenshots
        env:
          OPENCLAW_SNAPSHOT_DIAGNOSTICS: "1"
          OPENCLAW_IOS_RESOURCE_DIAGNOSTICS: ${{ (inputs.resource_diagnostics || inputs.startup_probe) && '1' || '0' }}
          OPENCLAW_SNAPSHOT_STARTUP_PROBE: ${{ inputs.startup_probe && '1' || '0' }}
          OPENCLAW_SNAPSHOT_DEVICE_FAMILY: ${{ inputs.startup_probe && 'iphone' || '' }}
          OPENCLAW_SNAPSHOT_SKIP_WATCH: ${{ inputs.startup_probe && '1' || '0' }}
        run: |
          node scripts/ios-resource-timeline.mjs --output "$RUNNER_TEMP/ios-resource-timeline.jsonl" -- \
            pnpm ios:screenshots

      - name: Compare Spotlight eligibility of build products
        if: inputs.startup_probe
        run: |
          node scripts/ios-spotlight-probe.mjs \
            --source apps/ios/build/SnapshotDerivedData \
            --output "$RUNNER_TEMP/ios-spotlight-probe.json"

      - name: Retain screenshots and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/ios/fastlane/screenshots/en-US/*.png
            apps/ios/build/SnapshotTestResults/capture-attempts.json
            apps/ios/build/screenshot-diagnostics.json
            ${{ runner.temp }}/ios-resource-timeline.jsonl
            ${{ runner.temp }}/ios-spotlight-probe.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  qualify:
    if: >-
      github.ref == 'refs/heads/main' && github.repository == 'openclaw/openclaw' &&
      ((github.event_name == 'schedule' && github.event.schedule == '0 11 * * 1') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'release'))
    permissions:
      actions: read
      contents: read
    # Keep native qualification products and disposable Gateway state separate
    # from the clean checkout that admits the release.
    uses: ./.github/workflows/ios-release-e2e.yml
    with:
      target_sha: ${{ github.sha }}
      mode: stock

  release:
    name: Prepare and upload iOS release
    needs: qualify
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' && github.repository == 'openclaw/openclaw' &&
      ((github.event_name == 'schedule' && github.event.schedule == '0 7 * * *' && vars.IOS_TESTFLIGHT_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'testflight') ||
      (needs.qualify.result == 'success' &&
      ((github.event_name == 'schedule' && github.event.schedule == '0 11 * * 1') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'release'))))
    permissions:
      contents: write
    runs-on: xcode-27-xlarge
    timeout-minutes: 360
    environment: ${{ ((github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') || inputs.operation == 'testflight') && 'ios-testflight' || 'ios-store-release' }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          install-bun: "false"
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0.7"
          bundler: "4.0.22"
          bundler-cache: false
          working-directory: apps/ios

      - name: Install locked Fastlane bundle
        working-directory: apps/ios
        run: |
          set -euo pipefail
          bundle _4.0.22_ install --jobs 4 --retry 3
          bundle _4.0.22_ check
          test "$(bundle _4.0.22_ exec ruby -e 'require "fastlane"; print Fastlane::VERSION')" = "2.241.0"

      - name: Select Xcode
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain

      - name: Install pinned Swift build tools
        run: |
          set -euo pipefail
          swift_tools_dir="${RUNNER_TEMP}/openclaw-swift-tools"
          ./scripts/install-xcodegen.sh "$swift_tools_dir"
          ./scripts/install-swift-tools.sh "$swift_tools_dir"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"

      - name: Install Watch Rust toolchain
        if: hashFiles('apps/shared/OpenClawWatchRTC/Cargo.toml') != ''
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          watch_toolchain="$(awk -F '"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$watch_toolchain"
          rustup toolchain install "$watch_toolchain" --profile minimal --component rust-src

      - name: Create apps-signing read token
        id: apps-signing-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: "2729701"
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: openclaw
          repositories: apps-signing
          permission-contents: read

      - name: Checkout encrypted iOS signing assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/apps-signing
          ref: main
          path: apps/ios/build/release-signing/apps-signing
          token: ${{ steps.apps-signing-token.outputs.token }}
          persist-credentials: false

      - name: Route readonly match checkout to approved signing assets
        run: |
          set -euo pipefail
          signing_repo="file://${GITHUB_WORKSPACE}/apps/ios/build/release-signing/apps-signing/"
          git config --global url."${signing_repo}".insteadOf git@github.com:openclaw/apps-signing.git

      - name: Create job-owned iOS signing keychain
        uses: ./.github/actions/ios-signing-keychain

      - name: Validate readonly iOS signing key access
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          set -euo pipefail
          source ./scripts/lib/ios-fastlane.sh
          (cd apps/ios && run_ios_fastlane ios signing_check)
          node .github/actions/ios-signing-keychain/keychain.mjs probe

      - name: Prepare and upload iOS release
        id: release
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          IOS_RELEASE_DESTINATION: ${{ ((github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') || inputs.operation == 'testflight') && 'testflight' || 'app-store' }}
          OPENCLAW_TESTFLIGHT_GROUP_ID: ${{ vars.OPENCLAW_TESTFLIGHT_GROUP_ID }}
          SCAN_APP_NAME: OpenClaw
          SCAN_DEPLOYMENT_TARGET_VERSION: "18.0"
          OPENCLAW_SNAPSHOT_DIAGNOSTICS: "1"
        run: |
          set -euo pipefail
          gh auth setup-git
          node scripts/ios-resource-timeline.mjs --output "$RUNNER_TEMP/ios-resource-timeline.jsonl" -- \
            pnpm ios:release:upload -- \
            --destination "$IOS_RELEASE_DESTINATION" \
            --recovery-dir "$RUNNER_TEMP/ios-release-recovery"

      - name: Retain release plan and notes
        if: always() && steps.release.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-release-recovery/ios-plan.json
            ${{ runner.temp }}/ios-release-recovery/release-notes.json
            ${{ runner.temp }}/ios-release-recovery/testflight-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Retain signed release artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-release-recovery/artifacts/*.ipa
            ${{ runner.temp }}/ios-release-recovery/artifacts/*.sha256
            ${{ runner.temp }}/ios-release-recovery/source/apps/ios/build/app-store/*.ipa
            ${{ runner.temp }}/ios-release-recovery/source/apps/ios/build/app-store/*.sha256
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Retain sanitized screenshot diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-screenshot-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-release-recovery/screenshot-diagnostics/screenshots/*.png
            ${{ runner.temp }}/ios-release-recovery/screenshot-diagnostics/capture-attempts.json
            ${{ runner.temp }}/ios-release-recovery/screenshot-diagnostics/screenshot-diagnostics.json
            ${{ runner.temp }}/ios-release-recovery/source/apps/ios/fastlane/screenshots/en-US/*.png
            ${{ runner.temp }}/ios-release-recovery/source/apps/ios/build/SnapshotTestResults/capture-attempts.json
            ${{ runner.temp }}/ios-release-recovery/source/apps/ios/build/screenshot-diagnostics.json
            ${{ runner.temp }}/ios-resource-timeline.jsonl
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30
