name: iOS Store Release

run-name: Unsigned archive cache probe (${{ inputs.probe_mode }})

# Temporary diagnostic branch only. This workflow has no signing, release,
# qualification, export, or upload steps. Never merge this replacement.
on:
  workflow_dispatch:
    inputs:
      probe_mode:
        description: Produce a cold cache or consume it on a fresh runner
        type: choice
        default: producer
        options:
          - producer
          - consumer
      producer_run_id:
        description: Exact producer run ID (required for consumer)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-archive-cache-probe
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PROBE_MODE: ${{ inputs.probe_mode }}

jobs:
  archive-cache-probe:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'openclaw/openclaw'
    runs-on: xcode-27-xlarge
    timeout-minutes: 60
    steps:
      - name: Reserve host CPU for archive probe
        run: sudo -n /usr/bin/mdutil -i off /System/Volumes/Data

      - name: Checkout pinned probe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          install-bun: "false"
          install-deps: "false"
          node-version: "24.22.1"

      - name: Install mobile release dependencies
        run: node scripts/install-mobile-release-dependencies.mjs

      - name: Select Xcode and install pinned native tools
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain
          swift_tools_dir="$RUNNER_TEMP/ios-probe-tools"
          ./scripts/install-xcodegen.sh "$swift_tools_dir"
          ./scripts/install-swift-tools.sh "$swift_tools_dir"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          watch_toolchain="$(awk -F '\"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          rustup toolchain install "$watch_toolchain" --profile minimal --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Identify probe cache
        id: cache-inputs
        env:
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
        run: |
          set -euo pipefail
          producer="$GITHUB_RUN_ID"
          if [[ "$PROBE_MODE" == consumer ]]; then
            [[ "$PRODUCER_RUN_ID" =~ ^[0-9]+$ ]] || exit 2
            producer="$PRODUCER_RUN_ID"
          fi
          xcode="$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)"
          echo "xcode=$xcode" >> "$GITHUB_OUTPUT"
          echo "key=ios-archive-cas-probe-v1-$GITHUB_SHA-$xcode-$producer" >> "$GITHUB_OUTPUT"
          echo "OPENCLAW_WATCH_RTC_CACHE_DIR=$RUNNER_TEMP/openclaw-watch-rtc-release-libraries" >> "$GITHUB_ENV"

      - name: Restore verified Watch RTC release libraries
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openclaw-watch-rtc-release-libraries
          key: watch-rtc-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.xcode }}-${{ hashFiles('apps/shared/OpenClawWatchRTC/Cargo.lock', 'apps/shared/OpenClawWatchRTC/Cargo.toml', 'apps/shared/OpenClawWatchRTC/rust-toolchain.toml', 'apps/shared/OpenClawWatchRTC/build.sh', 'apps/shared/OpenClawWatchRTC/src/**', 'apps/ios/project.yml') }}
          restore-keys: |
            watch-rtc-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.xcode }}-

      - name: Restore Swift package downloads
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/ios/build/SourcePackages
          key: ios-source-packages-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.xcode }}-${{ hashFiles('apps/ios/**/Package.resolved', 'apps/ios/project.yml', 'apps/shared/**/Package*.swift', 'apps/shared/**/Package.resolved', 'apps/swabble/Package*.swift', 'apps/swabble/Package.resolved') }}

      - name: Prepare canonical release inputs and warm device RTC
        run: node scripts/ios-archive-cache-probe.mjs prepare

      - name: Archive with an empty compilation cache
        run: node scripts/ios-archive-cache-probe.mjs cold

      - name: Save finished producer CAS through GitHub
        if: inputs.probe_mode == 'producer'
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ios-archive-cache-probe/cache
          key: ${{ steps.cache-inputs.outputs.key }}

      - name: Rematerialize source at the canonical paths
        if: inputs.probe_mode == 'consumer'
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git checkout-index --all --force
          node scripts/ios-archive-cache-probe.mjs prepare

      - name: Restore exact producer CAS through GitHub
        if: inputs.probe_mode == 'consumer'
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ios-archive-cache-probe/cache
          key: ${{ steps.cache-inputs.outputs.key }}
          fail-on-cache-miss: true

      - name: Archive from restored CAS and compare executables
        if: inputs.probe_mode == 'consumer'
        run: node scripts/ios-archive-cache-probe.mjs candidate

      - name: Retain archive probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-archive-cache-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ios-archive-cache-probe/*/run.json
            ${{ runner.temp }}/ios-archive-cache-probe/*/summary.json
            ${{ runner.temp }}/ios-archive-cache-probe/*/comparison.json
            ${{ runner.temp }}/ios-archive-cache-probe/*/archive.log
            ${{ runner.temp }}/ios-archive-cache-probe/*/build-log.json
            ${{ runner.temp }}/ios-archive-cache-probe/*/resource-timeline.jsonl
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
