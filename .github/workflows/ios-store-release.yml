name: iOS Store Release

run-name: iOS production CAS transport proof ${{ inputs.producer_run_id == '' && 'cold producer' || 'warm consumer' }}

# Temporary, nonmergeable diagnostic replacement. Archives and exports only;
# no Apple API credentials, uploads, release notes, screenshots, or staging.
on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Empty for a cold producer; successful producer run ID for a fresh-runner consumer
        type: string
        required: false
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: ios-production-cas-transport
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.22.1"

jobs:
  archive-cache-transport:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'openclaw/openclaw'
    runs-on: xcode-27-xlarge
    timeout-minutes: 45
    environment: ios-store-release
    steps:
      - name: Reserve host CPU for release capture
        timeout-minutes: 2
        run: sudo -n /usr/bin/mdutil -i off /System/Volumes/Data

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          install-bun: "false"
          install-deps: "false"
          node-version: ${{ env.NODE_VERSION }}

      - name: Install mobile release dependencies
        run: node scripts/install-mobile-release-dependencies.mjs

      - name: Setup Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "4.0.7"
          bundler: "4.0.23"
          bundler-cache: false
          working-directory: apps/ios

      - name: Install locked Fastlane bundle
        working-directory: apps/ios
        run: |
          set -euo pipefail
          bundle _4.0.23_ install --jobs 4 --retry 3
          bundle _4.0.23_ check
          test "$(bundle _4.0.23_ exec ruby -e 'require "fastlane"; print Fastlane::VERSION')" = "2.241.2"

      - name: Select Xcode
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain

      - name: Install pinned Swift build tools
        run: |
          set -euo pipefail
          swift_tools_dir="${RUNNER_TEMP}/openclaw-swift-tools"
          ./scripts/install-xcodegen.sh "$swift_tools_dir"
          ./scripts/install-swift-tools.sh "$swift_tools_dir"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"

      - name: Install Watch Rust toolchain
        if: hashFiles('apps/shared/OpenClawWatchRTC/Cargo.toml') != ''
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          watch_toolchain="$(awk -F '"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$watch_toolchain"
          rustup toolchain install "$watch_toolchain" --profile minimal --component rust-src

      - name: Identify Watch RTC release cache inputs
        id: watch-rtc-inputs
        run: |
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "OPENCLAW_WATCH_RTC_CACHE_DIR=$RUNNER_TEMP/openclaw-watch-rtc-release-libraries" >> "$GITHUB_ENV"

      - name: Verify immutable production source and transport contract
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
        run: node scripts/ios-archive-cache-transport.mjs prepare

      - name: Restore Watch RTC release libraries
        id: watch-rtc-cache
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &watch_rtc_release_cache_path ${{ runner.temp }}/openclaw-watch-rtc-release-libraries
          key: watch-rtc-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.watch-rtc-inputs.outputs.xcode }}-${{ hashFiles('apps/shared/OpenClawWatchRTC/Cargo.lock', 'apps/shared/OpenClawWatchRTC/Cargo.toml', 'apps/shared/OpenClawWatchRTC/rust-toolchain.toml', 'apps/shared/OpenClawWatchRTC/build.sh', 'apps/shared/OpenClawWatchRTC/src/**', 'apps/ios/project.yml') }}
          # The build phase verifies each slice fingerprint and checksum before reuse.
          restore-keys: |
            watch-rtc-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.watch-rtc-inputs.outputs.xcode }}-

      # Release sources use a different project path from ordinary CI. Keep the
      # default DerivedData package directory in its own cache namespace.

      - name: Restore iOS release source packages
        id: ios-packages-cache
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &ios_release_packages_cache_path ~/Library/Developer/Xcode/DerivedData/OpenClaw-*/SourcePackages
          key: ios-release-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.watch-rtc-inputs.outputs.xcode }}-${{ hashFiles('apps/ios/**/Package.resolved', 'apps/ios/project.yml', 'apps/shared/**/Package*.swift', 'apps/shared/**/Package.resolved', 'apps/swabble/Package*.swift', 'apps/swabble/Package.resolved') }}

      - name: Restore iOS release compilation cache
        id: ios-compilation-cache
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &ios_release_compilation_cache_path ${{ runner.temp }}/openclaw-ios-release-cas
          key: ios-release-cas-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.watch-rtc-inputs.outputs.xcode }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Compiler input hashes own source invalidation; keep cross-release reuse.
          restore-keys: |
            ios-release-cas-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.watch-rtc-inputs.outputs.xcode }}-

      - name: Create apps-signing read token
        id: apps-signing-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: "2729701"
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: openclaw
          repositories: apps-signing
          permission-contents: read

      - name: Checkout encrypted iOS signing assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/apps-signing
          ref: main
          path: apps/ios/build/release-signing/apps-signing
          token: ${{ steps.apps-signing-token.outputs.token }}
          persist-credentials: false

      - name: Route readonly match checkout to approved signing assets
        run: |
          set -euo pipefail
          signing_repo="file://${GITHUB_WORKSPACE}/apps/ios/build/release-signing/apps-signing/"
          git config --global url."${signing_repo}".insteadOf git@github.com:openclaw/apps-signing.git

      - name: Create job-owned iOS signing keychain
        uses: ./.github/actions/ios-signing-keychain

      - name: Validate readonly iOS signing key access
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          set -euo pipefail
          source ./scripts/lib/ios-fastlane.sh
          (cd apps/ios && run_ios_fastlane ios signing_check)
          node .github/actions/ios-signing-keychain/keychain.mjs probe

      - name: Archive and export through the unchanged production wrapper
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          OPENCLAW_IOS_COMPILATION_CACHE_DIR: ${{ runner.temp }}/openclaw-ios-release-cas
          CACHE_PRIMARY_KEY: ${{ steps.ios-compilation-cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.ios-compilation-cache.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.ios-compilation-cache.outputs.cache-hit }}
        run: node scripts/ios-archive-cache-transport.mjs archive

      - name: Save iOS release compilation cache
        if: steps.ios-compilation-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *ios_release_compilation_cache_path
          key: ${{ steps.ios-compilation-cache.outputs.cache-primary-key }}

      - name: Save Watch RTC release libraries
        if: steps.watch-rtc-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *watch_rtc_release_cache_path
          key: ${{ steps.watch-rtc-cache.outputs.cache-primary-key }}

      - name: Save iOS release source packages
        if: steps.ios-packages-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *ios_release_packages_cache_path
          key: ${{ steps.ios-packages-cache.outputs.cache-primary-key }}

      - name: Download only the producer comparison evidence
        if: inputs.producer_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-cas-transport-${{ inputs.producer_run_id }}
          path: ${{ runner.temp }}/ios-cas-producer
          github-token: ${{ github.token }}
          run-id: ${{ inputs.producer_run_id }}

      - name: Compare exports and account for completed cache transfers
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ios-archive-cache-transport.mjs report

      - name: Retain transport proof evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-cas-transport-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-cas-transport
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
