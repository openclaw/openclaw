name: Deploy ShopMini Demo to GitHub Pages

on:
  push:
    branches:
      - feature/shopmini-mvp
    paths:
      - "projects/shopmini/**"
      - ".github/workflows/deploy-shopmini.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: shopmini-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout only the demo files
        uses: actions/checkout@v4
        with:
          sparse-checkout: projects/shopmini

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload ShopMini website
        uses: actions/upload-pages-artifact@v4
        with:
          path: projects/shopmini

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
