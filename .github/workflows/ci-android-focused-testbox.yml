name: Blacksmith Focused Android Testbox
on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: "Testbox session ID"
        required: true
      timeout_minutes:
        type: number
        description: "Maximum GitHub job runtime for long Testbox commands"
        default: 60

permissions:
  contents: read

# Explicit small-profile qualification; broad proof uses ci-check-testbox.yml.
concurrency:
  group: ${{ github.workflow }}-manual-v1-${{ github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      group: ${{ steps.budget.outputs.group }}
      runner: ${{ steps.budget.outputs.runner }}
      minutes: ${{ steps.budget.outputs.minutes }}
      expires_at: ${{ steps.budget.outputs.expires_at }}
    steps:
      - name: Checkout admission policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci-testbox-budget.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Admit Testbox within the shared budget
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          TESTBOX_PROFILE: check-focused
          TESTBOX_ID: ${{ inputs.testbox_id }}
          TESTBOX_MINUTES: ${{ inputs.timeout_minutes }}
        run: node scripts/ci-testbox-budget.mjs admit

  check:
    needs: admission
    if: ${{ !cancelled() && needs.admission.result == 'success' }}
    concurrency:
      group: ${{ needs.admission.outputs.group }}
      cancel-in-progress: false
    permissions:
      contents: read
    name: "check"
    runs-on: ${{ needs.admission.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.admission.outputs.minutes || '60') }}
    steps:
      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@233448af4bfdc6fca509a7f0974411ac6d8a8043
        with:
          testbox_id: ${{ inputs.testbox_id }}
      - name: Reject expired Testbox admission
        shell: bash
        env:
          TESTBOX_EXPIRES_AT: ${{ needs.admission.outputs.expires_at }}
        run: |
          if [[ ! "$TESTBOX_EXPIRES_AT" =~ ^[0-9]+$ ]] ||
            (( $(date +%s) >= TESTBOX_EXPIRES_AT / 1000 )); then
            echo "Testbox admission expired after 60 minutes from dispatch; stop this lease and request a fresh one." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Bound Testbox idle lifetime
        run: node scripts/ci-testbox-budget.mjs configure

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          # Testbox hydration uses the ordinary pnpm store cache. Canonical CI
          # owns the exact dependency archive and never delegates here.
      - name: Prepare Testbox shell
        uses: ./.github/actions/prepare-testbox-shell
        with:
          base-ref: HEAD
          android: "true"

      - name: Run Testbox
        # Temporary local-listener fix: https://github.com/useblacksmith/run-testbox/pull/15
        # Return to useblacksmith/run-testbox after the fix lands upstream.
        uses: steipete/run-testbox@2b6b1be536ec7f3c73757fedf5460a27ab4856b4
        if: always()
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: Close Testbox SSH sessions
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          # Testbox state stores Blacksmith's external forwarded port. Resolve
          # sshd's VM-local listener because that is the sport visible to ss.
          runner_ssh_local_port="$(sudo sshd -T 2>/dev/null | awk '$1 == "port" { print $2; exit }')"
          if [[ ! "$runner_ssh_local_port" =~ ^[0-9]+$ ]] ||
            (( runner_ssh_local_port < 1 || runner_ssh_local_port > 65535 )); then
            echo "No valid local SSH listener port found; skipping session cleanup"
            exit 0
          fi

          # run-testbox has no post hook. Close only Testbox client sockets so
          # Blacksmith's runner teardown does not wait for its 290-second grace.
          timeout --signal=KILL 5s sudo ss -K state established \
            "( sport = :${runner_ssh_local_port} )" || true
