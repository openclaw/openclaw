name: macOS native agent grouping before-after capture

on:
  push:
    branches: [roboclaw/ios-narration-proof-156944]
    paths:
      - .github/workflows/mac-narration-capture.yml
      - scripts/mac-narration-proof/**
      - scripts/ios-agent-grouping.patch
      - scripts/test-ios-shell-gateway.mjs

permissions:
  contents: read

jobs:
  capture:
    name: Native Mac capture (${{ matrix.stage }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        stage: [before, after]
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: b9ae24aec6ad8ef987f904d3ed2fb748daac4892
      BASELINE_SHA: b9ae24aec6ad8ef987f904d3ed2fb748daac4892
      GROUPING_PATCH_SHA256: 05ee31314b0ab9e5314bca5b7cfad2ddbf9ee5c03c24ae07af2ed80ad56c9ec0
    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b9ae24aec6ad8ef987f904d3ed2fb748daac4892
          fetch-depth: 3
          persist-credentials: false
      - name: Checkout verification-only helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .proof
          persist-credentials: false
      - name: Select repository-native Xcode
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain 27.0
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: "false"
          install-deps: "false"
          cache-mode: "off"
      - name: Install pinned XcodeGen
        run: |
          scripts/install-xcodegen.sh "$RUNNER_TEMP/mac-tools/bin"
          echo "$RUNNER_TEMP/mac-tools/bin" >> "$GITHUB_PATH"
      - name: Restore SwiftPM download cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('apps/macos/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-
      - name: Capture native Mac grouping comparison
        env:
          CAPTURE_STAGE: ${{ matrix.stage }}
        run: |
          /bin/bash .proof/scripts/mac-narration-proof/run.sh \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.proof" \
            "$RUNNER_TEMP/mac-narration-capture" "$CAPTURE_STAGE"
      - name: Upload native screenshots and XCTest evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mac-agent-grouping-${{ matrix.stage }}
          path: ${{ runner.temp }}/mac-narration-capture
          if-no-files-found: error
          retention-days: 14
