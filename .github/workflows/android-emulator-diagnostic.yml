name: Android Emulator Diagnostic

run-name: Android emulator diagnostic instrumented (${{ inputs.target_sha }})

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact lowercase 40-character commit SHA to diagnose
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate target SHA
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be an exact lowercase 40-character commit SHA"
            exit 2
          fi

      - name: Checkout trusted Android tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/actions/setup-android-toolchain
          path: .mobile-release-tooling

      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: candidate

      - name: Verify exact target checkout
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          git -C candidate status --short --branch

      - name: Verify Android toolchain action parity
        shell: bash
        run: |
          set -euo pipefail
          action_path=".github/actions/setup-android-toolchain/action.yml"
          read -r trusted_mode trusted_type trusted_oid trusted_path < <(
            git -C .mobile-release-tooling ls-tree HEAD -- "$action_path"
          )
          read -r candidate_mode candidate_type candidate_oid candidate_path < <(
            git -C candidate ls-tree HEAD -- "$action_path"
          )
          if [[ "$trusted_mode" != "100644" || "$trusted_type" != "blob" || "$trusted_path" != "$action_path" ]]; then
            echo "::error::Trusted Android toolchain action is not a regular committed file"
            exit 1
          fi
          if [[ "$candidate_mode" != "100644" || "$candidate_type" != "blob" || "$candidate_path" != "$action_path" ]]; then
            echo "::error::Candidate Android toolchain action is not a regular committed file"
            exit 1
          fi
          trusted_blob="$RUNNER_TEMP/trusted-setup-android-toolchain.yml"
          candidate_blob="$RUNNER_TEMP/candidate-setup-android-toolchain.yml"
          git -C .mobile-release-tooling cat-file blob "$trusted_oid" >"$trusted_blob"
          git -C candidate cat-file blob "$candidate_oid" >"$candidate_blob"
          if ! cmp -s "$trusted_blob" "$candidate_blob"; then
            echo "::error::Candidate Android toolchain action differs from trusted workflow tooling"
            exit 1
          fi

  diagnose:
    needs: validate-target
    runs-on: ubuntu-24.04
    # Two launches can each consume 900s; retain 10m for setup, cleanup, artifact upload.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: phone
            artifact_name: android-emulator-diagnostic
            timeout_minutes: 25
          - scenario: wear
            artifact_name: android-emulator-diagnostic-wear
            timeout_minutes: 25
          - scenario: phone-then-wear
            artifact_name: android-emulator-diagnostic-phone-then-wear
            timeout_minutes: 40
    permissions:
      contents: read
    steps:
      - name: Initialize Android emulator diagnostic
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          DIAGNOSTIC_DIR="$RUNNER_TEMP/android-emulator-diagnostic"
          echo "DIAGNOSTIC_DIR=$DIAGNOSTIC_DIR" >>"$GITHUB_ENV"
          mkdir -p "$DIAGNOSTIC_DIR"
          {
            printf 'target_sha=%s\n' "$TARGET_SHA"
            printf 'tooling_sha=%s\n' "$GITHUB_WORKFLOW_SHA"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'runner_image=%s\n' "${ImageOS:-unknown}"
            printf 'runner_image_version=%s\n' "${ImageVersion:-unknown}"
            printf 'host_cpu=%s\n' "$(awk -F: '/^model name/ { sub(/^[[:space:]]+/, "", $2); print $2; exit }' /proc/cpuinfo)"
            printf 'host_logical_cpus=%s\n' "$(getconf _NPROCESSORS_ONLN)"
            printf 'host_memory_bytes=%s\n' "$(awk '/^MemTotal:/ { printf "%.0f\n", $2 * 1024 }' /proc/meminfo)"
            uname -a
            cat /etc/os-release
          } >"$DIAGNOSTIC_DIR/runner.txt"

      - name: Checkout trusted Android tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-android-toolchain
            scripts/android-sips-linux.sh
            scripts/android-emulator-diagnostic.sh
          path: .mobile-release-tooling

      - name: Setup Android toolchain
        uses: ./.mobile-release-tooling/.github/actions/setup-android-toolchain
        with:
          cache-mode: "off"
          install-screenshot-emulators: "true"

      - name: Prepare trusted Linux Android tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS/$RUNNER_ARCH" = "Linux/X64"
          for executable in /usr/bin/apt-get /usr/bin/sudo /usr/bin/timeout; do
            test -x "$executable"
          done
          apt_source="/etc/apt/sources.list.d/ubuntu.sources"
          apt_source_parts="$RUNNER_TEMP/openclaw-android-apt-sourceparts-disabled"
          test -s "$apt_source"
          if [[ -e "$apt_source_parts" || -L "$apt_source_parts" ]]; then
            echo "::error::Task-private APT source-parts path must remain absent"
            exit 1
          fi
          apt_options=(
            -o "Dir::Etc::sourcelist=$apt_source"
            -o "Dir::Etc::sourceparts=$apt_source_parts"
          )
          /usr/bin/timeout --signal=TERM --kill-after=10s 300s \
            /usr/bin/sudo env DEBIAN_FRONTEND=noninteractive \
            /usr/bin/apt-get "${apt_options[@]}" update
          /usr/bin/timeout --signal=TERM --kill-after=10s 300s \
            /usr/bin/sudo env DEBIAN_FRONTEND=noninteractive \
            /usr/bin/apt-get "${apt_options[@]}" install \
            -y --no-install-recommends acl imagemagick
          test -x /usr/bin/convert
          test -x /usr/bin/identify

          trusted_root=".mobile-release-tooling"
          adapter_path="scripts/android-sips-linux.sh"
          test "$(git -C "$trusted_root" rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          read -r adapter_mode adapter_type adapter_oid adapter_name < <(
            git -C "$trusted_root" ls-tree HEAD -- "$adapter_path"
          )
          if [[ "$adapter_mode" != "100755" || "$adapter_type" != "blob" ||
            "$adapter_name" != "$adapter_path" ]]; then
            echo "::error::Trusted Linux screenshot adapter is not a committed executable file"
            exit 1
          fi
          tool_dir="$RUNNER_TEMP/openclaw-android-tools"
          adapter="$tool_dir/android-sips-linux.sh"
          mkdir -p "$tool_dir"
          git -C "$trusted_root" cat-file blob "$adapter_oid" >"$adapter"
          chmod 700 "$adapter"
          cmp -s "$trusted_root/$adapter_path" "$adapter"

          smoke_dir="$DIAGNOSTIC_DIR/image-conversion-smoke"
          mkdir -p "$smoke_dir"
          for dimensions in 1440x2560 454x454; do
            width="${dimensions%x*}"
            height="${dimensions#*x}"
            /usr/bin/convert \
              \( -size "$dimensions" 'gradient:#000000-#ff0000' \) \
              \( -size "${height}x${width}" 'gradient:#000000-#00ff00' -transpose \) \
              -compose plus -composite \
              -alpha set -channel A -evaluate set 60% +channel \
              "$smoke_dir/input-${dimensions}.png"
            "$adapter" -s format jpeg -s formatOptions best \
              "$smoke_dir/input-${dimensions}.png" --out "$smoke_dir/output-${dimensions}.jpg"
            /usr/bin/identify +ping \
              -format 'format=%m width=%w height=%h colorspace=%[colorspace] type=%[type] channels=%[channels] quality=%Q\n' \
              "$smoke_dir/output-${dimensions}.jpg" >"$smoke_dir/output-${dimensions}.txt"
          done

      - name: Verify Linux KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          verify_kvm_acceleration() {
            local output_file="$1"
            local raw_output="${output_file}.raw"
            local accel_status
            local accel_timed_out=false

            if /usr/bin/timeout --signal=TERM --kill-after=2s 15s \
              emulator -accel-check >"$raw_output" 2>&1; then
              accel_status=0
            else
              accel_status=$?
            fi
            if [[ "$accel_status" == "124" || "$accel_status" == "137" ]]; then
              accel_timed_out=true
            fi
            head -c 16384 "$raw_output" >"$output_file"
            rm -f "$raw_output"
            {
              printf '\nexit_status=%s\n' "$accel_status"
              printf 'timed_out=%s\n' "$accel_timed_out"
            } >>"$output_file"
            cat "$output_file"
            if [[ "$accel_status" -ne 0 || "$accel_timed_out" != "false" ]]; then
              echo "::error::Android emulator acceleration check failed"
              return 1
            fi
            if ! grep -Eiq '\bKVM\b.*\b(available|usable)\b' "$output_file"; then
              echo "::error::Android emulator did not confirm usable KVM acceleration"
              return 1
            fi
          }

          test "$RUNNER_OS/$RUNNER_ARCH" = "Linux/X64"
          test -c /dev/kvm
          current_user="$(id -un)"
          /usr/bin/sudo /usr/bin/setfacl -m "u:${current_user}:rw" /dev/kvm
          /usr/bin/getfacl -cp /dev/kvm | grep -Fqx "user:${current_user}:rw-"
          KVM_DEVICE=/dev/kvm /bin/bash -c \
            'test -c "$KVM_DEVICE" && test -r "$KVM_DEVICE" && test -w "$KVM_DEVICE"'
          verify_kvm_acceleration "$DIAGNOSTIC_DIR/emulator-kvm-check.txt"

      - name: Run emulator diagnostic
        shell: bash
        env:
          DIAGNOSTIC_SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          trusted_root=".mobile-release-tooling"
          diagnostic_path="scripts/android-emulator-diagnostic.sh"
          test "$(git -C "$trusted_root" rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          read -r mode type oid name < <(git -C "$trusted_root" ls-tree HEAD -- "$diagnostic_path")
          if [[ "$mode" != "100755" || "$type" != "blob" || "$name" != "$diagnostic_path" ]]; then
            echo "::error::Trusted Android diagnostic is not a committed executable file"
            exit 1
          fi
          diagnostic="$RUNNER_TEMP/openclaw-android-tools/android-emulator-diagnostic.sh"
          git -C "$trusted_root" cat-file blob "$oid" >"$diagnostic"
          chmod 700 "$diagnostic"
          cmp -s "$trusted_root/$diagnostic_path" "$diagnostic"
          bash "$diagnostic" "$DIAGNOSTIC_SCENARIO"

      - name: Upload Android emulator diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-emulator-diagnostic
          retention-days: 7
