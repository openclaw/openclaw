        restore-keys: |
          ${{ runner.os }}-swiftpm-
    - name: Restore Swift build directory cache
      id: swift-build-cache
      if: contains(fromJSON('["release","tests"]'), matrix.phase) && env.FRV_CACHE_MODE != 'off'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
