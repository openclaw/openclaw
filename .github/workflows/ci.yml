        id: apple-mermaid-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/shared/mermaid/assets
          key: apple-mermaid-v1-${{ steps.apple-mermaid-inputs.outputs.key }}

      - name: Prepare Apple Mermaid assets
        run: |
          set -euo pipefail
          if [[ -f scripts/prepare-apple-mermaid.mjs ]]; then
            node scripts/prepare-apple-mermaid.mjs
          elif [[ "$HISTORICAL_TARGET" == "true" ]]; then
            echo "Frozen target predates bundled Mermaid assets."
          else
            echo "Current CI targets must provide scripts/prepare-apple-mermaid.mjs." >&2
            exit 1
          fi

      - &apple_mermaid_cache_save
        name: Save Apple Mermaid assets
        if: steps.apple-mermaid-inputs.outputs.key != '' && steps.apple-mermaid-cache.outputs.cache-hit != 'true' && needs.preflight.outputs.cache_write_allowed == 'true' && github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule"]'), github.event_name)
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/shared/mermaid/assets
          key: ${{ steps.apple-mermaid-cache.outputs.cache-primary-key }}

      - name: Install XcodeGen / SwiftLint / SwiftFormat
        if: matrix.phase == env.MACOS_PRIMARY_PHASE
        run: |
          if [[ -x ./scripts/install-xcodegen.sh && -x ./scripts/install-swift-tools.sh ]]; then
            swift_tools_dir="$RUNNER_TEMP/openclaw-swift-tools"
            ./scripts/install-xcodegen.sh "$swift_tools_dir"
            ./scripts/install-swift-tools.sh "$swift_tools_dir"
            echo "$swift_tools_dir" >> "$GITHUB_PATH"
            "$swift_tools_dir/xcodegen" --version
            "$swift_tools_dir/swiftformat" --version
            "$swift_tools_dir/swiftlint" version
