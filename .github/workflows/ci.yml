            'apps/shared/OpenClawWatchRTC/build.sh') }}-${{ hashFiles('apps/ios/Sources/**', 'apps/ios/Tests/**', 'apps/ios/ShareExtension/**',
            'apps/ios/ActivityWidget/**', 'apps/ios/WatchApp/**', 'apps/ios/Resources/**', 'apps/shared/**/Sources/**', 'apps/shared/OpenClawKit/Plugins/**',
            'apps/shared/OpenClawWatchRTC/src/**', 'apps/swabble/Sources/**', 'apps/macos/Tests/OpenClawIPCTests/AsyncTestGate.swift',
            'apps/macos/Tests/OpenClawIPCTests/DashboardHTTPFixture.swift', 'apps/macos/Tests/OpenClawIPCTests/GatewayWebSocketTestSupport.swift',
            'apps/macos/Tests/OpenClawIPCTests/TestWait.swift', 'apps/shared/OpenClawKit/Tests/OpenClawKitTests/NativeGatewayWebSocketFixture.swift',
            'apps/shared/OpenClawKit/Tests/OpenClawKitTests/ChatMermaidRenderModelTests.swift', 'apps/shared/OpenClawKit/Tests/OpenClawKitTests/ChatSelectableTextViewTests.swift',
