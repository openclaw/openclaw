          set -euo pipefail
          openclawkit_scratch="$(mktemp -d "$RUNNER_TEMP/openclawkit.XXXXXX")"
          trap 'rm -rf "$openclawkit_scratch"' EXIT
          openclawkit_test_args=(
            --package-path apps/shared/OpenClawKit
            --scratch-path "$openclawkit_scratch"
            --disable-index-store -Xswiftc -gline-tables-only
          )
          if [[ "$OPENCLAWKIT_TEST_EXECUTION" == "parallel" ]]; then
            openclawkit_test_args+=(--parallel)
          else
            openclawkit_test_args+=(--no-parallel)
          fi
          swift test "${openclawkit_test_args[@]}"

      - name: Swabble tests
        if: matrix.phase == 'packages' && env.HISTORICAL_TARGET != 'true'
        run: |
          set -euo pipefail
          swabble_scratch="$(mktemp -d "$RUNNER_TEMP/swabble.XXXXXX")"
          trap 'rm -rf "$swabble_scratch"' EXIT
          swift test --package-path apps/swabble --scratch-path "$swabble_scratch" --build-system native --disable-index-store -Xswiftc -gline-tables-only --no-parallel

      - name: Swift test
        id: swift-test
        if: matrix.phase == 'tests'
        run: |
          set -euo pipefail
          source .ci-harness/scripts/lib/swift-toolchain.sh
          native_test_log_dir="$RUNNER_TEMP/openclaw-native-test-logs"
          native_test_log_id="$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
          # SwiftPM's swiftbuild backend can omit the test-bundle rpath for Sparkle.
          # Remove once runner toolchains pass with swiftlang/swift-package-manager#10394.
          # Keep the release build above on the default backend.
          # CI needs coverage and line backtraces, not IDE indexes or debugger type metadata.
          swift_test_args=(--package-path apps/macos --build-system native --enable-code-coverage --disable-index-store -Xswiftc -gline-tables-only)
          swift build "${swift_test_args[@]}" --build-tests
          echo "debug-tests-built=true" >> "$GITHUB_OUTPUT"
          swift_test_args+=(--skip-build)
          if [[ -f scripts/test-macos-native.mts ]]; then
            logical_cpu="$(sysctl -n hw.logicalcpu)"
            if [[ ! "$logical_cpu" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid macOS logical CPU count: $logical_cpu" >&2
              exit 1
            fi
            swift_test_width=$(( logical_cpu < 12 ? logical_cpu : 12 ))
            echo "[macos-swift] Swift Testing parallelization width: $swift_test_width"
            swift_test_args+=(--experimental-maximum-parallelization-width "$swift_test_width")
            # Quick Chat keeps XCTest process isolation: parallel suites take key status and dismiss its
            # panel. Frozen targets without the suite skip the lane.
            if [[ "$HISTORICAL_TARGET" != "true" || -f apps/macos/Tests/OpenClawIPCTests/QuickChatCatalogPresentationTests.swift ]]; then
              run_apple_command_logged "$native_test_log_dir/default-$native_test_log_id.log" node scripts/test-macos-native.mts default "${swift_test_args[@]}" --skip "AppStateIsolationTests|ProfileChatPreferencesTests|QuickChatCatalogPresentationTests"
              run_apple_command_logged "$native_test_log_dir/default-rendered-$native_test_log_id.log" node scripts/test-macos-native.mts default "${swift_test_args[@]}" --filter "QuickChatCatalogPresentationTests"
            else
              run_apple_command_logged "$native_test_log_dir/default-$native_test_log_id.log" node scripts/test-macos-native.mts default "${swift_test_args[@]}" --skip "AppStateIsolationTests|ProfileChatPreferencesTests"
            fi
            run_apple_command_logged "$native_test_log_dir/named-$native_test_log_id.log" node scripts/test-macos-native.mts named "${swift_test_args[@]}" --filter "AppStateIsolationTests|ProfileChatPreferencesTests"
          elif [[ "$HISTORICAL_TARGET" == "true" ]]; then
            # Frozen release targets predate the resource-owner script and its tests.
            # Their original suite still runs only on this disposable macOS worker.
            swift_test_args+=(--no-parallel)
            run_apple_command_logged "$native_test_log_dir/default-$native_test_log_id.log" swift test "${swift_test_args[@]}"
          else
            echo "Current CI targets must provide scripts/test-macos-native.mts." >&2
            exit 1
          fi

      - name: Upload macOS native test logs
        if: ${{ always() && matrix.phase == 'tests' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-native-test-logs
          path: ${{ runner.temp }}/openclaw-native-test-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload default-profile chat menu captures
        if: ${{ always() && steps.swift-test.outputs.menu-default-artifact-path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-chat-menu-captures-default
          path: |
            ${{ runner.temp }}/openclaw-menu-default-*/*-window.png
            ${{ runner.temp }}/openclaw-menu-default-*/*-menu-*.png
            ${{ runner.temp }}/openclaw-menu-default-*/*-capture-status.json
            ${{ runner.temp }}/openclaw-menu-default-*/capture-export.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload named-profile chat menu captures
        if: ${{ always() && steps.swift-test.outputs.menu-named-artifact-path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-chat-menu-captures-named
          path: |
            ${{ steps.swift-test.outputs.menu-named-artifact-path }}/*-window.png
            ${{ steps.swift-test.outputs.menu-named-artifact-path }}/*-menu-*.png
            ${{ steps.swift-test.outputs.menu-named-artifact-path }}/*-capture-status.json
            ${{ steps.swift-test.outputs.menu-named-artifact-path }}/capture-export.json
          if-no-files-found: error
          retention-days: 7

      - name: Render isolated macOS health fixtures
        id: health-render
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.preflight.outputs.validation_tier != 'main' && !inputs.release_gate && needs.preflight.outputs.release_scope == 'full' && steps.swift-test.outputs.debug-tests-built == 'true' && hashFiles('scripts/test-macos-health-render.sh') != '' }}
        run: bash scripts/test-macos-health-render.sh

      - name: Upload macOS health component renders
        if: ${{ always() && steps.health-render.outputs.artifact-path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-health-component-renders
          path: |
            ${{ steps.health-render.outputs.artifact-path }}/ready.png
            ${{ steps.health-render.outputs.artifact-path }}/startup-grace.png
            ${{ steps.health-render.outputs.artifact-path }}/stale-socket.png
            ${{ steps.health-render.outputs.artifact-path }}/disabled.png
            ${{ steps.health-render.outputs.artifact-path }}/probe-permission.png
          if-no-files-found: error
          retention-days: 7

      - name: Check Swift cache save budget
        id: swift-cache-budget
        if: matrix.phase != 'packages' && needs.preflight.outputs.cache_write_allowed == 'true'
        continue-on-error: true
        timeout-minutes: 1
        env:
          CACHE_STARTED: ${{ steps.swift-cache-clock.outputs.started }}
        run: |
          python3 -I -S - <<'PYTHON'
          import os
          import time
          try:
              elapsed = time.monotonic() - float(os.environ.get("CACHE_STARTED", ""))
              allowed = 0 <= elapsed < 20 * 60
          except ValueError:
              allowed = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"allowed={str(allowed).lower()}", file=output)
          if not allowed:
              print("::notice::Skipping optional Swift cache saves: insufficient or unknown job budget.")
          PYTHON

      - name: Save SwiftPM cache
        continue-on-error: true
        timeout-minutes: 1
        if: matrix.phase == env.MACOS_PRIMARY_PHASE && needs.preflight.outputs.cache_write_allowed == 'true' && steps.swiftpm-cache.outputs.cache-hit != 'true' && steps.swift-cache-budget.outputs.allowed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}

      - name: Record Swift build input timestamps
        id: record-swift-build-cache-metadata
        continue-on-error: true
        timeout-minutes: 1
        if: needs.preflight.outputs.cache_write_allowed == 'true' && steps.swift-build-cache.outputs.cache-hit != 'true' && steps.swift-cache-budget.outputs.allowed == 'true' && env.HISTORICAL_TARGET != 'true'
        run: python3 -I -S scripts/swift-build-cache-metadata.py record

      - name: Save Swift build directory cache
        continue-on-error: true
        timeout-minutes: 2
        if: needs.preflight.outputs.cache_write_allowed == 'true' && steps.swift-build-cache.outputs.cache-hit != 'true' && steps.swift-cache-budget.outputs.allowed == 'true' && (env.HISTORICAL_TARGET == 'true' || steps.record-swift-build-cache-metadata.outcome == 'success')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/macos/.build
          key: ${{ steps.swift-build-cache.outputs.cache-primary-key }}

  ios-build:
    permissions:
      contents: read
    name: ${{ format('ios-build ({0})', matrix.phase) }}
    needs: [preflight]
    if: needs.preflight.outputs.run_ios_build == 'true'
    concurrency:
      group: ${{ github.event_name == 'schedule' && format('{0}-hourly-ios-v1-{1}', github.workflow, matrix.phase) || format('{0}-ios-v1-{1}-{2}', github.workflow, github.run_id, matrix.phase) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        phase: ${{ fromJSON(github.event_name == 'schedule' && '["tests"]' || github.event_name == 'workflow_dispatch' && !inputs.release_gate && needs.preflight.outputs.release_scope == 'full' && ((needs.preflight.outputs.validation_tier == 'main' || needs.preflight.outputs.compatibility_target == 'true') && '["tests"]' || '["release","tests"]') || '["smoke"]') }}
    runs-on: *hosted_xcode_runner
    timeout-minutes: 150
    env:
      HISTORICAL_TARGET: *historical_target
      IOS_CI_PHASE: ${{ matrix.phase }}
      IOS_MAIN_TIER: ${{ needs.preflight.outputs.validation_tier == 'main' }}
      IOS_SIMULATOR_SELECTION: ${{ needs.preflight.outputs.ios_simulator_selection }}
    steps:
      - *platform_checkout_step

      - *select_xcode_step

      - *plain_node_setup_step

      - *apple_mermaid_cache_key
      - *apple_mermaid_cache_restore

      - name: Identify iOS native cache inputs
        id: ios-cache-inputs
        if: env.HISTORICAL_TARGET != 'true' && needs.preflight.outputs.frozen_target != 'true' && hashFiles('apps/shared/OpenClawWatchRTC/build.sh') != ''
        run: |
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "OPENCLAW_WATCH_RTC_CACHE_DIR=$RUNNER_TEMP/openclaw-watch-rtc-libraries" >> "$GITHUB_ENV"

      - name: Restore iOS source packages
        id: ios-packages-cache
        if: steps.ios-cache-inputs.outputs.xcode != '' && needs.preflight.outputs.cache_mode != 'off'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &ios_packages_cache_paths |
            ~/Library/Developer/Xcode/DerivedData/OpenClaw-*/SourcePackages
          key: ios-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache-inputs.outputs.xcode }}-${{ hashFiles('apps/ios/**/Package.resolved', 'apps/ios/project.yml', 'apps/shared/**/Package.swift', 'apps/swabble/Package.swift') }}

      - name: Restore Watch RTC build inputs
        id: watch-rtc-cache
        if: steps.ios-cache-inputs.outputs.xcode != '' && needs.preflight.outputs.cache_mode != 'off'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &watch_rtc_cache_paths |
            ~/.cargo/registry
            ${{ runner.temp }}/openclaw-watch-rtc-libraries
          key: watch-rtc-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache-inputs.outputs.xcode }}-${{ hashFiles('apps/shared/OpenClawWatchRTC/Cargo.lock', 'apps/shared/OpenClawWatchRTC/Cargo.toml', 'apps/shared/OpenClawWatchRTC/rust-toolchain.toml', 'apps/shared/OpenClawWatchRTC/build.sh', 'apps/shared/OpenClawWatchRTC/src/**', 'apps/ios/project.yml') }}

      - &install_watch_rust_toolchain
        name: Install Watch Rust toolchain
        if: env.HISTORICAL_TARGET != 'true' || hashFiles('apps/shared/OpenClawWatchRTC/Cargo.toml') != ''
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          watch_toolchain="$(awk -F '"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$watch_toolchain"
          rustup toolchain install "$watch_toolchain" --profile minimal --component rust-src

      - name: Test Watch RTC engine
        if: matrix.phase == 'tests' && (env.HISTORICAL_TARGET != 'true' || hashFiles('apps/shared/OpenClawWatchRTC/Cargo.toml') != '')
        working-directory: apps/shared/OpenClawWatchRTC
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            AWS_LC_SYS_NO_ASM=0 AWS_LC_SYS_CMAKE_BUILDER=0 \
            cargo test --locked --lib -j 2 -- --test-threads=1

      - name: Install iOS Swift tooling
        run: |
          if [[ -x ./scripts/install-xcodegen.sh && -x ./scripts/install-swift-tools.sh ]]; then
            swift_tools_dir="$RUNNER_TEMP/openclaw-swift-tools"
            ./scripts/install-xcodegen.sh "$swift_tools_dir"
            ./scripts/install-swift-tools.sh "$swift_tools_dir"
            echo "$swift_tools_dir" >> "$GITHUB_PATH"
            "$swift_tools_dir/xcodegen" --version
            "$swift_tools_dir/swiftformat" --version
            "$swift_tools_dir/swiftlint" version
          elif [[ "$HISTORICAL_TARGET" == "true" ]]; then
            # The generated Xcode project runs SwiftFormat during the build, so
            # frozen targets must keep the formatter contract they were authored for.
            brew update
            brew install xcodegen swiftlint
            swiftformat_min_version="$(awk '$1 == "--min-version" { print $2; exit }' config/swiftformat)"
            case "$swiftformat_min_version" in
              ""|0.61.1)
                swiftformat_version="0.61.1"
                swiftformat_checksum="b990400779aceb7d7020796eb9ba814d4480543f671d38fc0ff48cb72f04c584"
                ;;
              0.62.1)
                swiftformat_version="0.62.1"
                swiftformat_checksum="7cb1cb1fae04932047c7015441c543848e8e60e1572d808d080e0a1f1661114a"
                ;;
              *)
                echo "Unsupported frozen-target SwiftFormat minimum: $swiftformat_min_version" >&2
                exit 1
                ;;
            esac
            swiftformat_archive="$RUNNER_TEMP/swiftformat-$swiftformat_version.zip"
            swift_tools_dir="$RUNNER_TEMP/openclaw-legacy-swift-tools"
            curl --fail --location --no-progress-meter --show-error \
              --connect-timeout 10 --max-time 120 \
              --retry 3 --retry-max-time 120 \
              --output "$swiftformat_archive" \
              "https://github.com/nicklockwood/SwiftFormat/releases/download/$swiftformat_version/swiftformat.zip" \
              2> >(sed 's/^Warning: /::warning::/' >&2)
            if [[ "$(shasum -a 256 "$swiftformat_archive" | awk '{print $1}')" != "$swiftformat_checksum" ]]; then
              echo "SwiftFormat $swiftformat_version archive checksum mismatch" >&2
              exit 1
            fi
            mkdir -p "$swift_tools_dir"
            unzip -q "$swiftformat_archive" -d "$swift_tools_dir"
            chmod +x "$swift_tools_dir/swiftformat"
            echo "$swift_tools_dir" >> "$GITHUB_PATH"
            [[ "$("$swift_tools_dir/swiftformat" --version)" == "$swiftformat_version" ]]
            # Legacy generated Xcode phases prepend Homebrew ahead of GITHUB_PATH.
            # Point that lookup at the verified binary or the build can bypass the pin.
            swiftformat_link="$(brew --prefix)/bin/swiftformat"
            ln -sfn "$swift_tools_dir/swiftformat" "$swiftformat_link"
            [[ "$("$swiftformat_link" --version)" == "$swiftformat_version" ]]
          else
            echo "Current CI targets must provide scripts/install-xcodegen.sh and scripts/install-swift-tools.sh." >&2
            exit 1
          fi

      - name: Swift lint
        if: matrix.phase == 'smoke' || matrix.phase == 'tests'
        run: |
          if [[ -x ./scripts/lint-swift.sh && -x ./scripts/format-swift.sh ]]; then
            ./scripts/lint-swift.sh ios
            ./scripts/format-swift.sh ios
          else
            # Frozen release targets before the iOS lint lane have no equivalent target-owned step.
            echo "Swift lint wrappers are absent; skipping iOS lint for this frozen target."
          fi

      - name: Configure iOS build and report simulator selection
        if: (matrix.phase == 'smoke' || matrix.phase == 'tests') && needs.preflight.outputs.compatibility_target != 'true'
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { appendFileSync } from "node:fs";
          import { formatIosSimulatorSelectionSummary } from "./.ci-harness/scripts/lib/ci-ios-smoke-plan.mjs";
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, formatIosSimulatorSelectionSummary(JSON.parse(process.env.IOS_SIMULATOR_SELECTION)));
          JS
          if [[ "$IOS_CI_PHASE" == "smoke" || "$IOS_MAIN_TIER" == "true" ]]; then
            # Keep native architecture and test-bundle compilation even without simulator execution.
            smoke_settings="$RUNNER_TEMP/openclaw-ios-smoke.xcconfig"
            printf 'ARCHS = %s\nCOMPILER_INDEX_STORE_ENABLE = NO\n' "$(uname -m)" > "$smoke_settings"
            echo "XCODE_XCCONFIG_FILE=$smoke_settings" >> "$GITHUB_ENV"
          fi

      - name: Prepare iOS simulator
        if: (matrix.phase == 'tests' || (matrix.phase == 'smoke' && (needs.preflight.outputs.run_ios_voice_cleanup_tests == 'true' || needs.preflight.outputs.run_ios_lifecycle_tests == 'true'))) && needs.preflight.outputs.compatibility_target != 'true'
        run: |
          set -euo pipefail
          source .ci-harness/scripts/lib/swift-toolchain.sh
          simulator_id="$(select_ios_test_simulator)"
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Build iOS app
        if: matrix.phase == 'smoke' || matrix.phase == 'tests'
        run: |
          set -euo pipefail
          if [[ ( "$IOS_CI_PHASE" == "smoke" || "$IOS_MAIN_TIER" == "true" ) && "$HISTORICAL_TARGET" != "true" ]]; then
            # Full manual validation retains the universal simulator build.
            if [[ -n "${IOS_SIMULATOR_ID:-}" ]]; then
              export IOS_DEST="platform=iOS Simulator,id=$IOS_SIMULATOR_ID"
            else
              export IOS_DEST="generic/platform=iOS Simulator"
            fi
          fi
          python3 - <<'PY'
          import os
          import signal
          import subprocess
          import time

          def interrupted(signum, _frame):
              raise SystemExit(128 + signum)

          signal.signal(signal.SIGTERM, interrupted)
          preparation = None
          log_path = os.path.join(os.environ["RUNNER_TEMP"], "ios-simulator-prepare.log")
          started = time.monotonic()
          with open(log_path, "w+") as log:
              try:
                  if os.environ.get("IOS_SIMULATOR_ID"):
                      preparation = subprocess.Popen(["/bin/bash", "-euo", "pipefail", "-c", '''
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
          if [[ -x ./scripts/install-simslim.sh && -x ./scripts/ios-simulator-prepare.sh ]]; then
            simslim_dir="$RUNNER_TEMP/openclaw-simslim"
            ./scripts/install-simslim.sh "$simslim_dir"
            OPENCLAW_CI_SIMSLIM_BINARY="$simslim_dir/simslim" \
              ./scripts/ios-simulator-prepare.sh "$IOS_SIMULATOR_ID"
          fi
          '''], stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                  if os.environ["IOS_CI_PHASE"] == "smoke" and os.environ["HISTORICAL_TARGET"] != "true":
                      subprocess.run(["pnpm", "ios:gen"], check=True)
                      subprocess.run([
                          "xcodebuild",
                          "-project", "apps/ios/OpenClaw.xcodeproj",
                          "-scheme", "OpenClaw",
                          "-configuration", "Debug",
                          "-destination", os.environ["IOS_DEST"],
                          "-showBuildTimingSummary",
                          "build-for-testing",
                      ], check=True)
                  else:
                      subprocess.run(["pnpm", "ios:build"], check=True)
                  print(f"iOS app build: {time.monotonic() - started:.1f}s", flush=True)
                  if preparation:
                      # Bound the join even if boot or SimSlim never completes.
                      result = preparation.wait(timeout=max(1, 600 - (time.monotonic() - started)))
                      if result:
                          raise SystemExit(result if result > 0 else 1)
              except subprocess.TimeoutExpired:
                  print("::error::iOS simulator preparation exceeded 600s", flush=True)
                  raise SystemExit(1)
              finally:
                  if preparation and preparation.poll() is None:
                      try:
                          os.killpg(preparation.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      preparation.wait()
                  log.seek(0)
                  print(log.read(), flush=True)
                  print(f"iOS build and simulator preparation: {time.monotonic() - started:.1f}s", flush=True)
          PY

      - name: Build iOS app (Release)
        if: matrix.phase == 'release'
        run: |
          set -euo pipefail
          ./scripts/ios-configure-signing.sh
          ./scripts/ios-write-version-xcconfig.sh
          node scripts/ios-write-swift-filelist.mjs
          xcodegen generate --spec apps/ios/project.yml --project apps/ios
          xcodebuild \
            -project apps/ios/OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - *apple_mermaid_cache_save

      - name: Save iOS source packages
        if: steps.ios-cache-inputs.outputs.xcode != '' && steps.ios-packages-cache.outputs.cache-hit != 'true' && needs.preflight.outputs.cache_write_allowed == 'true' && github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule"]'), github.event_name)
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *ios_packages_cache_paths
          key: ${{ steps.ios-packages-cache.outputs.cache-primary-key }}

      - name: Save Watch RTC build inputs
        if: steps.ios-cache-inputs.outputs.xcode != '' && steps.watch-rtc-cache.outputs.cache-hit != 'true' && needs.preflight.outputs.cache_write_allowed == 'true' && github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule"]'), github.event_name)
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *watch_rtc_cache_paths
          key: ${{ steps.watch-rtc-cache.outputs.cache-primary-key }}

      - name: Prove native managed document download and export
        id: ios_attachment_tests
        if: matrix.phase == 'tests' && needs.preflight.outputs.validation_tier != 'main' && needs.preflight.outputs.compatibility_target != 'true'
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
        run: /bin/bash scripts/test-ios-chat-attachments.sh "$BASELINE_SHA"

      - name: Run focused iOS voice cleanup simulator tests
        id: ios_voice_cleanup_tests
        if: (matrix.phase == 'tests' || (matrix.phase == 'smoke' && needs.preflight.outputs.run_ios_voice_cleanup_tests == 'true')) && needs.preflight.outputs.compatibility_target != 'true'
        run: |
          set -euo pipefail
          source .ci-harness/scripts/lib/swift-toolchain.sh
          mkdir -p apps/ios/build/LifecycleTestResults
          diagnostic_collection=on-failure
          if [[ "$IOS_CI_PHASE" == "smoke" || "$IOS_MAIN_TIER" == "true" ]]; then
            # Xcode 27's verbose simulator diagnostics can stall for 600s after passing tests.
            # Keep xcresult/log evidence here and verbose diagnostics in full manual validation.
            diagnostic_collection=never
          fi
          test_action=test
          if [[ "$IOS_CI_PHASE" == "smoke" && "$HISTORICAL_TARGET" != "true" ]]; then
            test_action=test-without-building
          fi
          run_apple_command_logged apps/ios/build/LifecycleTestResults/OpenClawVoiceCleanupTests.log xcodebuild \
            -project apps/ios/OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID:?}" \
            -resultBundlePath apps/ios/build/LifecycleTestResults/OpenClawVoiceCleanupTests.xcresult \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics "$diagnostic_collection" \
            -only-testing:OpenClawTests/TalkRealtimeVoiceSessionCleanupTests \
            -only-testing:OpenClawTests/TalkRealtimeConsultCancellationTests \
            -only-testing:OpenClawTests/TalkRealtimeTranscriptWriteQueueTests \
            -only-testing:OpenClawTests/TalkModeManagerTests \
            -only-testing:OpenClawTests/ManagedDocumentEnvelopeTests \
            -only-testing:OpenClawTests/IOSMediaArtifactLoaderTests \
            -only-testing:OpenClawTests/OpenClawTypographyTests \
            "$test_action"

      - name: Run focused iOS lifecycle simulator tests
        id: ios_lifecycle_tests
        if: (matrix.phase == 'tests' || (matrix.phase == 'smoke' && needs.preflight.outputs.run_ios_lifecycle_tests == 'true')) && needs.preflight.outputs.compatibility_target != 'true'
        run: |
          set -euo pipefail
          source .ci-harness/scripts/lib/swift-toolchain.sh
          result_bundle="apps/ios/build/LifecycleTestResults/OpenClawLifecycleTests.xcresult"
          mkdir -p "apps/ios/build/LifecycleTestResults"
          test_args=(
            -only-testing:OpenClawTests/CloudflareAccessClientTests
            -only-testing:OpenClawTests/CloudflareAccessTransferTests
            -only-testing:OpenClawTests/CloudflareAccessSessionStoreTests
            -only-testing:OpenClawTests/ChatTypingFocusTests
            -only-testing:OpenClawTests/ChatSendHydrationTests
          )
          if [[ "$IOS_CI_PHASE" == "tests" ]]; then
            test_args+=(
              -only-testing:OpenClawLogicTests/WatchVoiceTurnTrackerTests
              -only-testing:OpenClawTests/DelayedActionGateTests
              -only-testing:OpenClawTests/IOSGatewayChatTransportTests
              -only-testing:OpenClawTests/LocationServiceCallbackTests
              -only-testing:OpenClawTests/LocationServiceOrderingTests
              -only-testing:OpenClawTests/NodeAppModelInvokeTests
              -only-testing:OpenClawTests/OpenClawAppDelegateTests
              -only-testing:OpenClawTests/WatchMessagingInboundTransportTests
              -only-testing:OpenClawTests/WatchSessionActivationGateTests
              -only-testing:OpenClawTests/OpenClawTypographyTests
              -only-testing:OpenClawTests/NotificationServingPreferenceTests
              -only-testing:OpenClawTests/RootTabsSourceGuardTests
              -only-testing:OpenClawTests/TraceHeadingVisualProofTests
            )
          fi
          diagnostic_collection=on-failure
          if [[ "$IOS_CI_PHASE" == "smoke" || "$IOS_MAIN_TIER" == "true" ]]; then
            diagnostic_collection=never
          fi
          test_action=test
          if [[ "$IOS_CI_PHASE" == "smoke" && "$HISTORICAL_TARGET" != "true" ]]; then
            test_action=test-without-building
          fi
          run_apple_command_logged "${result_bundle%.xcresult}.log" xcodebuild \
            -project apps/ios/OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID:?}" \
            -resultBundlePath "$result_bundle" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics "$diagnostic_collection" \
            "${test_args[@]}" \
            "$test_action"
          if [[ "$IOS_CI_PHASE" == "tests" && "$IOS_MAIN_TIER" != "true" ]]; then
            run_apple_command_logged apps/ios/build/LifecycleTestResults/OpenClawWatchDeliveryUITests.log xcodebuild \
              -project apps/ios/OpenClaw.xcodeproj \
              -scheme OpenClawUITests \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID:?}" \
              -resultBundlePath apps/ios/build/LifecycleTestResults/OpenClawWatchDeliveryUITests.xcresult \
              -parallel-testing-enabled NO \
              -only-testing:OpenClawUITests/OpenClawSnapshotUITests/testWatchMessageDeliveryIsReachableFromSettings \
              -only-testing:OpenClawUITests/BootstrapSetupFailureUITests \
              test
          fi

      - name: Run focused Apple Watch operation simulator tests
        if: matrix.phase == 'tests' && needs.preflight.outputs.validation_tier != 'main' && needs.preflight.outputs.compatibility_target != 'true'
        run: |
          set -euo pipefail
          source .ci-harness/scripts/lib/swift-toolchain.sh
          simulator_id="$(
            xcrun simctl list devices available --json | node --input-type=module -e '
              const chunks = [];
              for await (const chunk of process.stdin) chunks.push(chunk);
              const runtimes = JSON.parse(Buffer.concat(chunks).toString("utf8")).devices;
              const simulator = Object.values(runtimes)
                .flat()
                .find((device) => device.isAvailable && device.name.startsWith("Apple Watch"));
              if (!simulator) {
                console.error("No available Apple Watch simulator for operation lifecycle tests");
                process.exit(1);
              }
              process.stdout.write(simulator.udid);
            '
          )"
          # Reuse the Watch products already compiled by the generic iOS build.
          # Resolve the selected target product from Xcode, not its DerivedData naming.
          xcodebuild_args=(
            -project apps/ios/OpenClaw.xcodeproj
            -scheme OpenClawWatchApp
            -configuration Debug
            -destination "platform=watchOS Simulator,id=${simulator_id}"
            CODE_SIGNING_ALLOWED=NO
          )
          test_args=(
            -parallel-testing-enabled NO
            -only-testing:OpenClawWatchTests/WatchInboxStoreOperationTests
            -only-testing:OpenClawWatchTests/WatchSpeechPlaybackTests
            -only-testing:OpenClawWatchTests/WatchRealtimeMediaTests
            -only-testing:OpenClawWatchTests/WatchGatewayConfigurationTests
          )
          run_apple_command_logged apps/ios/build/LifecycleTestResults/OpenClawWatchBuild.log xcodebuild \
            "${xcodebuild_args[@]}" "${test_args[@]}" build-for-testing
          app_path="$(
            xcodebuild "${xcodebuild_args[@]}" -showBuildSettings -json |
              node --input-type=module -e '
                import path from "node:path";
                const chunks = [];
                for await (const chunk of process.stdin) chunks.push(chunk);
                const targets = JSON.parse(Buffer.concat(chunks).toString("utf8"))
                  .filter((target) => target.target === "OpenClawWatchApp");
                if (targets.length !== 1) throw new Error("Expected one Watch app target from Xcode");
                const { TARGET_BUILD_DIR, FULL_PRODUCT_NAME } = targets[0].buildSettings;
                if (!path.isAbsolute(TARGET_BUILD_DIR) || !FULL_PRODUCT_NAME) {
                  throw new Error("Expected an absolute Watch app product from Xcode");
                }
                process.stdout.write(path.join(TARGET_BUILD_DIR, FULL_PRODUCT_NAME));
              '
          )"
          companion_id="$(
            xcrun simctl list pairs --json | node --input-type=module -e '
              const chunks = [];
              for await (const chunk of process.stdin) chunks.push(chunk);
              const pairs = Object.values(JSON.parse(Buffer.concat(chunks).toString("utf8")).pairs);
              const pair = pairs.find((entry) => entry.watch.udid === process.argv[1]);
              process.stdout.write(pair?.phone.udid ?? "");
            ' "$simulator_id"
          )"
          # XCTest connects through the paired phone, which can differ from IOS_SIMULATOR_ID.
          if [[ -n "$companion_id" ]]; then
            xcrun simctl bootstatus "$companion_id" -b
          fi
          xcrun simctl boot "$simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl install "$simulator_id" "$app_path"
          run_apple_command_logged apps/ios/build/LifecycleTestResults/OpenClawWatchOperationTests.log xcodebuild \
            "${xcodebuild_args[@]}" "${test_args[@]}" \
            -resultBundlePath apps/ios/build/LifecycleTestResults/OpenClawWatchOperationTests.xcresult \
            test-without-building

      - name: Upload iOS lifecycle simulator evidence
        if: ${{ always() && ((steps.ios_lifecycle_tests.outcome != '' && steps.ios_lifecycle_tests.outcome != 'skipped') || (steps.ios_voice_cleanup_tests.outcome != '' && steps.ios_voice_cleanup_tests.outcome != 'skipped') || (steps.ios_attachment_tests.outcome != '' && steps.ios_attachment_tests.outcome != 'skipped')) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-lifecycle-tests-${{ needs.preflight.outputs.checkout_revision }}
          path: |
            apps/ios/build/LifecycleTestResults/*.xcresult
            apps/ios/build/LifecycleTestResults/*.log
            apps/ios/build/LifecycleTestResults/Attachment-*
            apps/ios/build/LifecycleTestResults/attachments-*
          if-no-files-found: warn
          retention-days: 14

  ios-release-e2e:
    permissions:
      actions: read
      contents: read
    needs: [preflight]
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.release_gate && needs.preflight.outputs.validation_tier == 'full' && needs.preflight.outputs.release_scope == 'full' && needs.preflight.outputs.checkout_revision == github.sha && needs.preflight.outputs.compatibility_target != 'true' && needs.preflight.outputs.run_ios_build == 'true' }}
    uses: ./.github/workflows/ios-release-e2e.yml
    with:
      target_sha: *checkout_sha
      mode: stock

  ios-screenshot-shard:
    permissions:
      contents: read
    name: "ios-screenshots-${{ matrix.device_family }}"
    needs: [preflight]
    if: &ios_screenshot_capture_gate ${{ needs.preflight.outputs.validation_tier != 'main' && needs.preflight.outputs.release_scope == 'full' && needs.preflight.outputs.compatibility_target != 'true' && ((github.event_name == 'workflow_dispatch' && !inputs.release_gate) || needs.preflight.outputs.run_ios_screenshots == 'true') }}
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && startsWith(inputs.dispatch_id, 'full-release-validation-') && vars.OPENCLAW_RELEASE_RUNNER_GROUP || '') != '' && fromJSON(format('{{"group":{0},"labels":{1}}}', toJSON((github.event_name == 'workflow_dispatch' && startsWith(inputs.dispatch_id, 'full-release-validation-') && vars.OPENCLAW_RELEASE_RUNNER_GROUP || '')), toJSON('xcode-27-xlarge'))) || ('xcode-27-xlarge') }}
    timeout-minutes: 90
    env:
      BUNDLE_DEPLOYMENT: "true"
      BUNDLE_GEMFILE: ${{ github.workspace }}/apps/ios/Gemfile
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        device_family: [iphone, ipad-13]
    steps:
      - *platform_checkout_step

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4.10"
          bundler: "4.0.21"
          bundler-cache: false
          working-directory: apps/ios

      - name: Install locked Fastlane bundle
        working-directory: apps/ios
        run: |
          bundle _4.0.21_ install --jobs 4 --retry 3
          bundle _4.0.21_ check
          bundle _4.0.21_ exec fastlane --version

      - *select_xcode_step

      - name: Setup Node environment
        uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          cache-mode: *cache_mode
          install-bun: "false"
          node-version: ${{ env.IOS_SCREENSHOT_NODE_VERSION }}

      - name: Install iOS screenshot tooling
        run: |
          swift_tools_dir="$RUNNER_TEMP/openclaw-swift-tools"
          ./scripts/install-xcodegen.sh "$swift_tools_dir"
          ./scripts/install-swift-tools.sh "$swift_tools_dir"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"
          "$swift_tools_dir/xcodegen" --version
          "$swift_tools_dir/swiftformat" --version
          "$swift_tools_dir/swiftlint" version

      - *install_watch_rust_toolchain

      - name: Capture iOS device screenshot shard
        id: device_screenshots
        env:
          OPENCLAW_SNAPSHOT_DEVICE_FAMILY: ${{ matrix.device_family }}
          OPENCLAW_SNAPSHOT_SKIP_WATCH: ${{ matrix.device_family == 'iphone' && '1' || '0' }}
          OPENCLAW_SNAPSHOT_DIAGNOSTICS: "1"
        run: pnpm ios:screenshots

      - name: Package iOS screenshot shard evidence
        id: package_screenshot_evidence
        env:
          DEVICE_FAMILY: ${{ matrix.device_family }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          TARGET_SHA: *checkout_sha
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          fastlane_version="$(
            source scripts/lib/ios-fastlane.sh
            run_ios_fastlane --version 2>&1 | awk 'match($0, /^fastlane [0-9]+\.[0-9]+\.[0-9]+$/) { print substr($0, RSTART + 9, RLENGTH - 9); exit }'
          )"
          xcode_version="$(xcodebuild -version | paste -sd ' ' -)"
          test "$xcode_version" = "$IOS_SCREENSHOT_XCODE_VERSION"
          collect_args=(
            collect
            --family "$DEVICE_FAMILY"
            --screenshots apps/ios/fastlane/screenshots/en-US
            --xcresults apps/ios/build/SnapshotTestResults
            --output apps/ios/build/ScreenshotEvidenceShard
            --target-sha "$TARGET_SHA"
            --workflow-sha "$WORKFLOW_SHA"
            --run-id "$RUN_ID"
            --run-attempt "$RUN_ATTEMPT"
            --xcode-version "$xcode_version"
            --fastlane-version "$fastlane_version"
            --node-version "$(node --version)"
          )
          node .ci-harness/scripts/ios-screenshot-evidence.mjs "${collect_args[@]}"
          if [[ "$DEVICE_FAMILY" == "ipad-13" ]]; then
            collect_args[2]="watch"
            node .ci-harness/scripts/ios-screenshot-evidence.mjs "${collect_args[@]}"
          fi

      - name: Upload iOS screenshot shard evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-release-screenshot-shard-${{ matrix.device_family }}-${{ needs.preflight.outputs.checkout_revision }}
          path: apps/ios/build/ScreenshotEvidenceShard/
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed iOS screenshot attempt evidence
        if: ${{ always() && (steps.device_screenshots.outcome == 'failure' || steps.package_screenshot_evidence.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-release-screenshot-failure-${{ matrix.device_family }}-${{ needs.preflight.outputs.checkout_revision }}
          path: |
            apps/ios/fastlane/screenshots/en-US/*.png
            apps/ios/build/SnapshotTestResults/capture-attempts.json
            apps/ios/build/SnapshotTestResults/*.xcresult
            apps/ios/build/SnapshotLogs/*.log
            apps/ios/build/screenshot-diagnostics.json
          if-no-files-found: warn
          retention-days: 14

  ios-screenshot-evidence:
    permissions:
      contents: read
    name: "ios-screenshot-evidence"
    needs: [preflight, ios-screenshot-shard]
    if: *ios_screenshot_capture_gate
    runs-on: *hosted_linux_runner
    timeout-minutes: 10
    steps:
      - *linux_node_checkout_step

      - name: Setup screenshot evidence Node
        uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          cache-mode: *cache_mode
          install-bun: "false"
          install-deps: "false"
          node-version: ${{ env.IOS_SCREENSHOT_NODE_VERSION }}

      - name: Download iOS screenshot shard evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ios-release-screenshot-shard-*-${{ needs.preflight.outputs.checkout_revision }}
          path: apps/ios/build/ScreenshotEvidenceInputs
          merge-multiple: false

      - name: Reduce iOS screenshot evidence
        id: reduce_screenshot_evidence
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          TARGET_SHA: *checkout_sha
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          node .ci-harness/scripts/ios-screenshot-evidence.mjs reduce \
            --input apps/ios/build/ScreenshotEvidenceInputs \
            --output . \
            --target-sha "$TARGET_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --xcode-version "$IOS_SCREENSHOT_XCODE_VERSION" \
            --fastlane-version "$IOS_SCREENSHOT_FASTLANE_VERSION" \
            --node-version "$(node --version)"

      - name: Upload failed iOS screenshot reducer evidence
        if: ${{ always() && steps.reduce_screenshot_evidence.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-release-screenshot-reducer-failure-${{ needs.preflight.outputs.checkout_revision }}
          path: |
            apps/ios/build/ScreenshotEvidenceInputs/**/screenshots/*.png
            apps/ios/build/ScreenshotEvidenceInputs/**/xcresults/*.xcresult
            apps/ios/build/ScreenshotEvidenceInputs/**/manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload iOS release screenshot evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-release-screenshots-${{ needs.preflight.outputs.checkout_revision }}
          path: |
            apps/ios/fastlane/screenshots/en-US/*.png
            apps/ios/build/SnapshotTestResults/*.xcresult
            apps/ios/build/ScreenshotEvidence/manifest.json
          if-no-files-found: error
          retention-days: 14

  android:
    permissions:
      contents: read
    name: ${{ matrix.check_name || 'android' }}
    needs: [preflight]
    if: needs.preflight.outputs.run_android_job == 'true'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && startsWith(inputs.dispatch_id, 'full-release-validation-') && vars.OPENCLAW_RELEASE_RUNNER_GROUP || '') != '' && fromJSON(format('{{"group":{0},"labels":{1}}}', toJSON((github.event_name == 'workflow_dispatch' && startsWith(inputs.dispatch_id, 'full-release-validation-') && vars.OPENCLAW_RELEASE_RUNNER_GROUP || '')), toJSON((needs.preflight.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && needs.preflight.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND) == 'github' && 'ubuntu-24.04' || (contains(fromJSON('["hybrid","runson"]'), (needs.preflight.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && needs.preflight.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND)) && github.run_attempt > 1) && 'ubuntu-24.04' || ((github.event_name == 'workflow_dispatch' && ((needs.preflight.outputs.node_runner_backend != 'runson' && needs.preflight.outputs.ci_qualification != 'true') || github.run_attempt != 1)) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.run_attempt > 1)) && 'ubuntu-24.04' || (github.repository == 'openclaw/openclaw' && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-24.04')))) || ((needs.preflight.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && needs.preflight.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND) == 'github' && 'ubuntu-24.04' || (contains(fromJSON('["hybrid","runson"]'), (needs.preflight.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && needs.preflight.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND)) && github.run_attempt > 1) && 'ubuntu-24.04' || ((github.event_name == 'workflow_dispatch' && ((needs.preflight.outputs.node_runner_backend != 'runson' && needs.preflight.outputs.ci_qualification != 'true') || github.run_attempt != 1)) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.run_attempt > 1)) && 'ubuntu-24.04' || (github.repository == 'openclaw/openclaw' && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-24.04')) }}
    timeout-minutes: ${{ matrix.task == 'build-play' && ((needs.preflight.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && needs.preflight.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND) == 'github' || (contains(fromJSON('["hybrid","runson"]'), (needs.preflight.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && needs.preflight.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND)) && github.run_attempt > 1) || (github.event_name == 'workflow_dispatch' && needs.preflight.outputs.ci_shape != 'main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.run_attempt > 1) || github.repository != 'openclaw/openclaw') && 35 || 20 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ vars.OPENCLAW_CI_RUNNER_BACKEND != 'github' && github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' && github.repository == 'openclaw/openclaw' && github.run_attempt == 1 && 4 || 2 }}
      matrix: ${{ fromJson(needs.preflight.outputs.android_matrix) }}
    steps:
      - &android_checkout_step
        name: Checkout
        shell: bash
        env:
          CHECKOUT_KIND: android
          CHECKOUT_REPO: ${{ github.repository }}
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: *checkout_sha
        run: *owned_checkout_run

      - &android_toolchain_checkout_step
        name: Checkout CI Android toolchain action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-harness
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Setup Android toolchain
        id: android-toolchain
        uses: ./.ci-harness/.github/actions/setup-android-toolchain
        with:
          cache-mode: ${{ needs.preflight.outputs.cache_write_allowed == 'true' && 'read-write' || needs.preflight.outputs.cache_mode }}

      - name: Setup Node environment for native resources
        if: needs.preflight.outputs.use_compatible_android_ci != 'true'
        uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          cache-mode: *cache_mode
          install-bun: "false"
          install-deps: "false"

      - name: Install native asset dependencies
        if: needs.preflight.outputs.use_compatible_android_ci != 'true'
        env:
          CI: "true"
        run: *mermaid_renderer_install_run

      - name: Mount Gradle sticky disk
        if: &android_gradle_sticky_disk_gate vars.OPENCLAW_CI_RUNNER_BACKEND != 'github' && !(contains(fromJSON('["hybrid","runson"]'), vars.OPENCLAW_CI_RUNNER_BACKEND) && github.run_attempt > 1) && github.event_name != 'workflow_dispatch' && github.repository == 'openclaw/openclaw' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'openclaw/openclaw')
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          # One disk per matrix task keeps thin dependency sets off heavier lanes. Gradle owns invalidation.
          key: ${{ github.repository }}-gradle-v2-${{ matrix.task }}
          path: /var/tmp/openclaw-gradle
          # Only successful protected pushes publish. Explicit commit:true refreshes same-size changes.
          commit: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}

      - name: Point Gradle at the sticky disk
        if: *android_gradle_sticky_disk_gate
        shell: bash
        run: |
          set -euo pipefail
          sticky_root=/var/tmp/openclaw-gradle
          mkdir -p "$sticky_root/gradle-user-home"
          echo "GRADLE_USER_HOME=$sticky_root/gradle-user-home" >> "$GITHUB_ENV"

      - name: Restore Robolectric Maven cache
        id: robolectric-cache
        if: startsWith(matrix.task, 'test-') && needs.preflight.outputs.cache_mode != 'off'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/tmp/openclaw-robolectric-m2
          key: ${{ github.repository }}-robolectric-m2-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.task }}-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/**/gradle-wrapper.properties', 'apps/android/gradle/libs.versions.toml', 'apps/android/**/src/test*/**') }}
          restore-keys: |
            ${{ github.repository }}-robolectric-m2-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.task }}-

      - name: Configure Robolectric Maven cache
        if: startsWith(matrix.task, 'test-')
        shell: bash
        run: |
          set -euo pipefail
          maven_repo=/var/tmp/openclaw-robolectric-m2
          init_script="$RUNNER_TEMP/openclaw-robolectric-init.gradle"
          mkdir -p "$maven_repo"
          cat >"$init_script" <<'GROOVY'
          println "Gradle JVM: runtime=${System.getProperty('java.runtime.version')} vendor=${System.getProperty('java.vendor')} home=${System.getProperty('java.home')}"
          allprojects {
            tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
              systemProperty "maven.repo.local", System.getenv("OPENCLAW_ROBOLECTRIC_M2")
              // Record the executing launcher; cached results do not prove this JVM ran tests.
              doFirst {
                def metadata = javaLauncher.get().metadata
                logger.lifecycle("Test JVM ${path}: runtime=${metadata.javaRuntimeVersion} vendor=${metadata.vendor} home=${metadata.installationPath.asFile} forks=${maxParallelForks}")
              }
            }
          }
          GROOVY
          echo "OPENCLAW_ROBOLECTRIC_M2=$maven_repo" >> "$GITHUB_ENV"
          echo "OPENCLAW_ROBOLECTRIC_INIT=$init_script" >> "$GITHUB_ENV"

      - name: Run Android ${{ matrix.task }}
        working-directory: apps/android
        env:
          JAVA_HOME: ${{ steps.android-toolchain.outputs.gradle-java-home }}
          CI_RUNNER_BACKEND: ${{ ((needs.preflight.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && needs.preflight.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND) == 'github' || (contains(fromJSON('["hybrid","runson"]'), (needs.preflight.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && needs.preflight.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND)) && github.run_attempt > 1) || (github.event_name == 'workflow_dispatch' && needs.preflight.outputs.ci_shape != 'main') || github.repository != 'openclaw/openclaw' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != 'openclaw/openclaw')) && 'github' || 'blacksmith' }}
          CI_MAIN_QUALIFICATION: ${{ needs.preflight.outputs.ci_shape == 'main' && 'true' || 'false' }}
          TASK: ${{ matrix.task }}
          RUN_LINT: ${{ matrix.lint && 'true' || 'false' }}
          APP_LINT: ${{ matrix.app_lint || '' }}
          BUILD_BENCHMARK: ${{ matrix.build_benchmark && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          android_build_metadata=()
          if [ "$RUN_LINT" = "true" ] || [ -n "$APP_LINT" ]; then
            # Repeated native invocations in one row must not invalidate BuildConfig by time alone.
            android_build_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            android_build_metadata=("-PopenclawBuildTimestamp=$android_build_timestamp")
          fi
          case "$TASK" in
            test-play)
              ./gradlew "${android_build_metadata[@]}" --no-daemon --build-cache --init-script "$OPENCLAW_ROBOLECTRIC_INIT" \
                :app:testPlayDebugUnitTest \
                :wear-shared:testDebugUnitTest
              ;;
            test-play-compat)
              # Frozen targets predate the Wear shared project. Keep their app-owned
              # Play unit tests without importing current Android modules.
              ./gradlew --no-daemon --build-cache --init-script "$OPENCLAW_ROBOLECTRIC_INIT" \
                :app:testPlayDebugUnitTest
              ;;
            test-third-party)
              ./gradlew "${android_build_metadata[@]}" --no-daemon --build-cache --init-script "$OPENCLAW_ROBOLECTRIC_INIT" \
                :app:testThirdPartyDebugUnitTest
              ;;
            test-wear)
              ./gradlew "${android_build_metadata[@]}" --no-daemon --build-cache --init-script "$OPENCLAW_ROBOLECTRIC_INIT" \
                :wear:testDebugUnitTest
              if [ "$RUN_LINT" = "true" ]; then
                ./gradlew "${android_build_metadata[@]}" --no-daemon --build-cache :wear:lintDebug
              fi
              ;;
            build-play)
              if [ "$CI_RUNNER_BACKEND" = "github" ] || { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$CI_MAIN_QUALIFICATION" != "true" ]; }; then
                # GitHub-hosted runners have less memory headroom. Separate Gradle
                # processes release each variant's build state before the next starts.
                ./gradlew --no-daemon --build-cache \
                  :app:assemblePlayDebug \
                  :app:lintPlayDebug
                ./gradlew --no-daemon --build-cache \
                  :app:assembleThirdPartyDebug \
                  :app:lintThirdPartyDebug
                ./gradlew --no-daemon --build-cache \
                  :benchmark:assembleDebug \
                  :wear-shared:assembleDebug \
                  :wear-shared:lintDebug
              else
                ./gradlew --no-daemon --build-cache \
                  :app:assemblePlayDebug \
                  :app:assembleThirdPartyDebug \
                  :app:lintPlayDebug \
                  :app:lintThirdPartyDebug \
                  :benchmark:assembleDebug \
                  :wear-shared:assembleDebug \
                  :wear-shared:lintDebug
              fi
              ;;
            build-wear)
              ./gradlew --no-daemon --build-cache \
                :wear:assembleDebug \
                :wear:lintDebug
              ;;
            build-play-compat)
              # Frozen targets keep their target-owned Android build contract. New lint rules
              # must not retroactively reject a previously validated release branch.
              ./gradlew --no-daemon --build-cache :app:assemblePlayDebug
              ;;
            ktlint)
              # Mirrors `pnpm android:lint` to keep formatting drift out of main.
              ./gradlew "${android_build_metadata[@]}" --no-daemon --build-cache \
                :app:ktlintCheck \
                :benchmark:ktlintCheck \
                :wear:ktlintCheck \
                :wear-shared:ktlintCheck
              if [ "$BUILD_BENCHMARK" = "true" ]; then
                ./gradlew "${android_build_metadata[@]}" --no-daemon --build-cache :benchmark:assembleDebug
              fi
              ;;
            *)
              echo "Unsupported Android task: $TASK" >&2
              exit 1
              ;;
          esac

          # The lighter Wear and Kotlin-lint rows keep app lint off the phone-test path.
          case "$APP_LINT" in
            third-party)
              ./gradlew "${android_build_metadata[@]}" --no-daemon --build-cache :app:lintThirdPartyDebug
              ;;
            play)
              ./gradlew "${android_build_metadata[@]}" --no-daemon --build-cache :app:lintPlayDebug :wear-shared:lintDebug
              ;;
            "") ;;
            *)
              echo "Unsupported Android app lint flavor: $APP_LINT" >&2
              exit 1
              ;;
          esac

      - name: Upload Android test reports
        if: ${{ !cancelled() && startsWith(matrix.task, 'test-') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-test-reports-${{ matrix.task }}-${{ needs.preflight.outputs.checkout_revision }}-${{ github.run_attempt }}
          path: |
            apps/android/app/build/test-results/test*UnitTest/TEST-*.xml
            apps/android/wear/build/test-results/test*UnitTest/TEST-*.xml
            apps/android/wear-shared/build/test-results/test*UnitTest/TEST-*.xml
            apps/android/**/hs_err_pid*.log
            apps/android/**/replay_pid*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Save Robolectric Maven cache
        if: success() && startsWith(matrix.task, 'test-') && needs.preflight.outputs.cache_write_allowed == 'true' && steps.robolectric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/tmp/openclaw-robolectric-m2
          key: ${{ steps.robolectric-cache.outputs.cache-primary-key }}

  android-access-native:
    permissions:
      contents: read
    needs: [preflight]
    if: needs.preflight.outputs.run_android_access_native == 'true'
    runs-on: *hosted_linux_runner
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - page-size: 4096
            image: google_apis
          - page-size: 16384
            image: google_apis_ps16k
    steps:
      - *android_checkout_step

      - *android_toolchain_checkout_step

      - name: Setup Android toolchain
        uses: ./.ci-harness/.github/actions/setup-android-toolchain
        with:
          cache-mode: *cache_mode

      - name: Setup Node environment for native resources
        uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          cache-mode: *cache_mode
          install-bun: "false"

      - name: Run packaged Access crypto on Android
        shell: bash
        env:
          EXPECTED_PAGE_SIZE: ${{ matrix.page-size }}
          SYSTEM_IMAGE: system-images;android-36;${{ matrix.image }};x86_64
        run: |
          set -euo pipefail
          test "$RUNNER_OS/$RUNNER_ARCH" = Linux/X64
          test -c /dev/kvm
          /usr/bin/sudo /usr/bin/setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install emulator "$SYSTEM_IMAGE"
          acceleration="$(/usr/bin/timeout --signal=TERM --kill-after=2s 15s emulator -accel-check 2>&1)"
          printf '%s\n' "$acceleration"
          grep -Eiq '\bKVM\b.*\b(available|usable)\b' <<<"$acceleration"
          printf 'no\n' | avdmanager create avd --name openclaw-access --package "$SYSTEM_IMAGE" --device pixel_6
          emulator -avd openclaw-access -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >"$RUNNER_TEMP/access-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'adb -s emulator-5554 emu kill >/dev/null 2>&1 || true; wait "$emulator_pid" || true' EXIT
          /usr/bin/timeout --signal=TERM --kill-after=2s 180s bash -c '
            adb -s emulator-5554 wait-for-device
            until [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done
          '
          test "$(adb -s emulator-5554 shell getconf PAGE_SIZE | tr -d '\r')" = "$EXPECTED_PAGE_SIZE"
          if [[ "$EXPECTED_PAGE_SIZE" == 16384 ]]; then
            # ps16k simulates 16 KiB pages on x86_64; compat mode must not hide loader failures.
            adb -s emulator-5554 shell setprop bionic.linker.16kb.app_compat.enabled false
            adb -s emulator-5554 shell setprop pm.16kb.app_compat.disabled true
            test "$(adb -s emulator-5554 shell getprop bionic.linker.16kb.app_compat.enabled | tr -d '\r')" = false
            test "$(adb -s emulator-5554 shell getprop pm.16kb.app_compat.disabled | tr -d '\r')" = true
          fi
          node --import ./scripts/tsx.mjs scripts/run-android-gradle.mts \
            :app:connectedPlayDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.expectedPageSize="$EXPECTED_PAGE_SIZE" \
            -Pandroid.testInstrumentationRunnerArguments.class=ai.openclaw.app.gateway.CloudflareAccessNativeTest \
            -PopenclawBuildTimestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          apk="$(python3 - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET
          import zipfile
          reports = Path('apps/android/app/build/outputs/androidTest-results/connected').rglob('*.xml')
          cases = [case for report in reports for case in ET.parse(report).getroot().iter('testcase')
                   if case.get('classname') == 'ai.openclaw.app.gateway.CloudflareAccessNativeTest']
          assert len(cases) == 1, 'The packaged native test must execute exactly once'
          assert all(case.find(tag) is None for case in cases for tag in ('failure', 'error', 'skipped')), 'The packaged native test failed or skipped'
          directory = Path('apps/android/app/build/outputs/apk/play/debug')
          metadata = json.loads((directory / 'output-metadata.json').read_text())
          assert metadata['variantName'] == 'playDebug' and metadata['artifactType']['type'] == 'APK'
          assert len(metadata['elements']) == 1, 'Expected one universal playDebug APK'
          element = metadata['elements'][0]
          filename = element['outputFile']
          assert not element['filters'] and Path(filename).name == filename and filename.endswith('.apk')
          selected = directory / filename
          with zipfile.ZipFile(selected) as archive:
              libraries = {name for name in archive.namelist() if name.endswith('/libsodium.so')}
          assert libraries == {f'lib/{abi}/libsodium.so' for abi in ('armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64')}
          print(selected)
          PY
          )"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"

      - name: Upload Access native test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-access-native-${{ matrix.page-size }}-${{ needs.preflight.outputs.checkout_revision }}-${{ github.run_attempt }}
          path: |
            apps/android/app/build/outputs/androidTest-results/connected/**
            apps/android/app/build/reports/androidTests/connected/**
          if-no-files-found: error
          retention-days: 14

  published-driver-update:
