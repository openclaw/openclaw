          simulator_id="$(select_ios_test_simulator)"
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Build iOS app
        id: ios-app-build
        if:
          ${{ (!cancelled() && steps.ios-swift-tools.outcome == 'success' && (steps.ios-configure.outcome == 'success' ||
          'false' == 'true') && (steps.ios-simulator.outcome != 'failure') && (steps.watch-rust-toolchain.outcome == 'success'
          || steps.watch-rust-toolchain.outcome == 'skipped') && ('tests' == 'smoke' || 'tests' == 'tests')) && steps.frv-environment.outcome
          == 'success' }}
        run: |
          set -euo pipefail
          if [[ ( "$IOS_CI_PHASE" == "smoke" || "$IOS_MAIN_TIER" == "true" ) && "$HISTORICAL_TARGET" != "true" ]]; then
