          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload sanitized upgrade survivor proof
        if: always() && contains(format(' {0} ', needs.preflight.outputs.docker_seed_lanes), ' published-upgrade-survivor ')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-seed-upgrade-survivor-proof
          path: |
            .artifacts/docker-tests/????????T??????Z/summary.json
            .artifacts/docker-tests/????????T??????Z/failures.json
            .artifacts/docker-tests/upgrade-survivor-*/summary.json
            .artifacts/docker-tests/upgrade-survivor-*/failure.json
          include-hidden-files: true
          if-no-files-found: warn

      - *runner_memory_peak_step

  pr-fail-fast:
    permissions:
      contents: read
      actions: write
      pull-requests: read
    needs: [preflight]
    if: ${{ always() && github.event_name == 'pull_request' && github.run_attempt == 1 && github.repository == 'openclaw/openclaw' && !github.event.pull_request.draft && needs.preflight.result == 'success' && needs.preflight.outputs.run_checks_node_core_nondist == 'true' && needs.preflight.outputs.disable_fail_fast != 'true' }}
