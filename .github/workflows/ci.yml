          result_bundle="apps/ios/build/LifecycleTestResults/OpenClawLifecycleTests.xcresult"
          mkdir -p "apps/ios/build/LifecycleTestResults"
          test_args=(
            -only-testing:OpenClawTests/CloudflareAccessClientTests
            -only-testing:OpenClawTests/CloudflareAccessBrowserPresenterTests
            -only-testing:OpenClawTests/CloudflareAccessTransferTests
            -only-testing:OpenClawTests/CloudflareAccessSessionStoreTests
