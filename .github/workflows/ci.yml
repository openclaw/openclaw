            run_startup_corpus --maxWorkers="$startup_workers" "${startup_files[@]}"
            exit 0
          elif [[ -f test/vitest/vitest.startup-corpus-paths.mjs ]]; then
            # Runner labels can advertise more CPUs than this process can use.
            startup_workers="$(node -p 'Math.min(4, require("node:os").availableParallelism())')"
            run_startup_corpus --maxWorkers="$startup_workers" src/config/config-startup-corpus.test.ts \
