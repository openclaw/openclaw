          import time
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"started={time.monotonic()}", file=output)
          PYTHON

      - *platform_checkout_step

      - &select_xcode_step
        name: Select Xcode
        run: |
          set -euo pipefail
          source .ci-harness/scripts/lib/swift-toolchain.sh
          select_xcode_toolchain

      - name: Setup Node environment for Apple assets
        if: hashFiles('scripts/prepare-apple-mermaid.mjs') != ''
        uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: *cache_mode
          install-bun: "false"
          install-deps: "false"

      - name: Install native asset dependencies
        if: hashFiles('scripts/prepare-apple-mermaid.mjs') != ''
        env:
          CI: "true"
        run: &mermaid_renderer_install_run >-
          pnpm install --frozen-lockfile --prefer-offline --optional
          --filter '@openclaw/mermaid-renderer...'
          --filter '@openclaw/gateway-protocol...'
          --config.ignore-scripts=false
          --config.engine-strict=false
          --config.enable-pre-post-scripts=true
          --config.side-effects-cache=true

      - name: Setup Node.js for native test tooling
        if: hashFiles('scripts/prepare-apple-mermaid.mjs') == ''
        env:
          REQUESTED_NODE_VERSION: ${{ env.NODE_VERSION }}
        run: *ensure_node_run

      - &apple_mermaid_cache_key
        name: Identify Apple Mermaid inputs
        if: hashFiles('scripts/prepare-apple-mermaid.mjs') != '' && env.HISTORICAL_TARGET != 'true' && needs.preflight.outputs.frozen_target != 'true'
        id: apple-mermaid-inputs
        run: echo "key=$(node scripts/prepare-apple-mermaid.mjs --cache-key)" >> "$GITHUB_OUTPUT"

