name: OIDC Credential Watcher Preparation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_VITEST_MAX_WORKERS: "1"
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
      - name: Format the credential owner and its regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oidc-watch-preparation"
          node scripts/run-format.mts --write src/gateway/trusted-proxy-delegation.ts src/gateway/trusted-proxy-delegation.test.ts
          node scripts/run-format.mts --check src/gateway/trusted-proxy-delegation.ts src/gateway/trusted-proxy-delegation.test.ts
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const paths=['src/gateway/server.auth.delegation.test.ts','src/gateway/trusted-proxy-delegation.test.ts','src/state/user-profile-delegation.test.ts'];
          const count=paths.reduce((n,p)=>n+(readFileSync(p,'utf8').match(/\n/g)||[]).length,0);
          const allocation='config/test-lines-allocations/oidc-native-user-profiles.txt';
          const text=readFileSync(allocation,'utf8').replace(/\n[0-9]+\n$/,`\n${count}\n`);
          writeFileSync(allocation,text);
          NODE
          git diff --check
          git diff --binary -- src/gateway/trusted-proxy-delegation.ts src/gateway/trusted-proxy-delegation.test.ts config/test-lines-allocations/oidc-native-user-profiles.txt > "$RUNNER_TEMP/oidc-watch-preparation/generated.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/oidc-watch-preparation/source.txt"
      - name: Run focused native proof
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm test src/state/user-profile-delegation.test.ts src/gateway/trusted-proxy-delegation.test.ts src/gateway/server.auth.delegation.test.ts --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/oidc-watch-preparation/green.log"
      - name: Retain only the formatting patch and proof log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: oidc-watch-preparation-${{ github.run_id }}
          retention-days: 3
          path: |
            ${{ runner.temp }}/oidc-watch-preparation/generated.patch
            ${{ runner.temp }}/oidc-watch-preparation/source.txt
            ${{ runner.temp }}/oidc-watch-preparation/green.log
