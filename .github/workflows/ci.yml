name: OIDC Delegation Config Preparation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_VITEST_MAX_WORKERS: "1"
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
      - name: Format and generate the reduced config schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oidc-config-preparation"
          git rev-parse HEAD > "$RUNNER_TEMP/oidc-config-preparation/source.txt"
          files=(src/config/schema.gateway-labels.ts src/config/schema.help.core.ts src/config/zod-schema.gateway.ts src/gateway/auth.ts src/gateway/server.auth.delegation.test.ts src/gateway/trusted-proxy-delegation.test.ts src/gateway/trusted-proxy-delegation.ts src/state/user-profile-delegation.ts src/state/user-profile-delegation.worker.ts docs/gateway/trusted-proxy-auth.md)
          node scripts/run-format.mts --write "${files[@]}"
          node scripts/run-format.mts --check "${files[@]}"
          node --import ./scripts/tsx.mjs scripts/generate-config-doc-baseline.ts --write 2>&1 | tee "$RUNNER_TEMP/oidc-config-preparation/schema.log"
          node --import ./scripts/tsx.mjs scripts/generate-config-doc-baseline.ts --check 2>&1 | tee -a "$RUNNER_TEMP/oidc-config-preparation/schema.log"
          node --import ./scripts/tsx.mjs scripts/generate-base-config-schema.ts --check 2>&1 | tee -a "$RUNNER_TEMP/oidc-config-preparation/schema.log"
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const paths=['src/gateway/server.auth.delegation.test.ts','src/gateway/trusted-proxy-delegation.test.ts','src/state/user-profile-delegation.test.ts'];
          const count=paths.reduce((n,p)=>n+(readFileSync(p,'utf8').match(/\n/g)||[]).length,0);
          const allocation='config/test-lines-allocations/oidc-native-user-profiles.txt';
          writeFileSync(allocation,readFileSync(allocation,'utf8').replace(/\n[0-9]+\n$/,`\n${count}\n`));
          NODE
          git diff --check
          git diff --binary -- "${files[@]}" config/test-lines-allocations/oidc-native-user-profiles.txt docs/.generated/config-baseline.counts.json docs/.generated/config-baseline.sha256 > "$RUNNER_TEMP/oidc-config-preparation/generated.patch"
          sha256sum "${files[@]}" config/test-lines-allocations/oidc-native-user-profiles.txt docs/.generated/config-baseline.counts.json docs/.generated/config-baseline.sha256 > "$RUNNER_TEMP/oidc-config-preparation/final-sha256.txt"
      - name: Run focused native proof and config contract assertions
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm test src/state/user-profile-delegation.test.ts src/gateway/trusted-proxy-delegation.test.ts src/gateway/server.auth.delegation.test.ts --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/oidc-config-preparation/green.log"
      - name: Retain only the generated patch and proof logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: oidc-config-preparation-${{ github.run_id }}
          retention-days: 3
          path: |
            ${{ runner.temp }}/oidc-config-preparation/generated.patch
            ${{ runner.temp }}/oidc-config-preparation/source.txt
            ${{ runner.temp }}/oidc-config-preparation/final-sha256.txt
            ${{ runner.temp }}/oidc-config-preparation/schema.log
            ${{ runner.temp }}/oidc-config-preparation/green.log
