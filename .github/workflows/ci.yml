      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        path: .frv-controller
    - name: Preserve measurement helper
      run: |-
        mkdir -p "$RUNNER_TEMP/frv-control"
        cp .frv-controller/.github/frv-mac-benchmark/receipt.py "$RUNNER_TEMP/frv-control/receipt.py"
        cp .frv-controller/.github/workflows/ci.yml "$RUNNER_TEMP/frv-control/controller.yml"
        echo "FRV_CONTROL=$RUNNER_TEMP/frv-control" >> "$GITHUB_ENV"
    - name: Start baseline producer clock
      run: |-
        echo "FRV_ARM_START=$(date +%s)" >> "$GITHUB_ENV"
        echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TEMP/frv-baseline-pnpm-store" >> "$GITHUB_ENV"
    - name: Checkout exact baseline source
      shell: bash
      env:
        CHECKOUT_REPO: ${{ github.repository }}
        CHECKOUT_TOKEN: ${{ github.token }}
        CHECKOUT_SHA: e0dd0206412af448b324387435dd8fed6575fd7b
        WORKFLOW_SHA: e0dd0206412af448b324387435dd8fed6575fd7b
