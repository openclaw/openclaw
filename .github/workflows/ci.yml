name: Native Llama screenshot artifacts
run-name: Native Llama ${{ inputs.platform }} - ${{ inputs.dispatch_id }}
'on':
  workflow_dispatch:
    inputs:
      platform:
        description: Native screenshot producer to run
        type: choice
        options: [mac, windows-w4, service, windows-ollama-fixtures, mac-copy, mac-branded-copy, windows-provider-artwork, mac-reference-diag, stock-shared]
        default: mac
        required: true
      qualification:
        description: Exact parent-reviewed stock-owner-class acknowledgement
        type: string
        required: false
        default: ''
      dispatch_id:
        description: Unique capture correlation, not a release request
        type: string
        required: true
      retained_capsule_b64:
        description: One sealed DERIVED ROI data capsule, not source code or original proof
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: native-llama-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  # Job fragment for the parent's dedicated manual-only temporary proof workflow.
  # Copy the sealed small payload to .github/native-llama/mac/ in that branch.
  # Parent owns on: workflow_dispatch, branch publication, dispatch, review and inspection.
  mac-native-llama:
    if: ${{ inputs.platform == 'mac' }}
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      LLAMA_GITHUB_HOSTED_ACK: task-owned-secretless-github-hosted
    steps:
      - name: Checkout manual proof payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/native-llama/mac
      - name: Checkout historical native Before
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 0b584645a34242f72b0566f8cf3acebd9ac63a73
          path: .source-before
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout reviewed native After
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: adcfa7ca4a204860ff67b5e1db4f45bd7d5c8a17
          path: .source-after
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout Gateway fixture producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 7830780292c95ac7f2e96ecee19cdfb1639393bb
          path: .source-core
          persist-credentials: false
          fetch-depth: 1
      - name: Install source CI pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Install source packageManager pinned pnpm
        uses: ./.source-before/.github/actions/setup-pnpm-store-cache
        with:
          node-version: 24.22.1
          package-manager-file: .source-before/package.json
          lockfile-path: .source-before/pnpm-lock.yaml
          cache-mode: off
      - name: Capture real native onboarding and prepare sheets
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          /bin/bash .github/native-llama/mac/run-mac-ci.sh \
            "$GITHUB_WORKSPACE/.source-before" \
            "$GITHUB_WORKSPACE/.source-after" \
            "$GITHUB_WORKSPACE/.source-core" \
            "$GITHUB_WORKSPACE/.artifacts/native-llama/mac"
      - name: Preserve Mac native proof and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-llama-mac-exact-identity
          path: .artifacts/native-llama/mac/
          if-no-files-found: error
          retention-days: 7
  # Parent-owned dedicated workflow: workflow_dispatch only, permissions contents: read,
  # no secrets/environment/release/deploy jobs. Copy harness/* to harness/windows/.
  # This is the jobs: entry; the parent owns the harness checkout/ref and dispatch.
  windows-native-w4:
    if: ${{ inputs.platform == 'windows-w4' }}
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Keep pinned source bytes unchanged on checkout
        run: git config --global core.autocrlf false
      - name: Check out this reviewed proof harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, W1 exact
        with:
          path: proof-harness
          persist-credentials: false
      - name: Check out W4 baseline (sealed candidate patch is applied by driver)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw-windows-node
          ref: d38ebb418c3aba6b24a4d6470def72b2bba4c4a8
          path: source-after
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the SDK proven by W1
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6, W1 exact
        with:
          dotnet-version: 10.0.403
      - name: Native W4 changed-state proof plus full build and Shared/Tray closeout
        run: ./proof-harness/harness/windows-w4/Invoke-NativeW4Proof.ps1
      - name: Retain native proof and exact failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, W1 exact
        with:
          name: native-w4-windows
          path: .artifacts/native-w4/windows/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  # One-job fragment for parent assembly at .github/workflows/ci.yml (workflow 209874334).
  # Do not retain ordinary CI fan-out in the qualification-only dispatch.
  service-reachability:
    name: Qualify accepted local-service RPC candidate
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'service'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      QUALIFICATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Checkout exact accepted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7830780292c95ac7f2e96ecee19cdfb1639393bb
          persist-credentials: false
      - name: Checkout qualification packet from executing workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-packet
          sparse-checkout: .github/qualification/service-reachability
          persist-credentials: false
      - name: Prepare source-owned pinned Node and pnpm (no dependencies yet)
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.22.1"
          install-bun: "false"
          install-deps: "false"
          cache-mode: "off"
      - name: Verify seals and apply exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cd .ci-packet/.github/qualification/service-reachability
          echo '5b33449920861d75d788d2f46b1113626af64a07a2d9a2f14d660f493211f3e2  manifest.json' | sha256sum --check --strict
          echo 'b54039c0703ae1c2570fecd7cc34bc25719e8bd3964659cbb909fddabaf72d23  driver.mjs' | sha256sum --check --strict
          cd "$GITHUB_WORKSPACE"
          node .ci-packet/.github/qualification/service-reachability/driver.mjs apply
      - name: Prepare gateway runtime through existing owner
        run: node .ci-packet/.github/qualification/service-reachability/driver.mjs bootstrap
      - name: Run unchanged registered RPC fixture
        run: node .ci-packet/.github/qualification/service-reachability/driver.mjs test
      - name: Finalize failure-or-success evidence
        if: always()
        run: node .ci-packet/.github/qualification/service-reachability/driver.mjs finalize
      - name: Archive exact proof records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-reachability-${{ github.run_id }}-${{ github.run_attempt }}
          path: .service-reachability-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  windows-ollama-fixtures:
    if: inputs.platform == 'windows-ollama-fixtures' && github.ref == 'refs/heads/roboclaw/local-ai-native-followups-20261102'
    runs-on: windows-2025
    timeout-minutes: 65
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Keep canonical source bytes
        run: git config --global core.autocrlf false
      - name: Check out reviewed packet from this immutable workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, qualified route
        with:
          path: proof-harness
          persist-credentials: false
      - name: Check out Before W3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw-windows-node
          ref: d38ebb418c3aba6b24a4d6470def72b2bba4c4a8
          path: source-before
          fetch-depth: 0
          persist-credentials: false
      - name: Check out After W3 (22 patch postimages, not HEAD alone)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw-windows-node
          ref: d38ebb418c3aba6b24a4d6470def72b2bba4c4a8
          path: source-after
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact qualified SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.403
      - name: Admit frozen source and identical comparison overlay
        id: prepare
        run: |
          ./proof-harness/harness/windows-ollama/Prepare-Source.ps1 -BeforeSource "$env:GITHUB_WORKSPACE/source-before" -AfterSource "$env:GITHUB_WORKSPACE/source-after" -Artifacts "$env:GITHUB_WORKSPACE/.artifacts/windows-ollama"
      - name: Establish current interactive owner and qualified runtime
        id: runtime
        run: |
          ./proof-harness/harness/windows-ollama/Initialize-NativeRuntime.ps1 -BeforeSource "$env:GITHUB_WORKSPACE/source-before" -AfterSource "$env:GITHUB_WORKSPACE/source-after" -Artifacts "$env:GITHUB_WORKSPACE/.artifacts/windows-ollama"
      - name: Verify immutable public catalog data (not acquisition proof)
        if: '!cancelled() && steps.prepare.outcome == ''success'' && steps.runtime.outcome == ''success'''
        run: ./proof-harness/harness/windows-ollama/Test-CatalogManifest.ps1 -Artifacts "$env:GITHUB_WORKSPACE/.artifacts/windows-ollama"
      - name: Observe actual WinGet contract (no repair or output shim)
        id: winget
        if: '!cancelled() && steps.prepare.outcome == ''success'' && steps.runtime.outcome == ''success'''
        run: ./proof-harness/harness/windows-ollama/Test-WinGetContract.ps1 -Artifacts "$env:GITHUB_WORKSPACE/.artifacts/windows-ollama"
      - name: Scoped failed-owner repair, retained proof and strict private UI
        if: '!cancelled() && steps.prepare.outcome == ''success'' && steps.runtime.outcome == ''success'''
        run: |
          ./proof-harness/harness/windows-ollama/Invoke-RequiredGates.ps1 -BeforeSource "$env:GITHUB_WORKSPACE/source-before" -AfterSource "$env:GITHUB_WORKSPACE/source-after" -Artifacts "$env:GITHUB_WORKSPACE/.artifacts/windows-ollama"
      - name: Record fixture-only qualification, never feature completion
        if: always()
        run: ./proof-harness/harness/windows-ollama/Write-FinalReceipt.ps1 -Artifacts "$env:GITHUB_WORKSPACE/.artifacts/windows-ollama"
      - name: Retain exact receipts and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-ollama-fixture-repair-v2
          path: .artifacts/windows-ollama/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  mac-native-plain-copy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/roboclaw/local-ai-native-followups-20261102' && inputs.platform == 'mac-copy'
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      LLAMA_GITHUB_HOSTED_ACK: task-owned-secretless-github-hosted
    steps:
      - name: Checkout reviewed manual proof payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/native-llama/mac-copy
      - name: Admit sealed payload
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          cd .github/native-llama/mac-copy
          echo '4da5949716e3af777ac22749e2debe85c1f5f71150863c11d3509c493bd4767b  INPUT-SHA256SUMS' | /usr/bin/shasum -a 256 -c -
          /usr/bin/shasum -a 256 -c INPUT-SHA256SUMS
      - name: Checkout ADC Before
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: adcfa7ca4a204860ff67b5e1db4f45bd7d5c8a17
          path: .source-before
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout reviewed exact plain-copy After
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 3a1836ac152b88245b8019dd080b5e6b2e5b3c39
          path: .source-after
          persist-credentials: false
          fetch-depth: 1
      - name: Install source CI pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Install source packageManager pinned pnpm
        uses: ./.source-before/.github/actions/setup-pnpm-store-cache
        with:
          node-version: 24.22.1
          package-manager-file: .source-before/package.json
          lockfile-path: .source-before/pnpm-lock.yaml
          cache-mode: off
      - name: Execute only new mounted case and one native page per stage
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          /bin/bash .github/native-llama/mac-copy/run-mac-ci.sh \
            "$GITHUB_WORKSPACE/.source-before" \
            "$GITHUB_WORKSPACE/.source-after" \
            "$GITHUB_WORKSPACE/.artifacts/native-llama/mac-copy"
      - name: Preserve completed or honestly failed proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-mac-plain-copy
          path: .artifacts/native-llama/mac-copy/
          if-no-files-found: error
          retention-days: 7

  stock-ownerclass:
    if: inputs.platform == 'stock-shared' && github.ref == 'refs/heads/roboclaw/local-ai-native-followups-20261102' && github.event.inputs.qualification == 'stock-d38-ownerclass-once' && github.run_attempt == 1
    runs-on: windows-2025
    env:
      GitVersion_NoNormalizeEnabled: 'true'
      GitVersion_NoFetchEnabled: 'true'
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out reviewed harness only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          path: proof-harness
          persist-credentials: false
      - name: Check out byte-exact stock d38 without any W4 overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: openclaw/openclaw-windows-node
          ref: d38ebb418c3aba6b24a4d6470def72b2bba4c4a8
          path: source-stock
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact original SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.403
      - name: Qualify the 98 original stock owner-class cases once
        timeout-minutes: 15 # Existing core-tests test-step budget, not a new per-test timer.
        run: ./proof-harness/harness/windows-stock-ownerclass/Invoke-StockOwnerClass.ps1
      - name: Preserve reports even for a noncomparable order or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-stock-ownerclass-d38
          path: .artifacts/stock-ownerclass/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Parent review/merge only; no workflow has been edited.
  # Add mac-branded-copy to the manual platform choice list before dispatch.
  mac-native-branded-copy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/roboclaw/local-ai-native-followups-20261102' && inputs.platform == 'mac-branded-copy'
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      LLAMA_GITHUB_HOSTED_ACK: task-owned-secretless-github-hosted
    steps:
      - name: Checkout reviewed manual proof payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/native-llama/mac-branded-copy
      - name: Admit sealed payload
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          cd .github/native-llama/mac-branded-copy
          echo '7c32a4a8bcf066e3bd32b03de1313a73cf1b7fa1a9afe975673cc69e1b1f4fb7  INPUT-SHA256SUMS' | /usr/bin/shasum -a 256 -c -
          /usr/bin/shasum -a 256 -c INPUT-SHA256SUMS
      - name: Checkout ADC Before
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: adcfa7ca4a204860ff67b5e1db4f45bd7d5c8a17
          path: .source-before
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout reviewed exact plain-copy After
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 3a1836ac152b88245b8019dd080b5e6b2e5b3c39
          path: .source-after
          persist-credentials: false
          fetch-depth: 1
      - name: Install source CI pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Install source packageManager pinned pnpm
        uses: ./.source-before/.github/actions/setup-pnpm-store-cache
        with:
          node-version: 24.22.1
          package-manager-file: .source-before/package.json
          lockfile-path: .source-before/pnpm-lock.yaml
          cache-mode: off
      - name: Capture branded page only; reuse qualified mounted regression
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          /bin/bash .github/native-llama/mac-branded-copy/run-mac-ci.sh \
            "$GITHUB_WORKSPACE/.source-before" \
            "$GITHUB_WORKSPACE/.source-after" \
            "$GITHUB_WORKSPACE/.artifacts/native-llama/mac-branded-copy"
      - name: Preserve completed or honestly failed proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-mac-branded-copy
          path: .artifacts/native-llama/mac-branded-copy/
          if-no-files-found: error
          retention-days: 7

  # Merge this job into the existing parent-owned manual proof workflow only.
  # Retain all existing jobs/inputs. No workflow publication or dispatch is performed here.
  windows-provider-artwork:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/roboclaw/local-ai-native-followups-20261102' &&
      inputs.platform == 'windows-provider-artwork' &&
      inputs.qualification == 'native-icons-w5-native-dialog-name-v1'
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      # Process-scoped canonical checkout bytes; never change operator/global Git config.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Check out this immutable reviewed manual proof payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: proof-harness
          persist-credentials: false
          set-safe-directory: false
      - name: First preflight - AST, eight stage cases and actual native Git wrapper
        run: |
          try {
            ./proof-harness/harness/windows-provider-artwork/Test-PacketSyntaxAndStage.ps1 -Receipt "$env:GITHUB_WORKSPACE/packet-preflight.json"
          } catch {
            ($_ | Out-String) | Set-Content "$env:GITHUB_WORKSPACE/packet-preflight-failure.txt"
            throw
          }
      - name: Check out exact W4 Before production source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw-windows-node
          ref: c550174d517b5e8830726cd5c32d4e132c144659
          path: source-before
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - name: Check out separate exact W4 source for the sealed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw-windows-node
          ref: c550174d517b5e8830726cd5c32d4e132c144659
          path: source-after
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - name: Set up exact qualified SDK without changing source global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.403
      - name: Qualified runtime, current After build first, then separate owned parent/popup originals
        run: |
          ./proof-harness/harness/windows-provider-artwork/Invoke-ProviderArtworkCI.ps1 `
            -BeforeSource "$env:GITHUB_WORKSPACE/source-before" `
            -AfterSource "$env:GITHUB_WORKSPACE/source-after" `
            -Artifacts "$env:GITHUB_WORKSPACE/.artifacts/native-icons-w5" `
            -AstReceipt "$env:GITHUB_WORKSPACE/packet-preflight.json" `
