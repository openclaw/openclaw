name: CI

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      target_ref:
        description: Optional branch, tag, or full commit SHA to validate instead of the workflow ref
        required: false
        default: ""
        type: string
      runner_backend:
        description: Runner qualification override; requires an exact-head canonical PR release_gate dispatch.
        required: false
        default: default
        type: choice
        options: [default, hybrid, runson]
      ci_shape:
        description: Main-push coverage for an admitted exact-head qualification; default preserves ordinary dispatch behavior.
        required: false
        default: default
        type: choice
        options: [default, main]
      capture_ui_proof:
        description: Capture and upload sanitized Control UI screenshots from real-Gateway tests.
        required: false
        default: false
        type: boolean
      include_android:
        description: Run Android lanes for this manual CI dispatch.
        required: false
        default: false
        type: boolean
      validation_tier:
        description: Full release coverage, or complete main coverage without release-only proofs.
        required: false
        default: full
        type: choice
        options: [full, main]
      release_scope:
        description: Release qualification scope; npm-beta and npm-stable defer native apps for a validated exact release target.
        required: false
        default: full
        type: choice
        options: [full, npm-beta, npm-stable]
      release_gate:
        description: Run an exact-SHA maintainer release-gate fallback when PR CI is capacity-stalled.
        required: false
        default: false
        type: boolean
      pull_request_number:
        description: Pull request number required by the exact-SHA release gate.
        required: false
        default: ""
        type: string
      dispatch_id:
        description: Optional parent workflow dispatch identifier
        required: false
        default: ""
        type: string
      historical_target_tag:
        description: Semver release tag authorizing compatibility fallbacks for its exact commit
        required: false
        default: ""
        type: string
      release_candidate_ref:
        description: Canonical release branch authorizing compatibility fallbacks for its exact head
        required: false
        default: ""
        type: string
      target_context_ref:
        description: Canonical release branch context authorizing compatibility fallbacks for an exact-SHA target
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read

run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch_id != '' && format('CI {0}', inputs.dispatch_id) || (github.event_name == 'workflow_dispatch' && inputs.release_gate && format('CI release gate {0}', inputs.target_ref) || 'CI') }}

concurrency:
  # Keep main parity slots; isolate passive drafts except converted_to_draft.
  group: >-
    ${{ github.event_name == 'pull_request' && github.event.pull_request.draft &&
        github.event.action != 'converted_to_draft' && format('{0}-draft-v1-{1}', github.workflow, github.run_id) ||
        github.event_name == 'schedule' && format('{0}-hourly-main-v2-{1}', github.workflow, github.run_id) ||
        github.event_name == 'workflow_dispatch' && format('{0}-manual-v1-{1}', github.workflow, github.run_id) || (github.event_name == 'pull_request' && format('{0}-v7-{1}', github.workflow, github.event.pull_request.number) || (github.repository == 'openclaw/openclaw' && github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}-v8-{1}-{2}', github.workflow, github.ref, (endsWith(format('{0}', github.run_number), '0') || endsWith(format('{0}', github.run_number), '2') || endsWith(format('{0}', github.run_number), '4') || endsWith(format('{0}', github.run_number), '6') || endsWith(format('{0}', github.run_number), '8')) && 'a' || 'b') || (github.repository == 'openclaw/openclaw' && format('{0}-v7-{1}', github.workflow, github.ref) || format('{0}-v7-{1}-{2}', github.workflow, github.ref, github.sha)))) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IOS_SCREENSHOT_FASTLANE_VERSION: "2.240.1"
  IOS_SCREENSHOT_NODE_VERSION: "24.16.0"
  IOS_SCREENSHOT_XCODE_VERSION: "Xcode 27.0 Build version 27A266a"
  NODE_VERSION: "24.21.0"

jobs:
  preflight:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    if: ${{ (github.event_name != 'schedule' || (github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/main')) && ((github.event_name != 'push' || github.ref != 'refs/heads/main' || vars.OPENCLAW_CI_ON_PUSH == 'true') && (github.event_name != 'pull_request' || !github.event.pull_request.draft)) }}
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && startsWith(inputs.dispatch_id, 'full-release-validation-') && vars.OPENCLAW_RELEASE_RUNNER_GROUP || '') != '' && fromJSON(format('{{"group":{0},"labels":{1}}}', toJSON((github.event_name == 'workflow_dispatch' && startsWith(inputs.dispatch_id, 'full-release-validation-') && vars.OPENCLAW_RELEASE_RUNNER_GROUP || '')), toJSON((vars.OPENCLAW_CI_RUNNER_BACKEND == 'github' || (contains(fromJSON('["hybrid","runson"]'), vars.OPENCLAW_CI_RUNNER_BACKEND) && github.run_attempt != 1)) && 'ubuntu-24.04' || (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.run_attempt > 1)) && 'ubuntu-24.04' || (github.repository == 'openclaw/openclaw' && (contains(fromJSON('["hybrid","runson"]'), vars.OPENCLAW_CI_RUNNER_BACKEND) && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-4vcpu-ubuntu-2404') || 'ubuntu-24.04')))) || ((vars.OPENCLAW_CI_RUNNER_BACKEND == 'github' || (contains(fromJSON('["hybrid","runson"]'), vars.OPENCLAW_CI_RUNNER_BACKEND) && github.run_attempt != 1)) && 'ubuntu-24.04' || (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.run_attempt > 1)) && 'ubuntu-24.04' || (github.repository == 'openclaw/openclaw' && (contains(fromJSON('["hybrid","runson"]'), vars.OPENCLAW_CI_RUNNER_BACKEND) && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-4vcpu-ubuntu-2404') || 'ubuntu-24.04')) }}
    timeout-minutes: 20
    outputs:
      checkout_revision: ${{ steps.checkout_ref.outputs.sha }}
      pr_job_count: ${{ steps.manifest.outputs.pr_job_count }}
      pr_check_job_count: ${{ steps.manifest.outputs.pr_check_job_count }}
      candidate_trust: ${{ steps.candidate_trust.outputs.trust }}
      cache_mode: ${{ steps.candidate_trust.outputs.cache_mode }}
      cache_write_allowed: ${{ steps.candidate_trust.outputs.cache_write_allowed }}
      hosted_runner_profile_contract: ${{ steps.runner_profile.outputs.hosted_runner_profile_contract }}
      runner_profile: ${{ steps.runner_profile.outputs.runner_profile }} # hosted-runner-profile-contract-v1
      node_runner_backend: ${{ steps.runner_profile.outputs.node_runner_backend }} # runson-runner-profile-contract-v1
      ci_qualification: ${{ steps.runner_profile.outputs.ci_qualification }}
      ci_shape: ${{ steps.runner_profile.outputs.ci_shape }}
      qualification_runner_backend: ${{ steps.runner_profile.outputs.qualification_runner_backend }}
      hybrid_hosted_offload: ${{ steps.manifest.outputs.hybrid_hosted_offload }}
      hybrid_hosted_checks: ${{ steps.manifest.outputs.hybrid_hosted_checks }}
      hybrid_hosted_main_checks: ${{ steps.manifest.outputs.hybrid_hosted_main_checks }}
      hybrid_hosted_base_rows: ${{ steps.manifest.outputs.hybrid_hosted_base_rows }}
      hybrid_hosted_total_rows: ${{ steps.manifest.outputs.hybrid_hosted_total_rows }}
      diff_base_revision: ${{ steps.diff_base.outputs.sha }}
      diff_head_revision: ${{ steps.diff_base.outputs.head_sha }}
      docs_only: ${{ steps.manifest.outputs.docs_only }}
      docs_changed: ${{ steps.manifest.outputs.docs_changed }}
      release_scope: ${{ steps.manifest.outputs.release_scope }}
      release_fast_lane: ${{ steps.manifest.outputs.release_fast_lane }}
      validation_tier: ${{ steps.manifest.outputs.validation_tier }}
      run_node: ${{ steps.manifest.outputs.run_node }}
      # Freeze PR label policy once so every cancellation owner makes the same decision.
      disable_fail_fast: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:no-fail-fast') && 'true' || 'false' }}
      # docker-seed-e2e-contract-v1: frozen targets without this marker skip the lane.
      run_docker_seed_e2e: ${{ steps.manifest.outputs.run_docker_seed_e2e }}
      docker_seed_lanes: ${{ steps.manifest.outputs.docker_seed_lanes }}
      # published-driver-update-contract-v1: older frozen targets omit this cell.
      run_published_driver_update: ${{ steps.manifest.outputs.run_published_driver_update }}
      run_macos: ${{ steps.manifest.outputs.run_macos }}
      run_android: ${{ steps.manifest.outputs.run_android }}
      run_skills_python: ${{ steps.manifest.outputs.run_skills_python }}
      run_skills_python_job: ${{ steps.manifest.outputs.run_skills_python_job }}
      run_windows: ${{ steps.manifest.outputs.run_windows }}
      run_build_artifacts: ${{ steps.manifest.outputs.run_build_artifacts }}
      run_proof_tier: ${{ steps.manifest.outputs.run_proof_tier }}
      run_browser_native_host: ${{ steps.manifest.outputs.run_browser_native_host }}
      run_doctor_plugin_index: ${{ steps.manifest.outputs.run_doctor_plugin_index }}
      run_discord_component_proof: ${{ steps.manifest.outputs.run_discord_component_proof }}
      run_gateway_watch: ${{ steps.manifest.outputs.run_gateway_watch }}
      run_tui_pty: ${{ steps.manifest.outputs.run_tui_pty }}
      run_baseline_ratchets: ${{ steps.manifest.outputs.run_baseline_ratchets }}
      run_checks_fast_core: ${{ steps.manifest.outputs.run_checks_fast_core }}
      run_checks_fast: ${{ steps.manifest.outputs.run_checks_fast }}
      historical_target: ${{ steps.manifest.outputs.historical_target }}
      frozen_target: ${{ steps.manifest.outputs.frozen_target }}
      run_qa_smoke_ci: ${{ steps.manifest.outputs.run_qa_smoke_ci }}
      qa_smoke_ci_matrix: ${{ steps.manifest.outputs.qa_smoke_ci_matrix }}
      run_prompt_snapshots: ${{ steps.manifest.outputs.run_prompt_snapshots }}
      run_sqlite_session_lifecycle: ${{ steps.manifest.outputs.run_sqlite_session_lifecycle }}
      checks_fast_core_matrix: ${{ steps.manifest.outputs.checks_fast_core_matrix }}
      run_plugin_contracts_shards: ${{ steps.manifest.outputs.run_plugin_contracts_shards }}
      plugin_contracts_matrix: ${{ steps.manifest.outputs.plugin_contracts_matrix }}
      run_channel_contracts_shards: ${{ steps.manifest.outputs.run_channel_contracts_shards }}
      channel_contracts_matrix: ${{ steps.manifest.outputs.channel_contracts_matrix }}
      run_checks: ${{ steps.manifest.outputs.run_checks }}
