# Diagnostic-only branch. Never merge this workflow into the release branch.
name: Release 37 UI diagnostic (non-qualifying)
run-name: Release 37 controlled-Send regression ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact diagnostic commit; must equal the workflow commit
        required: true
        type: string
      dispatch_id:
        description: Unique diagnostic request identity
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release37-ui-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  initial-send:
    if: github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/openclaw/release37-ui-diagnostic-nov8'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 40
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NODE_VERSION: "24.22.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact diagnostic identity
        id: verify_identity
        env:
          EXPECTED_SHA: ${{ inputs.target_ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = "$WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Diagnostic source: $EXPECTED_SHA; not release qualification" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.22.1"
          install-bun: "false"
          cache-mode: restore
          dependency-cache: "true"
      - uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore
      - name: Build exact diagnostic source
        id: build
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
        run: pnpm build
      - name: Prove desired controlled Send behavior (red before fix, green after)
        env:
          OPENCLAW_CAPTURE_UI_PROOF: "0"
          OPENCLAW_UI_E2E_ARTIFACT_DIR: .artifacts/release37-ui-diagnostic
          OPENCLAW_UI_E2E_DIAGNOSTIC_DIR: .artifacts/release37-ui-timeouts
        run: |
          node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-e2e-prebuilt.config.ts --configLoader runner --reporter verbose --reporter github-actions --reporter default --reporter ./scripts/lib/vitest-resource-reporter.mts ui/src/e2e/chat-stop-finished-run.real-gateway.e2e.test.ts --testNamePattern 'allows editing during recovery and sends before initial history completes'
      - name: Prove original Stop sibling in a fresh fixture process
        if: ${{ !cancelled() && steps.verify_identity.outcome == 'success' && steps.build.outcome == 'success' }}
        env:
          OPENCLAW_CAPTURE_UI_PROOF: "0"
          OPENCLAW_UI_E2E_ARTIFACT_DIR: .artifacts/release37-ui-diagnostic
          OPENCLAW_UI_E2E_DIAGNOSTIC_DIR: .artifacts/release37-ui-timeouts
        run: |
          node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-e2e-prebuilt.config.ts --configLoader runner --reporter verbose --reporter github-actions --reporter default --reporter ./scripts/lib/vitest-resource-reporter.mts ui/src/e2e/chat-stop-finished-run.real-gateway.e2e.test.ts --testNamePattern 'restores the composer after Stop targets a run the Gateway already finished'
      - name: Check focused renderer and composer regressions
        if: ${{ !cancelled() && steps.verify_identity.outcome == 'success' && steps.build.outcome == 'success' }}
        run: |
          node scripts/run-vitest.mjs run --config test/vitest/vitest.ui.config.ts --configLoader runner ui/src/pages/chat/chat-composer-subagent.test.ts --maxWorkers=1
      - name: Check focused source lint and format
        if: ${{ !cancelled() && steps.verify_identity.outcome == 'success' && steps.build.outcome == 'success' }}
        run: |
          node scripts/run-oxlint.mjs --tsconfig ui/tsconfig.json ui/src/pages/chat/chat-pane-render.ts ui/src/pages/chat/chat-composer-subagent.test.ts
          node scripts/run-oxlint.mjs src/gateway/server-methods.ts src/gateway/server/ws-connection/authenticated-request-dispatch.ts src/gateway/server-methods/chat-send-setup.ts src/gateway/server-methods/chat-send-handler.ts
          pnpm exec oxfmt --check .github/workflows/ci.yml ui/src/pages/chat/chat-pane-render.ts ui/src/pages/chat/chat-composer-subagent.test.ts ui/src/e2e/chat-stop-finished-run.real-gateway.e2e.test.ts src/gateway/server-methods.ts src/gateway/server/ws-connection/authenticated-request-dispatch.ts src/gateway/server-methods/chat-send-setup.ts src/gateway/server-methods/chat-send-handler.ts
      - name: Retain only sanitized diagnostic counters and composer proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release37-ui-diagnostic-${{ github.run_id }}
          path: |
            .artifacts/release37-ui-diagnostic/stop-finished-run-*/proof.json
            .artifacts/release37-ui-diagnostic/stop-finished-run-*/recovery-send.png
            .artifacts/release37-ui-timeouts/failure-*/failure.public.json
          if-no-files-found: warn
          retention-days: 7
