    runs-on: ${{ (github.event_name == 'workflow_dispatch' && startsWith(inputs.dispatch_id, 'full-release-validation-') && vars.OPENCLAW_RELEASE_RUNNER_GROUP || '') != '' && fromJSON(format('{{"group":{0},"labels":{1}}}', toJSON((github.event_name == 'workflow_dispatch' && startsWith(inputs.dispatch_id, 'full-release-validation-') && vars.OPENCLAW_RELEASE_RUNNER_GROUP || '')), toJSON(needs.preflight.outputs.node_runner_backend == 'runson' && matrix.runner == 'runson-c8i-8xlarge' && github.run_attempt == 1 && format('runs-on={0}-{1}/family=c8i.8xlarge/cpu=32/ram=64/spot=true/retry=false/image=ubuntu24-full-x64/volume=80gb', github.run_id, matrix.check_name) || matrix.runner == 'runson-c8i-8xlarge' && 'ubuntu-24.04' || (needs.preflight.outputs.node_runner_backend == 'runson' || needs.preflight.outputs.ci_qualification == 'true') && github.run_attempt == 1 && ((matrix.runner == 'blacksmith-8vcpu-ubuntu-2404' && contains(fromJSON('["checks-node-compact-large-9","checks-node-compact-large-5"]'), matrix.check_name)) && 'blacksmith-16vcpu-ubuntu-2404' || matrix.runner || 'blacksmith-4vcpu-ubuntu-2404') || (needs.preflight.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && needs.preflight.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND) == 'github' && 'ubuntu-24.04' || (contains(fromJSON('["hybrid","runson"]'), (needs.preflight.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && needs.preflight.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND)) && github.run_attempt > 1) && 'ubuntu-24.04' || ((github.event_name == 'workflow_dispatch' && ((needs.preflight.outputs.node_runner_backend != 'runson' && needs.preflight.outputs.ci_qualification != 'true') || github.run_attempt != 1)) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.run_attempt > 1)) && 'ubuntu-24.04' || (github.repository == 'openclaw/openclaw' && ((matrix.runner == 'blacksmith-8vcpu-ubuntu-2404' && contains(fromJSON('["checks-node-compact-large-9","checks-node-compact-large-5"]'), matrix.check_name)) && 'blacksmith-16vcpu-ubuntu-2404' || matrix.runner || 'blacksmith-4vcpu-ubuntu-2404') || 'ubuntu-24.04')))) || (needs.preflight.outputs.node_runner_backend == 'runson' && matrix.runner == 'runson-c8i-8xlarge' && github.run_attempt == 1 && format('runs-on={0}-{1}/family=c8i.8xlarge/cpu=32/ram=64/spot=true/retry=false/image=ubuntu24-full-x64/volume=80gb', github.run_id, matrix.check_name) || matrix.runner == 'runson-c8i-8xlarge' && 'ubuntu-24.04' || (needs.preflight.outputs.node_runner_backend == 'runson' || needs.preflight.outputs.ci_qualification == 'true') && github.run_attempt == 1 && ((matrix.runner == 'blacksmith-8vcpu-ubuntu-2404' && contains(fromJSON('["checks-node-compact-large-9","checks-node-compact-large-5"]'), matrix.check_name)) && 'blacksmith-16vcpu-ubuntu-2404' || matrix.runner || 'blacksmith-4vcpu-ubuntu-2404') || (needs.preflight.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && needs.preflight.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND) == 'github' && 'ubuntu-24.04' || (contains(fromJSON('["hybrid","runson"]'), (needs.preflight.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && needs.preflight.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND)) && github.run_attempt > 1) && 'ubuntu-24.04' || ((github.event_name == 'workflow_dispatch' && ((needs.preflight.outputs.node_runner_backend != 'runson' && needs.preflight.outputs.ci_qualification != 'true') || github.run_attempt != 1)) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.run_attempt > 1)) && 'ubuntu-24.04' || (github.repository == 'openclaw/openclaw' && ((matrix.runner == 'blacksmith-8vcpu-ubuntu-2404' && contains(fromJSON('["checks-node-compact-large-9","checks-node-compact-large-5"]'), matrix.check_name)) && 'blacksmith-16vcpu-ubuntu-2404' || matrix.runner || 'blacksmith-4vcpu-ubuntu-2404') || 'ubuntu-24.04')) }}
    timeout-minutes: ${{ matrix.timeout_minutes || 60 }}
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' && github.repository != 'openclaw/openclaw' && needs.preflight.outputs.disable_fail_fast != 'true' }}
      max-parallel: ${{ github.event_name == 'pull_request' && github.repository == 'openclaw/openclaw' && github.run_attempt == 1 && needs.preflight.outputs.frozen_target != 'true' && contains(fromJSON('["blacksmith","hybrid"]'), needs.preflight.outputs.node_runner_backend) && contains(fromJSON('["","blacksmith","hybrid"]'), vars.OPENCLAW_CI_RUNNER_BACKEND) && 130 || 96 }}
      matrix: ${{ fromJson(needs.preflight.outputs.checks_node_core_nondist_matrix) }}
    steps:
      - *linux_node_checkout_step
      - name: Initialize RunsOn
        if: matrix.runner == 'runson-c8i-8xlarge' && runner.environment == 'self-hosted'
        uses: runs-on/action@dfae4d98c5537a0dc7bbb7e6b9211f30ba240f6d # v2

      - name: Record RunsOn allocation
        if: matrix.runner == 'runson-c8i-8xlarge' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          imds_token="$(curl -fsS --connect-timeout 2 --max-time 5 -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)"
          for fact in instance-type instance-life-cycle placement/region; do
            value="$(curl -fsS --connect-timeout 2 --max-time 5 -H "X-aws-ec2-metadata-token: $imds_token" "http://169.254.169.254/latest/meta-data/$fact")"
            echo "RUNSON_ALLOCATION $fact=$value"
            case "$fact" in
              instance-type) test "$value" = c8i.8xlarge ;;
              instance-life-cycle) [[ "$value" == spot || "$value" == on-demand ]] ;;
              placement/region) test "$value" = us-east-1 ;;
            esac
          done
          echo "RUNSON_ALLOCATION launched_at=${RUNS_ON_INSTANCE_LAUNCHED_AT:-unknown}"
          # c8i uses EBS; do not claim the pilot's unmeasured c8id NVMe path.
          findmnt -T /tmp -o TARGET,SOURCE,FSTYPE

      - name: Setup Node environment
        uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          cache-mode: *cache_mode
          node-version: "${{ (matrix.runner == 'runson-c8i-8xlarge' || startsWith(matrix.check_name, 'checks-node-runson-cron-')) && env.NODE_VERSION || matrix.node_version || '24.x' }}"
          install-bun: "false"
          # Only Node 24 consumes the trusted compile seed.
          dependency-cache: ${{ matrix.runner != 'runson-c8i-8xlarge' && (matrix.node_version == null || matrix.node_version == '24.x') && (needs.preflight.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && needs.preflight.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND) != 'github' && runner.environment == 'self-hosted' && (github.event_name != 'workflow_dispatch' || ((needs.preflight.outputs.node_runner_backend == 'runson' || needs.preflight.outputs.ci_qualification == 'true') && github.run_attempt == 1)) && github.repository == 'openclaw/openclaw' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'openclaw/openclaw') && 'true' || 'false' }}
          vitest-fs-cache: "true"
          vitest-worker-cache: ${{ needs.preflight.outputs.frozen_target != 'true' && matrix.pretest_build_mode == null && (matrix.node_version == null || matrix.node_version == '24.x') && 'true' || 'false' }}
          node-compile-cache: "true"

      - name: Apply frozen Node test compatibility
        if: needs.preflight.outputs.checkout_revision == 'f773aa06a1a93b36b050f1a3f4b57d3d91311541'
        uses: ./.ci-harness/.github/actions/frozen-node-test-compat
        with:
          target-sha: *checkout_sha

      - name: Setup pinned Bun test runtime
        if: matrix.requires_bun == true
        uses: ./.ci-harness/.github/actions/setup-test-bun

      - name: Setup Go for docs i18n
        if: matrix.requires_go == true
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false

      - name: Resolve docs i18n Go cache
        id: docs-i18n-go-cache-key
        if: matrix.requires_go == true && needs.preflight.outputs.cache_mode != 'off'
        env:
          DEPENDENCY_HASH: ${{ hashFiles('scripts/docs-i18n/go.sum') }}
        run: |
          set -euo pipefail
          arch="$(node -p process.arch)"
          image_prefix=""
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            image_prefix="${ImageOS-undefined}-"
          fi
          version="$(go env GOVERSION)"
          {
            echo "key=setup-go-${RUNNER_OS}-${arch}-${image_prefix}go-${version#go}-${DEPENDENCY_HASH}"
            echo "paths<<EOF"
            go env GOMODCACHE
            go env GOCACHE
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Restore docs i18n Go cache
        id: docs-i18n-go-cache
        if: matrix.requires_go == true && needs.preflight.outputs.cache_mode != 'off'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.docs-i18n-go-cache-key.outputs.paths }}
          key: ${{ steps.docs-i18n-go-cache-key.outputs.key }}

      - name: Verify docs i18n Go toolchain
        if: matrix.requires_go == true
        run: test "$(go env GOVERSION)" = "go1.27.1"

      - name: Checkout trusted Node shard runner
        if: ${{ hashFiles('scripts/ci-run-node-test-shard.mts') == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-workflow
          sparse-checkout: |
            scripts/ci-run-node-test-shard.mts
            scripts/lib/ci-node-test-groups-codec.mts
            scripts/lib/direct-run.mjs
            scripts/lib/local-check-runtime.mts
            scripts/lib/numeric-options.mjs
            scripts/lib/vitest-plan-scheduling.mts
            scripts/lib/vitest-local-scheduling.mts
            scripts/lib/arg-utils.mts
            scripts/lib/arg-utils.runtime.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Build Node test runtime
        id: node-test-runtime
        if: matrix.pretest_build_mode != null
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_BUILD_PRIVATE_QA: ${{ matrix.pretest_build_mode == 'private-qa' && '1' || '0' }}
          VITEST: "1"
        run: pnpm build qaRuntime

      - name: Install ripgrep for native grep tests
        if: matrix.requires_ripgrep == true && runner.os == 'Linux'
        shell: bash
        run: |
          if command -v rg >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: Prepare Docker sandbox image
        if: matrix.requires_sandbox_image == true && runner.os == 'Linux'
        shell: bash
        run: |
          if ! docker image inspect openclaw-sandbox:bookworm-slim >/dev/null 2>&1; then
            scripts/sandbox-setup.sh
          fi

      - name: Configure Node test resources
        env:
          PREDICTED_TEST_SECONDS: ${{ matrix.predicted_seconds || '' }}
          SHARD_PLAN_CONCURRENCY: ${{ matrix.plan_concurrency || '' }}
          FROZEN_TARGET: *frozen_target
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNSON_JOB: ${{ (matrix.runner == 'runson-c8i-8xlarge' || startsWith(matrix.check_name, 'checks-node-runson-cron-')) && 'true' || 'false' }}
        run: |
          cores="$(nproc)"
          if [ "$RUNSON_JOB" = "true" ]; then
            workers=2
          elif [ "$SHARD_PLAN_CONCURRENCY" != "1" ]; then
            workers=2
          elif [ "$cores" -ge 12 ]; then
            workers=6
          elif [ "$cores" -ge 6 ]; then
            workers=4
          else
            workers=3
          fi
          if [[ "$RUNSON_JOB" != "true" && "$RUNNER_ENVIRONMENT" == "self-hosted" && "$FROZEN_TARGET" != "true" && "$SHARD_PLAN_CONCURRENCY" == "1" ]]; then
            workers="$(CI_LEGACY_WORKERS="$workers" node --input-type=module <<'JS'
          import { isConstrainedCiCheckHost } from './scripts/lib/local-check-runtime.mts';
          import { detectVitestHostInfo, resolveLocalVitestScheduling } from './scripts/lib/vitest-local-scheduling.mts';
          const host = detectVitestHostInfo();
          const constrained = isConstrainedCiCheckHost({
            logicalCpuCount: host.cpuCount,
            totalMemoryBytes: host.totalMemoryBytes,
          });
          console.log(constrained ? process.env.CI_LEGACY_WORKERS : resolveLocalVitestScheduling(process.env, host).maxWorkers);
          JS
            )"
          fi
          if [ "$workers" -gt "$cores" ]; then
            workers="$cores"
          fi
          echo "detected cores=$cores plan_concurrency=${SHARD_PLAN_CONCURRENCY:-default} predicted_test_seconds=${PREDICTED_TEST_SECONDS:-unknown} -> workers=$workers"
          echo "OPENCLAW_VITEST_MAX_WORKERS=$workers" >> "$GITHUB_ENV"

      - name: Run Node test shard
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_E2E_USE_PREBUILT_DIST: ${{ steps.node-test-runtime.outcome == 'success' && matrix.pretest_build_mode == 'private-qa' && '1' || '' }}
          OPENCLAW_CI_TEST_RUNTIME_POLICY: ${{ matrix.test_runtime_policy || 'node' }}
          FROZEN_TARGET: *frozen_target
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          OPENCLAW_NODE_TEST_GROUPS_GZIP_BASE64: ${{ matrix.groups_gzip_base64 || '' }}
          OPENCLAW_NODE_TEST_GROUPS_JSON: ${{ matrix.groups && toJson(matrix.groups) || '' }}
          OPENCLAW_NODE_TEST_CONFIGS_JSON: ${{ toJson(matrix.configs) }}
          OPENCLAW_NODE_TEST_ENV_JSON: ${{ toJson(matrix.env) }}
          OPENCLAW_NODE_TEST_INCLUDE_PATTERNS_JSON: ${{ toJson(matrix.includePatterns) }}
          OPENCLAW_NODE_TEST_TARGETS_JSON: ${{ toJson(matrix.targets) }}
          # Keep the watchdog above Vitest so frozen hook diagnostics finish.
          OPENCLAW_NODE_TEST_VITEST_ARGS_JSON: ${{ needs.preflight.outputs.compatibility_target == 'true' && '["--hookTimeout=600000"]' || '[]' }}
          OPENCLAW_VITEST_SHARD_NAME: ${{ matrix.shard_name }}
          OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: ${{ needs.preflight.outputs.compatibility_target == 'true' && '660000' || '300000' }}
          OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: ${{ matrix.plan_concurrency }}
