      IOS_UI_TEST_BUILD_PREPARED: "false"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Start arm clock
        timeout-minutes: 1
        run: |
          python3 -c 'import os,time; open(os.environ["GITHUB_ENV"], "a").write("FRV_ARM_START_NS=" + str(time.monotonic_ns()) + "\n")'
      - name: Read temporary controller
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: .frv-controller
      - name: Preserve controller outside source checkout
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/frv-control/bundle/candidate"
          cp .frv-controller/.github/frv-ios-benchmark/native-environment.py .frv-controller/.github/frv-ios-benchmark/observe-command.py "$RUNNER_TEMP/frv-control/"
          echo "FRV_CONTROL=$RUNNER_TEMP/frv-control" >> "$GITHUB_ENV"
      - name: Checkout
        env:
          CHECKOUT_REPO: ${{ github.repository }}
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: 42cc98c75dd81e67c7a8fcd9f053da77f12b438a
          WORKFLOW_SHA: 42cc98c75dd81e67c7a8fcd9f053da77f12b438a
        run: |
          set -euo pipefail
          python_command=python3
          if [ "$RUNNER_OS" = "Windows" ]; then
            python_command=python
          fi
          run_owner() {
