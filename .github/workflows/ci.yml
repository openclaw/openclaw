name: OIDC Native Preparation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_VITEST_MAX_WORKERS: "1"
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 5
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
      - name: Format the feature and generate approved config documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oidc-native-preparation"
          git diff --name-only 1651ee19282ca46d4be6639167e10b11ebc0c4d2 -- '*.ts' | xargs node scripts/run-format.mts --write
          node --import ./scripts/tsx.mjs scripts/generate-config-doc-baseline.ts --write
          node --import ./scripts/tsx.mjs scripts/generate-config-doc-baseline.ts --check
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const paths=['src/gateway/server.auth.delegation.test.ts','src/gateway/trusted-proxy-delegation.test.ts','src/state/user-profile-delegation.test.ts'];
          const count=paths.reduce((n,p)=>n+(readFileSync(p,'utf8').match(/\n/g)||[]).length,0);
          const allocation='config/test-lines-allocations/oidc-native-user-profiles.txt';
          const text=readFileSync(allocation,'utf8').replace(/\n[0-9]+\n$/,`\n${count}\n`);
          writeFileSync(allocation,text);
          NODE
          git diff --check
          git diff --binary -- src config/test-lines-allocations/oidc-native-user-profiles.txt docs/.generated/config-baseline.counts.json docs/.generated/config-baseline.sha256 > "$RUNNER_TEMP/oidc-native-preparation/generated.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/oidc-native-preparation/source.txt"
          cp src/state/user-profile-delegation.worker.ts "$RUNNER_TEMP/oidc-native-preparation/fixed-worker.ts"
      - name: Record the old first-use behavior
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          trap 'cp "$RUNNER_TEMP/oidc-native-preparation/fixed-worker.ts" src/state/user-profile-delegation.worker.ts' EXIT
          git show 887affa1f94ddaa4869c77e84b2ad72eec8a65b6:src/state/user-profile-delegation.worker.ts > src/state/user-profile-delegation.worker.ts
          corepack pnpm test src/gateway/server.auth.delegation.test.ts --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/oidc-native-preparation/red.log"
      - name: Run focused native proof
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm test src/state/user-profile-delegation.test.ts src/gateway/trusted-proxy-delegation.test.ts src/gateway/server.auth.delegation.test.ts --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/oidc-native-preparation/green.log"
      - name: Retain only the generated patch and proof logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: oidc-native-preparation-${{ github.run_id }}
          retention-days: 3
          path: |
            ${{ runner.temp }}/oidc-native-preparation/generated.patch
            ${{ runner.temp }}/oidc-native-preparation/source.txt
            ${{ runner.temp }}/oidc-native-preparation/red.log
            ${{ runner.temp }}/oidc-native-preparation/green.log
