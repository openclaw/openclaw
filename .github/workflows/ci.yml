        id: frv-source-25
      - name: Upload iOS lifecycle simulator evidence
        if:
          ${{ always() && ((steps.ios_lifecycle_tests.outcome != '' && steps.ios_lifecycle_tests.outcome != 'skipped') ||
          (steps.ios_voice_cleanup_tests.outcome != '' && steps.ios_voice_cleanup_tests.outcome != 'skipped') || (steps.ios_attachment_tests.outcome
          != '' && steps.ios_attachment_tests.outcome != 'skipped')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-lifecycle-tests-${{ '42cc98c75dd81e67c7a8fcd9f053da77f12b438a' }}
          path: |
            apps/ios/build/LifecycleTestResults/*.xcresult
            apps/ios/build/LifecycleTestResults/*.log
            apps/ios/build/LifecycleTestResults/Attachment-*
            apps/ios/build/LifecycleTestResults/attachments-*
          if-no-files-found: warn
          retention-days: 14
        id: frv-source-26
      - name: Record whole-arm duration and completion
        if: ${{ always() }}
        timeout-minutes: 1
        env:
          FRV_NATIVE_COMPLETE:
            ${{ steps.select-xcode.outcome == 'success' && steps.node-env.outcome == 'success' && steps.watch-rust-toolchain.outcome
            == 'success' && steps.frv-source-10.outcome == 'success' && steps.ios-swift-tools.outcome == 'success' && steps.ios-configure.outcome
            == 'success' && steps.ios-simulator.outcome == 'success' && steps.ios-app-build.outcome == 'success' && steps.ios_attachment_tests.outcome
            == 'success' && steps.ios_voice_cleanup_tests.outcome == 'success' && steps.ios_lifecycle_tests.outcome == 'success'
            && steps.frv-source-23.outcome == 'success' && steps.frv-source-26.outcome == 'success' && steps.frv-environment.outcome
            == 'success' }}
        run: |
          python3 "$FRV_CONTROL/native-environment.py" finish "$FRV_CONTROL/bundle/candidate/environment.json"
      - name: Retain arm environment and Watch timings
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frv-candidate-environment
          path: ${{ env.FRV_CONTROL }}/bundle/candidate
          if-no-files-found: error
          retention-days: 14
      - name: Read baseline environment receipt
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frv-baseline-environment
          path: ${{ runner.temp }}/frv-baseline
      - name: Reject incomplete or materially different pair
        if: ${{ always() }}
        timeout-minutes: 1
        run: |
          python3 "$FRV_CONTROL/native-environment.py" compare "$RUNNER_TEMP/frv-baseline/environment.json" "$FRV_CONTROL/bundle/candidate/environment.json"
    needs: baseline
    if: ${{ !cancelled() }}
