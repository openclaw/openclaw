                  )
              except subprocess.TimeoutExpired as error:
                  print((error.stderr or b"").decode(errors="replace"), end="", file=sys.stderr)
                  raise
              if result.stderr:
                  print(result.stderr, end="", file=sys.stderr)
              states = []
              if result.returncode != 1 or result.stdout or result.stderr:
                  result.check_returncode()
                  # Validate the complete census before ignoring zombies; Darwin ps can
                  # report sysctl errors on stderr with exit 0. Neither permits reuse.
                  if result.stderr or not re.fullmatch(
                      r"(?:[ \t]*[1-9][0-9]*[ \t]+[RSDTtXZxKWPIU?][<+NLlsEVWX]*[ \t]*\n)+", result.stdout
                  ):
                      raise RuntimeError("Invalid process group census")
                  states = [state for group, state in (line.split() for line in result.stdout.splitlines())
                            if int(group) == pgid]
              if states:
                  return states
              # Empty selection (exit 1), or a session with only other groups, can race
              # extinction. Require native ESRCH; a bare status 1 or EPERM proves nothing.
              try:
                  os.killpg(pgid, 0)
              except ProcessLookupError:
                  return []
              raise RuntimeError("Process group census missed a present group")


          def drain(child, job):
              deadline = time.monotonic() + cleanup_seconds
              if os.name == "nt":
                  # Stop/join even a pre-assignment bootstrap before terminating the Job:
                  # an empty Job alone cannot prove that no Git will start afterwards.
                  child.kill()
                  child.wait(timeout=max(0.001, deadline - time.monotonic()))
                  handles = []
                  terminated = False
                  try:
                      handles, total = job_members(job, deadline)
                      terminate_job(job, 1)
                      terminated = True
                      accounting = Accounting()
                      while True:
                          settled = True
                          for handle in handles:
                              status = wait_process(handle, 0)
                              if status == 258:  # WAIT_TIMEOUT: accounting can reach zero first.
                                  settled = False
                              elif status != 0:
                                  raise c.WinError(c.get_last_error())
                          query_job(job, 1, c.byref(accounting), c.sizeof(accounting), None)
                          if accounting.TotalProcesses != total:
                              raise RuntimeError("Job membership grew during cleanup")
                          if accounting.ActiveProcesses == 0 and settled:
                              return
                          if time.monotonic() >= deadline:
                              raise RuntimeError("Job cleanup did not complete")
                          time.sleep(0.05)
                  finally:
                      try:
                          if not terminated:
                              terminate_job(job, 1)
                      finally:
                          for handle in handles:
                              close_handle(handle)
              else:
                  # The group remains ours after leader exit. Reserve half the existing
                  # cleanup allowance for KILL and extinction verification after TERM.
                  try:
                      group_signal(child.pid, signal.SIGTERM, deadline)
                      kill_at = deadline - cleanup_seconds / 2
                      while True:
                          child.poll()
                          if not group_alive(child.pid, deadline):
                              child.wait(timeout=max(0.001, deadline - time.monotonic()))
                              return
                          if time.monotonic() >= kill_at:
                              group_signal(child.pid, signal.SIGKILL, deadline)
                          if time.monotonic() >= deadline:
                              raise RuntimeError("Process group cleanup did not complete")
                          time.sleep(0.05)
                  except Exception:
                      group_signal(child.pid, signal.SIGKILL, deadline)
                      # KILL queues termination; a leader wait cannot join descendants.
                      # Count zombies conservatively here, but never reset the allowance or retry.
                      while time.monotonic() < deadline:
                          child.poll()
                          if not group_signal(child.pid, 0, deadline):
                              break
                          time.sleep(0.05)
                      child.wait(timeout=max(0.001, deadline - time.monotonic()))
                      raise


          class FetchTimeout(Exception):
              pass


          class GitFailure(Exception):
              def __init__(self, code):
                  self.code = code


          def git_lock_files(directory):
              git_dir = os.path.join(os.path.realpath(directory), ".git")
              if not os.path.lexists(git_dir):
                  return set()
              if not os.path.isdir(git_dir) or os.path.realpath(git_dir) != git_dir:
                  raise RuntimeError("Checkout Git directory is not physical")
              def scan_error(error):
                  raise error
              locks = set()
              for root, directories, files in os.walk(git_dir, onerror=scan_error):
                  directories[:] = [name for name in directories
                                    if os.path.realpath(os.path.join(root, name)) == os.path.join(root, name)]
                  locks.update(os.path.join(root, name) for name in files if name.endswith(".lock"))
              return locks


          def git_auth_environment(remote, token):
              # Git'\''s promisor fetch inherits this process-only config from checkout.
              # Reject redirects: http.<url> matching does not re-scope redirected requests.
              count = int(os.environ.get("GIT_CONFIG_COUNT", "0"))
              if count < 0:
                  raise ValueError("Invalid Git environment configuration count")
              header = f"http.{remote}.extraheader"
              authorization = base64.b64encode(f"x-access-token:{token}".encode()).decode()
              settings = [(header, ""), (header, f"AUTHORIZATION: basic {authorization}"),
                          (f"http.{remote}.followRedirects", "false")]
              environment = {"GIT_CONFIG_COUNT": str(count + len(settings)), "GIT_TERMINAL_PROMPT": "0"}
              for index, (key, value) in enumerate(settings, count):
                  environment[f"GIT_CONFIG_KEY_{index}"] = key
                  environment[f"GIT_CONFIG_VALUE_{index}"] = value
              return environment


          def run_git(directory, *arguments, timeout=None, stdout=None, stderr=None, env=None,
                      reclaim_locks=False):
              global closed
              if closed:
                  raise RuntimeError("Git owner is closed")
              check_cancelled()
              if git is None:
                  raise RuntimeError("Git unavailable")
              # Process ownership alone does not grant metadata ownership: generic callers
              # may use linked worktrees. Only exclusive checkout fetches reclaim locks.
              previous_locks = git_lock_files(directory) if reclaim_locks else None
              command = [git, "-C", directory, *arguments]
              job = None
              child = None
              timed_out = False
              deadline = time.monotonic() + timeout if timeout is not None else None
              try:
                  environment = ({**os.environ, **checkout_environment, **(env or {})}
                                 if checkout_environment or env is not None else None)
                  options = {"stdin": subprocess.DEVNULL, "stdout": stdout, "stderr": stderr,
                             "env": environment}
                  if os.name == "nt":
                      job = create_job(None, None)
                      limits = ExtendedLimits()
                      limits.BasicLimitInformation.LimitFlags = 0x2000  # KILL_ON_JOB_CLOSE; no breakaway.
                      set_job(job, 9, c.byref(limits), c.sizeof(limits))
                      os.set_handle_inheritable(job, True)
                      startup = subprocess.STARTUPINFO()
                      startup.lpAttributeList = {"handle_list": [job]}
                      options.update(startupinfo=startup, close_fds=True)
                      # The selected checkout must not inject Python startup code into its owner.
                      command = [sys.executable, "-I", "-S", "-c", bootstrap, str(job), *command]
                  else:
                      options["start_new_session"] = True
                  # Signal handlers only latch cancellation, so Popen cannot lose ownership
                  # between process creation and saving its handle/group for cleanup.
                  child = subprocess.Popen(command, **options)
                  if job is not None:
                      os.set_handle_inheritable(job, False)
                  while child.poll() is None and not cancelled:
                      if deadline is not None and time.monotonic() >= deadline:
                          timed_out = True
                          raise FetchTimeout()
                      time.sleep(0.05)
              finally:
                  # Failed inspection/cleanup permanently fences this policy process. Only
                  # verified extinction permits another command, even after a caught error.
                  closed = True
                  try:
                      if child is not None:
                          drain(child, job)
                          if previous_locks is not None and (timed_out or cancelled or child.returncode):
                              # Forced termination skips Git'\''s lockfile cleanup. This checkout is exclusive;
                              # reclaim only newly created locks after tree extinction, never existing locks.
                              for lock in sorted(git_lock_files(directory) - previous_locks):
                                  os.unlink(lock)
                  finally:
                      if job is not None:
                          close_handle(job)
                  closed = False
                  # Run even while a timeout is unwinding: cancellation received during
                  # draining outranks it, but failed cleanup above still outranks both.
                  check_cancelled()
              if child.returncode:
                  raise GitFailure(child.returncode if child.returncode > 0 else 128 - child.returncode)


          def backoff(seconds):
              retry_at = time.monotonic() + seconds
              while time.monotonic() < retry_at:
                  check_cancelled()
                  time.sleep(0.05)


          def fetch(directory, *refs, prune=False, max_attempts=3, depth=1,
                    blobless=False, retry_failures=False, retry_codes=()):
              for attempt in range(1, max_attempts + 1):
                  try:
                      run_git(directory, "-c", "protocol.version=2", "fetch", "--no-tags",
                              *(["--prune"] if prune else []), "--no-recurse-submodules", f"--depth={depth}",
                              *(["--filter=blob:none"] if blobless else []), "origin", *refs,
                              timeout=fetch_timeout_seconds, reclaim_locks=True)
                      return
                  except (FetchTimeout, GitFailure) as error:
                      check_cancelled()
                      retryable = isinstance(error, FetchTimeout) or retry_failures or error.code in retry_codes
                      if not retryable or attempt == max_attempts:
                          raise
                      print(f"::warning::checkout fetch failed on attempt {attempt}; retrying", flush=True)
                      backoff(5)


          def git_output(directory, *arguments, timeout=None, env=None):
              with tempfile.TemporaryFile() as output:
                  run_git(directory, *arguments, timeout=timeout, env=env, stdout=output)
                  output.seek(0)
                  return output.read().decode("utf-8", errors="surrogateescape")


          def resolve_ref(ref):
              return git_output(workspace, "rev-parse", ref).strip()


          def checkout_selected_ref():
              ref = os.environ["CHECKOUT_REF"]
              fallback = os.environ["CHECKOUT_FALLBACK_REF"]
              manual = os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
              requested = ref if kind == "preflight" and re.fullmatch("[0-9a-f]{40}", ref) else None
              # Prefer the event ref for an exact manual SHA, but detect a ref that moved in the queue.
              if requested and manual and ref == fallback and os.environ.get("CHECKOUT_EVENT_REF"):
                  ref = os.environ["CHECKOUT_EVENT_REF"]

              def fetch_ref(value):
                  fetch(workspace, f"+{value}:refs/remotes/origin/checkout", prune=True,
                        depth=1 if kind == "preflight" else 2, retry_codes=(124, 137))

              try:
                  fetch_ref(ref)
              except GitFailure as error:
                  if error.code in (124, 137) or not manual or os.environ["CHECKOUT_REF"] == fallback:
                      raise
                  print("::warning::workflow_dispatch target_ref is unavailable; falling back to head SHA", flush=True)
                  fetch_ref(fallback)
              if requested:
                  resolved = resolve_ref("refs/remotes/origin/checkout")
                  if resolved != requested and ref != requested:
                      print("::notice::checkout ref moved; fetching requested SHA", flush=True)
                      fetch_ref(requested)
                      resolved = resolve_ref("refs/remotes/origin/checkout")
                  if resolved != requested:
                      print("::error::checkout ref did not resolve to the requested SHA", file=sys.stderr)
                      raise GitFailure(1)
              if kind == "preflight":
                  # Diff-base callers need parent commits/trees, not their blobs.
                  try:
                      fetch(workspace, resolve_ref("refs/remotes/origin/checkout"), prune=True,
                            depth=2, blobless=True, retry_failures=True)
                  except (FetchTimeout, GitFailure):
                      raise GitFailure(1)
              run_git(workspace, "checkout", "--detach", "refs/remotes/origin/checkout")


          def checkout_harness(sha):
              action = ".github/actions/setup-node-env/action.yml"
              node_setup_scripts = ("scripts/lib/pnpm-lockfile-documents.mjs",)
              evidence_scripts = ("scripts/ios-screenshot-evidence.mjs", "scripts/lib/direct-run.mjs", "scripts/ci-static-step.sh")
              platform_scripts = ("scripts/lib/swift-toolchain.sh", "scripts/lib/ci-ios-smoke-plan.mjs")
              upgrade_scripts = ("scripts/lib/release-upgrade-baseline.mjs", "scripts/lib/release-version.mjs")
              # Preflight imports these siblings by file-relative paths.
              preflight_scripts = (
                  "scripts/ci-build-manifest.mjs",
                  "scripts/lib/ci-ios-smoke-plan.mjs",
                  "scripts/lib/release-context.mjs",
                  "scripts/lib/release-version.mjs",
              )
              npm_lock_scripts = (
                  "scripts/ci-npm-lock-admission.mjs",
                  "scripts/generate-npm-package-lock.mjs",
                  "scripts/generate-npm-package-lock.mts",
                  "scripts/changed-lanes.mts",
                  "scripts/lib/merge-head-diff-base.mjs",
              )
              linux_node_scripts = (*upgrade_scripts, *npm_lock_scripts, "scripts/ci-additional-checks.sh")
              if kind == "linux-node" and not os.path.isfile(os.path.join(workspace, action)):
                  raise GitFailure(1)
              harness = os.path.join(workspace, ".ci-harness")
              # This owner creates the harness, not candidate source. Keep strict source-status
              # checks useful without hiding tracked edits or similarly named nested paths.
              exclude = os.path.join(workspace, git_output(workspace, "rev-parse", "--git-path", "info/exclude").strip())
              os.makedirs(os.path.dirname(exclude), exist_ok=True)
              with open(exclude, "a+b") as output:
                  output.seek(0)
                  if output.read().splitlines()[-1:] != [b"/.ci-harness/"]:
                      output.write(b"\n/.ci-harness/\n")
              os.makedirs(harness, exist_ok=True)
              if sha == os.environ["WORKFLOW_SHA"]:
                  # Export the workflow revision from the freshly populated index, replacing
                  # retained harness files without updating the index or trusting later edits.
                  pathspecs = [".github/actions", *node_setup_scripts]
                  if kind in ("platform", "linux-node"):
                      pathspecs += evidence_scripts
                  elif kind == "preflight":
                      pathspecs += preflight_scripts
                  if kind == "platform":
                      pathspecs += platform_scripts
                  if kind == "linux-node":
                      pathspecs += linux_node_scripts
                  paths = git_output(workspace, "ls-files", "-z", "--", *pathspecs).split("\0")[:-1]
                  run_git(workspace, "checkout-index", "--force", f"--prefix={harness}/", "--", *paths)
              else:
                  run_git(harness, "init", harness)
                  run_git(harness, "remote", "add", "origin", remote)
                  sparse_paths = ["/.github/actions/", *(f"/{path}" for path in node_setup_scripts)]
                  if kind in ("platform", "linux-node"):
                      sparse_paths += [f"/{path}" for path in evidence_scripts]
                  if kind == "platform":
                      sparse_paths += [f"/{path}" for path in platform_scripts]
                  if kind == "linux-node":
                      sparse_paths += [f"/{path}" for path in linux_node_scripts]
                  # Rooted non-cone patterns keep the kind-owned workflow files exact.
                  # Sparse first, then blob-less avoids downloading a second repository snapshot.
                  run_git(harness, "sparse-checkout", "set", "--no-cone", *sparse_paths)
                  fetch(harness, f"+{os.environ['\''WORKFLOW_SHA'\'']}:refs/remotes/origin/ci-harness",
                        max_attempts=1, blobless=True)
                  # Checkout now materializes the sparse blobs over the network, so it carries the
                  # fetch deadline instead of running unbounded like a local checkout.
                  run_git(harness, "checkout", "--force", "--detach", os.environ["WORKFLOW_SHA"],
                          timeout=fetch_timeout_seconds)
              if not os.path.isfile(os.path.join(harness, action)):
                  raise GitFailure(1)
              check_cancelled()


          def checkout():
              check_cancelled()
              prerequisites = json.loads(os.environ.get("CHECKOUT_GIT_COMMITS_JSON", "null")) if kind == "linux-node" else None
              if prerequisites is None:
                  prerequisites = []
              if not isinstance(prerequisites, list) or any(
                  not isinstance(commit, str) or not re.fullmatch("[0-9a-f]{40}", commit)
                  for commit in prerequisites
              ):
                  raise ValueError("Invalid immutable test prerequisite commits")
              if reset:
                  os.makedirs(workspace, exist_ok=True)
                  # Every earlier Git group has been drained before deleting its workspace.
                  subprocess.run(["find", workspace, "-mindepth", "1", "-maxdepth", "1",
                                  "-exec", "rm", "-rf", "{}", "+"], check=True)
              run_git(workspace, "init", workspace)
              if kind in ("linux-node", "android"):
                  run_git(workspace, "config", "--global", "--add", "safe.directory", workspace)
              run_git(workspace, "config", "gc.auto", "0")
              run_git(workspace, "remote", "add", "origin", remote)
              if kind in ("preflight", "manual"):
                  checkout_selected_ref()
                  if kind == "preflight" and resolve_ref("HEAD") == os.environ["WORKFLOW_SHA"]:
                      checkout_harness(os.environ["WORKFLOW_SHA"])
                  return
              target = "refs/remotes/origin/ci-target" if kind in ("linux-node", "android") else "refs/remotes/origin/checkout"
              sha = "refs/heads/main" if kind == "clawhub" else os.environ["CHECKOUT_SHA"]
              refs = [f"+{sha}:{target}"]
              base = os.environ.get("CHECKOUT_BASE_SHA") if kind == "linux-node" else None
              if base:
                  refs.append(f"+{base}:refs/remotes/origin/ci-ratchet-base")
              # Fetch full reader objects with the authenticated checkout, before its
              # credential scope ends and test workers create historical worktrees.
              refs.extend(prerequisites)
              fetch(workspace, *refs, prune=True, max_attempts=1 if reset else 3,
                    retry_codes=(124, 137) if kind == "skills" else ())
              run_git(workspace, "checkout", *(["--force"] if reset else []), "--detach",
                      sha if kind in ("linux-node", "android") else target)
              if kind == "android":
                  if not os.access(os.path.join(workspace, "apps/android/gradlew"), os.X_OK):
                      raise GitFailure(1)
                  return
              if kind in ("clawhub", "skills"):
                  return
              checkout_harness(sha)


          def main():
              global kind, workspace, remote, reset
              if len(sys.argv) > 1:
                  if sys.argv[1] == "--policy":
                      # The caller supplies trusted policy bytes; imports share this exact
                      # owner and its terminal lifecycle state, never a second supervisor.
                      sys.modules["ci_git_owner"] = sys.modules[__name__]
                      try:
                          if sys.argv[2] == "-":
                              exec(compile(sys.stdin.read(), "<git-policy>", "exec"), {"__name__": "__main__"})
                          else:
                              runpy.run_path(sys.argv[2], run_name="__main__")
                      finally:
                          if closed:
                              raise RuntimeError("Git owner is closed")
                          check_cancelled()
                      return
                  if sys.argv[1] not in ("--git", "--checkout-git"):
                      raise ValueError("Unknown Git owner command")
                  run_git(os.getcwd(), *sys.argv[3:], timeout=float(sys.argv[2]) or None,
                          reclaim_locks=sys.argv[1] == "--checkout-git")
                  return
              if git is None:
                  raise RuntimeError("Git unavailable")
              kind = os.environ.get("CHECKOUT_KIND", "linux-node" if linux else "platform")
              if kind == "prepare":
                  raise SystemExit(0)
              workspace = os.environ["GITHUB_WORKSPACE"]
              remote = f"https://github.com/{os.environ['\''CHECKOUT_REPO'\'']}.git"
              # The workflow'\''s token is repository-bound; never lend it to a sibling checkout.
              token = os.environ.pop("CHECKOUT_TOKEN", "")
              if token and os.environ["CHECKOUT_REPO"] == os.environ.get("GITHUB_REPOSITORY"):
                  checkout_environment.update(git_auth_environment(remote, token))
              del token
              if kind == "clawhub":
                  workspace = os.path.join(workspace, "clawhub-source")
              reset = kind in ("linux-node", "android", "clawhub")
              label = "ClawHub checkout" if kind == "clawhub" else "checkout"
              started_at = time.monotonic()
              try:
                  for attempt in range(1, 6 if reset else 2):
                      try:
                          checkout()
                          if reset:
                              print(f"{label} attempt {attempt}/5 succeeded", flush=True)
                          if kind == "clawhub":
                              print(f"{label} completed in {int(time.monotonic() - started_at)}s", flush=True)
                          raise SystemExit(0)
                      except (FetchTimeout, GitFailure) as error:
                          # Only command failures are retryable. Ownership/inspection errors
                          # escape to the fail-closed boundary below, never workspace deletion.
                          check_cancelled()
                          if not reset:
                              raise SystemExit(124 if isinstance(error, FetchTimeout) else error.code)
                          print(f"::warning::{label} attempt {attempt}/5 failed", flush=True)
                          backoff(attempt * 5)
                  print(f"{label} failed after 5 attempts", file=sys.stderr)
                  raise SystemExit(1)
              finally:
                  checkout_environment.clear()


          def terminal_diagnostic(error, owner_code):
              # Code identity, not a filename supplied by policy, proves source provenance.
              codes = {id(owner_code): owner_code}
              pending = [owner_code]
              while pending:
                  for value in pending.pop().co_consts:
                      if type(value) is type(owner_code):
                          codes[id(value)] = value
                          pending.append(value)
              names = {value: value.__name__ for value in vars(builtins).values()
                       if isinstance(value, type) and issubclass(value, BaseException)}
              names.update({FetchTimeout: "FetchTimeout", GitFailure: "GitFailure"})
              records, seen, via = [], set(), "terminal"
              while error is not None and id(error) not in seen and len(records) < 4:
                  seen.add(id(error))
                  record = {"type": names.get(type(error), "unknown"), "via": via}
                  for field in ("errno", "winerror"):
                      value = getattr(error, field, None)
                      if type(value) is int and -(2 ** 31) <= value < 2 ** 32:
                          record[field] = value
                  frames, trace = [], error.__traceback__
                  # Bound traversal as well as output; malformed metadata cannot stall exit.
                  for _ in range(256):
                      if trace is None:
                          break
                      if type(trace) is not TracebackType:
                          raise TypeError
                      frame, code = trace.tb_frame, trace.tb_frame.f_code
                      if frame.f_globals is globals() and id(code) in codes and 0 < trace.tb_lineno < 2 ** 31:
                          frames.append({"function": code.co_name[:64], "line": trace.tb_lineno})
                          frames = frames[-6:]
                      trace = trace.tb_next
                  record["owner_frames"] = frames
                  if trace is not None:
                      record["traceback_truncated"] = 1
                  records.append(record)
                  cause = error.__cause__
                  error, via = (cause, "cause") if cause is not None else (error.__context__, "context")
              return records


          if __name__ == "__main__":
              exit_code, terminal_error = 0, None
              try:
                  main()
              except FetchTimeout:
                  exit_code = 124
              except GitFailure as error:
                  exit_code = error.code
              except Exception as error:
                  exit_code, terminal_error = 125, error
              # Leave the handler before diagnostics or exit can raise: older Python'\''s
              # implicit exception chaining can loop on an already-cyclic context.
              if terminal_error is not None:
                  name, diagnostic = "unknown", "unavailable"
                  try:
                      records = terminal_diagnostic(terminal_error, sys._getframe().f_code)
                      diagnostic = json.dumps(records, separators=(",", ":"))
                      name = records[0]["type"]
                  except BaseException:
                      pass  # Diagnostics must never replace the authoritative terminal exit.
                  try:
                      print(f"::error::Git ownership/setup failed ({name}); refusing reuse or retry", file=sys.stderr)
                      print(f"[ci-git-owner] diagnostic={diagnostic}", file=sys.stderr)
                  except BaseException:
                      pass
              raise SystemExit(exit_code)
          '
          # End generated CI Git owner.

      - name: Resolve checkout SHA
        id: checkout_ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted CI harness
        if: ${{ steps.checkout_ref.outputs.sha != github.workflow_sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-harness
          sparse-checkout: |
            /.github/actions/
            /scripts/
            /test/vitest/
            /config/ci-test-timings.json
            /packages/normalization-core/src/stable-stringify.ts
            /src/infra/node-runtime-executable.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate CI qualification dispatch
        id: qualification_dispatch
        if: github.event_name == 'workflow_dispatch' && (inputs.runner_backend != 'default' || inputs.ci_shape == 'main')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GATE: ${{ inputs.release_gate }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          TARGET_REF: ${{ inputs.target_ref }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          CI_SHAPE: ${{ inputs.ci_shape }}
          REQUESTED_RUNNER_PROFILE: ${{ inputs.runner_backend }}
          HISTORICAL_TARGET_TAG: ${{ inputs.historical_target_tag }}
          RELEASE_CANDIDATE_REF: ${{ inputs.release_candidate_ref }}
          TARGET_CONTEXT_REF: ${{ inputs.target_context_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "openclaw/openclaw" && "$RELEASE_GATE" == "true" && "$TARGET_REF" == "$WORKFLOW_REVISION" && "$TARGET_REF" == "$GITHUB_SHA" ]]
          [[ "$TARGET_REF" =~ ^[0-9a-f]{40}$ && "$PULL_REQUEST_NUMBER" =~ ^[1-9][0-9]*$ && "$RELEASE_SCOPE" == "full" ]]
          [[ -z "$HISTORICAL_TARGET_TAG$RELEASE_CANDIDATE_REF$TARGET_CONTEXT_REF" ]]
          case "$CI_SHAPE" in default | main) ;; *) exit 1 ;; esac
          case "$REQUESTED_RUNNER_PROFILE" in default | hybrid | runson) ;; *) exit 1 ;; esac
          permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq .permission)"
          case "$permission" in admin | maintain | write) ;; *) echo "CI qualification requires a repository maintainer" >&2; exit 1 ;; esac
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER" \
            --jq '{state,head:.head.sha,branch:.head.ref,repository:.head.repo.full_name,base:.base.ref,baseRepository:.base.repo.full_name}' > "$RUNNER_TEMP/qualification-pr.json"
          jq -e --arg sha "$TARGET_REF" --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" \
            '.state == "open" and .head == $sha and .branch == $branch and .repository == $repo and .baseRepository == $repo and .base == "main"' "$RUNNER_TEMP/qualification-pr.json"
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Resolve logical runner profile
        id: runner_profile
        env:
          CONFIGURED_RUNNER_PROFILE: ${{ vars.OPENCLAW_CI_RUNNER_BACKEND }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REQUESTED_RUNNER_PROFILE: ${{ inputs.runner_backend || 'default' }}
          QUALIFICATION_DISPATCH: ${{ steps.qualification_dispatch.outputs.eligible || 'false' }}
          CI_SHAPE: ${{ inputs.ci_shape || 'default' }}
        shell: bash
        run: |
          set -euo pipefail
          runner_profile="${CONFIGURED_RUNNER_PROFILE:-blacksmith}"
          case "$runner_profile" in
            github | hybrid | blacksmith | runson) ;;
            *) echo "OPENCLAW_CI_RUNNER_BACKEND must be github, hybrid, blacksmith, or runson" >&2; exit 1 ;;
          esac
          ci_qualification=false
          ci_shape=default
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${QUALIFICATION_DISPATCH:-false}" == "true" ]]; then
            ci_qualification=true
            ci_shape="${CI_SHAPE:-default}"
            if [[ "${REQUESTED_RUNNER_PROFILE:-default}" != "default" ]]; then
              runner_profile="$REQUESTED_RUNNER_PROFILE"
            fi
          elif [[ "${REQUESTED_RUNNER_PROFILE:-default}" != "default" || "${CI_SHAPE:-default}" != "default" ]]; then
            echo "Runner and shape overrides require an admitted CI qualification" >&2
            exit 1
          fi
          runson_requested=false
          if [[ "$runner_profile" == "runson" || "${REQUESTED_RUNNER_PROFILE:-default}" == "runson" ]]; then
            runson_requested=true
            runner_profile=hybrid
          fi
          qualified_runner_profile="$runner_profile"
          hosted_runner_profile_contract=false
          grep -Fq "hosted-runner-profile-contract-v1" .github/workflows/ci.yml &&
            hosted_runner_profile_contract=true
          fork_pull_request=false
          [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]] &&
            fork_pull_request=true
          # Forks cannot mount the trusted sticky disks and caches that size the
          # all-in-one lint/type jobs, so their check jobs keep the hosted stripes.
          if [[
            "$hosted_runner_profile_contract" == "true" &&
            (
              "$GITHUB_EVENT_NAME" == "workflow_dispatch" ||
              "$GITHUB_REPOSITORY" != "openclaw/openclaw" ||
              "$fork_pull_request" == "true"
            )
          ]]; then
            runner_profile=github
          fi
          node_runner_backend="$runner_profile"
          # Plan fork first attempts for their available backend (Blacksmith when
          # repository variables are absent), independently of the author.
          # Fork retries route hosted because forks cannot read the backend override.
          if [[
            "$hosted_runner_profile_contract" == "true" &&
            "$fork_pull_request" == "true" &&
            "$GITHUB_REPOSITORY" == "openclaw/openclaw" &&
            "${GITHUB_RUN_ATTEMPT:-1}" == "1"
          ]]; then
            node_runner_backend="$qualified_runner_profile"
          fi
          qualification_runner_backend=
          if [[ "$ci_qualification" == "true" && "${GITHUB_RUN_ATTEMPT:-1}" == "1" ]]; then
            runner_profile="$qualified_runner_profile"
            node_runner_backend="$qualified_runner_profile"
            qualification_runner_backend="$qualified_runner_profile"
          fi
          # Ordinary pushes retain hybrid; only admitted qualification may opt in on a main shape.
          if [[ "$runson_requested" == "true" && "$GITHUB_REPOSITORY" == "openclaw/openclaw" && "${GITHUB_RUN_ATTEMPT:-1}" == "1" ]] &&
            grep -Fq "runson-runner-profile-contract-v1" .github/workflows/ci.yml &&
            [[ ( "$GITHUB_EVENT_NAME" == "pull_request" && "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ) || "$ci_qualification" == "true" ]]; then
            runner_profile=hybrid
            node_runner_backend=runson
          fi
          printf '%s\n' \
            "hosted_runner_profile_contract=$hosted_runner_profile_contract" \
            "ci_qualification=$ci_qualification" \
            "ci_shape=$ci_shape" \
            "qualification_runner_backend=$qualification_runner_backend" \
            "runner_profile=$runner_profile" \
            "node_runner_backend=$node_runner_backend" >> "$GITHUB_OUTPUT"
      - name: Resolve exact diff base
        id: diff_base
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha || '' }}
          GH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && !inputs.release_gate && github.token || '' }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          RELEASE_GATE: ${{ inputs.release_gate }}
        run: |
          set -euo pipefail
          base_sha="$EVENT_BASE_SHA"
          head_sha="$(git rev-parse HEAD)"
          # Full scheduled validation has no change range. Pin the checkout itself
          # for consumers that require a protocol/lockfile comparison ref.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            base_sha="$head_sha"
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$base_sha" =~ ^0+$ ]]; then
            echo "::error title=ambiguous main push::github.event.before is zero; refusing to infer a diff base for a created or recreated main branch." >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # A long-lived PR event can retain an old base SHA. The tested merge
            # commit's first parent is the exact target tree for this run.
            base_sha="$(node scripts/lib/merge-head-diff-base.mjs \
              --base "$base_sha" --head HEAD --prefer-first-parent)"
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$RELEASE_GATE" != "true" ]; then
            encoded_ref="$(jq -rn --arg value "refs/heads/${DEFAULT_BRANCH}" '$value | @uri')"
            default_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${encoded_ref}" --jq .sha)"
            if [[ ! "$default_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Could not resolve the default branch head for the manual target." >&2
              exit 1
            fi
            echo "default_sha=$default_sha" >> "$GITHUB_OUTPUT"
            base_sha="$(
              gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/compare/${default_sha}...${head_sha}" \
                --jq '.merge_base_commit.sha'
            )"
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$RELEASE_GATE" = "true" ]; then
            merge_ref="refs/remotes/origin/release-gate-merge"
            python3 -I -S "$RUNNER_TEMP/ci-git-owner.py" --checkout-git 120 fetch \
              --no-tags --no-recurse-submodules --depth=2 origin \
              "+refs/pull/${PULL_REQUEST_NUMBER}/merge:${merge_ref}"
            release_gate_head="$(git rev-parse "${merge_ref}^2")"
            target_head="$(git rev-parse HEAD)"
            if [ "$release_gate_head" != "$target_head" ]; then
              echo "release_gate pull request head ${release_gate_head} does not match target ${target_head}" >&2
              exit 1
            fi
            base_sha="$(git rev-parse "${merge_ref}^1")"
            head_sha="$(git rev-parse "$merge_ref")"
          fi
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve an exact diff base for ${GITHUB_EVENT_NAME}." >&2
            exit 1
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Validate historical release target
        id: historical_target
        if: inputs.historical_target_tag != ''
        env:
          EXPECTED_SHA: ${{ steps.checkout_ref.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          HISTORICAL_TARGET_TAG: ${{ inputs.historical_target_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$HISTORICAL_TARGET_TAG" =~ ^v[0-9]{4}\.[0-9]+\.[0-9]+((-(alpha|beta)\.[0-9]+)|(-[1-9][0-9]*))?$ ]]; then
            echo "historical_target_tag must be a canonical OpenClaw release tag." >&2
            exit 1
          fi
          encoded_ref="$(jq -rn --arg value "refs/tags/${HISTORICAL_TARGET_TAG}" '$value | @uri')"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${encoded_ref}" --jq .sha)"
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Historical release tag ${HISTORICAL_TARGET_TAG} does not resolve to ${EXPECTED_SHA}." >&2
            exit 1
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Validate release candidate target
        id: release_candidate_target
        if: inputs.release_candidate_ref != ''
        env:
          EXPECTED_SHA: ${{ steps.checkout_ref.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_CANDIDATE_REF: ${{ inputs.release_candidate_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_CANDIDATE_REF" =~ ^(release/[0-9]{4}\.[0-9]+\.[0-9]+(-[1-9][0-9]*)?|extended-stable/[0-9]{4}\.[0-9]+\.33)$ ]]; then
            echo "release_candidate_ref must be a canonical OpenClaw release branch." >&2
            exit 1
          fi
          encoded_ref="$(jq -rn --arg value "refs/heads/${RELEASE_CANDIDATE_REF}" '$value | @uri')"
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${encoded_ref}" --jq .sha)"
          if [[ "$branch_sha" != "$EXPECTED_SHA" ]]; then
            echo "Release candidate branch ${RELEASE_CANDIDATE_REF} does not resolve to ${EXPECTED_SHA}." >&2
            exit 1
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Validate target context
        id: target_context_target
        if: inputs.target_context_ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_CONTEXT_REF: ${{ inputs.target_context_ref }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_CONTEXT_REF" =~ ^(release/[0-9]{4}\.[0-9]+\.[0-9]+(-[1-9][0-9]*)?|extended-stable/[0-9]{4}\.[0-9]+\.33)$ ]]; then
            echo "target_context_ref must be a canonical OpenClaw release branch." >&2
            exit 1
          fi
          if [[ ! "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_context_ref requires target_ref to be a full commit SHA." >&2
            exit 1
          fi
          encoded_ref="$(jq -rn --arg value "refs/heads/${TARGET_CONTEXT_REF}" '$value | @uri')"
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${encoded_ref}" --jq .sha)"
          if [[ ! "$branch_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_context_ref branch ${TARGET_CONTEXT_REF} does not exist." >&2
            exit 1
          fi
          comparison_status="$(
            gh api "repos/${GITHUB_REPOSITORY}/compare/${TARGET_REF}...${branch_sha}" --jq .status
          )"
          if [[ "$comparison_status" != "ahead" && "$comparison_status" != "identical" ]]; then
            echo "target_ref must be the declared release branch head or one of its ancestors." >&2
            exit 1
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Setup manifest TypeScript runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve release correction base
        id: release_correction_base
        if: github.event_name == 'workflow_dispatch' && (inputs.release_scope == 'npm-beta' || inputs.release_scope == 'npm-stable')
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_CONTEXT_REF: ${{ steps.target_context_target.outputs.eligible == 'true' && inputs.target_context_ref || steps.historical_target.outputs.eligible == 'true' && inputs.historical_target_tag || '' }}
        run: |
          # Keep the token outside the manifest step, which imports candidate-owned code.
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          import { resolveReleaseContextIdentity } from './.ci-harness/scripts/lib/release-context.mjs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const identity = resolveReleaseContextIdentity(process.env.TARGET_CONTEXT_REF, version);
          if (identity?.baseTag) {
            const ref = encodeURIComponent(`refs/tags/${identity.baseTag}`);
            const sha = execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/commits/${ref}`, '--jq', '.sha'], { encoding: 'utf8' }).trim();
            if (!/^[0-9a-f]{40}$/u.test(sha)) throw new Error(`Could not resolve correction base ${identity.baseTag}.`);
            appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\n`);
          }
          NODE

      - name: Classify candidate cache trust
        id: candidate_trust
        env:
          CHECKOUT_REVISION: ${{ steps.checkout_ref.outputs.sha }}
          DEFAULT_SHA: ${{ steps.diff_base.outputs.default_sha }}
          HISTORICAL_TARGET: ${{ steps.historical_target.outputs.eligible || 'false' }}
          RELEASE_CANDIDATE_TARGET: ${{ steps.release_candidate_target.outputs.eligible || 'false' }}
          RELEASE_GATE: ${{ inputs.release_gate && 'true' || 'false' }}
          TARGET_CONTEXT_TARGET: ${{ steps.target_context_target.outputs.eligible || 'false' }}
          TARGET_REF: ${{ inputs.target_ref }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail

          trust=untrusted
          cache_mode=off
          cache_write_allowed=false

          if [[ ( "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "schedule" ) && "$GITHUB_REF" == "refs/heads/main" ]]; then
            trust=main
            cache_mode=restore
            cache_write_allowed=true
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            trust=pull-request
            cache_mode=restore
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$RELEASE_GATE" == "true" ]]; then
              trust=pull-request
              cache_mode=restore
            elif [[
              "$HISTORICAL_TARGET" == "true" ||
              "$RELEASE_CANDIDATE_TARGET" == "true" ||
              "$TARGET_CONTEXT_TARGET" == "true"
            ]]; then
              trust=release
              cache_mode=restore
              cache_write_allowed=true
            elif [[ -n "$DEFAULT_SHA" && "$CHECKOUT_REVISION" == "$DEFAULT_SHA" ]]; then
              trust=main
              cache_mode=restore
              cache_write_allowed=true
            elif [[ -z "$TARGET_REF" && "$CHECKOUT_REVISION" == "$WORKFLOW_REVISION" ]]; then
              trust=workflow
              cache_mode=restore
            fi
          fi

          {
            echo "trust=$trust"
            echo "cache_mode=$cache_mode"
            echo "cache_write_allowed=$cache_write_allowed"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure preflight base commit
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        uses: ./.ci-harness/.github/actions/ensure-base-commit
        with:
          base-sha: ${{ steps.diff_base.outputs.sha }}
          fetch-ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.base.ref }}

      - name: Detect docs-only changes
        id: docs_scope
        if: (github.event_name != 'workflow_dispatch' && github.event_name != 'schedule') || steps.runner_profile.outputs.ci_qualification == 'true'
        uses: ./.ci-harness/.github/actions/detect-docs-changes
        with:
          base-sha: ${{ steps.diff_base.outputs.sha }}

      - name: Detect changed scopes
        id: changed_scope
        if: (github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' && steps.docs_scope.outputs.docs_only != 'true') || (github.event_name == 'workflow_dispatch' && inputs.release_gate)
        shell: bash
        env:
          OPENCLAW_ALLOW_RELEASE_GENERATED_MIX: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ steps.diff_base.outputs.sha }}"
            node scripts/ci-changed-scope.mjs --base "$BASE" --head HEAD
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ steps.diff_base.outputs.sha }}"
            node scripts/ci-changed-scope.mjs --base "$BASE" --head HEAD --merge-head-first-parent
          else
            BASE="${{ steps.diff_base.outputs.sha }}"
            HEAD_SHA="${{ steps.diff_base.outputs.head_sha }}"
            node scripts/ci-changed-scope.mjs --base "$BASE" --head "$HEAD_SHA"
          fi

      - name: Setup manifest pnpm
        if: github.event_name == 'workflow_dispatch' && steps.checkout_ref.outputs.sha != github.workflow_sha
        uses: ./.ci-harness/.github/actions/setup-pnpm-store-cache
        with:
          cache-mode: ${{ steps.candidate_trust.outputs.cache_mode }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Install manifest dependencies
        if: github.event_name == 'workflow_dispatch' && steps.checkout_ref.outputs.sha != github.workflow_sha
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Check hybrid hosted assignment health
        id: hosted_health
        if: contains(fromJSON('["hybrid","runson"]'), (steps.runner_profile.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && steps.runner_profile.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND)) && github.run_attempt == 1 && github.repository == 'openclaw/openclaw' && steps.changed_scope.outputs.run_node == 'true' && steps.changed_scope.outputs.run_node_fast_only != 'true' && (steps.qualification_dispatch.outputs.eligible == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && steps.changed_scope.outputs.run_windows == 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync } from "node:fs";
          // Current PRs and validated exact-head qualification share this admission owner.
          import { inspectHybridHostedHealth } from "./scripts/lib/ci-hybrid-hosted-health.mts";
          const health = await inspectHybridHostedHealth({
            repository: process.env.GITHUB_REPOSITORY,
            runId: process.env.GITHUB_RUN_ID,
            token: process.env.GH_TOKEN,
          });
          appendFileSync(process.env.GITHUB_OUTPUT, `healthy=${health.healthy}\n`);
          const summary = `Hybrid hosted assignment: ${health.reason}; ${health.sampledJobs} sampled jobs, maximum wait ${health.maxWaitSeconds}s.`;
          console.log(health.healthy ? summary : `::warning::${summary} Retaining additional checks on Blacksmith.`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n\n`);
          EOF

      # android-ci-contract-v2: frozen targets support the current Android CI tasks.
      # android-ci-contract-v3: phone variants, Wear modules, Android lint, benchmark, and ktlint.
      # ui-e2e-projects-contract-v1: named projects are declared by the target's UI E2E config.
      - name: Build CI manifest
        id: manifest
        env:
          OPENCLAW_CI_DOCS_ONLY: ${{ github.event_name == 'schedule' && 'false' || github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'false' || steps.docs_scope.outputs.docs_only }}
          OPENCLAW_CI_DOCS_CHANGED: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'true' || steps.docs_scope.outputs.docs_changed }}
          OPENCLAW_CI_RUN_NODE: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'true' || steps.changed_scope.outputs.run_node || 'false' }}
          OPENCLAW_CI_NODE_TEST_DATA_ONLY: ${{ steps.changed_scope.outputs.node_test_data_only || 'false' }}
          OPENCLAW_CI_NODE_SELECTION: ${{ vars.OPENCLAW_CI_NODE_SELECTION }}
          # release_gate retains the PR Apple scope.
          OPENCLAW_CI_RUN_MACOS: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && !inputs.release_gate && 'true' || steps.changed_scope.outputs.run_macos || 'false' }}
          OPENCLAW_CI_RUN_MACOS_NODE: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && !inputs.release_gate && 'true' || steps.changed_scope.outputs.run_macos_node || 'false' }}
          OPENCLAW_CI_RUN_IOS_BUILD: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && !inputs.release_gate && 'true' || steps.changed_scope.outputs.run_ios_build || 'false' }}
          OPENCLAW_CI_RUN_IOS_SCREENSHOTS: ${{ steps.changed_scope.outputs.run_ios_screenshots || 'false' }}
          OPENCLAW_CI_RUN_ANDROID: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && ((inputs.release_gate && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true')) || inputs.include_android) && 'true' || steps.changed_scope.outputs.run_android || 'false' }}
          OPENCLAW_CI_RUN_WINDOWS: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && !inputs.release_gate && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'true' || steps.changed_scope.outputs.run_windows || 'false' }}
          OPENCLAW_CI_RUN_NODE_FAST_ONLY: ${{ github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'false' || steps.changed_scope.outputs.run_node_fast_only || 'false' }}
          OPENCLAW_CI_RUN_NODE_FAST_PLUGIN_CONTRACTS: ${{ github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'false' || steps.changed_scope.outputs.run_node_fast_plugin_contracts || 'false' }}
          OPENCLAW_CI_RUN_NODE_FAST_CI_ROUTING: ${{ github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'false' || steps.changed_scope.outputs.run_node_fast_ci_routing || 'false' }}
          OPENCLAW_CI_RUN_SKILLS_PYTHON: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'true' || steps.changed_scope.outputs.run_skills_python || 'false' }}
          OPENCLAW_CI_RUN_CONTROL_UI_I18N: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && (steps.runner_profile.outputs.node_runner_backend != 'runson' && steps.runner_profile.outputs.ci_qualification != 'true') && 'true' || steps.changed_scope.outputs.run_control_ui_i18n || 'false' }}
