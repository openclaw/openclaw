name: BR original auth envelope replay5

# Task-only proof ref. Never merge this replacement workflow or its helper.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-auth-replay5-${{ github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.22.1"

jobs:
  auth-envelope:
    if: >-
      github.repository == 'openclaw/openclaw' && github.actor == 'roboclaw-bot' &&
      github.ref == 'refs/heads/roboclaw/br-auth-replay5' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout pinned reviewed diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dcf81e57e3d172b2530153dbefb15252edbcd613
          persist-credentials: false
          fetch-depth: 1
      - name: Obtain and admit exact task recipe
        id: recipe
        shell: bash
        env:
          RECIPE_SHA: ${{ github.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RECIPE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$RECIPE_SHA"
          recipe_dir="$RUNNER_TEMP/br-auth-replay5"
          mkdir -m 700 "$recipe_dir"
          for file in br-auth-replay5.py br-auth-replay5-envelope.json br-auth-replay5-source.json; do
            git show "${RECIPE_SHA}:scripts/$file" > "$recipe_dir/$file"
          done
          (cd "$recipe_dir" && sha256sum --check <<'DIGESTS'
          ff090d0a92e0afa40628bbcc82e3e46d24c84922b288185a6ff435d4df577088  br-auth-replay5.py
          161b3856132d2e5fe53d5629dd8937f6905e79a1b563824745a1445ba0e99859  br-auth-replay5-envelope.json
          261cc7bd1a17720c268e2ce3d5eeffaf2441486cee0beb6f1d5d4f45b93786e5  br-auth-replay5-source.json
          DIGESTS
          )
          echo "verified=true" >> "$GITHUB_OUTPUT"
          python3 "$recipe_dir/br-auth-replay5.py" admit
      - name: Setup original Node environment
        uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          cache-mode: restore
          node-version: "24.22.1"
          install-bun: "false"
          dependency-cache: "false"
          vitest-fs-cache: "true"
          vitest-worker-cache: "false"
          node-compile-cache: "true"
      - name: Setup original pinned Bun
        uses: ./.github/actions/setup-test-bun
      - name: Run frozen original auth envelope through its unchanged owner
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CHECKOUT_BASE_SHA: 8b9e240149fb8c3c871f92a653a0423fcc8b320d
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_CI_TEST_RUNTIME_POLICY: bun-all
          FROZEN_TARGET: "false"
          OPENCLAW_NODE_TEST_VITEST_ARGS_JSON: "[]"
          OPENCLAW_VITEST_MAX_WORKERS: "3"
          OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: "300000"
          OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: "1"
        run: python3 "$RUNNER_TEMP/br-auth-replay5/br-auth-replay5.py" run
      - name: Seal complete observations and natural process closeout
        if: always() && steps.recipe.outputs.verified == 'true'
        shell: bash
        run: python3 "$RUNNER_TEMP/br-auth-replay5/br-auth-replay5.py" finalize
      - name: Retain proof before disposable runner teardown
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: br-auth-replay5-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/br-auth-replay5/evidence
          if-no-files-found: error
          retention-days: 14
