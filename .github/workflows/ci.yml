# Diagnostic-only branch. Never merge this workflow into the release branch.
name: Release 37 UI diagnostic (non-qualifying)
run-name: Release 37 original-shard diagnostic ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact diagnostic commit; must equal the workflow commit
        required: true
        type: string
      dispatch_id:
        description: Unique diagnostic request identity
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release37-ui-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  initial-send:
    if: github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/openclaw/release37-ui-diagnostic-nov8'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 40
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NODE_VERSION: "24.22.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact diagnostic identity
        env:
          EXPECTED_SHA: ${{ inputs.target_ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = "$WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Diagnostic source: $EXPECTED_SHA; not release qualification" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.22.1"
          install-bun: "false"
          cache-mode: restore
          dependency-cache: "true"
      - uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore
      - name: Build exact diagnostic source
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
        run: pnpm build
      - name: Restore original failed shard selection
        env:
          INCLUDE_PATTERNS: '["ui/src/e2e/quota-reset-status.real-gateway.e2e.test.ts","ui/src/e2e/chat-flow.catalog-bootstrap.e2e.test.ts","ui/src/e2e/worker-initial-setup.real-gateway.e2e.test.ts","ui/src/e2e/agent-file-lifecycle.real-gateway.e2e.test.ts","ui/src/e2e/chat-composer-websearch-kill-switch.real-gateway.e2e.test.ts","ui/src/e2e/chat-agent-avatar.real-gateway.e2e.test.ts","ui/src/e2e/chat-stop-finished-run.real-gateway.e2e.test.ts","ui/src/e2e/chat-thinking-metadata.real-gateway.e2e.test.ts","ui/src/e2e/control-ui-auth-transports.e2e.test.ts","ui/src/e2e/cron-duration-save.real-gateway.e2e.test.ts","ui/src/e2e/device-alias-rename.real-gateway.e2e.test.ts","ui/src/e2e/logs-lifecycle.e2e.test.ts","ui/src/e2e/model-picker-search.real-gateway.e2e.test.ts","ui/src/e2e/profile-page.real-gateway.e2e.test.ts","extensions/qa-lab/src/session-host-command-state.real-gateway.e2e.test.ts","ui/src/e2e/session-progress-hovercard.real-gateway.e2e.test.ts","extensions/qa-lab/src/control-ui-media-transcript.real-gateway.e2e.test.ts","extensions/qa-lab/src/control-ui-openclaw-delegation.real-gateway.e2e.test.ts","extensions/qa-lab/src/control-ui-automation-management.real-gateway.e2e.test.ts"]'
        run: |
          mkdir -p .artifacts
          node -e 'const fs = require("node:fs"); const paths = JSON.parse(process.env.INCLUDE_PATTERNS); if (paths.length !== 19) throw new Error("Expected original 19-file shard"); fs.writeFileSync(".artifacts/release37-ui-shard-include.json", JSON.stringify(paths));'
      - name: Diagnose original 19-file shard
        env:
          OPENCLAW_VITEST_INCLUDE_FILE: .artifacts/release37-ui-shard-include.json
          OPENCLAW_CAPTURE_UI_PROOF: "0"
          OPENCLAW_UI_E2E_ARTIFACT_DIR: .artifacts/release37-ui-diagnostic
          OPENCLAW_UI_E2E_DIAGNOSTIC_DIR: .artifacts/release37-ui-timeouts
        run: |
          node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-e2e-prebuilt.config.ts --configLoader runner --reporter verbose --reporter github-actions --reporter default --reporter ./scripts/lib/vitest-resource-reporter.mts --exclude ui/src/e2e/desktop-resize.real-gateway.e2e.test.ts
      - name: Retain only sanitized diagnostic counters
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release37-ui-diagnostic-${{ github.run_id }}
          path: |
            .artifacts/release37-ui-diagnostic/stop-finished-run-*/proof.json
            .artifacts/release37-ui-timeouts/failure-*/failure.public.json
          if-no-files-found: warn
          retention-days: 7
