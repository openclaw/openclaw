            pnpm check:line-cap-ratchet --base "$base_ref"
          fi
          pnpm check:assertion-safety --base "$base_ref"
          pnpm check:database-worker-ratchet --base "$base_ref"
          pnpm check:test-timeout-race-ratchet --base "$base_ref"
          pnpm config:docs:check
