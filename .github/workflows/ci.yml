          fi
          python3 - <<'PY'
          import os
          import signal
          import subprocess
          import time

          def interrupted(signum, _frame):
              raise SystemExit(128 + signum)

          signal.signal(signal.SIGTERM, interrupted)
          preparation = None
          log_path = os.path.join(os.environ["RUNNER_TEMP"], "ios-simulator-prepare.log")
          started = time.monotonic()
          with open(log_path, "w+") as log:
              try:
                  if os.environ.get("IOS_SIMULATOR_ID"):
                      preparation = subprocess.Popen(["/bin/bash", "-euo", "pipefail", "-c", '''
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
          if [[ -x ./scripts/install-simslim.sh && -x ./scripts/ios-simulator-prepare.sh ]]; then
            simslim_dir="$RUNNER_TEMP/openclaw-simslim"
            ./scripts/install-simslim.sh "$simslim_dir"
            OPENCLAW_CI_SIMSLIM_BINARY="$simslim_dir/simslim" \
              ./scripts/ios-simulator-prepare.sh "$IOS_SIMULATOR_ID"
          fi
          '''], stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                  if os.environ["HISTORICAL_TARGET"] != "true" and (
                      os.environ["IOS_CI_PHASE"] == "smoke" or os.environ.get("IOS_FROZEN_TARGET") != "true"
                  ):
                      subprocess.run(["pnpm", "ios:gen"], check=True)
                      if os.environ.get("IOS_MAIN_TIER") == "true" and os.environ.get("IOS_FROZEN_TARGET") != "true":
                          subprocess.run(["python3", "-I", "-S", ".ci-harness/scripts/swift-build-cache-metadata.py", "restore", "ios"], check=True)
                      package_args = [] if os.environ.get("IOS_FROZEN_TARGET") == "true" else [
                          "-clonedSourcePackagesDirPath", os.path.abspath("apps/ios/build/SourcePackages"),
                      ]
                      subprocess.run([
                          "python3", ".ci-harness/scripts/ci-xcodebuild.py",
                          "-project", "apps/ios/OpenClaw.xcodeproj",
                          "-scheme", "OpenClaw",
                          "-configuration", "Debug",
                          *package_args,
                          "-destination", os.environ.get("IOS_DEST") or "generic/platform=iOS Simulator",
                          "-showBuildTimingSummary",
                          "build-for-testing",
                      ], check=True)
                      with open(os.environ["GITHUB_ENV"], "a") as environment:
                          environment.write("IOS_TEST_BUILD_PREPARED=true\n")
                  else:
                      subprocess.run(["pnpm", "ios:build"], check=True)
                  print(f"iOS app build: {time.monotonic() - started:.1f}s", flush=True)
                  if preparation:
                      # Bound the join even if boot or SimSlim never completes.
                      result = preparation.wait(timeout=max(1, 600 - (time.monotonic() - started)))
                      if result:
                          raise SystemExit(result if result > 0 else 1)
              except subprocess.TimeoutExpired:
                  print("::error::iOS simulator preparation exceeded 600s", flush=True)
                  raise SystemExit(1)
              finally:
                  if preparation and preparation.poll() is None:
                      try:
                          os.killpg(preparation.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      preparation.wait()
                  log.seek(0)
                  print(log.read(), flush=True)
                  print(f"iOS build and simulator preparation: {time.monotonic() - started:.1f}s", flush=True)
          PY
      - name: Swift lint
        if:
          ${{ (!cancelled() && steps.ios-swift-tools.outcome == 'success' && ('tests' == 'smoke' || 'tests' == 'tests') &&
