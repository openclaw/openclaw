      - name: Run focused Apple Watch operation simulator tests
        if:
          ${{ (!cancelled() && steps.ios-app-build.outcome == 'success' && steps.ios-simulator.outcome == 'success' && 'tests'
          == 'tests' && 'full' != 'main' && 'false' != 'true') && steps.frv-environment.outcome == 'success' }}
        run: |
          frv_xcodebuild() { python3 "$FRV_OBSERVER" --events "$FRV_WATCH_EVENTS" --label xcodebuild -- xcodebuild "$@"; }
          frv_xcrun() { python3 "$FRV_OBSERVER" --events "$FRV_WATCH_EVENTS" --label xcrun -- xcrun "$@"; }
          set -euo pipefail
          source .ci-harness/scripts/lib/swift-toolchain.sh
          project_args=(-project apps/ios/OpenClaw.xcodeproj)
          if [[ "$HISTORICAL_TARGET" != "true" && "$IOS_FROZEN_TARGET" != "true" ]]; then
            project_args+=(-clonedSourcePackagesDirPath "$PWD/apps/ios/build/SourcePackages")
          fi
          simulator_id="$(
            frv_xcrun simctl list devices available --json | node --input-type=module -e '
              const chunks = [];
              for await (const chunk of process.stdin) chunks.push(chunk);
              const runtimes = JSON.parse(Buffer.concat(chunks).toString("utf8")).devices;
              const simulator = Object.values(runtimes)
                .flat()
                .find((device) => device.isAvailable && device.name.startsWith("Apple Watch"));
              if (!simulator) {
                console.error("No available Apple Watch simulator for operation lifecycle tests");
                process.exit(1);
              }
              process.stdout.write(simulator.udid);
            '
          )"
          # Reuse the Watch products already compiled by the generic iOS build.
          # Resolve the selected target product from Xcode, not its DerivedData naming.
          xcodebuild_args=(
            "${project_args[@]}"
            -scheme OpenClawWatchApp
            -configuration Debug
            -destination "platform=watchOS Simulator,id=${simulator_id}"
            CODE_SIGNING_ALLOWED=NO
          )
          test_args=(
            -parallel-testing-enabled NO
            -only-testing:OpenClawWatchTests/WatchInboxStoreOperationTests
            -only-testing:OpenClawWatchTests/WatchSpeechPlaybackTests
            -only-testing:OpenClawWatchTests/WatchRealtimeMediaTests
            -only-testing:OpenClawWatchTests/WatchGatewayConfigurationTests
            -only-testing:OpenClawWatchTests/WatchTypographyTests
          )
          run_apple_command_logged apps/ios/build/LifecycleTestResults/OpenClawWatchBuild.log frv_xcodebuild \
            "${xcodebuild_args[@]}" "${test_args[@]}" build-for-testing
          app_path="$(
            frv_xcodebuild "${xcodebuild_args[@]}" -showBuildSettings -json |
              node --input-type=module -e '
                import path from "node:path";
                const chunks = [];
                for await (const chunk of process.stdin) chunks.push(chunk);
                const targets = JSON.parse(Buffer.concat(chunks).toString("utf8"))
                  .filter((target) => target.target === "OpenClawWatchApp");
                if (targets.length !== 1) throw new Error("Expected one Watch app target from Xcode");
                const { TARGET_BUILD_DIR, FULL_PRODUCT_NAME } = targets[0].buildSettings;
                if (!path.isAbsolute(TARGET_BUILD_DIR) || !FULL_PRODUCT_NAME) {
                  throw new Error("Expected an absolute Watch app product from Xcode");
                }
                process.stdout.write(path.join(TARGET_BUILD_DIR, FULL_PRODUCT_NAME));
              '
          )"
          companion_id="$(
            frv_xcrun simctl list pairs --json | node --input-type=module -e '
              const chunks = [];
              for await (const chunk of process.stdin) chunks.push(chunk);
              const pairs = Object.values(JSON.parse(Buffer.concat(chunks).toString("utf8")).pairs);
              const pair = pairs.find((entry) => entry.watch.udid === process.argv[1]);
              process.stdout.write(pair?.phone.udid ?? "");
            ' "$simulator_id"
          )"
          # XCTest connects through the paired phone, which can differ from IOS_SIMULATOR_ID.
          if [[ -n "$companion_id" ]]; then
            frv_xcrun simctl bootstatus "$companion_id" -b
          fi
          frv_xcrun simctl boot "$simulator_id" 2>/dev/null || true
          frv_xcrun simctl bootstatus "$simulator_id" -b
          frv_xcrun simctl install "$simulator_id" "$app_path"
          run_apple_command_logged apps/ios/build/LifecycleTestResults/OpenClawWatchOperationTests.log frv_xcodebuild \
            "${xcodebuild_args[@]}" "${test_args[@]}" \
            -resultBundlePath apps/ios/build/LifecycleTestResults/OpenClawWatchOperationTests.xcresult \
            test-without-building
        id: frv-source-23
        env:
          FRV_OBSERVER: ${{ env.FRV_CONTROL }}/observe-command.py
          FRV_WATCH_EVENTS: ${{ env.FRV_CONTROL }}/bundle/candidate/watch-events.jsonl
      - name: Record iOS build-cache input metadata
        id: record-ios-build-cache-metadata
        if:
          ${{ (success() && steps.ios-build-cache.outputs.cache-primary-key != '' && steps.ios-build-cache.outputs.cache-hit
          != 'true' && 'false' == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'schedule') && steps.frv-environment.outcome
          == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        run: python3 -I -S scripts/swift-build-cache-metadata.py record ios
      - name: Save iOS test build products
        if:
