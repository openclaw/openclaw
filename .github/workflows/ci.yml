        TARGET_SHA: 6d306591d7373a89dd06f6258c0955708079030b
      run: node .ci-harness/scripts/macos-native-runtime-artifact.mjs restore .artifacts/macos-native-runtime "$TARGET_SHA"
        >> "$GITHUB_PATH"
    - name: Swift test
      id: swift-test
      if: ${{ !cancelled() && steps.select-xcode.outcome == 'success' && steps.macos-native-assets.outcome == 'success' &&
        matrix.phase == 'tests' && steps.swift-test-build.outcome == 'success' && (hashFiles('apps/macos/Sources/OpenClaw/NativeExecPolicyOwner.swift')
        == '' || steps.native-test-cli.outcome == 'success') }}
      run: |
        set -euo pipefail
        source .ci-harness/scripts/lib/swift-toolchain.sh
        native_test_log_dir="$RUNNER_TEMP/openclaw-native-test-logs"
        native_test_log_id="$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
        swift_test_args=(--package-path apps/macos --build-system native --enable-code-coverage --disable-index-store -Xswiftc -gline-tables-only --skip-build)
        source .ci-harness/scripts/ci-collect-checks.sh
        if [[ -f scripts/test-macos-native.mts ]]; then
          logical_cpu="$(sysctl -n hw.logicalcpu)"
          if [[ ! "$logical_cpu" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid macOS logical CPU count: $logical_cpu" >&2
            exit 1
          fi
          swift_test_width=$(( logical_cpu < 12 ? logical_cpu : 12 ))
          echo "[macos-swift] Swift Testing parallelization width: $swift_test_width"
          swift_test_args+=(--experimental-maximum-parallelization-width "$swift_test_width")
          # Quick Chat keeps XCTest process isolation: parallel suites take key status and dismiss its
          # panel. Frozen targets without the suite skip the lane.
          if [[ "$HISTORICAL_TARGET" != "true" || -f apps/macos/Tests/OpenClawIPCTests/QuickChatCatalogPresentationTests.swift ]]; then
            run_check "macOS default profile" run_apple_command_logged "$native_test_log_dir/default-$native_test_log_id.log" node scripts/test-macos-native.mts default "${swift_test_args[@]}" --skip "AppStateIsolationTests|ProfileChatPreferencesTests|QuickChatCatalogPresentationTests"
            run_check "macOS default profile rendered chat" run_apple_command_logged "$native_test_log_dir/default-rendered-$native_test_log_id.log" node scripts/test-macos-native.mts default "${swift_test_args[@]}" --filter "QuickChatCatalogPresentationTests"
          else
            run_check "macOS default profile" run_apple_command_logged "$native_test_log_dir/default-$native_test_log_id.log" node scripts/test-macos-native.mts default "${swift_test_args[@]}" --skip "AppStateIsolationTests|ProfileChatPreferencesTests"
          fi
          run_check "macOS named profile" run_apple_command_logged "$native_test_log_dir/named-$native_test_log_id.log" node scripts/test-macos-native.mts named "${swift_test_args[@]}" --filter "AppStateIsolationTests|ProfileChatPreferencesTests"
        elif [[ "$HISTORICAL_TARGET" == "true" ]]; then
          # Frozen release targets predate the resource-owner script and its tests.
          # Their original suite still runs only on this disposable macOS worker.
          swift_test_args+=(--no-parallel)
          run_check "macOS frozen target tests" run_apple_command_logged "$native_test_log_dir/default-$native_test_log_id.log" swift test "${swift_test_args[@]}"
        else
          echo "Current CI targets must provide scripts/test-macos-native.mts." >&2
          exit 1
        fi
        finish_checks
    - name: Upload macOS native test logs
      if: ${{ always() && matrix.phase == 'tests' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: candidate-macos-native-test-logs
        path: ${{ runner.temp }}/openclaw-native-test-logs/*.log
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload default-profile chat menu captures
      if: ${{ always() && steps.swift-test.outputs.menu-default-artifact-path != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: candidate-macos-chat-menu-captures-default
        path: |
          ${{ runner.temp }}/openclaw-menu-default-*/*-window.png
          ${{ runner.temp }}/openclaw-menu-default-*/*-menu-*.png
          ${{ runner.temp }}/openclaw-menu-default-*/*-capture-status.json
          ${{ runner.temp }}/openclaw-menu-default-*/capture-export.json
        if-no-files-found: error
        retention-days: 7
    - name: Upload named-profile chat menu captures
      if: ${{ always() && steps.swift-test.outputs.menu-named-artifact-path != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: candidate-macos-chat-menu-captures-named
        path: |
          ${{ steps.swift-test.outputs.menu-named-artifact-path }}/*-window.png
          ${{ steps.swift-test.outputs.menu-named-artifact-path }}/*-menu-*.png
          ${{ steps.swift-test.outputs.menu-named-artifact-path }}/*-capture-status.json
          ${{ steps.swift-test.outputs.menu-named-artifact-path }}/capture-export.json
        if-no-files-found: error
        retention-days: 7
    - name: Setup bundled recovery runtime build
      id: recovery-runtime-setup
      if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && 'full' != 'main' && !false && 'full' == 'full' &&
        'false' != 'true' && matrix.phase == 'tests' && hashFiles('scripts/test-macos-app-host.sh') != '' && steps.swift-test-build.outputs.debug-tests-built
        == 'true' && steps.swift-test.outcome == 'success' }}
      uses: ./.ci-harness/.github/actions/setup-node-env
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache-mode: 'off'
        install-bun: 'false'
        build-all-cache-scope: full
    - name: Build bundled recovery runtime
      id: recovery-runtime-build
      if: ${{ !cancelled() && steps.recovery-runtime-setup.outcome == 'success' }}
      env:
        NODE_OPTIONS: --max-old-space-size=8192
        NATIVE_RUNTIME_PREPARED: ${{ steps.native-test-cli.outcome }}
      run: |
        set -euo pipefail
        if [[ "$BUNDLED_RECOVERY_RUNTIME" == "true" ]]; then
          [[ "$NATIVE_RUNTIME_PREPARED" == "success" ]]
          echo "Reusing the exact-source bundled recovery runtime from build-artifacts."
        else
          pnpm build:ci-artifacts
        fi
    - name: Prove bundled app recovery and relaunch
      id: bundled-recovery
      if: ${{ !cancelled() && steps.recovery-runtime-build.outcome == 'success' }}
      run: bash scripts/test-macos-app-host.sh
    - name: Upload bundled app recovery proof
      if: ${{ always() && steps.bundled-recovery.outputs.recovery-artifact-path != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: candidate-macos-bundled-recovery-proof
        path: ${{ steps.bundled-recovery.outputs.recovery-artifact-path }}
        if-no-files-found: error
        retention-days: 7
    - name: Render isolated macOS health fixtures
      id: health-render
      if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && 'full' != 'main' && !false && 'full' == 'full' &&
        steps.swift-test-build.outputs.debug-tests-built == 'true' && hashFiles('scripts/test-macos-health-render.sh') !=
        '' }}
      run: bash scripts/test-macos-health-render.sh
    - name: Upload macOS health component renders
      if: ${{ always() && steps.health-render.outputs.artifact-path != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: candidate-macos-health-component-renders
        path: |
          ${{ steps.health-render.outputs.artifact-path }}/ready.png
          ${{ steps.health-render.outputs.artifact-path }}/startup-grace.png
          ${{ steps.health-render.outputs.artifact-path }}/stale-socket.png
          ${{ steps.health-render.outputs.artifact-path }}/disabled.png
          ${{ steps.health-render.outputs.artifact-path }}/probe-permission.png
        if-no-files-found: error
        retention-days: 7
    - name: Check Swift cache save budget
      id: swift-cache-budget
      if: contains(fromJSON('["release","tests"]'), matrix.phase) && 'false' == 'true'
      continue-on-error: true
      timeout-minutes: 1
      env:
        CACHE_STARTED: ${{ steps.swift-cache-clock.outputs.started }}
      run: |
        python3 -I -S - <<'PYTHON'
        import os
        import time
        try:
            elapsed = time.monotonic() - float(os.environ.get("CACHE_STARTED", ""))
            allowed = 0 <= elapsed < 20 * 60
        except ValueError:
            allowed = False
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            print(f"allowed={str(allowed).lower()}", file=output)
        if not allowed:
            print("::notice::Skipping optional Swift cache saves: insufficient or unknown job budget.")
        PYTHON
    - name: Save SwiftPM cache
      continue-on-error: true
      timeout-minutes: 1
      if: matrix.phase == env.MACOS_PRIMARY_PHASE && 'false' == 'true' && steps.swiftpm-cache.outputs.cache-hit != 'true'
        && steps.swift-cache-budget.outputs.allowed == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/Library/Caches/org.swift.swiftpm
        key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}
    - name: Record Swift build input timestamps
      id: record-swift-build-cache-metadata
      continue-on-error: true
      timeout-minutes: 1
      if: '''false'' == ''true'' && steps.swift-build-cache.outputs.cache-hit != ''true'' && steps.swift-cache-budget.outputs.allowed
        == ''true'' && env.HISTORICAL_TARGET != ''true'''
      run: python3 -I -S scripts/swift-build-cache-metadata.py record
    - name: Save Swift build directory cache
      continue-on-error: true
      timeout-minutes: 2
      if: '''false'' == ''true'' && steps.swift-build-cache.outputs.cache-hit != ''true'' && steps.swift-cache-budget.outputs.allowed
        == ''true'' && (env.HISTORICAL_TARGET == ''true'' || steps.record-swift-build-cache-metadata.outcome == ''success'')'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: apps/macos/.build
        key: ${{ steps.swift-build-cache.outputs.cache-primary-key }}
    - name: Require complete native proof
      run: python3 -c 'import json,os; outcomes=json.loads(os.environ["FRV_REQUIRED_OUTCOMES"]); assert all(v == "success"
        for v in outcomes.values()), outcomes'
      if: always()
      env:
        FRV_REQUIRED_OUTCOMES: '{"select-xcode": "${{ steps.select-xcode.outcome }}", "macos-native-assets": "${{ steps.macos-native-assets.outcome
          }}", "swift-test-build": "${{ steps.swift-test-build.outcome }}", "native-runtime-download": "${{ steps.native-runtime-download.outcome
          }}", "native-test-cli": "${{ steps.native-test-cli.outcome }}", "swift-test": "${{ steps.swift-test.outcome }}",
          "recovery-runtime-setup": "${{ steps.recovery-runtime-setup.outcome }}", "recovery-runtime-build": "${{ steps.recovery-runtime-build.outcome
          }}", "bundled-recovery": "${{ steps.bundled-recovery.outcome }}", "health-render": "${{ steps.health-render.outcome
          }}"}'
    - name: Capture candidate completion
      run: python3 -I -S "$FRV_CONTROL/receipt.py" finish "candidate"
      if: always()
      env:
        FRV_JOB_STATUS: ${{ job.status }}
        FRV_REQUIRED_OUTCOMES: '{"select-xcode": "${{ steps.select-xcode.outcome }}", "macos-native-assets": "${{ steps.macos-native-assets.outcome
          }}", "swift-test-build": "${{ steps.swift-test-build.outcome }}", "native-runtime-download": "${{ steps.native-runtime-download.outcome
          }}", "native-test-cli": "${{ steps.native-test-cli.outcome }}", "swift-test": "${{ steps.swift-test.outcome }}",
          "recovery-runtime-setup": "${{ steps.recovery-runtime-setup.outcome }}", "recovery-runtime-build": "${{ steps.recovery-runtime-build.outcome
          }}", "bundled-recovery": "${{ steps.bundled-recovery.outcome }}", "health-render": "${{ steps.health-render.outcome
          }}"}'
    - name: Upload candidate environment receipt
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: frv-mac-candidate-receipt
        path: ${{ runner.temp }}/frv-control/candidate.json
        if-no-files-found: error
        retention-days: 1
