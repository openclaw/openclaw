  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: frv-mac-recovery-pair
  cancel-in-progress: false
env:
  NODE_VERSION: 24.22.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
