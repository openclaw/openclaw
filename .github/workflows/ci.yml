          node-version: 24.22.1
      - name: Record and verify pinned native environment
        id: frv-environment
        timeout-minutes: 2
        env:
          FRV_ARM: candidate
          FRV_SOURCE_SHA: 42cc98c75dd81e67c7a8fcd9f053da77f12b438a
        run: |
          python3 "$FRV_CONTROL/native-environment.py" capture "$FRV_CONTROL/bundle/candidate/environment.json"
      - name: Identify Apple Mermaid inputs
