        echo "OPENCLAWKIT_SCRATCH=$openclawkit_scratch" >> "$GITHUB_ENV"
        # Guard: chat-only consumers build OpenClawKit with the Talk trait
        # disabled and must NOT link ElevenLabsKit. Assert that future sources
