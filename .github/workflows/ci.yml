      run_check_plan: ${{ steps.manifest.outputs.run_check_plan }}
      shared_sdk_declarations: ${{ steps.manifest.outputs.shared_sdk_declarations }}
      check_plan_input_json: ${{ steps.manifest.outputs.check_plan_input_json }}
      check_matrix: ${{ steps.manifest.outputs.check_matrix }}
      core_type_matrix: ${{ steps.manifest.outputs.core_type_matrix }}
      lint_core_matrix: ${{ steps.manifest.outputs.lint_core_matrix }}
      lint_extension_matrix: ${{ steps.manifest.outputs.lint_extension_matrix }}
      central_lint_selection_json: ${{ steps.manifest.outputs.central_lint_selection_json }}
      run_lint_core: ${{ steps.manifest.outputs.run_lint_core }}
      run_lint_extensions: ${{ steps.manifest.outputs.run_lint_extensions }}
      run_changed_core_type_stripes: ${{ steps.manifest.outputs.run_changed_core_type_stripes }}
      type_graph_boundary_owner: ${{ steps.manifest.outputs.type_graph_boundary_owner }}
      run_check_additional: ${{ steps.manifest.outputs.run_check_additional }}
      check_additional_matrix: ${{ steps.manifest.outputs.check_additional_matrix }}
      run_check_docs: ${{ steps.manifest.outputs.run_check_docs }}
      run_format_check: ${{ steps.manifest.outputs.run_format_check }}
      compatibility_target: ${{ steps.manifest.outputs.compatibility_target }}
      run_control_ui_i18n: ${{ steps.manifest.outputs.run_control_ui_i18n }}
      strict_control_ui_i18n: ${{ github.event_name == 'workflow_dispatch' && !inputs.release_gate && 'true' || steps.changed_scope.outputs.strict_control_ui_i18n }}
      run_ui_tests: ${{ steps.manifest.outputs.run_ui_tests }}
      ui_test_runtime_policy: ${{ steps.manifest.outputs.ui_test_runtime_policy }}
      ui_test_matrix: ${{ steps.manifest.outputs.ui_test_matrix }}
      ui_test_shard_count: ${{ steps.manifest.outputs.ui_test_shard_count }}
      ui_test_groups_gzip_base64: ${{ steps.manifest.outputs.ui_test_groups_gzip_base64 }}
      ui_e2e_test_groups_gzip_base64: ${{ steps.manifest.outputs.ui_e2e_test_groups_gzip_base64 }}
      run_control_ui_performance: ${{ steps.manifest.outputs.run_control_ui_performance }}
      run_ui_e2e: ${{ steps.manifest.outputs.run_ui_e2e }}
