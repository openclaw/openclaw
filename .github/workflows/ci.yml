          }}-graph-${{ steps.swift-toolchain.outputs.key }}-${{ hashFiles('apps/macos/Package*.swift', 'apps/macos/Package.resolved',
          'apps/shared/**/Package*.swift', 'apps/shared/**/Package.resolved', 'apps/swabble/Package*.swift', 'apps/swabble/Package.resolved')
          }}-${{ hashFiles('apps/macos/Sources/**', 'apps/macos/Tests/**', 'apps/shared/**/Sources/**', 'apps/swabble/Sources/**')
          }}
        restore-keys: |
          ${{ runner.os }}-swift-build-${{ matrix.phase == 'tests' && 'v7' || 'v6' }}-${{ matrix.phase }}-${{ hashFiles('scripts/swift-build-cache-metadata.py') }}-graph-${{ steps.swift-toolchain.outputs.key }}-${{ hashFiles('apps/macos/Package*.swift', 'apps/macos/Package.resolved', 'apps/shared/**/Package*.swift', 'apps/shared/**/Package.resolved', 'apps/swabble/Package*.swift', 'apps/swabble/Package.resolved') }}-
    - name: Validate Swift build cache
      id: validate-swift-build-cache
      if: contains(fromJSON('["release","tests"]'), matrix.phase)
      run: |
        set -euo pipefail
        cache_valid=true
        sparkle_info="apps/macos/.build/artifacts/sparkle/Sparkle/Sparkle.xcframework/Info.plist"
        if [[ -d apps/macos/.build && ! -f "$sparkle_info" ]]; then
          echo "::warning::Swift build cache is missing Sparkle; resetting the local SwiftPM build directory."
          swift package --package-path apps/macos reset
          cache_valid=false
        fi
        echo "cache-valid=$cache_valid" >> "$GITHUB_OUTPUT"
    - name: Restore Swift build input timestamps
      if: steps.validate-swift-build-cache.outputs.cache-valid == 'true' && env.HISTORICAL_TARGET != 'true'
      run: python3 -I -S scripts/swift-build-cache-metadata.py restore
    - name: Show toolchain
      run: |
        sw_vers
        xcodebuild -version
        swift --version
    - name: Native state schema version contract
      if: ${{ !cancelled() && (steps.macos-node-assets.outcome == 'success' || steps.macos-node-tooling.outcome == 'success')
        && matrix.phase == env.MACOS_PRIMARY_PHASE }}
      run: |
        if [[ -f scripts/check-native-state-schema-version.mjs ]]; then
          node scripts/check-native-state-schema-version.mjs
        elif [[ "$HISTORICAL_TARGET" == "true" ]]; then
          echo "[skip] native state schema version guard is not present in this historical target"
        else
          echo "Current CI targets must provide scripts/check-native-state-schema-version.mjs." >&2
          exit 1
        fi
    - name: Swift lint
      if: ${{ !cancelled() && steps.macos-swift-tools.outcome == 'success' && matrix.phase == env.MACOS_PRIMARY_PHASE }}
      run: |
        source .ci-harness/scripts/ci-collect-checks.sh
        if [[ -x ./scripts/lint-swift.sh && -x ./scripts/format-swift.sh ]]; then
          run_check "macOS Swift lint" ./scripts/lint-swift.sh macos
          run_check "macOS Swift format" ./scripts/format-swift.sh macos
        elif [[ "$HISTORICAL_TARGET" == "true" ]]; then
          # Frozen release targets before the shared wrappers used these commands directly.
          run_check "macOS Swift lint" swiftlint lint --config config/swiftlint.yml
          run_check "macOS Swift format" swiftformat --lint apps/macos/Sources --config config/swiftformat --exclude '**/OpenClawProtocol,**/HostEnvSecurityPolicy.generated.swift,**/BrowserInspectScript.generated.swift'
        else
          echo "Current CI targets must provide the Swift lint and format wrappers." >&2
          exit 1
        fi
        finish_checks
    - name: Swift build (release)
      if: ${{ !cancelled() && steps.select-xcode.outcome == 'success' && steps.macos-native-assets.outcome == 'success' &&
        matrix.phase == 'release' }}
      run: |
        set -euo pipefail
        # The macOS lane validates the desktop app build; the CLI product is
        # intentionally left to its own narrower surfaces instead of making
        # this lane rebuild the whole package graph.
        if swift build --package-path apps/macos --product OpenClaw --configuration release; then
          exit 0
        fi

        sparkle_framework="apps/macos/.build/artifacts/sparkle/Sparkle/Sparkle.xcframework"
        [[ -d "$sparkle_framework" && ! -f "$sparkle_framework/Info.plist" ]] || exit 1
        echo "::warning::SwiftPM did not produce complete Sparkle metadata; resetting once before retry."
        swift package --package-path apps/macos reset
        swift build --package-path apps/macos --product OpenClaw --configuration release
    - name: OpenClawKit Talk-trait opt-out (no ElevenLabsKit when default traits disabled)
      if: ${{ !cancelled() && steps.select-xcode.outcome == 'success' && matrix.phase == 'packages' }}
      run: |
