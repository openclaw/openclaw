        shell: bash
        run: &prepare_ratchet_merge |
          set -euo pipefail
          pr_head="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}" |
              jq -r --arg repo "$GITHUB_REPOSITORY" --arg target "$TARGET_SHA" '
