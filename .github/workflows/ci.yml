    timeout-minutes: 18
    outputs:
      baseline_artifact_id: ${{ steps.baseline_native_runtime_upload.outputs.artifact-id }}
      baseline_bundled_recovery: 'false'
      candidate_artifact_id: ${{ steps.candidate_native_runtime_upload.outputs.artifact-id }}
      candidate_bundled_recovery: ${{ steps.candidate_native_runtime_package.outputs.bundled-recovery }}
