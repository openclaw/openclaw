  docker-seed-e2e:
    permissions:
      contents: read
    name: docker-seed-e2e
    needs: [preflight]
    if: needs.preflight.outputs.run_docker_seed_e2e == 'true'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && startsWith(inputs.dispatch_id, 'full-release-validation-') && vars.OPENCLAW_RELEASE_RUNNER_GROUP || '') != '' && fromJSON(format('{{"group":{0},"labels":{1}}}', toJSON((github.event_name == 'workflow_dispatch' && startsWith(inputs.dispatch_id, 'full-release-validation-') && vars.OPENCLAW_RELEASE_RUNNER_GROUP || '')), toJSON((needs.preflight.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && needs.preflight.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND) == 'github' && 'ubuntu-24.04' || (contains(fromJSON('["hybrid","runson"]'), (needs.preflight.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && needs.preflight.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND)) && github.run_attempt > 1) && 'ubuntu-24.04' || (github.event_name == 'workflow_dispatch' && ((needs.preflight.outputs.node_runner_backend != 'runson' && needs.preflight.outputs.ci_qualification != 'true') || github.run_attempt != 1)) && 'ubuntu-24.04' || (github.event_name == 'pull_request' && (github.run_attempt > 1 || github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-24.04' || (github.repository == 'openclaw/openclaw' && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04')))) || ((needs.preflight.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && needs.preflight.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND) == 'github' && 'ubuntu-24.04' || (contains(fromJSON('["hybrid","runson"]'), (needs.preflight.outputs.ci_qualification == 'true' && (github.run_attempt == 1 && needs.preflight.outputs.qualification_runner_backend || 'github') || vars.OPENCLAW_CI_RUNNER_BACKEND)) && github.run_attempt > 1) && 'ubuntu-24.04' || (github.event_name == 'workflow_dispatch' && ((needs.preflight.outputs.node_runner_backend != 'runson' && needs.preflight.outputs.ci_qualification != 'true') || github.run_attempt != 1)) && 'ubuntu-24.04' || (github.event_name == 'pull_request' && (github.run_attempt > 1 || github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-24.04' || (github.repository == 'openclaw/openclaw' && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04')) }}
    # Hosted six-lane budget: 6810s (run 36506671071); 60m cancelled run 36486786689.
    timeout-minutes: 115
    steps:
      - *linux_node_checkout_step
      - name: Setup Node environment
        uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          build-all-cache-scope: full
          cache-mode: *cache_mode
          node-version: "24.x"
          install-bun: "false"
          dependency-cache: *trusted_first_attempt_dependency_cache

      - name: Report runner resources
        run: |
          node --input-type=module -e 'import os from "node:os"; console.log(JSON.stringify({ logicalCpuCount: os.availableParallelism(), totalMemoryBytes: os.totalmem() }));'

      - name: Resolve published Docker seed upgrade baseline
        if: contains(format(' {0} ', needs.preflight.outputs.docker_seed_lanes), ' published-upgrade-survivor ')
        env:
          TARGET_CONTEXT_REF: ${{ inputs.target_context_ref || github.base_ref || github.ref_name }}
          FROZEN_TARGET: *frozen_target
        run: |
          set -euo pipefail
          candidate_version="$(node -p "require('./package.json').version")"
          baseline="$(node .ci-harness/scripts/lib/release-upgrade-baseline.mjs \
            --candidate-version "$candidate_version" \
            --target-context-ref "$TARGET_CONTEXT_REF")"
          printf 'OPENCLAW_UPGRADE_SURVIVOR_BASELINE_SPEC=%s\n' "$baseline" >> "$GITHUB_ENV"
          node --input-type=module >> "$GITHUB_ENV" <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          const file = "scripts/lib/upgrade-survivor-scenarios.json";
          let scenario = "legacy-operator-state";
          if (process.env.FROZEN_TARGET === "true") {
            scenario = "base";
            if (existsSync(file)) {
              const catalog = JSON.parse(readFileSync(file, "utf8"));
              if (!catalog || typeof catalog !== "object" || Array.isArray(catalog) ||
                  Object.keys(catalog).length !== 2 || !Array.isArray(catalog.scenarios) ||
                  catalog.scenarios.length === 0 || !Array.isArray(catalog.assertionOnlyScenarios)) {
                throw new Error("Invalid upgrade-survivor scenario catalog");
              }
              const names = [...catalog.scenarios, ...catalog.assertionOnlyScenarios];
              if (!names.every(name => typeof name === "string" && /^[a-z0-9][a-z0-9-]*$/.test(name)) ||
                  new Set(names).size !== names.length) {
                throw new Error("Invalid upgrade-survivor scenario catalog");
              }
              if (catalog.scenarios.includes("legacy-operator-state")) scenario = "legacy-operator-state";
              else if (!catalog.scenarios.includes("base")) throw new Error("No supported Docker seed upgrade scenario");
            }
          }
          console.log(`OPENCLAW_UPGRADE_SURVIVOR_SCENARIOS=${scenario}`);
          NODE

      # Smoke keeps runtime and SDK types.
      - name: Prepare Docker smoke package
        if: github.event_name == 'pull_request' || (inputs.release_gate && needs.preflight.outputs.ci_qualification != 'true') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (needs.preflight.outputs.ci_qualification == 'true' && needs.preflight.outputs.ci_shape == 'main') || needs.preflight.outputs.validation_tier == 'main'
        run: |
