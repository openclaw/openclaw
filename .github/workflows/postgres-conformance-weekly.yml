name: PostgreSQL Scheduled Qualification

on:
  schedule:
    - cron: "17 7 * * *"
    - cron: "43 6 * * 1"
  workflow_dispatch:
    inputs:
      versions:
        description: PostgreSQL versions to qualify
        type: choice
        default: all
        options: [all, pg16, pg17, pg18]

permissions:
  contents: read

concurrency:
  group: postgres-conformance-weekly
  # Keep manual qualification pending when a scheduled run joins the same queue.
  queue: max
  cancel-in-progress: false

jobs:
  postgres-conformance:
    if: ${{ github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/main' }}
    name: PostgreSQL conformance (${{ matrix.version }}, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # Allow 2× the measured 24m25s maximum in run 39393830074.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        version: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.versions == 'all' && '["pg16","pg17","pg18"]' || format('["{0}"]', inputs.versions)) || github.event.schedule == '17 7 * * *' && '["pg17"]' || '["pg16","pg18"]') }}
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "false"
      - name: Run PostgreSQL conformance
        uses: ./.github/actions/postgres-conformance
        with:
          image: >-
            ${{ matrix.version == 'pg16' && 'pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f'
                || matrix.version == 'pg17' && 'pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd'
                || 'pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782' }}
          shard: ${{ matrix.shard }}
