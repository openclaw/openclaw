name: Goal 24 focused secretless proof

on:
  push:
    branches: [proof/goal24-secretless-20261115]
    paths:
      - .github/workflows/goal24-focused-proof.yml
      - scripts/goal24-*-proof.*

permissions:
  contents: read

concurrency:
  group: goal24-focused-proof
  cancel-in-progress: false

jobs:
  proof:
    name: ${{ matrix.proof }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - proof: history
            runner: ubuntu-24.04
            deadline: 30
            sha: eb919fb0d0b19dfa86c3e7055145b5a83ae27ef9
          - proof: permissions
            runner: xcode-27
            deadline: 45
            sha: 77ee3e8424d789b7bad5804a9dc5a1693f34c91e
          - proof: audio
            runner: xcode-27
            deadline: 45
            sha: a9a084486e3df10193dfa9ac5ab9faa9f53a4619
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.deadline }}
    steps:
      - name: Checkout reviewed proof tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Checkout immutable product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Prepare pnpm without shared caches
        uses: ./tooling/.github/actions/setup-pnpm-store-cache
        with:
          package-manager-file: source/package.json
          node-version: 24.22.1
          cache-mode: off
      - name: Provision native audio tool from Homebrew
        if: matrix.proof == 'audio'
        timeout-minutes: 8
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: brew install ffmpeg
      - name: Execute only the selected proof
        env:
          GOAL24_PROOF: ${{ matrix.proof }}
        run: node tooling/scripts/goal24-focused-proof.mjs
      - name: Preserve allowlisted proof evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goal24-${{ matrix.proof }}-${{ github.run_id }}
          path: proof-output/
          if-no-files-found: error
          retention-days: 7
