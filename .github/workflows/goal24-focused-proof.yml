name: Goal 24 focused secretless proof

on:
  push:
    branches: [proof/goal24-secretless-20261115]
    paths:
      - .github/workflows/goal24-focused-proof.yml
      - scripts/goal24-*-proof.*

permissions:
  contents: read

concurrency:
  group: goal24-focused-proof
  cancel-in-progress: false

jobs:
  billing:
    name: billing-${{ matrix.group }}-${{ matrix.variant }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [state, chat, reload, startup, compaction]
        variant: [baseline, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout reviewed proof tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Checkout immutable product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.variant == 'baseline' && '489774034984cd3ef78706125f20f4b25723288b' || '8cb8b3e98da2980e1312480decf3079e0ddd0a0c' }}
          path: source
          persist-credentials: false
      - name: Checkout immutable original runtime tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b27440329b4c450ec4c572e40ed338ed98f3d9c7
          path: original
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Prepare pnpm without shared caches
        uses: ./tooling/.github/actions/setup-pnpm-store-cache
        with:
          package-manager-file: source/package.json
          node-version: 24.22.1
          cache-mode: off
      - name: Execute bounded paired observation
        env:
          GOAL24_GROUP: ${{ matrix.group }}
          GOAL24_VARIANT: ${{ matrix.variant }}
        run: node tooling/scripts/goal24-billing-proof.mjs
      - name: Preserve only synthetic proof evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goal24-billing-${{ matrix.group }}-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            proof-output/summary.json
            proof-output/node.json
            proof-output/bun.json
            proof-output/*.log
          if-no-files-found: error
          retention-days: 7
