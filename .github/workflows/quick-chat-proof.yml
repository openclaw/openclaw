name: Quick Chat targeted proof
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit to exercise
        required: true
        type: string
      swift_filter:
        description: Native suites to exercise
        required: false
        default: QuickChat|TalkOverlayTests
        type: string
  push:
    branches: [fix/macos-quick-chat-catalog]
    paths: [.github/workflows/quick-chat-proof.yml]
permissions:
  contents: read
concurrency:
  group: quick-chat-targeted-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-12vcpu-macos-26
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: proof-source
          persist-credentials: false
      - name: Record inputs and overlay presentation test
        run: |
          mkdir -p "$RUNNER_TEMP/quick-chat-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/quick-chat-proof/source.txt"
          git -C proof-source rev-parse HEAD > "$RUNNER_TEMP/quick-chat-proof/harness.txt"
          cp proof-source/apps/macos/Tests/OpenClawIPCTests/QuickChatPresentationTests.swift apps/macos/Tests/OpenClawIPCTests/
          cp proof-source/apps/macos/Tests/OpenClawIPCTests/QuickChatCatalogPresentationTests.swift apps/macos/Tests/OpenClawIPCTests/
      - name: Verify Xcode
        run: |
          set -euo pipefail
          for xcode_app in /Applications/Xcode_26.6.app /Applications/Xcode-26.6.0.app; do
            if [ -d "$xcode_app/Contents/Developer" ]; then
              sudo xcode-select -s "$xcode_app/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          swift --version
      - uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "false"
      - name: Prepare package resources
        run: node scripts/prepare-apple-mermaid.mjs
      - name: Prepare pinned Swift checks
        run: |
          set -euo pipefail
          brew tap-new --no-git openclaw/quick-chat-proof
          tap_root="$(brew --repo openclaw/quick-chat-proof)"
          cat > "$tap_root/Formula/quick-chat-swiftformat.rb" <<'RUBY'
          class QuickChatSwiftformat < Formula
            url "https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat.zip"
            version "0.63.0"
            sha256 "28c7802e11fa5ae113d903066439c6bb1be20a8ac1ad9709c42616a7e273fb0f"
            keg_only :versioned_formula
            def install
              bin.install "swiftformat"
            end
          end
          RUBY
          cat > "$tap_root/Formula/quick-chat-swiftlint.rb" <<'RUBY'
          class QuickChatSwiftlint < Formula
            url "https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip"
            version "0.65.1"
            sha256 "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"
            keg_only :versioned_formula
            def install
              bin.install "swiftlint"
            end
          end
          RUBY
          brew install openclaw/quick-chat-proof/quick-chat-swiftformat openclaw/quick-chat-proof/quick-chat-swiftlint
          echo "$(brew --prefix quick-chat-swiftformat)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix quick-chat-swiftlint)/bin" >> "$GITHUB_PATH"
      - name: Check touched Swift owners
        run: |
          set -euo pipefail
          swiftformat apps/macos/Sources/OpenClaw/QuickChatController.swift apps/macos/Sources/OpenClaw/QuickChatModel.swift apps/macos/Tests/OpenClawIPCTests/QuickChat*PresentationTests.swift --config config/swiftformat
          git diff --binary > "$RUNNER_TEMP/quick-chat-proof/format.patch"
          swiftlint lint --strict --config config/swiftlint.yml apps/macos/Sources/OpenClaw/QuickChatController.swift apps/macos/Sources/OpenClaw/QuickChatModel.swift
      - name: Build app and native tests
        run: |
          set -o pipefail
          swift build --package-path apps/macos --build-system native --build-tests -j 4 2>&1 | tee "$RUNNER_TEMP/quick-chat-proof/build.log"
      - name: Exercise Quick Chat and its window sibling
        env:
          SWIFT_FILTER: ${{ inputs.swift_filter }}
        run: |
          set -o pipefail
          node scripts/test-macos-native.mts named --package-path apps/macos --build-system native --skip-build --filter "$SWIFT_FILTER" 2>&1 | tee "$RUNNER_TEMP/quick-chat-proof/tests.log"
      - name: Retain proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quick-chat-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/quick-chat-proof
            quick-chat-proof
            apps/macos/quick-chat-proof
          retention-days: 14
