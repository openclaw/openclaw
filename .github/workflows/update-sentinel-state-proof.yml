name: Temporary update sentinel state proof

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/update-sentinel-state-proof.yml
      - src/cli/update-cli/update-command-post-update.ts
      - src/cli/update-cli/update-command-result.ts
      - src/cli/update-cli/update-command-sentinel-env.test.ts
      - src/cli/update-cli/update-command-terminal.ts
      - src/infra/update-control-plane-sentinel.ts

permissions:
  contents: read

concurrency:
  group: update-sentinel-state-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=8192
  OPENCLAW_VITEST_MAX_WORKERS: "2"
  CANDIDATE_SHA: 90705978afbb5ee5affdcce551b7276324eb24ee
  SOURCE_PINS: '{"src/cli/update-cli/update-command-post-update.ts":"69271c56d0f2d2d36dea57cb8a03757595faeefb2051ea4752f374459c5205b2","src/cli/update-cli/update-command-result.ts":"cd5d7d43572eeca4b1d013dccb49a553fa95a04fb58877e099ea6566aa926987","src/cli/update-cli/update-command-sentinel-env.test.ts":"5438a724cb5c947e39e87adef16d47bc97ff4a012ee00446203bdfa03f1e9760","src/cli/update-cli/update-command-terminal.ts":"3234f825540d70c7ca3746b12843fa8dac030ac73ed503c245b0f94469e0f0b1","src/infra/update-control-plane-sentinel.ts":"624f4006ddbbeeeed5661c8f0c5af6d65d8bee65d3c99bca4857328428d47c35"}'

jobs:
  sentinel-state:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/update-sentinel-state-env'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 3
          persist-credentials: false
      - &identity
        name: Verify candidate source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$CANDIDATE_SHA" HEAD
          git show --no-patch --format='%H %P'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          for (const [file, expected] of Object.entries(JSON.parse(process.env.SOURCE_PINS))) {
            const actual = createHash('sha256').update(readFileSync(file)).digest('hex');
            assert.equal(actual, expected, file);
            console.log(`${actual}  ${file}`);
          }
          NODE
      - name: Setup frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          install-bun: "false"
          cache-mode: "off"
      - name: Prepare proof reports
        run: |
          node -v
          pnpm -v
          mkdir "$RUNNER_TEMP/sentinel-proof"
      - name: Candidate deferred finalizer and terminal regressions
        run: >-
          node scripts/run-vitest.mjs run --config test/vitest/vitest.cli.config.ts
          src/cli/update-cli/update-command-sentinel-env.test.ts
          src/cli/update-cli/update-command-post-update.test.ts
          src/cli/update-cli/update-command-terminal-outcome.test.ts
          --reporter=default --reporter=json
          --reporter="$GITHUB_WORKSPACE/scripts/lib/vitest-report-capture.mts"
          --outputFile.json="$RUNNER_TEMP/sentinel-proof/cli.json"
      - name: Existing explicit handoff environment
        run: >-
          node scripts/run-vitest.mjs run --config test/vitest/vitest.infra.config.ts
          src/infra/update-managed-service-handoff-lifecycle.test.ts
          -t "routes the CLI helper failure to its original ledger destination"
          --reporter=default --reporter=json
          --reporter="$GITHUB_WORKSPACE/scripts/lib/vitest-report-capture.mts"
          --outputFile.json="$RUNNER_TEMP/sentinel-proof/handoff.json"
      - name: Existing notice policy and matching rewrite
        run: >-
          node scripts/run-vitest.mjs run --config test/vitest/vitest.infra.config.ts
          src/infra/restart-sentinel.test.ts src/infra/restart-sentinel.update-result.test.ts
          --reporter=default --reporter=json
          --reporter="$GITHUB_WORKSPACE/scripts/lib/vitest-report-capture.mts"
          --outputFile.json="$RUNNER_TEMP/sentinel-proof/infra.json"
      - name: Verify selected tests and completed candidate reports
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          const suites = {
            cli: ['src/cli/update-cli/update-command-sentinel-env.test.ts', 'src/cli/update-cli/update-command-post-update.test.ts', 'src/cli/update-cli/update-command-terminal-outcome.test.ts'],
            handoff: ['src/infra/update-managed-service-handoff-lifecycle.test.ts'],
            infra: ['src/infra/restart-sentinel.test.ts', 'src/infra/restart-sentinel.update-result.test.ts'],
          };
          for (const [name, files] of Object.entries(suites)) {
            const file = `${process.env.RUNNER_TEMP}/sentinel-proof/${name}.json`;
            const report = JSON.parse(readFileSync(file));
            const capture = JSON.parse(readFileSync(`${file}.capture.json`));
            assert.equal(report.success, true);
            assert.equal(report.numFailedTests, 0);
            if (name !== 'handoff') assert.equal(report.numPendingTests, 0);
            assert(report.numPassedTests > 0);
            assert.deepEqual(capture.modules.map(module => path.relative(process.cwd(), module.file)).sort(), files.sort());
            assert.equal(capture.processTimedOut, false);
            assert.equal(capture.ignoreUnhandledErrors, false);
            assert.equal(capture.ended.unhandledErrors, 0);
            assert.equal(capture.ended.suiteErrors, 0);
            assert.equal(capture.ended.failedModules, 0);
            if (name === 'handoff') {
              const passed = report.testResults.flatMap(entry => entry.assertionResults).filter(test => test.status === 'passed');
              assert.equal(passed.length, 1);
              assert.equal(passed[0].title, 'routes the CLI helper failure to its original ledger destination');
            }
            if (name === 'cli') {
              const regression = report.testResults.find(entry => entry.name.endsWith('/update-command-sentinel-env.test.ts'));
              assert.equal(regression.assertionResults.length, 3);
              assert(regression.assertionResults.every(test => test.status === 'passed'));
            }
            console.log(JSON.stringify({suite:name,files:files.length,passed:report.numPassedTests}));
          }
          NODE
      - *identity
      - name: Validate bounded report export
        if: always()
        id: reports
        run: |
          node --input-type=module <<'NODE'
          import { lstatSync, readdirSync, appendFileSync } from 'node:fs';
          import path from 'node:path';
          let bytes = 0, files = 0;
          const root = `${process.env.RUNNER_TEMP}/sentinel-proof`;
          for (const entry of readdirSync(root)) {
            const file = path.join(root, entry), stat = lstatSync(file);
            if (!stat.isFile()) throw new Error('Refusing nonregular report export');
            bytes += stat.size; files += 1;
            if (bytes > 16 * 1024 * 1024) throw new Error('Report export exceeds 16 MiB');
          }
          if (!files) throw new Error('No reports produced');
          appendFileSync(process.env.GITHUB_OUTPUT, 'ready=true\n');
          console.log(JSON.stringify({files,bytes}));
          NODE
      - name: Retain produced reports
        if: always() && steps.reports.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: update-sentinel-state-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/sentinel-proof
          if-no-files-found: error
          retention-days: 7
