name: FRV Flake Classification
# Actions cannot split the URL or use step outputs in run-name; the script validates it.
run-name: FRV flake classification ${{ inputs.job_url }}

on:
  workflow_dispatch:
    inputs:
      job_url:
        description: Exact failed Normal CI job URL
        required: true
        type: string
      tracking_url:
        description: OpenClaw issue or PR tracking the fix on main
        required: true
        type: string
      reason:
        description: Single-line flake decision, 20–300 characters
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted classification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Record validated flake classification
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/full-release-flake-classification.mjs record

      - name: Upload classification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.record.outputs.artifact_name }}
          path: ${{ steps.record.outputs.receipt_path }}
          retention-days: 90
          if-no-files-found: error
