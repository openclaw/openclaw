name: Windows Testbox Probe

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Git ref or SHA to check out"
        required: false
        default: "main"
        type: string
      runner_label:
        description: "Runner for Windows/WSL probes and headless CI"
        required: false
        default: "blacksmith-16vcpu-windows-2025"
        type: choice
        options:
          - blacksmith-16vcpu-windows-2025
          - blacksmith-32vcpu-windows-2025
          - windows-2025
      keepalive_minutes:
        description: "Minutes to keep the Windows runner alive for SSH inspection"
        required: false
        default: "20"
        type: string
      require_wsl2:
        description: "Fail the run when WSL2 is unavailable"
        required: false
        default: false
        type: boolean
      import_ubuntu_wsl2:
        description: "Import a throwaway Ubuntu WSL2 distro when none is installed"
        required: false
        default: false
        type: boolean
      enable_wsl2_features:
        description: "Try enabling Windows WSL2/VM optional features before probing"
        required: false
        default: false
        type: boolean
      run_windows_ci:
        description: "Run Windows CI and native Tasks, or installed native proof with a package binding"
        required: false
        default: false
        type: boolean
      windows_ci_replay:
        description: "Exact diagnostic JSON: nodeVersion, packageManager, vitestVersion, maxWorkers, files, projects"
        required: false
        default: ""
        type: string
      run_private_node_provisioning:
        description: "Prove private Node installation and portable updater authorization on native Windows"
        required: false
        default: false
        type: boolean
      installed_startup_package:
        description: "Package Acceptance binding for installed proof, or {baseline, candidate} for a startup comparison"
        required: false
        default: ""
        type: string
      installed_repair_worker:
        description: "Use the installed package binding for legacy repair controllers and native worker cleanup"
        required: false
        default: false
        type: boolean
      startup_node_version:
        description: "Exact Node version for installed package probes"
        required: false
        default: "26.8.2"
        type: string
      installed_startup_cpu_diagnostic:
        description: "Capture one established CPU profile after a fresh prime instead of a timing cohort"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  probe:
    if: ${{ false }} # Isolated mechanism branch; no full upgrade or broad probe.
    name: Windows probe
    outputs:
      native_package_id: ${{ steps.native_package_upload.outputs.artifact-id }}
      native_package_digest: ${{ steps.native_package_upload.outputs.artifact-digest }}
      native_manifest_sha256: ${{ steps.installed_package.outputs.native_manifest_sha256 }}
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - &windows_checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_ref || github.ref }}
          persist-credentials: false
          submodules: false

      - name: Qualify fresh native runner isolation
        if: ${{ inputs.installed_repair_worker }}
        id: repair_isolation
        shell: pwsh
        env:
          NATIVE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          EXPECTED_HEAD: ${{ inputs.target_ref }}
          NATIVE_ISOLATION_PROOF_NAME: ${{ inputs.installed_repair_worker && 'windows-repair-isolation.json' || 'windows-schtasks-isolation.json' }}
        run: &windows_native_isolation |
          $ErrorActionPreference = "Stop"
          $proofPath = Join-Path $env:RUNNER_TEMP $env:NATIVE_ISOLATION_PROOF_NAME
          $evidence = [ordered]@{ result = "unqualified"; runnerEnvironment = $env:NATIVE_RUNNER_ENVIRONMENT; image = $env:ImageOS }
          try {
            # Standard GitHub-hosted Windows jobs receive a fresh VM per job.
            # ImageOS also names toolchain variants; it is evidence, not isolation authority.
            if ($env:NATIVE_RUNNER_ENVIRONMENT -ne "github-hosted" -or $env:RUNNER_OS -ne "Windows") {
              throw "Expected a newly allocated GitHub-hosted Windows runner."
            }
            if ($env:EXPECTED_HEAD -notmatch '^[0-9a-f]{40}$') {
              throw "Native proof requires an exact 40-character target_ref."
            }
            # Actions artifact/cache credentials are infrastructure-only. The
            # native probe separately bounds its environment before owner imports.
            $credentialNames = @(
              "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "GEMINI_API_KEY", "GOOGLE_API_KEY",
              "GITHUB_TOKEN", "GH_TOKEN", "NPM_TOKEN", "NODE_AUTH_TOKEN",
              "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN", "AWS_WEB_IDENTITY_TOKEN_FILE",
              "AZURE_CLIENT_SECRET", "AZURE_FEDERATED_TOKEN_FILE", "ARM_CLIENT_SECRET", "GOOGLE_APPLICATION_CREDENTIALS",
              "SSH_AUTH_SOCK", "NODE_OPTIONS", "NODE_EXTRA_CA_CERTS",
              "OPENCLAW_HOME", "OPENCLAW_STATE_DIR", "OPENCLAW_CONFIG_PATH",
              "OPENCLAW_GATEWAY_TOKEN", "OPENCLAW_GATEWAY_PASSWORD", "OPENCLAW_SUPERVISOR_MODE"
            ) | Where-Object { -not [string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($_)) }
            $credentialNames = @($credentialNames)
            $evidence.forwardedCredentialCount = $credentialNames.Count
            if ($credentialNames.Count -ne 0) { throw "Forwarded credential environment is not permitted." }
            $tailnetServices = @(Get-Service | Where-Object { $_.Name -match 'tailscale|zerotier' })
            $tailnetAdapters = @(Get-NetAdapter -IncludeHidden | Where-Object { $_.InterfaceDescription -match 'tailscale|zerotier' })
            $tailnetRoutes = @(Get-NetRoute | Where-Object { $_.DestinationPrefix -eq '100.64.0.0/10' })
            $networkDisks = @(Get-CimInstance Win32_LogicalDisk -Filter "DriveType=4")
            $networkDrives = @(Get-PSDrive -PSProvider FileSystem | Where-Object { $_.DisplayRoot -like '\\*' })
            $smbMappings = @(Get-SmbMapping)
            $evidence.tailnetSurfaceCount = $tailnetServices.Count + $tailnetAdapters.Count + $tailnetRoutes.Count
            $evidence.operatorMountCount = $networkDisks.Count + $networkDrives.Count + $smbMappings.Count
            if ($evidence.tailnetSurfaceCount -ne 0 -or $evidence.operatorMountCount -ne 0) {
              throw "Native proof requires no Tailnet attachment or operator network mounts."
            }
            # Do not use proxies, follow redirects, or read a successful token
            # response. Unknown/temporary failures do not establish no identity.
            $handler = [Net.Http.HttpClientHandler]::new()
            $handler.UseProxy = $false
            $handler.AllowAutoRedirect = $false
            $client = [Net.Http.HttpClient]::new($handler)
            $client.Timeout = [TimeSpan]::FromSeconds(5)
            $deadline = [Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(5))
            $client.DefaultRequestHeaders.Add("Metadata", "true")
            try {
              $uri = "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F"
              $response = $client.GetAsync($uri, [Net.Http.HttpCompletionOption]::ResponseHeadersRead, $deadline.Token).GetAwaiter().GetResult()
              try {
                $evidence.managedIdentityStatus = [int]$response.StatusCode
                if ([int]$response.StatusCode -ne 400) { throw "Managed identity absence is unproven." }
                $body = $response.Content.ReadAsStringAsync($deadline.Token).GetAwaiter().GetResult() | ConvertFrom-Json
                # Accept only this known negative; changed error wording blocks
                # qualification instead of treating every 400 as no identity.
                if ($body.access_token -or $body.error -ne "invalid_request" -or $body.error_description -cne "Identity not found") {
                  throw "Managed identity absence is unproven."
                }
                $evidence.managedIdentity = "explicit-identity-not-found"
              } finally {
                $body = $null
                $response.Dispose()
              }
            } catch {
              # Never include endpoint bodies or exception data in logs/artifacts.
              throw "IMDS did not establish identity absence; native product execution is blocked."
            } finally {
              $deadline.Dispose()
              $client.Dispose()
            }
            $evidence.result = "qualified"
          } finally {
            $evidence | ConvertTo-Json | Set-Content -LiteralPath $proofPath
          }

      - name: Validate exact Windows replay
        id: replay_input
        if: ${{ inputs.windows_ci_replay != '' }}
        env:
          REPLAY_JSON: ${{ inputs.windows_ci_replay }}
          TARGET_REF: ${{ inputs.target_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          KEEPALIVE_MINUTES: ${{ inputs.keepalive_minutes }}
          MIXED_PROOF: ${{ inputs.run_windows_ci || inputs.run_private_node_provisioning || inputs.installed_startup_package != '' || inputs.installed_startup_cpu_diagnostic || inputs.installed_repair_worker || inputs.require_wsl2 || inputs.import_ubuntu_wsl2 || inputs.enable_wsl2_features }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:KEEPALIVE_MINUTES -ne "0" -or $env:MIXED_PROOF -eq "true") {
            throw "Exact replay requires keepalive 0 and no broad CI, private Node, startup, or WSL proof."
          }
          if ($env:TARGET_REF -cnotmatch '^[0-9a-f]{40}$') { throw "Exact replay requires an immutable target_ref." }
          $sourceSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceSha -cne $env:TARGET_REF) { throw "Replay checkout differs from target_ref." }
          $replay = $env:REPLAY_JSON | ConvertFrom-Json -AsHashtable
          $fields = @("files", "maxWorkers", "nodeVersion", "packageManager", "projects", "vitestVersion")
          if ($replay -isnot [System.Collections.IDictionary] -or (($replay.Keys | Sort-Object) -join ",") -cne ($fields -join ",")) {
            throw "Replay requires only the documented binding fields."
          }
          foreach ($field in @("nodeVersion", "packageManager", "vitestVersion")) {
            if ($replay[$field] -isnot [string]) { throw "Replay toolchain pins must be strings." }
          }
          if ($replay.nodeVersion -cnotmatch '^24\.[0-9]+\.[0-9]+$' -or $replay.vitestVersion -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Replay requires exact supported Node 24 and Vitest versions."
          }
          if (($replay.maxWorkers -isnot [long] -and $replay.maxWorkers -isnot [int]) -or $replay.maxWorkers -notin 1..4) {
            throw "Replay requires an integer worker count from 1 through 4."
          }
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          if ($replay.packageManager -cnotmatch '^pnpm@[0-9]+\.[0-9]+\.[0-9]+\+sha512\.[0-9a-f]{128}$' -or $replay.packageManager -cne $package.packageManager -or $replay.vitestVersion -cne $package.devDependencies.vitest) {
            throw "Replay toolchain differs from the frozen repository pins."
          }
          if ($replay.files -isnot [array] -or $replay.files.Count -lt 1 -or $replay.files.Count -gt 256 -or @($replay.files | Sort-Object -Unique).Count -ne $replay.files.Count) {
            throw "Replay requires 1 through 256 unique literal test files, in their original order."
          }
          foreach ($file in $replay.files) {
            if ($file -isnot [string] -or $file -cnotmatch '^(src|test|extensions)/[a-zA-Z0-9_./-]+\.test\.tsx?$' -or @($file.Split('/') | Where-Object { $_ -in @('', '.', '..') }).Count -gt 0) {
              throw "Replay file must be a literal repository test path."
            }
            $entry = git ls-files --stage --error-unmatch -- $file
            if ($LASTEXITCODE -ne 0 -or $entry -notmatch '^100(644|755) ' -or -not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Replay test file is not a tracked regular file: $file"
            }
          }
          if ($replay.projects -isnot [array] -or $replay.projects.Count -lt 1 -or $replay.projects.Count -gt $replay.files.Count -or @($replay.projects | Sort-Object -Unique).Count -ne $replay.projects.Count) {
            throw "Replay requires the original unique ordered project config paths."
          }
          foreach ($project in $replay.projects) {
            if ($project -isnot [string] -or $project -cnotmatch '^test/vitest/vitest\.[a-z0-9-]+\.config\.ts$' -or -not (Test-Path -LiteralPath $project -PathType Leaf)) {
              throw "Replay project must name an existing repository config."
            }
          }
          $evidence = Join-Path $env:RUNNER_TEMP "windows-ci-replay"
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $replay | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence "binding.json")
          $dependencyFiles = @(git ls-files -- package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc pnpm patches)
          if ($LASTEXITCODE -ne 0) { throw "Cannot enumerate frozen dependency inputs." }
          $hashes = [ordered]@{}
          foreach ($file in $dependencyFiles) { $hashes[$file] = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() }
          @{ sourceSha = $sourceSha; workflowSha = $env:WORKFLOW_SHA; runId = $env:GITHUB_RUN_ID; runAttempt = $env:GITHUB_RUN_ATTEMPT; dependencySha256 = $hashes } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence "identity.json")
          "OPENCLAW_WINDOWS_REPLAY_NODE_VERSION=$($replay.nodeVersion)" >> $env:GITHUB_ENV
          "OPENCLAW_TEST_SKIP_FULL_EXTENSIONS_SHARD=1" >> $env:GITHUB_ENV
          "max_workers=$($replay.maxWorkers)" >> $env:GITHUB_OUTPUT
          "evidence=$evidence" >> $env:GITHUB_OUTPUT

      - name: Validate private Node proof inputs
        if: ${{ inputs.run_private_node_provisioning }}
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          KEEPALIVE_MINUTES: ${{ inputs.keepalive_minutes }}
          MIXED_PROOF: ${{ inputs.run_windows_ci || inputs.installed_startup_package != '' || inputs.installed_startup_cpu_diagnostic || inputs.installed_repair_worker || inputs.require_wsl2 || inputs.import_ubuntu_wsl2 || inputs.enable_wsl2_features }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RUNNER_LABEL -ne "windows-2025" -or $env:KEEPALIVE_MINUTES -ne "0" -or $env:MIXED_PROOF -eq "true") {
            throw "Private Node proof requires windows-2025, keepalive 0, and no startup, broad CI, or WSL proof."
          }
          if ($env:TARGET_REF -cnotmatch '^[0-9a-f]{40}$' -or $env:WORKFLOW_SHA -cne $env:TARGET_REF) {
            throw "Private Node proof requires the same immutable workflow and target SHA."
          }
          $checkoutSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkoutSha -cne $env:TARGET_REF) { throw "Private Node proof checkout differs from target_ref." }

      - name: Validate installed startup inputs
        id: startup_input
        if: ${{ inputs.installed_startup_package != '' || inputs.installed_startup_cpu_diagnostic || inputs.installed_repair_worker }}
        env:
          STARTUP_PACKAGE: ${{ inputs.installed_startup_package }}
          STARTUP_NODE_VERSION: ${{ inputs.startup_node_version }}
          TARGET_REF: ${{ inputs.target_ref }}
          RUN_WINDOWS_CI: ${{ inputs.run_windows_ci }}
          CPU_DIAGNOSTIC: ${{ inputs.installed_startup_cpu_diagnostic }}
          REPAIR_WORKER: ${{ inputs.installed_repair_worker }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          KEEPALIVE_MINUTES: ${{ inputs.keepalive_minutes }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          REPAIR_MIXED_PROOF: ${{ inputs.run_private_node_provisioning || inputs.windows_ci_replay != '' || inputs.require_wsl2 || inputs.import_ubuntu_wsl2 || inputs.enable_wsl2_features }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrEmpty($env:STARTUP_PACKAGE)) { throw "CPU diagnostics require an installed package binding." }
          $nativePackage = $env:RUN_WINDOWS_CI -eq "true"
          if ($nativePackage -and ($env:REPAIR_WORKER -eq "true" -or $env:CPU_DIAGNOSTIC -eq "true" -or $env:REPAIR_MIXED_PROOF -eq "true" -or $env:RUNNER_LABEL -ne "windows-2025" -or $env:KEEPALIVE_MINUTES -ne "0")) {
            throw "Native package handoff requires windows-2025, keepalive 0, and no other proof mode."
          }
          if ($env:TARGET_REF -cnotmatch '^[0-9a-f]{40}$') { throw "Installed startup requires an exact tooling target_ref." }
          if ($env:STARTUP_NODE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Installed startup requires an exact Node version." }
          $toolingSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $toolingSha -cne $env:TARGET_REF) { throw "Tooling checkout differs from target_ref." }
          $selection = $env:STARTUP_PACKAGE | ConvertFrom-Json
          $paired = $selection.PSObject.Properties.Name -contains "baseline" -or $selection.PSObject.Properties.Name -contains "candidate"
          if ($env:REPAIR_WORKER -eq "true") {
            if ($paired -or $env:CPU_DIAGNOSTIC -eq "true" -or $env:REPAIR_MIXED_PROOF -eq "true" -or $env:RUNNER_LABEL -ne "windows-2025" -or $env:KEEPALIVE_MINUTES -ne "0") {
              throw "Repair worker proof requires one package, windows-2025, keepalive 0, and no other proof mode."
            }
            if ($env:WORKFLOW_SHA -cne $toolingSha) { throw "Repair worker proof requires the reviewed tooling and workflow revision to match." }
          }
          if ($nativePackage -and ($paired -or $env:WORKFLOW_SHA -cne $toolingSha)) {
            throw "Native package handoff requires one candidate and identical workflow/tooling revisions."
          }
          if ($paired -and $env:CPU_DIAGNOSTIC -eq "true") { throw "CPU diagnostics require one package, not a comparison." }
          $packages = [ordered]@{ baseline = $selection }
          if ($paired) {
            if (-not $selection.baseline -or -not $selection.candidate) { throw "Comparison requires both baseline and candidate bindings." }
            $packages = [ordered]@{ baseline = $selection.baseline; candidate = $selection.candidate }
          }
          $evidence = Join-Path $env:GITHUB_WORKSPACE ".artifacts/windows-installed-startup"
          New-Item -ItemType Directory -Path $evidence | Out-Null
          foreach ($arm in $packages.Keys) {
            $binding = $packages[$arm]
            foreach ($field in @("runId", "runAttempt", "artifactId")) {
              if ([string]$binding.$field -notmatch '^[1-9][0-9]*$') { throw "Invalid package identity field: $field" }
            }
            foreach ($field in @("sourceSha", "workflowSha")) {
              if ([string]$binding.$field -cnotmatch '^[0-9a-f]{40}$') { throw "Invalid package identity field: $field" }
            }
            if ($binding.packageSha256 -cnotmatch '^[0-9a-f]{64}$' -or $binding.artifactDigest -cnotmatch '^sha256:[0-9a-f]{64}$') { throw "Invalid package digest." }
            $producerRaw = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($binding.runId)"
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect package producer." }
            $producer = ($producerRaw -join "`n") | ConvertFrom-Json
            if ($producer.run_attempt -ne $binding.runAttempt -or $producer.head_sha -cne $binding.workflowSha -or $producer.conclusion -ne "success" -or $producer.path -ne ".github/workflows/package-acceptance.yml") { throw "Package Acceptance producer does not match the binding." }
            $artifactRaw = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($binding.artifactId)"
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect package artifact." }
            $artifact = ($artifactRaw -join "`n") | ConvertFrom-Json
            if ($artifact.expired -or $artifact.digest -cne $binding.artifactDigest -or $artifact.workflow_run.id -ne $binding.runId -or $artifact.name -cne "package-under-test-$($binding.runId)-$($binding.runAttempt)") { throw "Package artifact does not match the binding." }
            $prefix = if ($paired) { "$arm-" } else { "" }
            $binding | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence "${prefix}package-binding.json")
            $producer | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath (Join-Path $evidence "${prefix}producer.json")
            $artifact | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath (Join-Path $evidence "${prefix}artifact.json")
            $outputPrefix = if ($arm -eq "candidate") { "comparison_" } else { "" }
            "${outputPrefix}artifact_id=$($binding.artifactId)" >> $env:GITHUB_OUTPUT
            "${outputPrefix}run_id=$($binding.runId)" >> $env:GITHUB_OUTPUT
          }
          $packages | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence "packages.json")
          "tooling_sha=$toolingSha" >> $env:GITHUB_OUTPUT

      - name: Download installed startup package
        if: ${{ inputs.installed_startup_package != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.startup_input.outputs.artifact_id }}
          run-id: ${{ steps.startup_input.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/startup-package-input

      - name: Download comparison startup package
        if: ${{ steps.startup_input.outputs.comparison_artifact_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.startup_input.outputs.comparison_artifact_id }}
          run-id: ${{ steps.startup_input.outputs.comparison_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/startup-package-comparison-input

      - name: Probe native Windows
        env:
          TARGET_REF: ${{ inputs.target_ref || github.ref }}
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "runner=$env:RUNNER_NAME"
          Write-Host "machine=$env:COMPUTERNAME"
          Write-Host "workspace=$env:GITHUB_WORKSPACE"
          Write-Host "target_ref=$env:TARGET_REF"
          Write-Host ("os=" + [System.Environment]::OSVersion.VersionString)
          Write-Host ("arch=" + [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)
          Write-Host ("powershell=" + $PSVersionTable.PSVersion.ToString())
          cmd.exe /c ver
          git --version

      - name: Probe WSL2
        id: wsl2
        if: ${{ !inputs.run_private_node_provisioning && !inputs.installed_repair_worker && inputs.windows_ci_replay == '' && !(inputs.run_windows_ci && inputs.installed_startup_package != '') }}
        env:
          ENABLE_WSL2_FEATURES: ${{ inputs.enable_wsl2_features }}
          IMPORT_UBUNTU_WSL2: ${{ inputs.import_ubuntu_wsl2 }}
        run: |
          $ErrorActionPreference = "Continue"
          $ok = $false
          $restartRequired = $false

          function Resolve-UbuntuWslRootfsUrl {
            $osArch = ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture).ToString().ToLowerInvariant()
            switch ($osArch) {
              "x64" { $wslArch = "amd64" }
              "arm64" { $wslArch = "arm64" }
              default { throw "Unsupported Windows architecture for Ubuntu WSL rootfs: $osArch" }
            }
            Write-Host "ubuntu_wsl_rootfs_arch=$wslArch"
            "https://cloud-images.ubuntu.com/wsl/releases/24.04/current/ubuntu-noble-wsl-$wslArch-wsl.rootfs.tar.gz"
          }

          function Invoke-WslText {
            param([string[]] $Arguments)
            $output = & wsl.exe @Arguments 2>&1
            $code = $LASTEXITCODE
            $text = (($output | ForEach-Object { "$_" }) -join "`n") -replace "`0", ""
            [pscustomobject]@{ Code = $code; Text = $text }
          }

          function Get-WslDistros {
            $result = Invoke-WslText -Arguments @("--list", "--quiet")
            $result.Text -split "\r?\n" |
              ForEach-Object { $_.Trim() } |
              Where-Object {
                $_ -and
                $_ -notmatch "Windows Subsystem for Linux has no installed distributions" -and
                $_ -notmatch "^Use 'wsl\.exe" -and
                $_ -notmatch "^and 'wsl\.exe"
              }
          }

          $wsl = Get-Command wsl.exe -ErrorAction SilentlyContinue
          if (-not $wsl) {
            Write-Warning "wsl.exe is not available on this runner."
          } else {
            Write-Host "wsl.exe=$($wsl.Source)"
            if ($env:ENABLE_WSL2_FEATURES -eq "true") {
              Write-Host "enable_wsl2_features=true"
              foreach ($feature in @("Microsoft-Windows-Subsystem-Linux", "VirtualMachinePlatform", "HypervisorPlatform")) {
                dism.exe /online /enable-feature /featurename:$feature /all /norestart
                Write-Host "enable_feature_${feature}_exit=$LASTEXITCODE"
                if ($LASTEXITCODE -eq 3010) {
                  $restartRequired = $true
                }
              }
              if ($restartRequired) {
                Write-Warning "wsl2_restart_required=true; Windows optional feature changes require a runner reboot before WSL2 can be imported."
              }
            }

            $status = Invoke-WslText -Arguments @("--status")
            Write-Host $status.Text
            Write-Host "wsl_status_exit=$($status.Code)"

            $list = Invoke-WslText -Arguments @("--list", "--verbose")
            Write-Host $list.Text
            Write-Host "wsl_list_exit=$($list.Code)"

            $distros = @(Get-WslDistros)
            if ($distros.Count -eq 0 -and $env:IMPORT_UBUNTU_WSL2 -eq "true" -and -not $restartRequired) {
              Write-Host "import_ubuntu_wsl2=true"
              $wslRoot = "C:\wsl\UbuntuProbe"
              $rootfs = "C:\wsl\ubuntu-noble-wsl.rootfs.tar.gz"
              $rootfsUrl = Resolve-UbuntuWslRootfsUrl
              New-Item -ItemType Directory -Force -Path @((Split-Path -Parent $rootfs), $wslRoot) | Out-Null
              Invoke-WebRequest `
                -Uri $rootfsUrl `
                -OutFile $rootfs `
                -UseBasicParsing `
                -ConnectionTimeoutSeconds 15 `
                -OperationTimeoutSeconds 120
              $import = Invoke-WslText -Arguments @("--import", "UbuntuProbe", $wslRoot, $rootfs, "--version", "2")
              Write-Host $import.Text
              Write-Host "wsl_import_exit=$($import.Code)"
              $list = Invoke-WslText -Arguments @("--list", "--verbose")
              Write-Host $list.Text
              Write-Host "wsl_list_after_import_exit=$($list.Code)"
              $distros = @(Get-WslDistros)
            } elseif ($distros.Count -eq 0 -and $env:IMPORT_UBUNTU_WSL2 -eq "true" -and $restartRequired) {
              Write-Warning "import_ubuntu_wsl2=skipped_restart_required"
            }

            if ($distros.Count -gt 0) {
              $distro = $distros[0]
              Write-Host "wsl_probe_distro=$distro"
              $exec = Invoke-WslText -Arguments @("-d", $distro, "--exec", "bash", "-lc", 'set -euo pipefail; uname -a; if [ -f /etc/os-release ]; then sed -n "1,8p" /etc/os-release; fi')
            } elseif ($restartRequired) {
              $exec = [pscustomobject]@{ Code = 1; Text = "wsl_exec_skipped=restart_required" }
            } else {
              $exec = Invoke-WslText -Arguments @("--exec", "bash", "-lc", 'set -euo pipefail; uname -a; if [ -f /etc/os-release ]; then sed -n "1,8p" /etc/os-release; fi')
            }
            Write-Host $exec.Text
            if ($exec.Code -eq 0) {
              $ok = $true
            }
            Write-Host "wsl_exec_exit=$($exec.Code)"
          }

          if ($ok) {
            "wsl2_ok=true" >> $env:GITHUB_OUTPUT
            "wsl2_restart_required=false" >> $env:GITHUB_OUTPUT
            "OPENCLAW_WSL2_PROBE_OK=true" >> $env:GITHUB_ENV
            "OPENCLAW_WSL2_RESTART_REQUIRED=false" >> $env:GITHUB_ENV
            Write-Host "wsl2_ok=true"
          } else {
            "wsl2_ok=false" >> $env:GITHUB_OUTPUT
            "wsl2_restart_required=$($restartRequired.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
            "OPENCLAW_WSL2_PROBE_OK=false" >> $env:GITHUB_ENV
            "OPENCLAW_WSL2_RESTART_REQUIRED=$($restartRequired.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
            Write-Warning "wsl2_ok=false"
          }

          exit 0

      - &windows_defender
        name: Try to exclude workspace from Windows Defender (best-effort)
        if: ${{ inputs.run_windows_ci || inputs.windows_ci_replay != '' }}
        shell: pwsh
        run: |
          $cmd = Get-Command Add-MpPreference -ErrorAction SilentlyContinue
          if (-not $cmd) {
            Write-Host "Add-MpPreference not available, skipping Defender exclusions."
            exit 0
          }

          try {
            Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
            Add-MpPreference -ExclusionProcess "node.exe" -ErrorAction Stop
            Write-Host "Defender exclusions applied."
          } catch {
            Write-Warning "Failed to apply Defender exclusions, continuing. $($_.Exception.Message)"
          }

      - &windows_node
        name: Setup Node.js
        if: ${{ inputs.run_windows_ci || inputs.installed_startup_package != '' || inputs.run_private_node_provisioning || inputs.windows_ci_replay != '' }}
        shell: bash
        env:
          NODE_OPTIONS: ${{ inputs.windows_ci_replay != '' && '--max-old-space-size=8192' || env.NODE_OPTIONS }}
          REQUESTED_NODE_VERSION: ${{ inputs.windows_ci_replay != '' && env.OPENCLAW_WINDOWS_REPLAY_NODE_VERSION || inputs.installed_startup_package != '' && inputs.startup_node_version || '24.x' }}
        run: |
          set -euo pipefail
          source .github/actions/setup-pnpm-store-cache/ensure-node.sh
          openclaw_ensure_node "$REQUESTED_NODE_VERSION"

      - &windows_pnpm
        name: Setup pnpm
        id: setup_pnpm
        if: ${{ inputs.run_windows_ci || inputs.installed_startup_package != '' || inputs.run_private_node_provisioning || inputs.windows_ci_replay != '' }}
        env:
          NODE_OPTIONS: ${{ inputs.windows_ci_replay != '' && '--max-old-space-size=8192' || env.NODE_OPTIONS }}
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          cache-mode: restore
          node-version: ${{ inputs.windows_ci_replay != '' && env.OPENCLAW_WINDOWS_REPLAY_NODE_VERSION || inputs.installed_startup_package != '' && inputs.startup_node_version || '24.x' }}

      - &windows_versions
        name: Runtime versions
        if: ${{ inputs.run_windows_ci || inputs.installed_startup_package != '' || inputs.run_private_node_provisioning || inputs.windows_ci_replay != '' }}
        shell: bash
        env:
          NODE_OPTIONS: ${{ inputs.windows_ci_replay != '' && '--max-old-space-size=8192' || env.NODE_OPTIONS }}
        run: |
          node -v
          npm -v
          pnpm -v

      - &windows_node_path
        name: Capture node path
        if: ${{ inputs.run_windows_ci || inputs.installed_startup_package != '' || inputs.run_private_node_provisioning || inputs.windows_ci_replay != '' }}
        shell: bash
        env:
          NODE_OPTIONS: ${{ inputs.windows_ci_replay != '' && '--max-old-space-size=8192' || env.NODE_OPTIONS }}
        run: |
          node_bin="$(dirname "$(node -p 'process.execPath')")"
          if command -v cygpath >/dev/null 2>&1; then
            node_bin="$(cygpath -u "$node_bin")"
          fi
          echo "NODE_BIN=$node_bin" >> "$GITHUB_ENV"

      - &windows_install
        name: Install dependencies
        if: ${{ inputs.run_windows_ci || inputs.installed_startup_package != '' || inputs.run_private_node_provisioning || inputs.windows_ci_replay != '' }}
        shell: bash
        env:
          NODE_OPTIONS: ${{ inputs.windows_ci_replay != '' && '--max-old-space-size=8192' || env.NODE_OPTIONS }}
          CI: true
        run: |
          export PATH="$NODE_BIN:$PATH"
          which node
          node -v
          pnpm -v
          pnpm install --frozen-lockfile --prefer-offline --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true || pnpm install --frozen-lockfile --prefer-offline --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Prove private Node provisioning and portable authorization
        if: ${{ inputs.run_private_node_provisioning }}
        shell: bash
        timeout-minutes: 40
        env:
          CI: true
        run: |
          set -euo pipefail
          export PATH="$NODE_BIN:$PATH"
          # Match the real installer deadline plus owner cleanup, only for this live proof.
          OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS=1920000 pnpm test:live src/cli/update-cli/update-command-node-runtime.live.test.ts
          node scripts/run-vitest.mjs src/cli/update-cli/update-command-executor-auxiliary.test.ts -t 'preserves direct preflight release through a healthy installer child and active drain|never starts Node provisioning without released authorization input|refuses Node provisioning after|preserves native-gate environment precedence|preserves absent or empty native payload options'

      - name: Prove installed benchmark lifecycle
        if: ${{ inputs.installed_startup_package != '' && !inputs.installed_repair_worker && !inputs.run_windows_ci }}
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/run-vitest.mjs test/scripts/bench-gateway-installed.test.ts
          if ($LASTEXITCODE -ne 0) { throw "Installed benchmark lifecycle proof failed." }

      - name: Resolve package and install only for local consumers
        id: installed_package
        if: ${{ inputs.installed_startup_package != '' }}
        env:
          TOOLING_SHA: ${{ steps.startup_input.outputs.tooling_sha }}
          NATIVE_PACKAGE: ${{ inputs.run_windows_ci }}
          STARTUP_NODE_VERSION: ${{ inputs.startup_node_version }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = Join-Path $env:GITHUB_WORKSPACE ".artifacts/windows-installed-startup"
          $packages = Get-Content -LiteralPath (Join-Path $evidence "packages.json") -Raw | ConvertFrom-Json -AsHashtable
          $paired = $packages.Contains("candidate")
          $records = [ordered]@{}
          $nodePath = (node -p 'process.execPath').Trim()
          $nodeVersion = (node --version).Trim()
          if ($nodeVersion -cne "v$env:STARTUP_NODE_VERSION") { throw "Installed startup Node version differs." }
          foreach ($arm in $packages.Keys) {
            $binding = $packages[$arm]
            $prefix = if ($paired) { "$arm-" } else { "" }
            $armRoot = if ($paired) { Join-Path $env:RUNNER_TEMP "startup-comparison/$arm" } else { $env:RUNNER_TEMP }
            $candidateDir = Join-Path $armRoot "startup-package-resolved"
            $artifactDir = Join-Path $env:RUNNER_TEMP $(if ($arm -eq "candidate") { "startup-package-comparison-input" } else { "startup-package-input" })
            node --import ./scripts/tsx.mjs scripts/resolve-openclaw-package-candidate.mts --source artifact --artifact-dir $artifactDir --package-sha256 $binding.packageSha256 --output-dir $candidateDir --metadata (Join-Path $candidateDir "package-candidate.json")
            if ($LASTEXITCODE -ne 0) { throw "Canonical package resolution failed." }
            $candidate = Get-Content -LiteralPath (Join-Path $candidateDir "package-candidate.json") -Raw | ConvertFrom-Json
            if ($candidate.packageSourceSha -cne $binding.sourceSha -or $candidate.sha256 -cne $binding.packageSha256) { throw "Resolved source or package bytes differ." }
            Copy-Item -LiteralPath (Join-Path $candidateDir "package-candidate.json") -Destination (Join-Path $evidence "${prefix}package-candidate.json")
            $tarball = (Resolve-Path -LiteralPath $candidate.tarball).Path
            if ($env:NATIVE_PACKAGE -eq "true") {
              # New current-run transport; no installed graph or state crosses jobs.
              $handoff = Join-Path $env:RUNNER_TEMP "native-package-handoff"
              New-Item -ItemType Directory -Path $handoff | Out-Null
              Copy-Item -LiteralPath $tarball -Destination (Join-Path $handoff "candidate.tgz")
              $published = @()
              foreach ($version in @("2026.9.3", "2026.9.4")) {
                $metadataPath = Join-Path $handoff "registry-$version.json"
                $baselinePath = Join-Path $handoff "openclaw-$version.tgz"
                Invoke-WebRequest -Uri "https://registry.npmjs.org/openclaw/$version" -OutFile $metadataPath -MaximumRedirection 0
                $registry = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
                $url = "https://registry.npmjs.org/openclaw/-/openclaw-$version.tgz"
                $pin = if ($version -eq "2026.9.3") {
                  @{ commit = "1391f7cd2d40ab5bbcf2f5f831d3a64f520e72d7"; sha256 = "d1c63366833f8ae4a6ab4f3b60b1aa84ca82d03dba13d3d3eba989aa159e2449"; integrity = "sha512-CzDHMeHdnjlIZ76ZyBb1lvLO4H/yBIMYXupFGGBN87x0853y3hg5nLAnKfxSKqLzqhbUKqy9ebDRAWWV4t8aew==" }
                } else {
                  @{ commit = "3a9d69db306cd7f081e06254cb89c4bcc14a7107"; sha256 = "4f1f656770461d4677dea755b1899cba12b912b06798c89a59e2f0c18688b761"; integrity = "sha512-lTQpEEe1Xm3u2PCHaPEr+vP8paGk1vLdHuzdItsNToaLI6hAqRVvgJYg+GxukJhETJp4tPy/S1Gftl4KuB8n7A==" }
                }
                if ($registry.name -cne "openclaw" -or $registry.version -cne $version -or $registry.dist.tarball -cne $url -or $registry.dist.integrity -cne $pin.integrity) { throw "Published registry identity differs from its immutable pin." }
                Invoke-WebRequest -Uri $url -OutFile $baselinePath -MaximumRedirection 0
                $sha256 = (Get-FileHash -LiteralPath $baselinePath -Algorithm SHA256).Hash.ToLowerInvariant()
                $sha512 = [Convert]::ToBase64String([Convert]::FromHexString((Get-FileHash -LiteralPath $baselinePath -Algorithm SHA512).Hash))
                if ($sha256 -cne $pin.sha256 -or "sha512-$sha512" -cne $pin.integrity) { throw "Published archive bytes differ from the registry pin." }
                $published += @{ source = "npm-registry"; version = $version; commit = $pin.commit; sha256 = $pin.sha256; integrity = $pin.integrity; metadataSha256 = (Get-FileHash -LiteralPath $metadataPath -Algorithm SHA256).Hash.ToLowerInvariant() }
              }
              $manifest = [ordered]@{
                schema = "openclaw.native-schtasks-handoff/v1"
                repository = $env:GITHUB_REPOSITORY; runId = $env:GITHUB_RUN_ID
                runAttempt = $env:GITHUB_RUN_ATTEMPT; workflowSha = $env:WORKFLOW_SHA
                toolingSha = $env:TOOLING_SHA; producerJob = "probe"
                origin = @{ runId = [string]$binding.runId; runAttempt = [string]$binding.runAttempt; artifactId = [string]$binding.artifactId; sourceSha = $binding.sourceSha; workflowSha = $binding.workflowSha; packageSha256 = $binding.packageSha256; artifactDigest = $binding.artifactDigest }
                published = $published
                candidate = @{ name = $candidate.name; version = $candidate.version; packageSourceSha = $candidate.packageSourceSha; sha256 = $candidate.sha256 }
                runtime = @{ version = $nodeVersion; sha256 = (Get-FileHash -LiteralPath $nodePath -Algorithm SHA256).Hash.ToLowerInvariant() }
              }
              $manifestPath = Join-Path $handoff "handoff.json"
              $manifest | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath $manifestPath
              "native_manifest_sha256=$((Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
              continue
            }
            $installRoot = Join-Path $armRoot "startup-package-installed"
            New-Item -ItemType Directory -Path $installRoot | Out-Null
            npm install --prefix $installRoot --no-audit --no-fund --ignore-scripts=false $tarball
            if ($LASTEXITCODE -ne 0) { throw "Normal npm installation failed." }
            npm rebuild --prefix $installRoot --ignore-scripts=false
            if ($LASTEXITCODE -ne 0) { throw "Normal npm rebuild failed." }
            $packageRoot = Join-Path $installRoot "node_modules/openclaw"
            foreach ($marker in @(".openclaw-lifecycle-pending", "dist/openclaw-install-guard")) {
              if (Test-Path -LiteralPath (Join-Path $packageRoot $marker)) { throw "Installed lifecycle has not settled: $marker" }
            }
            $packageLock = Join-Path $installRoot "package-lock.json"
            $packageLockHash = (Get-FileHash -LiteralPath $packageLock -Algorithm SHA256).Hash.ToLowerInvariant()
            Copy-Item -LiteralPath $packageLock -Destination (Join-Path $evidence "${prefix}installed-package-lock.json")
            $records[$arm] = [ordered]@{
              sourceSha = $binding.sourceSha; toolingSha = $env:TOOLING_SHA
              tarball = $tarball; candidate = $candidate; installRoot = $installRoot
              stateRoot = (Join-Path $armRoot "startup-cohort-state")
              runtime = @{ version = $nodeVersion; sha256 = (Get-FileHash -LiteralPath $nodePath -Algorithm SHA256).Hash.ToLowerInvariant() }
              artifact = @{ id = $binding.artifactId; runId = $binding.runId; runAttempt = $binding.runAttempt; workflowSha = $binding.workflowSha; digest = $binding.artifactDigest }
            }
            @{ workflowSha = $env:WORKFLOW_SHA; toolingSha = $env:TOOLING_SHA; packageSourceSha = $binding.sourceSha; installedPackageLockSha256 = $packageLockHash; runner = $env:RUNNER_NAME; node = $nodeVersion; nodePath = $nodePath } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence "${prefix}execution.json")
          }
          if ($env:NATIVE_PACKAGE -ne "true") {
            $inputRecord = $records.baseline
            if ($paired) { $inputRecord.comparison = $records.candidate }
            $inputRecord | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $evidence "input.json")
          }

      - name: Upload verified package for the current native run
        id: native_package_upload
        if: ${{ inputs.run_windows_ci && inputs.installed_startup_package != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-schtasks-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-package-handoff
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 7

      - name: Measure installed startup cohort
        if: ${{ inputs.installed_startup_package != '' && !inputs.installed_repair_worker && !inputs.run_windows_ci }}
        env:
          CPU_DIAGNOSTIC: ${{ inputs.installed_startup_cpu_diagnostic }}
        run: |
          $ErrorActionPreference = "Stop"
          $diagnosticArgs = @()
          if ($env:CPU_DIAGNOSTIC -eq "true") { $diagnosticArgs = @("--installed-cpu-diagnostic") }
          node --import ./scripts/tsx.mjs scripts/bench-gateway-startup.ts --installed-cohort .artifacts/windows-installed-startup/input.json --output .artifacts/windows-installed-startup/results.json @diagnosticArgs 2>&1 | Tee-Object -FilePath .artifacts/windows-installed-startup/cohort.log
          if ($LASTEXITCODE -ne 0) { throw "Installed startup cohort failed; retain every sample and cleanup result." }

      - name: Install authenticated published repair controllers
        if: ${{ inputs.installed_repair_worker }}
        run: |
          $ErrorActionPreference = "Stop"
          $parents = node --import ./scripts/tsx.mjs scripts/windows-repair-worker-probe.mjs --parent-manifest | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Cannot read published controller identities." }
          $root = Join-Path $env:RUNNER_TEMP "repair-published"
          New-Item -ItemType Directory -Path $root | Out-Null
          foreach ($parent in $parents) {
            $tarball = Join-Path $root "openclaw-$($parent.version).tgz"
            Invoke-WebRequest -Uri "https://registry.npmjs.org/openclaw/-/openclaw-$($parent.version).tgz" -OutFile $tarball -ConnectionTimeoutSeconds 15 -OperationTimeoutSeconds 120
            $integrity = "sha512-" + [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($tarball)))
            if ($integrity -cne $parent.integrity) { throw "Published controller tarball integrity differs." }
            $prefix = Join-Path $root $parent.version
            npm install --prefix $prefix --no-audit --no-fund --ignore-scripts=false $tarball
            if ($LASTEXITCODE -ne 0) { throw "Published controller installation failed." }
          }
          $parents | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath .artifacts/windows-installed-startup/published-controllers.json

      - name: Prove installed repair worker compatibility and cleanup
        if: ${{ inputs.installed_repair_worker }}
        run: |
          $ErrorActionPreference = "Stop"
          node --import ./scripts/tsx.mjs scripts/windows-repair-worker-probe.mjs .artifacts/windows-installed-startup/input.json .artifacts/windows-installed-startup/repair-results.json 2>&1 | Tee-Object -FilePath .artifacts/windows-installed-startup/repair.log
          if ($LASTEXITCODE -ne 0) { throw "Installed repair worker proof failed; retain failed cells and cleanup facts." }

      - name: Upload installed startup evidence
        if: ${{ always() && inputs.installed_startup_package != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installed-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/windows-installed-startup/*.json
            ${{ runner.temp }}/windows-repair-isolation.json
            .artifacts/windows-installed-startup/*.log
            .artifacts/windows-installed-startup/results.json.profiles/*.cpuprofile
            .artifacts/windows-installed-startup/results.json.profiles/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Run exact Windows replay
        id: replay_run
        if: ${{ inputs.windows_ci_replay != '' }}
        shell: bash
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_TEST_SKIP_FULL_EXTENSIONS_SHARD: 1
          OPENCLAW_TEST_PROJECTS_PARALLEL: 1
          OPENCLAW_VITEST_MAX_WORKERS: ${{ steps.replay_input.outputs.max_workers }}
          REPLAY_EVIDENCE: ${{ steps.replay_input.outputs.evidence }}
          REPLAY_RUNNER_LABEL: ${{ inputs.runner_label }}
          REPLAY_PACKAGE_MANAGER_VERSION: ${{ steps.setup_pnpm.outputs.pnpm-version }}
        run: |
          set -euo pipefail
          export PATH="$NODE_BIN:$PATH"
          evidence_dir="$(cygpath -u "$REPLAY_EVIDENCE")"
          REPLAY_NPM_VERSION="$(npm -v)"
          export REPLAY_NPM_VERSION
          # Preserve the original dispatcher invocation; the input contains data, not shell or CLI options.
          set +e
          node --input-type=module <<'WINDOWS_REPLAY' 2>&1 | tee "$evidence_dir/replay.log"
          import { spawnSync, execFileSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          import { createRequire } from "node:module";
          import os from "node:os";
          import path from "node:path";
          const evidence = process.env.REPLAY_EVIDENCE;
          const binding = JSON.parse(readFileSync(path.join(evidence, "binding.json"), "utf8"));
          const identity = JSON.parse(readFileSync(path.join(evidence, "identity.json"), "utf8"));
          const hash = (file) => createHash("sha256").update(readFileSync(file)).digest("hex");
          const sourceSha = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          const require = createRequire(path.join(process.cwd(), "package.json"));
          const vitestVersion = require("vitest/package.json").version;
          if (process.env.REPLAY_PACKAGE_MANAGER_VERSION !== binding.packageManager.slice(5).split("+")[0]) {
            throw new Error("Active pnpm differs from the frozen repository pin");
          }
          if (process.platform !== "win32" || process.arch !== "x64" || process.versions.node !== binding.nodeVersion || sourceSha !== identity.sourceSha || vitestVersion !== binding.vitestVersion) {
            throw new Error("Replay source, native platform, Node, or installed Vitest differs from the binding");
          }
          for (const [file, expected] of Object.entries(identity.dependencySha256)) {
            if (hash(file) !== expected) throw new Error(`Frozen dependency input changed: ${file}`);
          }
          const args = ["--import", "./scripts/tsx.mjs", "scripts/test-projects.mts", ...binding.files, "--fileParallelism"];
          const environment = Object.fromEntries(["CI", "NODE_OPTIONS", "OPENCLAW_TEST_SKIP_FULL_EXTENSIONS_SHARD", "OPENCLAW_TEST_PROJECTS_PARALLEL", "OPENCLAW_VITEST_MAX_WORKERS"].map((key) => [key, process.env[key]]));
          writeFileSync(path.join(evidence, "runtime.json"), JSON.stringify({
            sourceSha, node: process.versions.node, nodeSha256: hash(process.execPath),
            vitest: vitestVersion, packageManager: require("./package.json").packageManager,
            npm: process.env.REPLAY_NPM_VERSION, pnpm: process.env.REPLAY_PACKAGE_MANAGER_VERSION,
            platform: process.platform, arch: process.arch, osRelease: os.release(),
            runnerLabel: process.env.REPLAY_RUNNER_LABEL,
            logicalCpuCount: os.cpus().length, availableParallelism: os.availableParallelism(),
            osTotalMemoryBytes: os.totalmem(), osFreeMemoryBytes: os.freemem(),
            args, environment,
          }, null, 2) + "\n");
          const result = spawnSync(process.execPath, args, { stdio: "inherit" });
          writeFileSync(path.join(evidence, "process-result.json"), JSON.stringify({
            status: result.status, signal: result.signal, spawnError: result.error?.code ?? null,
            descendantSettlement: "not-attested; frozen runner owns test lifetime; Actions owns final runner teardown",
          }, null, 2) + "\n");
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          WINDOWS_REPLAY
          result=("${PIPESTATUS[@]}")
          if [[ "${result[0]}" != 0 ]]; then exit "${result[0]}"; fi
          exit "${result[1]}"

      - name: Record ordered replay outcome
        if: ${{ always() && steps.replay_input.outcome == 'success' }}
        env:
          REPLAY_EVIDENCE: ${{ steps.replay_input.outputs.evidence }}
          REPLAY_OUTCOME: ${{ steps.replay_run.outcome }}
        run: |
          $ErrorActionPreference = "Stop"
          $binding = Get-Content -LiteralPath (Join-Path $env:REPLAY_EVIDENCE "binding.json") -Raw | ConvertFrom-Json
          $identity = Get-Content -LiteralPath (Join-Path $env:REPLAY_EVIDENCE "identity.json") -Raw | ConvertFrom-Json -AsHashtable
          $logPath = Join-Path $env:REPLAY_EVIDENCE "replay.log"
          $log = if (Test-Path -LiteralPath $logPath) { [string](Get-Content -LiteralPath $logPath -Raw) } else { "" }
          $observed = @([regex]::Matches($log, '(?m)^\[test\] starting (test/vitest/vitest\.[a-z0-9-]+\.config\.ts)\r?$') | ForEach-Object { $_.Groups[1].Value })
          $orderedPrefix = $observed.Count -le $binding.projects.Count
          for ($i = 0; $i -lt $observed.Count -and $orderedPrefix; $i++) { $orderedPrefix = $observed[$i] -ceq $binding.projects[$i] }
          $complete = $orderedPrefix -and $observed.Count -eq $binding.projects.Count
          $dependencyInputsUnchanged = $true
          foreach ($file in $identity.dependencySha256.Keys) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf) -or (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -cne $identity.dependencySha256[$file]) { $dependencyInputsUnchanged = $false }
          }
          $sourceSha = (git rev-parse HEAD).Trim()
          $sourceUnchanged = $LASTEXITCODE -eq 0 -and $sourceSha -ceq $identity.sourceSha
          $retainedNamespaces = @([regex]::Matches($log, '(?m)^\[vitest\] retained temporary namespace .*$') | ForEach-Object { $_.Value })
          @{ stepOutcome = $env:REPLAY_OUTCOME; expectedProjects = $binding.projects; observedProjects = $observed; orderedPrefix = $orderedPrefix; complete = $complete; dependencyInputsUnchanged = $dependencyInputsUnchanged; sourceUnchanged = $sourceUnchanged; retainedNamespaces = $retainedNamespaces; cleanupOwner = "Actions runner job teardown; no persistent Testbox lease" } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:REPLAY_EVIDENCE "outcome.json")
          if (-not $orderedPrefix -or -not $dependencyInputsUnchanged -or -not $sourceUnchanged -or ($env:REPLAY_OUTCOME -eq "success" -and -not $complete)) {
            throw "Replay identity or observed project order differs; retained output is diagnostic only."
          }

      - name: Upload exact Windows replay evidence
        if: ${{ always() && steps.replay_input.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-ci-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.replay_input.outputs.evidence }}
          if-no-files-found: error
          retention-days: 7

      - name: Run Windows CI tests
        if: ${{ inputs.run_windows_ci && inputs.installed_startup_package == '' }}
        shell: bash
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_TEST_SKIP_FULL_EXTENSIONS_SHARD: 1
          OPENCLAW_VITEST_MAX_WORKERS: 1
        run: |
          set -euo pipefail
          export PATH="$NODE_BIN:$PATH"
          pnpm test:windows:ci

      - name: Keep runner alive for SSH inspection
        if: ${{ always() && !cancelled() && !inputs.run_private_node_provisioning && inputs.windows_ci_replay == '' }}
        env:
          KEEPALIVE_MINUTES: ${{ inputs.keepalive_minutes }}
        run: |
          $ErrorActionPreference = "Stop"
          $minutes = 20
          if ($env:KEEPALIVE_MINUTES -match '^\d+$') {
            $minutes = [int]$env:KEEPALIVE_MINUTES
          }
          $minutes = [Math]::Max(0, [Math]::Min($minutes, 60))
          Write-Host "keepalive_minutes=$minutes"
          for ($i = 1; $i -le $minutes; $i++) {
            Write-Host "keepalive minute $i/$minutes"
            Start-Sleep -Seconds 60
          }

      - name: Enforce WSL2 requirement
        if: ${{ always() && !cancelled() && inputs.require_wsl2 }}
        run: |
          if ($env:OPENCLAW_WSL2_PROBE_OK -ne "true") {
            if ($env:OPENCLAW_WSL2_RESTART_REQUIRED -eq "true") {
              Write-Error "WSL2 probe enabled required Windows features, but the runner needs a reboot before WSL2 can start."
              exit 1
            }
            Write-Error "WSL2 probe failed or WSL2 is unavailable on this Windows runner."
            exit 1
          }

  # Native session qualification must not depend on headless CI or WSL results.
  native-schtasks:
    name: Native Scheduled Task proof
    if: ${{ false }} # Diagnostic branch: never run a full native upgrade.
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      NATIVE_PACKAGE_ID: ""
      NATIVE_PACKAGE_DIGEST: ""
      NATIVE_MANIFEST_SHA256: ""
    steps: &native_schtasks_steps
      - name: Qualify fresh native runner isolation
        id: native_isolation
        shell: pwsh
        env:
          NATIVE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          EXPECTED_HEAD: ${{ inputs.target_ref }}
          NATIVE_ISOLATION_PROOF_NAME: windows-schtasks-isolation.json
        run: *windows_native_isolation

      - name: Preflight native Scheduled Task session
        if: ${{ inputs.run_windows_ci }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $sessionId = (Get-Process -Id $PID).SessionId
          Write-Host "identity=$($identity.Name)"
          Write-Host "session_id=$sessionId"
          Write-Host "user_interactive=$([Environment]::UserInteractive)"
          Write-Host "administrator=$isAdmin"
          query user 2>&1 | Write-Host
          if (-not [Environment]::UserInteractive) {
            throw "Native Scheduled Task proof requires an interactive Windows runner session."
          }
          exit 0

      - *windows_checkout
      - *windows_defender
      - *windows_node
      - *windows_pnpm
      - *windows_versions
      - *windows_node_path
      - *windows_install

      - name: Download this run's verified native package
        if: ${{ inputs.installed_startup_package != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ env.NATIVE_PACKAGE_ID }}
          path: ${{ runner.temp }}/native-package-archive
          skip-decompress: true
          digest-mismatch: error
          # No github-token/repository/run-id: the pinned action uses current-run scope.

      - name: Verify current-run handoff and retain origin identity
        if: ${{ inputs.installed_startup_package != '' }}
        shell: pwsh
        env:
          HANDOFF_ID: ${{ env.NATIVE_PACKAGE_ID }}
          HANDOFF_DIGEST: ${{ env.NATIVE_PACKAGE_DIGEST }}
          MANIFEST_SHA256: ${{ env.NATIVE_MANIFEST_SHA256 }}
          PACKAGE_BINDING: ${{ inputs.installed_startup_package }}
          TARGET_REF: ${{ inputs.target_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          NODE_VERSION: ${{ inputs.startup_node_version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:HANDOFF_ID -cnotmatch '^[1-9][0-9]*$' -or $env:HANDOFF_DIGEST -cnotmatch '^[0-9a-f]{64}$' -or $env:MANIFEST_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw "Missing exact current-run handoff outputs." }
          $checkoutSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkoutSha -cne $env:TARGET_REF) { throw "Native tooling checkout differs from the handoff target." }
          $archiveRoot = Join-Path $env:RUNNER_TEMP "native-package-archive"
          $archives = @(Get-ChildItem -LiteralPath $archiveRoot -File)
          if ($archives.Count -ne 1 -or @(Get-ChildItem -LiteralPath $archiveRoot -Directory).Count -ne 0) { throw "Expected exactly one current-run artifact archive." }
          if ((Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:HANDOFF_DIGEST) { throw "Archive differs from the producer's upload digest." }
          $handoff = Join-Path $env:RUNNER_TEMP "native-package-verified"
          if (Test-Path -LiteralPath $handoff) { throw "Native handoff destination must be fresh." }
          [IO.Compression.ZipFile]::ExtractToDirectory($archives[0].FullName, $handoff)
          $files = @(Get-ChildItem -LiteralPath $handoff -File | Sort-Object Name)
          if (($files.Name -join ',') -cne 'candidate.tgz,handoff.json,openclaw-2026.9.3.tgz,openclaw-2026.9.4.tgz,registry-2026.9.3.json,registry-2026.9.4.json' -or @(Get-ChildItem -LiteralPath $handoff -Directory).Count -ne 0) { throw "Unexpected native handoff members." }
          $manifestPath = Join-Path $handoff "handoff.json"
          if ((Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:MANIFEST_SHA256) { throw "Handoff manifest changed." }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $binding = $env:PACKAGE_BINDING | ConvertFrom-Json
          if ($manifest.schema -cne "openclaw.native-schtasks-handoff/v1" -or $manifest.producerJob -cne "probe" -or $manifest.repository -cne $env:GITHUB_REPOSITORY -or $manifest.runId -cne $env:GITHUB_RUN_ID -or $manifest.runAttempt -cne $env:GITHUB_RUN_ATTEMPT -or $manifest.workflowSha -cne $env:WORKFLOW_SHA -or $manifest.toolingSha -cne $env:TARGET_REF -or $env:WORKFLOW_SHA -cne $env:TARGET_REF) { throw "Handoff origin differs from this exact workflow run." }
          foreach ($field in @("runId", "runAttempt", "artifactId", "sourceSha", "workflowSha", "packageSha256", "artifactDigest")) {
            if ([string]$manifest.origin.$field -cne [string]$binding.$field) { throw "Original Package Acceptance binding changed: $field" }
          }
          $tarball = Join-Path $handoff "candidate.tgz"
          if ($manifest.candidate.name -cne "openclaw" -or [string]::IsNullOrWhiteSpace($manifest.candidate.version) -or $manifest.candidate.packageSourceSha -cne $binding.sourceSha -or $manifest.candidate.sha256 -cne $binding.packageSha256 -or (Get-FileHash -LiteralPath $tarball -Algorithm SHA256).Hash.ToLowerInvariant() -cne $binding.packageSha256) { throw "Candidate package identity changed in transit." }
          $nodePath = (node -p 'process.execPath').Trim()
          if ($LASTEXITCODE -ne 0 -or $manifest.runtime.version -cne "v$env:NODE_VERSION" -or (node --version).Trim() -cne $manifest.runtime.version -or (Get-FileHash -LiteralPath $nodePath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $manifest.runtime.sha256) { throw "Native runtime differs from the producer's pinned runtime." }
          $record = @{ status = "transport-verified-only"; artifactId = $env:HANDOFF_ID; artifactDigest = $env:HANDOFF_DIGEST; manifestSha256 = $env:MANIFEST_SHA256; origin = $manifest.origin; candidate = $manifest.candidate; plannedCells = @("fresh", "published-2026.9.3-to-candidate", "published-2026.9.4-to-candidate"); productProof = "not-run" }
          New-Item -ItemType Directory -Force -Path .artifacts/windows-schtasks | Out-Null
          $record | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath .artifacts/windows-schtasks/package-handoff.json
          $published = @()
          if (@($manifest.published).Count -ne 2) { throw "Both fixed registry baselines are required." }
          foreach ($version in @("2026.9.3", "2026.9.4")) {
            $rows = @($manifest.published | Where-Object { $_.version -ceq $version })
            if ($rows.Count -ne 1 -or $rows[0].source -cne "npm-registry") { throw "Missing fixed registry origin." }
            $row = $rows[0]
            $metadata = Join-Path $handoff "registry-$version.json"
            $publishedTarball = Join-Path $handoff "openclaw-$version.tgz"
            if ((Get-FileHash -LiteralPath $metadata -Algorithm SHA256).Hash.ToLowerInvariant() -cne $row.metadataSha256 -or (Get-FileHash -LiteralPath $publishedTarball -Algorithm SHA256).Hash.ToLowerInvariant() -cne $row.sha256) { throw "Registry baseline changed in transit." }
            $published += @{ source = "npm-registry"; version = $version; commit = $row.commit; integrity = $row.integrity; sha256 = $row.sha256; metadata = $metadata; tarball = $publishedTarball }
          }
          $inputRecord = @{
            published = $published
            sourceSha = $manifest.candidate.packageSourceSha; toolingSha = $manifest.toolingSha
            tarball = $tarball; candidate = $manifest.candidate
            installRoot = (Join-Path $env:RUNNER_TEMP "native-package-installed")
            stateRoot = (Join-Path $env:RUNNER_TEMP "openclaw-schtasks-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")
            runtime = $manifest.runtime
            artifact = @{ id = [long]$manifest.origin.artifactId; runId = [long]$manifest.origin.runId; runAttempt = [long]$manifest.origin.runAttempt; workflowSha = $manifest.origin.workflowSha; digest = $manifest.origin.artifactDigest }
          }
          $inputRecord | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath .artifacts/windows-schtasks/installed-input.json

      - name: Run native Scheduled Task lifecycle proof
        id: native_schtasks
        if: ${{ inputs.run_windows_ci && inputs.installed_startup_package == '' }}
        timeout-minutes: 5
        shell: bash
        env:
          CI_WINDOWS_SCHTASKS_PROOF_PATH: ${{ github.workspace }}\.artifacts\windows-schtasks\proof.json
          CI_WINDOWS_SCHTASKS_INSTALLED_INPUT: ${{ inputs.installed_startup_package != '' && format('{0}/.artifacts/windows-schtasks/installed-input.json', github.workspace) || '' }}
          CI_WINDOWS_SCHTASKS_ROOT: ${{ runner.temp }}\openclaw-schtasks-${{ github.run_id }}-${{ github.run_attempt }}
          CI_WINDOWS_SCHTASKS_TEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_HEAD: ${{ inputs.target_ref }}
        run: &native_schtasks_run |
          set -euo pipefail
          export PATH="$NODE_BIN:$PATH"
          if [[ ! "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Native Scheduled Task proof requires target_ref to be an exact 40-character commit SHA." >&2
            exit 1
          fi
          CI_WINDOWS_SCHTASKS_HEAD="$(git rev-parse HEAD)"
          if [[ "$CI_WINDOWS_SCHTASKS_HEAD" != "$EXPECTED_HEAD" ]]; then
            echo "Checked out $CI_WINDOWS_SCHTASKS_HEAD, expected frozen target $EXPECTED_HEAD." >&2
            exit 1
          fi
          export CI_WINDOWS_SCHTASKS_HEAD
          mkdir -p .artifacts/windows-schtasks
          pnpm test:windows:schtasks:integration

      - name: Prepare installed Scheduled Task cell fresh
        id: native_prepare_fresh
        if: ${{ inputs.run_windows_ci && inputs.installed_startup_package != '' }}
        shell: bash
        env:
          OPENCLAW_VITEST_WORKER_CACHE: "1"
          CI_WINDOWS_SCHTASKS_INSTALLED_CELL: "fresh"
          CI_WINDOWS_SCHTASKS_TEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export PATH="$NODE_BIN:$PATH"
          node --import ./scripts/tsx.mjs src/daemon/schtasks.installed-package.test-support.ts prepare .artifacts/windows-schtasks/installed-input.json
          # Compile native test workers before the cell's action deadline starts.
          CI_WINDOWS_SCHTASKS_INTEGRATION=1 node scripts/prepare-vitest-worker-cache.mts

      - name: Run installed Scheduled Task cell fresh
        id: native_schtasks_fresh
        if: ${{ inputs.run_windows_ci && inputs.installed_startup_package != '' && steps.native_prepare_fresh.outcome == 'success' }}
        # 6-minute installed body, three-minute teardown hook, one-minute runner margin.
        timeout-minutes: 10
        shell: bash
        env:
          OPENCLAW_VITEST_WORKER_CACHE: "1"
          CI_WINDOWS_SCHTASKS_PROOF_PATH: ${{ github.workspace }}\.artifacts\windows-schtasks\cells\fresh\proof.json
          CI_WINDOWS_SCHTASKS_INSTALLED_INPUT: ${{ github.workspace }}/.artifacts/windows-schtasks/installed-input.json
          CI_WINDOWS_SCHTASKS_INSTALLED_CELL: "fresh"
          CI_WINDOWS_SCHTASKS_ROOT: ${{ runner.temp }}\openclaw-schtasks-${{ github.run_id }}-${{ github.run_attempt }}\fresh
          CI_WINDOWS_SCHTASKS_TEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_HEAD: ${{ inputs.target_ref }}
        run: *native_schtasks_run

      - name: Join native Scheduled Task cell fresh
        id: native_cleanup_fresh
        if: ${{ always() && inputs.run_windows_ci && inputs.installed_startup_package != '' && steps.native_isolation.outcome == 'success' && contains(fromJSON('["success","failure","cancelled"]'), steps.native_schtasks_fresh.outcome) }}
        shell: pwsh
        env:
          TEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          TEST_ROOT: ${{ runner.temp }}\openclaw-schtasks-${{ github.run_id }}-${{ github.run_attempt }}
          INSTALLED_PACKAGE_MODE: "true"
          CI_WINDOWS_SCHTASKS_INSTALLED_CELL: "fresh"
        run: &native_schtasks_cleanup_run |
          $ErrorActionPreference = "Continue"
          $cleanupErrors = @()
          $profile = "schtasks-int-$env:TEST_ID"
          $taskName = "OpenClaw Gateway ($profile)"
          $stateDir = Join-Path $env:USERPROFILE ".openclaw-$profile"
          "owned_package_cleanup=false" >> $env:GITHUB_OUTPUT
          if ($env:INSTALLED_PACKAGE_MODE -eq "true") {
            $requestedCells = @("fresh", "2026.9.3", "2026.9.4")
            if (-not [string]::IsNullOrEmpty($env:CI_WINDOWS_SCHTASKS_INSTALLED_CELL)) {
              if ($env:CI_WINDOWS_SCHTASKS_INSTALLED_CELL -cnotin $requestedCells) { throw "Unknown fixed cleanup cell." }
              $requestedCells = @($env:CI_WINDOWS_SCHTASKS_INSTALLED_CELL)
            }
            $records = @()
            foreach ($cell in $requestedCells) {
              $recordPath = Join-Path $env:GITHUB_WORKSPACE ".artifacts/windows-schtasks/cells/$cell/installed-cleanup.json"
              if (-not (Test-Path -LiteralPath $recordPath)) { continue }
              $cellRecords = @(Get-Content -LiteralPath $recordPath -Raw -ErrorAction Stop | ConvertFrom-Json -ErrorAction Stop)
              if ($cellRecords.Count -eq 0) { throw "An existing admission file has no records." }
              foreach ($record in $cellRecords) {
                if ($record.cell -cne $cell) { throw "Admission record belongs to a different cell." }
                $records += $record
              }
            }
            if ($records.Count -eq 0) { Write-Host "No installed task mutation was admitted."; exit 0 }
            $seen = @{}
            # Validate the entire finite authority set before performing any cleanup.
            foreach ($record in $records) {
              $index = [array]::IndexOf(@("fresh", "2026.9.3", "2026.9.4"), [string]$record.cell)
              if ($index -lt 0 -or $record.role -cnotin @("selected", "peer", "non-gateway", "missing", "direct", "extra")) { throw "Unexpected installed cell identity." }
              $discovery = $record.role -cin @("non-gateway", "missing", "direct", "extra")
              if ($discovery -and $record.cell -cne "fresh") { throw "Discovery tasks belong only to the fresh cell." }
              $expectedProfile = "schtasks-int-$env:TEST_ID-$index-$($record.role)"
              $expectedTask = if ($record.role -ceq "extra") { "NativeExtra-$env:TEST_ID-$index" } elseif ($record.role -ceq "non-gateway") { "OpenClaw Helper ($expectedProfile)" } else { "OpenClaw Gateway ($expectedProfile)" }
              $expectedState = Join-Path $env:USERPROFILE ".openclaw-$expectedProfile"
              $expectedRoot = Join-Path $env:TEST_ROOT $record.cell
              if ($discovery) { $expectedRoot = Join-Path $expectedRoot $record.role }
              $prefixName = if ($record.role -ceq "peer") { "$($record.cell)-peer" } else { $record.cell }
              $expectedInstall = Join-Path (Join-Path $env:RUNNER_TEMP "native-package-installed") $prefixName
              if ($record.taskInitiallyAbsent -ne $true -or $record.profile -cne $expectedProfile -or $record.taskName -cne $expectedTask -or $seen.ContainsKey($expectedTask)) { throw "No unique admitted installed task authority." }
              foreach ($pair in @(@($record.stateDir, $expectedState), @($record.rootDir, $expectedRoot), @($record.installRoot, $expectedInstall), @($record.entry, (Join-Path $expectedInstall "node_modules/openclaw/openclaw.mjs")))) {
                if ([IO.Path]::GetFullPath($pair[0]) -ine [IO.Path]::GetFullPath($pair[1])) { throw "Installed cleanup path differs from its exact run." }
              }
              if ($discovery -and [IO.Path]::GetFullPath($record.scriptPath) -ine [IO.Path]::GetFullPath((Join-Path $expectedRoot "$($record.role).cmd"))) { throw "Discovery launcher path differs from its fixture." }
              if ($record.role -cin @("direct", "extra") -and $record.cleanupNeedle -cne $expectedProfile) { throw "Diagnostic task cleanup token differs from its exact profile." }
              $seen[$expectedTask] = $true
            }
            foreach ($record in $records) { schtasks.exe /End /TN $record.taskName 2>$null }
            foreach ($record in $records) {
              schtasks.exe /Delete /F /TN $record.taskName 2>$null
              try {
                $scheduler = New-Object -ComObject "Schedule.Service"; $scheduler.Connect()
                $null = $scheduler.GetFolder("\").GetTask($record.taskName)
                $cleanupErrors += "Installed task remains: $($record.taskName)"
              } catch {
                $exception = $_.Exception
                while ($null -ne $exception.InnerException) { $exception = $exception.InnerException }
                if ($exception.HResult -ne -2147024894 -and $exception.HResult -ne -2147024893) { $cleanupErrors += "Task absence is unverified: $($record.taskName)" }
              }
            }
            try {
              $processes = @(Get-CimInstance Win32_Process -ErrorAction Stop)
              foreach ($record in $records) {
                $processNeedle = if ($record.role -cin @("direct", "extra")) { $record.cleanupNeedle } else { Join-Path $record.installRoot "node_modules/openclaw" }
                $remaining = @($processes | Where-Object { $_.CommandLine -and ($_.CommandLine.IndexOf($processNeedle, [StringComparison]::OrdinalIgnoreCase) -ge 0 -or $_.CommandLine.IndexOf($record.stateDir, [StringComparison]::OrdinalIgnoreCase) -ge 0) })
                if ($remaining.Count -gt 0) { $cleanupErrors += "Installed processes remain; preserve evidence for runner teardown." }
              }
            } catch { $cleanupErrors += "Installed process absence is unverified." }
            $summaryRoot = if ([string]::IsNullOrEmpty($env:CI_WINDOWS_SCHTASKS_INSTALLED_CELL)) { $env:TEST_ROOT } else { Join-Path $env:TEST_ROOT $env:CI_WINDOWS_SCHTASKS_INSTALLED_CELL }
            $cleanupErrors | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $summaryRoot "cleanup-summary.txt")
            if ($cleanupErrors.Count -gt 0) { throw ($cleanupErrors -join " ") }
            "owned_package_cleanup=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          New-Item -ItemType Directory -Force -Path $env:TEST_ROOT | Out-Null
          schtasks.exe /End /TN $taskName 2>$null
          Start-Sleep -Milliseconds 200
          $activePidPath = Join-Path $env:TEST_ROOT "active-pid.txt"
          if (Test-Path -LiteralPath $activePidPath) {
            try {
              $probePid = 0
              $activePid = (Get-Content -LiteralPath $activePidPath -Raw).Trim()
              if (-not [int]::TryParse($activePid, [ref]$probePid) -or $probePid -le 1) {
                throw "Invalid Scheduled Task active process id: $activePid"
              }
              $processQueryError = @()
              $process = Get-CimInstance Win32_Process -Filter "ProcessId = $probePid" -ErrorAction SilentlyContinue -ErrorVariable processQueryError
              if ($processQueryError.Count -gt 0) {
                throw "Could not inspect Scheduled Task probe process $probePid."
              }
              if ($process) {
                $probePath = Join-Path $env:TEST_ROOT "probe.mts"
                $eventsPath = Join-Path $env:TEST_ROOT "runs.txt"
                if (
                  $process.CommandLine -like "*$probePath*" -and
                  $process.CommandLine -like "*$eventsPath*"
                ) {
                  taskkill.exe /F /T /PID $probePid 2>$null
                  $deadline = [DateTime]::UtcNow.AddSeconds(30)
                  do {
                    Start-Sleep -Milliseconds 200
                    $processQueryError = @()
                    $process = Get-CimInstance Win32_Process -Filter "ProcessId = $probePid" -ErrorAction SilentlyContinue -ErrorVariable processQueryError
                    if ($processQueryError.Count -gt 0) {
                      throw "Could not verify Scheduled Task probe process $probePid exited."
                    }
                  } while ($process -and [DateTime]::UtcNow -lt $deadline)
                  if ($process) {
                    throw "Scheduled Task probe process $probePid survived cleanup."
                  }
                } else {
                  throw "Refusing to kill reused or unverifiable process id $probePid."
                }
              }
            } catch {
              $cleanupErrors += $_.Exception.Message
            }
          }
          schtasks.exe /Delete /F /TN $taskName 2>$null
          $deleteExit = $LASTEXITCODE
          try {
            $service = New-Object -ComObject "Schedule.Service"
            $service.Connect()
            $null = $service.GetFolder("\").GetTask($taskName)
            $taskExists = $true
          } catch {
            $exception = $_.Exception
            while ($null -ne $exception.InnerException) {
              $exception = $exception.InnerException
            }
            if ($exception.HResult -eq -2147024894 -or $exception.HResult -eq -2147024893) {
              $taskExists = $false
            } else {
              $cleanupErrors += "Could not verify Scheduled Task cleanup for $taskName (HRESULT $($exception.HResult))."
              $taskExists = $null
            }
          }
          if ($taskExists -eq $true) {
            $cleanupErrors += "Scheduled Task cleanup left $taskName registered (delete exit $deleteExit)."
          }
          @(
