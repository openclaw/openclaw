  # A second invocation of the same native step owner keeps source-only proof
  # independent while package mode explicitly waits for its current-run producer.
  native-schtasks-package:
    name: Native Scheduled Task installed proof
    if: ${{ false }} # Diagnostic branch: never run a full native upgrade.
