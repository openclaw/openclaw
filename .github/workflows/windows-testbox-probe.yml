          PUBLISHED_9_4_OUTCOME: ${{ steps.native_schtasks_9_4.outcome }}
          CLEANUP_OUTCOME: ${{ steps.native_cleanup.outcome }}
          CELL_CLEANUP_FRESH: ${{ steps.native_cleanup_fresh.outcome }}
