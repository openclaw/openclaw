name: Published driver update

on:
  workflow_call:
    inputs:
      readiness_enforced:
        required: false
        type: string
        # Legacy callers omit readiness; CI must supply an explicit admission binding.
        default: "false"
      readiness_request_id:
        required: false
        type: string
        default: ""
      readiness_attempt:
        required: false
        type: string
        default: ""
      candidate_artifact_id:
        required: true
        type: string
      candidate_sha256:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  update:
    name: Published driver update
    runs-on: ubuntu-24.04
    steps:
      - name: Start cell budget
        run: |
          # Hosted updates took 401 seconds, with up to 300 seconds of backup cleanup.
          # Reserve 15 seconds for termination and one minute for diagnostics.
          echo "CELL_DEADLINE_EPOCH_SECONDS=$(( $(date +%s) + 1125 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify CI readiness before work
        id: readiness_work_start
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          READINESS_PHASE: work-start
          READINESS_ENFORCED: ${{ inputs.readiness_enforced }}
          READINESS_REQUEST_ID: ${{ inputs.readiness_request_id }}
          READINESS_ATTEMPT: ${{ inputs.readiness_attempt }}
        with:
          script: |
            if (context.eventName !== "pull_request") return;
            if (process.env.READINESS_ENFORCED === "false") return;
            if (process.env.READINESS_ENFORCED !== "true") throw new Error("Missing CI readiness enforcement binding");
            const base = context.payload.pull_request?.base.sha;
            if (!/^[a-f0-9]{40}$/.test(base ?? "")) throw new Error("Missing immutable CI readiness base");
            const { mkdtemp, mkdir, readFile, writeFile, rm } = require("node:fs/promises");
            const { dirname, join } = require("node:path");
            const { tmpdir } = require("node:os");
            const { pathToFileURL } = require("node:url");
            const root = await mkdtemp(join(tmpdir(), "openclaw-readiness-"));
            try {
              // Only immutable base-owned code may authorize candidate work.
              for (const path of [
                ".github/ci-readiness.json",
                "scripts/ci-readiness.mjs",
                "scripts/lib/plain-gh.mjs",
                "scripts/pr-lib/gh-api-preflight.mjs",
                "scripts/lib/direct-run.mjs",
              ]) {
                const { data } = await github.rest.repos.getContent({ ...context.repo, path, ref: base });
                if (data.type !== "file" || data.encoding !== "base64" || typeof data.content !== "string") {
                  throw new Error("Unavailable immutable CI readiness source: " + path);
                }
                const target = join(root, path);
                await mkdir(dirname(target), { recursive: true });
                await writeFile(target, Buffer.from(data.content, "base64"));
              }
              const policy = JSON.parse(await readFile(join(root, ".github/ci-readiness.json"), "utf8"));
              const { inspectReadiness } = await import(pathToFileURL(join(root, "scripts/ci-readiness.mjs")).href);
              const result = await inspectReadiness({
                api: async (path) => (await github.request("GET /" + path, { headers: { "cache-control": "no-cache" } })).data,
                repository: context.repo.owner + "/" + context.repo.repo,
                event: context.payload,
                policy,
                testedSha: context.sha,
                phase: process.env.READINESS_PHASE,
                requestId: process.env.READINESS_REQUEST_ID ?? "",
                admittedAttempt: process.env.READINESS_ATTEMPT ?? "",
                runAttempt: process.env.GITHUB_RUN_ATTEMPT ?? "",
                triggeringActor: process.env.GITHUB_TRIGGERING_ACTOR ?? "",
              });
              if (result.enforced !== "true" || result.broad_ci !== "true") {
                throw new Error("CI readiness authority rejected: " + result.reason);
              }
              core.info(result.reason);
            } finally {
              await rm(root, { recursive: true, force: true });
            }
      - uses: ./.github/actions/setup-node-env
        timeout-minutes: 2
        with:
          install-bun: "false"
          install-deps: "false"
          cache-mode: "off"
      - name: Resolve published driver
        id: driver
        timeout-minutes: 1
        env:
          DRIVER_CACHE_MODE: ${{ github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && 'read-write' || 'restore' }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { appendFileSync } from "node:fs";
          import { classifyReleaseTrain, parseReleaseVersion } from "./scripts/lib/release-version.mjs";
          const version = JSON.parse(execFileSync("npm", ["view", "openclaw@latest", "version", "--json"], { encoding: "utf8" }));
          const parsed = parseReleaseVersion(version);
          if (!parsed || classifyReleaseTrain(parsed) !== "stable") throw new Error("npm latest must resolve to stable");
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ncache-mode=${process.env.DRIVER_CACHE_MODE}\n`);
          NODE
      - name: Restore published driver install
        id: driver_cache
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/published-driver-install/${{ steps.driver.outputs.version }}/driver.tar
          key: published-driver-update-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/e2e/Dockerfile') }}-${{ steps.driver.outputs.version }}
      - name: Prepare main published driver seed
        timeout-minutes: 3
        if: github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && steps.driver.outputs.cache-mode == 'read-write' && steps.driver_cache.outputs.cache-hit != 'true'
        env:
          DRIVER_VERSION: ${{ steps.driver.outputs.version }}
        run: |
          set -euo pipefail
          source scripts/lib/docker-e2e-image.sh
          image=$(docker_e2e_resolve_image openclaw-published-driver-update-e2e)
          docker_e2e_build_or_reuse "$image" published-driver-update "$PWD/scripts/e2e/Dockerfile" "$PWD" bare
          mkdir -p ".cache/published-driver-install/$DRIVER_VERSION"
          chmod a+rwx ".cache/published-driver-install/$DRIVER_VERSION"
          docker_e2e_run_with_harness --init -e DRIVER_VERSION \
            -v "$PWD/.cache/published-driver-install/$DRIVER_VERSION:/tmp/published-driver-cache" \
            "$image" bash -c '
              set -euo pipefail
              prefix=$(mktemp -d)
              npm install --global --prefix "$prefix" "openclaw@$DRIVER_VERSION" --no-audit --no-fund
              tar -cf /tmp/published-driver-cache/driver.tar.pending -C "$prefix" .
              mv /tmp/published-driver-cache/driver.tar.pending /tmp/published-driver-cache/driver.tar
            '
      - name: Save main published driver seed
        timeout-minutes: 2
        if: github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && steps.driver.outputs.cache-mode == 'read-write' && steps.driver_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/published-driver-install/${{ steps.driver.outputs.version }}/driver.tar
          key: published-driver-update-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/e2e/Dockerfile') }}-${{ steps.driver.outputs.version }}
      - name: Download candidate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        timeout-minutes: 2
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          path: .artifacts/published-driver-package
          merge-multiple: true
      - name: Update published driver to candidate
        timeout-minutes: 20
        env:
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          DRIVER_VERSION: ${{ steps.driver.outputs.version }}
        run: |
          set -euo pipefail
          package=.artifacts/published-driver-package/openclaw-candidate.tgz
          artifacts=.artifacts/published-driver-update
          mkdir -p "$artifacts"
          actual_sha256=$(sha256sum "$package")
          actual_sha256=${actual_sha256%% *}
          printf 'Candidate SHA-256: expected=%s actual=%s\n' "$CANDIDATE_SHA256" "$actual_sha256"
          if [ "$actual_sha256" != "$CANDIDATE_SHA256" ]; then
            echo '::error title=Candidate checksum mismatch::Downloaded candidate package does not match its expected SHA-256.'
            exit 1
          fi
          remaining=$((CELL_DEADLINE_EPOCH_SECONDS - $(date +%s)))
          if [ "$remaining" -le 0 ]; then
            echo '::error title=Published-driver cell timed out::Candidate preparation exhausted the cell budget.'
            echo 'Published-driver cell failed: candidate preparation exhausted the cell budget.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cell_exit=0
          timeout --signal=TERM --kill-after=15s "${remaining}s" \
            bash scripts/e2e/published-driver-update-docker.sh "$package" "$artifacts" "$DRIVER_VERSION" || cell_exit=$?
          if [ "$cell_exit" -eq 124 ] || [ "$cell_exit" -eq 137 ]; then
            phase="$(cat "$artifacts/phase.txt" 2>/dev/null || printf 'prepare-container')"
            reason="Published-driver cell timed out or was killed during ${phase} (exit ${cell_exit})."
            echo "::error title=Published-driver cell stopped::${reason}"
            printf '%s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          exit "$cell_exit"
      - name: Preserve synthetic update diagnostics
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-driver-update
          path: .artifacts/published-driver-update
          retention-days: 7
