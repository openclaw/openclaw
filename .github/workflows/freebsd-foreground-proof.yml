ed590ee769e27b7b90ff59af9c7fe10343348f95f63d","src/flows/doctor-gateway-daemon.test.ts":"e715797c6c579c38d1af9308e1074e0ef7b07c33064fa7664756334167164853"}'

jobs:
  package:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/freebsd-foreground-update'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_VITEST_MAX_WORKERS: "2"
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}
      source_archive_sha256: ${{ steps.seal.outputs.source_archive_sha256 }}
      package_version: ${{ steps.seal.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 12
          persist-credentials: false
      - &identity
        name: Verify reviewed source identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$PASSED_SOURCE_SHA"
          test "$(git rev-parse "$PASSED_SOURCE_SHA^")" = "$PRODUCT_SHA"
          git merge-base --is-ancestor "$COMPARISON_BASE" HEAD
          test "$(git rev-parse "$PRODUCT_SHA^{tree}")" = "$EXPECTED_PRODUCT_TREE"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/freebsd-foreground-proof.yml
          git diff --exit-code "$PRODUCT_SHA" HEAD -- . ':(exclude).github/workflows/freebsd-foreground-proof.yml'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          for (const [file, expected] of Object.entries(JSON.parse(process.env.SOURCE_PINS))) {
            assert.equal(createHash('sha256').update(fs.readFileSync(file)).digest('hex'), expected, file);
            console.log(`${expected}  ${file}`);
          }
          NODE
      - name: Set up frozen build dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          install-bun: "false"
          cache-mode: "off"
      - name: Bind the completed source checks and Linux controls
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const actual=execFileSync('git',['diff','--name-only',process.env.PRIOR_PRODUCT_SHA,process.env.PRODUCT_SHA],{encoding:'utf8'}).trim().split('\n');
          assert.deepEqual(actual,JSON.parse(process.env.FIX_PATHS));
          console.log(JSON.stringify({carriedProof:{run:'35101985276',attempt:1,job:'104813422232',source:process.env.PASSED_SOURCE_SHA,product:process.env.PRODUCT_SHA,logSha256:'a075bca6ffe877d8c042472025d0ddc9c8661b0449d3900e8d1585eff8d3e57b',changedChecks:'passed',deadCodeScans:'passed',linux:{passed:445,skipped:10,files:19}},freshPackageRequired:true}));
          NODE
      - name: Fetch and authenticate the published bootstrap package once
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/published-baseline" "$RUNNER_TEMP/proof"
          # Canonical published-artifact readback; dependency-install cooldowns stay unchanged.
          timeout --preserve-status 300s npm pack openclaw@2026.9.4 --ignore-scripts --json --min-release-age=0 --registry=https://registry.npmjs.org/ \
            --pack-destination "$RUNNER_TEMP/published-baseline" > "$RUNNER_TEMP/published-baseline/pack.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const dir=`${process.env.RUNNER_TEMP}/published-baseline`;
          const rows=JSON.parse(fs.readFileSync(`${dir}/pack.json`));
          assert.equal(rows.length,1);
          const row=rows[0]; assert.equal(row.name,'openclaw'); assert.equal(row.version,'2026.9.4');
          assert.equal(row.filename,'openclaw-2026.9.4.tgz'); assert.equal(row.integrity,process.env.BASELINE_SRI);
          const bytes=fs.readFileSync(`${dir}/${row.filename}`);
          assert.equal(`sha512-${createHash('sha512').update(bytes).digest('base64')}`,process.env.BASELINE_SRI);
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/proof/published-2026.9.4.tgz`,bytes,{flag:'wx'});
          console.log(JSON.stringify({publishedBootstrap:'openclaw@2026.9.4',integrity:process.env.BASELINE_SRI,size:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')}));
          NODE
      # Final source-only CI rechecks the current-main line-cap ratchet against
      # the composed tree. This source snapshot predates that script.
      # The prior runner uploaded no artifact; this rebuild creates fresh bytes and identity.
      - name: Build and pack the candidate once
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=openclaw/ "$SOURCE_SHA" > "$RUNNER_TEMP/source.tar.gz"
          node scripts/package-openclaw-for-docker.mjs --allow-unreleased-changelog             --output-dir "$RUNNER_TEMP/candidate-package" --output-name candidate.tgz             --pack-json "$RUNNER_TEMP/candidate-pack.json"
      - *identity
      - name: Seal candidate and metadata-only update target
        id: seal
        run: |
          set -euo pipefail
          node scripts/install-smoke-candidate-payload.mts seal             --archive "$RUNNER_TEMP/source.tar.gz"             --package-dir "$RUNNER_TEMP/candidate-package" --output-dir "$RUNNER_TEMP/proof/payload"             --repository "$GITHUB_REPOSITORY" --target-sha "$SOURCE_SHA"             --harness-repository "$GITHUB_REPOSITORY" --harness-sha "$SOURCE_SHA"             --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          cp "$RUNNER_TEMP/source.tar.gz" "$RUNNER_TEMP/proof/source.tar.gz"
          git show "$PRIOR_PRODUCT_SHA:src/infra/update-freebsd-root-ownership.ts" > "$RUNNER_TEMP/proof/ownership-before.ts"
          node scripts/e2e/lib/update-first-hop-package-fixtures.mjs first-hop-tarball             "$RUNNER_TEMP/proof/payload/candidate.tgz" "$RUNNER_TEMP/proof/first-hop.tgz" 0             > "$RUNNER_TEMP/proof/first-hop.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const dir = `${process.env.RUNNER_TEMP}/proof`;
          const receipt = JSON.parse(fs.readFileSync(`${dir}/first-hop.json`));
          assert.equal(receipt.method, 'candidate-same-schema-first-hop-fixture');
          const allowed = ['package.json', 'dist/build-info.json', 'dist/postinstall-content-inventory.json'];
          assert(receipt.members.changes.length >= 2);
          assert(receipt.members.changes.every(change => allowed.includes(change.path) && change.before && change.after));
          const manifest = JSON.parse(fs.readFileSync(`${dir}/payload/install-smoke-candidate-payload.json`));
          assert.equal(receipt.sourceSha256, manifest.files.find(file => file.name === 'candidate.tgz').sha256);
          assert.equal(receipt.targetSha256, createHash('sha256').update(fs.readFileSync(`${dir}/first-hop.tgz`)).digest('hex'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `manifest_sha256=${createHash('sha256').update(fs.readFileSync(`${dir}/payload/install-smoke-candidate-payload.json`)).digest('hex')}\nsource_archive_sha256=${manifest.sourceArchiveSha256}\npackage_version=${manifest.packageVersion}\n`);
          console.log(JSON.stringify(receipt));
          NODE
      - name: Upload immutable source and packages
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: freebsd-foreground-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  native:
    needs: package
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/freebsd-foreground-update'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      EXPECTED_NODE_ARCH: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}
      MANIFEST_SHA: ${{ needs.package.outputs.manifest_sha256 }}
      ARCHIVE_SHA: ${{ needs.package.outputs.source_archive_sha256 }}
      PACKAGE_VERSION: ${{ needs.package.outputs.package_version }}
      PAYLOAD_ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
      PAYLOAD_ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact_digest }}
      PROOF_REPOSITORY: ${{ github.repository }}
      PROOF_RUN_ID: ${{ github.run_id }}
      CONSUMER_RUN_ID: ${{ github.run_id }}
      CONSUMER_RUN_ATTEMPT: ${{ github.run_attempt }}
      PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 12
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/install-smoke-candidate-payload.mts
            /.github/workflows/freebsd-foreground-proof.yml
      - name: Verify the workflow-only producer and reviewed product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HARNESS_SHA"
          test "$(git rev-parse HEAD^)" = "$PASSED_SOURCE_SHA"
          test "$(git rev-parse "$PASSED_SOURCE_SHA^")" = "$PRODUCT_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/freebsd-foreground-proof.yml
          test "$(git rev-parse "$PRODUCT_SHA^{tree}")" = "$EXPECTED_PRODUCT_TREE"
          git merge-base --is-ancestor "$COMPARISON_BASE" HEAD
          git diff --exit-code "$PRODUCT_SHA" HEAD -- . ':(exclude).github/workflows/freebsd-foreground-proof.yml'
          printf 'consumer_head=%s consumer_run=%s consumer_attempt=%s producer_head=%s producer_run=%s producer_attempt=%s\n' "$HARNESS_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SOURCE_SHA" "$PROOF_RUN_ID" "$PROOF_RUN_ATTEMPT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
