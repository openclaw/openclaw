# Temporary diagnostic transport on diagnostic/docker-bind-5ca-20261107 only.
# C/Q and all package/image bytes remain the original 5ca candidate. This is not
# release qualification, publication, a retry policy, or a collision-prevention fix.
name: Docker bind diagnostic 5ca
run-name: Docker bind diagnostic 5ca - ${{ github.run_id }}
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: docker-bind-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CANDIDATE_SHA: 5ca478fb3d02d7d988ce09cfcc214ec1eed46ab8
      PACKAGE_SHA256: 78d06b83f523c4ded9b84a1d6cdf0a811c526f096de5b42667d5794a5ee0c970
      PACKAGE_VERSION: 2026.9.37
    steps:
      - name: Checkout frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5ca478fb3d02d7d988ce09cfcc214ec1eed46ab8
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout diagnostic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .release-harness
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source and diagnostic-only delta
        env:
          DIAGNOSTIC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C .release-harness rev-parse HEAD)" = "$DIAGNOSTIC_SHA"
          test "$(git -C .release-harness rev-parse HEAD^)" = "$CANDIDATE_SHA"
          mkdir -p .artifacts/docker-bind-diagnostic
          git -C .release-harness diff --name-only HEAD^ HEAD > .artifacts/docker-bind-diagnostic/changed-paths.txt
          printf '%s\n' .github/workflows/openclaw-release-checks.yml scripts/e2e/lib/mcp-code-mode/scenario.sh scripts/e2e/lib/mock-listen-diagnostic.mjs scripts/e2e/mock-openai-server.mjs test/scripts/mock-openai-listen-diagnostic.test.ts > .artifacts/docker-bind-diagnostic/expected-paths.txt
          diff -u .artifacts/docker-bind-diagnostic/expected-paths.txt .artifacts/docker-bind-diagnostic/changed-paths.txt
          printf 'candidate=%s\ndiagnostic=%s\noriginal_frv=42361691019/1\noriginal_child=42363175834/1\noriginal_job=128376894396\nscenario=mcp-code-mode-gateway\n' "$CANDIDATE_SHA" "$DIAGNOSTIC_SHA" > .artifacts/docker-bind-diagnostic/identity.txt
      - name: Setup diagnostic harness
        uses: ./.release-harness/.github/actions/setup-release-harness
        with:
          node-version: 24.22.1
      - name: Setup candidate environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          node-version: 24.22.1
          install-bun: "true"
      - name: Verify original artifact service identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper=.release-harness/scripts/docker/shared-image-artifact.sh
          bash "$helper" verify-upload Package 13569794754 docker-e2e-package-42362392256-1 9d6237b119dc9caafd2e6329a52e89128fc34e47ec819a2bc5470c2ca992f9aa 42362392256 1
          bash "$helper" verify-upload Registry 13570660484 docker-e2e-prepublish-plugin-registry-42362392256-1 5f0f0250f70102dede0dd85a3863df35ca46f8dc6d0866bb41128cf945ad404f 42362392256 1
          bash "$helper" verify-upload Image 13570254455 docker-e2e-shared-images-full-release-5ca478fb3d02-42362392256-1 e2f18f747c4bd62c00c74d95f83a703f5fe0f7999626a83902450a75e0630908 42362392256 1
          gh api repos/openclaw/openclaw/actions/runs/42362392256/attempts/1 --jq '{id,run_attempt,head_sha,path,status,conclusion}' > .artifacts/docker-bind-diagnostic/producer.json
          jq -e --arg sha "$CANDIDATE_SHA" '.id == 42362392256 and .run_attempt == 1 and .head_sha == $sha and .status == "completed" and .conclusion == "success"' .artifacts/docker-bind-diagnostic/producer.json
      - name: Download original package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 13569794754
          run-id: 42362392256
          github-token: ${{ github.token }}
          path: .artifacts/docker-e2e-package
      - name: Download original prerelease plugin registry
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 13570660484
          run-id: 42362392256
          github-token: ${{ github.token }}
          path: .artifacts/prepublish-plugin-registry
      - name: Download original image archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 13570254455
          run-id: 42362392256
          github-token: ${{ github.token }}
          path: .artifacts/docker-e2e-images
      - name: Verify original package and registry bytes
        run: |
          set -euo pipefail
          package="$GITHUB_WORKSPACE/.artifacts/docker-e2e-package/openclaw-current.tgz"
          printf '%s  %s\n' "$PACKAGE_SHA256" "$package" | sha256sum -c -
          test "$(tar -xOf "$package" package/dist/build-info.json | jq -r .commit)" = "$CANDIDATE_SHA"
          test "$(tar -xOf "$package" package/package.json | jq -r .version)" = "$PACKAGE_VERSION"
          (cd .release-harness && timeout --foreground 5m pnpm exec node scripts/check-openclaw-package-tarball.mjs "$package")
          node .release-harness/scripts/prepublish-plugin-registry-artifact.mjs verify --artifact-dir .artifacts/prepublish-plugin-registry --source-sha "$CANDIDATE_SHA" --candidate-version "$PACKAGE_VERSION" --manifest-sha256 c0b1554c51d7a317b8ff11da8682c5607c59b8a442c3981942e838ade5cdece4 --required-packages-json '["@openclaw/codex"]'
      - name: Verify and load original candidate image
        env:
          OPENCLAW_SHARED_IMAGE_ARCHIVE_SHA256: 0011f80a105611d92661679cb680e4e215da5db99a52e18301c3c7dfe88d2e9b
          OPENCLAW_SHARED_IMAGE_PACKAGE_SHA256: 78d06b83f523c4ded9b84a1d6cdf0a811c526f096de5b42667d5794a5ee0c970
          OPENCLAW_SHARED_IMAGE_RUN_ID: "42362392256"
          OPENCLAW_SHARED_IMAGE_RUN_ATTEMPT: "1"
        run: |
          set -euo pipefail
          bare_context_sha="$(sed '/^FROM bare AS build$/,$d' .release-harness/scripts/e2e/Dockerfile | sha256sum | awk '{print $1}')"
          bare="openclaw-docker-e2e-bare:base-${bare_context_sha:0:32}"
          functional="openclaw-docker-e2e-functional:pkg-${PACKAGE_SHA256:0:32}"
          # The archive was produced by original Q, not this diagnostic harness.
          bash .release-harness/scripts/docker/shared-image-artifact.sh load .artifacts/docker-e2e-images docker-e2e "$CANDIDATE_SHA" "$CANDIDATE_SHA" "$bare" "$functional"
          echo "OPENCLAW_DOCKER_E2E_BARE_IMAGE=$bare" >> "$GITHUB_ENV"
          echo "OPENCLAW_DOCKER_E2E_FUNCTIONAL_IMAGE=$functional" >> "$GITHUB_ENV"
          echo "OPENCLAW_DOCKER_E2E_IMAGE=$functional" >> "$GITHUB_ENV"
          cp .artifacts/docker-e2e-images/shared-image-artifact.json .artifacts/docker-bind-diagnostic/original-image.json
      - name: Run one native code-mode scenario
        env:
          OPENCLAW_DOCKER_E2E_REPO_ROOT: ${{ github.workspace }}
          OPENCLAW_DOCKER_E2E_SELECTED_SHA: 5ca478fb3d02d7d988ce09cfcc214ec1eed46ab8
          OPENCLAW_SELECTED_SHA: 5ca478fb3d02d7d988ce09cfcc214ec1eed46ab8
          OPENCLAW_TOOLING_SHA: ${{ github.sha }}
          OPENCLAW_CURRENT_PACKAGE_TGZ: .artifacts/docker-e2e-package/openclaw-current.tgz
          OPENCLAW_PREPUBLISH_PLUGIN_REGISTRY_DIR: .artifacts/prepublish-plugin-registry
          OPENCLAW_PREPUBLISH_PLUGIN_REGISTRY_CANDIDATE_VERSION: 2026.9.37
          OPENCLAW_PREPUBLISH_PLUGIN_REGISTRY_MANIFEST_SHA256: c0b1554c51d7a317b8ff11da8682c5607c59b8a442c3981942e838ade5cdece4
          OPENCLAW_DOCKER_E2E_REQUIRE_LOCAL_IMAGE: "1"
          OPENCLAW_SKIP_DOCKER_BUILD: "1"
          OPENCLAW_DOCKER_ALL_LANES: mcp-code-mode-gateway
          OPENCLAW_DOCKER_ALL_PROFILE: release-path
          OPENCLAW_DOCKER_ALL_RELEASE_PROFILE: stable
          OPENCLAW_DOCKER_ALL_BUILD: "0"
          OPENCLAW_DOCKER_ALL_PREFLIGHT: "0"
          OPENCLAW_DOCKER_ALL_FAIL_FAST: "0"
          OPENCLAW_DOCKER_ALL_INCLUDE_OPENWEBUI: "false"
          OPENCLAW_DOCKER_ALL_LOG_DIR: .artifacts/docker-bind-diagnostic/run
          OPENCLAW_DOCKER_ALL_TIMINGS_FILE: .artifacts/docker-bind-diagnostic/timings.json
        run: |
          set -euo pipefail
          export OPENCLAW_DOCKER_ALL_PNPM_COMMAND="$(command -v pnpm)"
          source .release-harness/scripts/lib/frozen-target-compat.sh
          openclaw_resolve_frozen_update_channel_dry_run_mode "$GITHUB_WORKSPACE"
          node .release-harness/scripts/test-docker-all.mjs --plan-json > .artifacts/docker-bind-diagnostic/plan.json
          node --input-type=module -e '
            import fs from "node:fs";
            const plan = JSON.parse(fs.readFileSync(".artifacts/docker-bind-diagnostic/plan.json", "utf8"));
            if (plan.lanes.length !== 1 || plan.lanes[0].name !== "mcp-code-mode-gateway") throw new Error("expected exactly the original failing scenario");
          '
          node .release-harness/scripts/test-docker-all.mjs
      - name: Upload diagnostic-only evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docker-bind-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/docker-bind-diagnostic/
          if-no-files-found: error
          retention-days: 7
