name: macOS Periphery Dead Code
# Job conclusions cannot distinguish passive draft events from scope loss.
# Record source admission for the commenter before either job runs.
run-name: ${{ github.workflow }} [${{ github.event_name == 'workflow_dispatch' && 'manual' || github.event.pull_request.draft == false && 'report' || github.event.action == 'converted_to_draft' && 'draft' || 'passive' }}]

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
  workflow_call:
    inputs:
      shared_only:
        type: boolean
        default: false
      ios_only:
        type: boolean
        default: false

concurrency:
  # Admission precedes scope skips: isolate passive drafts before they can cancel useful work.
  # Keep conversion events in the PR group as an intentional cancellation signal.
  group: >-
    ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.action != 'converted_to_draft'
      && format('{0}-passive-draft-{1}', github.workflow, github.run_id)
      || format('macos-periphery-{0}-{1}', github.workflow, github.event.pull_request.number || github.sha) }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  scope:
    name: Detect macOS scan scope
    runs-on: ubuntu-24.04
    outputs:
      should-scan: ${{ steps.scope.outputs.should-scan }}
      shared-scan: ${{ steps.scope.outputs.shared-scan }}
      ios-scan: ${{ steps.scope.outputs.ios-scan }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Detect changed paths
        id: scope
        env:
          PERIPHERY_SHARED_ONLY: ${{ inputs.shared_only }}
          PERIPHERY_IOS_ONLY: ${{ inputs.ios_only }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            if (context.eventName === "workflow_dispatch") {
              core.setOutput("should-scan", String(process.env.PERIPHERY_SHARED_ONLY !== "true" && process.env.PERIPHERY_IOS_ONLY !== "true"));
              core.setOutput("shared-scan", String(process.env.PERIPHERY_SHARED_ONLY === "true"));
              core.setOutput("ios-scan", String(process.env.PERIPHERY_IOS_ONLY === "true"));
              return;
            }
            if (context.payload.pull_request?.draft) {
              core.setOutput("should-scan", "false");
              core.setOutput("shared-scan", "false");
              core.setOutput("ios-scan", "false");
              return;
            }

            // pull_request checks out GitHub's synthetic merge commit. Its first
            // parent is the exact base tree used to produce the tested result.
            const result = await exec.getExecOutput("git", [
              "diff",
              "--quiet",
              "HEAD^1",
              "HEAD",
              "--",
              "apps/macos/",
              ".github/workflows/macos-periphery.yml",
              ".github/workflows/ios-periphery-comment.yml",
              "apps/macos/.periphery.yml",
              "scripts/install-periphery.sh",
              "scripts/lib/swift-toolchain.sh",
              ":(exclude)apps/macos/README.md",
              ":(exclude)apps/macos/AGENTS.md",
            ], { ignoreReturnCode: true, silent: true });
            if (result.exitCode !== 0 && result.exitCode !== 1) {
              throw new Error(`git diff failed with exit code ${result.exitCode}`);
            }
            core.setOutput("should-scan", String(result.exitCode === 1));

            const iosResult = await exec.getExecOutput("git", [
              "diff",
              "--quiet",
              "HEAD^1",
              "HEAD",
              "--",
              "apps/ios/",
              "apps/shared/OpenClawKit/Sources/",
              "apps/swabble/Sources/SwabbleKit/",
              ".github/workflows/ios-periphery.yml",
              ".github/workflows/macos-periphery.yml",
              ".github/workflows/ios-periphery-comment.yml",
              "config/swiftformat",
              "config/swiftlint.yml",
              "scripts/check-swift-tools.sh",
              "scripts/format-swift.sh",
              "scripts/install-periphery.sh",
              "scripts/lib/swift-toolchain.sh",
              "scripts/install-swift-tools.sh",
              "scripts/ios-write-swift-filelist.mjs",
              "scripts/ios-write-swift-filelist.mts",
              "scripts/lint-swift.sh",
              "scripts/run-swiftlint.mts",
              "scripts/lib/check-limits.mts",
              ":(exclude)apps/ios/README.md",
              ":(exclude)apps/ios/AGENTS.md",
              ":(exclude)apps/ios/DESIGN.md",
              ":(exclude)apps/ios/CHANGELOG.md",
              ":(exclude)apps/ios/VERSIONING.md",
              ":(exclude)apps/ios/fastlane/SETUP.md",
              ":(exclude)apps/ios/fastlane/metadata/README.md",
            ], { ignoreReturnCode: true, silent: true });
            if (iosResult.exitCode !== 0 && iosResult.exitCode !== 1) {
              throw new Error(`git diff failed with exit code ${iosResult.exitCode}`);
            }
            core.setOutput("ios-scan", String(iosResult.exitCode === 1));

            const protocolInputs = JSON.parse(require("node:fs").readFileSync("scripts/native-protocol-inputs.json", "utf8"));
            const sharedResult = await exec.getExecOutput("git", [
              "diff",
              "--quiet",
              "HEAD^1",
              "HEAD",
              "--",
              "apps/ios/",
              "apps/macos/",
              "apps/shared/OpenClawKit/",
              ...protocolInputs.directories.map((directory) => `${directory}/`),
              ...protocolInputs.files,
              ".github/workflows/shared-openclawkit-periphery.yml",
              ".github/workflows/macos-periphery.yml",
              "scripts/install-periphery.sh",
              "scripts/lib/swift-toolchain.sh",
              "scripts/periphery-intersection.mjs",
              "scripts/ios-configure-signing.sh",
              "scripts/ios-write-swift-filelist.mjs",
              "scripts/ios-write-swift-filelist.mts",
              "scripts/ios-write-version-xcconfig.sh",
              "test/scripts/periphery-intersection.test.ts",
              ":(exclude)apps/ios/README.md",
              ":(exclude)apps/ios/AGENTS.md",
              ":(exclude)apps/ios/DESIGN.md",
              ":(exclude)apps/ios/CHANGELOG.md",
              ":(exclude)apps/ios/VERSIONING.md",
              ":(exclude)apps/ios/fastlane/SETUP.md",
              ":(exclude)apps/ios/fastlane/metadata/README.md",
              ":(exclude)apps/macos/README.md",
              ":(exclude)apps/macos/AGENTS.md",
            ], { ignoreReturnCode: true, silent: true });
            if (sharedResult.exitCode !== 0 && sharedResult.exitCode !== 1) {
              throw new Error(`git diff failed with exit code ${sharedResult.exitCode}`);
            }
            core.setOutput("shared-scan", String(sharedResult.exitCode === 1));

  macos-index:
    name: Build macOS Periphery reports
    needs: scope
    if: ${{ needs.scope.outputs.should-scan == 'true' || needs.scope.outputs.shared-scan == 'true' }}
    outputs:
      # Job failure can belong to either report; retain each branch's own completion proof.
      app-complete: ${{ steps.build.outcome == 'success' && steps.app-scan.outcome == 'success' && steps.app-report.outcome == 'success' && steps.app-upload.outcome == 'success' }}
      app-failure: ${{ steps.app-report.outputs.should-fail }}
      shared-complete: ${{ steps.build.outcome == 'success' && steps.shared-scan.outcome == 'success' && steps.shared-upload.outcome == 'success' }}
      shared-status: ${{ steps.shared-scan.outputs.status }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Verify Xcode
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "false"
          install-deps: "false"

      - name: Install native asset dependencies
        env:
          CI: "true"
        run: >-
          pnpm install --frozen-lockfile --prefer-offline --optional
          --filter '@openclaw/mermaid-renderer...'
          --filter '@openclaw/gateway-protocol...'
          --config.ignore-scripts=false
          --config.engine-strict=false
          --config.enable-pre-post-scripts=true
          --config.side-effects-cache=true

      - name: Prepare Apple Mermaid assets
        run: node scripts/prepare-apple-mermaid.mjs

      - name: Install Periphery
        run: |
          periphery_dir="$RUNNER_TEMP/openclaw-periphery"
          ./scripts/install-periphery.sh "$periphery_dir"
          echo "$periphery_dir" >> "$GITHUB_PATH"

      - name: Build macOS consumer index
        id: build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shared-periphery-macos"
          cd apps/macos
          swift package --scratch-path ../../.cache/periphery-swift clean
          /usr/bin/time -p swift build --build-system native --scratch-path ../../.cache/periphery-swift --build-tests --enable-index-store \
            2>&1 | tee "$RUNNER_TEMP/shared-periphery-macos/build.log"

      - name: Run Periphery
        id: app-scan
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.scope.outputs.should-scan == 'true' }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/macos-periphery"
          mkdir -p "$output_dir"
          cd apps/macos
          set +e
          periphery scan \
            --config .periphery.yml \
            --skip-build \
            --strict \
            --format json \
            --write-results "$output_dir/periphery.json" \
            >"$output_dir/periphery.stdout.json" \
            2>"$output_dir/periphery.stderr.log"
          periphery_status="$?"
          set -e
          printf '%s\n' "$periphery_status" >"$output_dir/periphery.status"
          if [ ! -s "$output_dir/periphery.json" ]; then
            cp "$output_dir/periphery.stdout.json" "$output_dir/periphery.json"
          fi

      - name: Build Periphery report
        id: app-report
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.scope.outputs.should-scan == 'true' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const outputDir = path.join(process.env.RUNNER_TEMP, "macos-periphery");
          const read = (name) => {
            const file = path.join(outputDir, name);
            return fs.existsSync(file) ? fs.readFileSync(file, "utf8") : "";
          };

          const status = Number(read("periphery.status").trim() || "1");
          let findings = null;
          for (const name of ["periphery.json", "periphery.stdout.json"]) {
            try {
              const parsed = JSON.parse(read(name));
              if (Array.isArray(parsed)) {
                findings = parsed;
                break;
              }
            } catch {}
          }

          const escapeCommandData = (value) =>
            String(value ?? "")
              .replaceAll("%", "%25")
              .replaceAll("\r", "%0D")
              .replaceAll("\n", "%0A");
          const escapeCommandProperty = (value) =>
            escapeCommandData(value)
              .replaceAll(":", "%3A")
              .replaceAll(",", "%2C");

          const rows = (findings ?? []).map((finding) => {
            const location = String(finding.location ?? "");
            const [file, line] = location.split(":");
            const repoFile = file ? `apps/macos/${file}` : "";
            return {
              file: repoFile,
              line: line || "",
              kind: String(finding.kind ?? ""),
              name: String(finding.name ?? ""),
            };
          });

          for (const row of rows) {
            if (!row.file) continue;
            const line = row.line ? `,line=${escapeCommandProperty(row.line)}` : "";
            const title = `${row.kind || "Unused code"} ${row.name}`.trim();
            console.log(`::error file=${escapeCommandProperty(row.file)}${line},title=Dead Swift code::${escapeCommandData(title)}`);
          }

          let shouldFail = "1";
          let summary = "";

          if (findings === null) {
            summary = [
              "### macOS Periphery",
              "",
              "Periphery did not complete. Check the workflow artifact for stdout/stderr.",
            ].join("\n");
          } else if (rows.length === 0 && status === 0) {
            shouldFail = "0";
            summary = [
              "### macOS Periphery",
              "",
              "No dead Swift code found.",
            ].join("\n");
          } else if (rows.length > 0) {
            summary = [
              "### macOS Periphery",
              "",
              `Found ${rows.length} dead Swift code ${rows.length === 1 ? "symbol" : "symbols"}. See the PR comment or workflow artifact for details.`,
            ].join("\n");
          } else {
            summary = [
              "### macOS Periphery",
              "",
              "Periphery exited with a non-zero status before producing findings. Check the workflow artifact for stdout/stderr.",
            ].join("\n");
          }

          fs.writeFileSync(path.join(outputDir, "should-fail.txt"), `${shouldFail}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `should-fail=${shouldFail}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.trim()}\n`);
          NODE

      - name: Upload Periphery report
        id: app-upload
        if: ${{ !cancelled() && needs.scope.outputs.should-scan == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-periphery-dead-code-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-periphery
          if-no-files-found: error
          retention-days: 14

      # Separate scan processes preserve the app and shared-kit retention policies.
      - name: Scan shared kit from macOS index
        id: shared-scan
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.scope.outputs.shared-scan == 'true' }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/shared-periphery-macos"
          mkdir -p "$output_dir"
          cd apps/macos
          set +e
          periphery scan \
            --config .periphery.yml \
            --skip-build \
            --format json \
            --report-include '../shared/OpenClawKit/Sources/**' \
            --retain-files '**/GenerateGatewayProtocol/GatewayModels.swift' \
            --write-results "$output_dir/periphery.json" \
            >"$output_dir/periphery.stdout.json" \
            2>"$output_dir/periphery.stderr.log"
          periphery_status="$?"
          set -e
          printf '%s\n' "$periphery_status" >"$output_dir/periphery.status"
          echo "status=$periphery_status" >> "$GITHUB_OUTPUT"
          if [ ! -s "$output_dir/periphery.json" ]; then
            cp "$output_dir/periphery.stdout.json" "$output_dir/periphery.json"
          fi

      - name: Upload macOS consumer report
        id: shared-upload
        if: ${{ !cancelled() && needs.scope.outputs.shared-scan == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-periphery-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shared-periphery-macos
          if-no-files-found: error
          retention-days: 14

  scan:
    name: Scan macOS dead code
    needs: [scope, macos-index]
    if: ${{ always() && needs.scope.outputs.should-scan == 'true' && needs.macos-index.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce macOS app report
        env:
          REPORT_COMPLETE: ${{ needs.macos-index.outputs.app-complete }}
          APP_FAILURE: ${{ needs.macos-index.outputs.app-failure }}
        run: test "$REPORT_COMPLETE" = "true" && test "$APP_FAILURE" = "0"

  scan-macos:
    name: Scan shared kit from macOS
    needs: [scope, macos-index]
    if: ${{ always() && needs.scope.outputs.shared-scan == 'true' && needs.macos-index.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce macOS shared scan
        env:
          REPORT_COMPLETE: ${{ needs.macos-index.outputs.shared-complete }}
          SCAN_STATUS: ${{ needs.macos-index.outputs.shared-status }}
        run: test "$REPORT_COMPLETE" = "true" && test "$SCAN_STATUS" = "0"

  ios-index:
    name: Build iOS Periphery reports
    needs: scope
    if: ${{ needs.scope.outputs.ios-scan == 'true' || needs.scope.outputs.shared-scan == 'true' }}
    outputs:
      # Job failure can belong to either report; retain each branch's own completion proof.
      app-complete: ${{ steps.build.outcome == 'success' && steps.app-scan.outcome == 'success' && steps.app-report.outcome == 'success' && steps.app-upload.outcome == 'success' }}
      app-failure: ${{ steps.app-report.outputs.should-fail }}
      shared-complete: ${{ steps.build.outcome == 'success' && steps.shared-scan.outcome == 'success' && steps.shared-upload.outcome == 'success' }}
      shared-status: ${{ steps.shared-scan.outputs.status }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Verify Xcode
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "false"

      - name: Install Watch Rust toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          watch_toolchain="$(awk -F '"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$watch_toolchain"
          rustup toolchain install "$watch_toolchain" --profile minimal --component rust-src

      - name: Identify Watch RTC cache inputs
        id: ios-cache-inputs
        run: |
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "OPENCLAW_WATCH_RTC_CACHE_DIR=$RUNNER_TEMP/openclaw-watch-rtc-libraries" >> "$GITHUB_ENV"

      # Consume the exact cache published by trusted main CI; this workflow never writes it.
      - name: Restore Watch RTC build inputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ${{ runner.temp }}/openclaw-watch-rtc-libraries
          key: watch-rtc-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache-inputs.outputs.xcode }}-${{ hashFiles('apps/shared/OpenClawWatchRTC/Cargo.lock', 'apps/shared/OpenClawWatchRTC/Cargo.toml', 'apps/shared/OpenClawWatchRTC/rust-toolchain.toml', 'apps/shared/OpenClawWatchRTC/build.sh', 'apps/shared/OpenClawWatchRTC/src/**', 'apps/ios/project.yml') }}

      - name: Install iOS scan tooling
        run: |
          periphery_dir="$RUNNER_TEMP/openclaw-periphery"
          ./scripts/install-periphery.sh "$periphery_dir"
          echo "$periphery_dir" >> "$GITHUB_PATH"
          swift_tools_dir="$RUNNER_TEMP/openclaw-swift-tools"
          # Homebrew's xcodegen bottle can arrive corrupted on runner images;
          # use the repo's pinned, checksummed release installer like ci.yml.
          ./scripts/install-xcodegen.sh "$swift_tools_dir"
          "$swift_tools_dir/xcodegen" --version
          ./scripts/install-swift-tools.sh "$swift_tools_dir"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"
          "$swift_tools_dir/swiftformat" --version
          "$swift_tools_dir/swiftlint" version

      - name: Generate iOS project
        run: |
          set -euo pipefail
          ./scripts/ios-configure-signing.sh
          ./scripts/ios-write-version-xcconfig.sh
          node scripts/ios-write-swift-filelist.mjs
          cd apps/ios
          xcodegen generate

      - name: Build iOS consumer index
        id: build
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/shared-periphery-ios"
          mkdir -p "$output_dir"
          cd apps/ios
          # Match Periphery's build-for-testing contract, with a fresh run-owned index.
          /usr/bin/time -p xcodebuild \
            -project OpenClaw.xcodeproj -scheme OpenClaw -parallelizeTargets \
            -derivedDataPath "$RUNNER_TEMP/shared-periphery-ios-derived" \
            -destination 'generic/platform=iOS Simulator' \
            build-for-testing CODE_SIGNING_ALLOWED=NO ENABLE_BITCODE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf COMPILER_INDEX_STORE_ENABLE=YES \
            INDEX_ENABLE_DATA_STORE=YES \
            2>&1 | tee "$output_dir/build.log"

      - name: Run iOS Periphery
        id: app-scan
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.scope.outputs.ios-scan == 'true' }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/ios-periphery"
          mkdir -p "$output_dir"
          cd apps/ios
          set +e
          periphery scan \
            --config .periphery.yml \
            --skip-build \
            --index-store-path "$RUNNER_TEMP/shared-periphery-ios-derived/Index.noindex/DataStore" \
            --strict \
            --format json \
            --write-results "$output_dir/periphery.json" \
            >"$output_dir/periphery.stdout.json" \
            2>"$output_dir/periphery.stderr.log"
          periphery_status="$?"
          set -e
          printf '%s\n' "$periphery_status" >"$output_dir/periphery.status"
          if [ ! -s "$output_dir/periphery.json" ]; then
            cp "$output_dir/periphery.stdout.json" "$output_dir/periphery.json"
          fi

      - name: Build iOS Periphery report
        id: app-report
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.scope.outputs.ios-scan == 'true' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const outputDir = path.join(process.env.RUNNER_TEMP, "ios-periphery");
          const read = (name) => {
            const file = path.join(outputDir, name);
            return fs.existsSync(file) ? fs.readFileSync(file, "utf8") : "";
          };

          const status = Number(read("periphery.status").trim() || "1");
          let findings = null;
          for (const name of ["periphery.json", "periphery.stdout.json"]) {
            try {
              const parsed = JSON.parse(read(name));
              if (Array.isArray(parsed)) {
                findings = parsed;
                break;
              }
            } catch {}
          }

          const escapeCommandData = (value) =>
            String(value ?? "")
              .replaceAll("%", "%25")
              .replaceAll("\r", "%0D")
              .replaceAll("\n", "%0A");
          const escapeCommandProperty = (value) =>
            escapeCommandData(value)
              .replaceAll(":", "%3A")
              .replaceAll(",", "%2C");

          const rows = (findings ?? []).map((finding) => {
            const location = String(finding.location ?? "");
            const [file, line] = location.split(":");
            const repoFile = file ? `apps/ios/${file}` : "";
            return {
              file: repoFile,
              line: line || "",
              kind: String(finding.kind ?? ""),
              name: String(finding.name ?? ""),
            };
          });

          for (const row of rows) {
            if (!row.file) continue;
            const line = row.line ? `,line=${escapeCommandProperty(row.line)}` : "";
            const title = `${row.kind || "Unused code"} ${row.name}`.trim();
            console.log(`::error file=${escapeCommandProperty(row.file)}${line},title=Dead Swift code::${escapeCommandData(title)}`);
          }

          let shouldFail = "1";
          let summary = "";

          if (findings === null) {
            summary = [
              "### iOS Periphery",
              "",
              "Periphery did not complete. Check the workflow artifact for stdout/stderr.",
            ].join("\n");
          } else if (rows.length === 0 && status === 0) {
            shouldFail = "0";
            summary = [
              "### iOS Periphery",
              "",
              "No dead Swift code found.",
            ].join("\n");
          } else if (rows.length > 0) {
            summary = [
              "### iOS Periphery",
              "",
              `Found ${rows.length} dead Swift code ${rows.length === 1 ? "symbol" : "symbols"}. See the PR comment or workflow artifact for details.`,
            ].join("\n");
          } else {
            summary = [
              "### iOS Periphery",
              "",
              "Periphery exited with a non-zero status before producing findings. Check the workflow artifact for stdout/stderr.",
            ].join("\n");
          }

          fs.writeFileSync(path.join(outputDir, "should-fail.txt"), `${shouldFail}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `should-fail=${shouldFail}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.trim()}\n`);
          NODE

      - name: Upload iOS app report
        id: app-upload
        if: ${{ !cancelled() && needs.scope.outputs.ios-scan == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-periphery-dead-code-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-periphery
          if-no-files-found: error
          retention-days: 14

      # Separate processes preserve app strictness and shared-kit retention policy.
      - name: Scan shared kit
        id: shared-scan
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.scope.outputs.shared-scan == 'true' }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/shared-periphery-ios"
          mkdir -p "$output_dir"
          cd apps/ios
          set +e
          periphery scan \
            --config .periphery.yml \
            --skip-build \
            --index-store-path "$RUNNER_TEMP/shared-periphery-ios-derived/Index.noindex/DataStore" \
            --format json \
            --report-include '../shared/OpenClawKit/Sources/**' \
            --retain-files '**/GenerateGatewayProtocol/GatewayModels.swift' \
            --write-results "$output_dir/periphery.json" \
            >"$output_dir/periphery.stdout.json" \
            2>"$output_dir/periphery.stderr.log"
          periphery_status="$?"
          set -e
          printf '%s\n' "$periphery_status" >"$output_dir/periphery.status"
          echo "status=$periphery_status" >> "$GITHUB_OUTPUT"
          if [ ! -s "$output_dir/periphery.json" ]; then
            cp "$output_dir/periphery.stdout.json" "$output_dir/periphery.json"
          fi

      # Resolve this producer's actual attempt when a partial rerun keeps its result.
      - name: Upload iOS consumer report
        id: shared-upload
        if: ${{ !cancelled() && needs.scope.outputs.shared-scan == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-periphery-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shared-periphery-ios
          if-no-files-found: error
          retention-days: 14

  scan-ios:
    name: Scan iOS dead code
    needs: [scope, ios-index]
    if: ${{ always() && needs.scope.outputs.ios-scan == 'true' && needs.ios-index.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce iOS app report
        env:
          REPORT_COMPLETE: ${{ needs.ios-index.outputs.app-complete }}
          APP_FAILURE: ${{ needs.ios-index.outputs.app-failure }}
        run: test "$REPORT_COMPLETE" = "true" && test "$APP_FAILURE" = "0"

  scan-ios-shared:
    name: Scan shared kit from iOS
    needs: [scope, ios-index]
    if: ${{ always() && needs.scope.outputs.shared-scan == 'true' && needs.ios-index.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce iOS shared scan
        env:
          REPORT_COMPLETE: ${{ needs.ios-index.outputs.shared-complete }}
          SCAN_STATUS: ${{ needs.ios-index.outputs.shared-status }}
        run: test "$REPORT_COMPLETE" = "true" && test "$SCAN_STATUS" = "0"

  intersect:
    name: Intersect shared OpenClawKit dead code
    needs: [scope, scan-ios-shared, scan-macos]
    if: ${{ always() && needs.scope.outputs.shared-scan == 'true' && needs.scan-ios-shared.result != 'cancelled' && needs.scan-macos.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Resolve producing attempts
        id: producers
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id });
            if (run.head_sha !== (context.payload.pull_request?.head.sha ?? context.sha)) {
              throw new Error("Periphery producer head does not match this run");
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id, filter: "all", per_page: 100,
            });
            // Keep this selector identical at the trusted workflow_run comment boundary.
            const producerAttempt = (name) => {
              const normalizeName = (value) => typeof value === "string" ? value.replace(/^scan \/ /, "") : value;
              const candidates = jobs.filter((job) => normalizeName(job.name) === name);
              const attempts = new Set();
              for (const job of candidates) {
                if (!Number.isSafeInteger(job.run_attempt) || job.run_attempt < 1 || attempts.has(job.run_attempt)) {
                  throw new Error(`Missing or ambiguous Periphery producer attempt for ${name}`);
                }
                attempts.add(job.run_attempt);
              }
              const timestamp = (value, nullable = false) => {
                if (value === null && nullable) return null;
                if (typeof value !== "string" || !value.trim() || !Number.isFinite(Date.parse(value))) return;
                return new Date(value).toISOString();
              };
              const executionKey = (job) => {
                const started = timestamp(job.started_at);
                const completed = timestamp(job.completed_at);
                if (job.run_id !== run_id || job.head_sha !== run.head_sha || job.status !== "completed" ||
                    typeof job.conclusion !== "string" || !job.conclusion || !started || !completed ||
                    !Array.isArray(job.steps) || !job.steps.length) return;
                const steps = [];
                let previousNumber = 0;
                for (const step of job.steps) {
                  const skipped = step.conclusion === "skipped";
                  const start = timestamp(step.started_at, skipped);
                  const end = timestamp(step.completed_at, skipped);
                  if (!Number.isSafeInteger(step.number) || step.number <= previousNumber ||
                      typeof step.name !== "string" || !step.name || step.status !== "completed" ||
                      typeof step.conclusion !== "string" || !step.conclusion ||
                      start === undefined || end === undefined) return;
                  previousNumber = step.number;
                  steps.push([step.number, step.name, step.status, step.conclusion, start, end]);
                }
                return JSON.stringify([job.run_id, job.head_sha, normalizeName(job.name),
                  job.status, job.conclusion, started, completed, steps]);
              };
              const latest = candidates.reduce((selected, job) =>
                !selected || job.run_attempt > selected.run_attempt ? job : selected, undefined);
              const key = latest && executionKey(latest);
              if (!key) throw new Error(`Missing or invalid Periphery producer execution for ${name}`);
              // Reruns can project one physical execution into several logical attempts.
              // Only its earliest identical, complete execution owns the artifact suffix.
              return Math.min(...candidates.filter((job) => executionKey(job) === key).map((job) => job.run_attempt));
            };
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id, per_page: 100,
            });
            for (const [platform, name] of [
              ["ios", "Build iOS Periphery reports"],
              ["macos", "Build macOS Periphery reports"],
            ]) {
              const attempt = producerAttempt(name);
              const artifactName = `shared-periphery-${platform}-${run_id}-${attempt}`;
              const matches = artifacts.filter((item) => item.name === artifactName);
              const artifact = matches[0];
              if (matches.length !== 1 || !Number.isSafeInteger(artifact.id) || artifact.id < 1 ||
                  artifacts.filter((item) => item.id === artifact.id).length !== 1 ||
                  artifact.workflow_run?.id !== run_id || artifact.workflow_run?.head_sha !== run.head_sha ||
                  artifact.expired !== false) {
                throw new Error(`Missing or invalid ${artifactName} artifact`);
              }
              core.setOutput(`${platform}-attempt`, String(attempt));
              core.setOutput(`${platform}-artifact-id`, String(artifact.id));
            }

      - name: Download iOS consumer report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.producers.outputs.ios-artifact-id }}
          path: ${{ runner.temp }}/shared-periphery-ios

      - name: Download macOS consumer report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.producers.outputs.macos-artifact-id }}
          path: ${{ runner.temp }}/shared-periphery-macos

      - name: Setup supported Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false

      - name: Intersect exact Swift identities
        run: |
          node scripts/periphery-intersection.mjs \
            --ios-results "$RUNNER_TEMP/shared-periphery-ios/periphery.json" \
            --ios-status "$RUNNER_TEMP/shared-periphery-ios/periphery.status" \
            --macos-results "$RUNNER_TEMP/shared-periphery-macos/periphery.json" \
            --macos-status "$RUNNER_TEMP/shared-periphery-macos/periphery.status" \
            --output "$RUNNER_TEMP/shared-periphery-intersection/periphery.json"

      - name: Upload shared intersection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-periphery-intersection-${{ github.run_id }}
          path: ${{ runner.temp }}/shared-periphery-intersection
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
