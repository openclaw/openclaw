name: iOS Release

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ios-release
  cancel-in-progress: false
  queue: max

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  release:
    name: Prepare and upload iOS release
    if: github.ref == 'refs/heads/main' && github.repository == 'openclaw/openclaw'
    permissions:
      contents: write
    runs-on: xcode-27
    timeout-minutes: 360
    environment: ios-store-release
    outputs:
      recovery_artifact_id: ${{ steps.recovery.outputs.artifact-id }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          install-bun: "false"
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: "3.4.10"
          bundler: "4.0.21"
          bundler-cache: false
          working-directory: apps/ios

      - name: Install locked Fastlane bundle
        working-directory: apps/ios
        run: |
          set -euo pipefail
          bundle _4.0.21_ install --jobs 4 --retry 3
          bundle _4.0.21_ check
          test "$(bundle _4.0.21_ exec ruby -e 'require "fastlane"; print Fastlane::VERSION')" = "2.240.1"

      - name: Select Xcode
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain

      - name: Install pinned Swift build tools
        run: |
          set -euo pipefail
          swift_tools_dir="${RUNNER_TEMP}/openclaw-swift-tools"
          ./scripts/install-xcodegen.sh "$swift_tools_dir"
          ./scripts/install-swift-tools.sh "$swift_tools_dir"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"

      - name: Install Watch Rust toolchain
        if: hashFiles('apps/shared/OpenClawWatchRTC/Cargo.toml') != ''
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          watch_toolchain="$(awk -F '"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$watch_toolchain"
          rustup toolchain install "$watch_toolchain" --profile minimal --component rust-src

      - name: Qualify native iOS pairing and chat
        id: qualification
        run: |
          set -euo pipefail
          node --import ./scripts/tsx.mjs scripts/ios-release-e2e.ts \
            --mode stock --target-sha "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/ios-release-e2e-proof.json"

      - name: Retain sanitized iOS qualification proof
        if: always() && steps.qualification.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-release-e2e-stock
          path: ${{ runner.temp }}/ios-release-e2e-proof.json
          if-no-files-found: error
          retention-days: 14

      - name: Create apps-signing read token
        id: apps-signing-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: "2729701"
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: openclaw
          repositories: apps-signing
          permission-contents: read

      - name: Checkout encrypted iOS signing assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/apps-signing
          ref: main
          path: apps/ios/build/release-signing/apps-signing
          token: ${{ steps.apps-signing-token.outputs.token }}
          persist-credentials: false

      - name: Route readonly match checkout to approved signing assets
        run: |
          set -euo pipefail
          signing_repo="file://${GITHUB_WORKSPACE}/apps/ios/build/release-signing/apps-signing/"
          git config --global url."${signing_repo}".insteadOf git@github.com:openclaw/apps-signing.git

      - name: Create job-owned iOS signing keychain
        uses: ./.github/actions/ios-signing-keychain

      - name: Validate readonly iOS signing key access
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          set -euo pipefail
          source ./scripts/lib/ios-fastlane.sh
          (cd apps/ios && run_ios_fastlane ios signing_check)
          node .github/actions/ios-signing-keychain/keychain.mjs probe

      - name: Prepare and upload iOS release
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          GH_TOKEN: ${{ github.token }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          SCAN_APP_NAME: OpenClaw
          SCAN_DEPLOYMENT_TARGET_VERSION: "18.0"
        run: |
          set -euo pipefail
          gh auth setup-git
          pnpm ios:release:upload -- --defer-finalization \
            --recovery-dir "$RUNNER_TEMP/ios-release-recovery"

      - name: Retain prepared release for Git recovery
        id: recovery
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-release-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-release-recovery/release.bundle
          if-no-files-found: error
          retention-days: 30

      - name: Retain signed release artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-release-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-release-recovery/artifacts/*.ipa
            ${{ runner.temp }}/ios-release-recovery/artifacts/*.aab
            ${{ runner.temp }}/ios-release-recovery/artifacts/*.apk
            ${{ runner.temp }}/ios-release-recovery/artifacts/*.sha256
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

  finalize:
    name: Finalize iOS release on main
    needs: release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ios-store-release
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Download exact release recovery bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.release.outputs.recovery_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ios-release-recovery

      - name: Create release finalization token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: "2729701"
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: openclaw
          repositories: openclaw
          permission-contents: write
          permission-pull-requests: write

      - name: Publish preparation changes with linear history
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          node scripts/mobile-release.mjs finalize --platform ios \
            --recovery-dir "$RUNNER_TEMP/ios-release-recovery"
