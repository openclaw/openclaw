name: Apple mobile grouped assistant capture

on:
  push:
    branches: [roboclaw/ios-narration-proof-156944]
    paths:
      - .github/workflows/ios-narration-capture.yml
      - scripts/test-ios-narration-proof.sh
      - scripts/ios-agent-grouping.patch
      - scripts/test-ios-shell-gateway.mjs
      - apps/ios/UITests/OpenClawSnapshotUITests.swift

permissions:
  contents: read

jobs:
  capture:
    name: ${{ matrix.device }} grouping capture (${{ matrix.stage }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { device: iPhone, stage: after }
          - { device: iPad, stage: before }
          - { device: iPad, stage: after }
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      CANDIDATE_SHA: b9ae24aec6ad8ef987f904d3ed2fb748daac4892
      BASELINE_SHA: b9ae24aec6ad8ef987f904d3ed2fb748daac4892
      GROUPING_PATCH_SHA256: 043ac196922c7a7536e1044da929a19de9a918fdde6ac3977198a28aa58cabc4
      DEVICE_FAMILY: ${{ matrix.device }}
    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b9ae24aec6ad8ef987f904d3ed2fb748daac4892
          fetch-depth: 3
          persist-credentials: false
      - name: Checkout verification-only helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .proof
          persist-credentials: false
      - name: Select repository-native Xcode
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain 27.0
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: "false"
          install-deps: "false"
          cache-mode: "off"
      - name: Install pinned native build tools
        run: |
          set -euo pipefail
          scripts/install-xcodegen.sh "$RUNNER_TEMP/ios-tools/bin"
          scripts/install-swift-tools.sh "$RUNNER_TEMP/ios-tools/bin"
          echo "$RUNNER_TEMP/ios-tools/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          toolchain="$(awk -F '"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          config="$RUNNER_TEMP/ios-simulator.xcconfig"
          printf 'ARCHS = %s\nCOMPILER_INDEX_STORE_ENABLE = NO\n' "$(uname -m)" > "$config"
          echo "XCODE_XCCONFIG_FILE=$config" >> "$GITHUB_ENV"
      - name: Compare current PR and grouped iPhone interaction
        env:
          CAPTURE_STAGE: ${{ matrix.stage }}
        run: |
          bash .proof/scripts/test-ios-narration-proof.sh \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.proof" \
            "$RUNNER_TEMP/ios-narration-capture" "$BASELINE_SHA" "$CANDIDATE_SHA" "$CAPTURE_STAGE" "$DEVICE_FAMILY" \
            "$GITHUB_WORKSPACE/.proof/scripts/ios-agent-grouping.patch"
      - name: Upload raw native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-agent-grouping-${{ matrix.device }}-${{ matrix.stage }}
          path: ${{ runner.temp }}/ios-narration-capture
          if-no-files-found: error
          retention-days: 7
