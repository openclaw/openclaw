name: Native macOS trust cleanup diagnostic

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/native-trust-cleanup-diagnostic.yml
      - scripts/e2e/native-trust-cleanup-diagnostic.py

permissions:
  contents: read
  actions: read

jobs:
  paired-trust-cleanup:
    if: github.repository == 'openclaw/openclaw' && github.event.pull_request.number == 179898
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Retain pinned original native evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/openclaw/openclaw/actions/artifacts/12588402630/zip \
            > "$RUNNER_TEMP/native-original-evidence.zip"
          printf '%s  %s\n' \
            92a233c58e1793333a0fc01ca3f275f89a50885c46ad7f69d6292d5396859cbb \
            "$RUNNER_TEMP/native-original-evidence.zip" | shasum -a 256 -c -
      - name: Compare non-last and last admin trust removal without changing policy
        run: |
          python3 scripts/e2e/native-trust-cleanup-diagnostic.py \
            "$RUNNER_TEMP/native-original-evidence.zip" \
            "$RUNNER_TEMP/native-trust-cleanup-diagnostic"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-trust-cleanup-diagnostic-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-trust-cleanup-diagnostic
          if-no-files-found: error
          retention-days: 14
