name: CI Test Timings Refit

on:
  schedule:
    - cron: "43 9 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-test-timings-refit
  cancel-in-progress: false

jobs:
  refit:
    if: github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify generated PR App permissions
        uses: ./.github/actions/create-generated-pr-tokens
        with:
          contents-client-id: Iv23liOECG0slfuhz093
          contents-private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          pull-request-client-id: Iv23liPJCozR0uHm6P7G
          pull-request-private-key: ${{ secrets.MANTIS_GITHUB_APP_PRIVATE_KEY }}

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "false"

      - name: Refit measured test timings
        id: refit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --silent ci:timings:refit > "$RUNNER_TEMP/ci-test-timings-report.md"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import path from "node:path";
          const report = readFileSync(path.join(process.env.RUNNER_TEMP, "ci-test-timings-report.md"), "utf8");
          const runIds = report.match(/^Sampled CI and release-check runs with successful timing jobs: ([0-9, ]+)$/mu)?.[1];
          if (!runIds || runIds.length > 2048 || !/^\d+(?:, \d+)*$/u.test(runIds)) {
            throw new Error("Missing or oversized sampled-run summary; the full report is retained as an artifact.");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `run_ids=${runIds}\n`);
          NODE
          if ! git diff --quiet -- config/ci-test-timings.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload full timing refit report
        id: report
        if: ${{ !cancelled() && steps.refit.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-test-timings-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-test-timings-report.md
          if-no-files-found: error
          retention-days: 30

      - name: Update standing refit pull request
        if: steps.refit.outputs.changed == 'true'
        uses: ./.github/actions/publish-generated-pr
        with:
          contents-client-id: Iv23liOECG0slfuhz093
          contents-private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          pull-request-client-id: Iv23liPJCozR0uHm6P7G
          pull-request-private-key: ${{ secrets.MANTIS_GITHUB_APP_PRIVATE_KEY }}
          base-branch: main
          head-branch: ci/test-timings-refit
          commit-message: "ci: refresh measured test timings"
          pr-title: "ci: refresh measured test timings"
          generated-paths: config/ci-test-timings.json
          invalidation-paths: |
            config/ci-test-timings.json
            scripts/ci-refit-test-timings.mts
            scripts/ci-run-timings.mjs
            scripts/lib/ci-test-timings-refit.mts
            scripts/lib/ci-node-test-groups-codec.mts
            scripts/lib/ci-test-timings-schema.mts
            scripts/lib/local-check-runtime.mts
            scripts/lib/vitest-shard-metadata.mts
            scripts/lib/direct-run.mjs
            scripts/lib/numeric-options.mjs
            scripts/lib/plain-gh.mjs
            scripts/tsx.mjs
            package.json
            pnpm-lock.yaml
            .github/actions/create-generated-pr-tokens/action.yml
            .github/actions/publish-generated-pr/action.yml
            .github/workflows/ci-test-timings-refit.yml
            .github/workflows/ci.yml
          pr-body: |
            ## What Problem This Solves

            Refresh stale CI shard weights from successful jobs in completed main-push workflows, successful release-check runs, and exact compact selectors and tooling files from successful pull-request CI runs.

            ## Why This Change Was Made

            The daily refit uses independent-run medians, rejects outliers and single samples, and keeps existing weights within the 15% replacement band. Failed main workflows contribute successful timing jobs without supplying pruning evidence. Pull-request measurements describe the merge-ref: exact compact selector keys, runtime inventory observations, and native tooling file costs can update, but partial plans never reprice unqualified compact parents or prune absent measurements. Worker timing identities must agree with observed admission. Main compact keys absent from every contributing run are removed only after three successful contributing workflows for that profile. The complete artifact report lists every change and removal.

            ## User Impact

            Only shard balance changes; test discovery still determines the complete test inventory. This standing branch is updated automatically and never pushes to main.

            ## Evidence

            Generated with `pnpm ci:timings:refit` from runs: ${{ steps.refit.outputs.run_ids }}.

            [Download the complete timing report](${{ steps.report.outputs.artifact-url }}).
