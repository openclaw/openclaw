# Temporary W-CHAT-4 capture job. Remove after its evidence is attached to the PR.
name: W-CHAT-4 visual parity
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: w-chat4-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  parity:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'solid2/w-chat-4' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.21.0
          install-bun: "false"
          cache-mode: restore
      - name: Install capture browser
        run: node --import ./scripts/tsx.mjs scripts/ensure-playwright-chromium.mts
      - name: Prepare base with identical capture recipes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          base="$(git merge-base "$HEAD_SHA" "$BASE_SHA")"
          base_tree="$RUNNER_TEMP/w-chat4-base"
          git worktree add --detach "$base_tree" "$base"
          python3 - "$GITHUB_WORKSPACE" "$base_tree" <<'PY'
          from pathlib import Path
          import sys
          root, base = map(Path, sys.argv[1:])
          paths = [root / "node_modules", root / "ui/node_modules"]
          for group in ["packages", "extensions", "tools"]:
              paths.extend((root / group).glob("*/node_modules"))
          for source in paths:
              target = base / source.relative_to(root)
              if source.exists() and not target.exists():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.symlink_to(source, target_is_directory=True)
          PY
          cp scripts/control-ui-parity/scenarios.ts scripts/control-ui-parity/chat-tool-scenes.ts scripts/control-ui-parity/capture-suite.ts "$base_tree/scripts/control-ui-parity/"
          mkdir -p .artifacts/w-chat4-parity
          printf '%s\n' "$base" > .artifacts/w-chat4-parity/base-sha.txt
          printf '%s\n' "$HEAD_SHA" > .artifacts/w-chat4-parity/head-sha.txt
      - name: Capture base
        run: pnpm --dir "$RUNNER_TEMP/w-chat4-base" ui:parity capture --scene '^chat-tools-' --profile '^(desktop-light|mobile-light)$' --output "$GITHUB_WORKSPACE/.artifacts/w-chat4-parity/before"
      - name: Capture head
        if: ${{ !cancelled() }}
        run: pnpm ui:parity capture --scene '^chat-tools-' --profile '^(desktop-light|mobile-light)$' --output "$GITHUB_WORKSPACE/.artifacts/w-chat4-parity/after"
      - name: Compare decoded pixels
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          before=("$GITHUB_WORKSPACE"/.artifacts/w-chat4-parity/before/*)
          after=("$GITHUB_WORKSPACE"/.artifacts/w-chat4-parity/after/*)
          pnpm ui:parity diff "${before[0]}" "${after[0]}" --output "$GITHUB_WORKSPACE/.artifacts/w-chat4-parity/diff"
      - name: Record base and head failure evidence
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          root = Path(os.environ["GITHUB_WORKSPACE"])
          output = root / ".artifacts/w-chat4-parity/baseline-checks"
          output.mkdir(parents=True, exist_ok=True)
          commands = {
              "core-lint": ["node", "scripts/run-oxlint.mjs", "--tsconfig", "config/tsconfig/oxlint.core.json", "src/plugin-state/plugin-state-observation-cache.ts", "src/infra/sqlite-worker-plugin-comparison.test.ts"],
              "export-names": ["node", "--import", "./scripts/tsx.mjs", "scripts/check-export-name-collisions.mts"],
              "sdk-surface": ["pnpm", "test", "test/scripts/plugin-sdk-surface-report.test.ts", "--maxWorkers=1"],
              "metadata-e2e": ["node", "scripts/run-vitest.mjs", "run", "--config", "test/vitest/vitest.ui-e2e.config.ts", "--configLoader", "runner", "--project", "ui-e2e-bundled", "ui/src/e2e/chat-metadata-observation.e2e.test.ts", "--maxWorkers=1"],
          }
          results = []
          for label, tree in [("base", Path(os.environ["RUNNER_TEMP"]) / "w-chat4-base"), ("head", root)]:
              for name, command in commands.items():
                  log = output / f"{label}-{name}.txt"
                  print(f"::group::{label}: {' '.join(command)}", flush=True)
                  with log.open("w") as stream:
                      result = subprocess.run(command, cwd=tree, stdout=stream, stderr=subprocess.STDOUT, env={**os.environ, "OPENCLAW_UI_E2E_SKIP_REAL_GATEWAY": "1"})
                  print(log.read_text(), flush=True)
                  print(f"Exit code: {result.returncode}\n::endgroup::", flush=True)
                  results.append({"tree": label, "check": name, "command": command, "exitCode": result.returncode})
          (output / "results.json").write_text(json.dumps(results, indent=2) + "\n")
          PY
      - name: Upload synthetic before and after evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: w-chat4-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/w-chat4-parity
          retention-days: 7
          if-no-files-found: error
