name: Boat Mantis Hosted Qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cd12f19052ede1784e3d091a486a9c8f116e2d3a
          fetch-depth: 8
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.22.1
          install-bun: "false"
          cache-mode: restore
      - name: Prepare bounded storage
        run: |
          set -euo pipefail
          if ! command -v slirp4netns >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends slirp4netns
          fi
          node scripts/mantis/telegram-proof-storage.mts setup
      - name: Build trusted web image
        run: |
          set -euo pipefail
          git archive HEAD | podman build --file scripts/mantis/request-proof.Dockerfile --tag localhost/mantis-request-proof -
      - name: Prove isolated candidate UI and sandboxed Chromium
        run: node scripts/mantis/run-request-web-ui.mts cd12f19052ede1784e3d091a486a9c8f116e2d3a .artifacts/boat-hosted-web-proof
      - name: Remove completed web image
        run: podman image rm localhost/mantis-request-proof
      - name: Build trusted Telegram image
        run: |
          set -euo pipefail
          git archive HEAD | podman build --memory 16g --cpu-period 100000 --cpu-quota 200000 --file scripts/mantis/telegram-test-server-proof.Dockerfile --tag localhost/mantis-telegram-proof -
      - name: Prepare exact candidate runtime
        run: node scripts/mantis/prepare-request-telegram.mts cd12f19052ede1784e3d091a486a9c8f116e2d3a
      - name: Install Crabbox
        env:
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/boat-crabbox-install
        run: node scripts/crabbox-setup.mjs
      - name: Prove Crabbox local container lifecycle
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { mkdtempSync, mkdirSync, readFileSync, existsSync, readdirSync, writeFileSync } from "node:fs";
          import { randomBytes } from "node:crypto";
          import path from "node:path";
          import { assertPodmanProofStorage, assertProofImage, proofImageTag } from "./scripts/mantis/telegram-proof-storage.mts";
          const storage = assertPodmanProofStorage();
          const root = mkdtempSync(path.join(process.env.RUNNER_TEMP, "mantis-crabbox-"));
          const state = path.join(root, "state");
          mkdirSync(state, { mode: 0o700 });
          writeFileSync(path.join(state, "custody-marker"), "outside-podman-config\n");
          const env = { PATH: process.env.PATH, HOME: root, XDG_STATE_HOME: state, XDG_CACHE_HOME: path.join(root, "cache"), ...storage };
          const run = (command, args, options = {}) => execFileSync(command, args, { encoding: "utf8", timeout: 180000, maxBuffer: 2 * 1024 * 1024, ...options });
          const podman = (args) => run("podman", args);
          const box = (args) => run("crabbox", args, { cwd: root, env });
          const imageId = podman(["image", "inspect", "--format", "{{.Id}}", "localhost/mantis-telegram-runtime"]).trim();
          const image = proofImageTag(imageId);
          podman(["tag", imageId, image]);
          const lease = "cbx_" + randomBytes(6).toString("hex");
          const network = "mantis-hosted-" + randomBytes(6).toString("hex");
          let attempted = false;
          podman(["network", "create", "--internal", network]);
          try {
            const networks = JSON.parse(podman(["network", "inspect", network]));
            if (networks.length !== 1 || (networks[0].internal ?? networks[0].Internal) !== true) throw new Error("Network is not internal");
            attempted = true;
            box(["warmup", "--provider", "local-container", "--lease-id", lease, "--local-container-runtime", "podman", "--local-container-image", image, "--local-container-network", network, "--local-container-docker-socket=false", "--local-container-memory", "8g", "--local-container-cpus", "2", "--local-container-work-root", "/work/crabbox", "--ttl", "15m", "--idle-timeout", "5m", "--timing-json"]);
            const ids = podman(["ps", "-a", "--filter", "label=lease=" + lease, "--format", "{{.ID}}"]).trim().split("\n").filter(Boolean);
            if (ids.length !== 1) throw new Error("Ambiguous lease container");
            const info = JSON.parse(podman(["inspect", ids[0]]))[0];
            assertProofImage(imageId, info.Image);
            const bootstrap = path.resolve(info.Config.Labels.bootstrap_dir ?? "");
            if (!bootstrap.startsWith(root + path.sep) || Object.keys(info.NetworkSettings.Networks).join(",") !== network || info.Config.Labels.docker_socket !== "0" ||
                info.Mounts.some((m) => m.Type !== "bind" || m.Source !== bootstrap || m.Destination !== "/tmp/crabbox-bootstrap" || m.RW)) throw new Error("Crabbox isolation mismatch");
            const output = box(["run", "--provider", "local-container", "--local-container-runtime", "podman", "--id", lease, "--no-sync", "--no-hydrate", "--", "sh", "-eu", "-c", 'mkdir -p /work/crabbox/state; printf hosted-proof > /work/crabbox/state/marker; test "$(cat /work/crabbox/state/marker)" = hosted-proof; printf hosted-proof-ok']);
            if (!output.includes("hosted-proof-ok")) throw new Error("Crabbox command did not complete");
            if (readFileSync(path.join(state, "custody-marker"), "utf8") !== "outside-podman-config\n" || !existsSync(path.join(state, "crabbox"))) throw new Error("Recovery state not preserved separately");
            console.log("Verified real Crabbox warmup, SSH command, image/network/bootstrap identities and separate recovery state.");
          } finally {
            if (attempted) box(["stop", "--provider", "local-container", "--local-container-runtime", "podman", lease]);
            if (podman(["ps", "-a", "--filter", "label=lease=" + lease, "--format", "{{.ID}}"]).trim()) throw new Error("Lease container remains after stop");
            podman(["network", "rm", network]);
            console.log("Verified no lease containers remain after ordinary Crabbox stop.");
          }
          NODE
      - name: Prepare pinned TDLib
        env:
          TELEGRAM_USER_DRIVER_TDLIB_CACHE_DIR: ${{ runner.temp }}/boat-tdlib
        run: python3 scripts/mantis/telegram-driver-preflight.py --prepare .agents/skills/telegram-e2e-userbot/scripts/user-driver.py
      - name: Prove secretless Telegram runtime preflight
        env:
          TELEGRAM_USER_DRIVER_TDLIB_CACHE_DIR: ${{ runner.temp }}/boat-tdlib
        run: node scripts/mantis/run-request-telegram.mts --preflight cd12f19052ede1784e3d091a486a9c8f116e2d3a
      - name: Remove bounded storage
        if: ${{ always() && env.MANTIS_PODMAN_ROOT != '' }}
        run: node scripts/mantis/telegram-proof-storage.mts cleanup
      - name: Preserve public UI proof
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: boat-mantis-hosted-${{ github.run_id }}
          path: .artifacts/boat-hosted-web-proof
          retention-days: 3
          if-no-files-found: ignore
