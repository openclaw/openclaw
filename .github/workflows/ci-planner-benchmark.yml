name: Boat hosted Mantis storage qualification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CI: "true"

jobs:
  storage:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'openclaw/openclaw' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted storage owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 18c6b79f44789439fabea7d98fcb822fb3eebcaa
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Setup trusted tooling
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.22.1
          install-bun: "false"
          install-deps: "true"
          frozen-lockfile: "true"
          cache-mode: restore
      - name: Ensure rootless networking helper
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v slirp4netns >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends slirp4netns
          fi
      - name: Inspect hosted runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          command -v podman
          podman --version
          sudo -n true
          df -h "$RUNNER_TEMP"
      - name: Prepare bounded rootless candidate storage
        run: node scripts/mantis/telegram-proof-storage.mts setup
      - name: Verify storage across Actions steps
        run: >-
          node --input-type=module -e
          'import { assertPodmanProofStorage } from "./scripts/mantis/telegram-proof-storage.mts";
          assertPodmanProofStorage();
          console.log("Verified rootless Podman storage and cross-step environment.");'
      - name: Remove bounded candidate storage
        if: ${{ always() && env.MANTIS_PODMAN_ROOT != '' }}
        run: node scripts/mantis/telegram-proof-storage.mts cleanup
