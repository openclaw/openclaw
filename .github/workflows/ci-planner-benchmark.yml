name: Boat hosted Mantis storage qualification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CI: "true"

jobs:
  storage:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'openclaw/openclaw' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted storage owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6da218f62214b961cd0423ab2faf06e491e1b4b9
          fetch-depth: 8
          persist-credentials: false
          submodules: false
      - name: Setup trusted tooling
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.22.1
          install-bun: "false"
          install-deps: "true"
          frozen-lockfile: "true"
          cache-mode: restore
      - name: Verify regression fails on the base storage owner
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          owner = Path("scripts/mantis/telegram-proof-storage.mts")
          fixed = owner.read_bytes()
          try:
              owner.write_bytes(subprocess.check_output(["git", "show", "18c6b79f44789439fabea7d98fcb822fb3eebcaa:" + str(owner)]))
              result = subprocess.run(["pnpm", "test", "--", "test/scripts/mantis-telegram-storage-cleanup.test.ts", "-t", "cleans up ready storage when Podman omits|rejects a container configuration override"])
          finally:
              owner.write_bytes(fixed)
          if result.returncode != 1:
              raise SystemExit("Expected assertion failures on the base storage owner")
          PY
      - name: Run focused storage and caller regressions
        run: >-
          pnpm test --
          test/scripts/mantis-telegram-storage.test.ts
          test/scripts/mantis-telegram-storage-cleanup.test.ts
          test/scripts/mantis-telegram-proof.test.ts
          test/scripts/mantis-telegram-failure.test.ts
          test/scripts/mantis-request-proof.test.ts
      - name: Validate changed tooling
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.test.root.tooling.json --incremental
          node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.test.root.tooling.json scripts/mantis/telegram-proof-storage.mts scripts/mantis/run-request-telegram.mts test/scripts/mantis-telegram-storage-cleanup.test.ts
          pnpm format:check -- scripts/mantis/telegram-proof-storage.mts scripts/mantis/run-request-telegram.mts test/scripts/mantis-telegram-storage-cleanup.test.ts
      - name: Ensure rootless networking helper
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v slirp4netns >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends slirp4netns
          fi
      - name: Inspect hosted runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          command -v podman
          podman --version
          sudo -n true
          df -h "$RUNNER_TEMP"
      - name: Prepare bounded rootless candidate storage
        run: node scripts/mantis/telegram-proof-storage.mts setup
      - name: Verify storage across Actions steps
        run: >-
          node --input-type=module -e
          'import { assertPodmanProofStorage } from "./scripts/mantis/telegram-proof-storage.mts";
          assertPodmanProofStorage();
          console.log("Verified rootless Podman storage and cross-step environment.");
          console.log(JSON.stringify({ graphRoot: process.env.MANTIS_PODMAN_ROOT + "/volume/graphroot",
          runRoot: process.env.MANTIS_PODMAN_ROOT + "/volume/runroot", configHome: process.env.XDG_CONFIG_HOME }));'
      - name: Remove bounded candidate storage
        if: ${{ always() && env.MANTIS_PODMAN_ROOT != '' }}
        run: node scripts/mantis/telegram-proof-storage.mts cleanup
