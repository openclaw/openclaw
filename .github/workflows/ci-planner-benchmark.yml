name: Boat hosted Mantis storage diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CI: "true"

jobs:
  storage:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'openclaw/openclaw' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted storage owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 75ca08f0c47c04c36ce99d63c49b69e60bf5d63a
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Setup trusted tooling
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.22.1
          install-bun: "false"
          install-deps: "true"
          frozen-lockfile: "true"
          cache-mode: restore
      - name: Ensure rootless networking helper
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v slirp4netns >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends slirp4netns
          fi
      - name: Inspect hosted runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          command -v podman
          podman --version
          sudo -n true
          df -h "$RUNNER_TEMP"
      - name: Prepare bounded rootless candidate storage
        run: node scripts/mantis/telegram-proof-storage.mts setup
      - name: Diagnose isolated engine paths
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync, writeFileSync } from "node:fs";
          import path from "node:path";
          const root = process.env.MANTIS_PODMAN_ROOT;
          const mount = path.join(root, "volume");
          const containers = path.join(root, "diagnostic-containers.conf");
          writeFileSync(containers, readFileSync(process.env.CONTAINERS_CONF, "utf8") +
            '\n[engine]\nstatic_dir = "' + mount + '/graphroot/libpod"\ntmp_dir = "' +
            mount + '/runroot/libpod/tmp"\nvolume_path = "' + mount + '/graphroot/volumes"\n', { mode: 0o600 });
          for (const [name, args, env] of [
            ["owned-config", [], process.env],
            ["isolated-engine-paths", [], { ...process.env, CONTAINERS_CONF: containers, CONTAINERS_CONF_OVERRIDE: containers }],
            ["explicit-storage-paths", ["--root", mount + "/graphroot", "--runroot", mount + "/runroot"], process.env],
          ]) {
            try {
              const info = JSON.parse(execFileSync("podman", [...args, "info", "--format", "json"], { env, encoding: "utf8", timeout: 60000, maxBuffer: 1024 * 1024 }));
              console.log(JSON.stringify({ name, status: "observed", remote: info.host?.serviceIsRemote, rootless: info.host?.security?.rootless,
                logDriver: info.host?.logDriver, rootlessNetworkCmd: info.host?.rootlessNetworkCmd ?? null,
                configFile: info.store?.configFile, graphRoot: info.store?.graphRoot, runRoot: info.store?.runRoot }));
            } catch (error) {
              console.log(JSON.stringify({ name, status: "failed", error: String(error.message).slice(0, 1000), stderr: String(error.stderr ?? "").slice(0, 1000) }));
            }
          }
          NODE
      - name: Remove bounded candidate storage
        if: ${{ always() && env.MANTIS_PODMAN_ROOT != '' }}
        run: node scripts/mantis/telegram-proof-storage.mts cleanup
