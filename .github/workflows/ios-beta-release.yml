name: iOS Beta Release

run-name: iOS Beta ${{ inputs.operation }} ${{ inputs.target_ref }}@${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Upload and record, recover recording, or inspect without publication
        required: true
        default: upload-and-record
        type: choice
        options:
          - upload-and-record
          - record-only
          - inspect
      target_ref:
        description: Canonical mobile release branch (release/YYYY.M.PATCH-mobile)
        required: true
        type: string
      target_sha:
        description: Exact lowercase commit SHA at the release branch head
        required: true
        type: string
      inspect_build_number:
        description: Existing build number to inspect within the candidate App Store version; inspect only
        required: false
        type: string
      source_run_id:
        description: Original failed upload run ID; required only for record-only recovery
        required: false
        type: string

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  authorize:
    name: Authorize exact iOS release candidate
    if: inputs.operation == 'upload-and-record'
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      actor: ${{ steps.authority.outputs.actor }}
      approved: ${{ steps.authority.outputs.approved }}
      build_timestamp: ${{ steps.authority.outputs.build-timestamp }}
      receipt_digest: ${{ steps.authority.outputs.receipt-digest }}
      run_id: ${{ steps.authority.outputs.run-id }}
      target_ref: ${{ steps.authority.outputs.target-ref }}
      target_sha: ${{ steps.authority.outputs.target-sha }}
      triggering_actor: ${{ steps.authority.outputs.triggering-actor }}
    steps:
      - name: Checkout trusted mobile release authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            .github/actions/mobile-release-authority
            scripts
            apps/mobile/version.json
            apps/android/version.json
            apps/android/Config/Version.properties
            apps/android/fastlane/metadata/android/en-US/release_notes.txt
            apps/ios/CHANGELOG.md

      - name: Setup trusted Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Authorize iOS beta release
        id: authority
        uses: ./.github/actions/mobile-release-authority
        with:
          operation: authorize
          platform: ios
          workflow-path: .github/workflows/ios-beta-release.yml
          workflow-full-ref: ${{ github.workflow_ref }}
          workflow-sha: ${{ github.workflow_sha }}
          target-ref: ${{ inputs.target_ref }}
          target-sha: ${{ inputs.target_sha }}
          authority-run-id: ${{ github.run_id }}
          actor: ${{ github.actor }}
          triggering-actor: ${{ github.triggering_actor }}

  qualify:
    needs: authorize
    if: inputs.operation == 'upload-and-record' && needs.authorize.outputs.approved == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ios-release-e2e.yml
    with:
      target_sha: ${{ needs.authorize.outputs.target_sha }}
      mode: stock

  release:
    name: Upload and record iOS beta
    needs: [authorize, qualify]
    if: inputs.operation == 'upload-and-record' && needs.authorize.outputs.approved == 'true'
    permissions:
      actions: read
      attestations: read
      contents: read
    runs-on: xcode-27
    timeout-minutes: 120
    environment: ios-beta-release
    concurrency:
      group: ios-beta-release-openclaw
      cancel-in-progress: false
    env:
      BUILD_TIMESTAMP: ${{ needs.authorize.outputs.build_timestamp }}
      RELEASE_TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
    steps:
      - name: Checkout approved release target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted mobile release authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: apps/ios/build/mobile-release-ci/authority
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            .github/actions/mobile-release-authority
            .github/actions/ios-signing-keychain
            scripts
            apps/mobile/version.json
            apps/android/version.json
            apps/android/Config/Version.properties
            apps/android/fastlane/metadata/android/en-US/release_notes.txt
            apps/ios/CHANGELOG.md

      - name: Setup trusted Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Revalidate release authority immediately before signing access
        uses: ./apps/ios/build/mobile-release-ci/authority/.github/actions/mobile-release-authority
        with:
          operation: revalidate
          platform: ios
          workflow-path: .github/workflows/ios-beta-release.yml
          workflow-full-ref: ${{ github.workflow_ref }}
          workflow-sha: ${{ github.workflow_sha }}
          target-ref: ${{ needs.authorize.outputs.target_ref }}
          target-sha: ${{ env.RELEASE_TARGET_SHA }}
          authority-run-id: ${{ needs.authorize.outputs.run_id }}

      - name: Create apps-signing read token
        id: apps-signing-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: "2729701"
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: openclaw
          repositories: apps-signing
          permission-contents: read

      - name: Revalidate release authority immediately before iOS signing checkout
        uses: ./apps/ios/build/mobile-release-ci/authority/.github/actions/mobile-release-authority
        with:
          operation: revalidate
          platform: ios
          workflow-path: .github/workflows/ios-beta-release.yml
          workflow-full-ref: ${{ github.workflow_ref }}
          workflow-sha: ${{ github.workflow_sha }}
          target-ref: ${{ needs.authorize.outputs.target_ref }}
          target-sha: ${{ env.RELEASE_TARGET_SHA }}
          authority-run-id: ${{ needs.authorize.outputs.run_id }}

      - name: Checkout encrypted iOS signing assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/apps-signing
          ref: main
          path: apps/ios/build/release-signing/apps-signing
          token: ${{ steps.apps-signing-token.outputs.token }}
          persist-credentials: false

      - name: Route readonly match checkout to approved signing assets
        run: |
          set -euo pipefail
          signing_repo="file://${GITHUB_WORKSPACE}/apps/ios/build/release-signing/apps-signing/"
          git config --global url."${signing_repo}".insteadOf git@github.com:openclaw/apps-signing.git

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          install-bun: "false"
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: "3.4.10"
          bundler: "4.0.21"
          bundler-cache: false
          working-directory: apps/ios

      - name: Install locked Fastlane bundle
        working-directory: apps/ios
        run: |
          set -euo pipefail
          bundle _4.0.21_ install --jobs 4 --retry 3
          bundle _4.0.21_ check
          test "$(bundle _4.0.21_ exec ruby -e 'require "fastlane"; print Fastlane::VERSION')" = "2.240.1"

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          source apps/ios/build/mobile-release-ci/authority/scripts/lib/swift-toolchain.sh
          select_xcode_toolchain 27.0

      - name: Install pinned Swift build tools
        run: |
          set -euo pipefail
          swift_tools_dir="${RUNNER_TEMP}/openclaw-swift-tools"
          ./scripts/install-xcodegen.sh "$swift_tools_dir"
          ./scripts/install-swift-tools.sh "$swift_tools_dir"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"

      - name: Install Watch Rust toolchain
        if: hashFiles('apps/shared/OpenClawWatchRTC/Cargo.toml') != ''
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          watch_toolchain="$(awk -F '"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$watch_toolchain"
          rustup toolchain install "$watch_toolchain" --profile minimal --component rust-src

      - name: Create job-owned iOS signing keychain
        uses: ./apps/ios/build/mobile-release-ci/authority/.github/actions/ios-signing-keychain

      - name: Refresh trusted authority before store access
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: apps/ios/build/mobile-release-ci/sink
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            .github/actions/mobile-release-authority
            scripts
            apps/mobile/version.json
            apps/android/version.json
            apps/android/Config/Version.properties
            apps/android/fastlane/metadata/android/en-US/release_notes.txt
            apps/ios/CHANGELOG.md

      - name: Revalidate release authority immediately before signing proof
        uses: ./apps/ios/build/mobile-release-ci/sink/.github/actions/mobile-release-authority
        with:
          operation: revalidate
          platform: ios
          workflow-path: .github/workflows/ios-beta-release.yml
          workflow-full-ref: ${{ github.workflow_ref }}
          workflow-sha: ${{ github.workflow_sha }}
          target-ref: ${{ needs.authorize.outputs.target_ref }}
          target-sha: ${{ env.RELEASE_TARGET_SHA }}
          authority-run-id: ${{ needs.authorize.outputs.run_id }}

      - name: Validate readonly iOS signing key access
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          set -euo pipefail
          source ./scripts/lib/ios-fastlane.sh
          (cd apps/ios && run_ios_fastlane ios signing_check)
          node apps/ios/build/mobile-release-ci/authority/.github/actions/ios-signing-keychain/keychain.mjs probe

      - name: Revalidate release authority immediately before upload
        uses: ./apps/ios/build/mobile-release-ci/sink/.github/actions/mobile-release-authority
        with:
          operation: revalidate
          platform: ios
          workflow-path: .github/workflows/ios-beta-release.yml
          workflow-full-ref: ${{ github.workflow_ref }}
          workflow-sha: ${{ github.workflow_sha }}
          target-ref: ${{ needs.authorize.outputs.target_ref }}
          target-sha: ${{ env.RELEASE_TARGET_SHA }}
          authority-run-id: ${{ needs.authorize.outputs.run_id }}

      - name: Upload and distribute iOS beta
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          GIT_COMMIT: ${{ env.RELEASE_TARGET_SHA }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          OPENCLAW_BUILD_TIMESTAMP: ${{ env.BUILD_TIMESTAMP }}
          OPENCLAW_MOBILE_RELEASE_AUTHORITY_RECEIPT_DIGEST: ${{ needs.authorize.outputs.receipt_digest }}
          OPENCLAW_MOBILE_RELEASE_INTENT_PATH: ${{ runner.temp }}/mobile-release-intent-ios/intent.json
          OPENCLAW_MOBILE_RELEASE_REF_MODE: intent
          OPENCLAW_MOBILE_RELEASE_TARGET_REF: ${{ needs.authorize.outputs.target_ref }}
          SCAN_APP_NAME: OpenClaw
          SCAN_DEPLOYMENT_TARGET_VERSION: "18.0"
          TESTFLIGHT_INTERNAL_GROUP: ${{ vars.TESTFLIGHT_INTERNAL_GROUP }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/mobile-release-intent-ios"
          pnpm ios:release:upload
          test -f "$RUNNER_TEMP/mobile-release-intent-ios/intent.json"
          test "$(wc -c < "$RUNNER_TEMP/mobile-release-intent-ios/intent.json")" -le 4096

      - name: Upload exact iOS release intent
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-release-intent-ios-${{ github.run_id }}-1
          path: ${{ runner.temp }}/mobile-release-intent-ios/intent.json
          if-no-files-found: error
          retention-days: 30

      - name: Checkout trusted mobile release recorder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .mobile-release-recorder
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            .github/actions/mobile-release-authority
            scripts
            apps/mobile/version.json
            apps/android/version.json
            apps/android/Config/Version.properties
            apps/android/fastlane/metadata/android/en-US/release_notes.txt
            apps/ios/CHANGELOG.md

      - name: Validate and record immutable iOS release ref
        uses: ./.mobile-release-recorder/.github/actions/mobile-release-authority
        with:
          operation: record
          platform: ios
          workflow-path: .github/workflows/ios-beta-release.yml
          workflow-full-ref: ${{ github.workflow_ref }}
          workflow-sha: ${{ github.workflow_sha }}
          target-ref: ${{ needs.authorize.outputs.target_ref }}
          target-sha: ${{ env.RELEASE_TARGET_SHA }}
          authority-run-id: ${{ needs.authorize.outputs.run_id }}
          release-ref-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

  recover-record:
    name: Recover immutable iOS release ref
    if: inputs.operation == 'record-only'
    permissions:
      actions: read
      attestations: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ios-beta-release
    concurrency:
      group: ios-beta-release-openclaw
      cancel-in-progress: false
    steps:
      - name: Checkout trusted mobile release recorder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            .github/actions/mobile-release-authority
            scripts
            apps/mobile/version.json
            apps/android/version.json
            apps/android/Config/Version.properties
            apps/android/fastlane/metadata/android/en-US/release_notes.txt
            apps/ios/CHANGELOG.md

      - name: Setup trusted Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate and recover immutable iOS release ref
        uses: ./.github/actions/mobile-release-authority
        with:
          operation: record
          platform: ios
          workflow-path: .github/workflows/ios-beta-release.yml
          workflow-full-ref: ${{ github.workflow_ref }}
          workflow-sha: ${{ github.workflow_sha }}
          target-ref: ${{ inputs.target_ref }}
          target-sha: ${{ inputs.target_sha }}
          authority-run-id: ${{ inputs.source_run_id }}
          recovery: "true"
          release-ref-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

  inspect:
    name: Inspect iOS release state without publication
    if: inputs.operation == 'inspect'
    permissions:
      actions: read
      contents: read
    runs-on: macos-26
    timeout-minutes: 30
    environment: ios-beta-release
    concurrency:
      group: ios-beta-release-openclaw
      cancel-in-progress: false
    env:
      BUNDLE_DEPLOYMENT: "true"
    steps:
      - name: Checkout trusted inspection tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup trusted Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          install-bun: "false"
          node-version: ${{ env.NODE_VERSION }}

      - name: Checkout candidate data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          path: .ios-inspection-candidate
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            apps/mobile/version.json
            apps/ios/CHANGELOG.md

      - name: Setup trusted Ruby
        uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: "3.4.10"
          bundler: "4.0.21"
          bundler-cache: false
          working-directory: apps/ios

      - name: Install locked inspection Fastlane bundle
        working-directory: apps/ios
        run: |
          set -euo pipefail
          bundle _4.0.21_ install --jobs 4 --retry 3
          bundle _4.0.21_ check
          test "$(bundle _4.0.21_ exec ruby -e 'require "fastlane"; print Fastlane::VERSION')" = "2.240.1"

      - name: Revalidate inspection authority immediately before credential access
        id: inspection-authority
        uses: ./.github/actions/mobile-release-authority
        with:
          operation: inspect
          platform: ios
          workflow-path: .github/workflows/ios-beta-release.yml
          workflow-full-ref: ${{ github.workflow_ref }}
          workflow-sha: ${{ github.workflow_sha }}
          target-ref: ${{ inputs.target_ref }}
          target-sha: ${{ inputs.target_sha }}
          authority-run-id: ${{ github.run_id }}

      - name: Inspect iOS plan and exact build relationships
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          TESTFLIGHT_INTERNAL_GROUP: ${{ vars.TESTFLIGHT_INTERNAL_GROUP }}
          INSPECT_APP_STORE_VERSION: ${{ steps.inspection-authority.outputs.inspection-app-store-version }}
          INSPECT_BUILD_NUMBER: ${{ inputs.inspect_build_number }}
        run: |
          set -euo pipefail
          source ./scripts/lib/ios-fastlane.sh
          (cd apps/ios && run_ios_fastlane ios release_inspect \
            "source_root:${GITHUB_WORKSPACE}/.ios-inspection-candidate" \
            "app_store_version:${INSPECT_APP_STORE_VERSION}" \
            "build_number:${INSPECT_BUILD_NUMBER}" \
            "output_directory:${RUNNER_TEMP}/ios-release-inspection")

      - name: Revalidate inspection authority before retaining observations
        uses: ./.github/actions/mobile-release-authority
        with:
          operation: inspect
          platform: ios
          workflow-path: .github/workflows/ios-beta-release.yml
          workflow-full-ref: ${{ github.workflow_ref }}
          workflow-sha: ${{ github.workflow_sha }}
          target-ref: ${{ inputs.target_ref }}
          target-sha: ${{ inputs.target_sha }}
          authority-run-id: ${{ github.run_id }}

      - name: Upload read-only inspection observations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-release-inspection-${{ github.run_id }}-1
          path: ${{ runner.temp }}/ios-release-inspection/*.json
          if-no-files-found: error
          retention-days: 7
