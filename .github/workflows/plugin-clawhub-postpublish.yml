name: Plugin ClawHub Postpublish

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] read-only verifier; authenticates exact sealed parent/child attempts and immutable receipt/artifact tuples; never executes downloaded content
    workflows: [OpenClaw Release Publish]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: plugin-clawhub-postpublish-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    if: >-
      github.repository == 'openclaw/openclaw' &&
      github.event.workflow_run.repository.full_name == 'openclaw/openclaw' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ${{ vars.OPENCLAW_RELEASE_RUNNER_GROUP != '' && fromJSON(format('{{"group":{0},"labels":{1}}}', toJSON(vars.OPENCLAW_RELEASE_RUNNER_GROUP), toJSON('ubuntu-latest'))) || ('ubuntu-latest') }}
    timeout-minutes: 60
    steps:
      - name: Checkout trusted verification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"

      - name: Verify terminal publication and canonical registry bytes
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_STATE_POLICY: ${{ github.event.workflow_run.conclusion == 'failure' && 'sealed-producer' || 'completed-success' }}
          VERIFIER_SHA: ${{ github.workflow_sha }}
        run: node scripts/clawhub-postpublish.mjs

      - name: Retain publication verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: clawhub-postpublish-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/clawhub-postpublish/evidence.json
          if-no-files-found: warn
          retention-days: 30
