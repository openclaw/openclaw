name: Labeler

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] maintainer-owned triage workflow; trusted base checkout only, no untrusted PR code execution
    types: [opened, synchronize, reopened, edited]
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      max_prs:
        description: "Maximum number of open PRs to process (0 = all)"
        required: false
        default: "200"
      per_page:
        description: "PRs per page (1-100)"
        required: false
        default: "50"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions: {}

jobs:
  label:
    if: >-
      ${{ (
        github.event_name == 'pull_request_target' &&
        (
          github.event.action != 'edited' ||
          github.event.changes.title ||
          github.event.changes.base
        )
      ) }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /.github/labeler.yml
            /scripts/github/labeler-labels.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        continue-on-error: true
        with:
          app-id: "2729701"
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-members: read
          permission-metadata: read
          permission-pull-requests: write
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token-fallback
        if: steps.app-token.outcome == 'failure'
        with:
          app-id: "2971289"
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY_FALLBACK }}
          permission-contents: read
          permission-issues: write
          permission-members: read
          permission-metadata: read
          permission-pull-requests: write
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        if: ${{ github.event.action != 'edited' || github.event.changes.base }}
        with:
          configuration-path: .github/labeler.yml
          repo-token: ${{ steps.app-token.outputs.token || steps.app-token-fallback.outputs.token }}
          sync-labels: true
      - name: Apply PR size label
        if: ${{ github.event.action != 'edited' || github.event.changes.base }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token || steps.app-token-fallback.outputs.token }}
          script: |
            const pullRequest = context.payload.pull_request;
            if (!pullRequest) {
              return;
            }

            const { pathToFileURL } = require("node:url");
            const { ensureSizeLabels, applySizeLabel } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/github/labeler-labels.mjs`).href
            );

            await ensureSizeLabels({ github, ...context.repo });

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });

            const currentLabels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });

            await applySizeLabel({
              github,
              core,
              ...context.repo,
              issueNumber: pullRequest.number,
              files,
              labelNames: new Set(currentLabels.map((label) => label.name)),
            });
      - name: Apply maintainer label
        if: ${{ github.event.action != 'edited' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token || steps.app-token-fallback.outputs.token }}
          script: |
            const login = context.payload.pull_request?.user?.login;
            if (!login) {
              return;
            }
            let isMaintainer = false;
            try {
              const membership = await github.rest.teams.getMembershipForUserInOrg({
                org: context.repo.owner,
                team_slug: "maintainer",
                username: login,
              });
              isMaintainer = membership?.data?.state === "active";
            } catch (error) {
              if (error?.status !== 404) {
                throw error;
              }
            }

            if (isMaintainer) {
              const { pathToFileURL } = require("node:url");
              const { addLabelsWithinCap } = await import(
                pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/github/labeler-labels.mjs`).href
              );
              await addLabelsWithinCap({
                github,
                core,
                owner: context.repo.owner,
                repo: context.repo.repo,
                issueNumber: context.payload.pull_request.number,
                labels: ["maintainer"],
              });
              return;
            }
      - name: Apply beta-blocker title label
        if: ${{ github.event.action != 'edited' || github.event.changes.title }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token || steps.app-token-fallback.outputs.token }}
          script: |
            const pullRequest = context.payload.pull_request;
            if (!pullRequest) {
              return;
            }

            const labelName = "beta-blocker";
            const matchesBetaBlocker = /\bbeta blocker\b/i.test(pullRequest.title ?? "");

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
              });
            } catch (error) {
              if (error?.status !== 404) {
                throw error;
              }
              core.info(`Skipping ${labelName} labeling because the label does not exist in the repository.`);
              return;
            }

            const currentLabels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const hasLabel = currentLabels.some((label) => label.name === labelName);

            if (matchesBetaBlocker && !hasLabel) {
              const { pathToFileURL } = require("node:url");
              const { addLabelsWithinCap } = await import(
                pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/github/labeler-labels.mjs`).href
              );
              await addLabelsWithinCap({
                github,
                core,
                owner: context.repo.owner,
                repo: context.repo.repo,
                issueNumber: pullRequest.number,
                labels: [labelName],
              });
              return;
            }

            if (!matchesBetaBlocker && hasLabel) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                name: labelName,
              });
            }
      - name: Apply too-many-prs label
        if: ${{ github.event.action != 'edited' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token || steps.app-token-fallback.outputs.token }}
          script: |
            const pullRequest = context.payload.pull_request;
            if (!pullRequest) {
              return;
            }

            const activePrLimitLabel = "r: too-many-prs";
            const activePrLimitOverrideLabel = "r: too-many-prs-override";
            const activePrLimit = 20;
            const labelColor = "B60205";
            const labelDescription = `Author has more than ${activePrLimit} active PRs in this repo`;
            const authorLogin = pullRequest.user?.login;
            const headRefName = pullRequest.head?.ref ?? "";
            if (!authorLogin) {
              return;
            }

            const currentLabels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });

            const labelNames = new Set(
              currentLabels
                .map((label) => (typeof label === "string" ? label : label?.name))
                .filter((name) => typeof name === "string"),
            );

            if (pullRequest.user?.type === "Bot" || /\[bot\]$/i.test(authorLogin) || authorLogin.startsWith("app/")) {
              if (labelNames.has(activePrLimitLabel)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pullRequest.number,
                    name: activePrLimitLabel,
                  });
                } catch (error) {
                  if (error?.status !== 404) {
                    throw error;
                  }
                }
              }
              core.info(`Skipping active PR limit for GitHub App author ${authorLogin}.`);
              return;
            }

            if (labelNames.has(activePrLimitOverrideLabel)) {
              if (labelNames.has(activePrLimitLabel)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pullRequest.number,
                    name: activePrLimitLabel,
                  });
                } catch (error) {
                  if (error?.status !== 404) {
                    throw error;
                  }
                }
              }
              return;
            }

            const ensureLabelExists = async () => {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: activePrLimitLabel,
                });
              } catch (error) {
                if (error?.status !== 404) {
                  throw error;
                }
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: activePrLimitLabel,
                  color: labelColor,
                  description: labelDescription,
                });
              }
            };

            const isPrivilegedAuthor = async () => {
              if (pullRequest.author_association === "OWNER") {
                return true;
              }

              let isMaintainer = false;
              try {
                const membership = await github.rest.teams.getMembershipForUserInOrg({
                  org: context.repo.owner,
                  team_slug: "maintainer",
                  username: authorLogin,
                });
                isMaintainer = membership?.data?.state === "active";
              } catch (error) {
                if (error?.status !== 404) {
                  throw error;
                }
              }

              if (isMaintainer) {
                return true;
              }

              try {
                const permission = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: authorLogin,
                });
                const roleName = (permission?.data?.role_name ?? "").toLowerCase();
                return roleName === "admin" || roleName === "maintain";
              } catch (error) {
                if (error?.status !== 404) {
                  throw error;
                }
              }

              return false;
            };

            const automationPrHeadPrefixes = ["clawsweeper/", "clownfish/"];
            const isAutomationPullRequest =
              typeof headRefName === "string" &&
              automationPrHeadPrefixes.some((prefix) => headRefName.startsWith(prefix));

            if ((await isPrivilegedAuthor()) || isAutomationPullRequest) {
              if (labelNames.has(activePrLimitLabel)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pullRequest.number,
                    name: activePrLimitLabel,
                  });
                } catch (error) {
                  if (error?.status !== 404) {
                    throw error;
                  }
                }
              }
              return;
            }

            let openPrCount = 0;
            try {
              const result = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:pr is:open author:${authorLogin}`,
                per_page: 1,
              });
              openPrCount = result?.data?.total_count ?? 0;
            } catch (error) {
              if (error?.status !== 422) {
                throw error;
              }
              core.warning(`Skipping open PR count for ${authorLogin}; treating as 0.`);
            }

            if (openPrCount > activePrLimit) {
              await ensureLabelExists();
              if (!labelNames.has(activePrLimitLabel)) {
                const { pathToFileURL } = require("node:url");
                const { addLabelsWithinCap } = await import(
                  pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/github/labeler-labels.mjs`).href
                );
                await addLabelsWithinCap({
                  github,
                  core,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issueNumber: pullRequest.number,
                  labels: [activePrLimitLabel],
                });
              }
              return;
            }

            if (labelNames.has(activePrLimitLabel)) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  name: activePrLimitLabel,
                });
              } catch (error) {
                if (error?.status !== 404) {
                  throw error;
                }
              }
            }

  backfill-pr-labels:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: /scripts/github/labeler-labels.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        continue-on-error: true
        with:
          app-id: "2729701"
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-members: read
          permission-metadata: read
          permission-pull-requests: write
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token-fallback
        if: steps.app-token.outcome == 'failure'
        with:
          app-id: "2971289"
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY_FALLBACK }}
          permission-issues: write
          permission-members: read
          permission-metadata: read
          permission-pull-requests: write
      - name: Backfill PR labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token || steps.app-token-fallback.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const inputs = context.payload.inputs ?? {};
            const maxPrsInput = inputs.max_prs ?? "200";
            const perPageInput = inputs.per_page ?? "50";
            const parsedMaxPrs = Number.parseInt(maxPrsInput, 10);
            const parsedPerPage = Number.parseInt(perPageInput, 10);
            const maxPrs = Number.isFinite(parsedMaxPrs) ? parsedMaxPrs : 200;
            const perPage = Number.isFinite(parsedPerPage) ? Math.min(100, Math.max(1, parsedPerPage)) : 50;
            const processAll = maxPrs <= 0;
            const maxCount = processAll ? Number.POSITIVE_INFINITY : Math.max(1, maxPrs);

            const { pathToFileURL } = require("node:url");
            const { addLabelsWithinCap, ensureSizeLabels, applySizeLabel } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/github/labeler-labels.mjs`).href
            );

            const betaBlockerLabel = "beta-blocker";
            const maintainerCache = new Map();

            async function hasBetaBlockerLabel() {
              try {
                await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name: betaBlockerLabel,
                });
                return true;
              } catch (error) {
                if (error?.status !== 404) {
                  throw error;
                }
                return false;
              }
            }

            async function resolveMaintainerLabel(login) {
              if (maintainerCache.has(login)) {
                return maintainerCache.get(login);
              }

              let isMaintainer = false;
              try {
                const membership = await github.rest.teams.getMembershipForUserInOrg({
                  org: owner,
                  team_slug: "maintainer",
                  username: login,
                });
                isMaintainer = membership?.data?.state === "active";
              } catch (error) {
                if (error?.status !== 404) {
                  throw error;
                }
              }

              const label = isMaintainer ? "maintainer" : null;
              maintainerCache.set(login, label);
              return label;
            }

            async function applyMaintainerLabel(pullRequest, labelNames) {
              const login = pullRequest.user?.login;
              if (!login) {
                return;
              }

              const label = await resolveMaintainerLabel(login);
              if (!label) {
                return;
              }

              if (labelNames.has(label)) {
                return;
              }

              const added = await addLabelsWithinCap({
                github,
                core,
                owner,
                repo,
                issueNumber: pullRequest.number,
                labels: [label],
              });
              if (added) {
                labelNames.add(label);
              }
            }

            async function applyBetaBlockerTitleLabel(pullRequest, labelNames) {
              const matchesBetaBlocker = /\bbeta blocker\b/i.test(pullRequest.title ?? "");

              if (matchesBetaBlocker) {
                if (!labelNames.has(betaBlockerLabel)) {
                  const added = await addLabelsWithinCap({
                    github,
                    core,
                    owner,
                    repo,
                    issueNumber: pullRequest.number,
                    labels: [betaBlockerLabel],
                  });
                  if (added) {
                    labelNames.add(betaBlockerLabel);
                  }
                }
                return;
              }

              if (!labelNames.has(betaBlockerLabel)) {
                return;
              }

              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: pullRequest.number,
                name: betaBlockerLabel,
              });
              labelNames.delete(betaBlockerLabel);
            }

            await ensureSizeLabels({ github, owner, repo });
            const betaBlockerLabelExists = await hasBetaBlockerLabel();

            let page = 1;
            let processed = 0;

            while (processed < maxCount) {
              const remaining = maxCount - processed;
              const pageSize = processAll ? perPage : Math.min(perPage, remaining);
              const { data: pullRequests } = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                per_page: pageSize,
                page,
              });

              if (pullRequests.length === 0) {
                break;
              }

              for (const pullRequest of pullRequests) {
                if (!processAll && processed >= maxCount) {
                  break;
                }

                const currentLabels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
                  owner,
                  repo,
                  issue_number: pullRequest.number,
                  per_page: 100,
                });

                const labelNames = new Set(
                  currentLabels.map((label) => label.name).filter((name) => typeof name === "string"),
                );

                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: pullRequest.number,
                  per_page: 100,
                });
                await applySizeLabel({
                  github,
                  core,
                  owner,
                  repo,
                  issueNumber: pullRequest.number,
                  files,
                  labelNames,
                });
                await applyMaintainerLabel(pullRequest, labelNames);
                if (betaBlockerLabelExists) {
                  await applyBetaBlockerTitleLabel(pullRequest, labelNames);
                }

                processed += 1;
              }

              if (pullRequests.length < pageSize) {
                break;
              }

              page += 1;
            }

            core.info(`Processed ${processed} pull requests.`);

  label-issues:
    if: >-
      ${{ (github.event_name == 'issues' &&
        (github.event.action != 'edited' || !github.event.changes || github.event.changes.title)) }}
    concurrency:
      group: ${{ github.workflow }}-issue-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: /scripts/github/labeler-labels.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        continue-on-error: true
        with:
          app-id: "2729701"
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-members: read
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token-fallback
        if: steps.app-token.outcome == 'failure'
        with:
          app-id: "2971289"
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY_FALLBACK }}
          permission-issues: write
          permission-members: read
      - name: Apply maintainer label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token || steps.app-token-fallback.outputs.token }}
          script: |
            const login = context.payload.issue?.user?.login;
            if (!login) {
              return;
            }
            let isMaintainer = false;
            try {
              const membership = await github.rest.teams.getMembershipForUserInOrg({
                org: context.repo.owner,
                team_slug: "maintainer",
                username: login,
              });
              isMaintainer = membership?.data?.state === "active";
            } catch (error) {
              if (error?.status !== 404) {
                throw error;
              }
            }

            if (isMaintainer) {
              const { pathToFileURL } = require("node:url");
              const { addLabelsWithinCap } = await import(
                pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/github/labeler-labels.mjs`).href
              );
              await addLabelsWithinCap({
                github,
                core,
                owner: context.repo.owner,
                repo: context.repo.repo,
                issueNumber: context.payload.issue.number,
                labels: ["maintainer"],
              });
              return;
            }
      - name: Apply beta-blocker title label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token || steps.app-token-fallback.outputs.token }}
          script: |
            const issue = context.payload.issue;
            if (!issue || issue.pull_request) {
              return;
            }

            const labelName = "beta-blocker";
            const matchesBetaBlocker = /^beta blocker:/i.test(issue.title ?? "");

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
              });
            } catch (error) {
              if (error?.status !== 404) {
                throw error;
              }
              core.info(`Skipping ${labelName} labeling because the label does not exist in the repository.`);
              return;
            }

            const currentLabels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });
            const hasLabel = currentLabels.some((label) => label.name === labelName);

            if (matchesBetaBlocker && !hasLabel) {
              const { pathToFileURL } = require("node:url");
              const { addLabelsWithinCap } = await import(
                pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/github/labeler-labels.mjs`).href
              );
              await addLabelsWithinCap({
                github,
                core,
                owner: context.repo.owner,
                repo: context.repo.repo,
                issueNumber: issue.number,
                labels: [labelName],
              });
              return;
            }

            if (!matchesBetaBlocker && hasLabel) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: labelName,
              });
            }
