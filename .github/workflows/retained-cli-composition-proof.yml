        base64 --decode "$PRIVATE_PROOF/manifest.json.b64" | gzip -d > "$PRIVATE_PROOF/manifest.json"

        echo 42cada9eb0773f1fca7eef4e4f33c3f4101d8c9f3978b195266bd8636b03a737  "$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/static.patch.b64" | gzip -d > "$PRIVATE_PROOF/static.patch"

