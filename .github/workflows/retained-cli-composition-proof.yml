name: Exact-C pre-FRV gate 7957bf325870
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pre-frv-7957bf325870
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      TARGET_SHA: 7957bf3258707ba5d5860393990a67aa53ef2f91
      OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 7957bf3258707ba5d5860393990a67aa53ef2f91
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
      - uses: ./candidate/.github/actions/setup-pnpm-store-cache
        with:
          package-manager-file: candidate/package.json
          lockfile-path: candidate/pnpm-lock.yaml
          node-version: "24.22.1"
          cache-mode: off
      - name: Verify identity and install frozen dependencies
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pre-frv"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          printf '%s\n' "$TARGET_SHA" > "$RUNNER_TEMP/pre-frv/target-sha.txt"
          printf '%s\n' '23dc860beec723ad9bab5a7458600cc2abce29a7441e98915fbdeeecc0e24ecb  package.json' '059a620ed8261d7b8f599a3e13a6c101ec5271b03002dbf48144ce25924e28ba  pnpm-lock.yaml' | sha256sum --check
          sha256sum package.json pnpm-lock.yaml > "$RUNNER_TEMP/pre-frv/dependency-inputs.sha256"
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/pre-frv/install.log"
          git diff --exit-code
      - name: Exact-C locale checks and mandatory production UI build
        working-directory: candidate
        shell: bash
        run: |
          set -uo pipefail
          blocked=0
          printf '## Exact-C pre-FRV gate\n\nTarget: %s\n\n' "$TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"
          for check in ui:i18n:check native:i18n:check; do
            logfile="$RUNNER_TEMP/pre-frv/${check//:/-}.log"
            pnpm "$check" 2>&1 | tee "$logfile"
            status=${PIPESTATUS[0]}
            printf '%s exit=%s\n' "$check" "$status" >> "$RUNNER_TEMP/pre-frv/results.txt"
            if [[ "$status" == 0 ]]; then
              printf -- '- %s: PASS\n' "$check" >> "$GITHUB_STEP_SUMMARY"
            elif grep -Eq '^(control-ui-i18n drift detected\.|control-ui-i18n generated locales still contain English fallbacks\.|[^:]+: translated.json needs aggregate materialization|[^:]+: missing verified translations:|Error: native app i18n inventory drift detected\.|Error: Android generated localization drift:|Error: Apple catalog .* is stale; run native-app-i18n.ts sync --write)' "$logfile"; then
              echo "::warning::$check reports generated-locale drift at $TARGET_SHA; strict FRV locale jobs remain required."
              printf -- '- %s: generated-locale WARNING (exit %s; see artifact)\n' "$check" "$status" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$check failed unexpectedly at $TARGET_SHA (exit $status)."
              printf -- '- %s: BLOCKED (unexpected exit %s)\n' "$check" "$status" >> "$GITHUB_STEP_SUMMARY"
              blocked=1
            fi
          done
          pnpm ui:build 2>&1 | tee "$RUNNER_TEMP/pre-frv/ui-build.log"
          status=${PIPESTATUS[0]}
          printf 'ui:build exit=%s\n' "$status" >> "$RUNNER_TEMP/pre-frv/results.txt"
          if [[ "$status" != 0 ]]; then
            echo "::error::Production UI build / precompressed verification failed at $TARGET_SHA."
            blocked=1
          fi
          printf -- '- ui:build: exit %s (production build, precompressed verification, startup/largest-asset budget report in artifact)\n' "$status" >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code || blocked=1
          exit "$blocked"
      - name: Retain exact-C preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pre-frv-7957bf325870-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pre-frv/
          if-no-files-found: error
          retention-days: 30
