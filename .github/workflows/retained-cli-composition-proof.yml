name: Release 11.4 queue custody frozen regression proof v2
'on':
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-114-queue-custody-v2-73bef956
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  EXPECTED_TARGET: 73bef956a886abbbe6aef0c87efd5bcbfd6f8921
jobs:
  baseline:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 1
        persist-credentials: false
    - name: Bind base, frozen patches, and effective source before preparation
      id: bind
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target_ref }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
        LANE: baseline
      run: |
        set -euo pipefail
        test "$INPUT_TARGET" = "$EXPECTED_TARGET"
        test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
        test -z "$(git status --porcelain)"
        proof=.artifacts/queue-custody-proof
        mkdir -p "$proof"
        printf 'source=%s
        workflow=%s
        run=%s
        attempt=%s
        lane=%s
        ' "$EXPECTED_TARGET" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$LANE" > "$proof/identity.txt"
        base64 --decode > "$proof/repair.patch" <<'FROZEN_0'
        
        FROZEN_0
        base64 --decode > "$proof/regression-only.patch" <<'FROZEN_1'
        
        FROZEN_1
        base64 --decode > "$proof/baseline-logging.patch" <<'FROZEN_2'
        
        FROZEN_2
        base64 --decode > "$proof/diagnostic.patch" <<'FROZEN_3'
        
        FROZEN_3
        base64 --decode > "$proof/source.sha256" <<'FROZEN_4'
        
        FROZEN_4
        base64 --decode > "$proof/prerequisites.sha256" <<'FROZEN_5'
        
        FROZEN_5
        base64 --decode > "$proof/bound-base.sha256" <<'FROZEN_6'
        
        FROZEN_6
        base64 --decode > "$proof/bound-paths.txt" <<'FROZEN_7'
        
        FROZEN_7
        base64 --decode > "$proof/baseline-effective.sha256" <<'FROZEN_8'
        
        FROZEN_8
        printf '%s  %s
        ' 'd406408fbe5f118979616cbe68512d30719eff9a1e466cbeac7d1fddfa4621c1' "$proof/repair.patch" | sha256sum --check --strict
        printf '%s  %s
        ' 'fe4fbfd0b1ead35d72ffc5d3a67dae0111b74ad885cd7a4b1c7f514e6a7d656c' "$proof/regression-only.patch" | sha256sum --check --strict
        printf '%s  %s
        ' 'c5b4bffe0f8352b7d0492b07e468358232a3df2111bf9082b2dfe4de02c354e4' "$proof/baseline-logging.patch" | sha256sum --check --strict
        printf '%s  %s
        ' '28513b7477a4142c79b69f391847da6b65edfe924e293f8caec8be7474ed06a0' "$proof/diagnostic.patch" | sha256sum --check --strict
        sha256sum --check --strict "$proof/source.sha256"
        sha256sum --check --strict "$proof/prerequisites.sha256"
        sha256sum --check --strict "$proof/bound-base.sha256"
        # Full tracked base archive plus separately retained applied patches reconstruct all source.
        git archive --format=tar HEAD | gzip -n > "$proof/base-source.tar.gz"
        while IFS= read -r path; do
          mkdir -p "$proof/source/$(dirname "$path")"
          cp "$path" "$proof/source/$path"
        done < "$proof/bound-paths.txt"
        git apply --check "$proof/regression-only.patch"
        git apply "$proof/regression-only.patch"
        git apply --check "$proof/baseline-logging.patch"
        git apply "$proof/baseline-logging.patch"
        sha256sum --check --strict "$proof/baseline-effective.sha256"
        printf '%s
        ' 'src/auto-reply/reply/queue.drain-generation.test.ts' > "$proof/expected-paths.txt"
        git diff --name-only | LC_ALL=C sort > "$proof/actual-paths.txt"
        diff -u "$proof/expected-paths.txt" "$proof/actual-paths.txt"
        git diff --check
        git diff --binary --full-index > "$proof/effective.patch"
        while IFS= read -r path; do
          mkdir -p "$proof/effective-source/$(dirname "$path")"
          cp "$path" "$proof/effective-source/$path"
        done < "$proof/bound-paths.txt"
        # Every patch is applied before setup or canonical runtime preparation.
        test ! -d dist
        test ! -d dist-runtime
        test -z "${OPENCLAW_E2E_SKIP_BUILD:-}"
        test -z "${OPENCLAW_E2E_USE_PREBUILT_DIST:-}"
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Require exactly both closed-scope baseline failures
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/queue-custody-proof
        set +e
        node scripts/run-vitest.mjs src/auto-reply/reply/queue.drain-generation.test.ts --config test/vitest/vitest.auto-reply.config.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile="$GITHUB_WORKSPACE/$proof/baseline-results.json" 2>&1 | tee "$proof/closed-scope-baseline.log"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf 'command_exit=%s
        log_exit=%s
        ' "${statuses[0]}" "${statuses[1]}" > "$proof/closed-scope-baseline-status.txt"
        test "${statuses[0]}" -eq 1
        test "${statuses[1]}" -eq 0
        for mode in followup collect; do
          grep -F "followup queue drain failed for generation-reload-$mode: Error: Plugin invocation scope is closed" "$proof/closed-scope-baseline.log"
        done > "$proof/closed-scope-reason.txt"
        python3 - <<'PY'
        import json, re
        from pathlib import Path
        p=Path('.artifacts/queue-custody-proof')
        r=json.loads((p/'baseline-results.json').read_text())
        a=[a for t in r['testResults'] for a in t['assertionResults']]
        names={'resolves the current provider for queued '+mode+' input after its predecessor scope closes and retires' for mode in ['followup','collect']}
        assert len(a)==2 and {x['fullName'].strip() for x in a}==names, a
        assert all(x['status']=='failed' and x.get('failureMessages') for x in a), a
        for x in a:
         message=re.sub(r'\x1b\[[0-9;]*m', '', chr(10).join(x['failureMessages']))
         assert re.search(r'expected \[\] to have a length of 1 but got \+?0', message), message
        assert r['numTotalTests']==2 and r['numFailedTests']==2 and r['numPassedTests']==0 and r['numPendingTests']==0, r
        (p/'baseline-verdict.json').write_text(json.dumps({'expectedFailure':True,'reason':'Detached queue inherits closed predecessor invocation scope; both followup and collect regressions complete with empty-delivery assertion failures while each raw log records Plugin invocation scope is closed','tests':sorted(names)},indent=2)+chr(10))
        PY
    - name: Preserve frozen source, patches, raw logs and results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: release-114-queue-custody-v2-baseline-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .artifacts/
          test-results/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
  repair:
    needs: baseline
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 1
        persist-credentials: false
    - name: Bind base, frozen patches, and effective source before preparation
      id: bind
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target_ref }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
        LANE: repair
      run: |
        set -euo pipefail
        test "$INPUT_TARGET" = "$EXPECTED_TARGET"
        test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
        test -z "$(git status --porcelain)"
        proof=.artifacts/queue-custody-proof
        mkdir -p "$proof"
        printf 'source=%s
        workflow=%s
        run=%s
        attempt=%s
        lane=%s
        ' "$EXPECTED_TARGET" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$LANE" > "$proof/identity.txt"
        base64 --decode > "$proof/repair.patch" <<'FROZEN_0'
        
        FROZEN_0
        base64 --decode > "$proof/regression-only.patch" <<'FROZEN_1'
        
        FROZEN_1
        base64 --decode > "$proof/baseline-logging.patch" <<'FROZEN_2'
        
        FROZEN_2
        base64 --decode > "$proof/diagnostic.patch" <<'FROZEN_3'
        
        FROZEN_3
        base64 --decode > "$proof/source.sha256" <<'FROZEN_4'
        
        FROZEN_4
        base64 --decode > "$proof/prerequisites.sha256" <<'FROZEN_5'
        
        FROZEN_5
        base64 --decode > "$proof/bound-base.sha256" <<'FROZEN_6'
        
        FROZEN_6
        base64 --decode > "$proof/bound-paths.txt" <<'FROZEN_7'
        
        FROZEN_7
        base64 --decode > "$proof/repair-effective.sha256" <<'FROZEN_8'
        
        FROZEN_8
        printf '%s  %s
        ' 'd406408fbe5f118979616cbe68512d30719eff9a1e466cbeac7d1fddfa4621c1' "$proof/repair.patch" | sha256sum --check --strict
        printf '%s  %s
        ' 'fe4fbfd0b1ead35d72ffc5d3a67dae0111b74ad885cd7a4b1c7f514e6a7d656c' "$proof/regression-only.patch" | sha256sum --check --strict
        printf '%s  %s
        ' 'c5b4bffe0f8352b7d0492b07e468358232a3df2111bf9082b2dfe4de02c354e4' "$proof/baseline-logging.patch" | sha256sum --check --strict
        printf '%s  %s
        ' '28513b7477a4142c79b69f391847da6b65edfe924e293f8caec8be7474ed06a0' "$proof/diagnostic.patch" | sha256sum --check --strict
        sha256sum --check --strict "$proof/source.sha256"
        sha256sum --check --strict "$proof/prerequisites.sha256"
        sha256sum --check --strict "$proof/bound-base.sha256"
        # Full tracked base archive plus separately retained applied patches reconstruct all source.
        git archive --format=tar HEAD | gzip -n > "$proof/base-source.tar.gz"
        while IFS= read -r path; do
          mkdir -p "$proof/source/$(dirname "$path")"
          cp "$path" "$proof/source/$path"
        done < "$proof/bound-paths.txt"
        git apply --check "$proof/repair.patch"
        git apply "$proof/repair.patch"
        sha256sum --check --strict "$proof/repair-effective.sha256"
        printf '%s
        ' 'src/auto-reply/reply/queue.drain-generation.test.ts' 'src/auto-reply/reply/queue/drain-admission-scope.ts' > "$proof/expected-paths.txt"
        git diff --name-only | LC_ALL=C sort > "$proof/actual-paths.txt"
        diff -u "$proof/expected-paths.txt" "$proof/actual-paths.txt"
        git diff --check
        git diff --binary --full-index > "$proof/effective.patch"
        while IFS= read -r path; do
          mkdir -p "$proof/effective-source/$(dirname "$path")"
          cp "$path" "$proof/effective-source/$path"
        done < "$proof/bound-paths.txt"
        # Every patch is applied before setup or canonical runtime preparation.
        test ! -d dist
        test ! -d dist-runtime
        test -z "${OPENCLAW_E2E_SKIP_BUILD:-}"
        test -z "${OPENCLAW_E2E_USE_PREBUILT_DIST:-}"
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: queue-regressions
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/queue-custody-proof
        set +e
        node scripts/run-vitest.mjs src/auto-reply/reply/queue.drain-generation.test.ts src/auto-reply/reply/queue.drain-scope.test.ts src/auto-reply/reply/queue.drain-restart.test.ts --config test/vitest/vitest.auto-reply.config.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile="$GITHUB_WORKSPACE/$proof/queue-results.json" 2>&1 | tee "$proof/queue-regressions.log"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf 'command_exit=%s
        log_exit=%s
        ' "${statuses[0]}" "${statuses[1]}" > "$proof/queue-regressions-status.txt"
        if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
        exit "${statuses[1]}"
    - name: plugin-invocation-scope
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/queue-custody-proof
        set +e
        node scripts/run-vitest.mjs src/plugins/plugin-invocation-scope.test.ts --config test/vitest/vitest.plugins.config.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile="$GITHUB_WORKSPACE/$proof/plugin-results.json" 2>&1 | tee "$proof/plugin-invocation-scope.log"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf 'command_exit=%s
        log_exit=%s
        ' "${statuses[0]}" "${statuses[1]}" > "$proof/plugin-invocation-scope-status.txt"
        if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
        exit "${statuses[1]}"
    - name: Require all four complete test files passed
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        from pathlib import Path
        p=Path('.artifacts/queue-custody-proof')
        expected=['src/auto-reply/reply/queue.drain-generation.test.ts', 'src/auto-reply/reply/queue.drain-scope.test.ts', 'src/auto-reply/reply/queue.drain-restart.test.ts', 'src/plugins/plugin-invocation-scope.test.ts']
        seen=[]
        for name in ['queue','plugin']:
         r=json.loads((p/(name+'-results.json')).read_text())
         assert r['numTotalTests']>0 and r['numFailedTests']==0 and r['numPendingTests']==0, r
         for t in r['testResults']:
          assert t['status']=='passed' and t['assertionResults'], t
          assert all(a['status']=='passed' for a in t['assertionResults']), t
          matches=[f for f in expected if t['name'].endswith('/'+f)]
          assert len(matches)==1, t['name']
          seen.extend(matches)
        assert sorted(seen)==sorted(expected), seen
        (p/'unit-verdict.json').write_text(json.dumps({'completePassingFiles':seen},indent=2)+chr(10))
        PY
    - name: exact-two-file-format
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/queue-custody-proof
        set +e
        pnpm format:check -- src/auto-reply/reply/queue.drain-generation.test.ts src/auto-reply/reply/queue/drain-admission-scope.ts 2>&1 | tee "$proof/exact-two-file-format.log"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf 'command_exit=%s
        log_exit=%s
        ' "${statuses[0]}" "${statuses[1]}" > "$proof/exact-two-file-format-status.txt"
        if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
        exit "${statuses[1]}"
    - name: exact-two-file-lint
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/queue-custody-proof
        set +e
        node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json src/auto-reply/reply/queue.drain-generation.test.ts src/auto-reply/reply/queue/drain-admission-scope.ts 2>&1 | tee "$proof/exact-two-file-lint.log"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf 'command_exit=%s
        log_exit=%s
        ' "${statuses[0]}" "${statuses[1]}" > "$proof/exact-two-file-lint-status.txt"
        if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
        exit "${statuses[1]}"
    - name: affected-typegraph
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/queue-custody-proof
        set +e
        env -u OPENCLAW_LOCAL_CHECK node scripts/run-tsgo-core-test-shards.mjs --changed-paths-json '["src/auto-reply/reply/queue.drain-generation.test.ts","src/auto-reply/reply/queue/drain-admission-scope.ts"]' --concurrency 2 2>&1 | tee "$proof/affected-typegraph.log"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf 'command_exit=%s
        log_exit=%s
        ' "${statuses[0]}" "${statuses[1]}" > "$proof/affected-typegraph-status.txt"
        if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
        exit "${statuses[1]}"
    - name: Preserve frozen source, patches, raw logs and results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: release-114-queue-custody-v2-repair-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .artifacts/
          test-results/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
  e2e:
    needs:
    - baseline
    - repair
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane:
        - fifo
        - hardkill
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 1
        persist-credentials: false
    - name: Bind base, frozen patches, and effective source before preparation
      id: bind
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target_ref }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
        LANE: ${{ matrix.lane }}
      run: |
        set -euo pipefail
        test "$INPUT_TARGET" = "$EXPECTED_TARGET"
        test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
        test -z "$(git status --porcelain)"
        proof=.artifacts/queue-custody-proof
        mkdir -p "$proof"
        printf 'source=%s
        workflow=%s
        run=%s
        attempt=%s
        lane=%s
        ' "$EXPECTED_TARGET" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$LANE" > "$proof/identity.txt"
        base64 --decode > "$proof/repair.patch" <<'FROZEN_0'
        
        FROZEN_0
        base64 --decode > "$proof/regression-only.patch" <<'FROZEN_1'
        
        FROZEN_1
        base64 --decode > "$proof/baseline-logging.patch" <<'FROZEN_2'
        
        FROZEN_2
        base64 --decode > "$proof/diagnostic.patch" <<'FROZEN_3'
        
        FROZEN_3
        base64 --decode > "$proof/source.sha256" <<'FROZEN_4'
        
        FROZEN_4
        base64 --decode > "$proof/prerequisites.sha256" <<'FROZEN_5'
        
        FROZEN_5
        base64 --decode > "$proof/bound-base.sha256" <<'FROZEN_6'
        
        FROZEN_6
        base64 --decode > "$proof/bound-paths.txt" <<'FROZEN_7'
        
        FROZEN_7
        base64 --decode > "$proof/e2e-effective.sha256" <<'FROZEN_8'
        
        FROZEN_8
        printf '%s  %s
        ' 'd406408fbe5f118979616cbe68512d30719eff9a1e466cbeac7d1fddfa4621c1' "$proof/repair.patch" | sha256sum --check --strict
        printf '%s  %s
        ' 'fe4fbfd0b1ead35d72ffc5d3a67dae0111b74ad885cd7a4b1c7f514e6a7d656c' "$proof/regression-only.patch" | sha256sum --check --strict
        printf '%s  %s
        ' 'c5b4bffe0f8352b7d0492b07e468358232a3df2111bf9082b2dfe4de02c354e4' "$proof/baseline-logging.patch" | sha256sum --check --strict
        printf '%s  %s
        ' '28513b7477a4142c79b69f391847da6b65edfe924e293f8caec8be7474ed06a0' "$proof/diagnostic.patch" | sha256sum --check --strict
        sha256sum --check --strict "$proof/source.sha256"
        sha256sum --check --strict "$proof/prerequisites.sha256"
        sha256sum --check --strict "$proof/bound-base.sha256"
        # Full tracked base archive plus separately retained applied patches reconstruct all source.
        git archive --format=tar HEAD | gzip -n > "$proof/base-source.tar.gz"
        while IFS= read -r path; do
          mkdir -p "$proof/source/$(dirname "$path")"
          cp "$path" "$proof/source/$path"
        done < "$proof/bound-paths.txt"
        git apply --check "$proof/repair.patch"
        git apply "$proof/repair.patch"
        git apply --check "$proof/diagnostic.patch"
        git apply "$proof/diagnostic.patch"
        sha256sum --check --strict "$proof/e2e-effective.sha256"
        printf '%s
        ' 'src/auto-reply/reply/queue.drain-generation.test.ts' 'src/auto-reply/reply/queue/drain-admission-scope.ts' 'src/auto-reply/reply/queue/drain.ts' 'test/gateway-steer-fifo.e2e.test.ts' > "$proof/expected-paths.txt"
        git diff --name-only | LC_ALL=C sort > "$proof/actual-paths.txt"
        diff -u "$proof/expected-paths.txt" "$proof/actual-paths.txt"
        git diff --check
        git diff --binary --full-index > "$proof/effective.patch"
        while IFS= read -r path; do
          mkdir -p "$proof/effective-source/$(dirname "$path")"
          cp "$path" "$proof/effective-source/$path"
        done < "$proof/bound-paths.txt"
        # Every patch is applied before setup or canonical runtime preparation.
        test ! -d dist
        test ! -d dist-runtime
        test -z "${OPENCLAW_E2E_SKIP_BUILD:-}"
        test -z "${OPENCLAW_E2E_USE_PREBUILT_DIST:-}"
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Canonical fifo E2E repair proof
      if: matrix.lane == 'fifo'
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/queue-custody-proof
        node --version
        set +e
        OPENCLAW_E2E_VERBOSE=1 OPENCLAW_E2E_WORKERS=1 pnpm test:e2e:gateway test/gateway-steer-fifo.e2e.test.ts -t "dispatches terminal A before a later ordinary B queued during the same turn" 2>&1 | tee "$proof/fifo.log"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf 'canonical_e2e_exit=%s
        log_exit=%s
        ' "${statuses[0]}" "${statuses[1]}" > "$proof/fifo-status.txt"
        if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
        exit "${statuses[1]}"
    - name: Canonical hardkill E2E repair proof
      if: matrix.lane == 'hardkill'
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/queue-custody-proof
        node --version
        set +e
        OPENCLAW_E2E_VERBOSE=1 OPENCLAW_E2E_WORKERS=1 pnpm test:e2e:gateway extensions/qa-lab/src/gateway-kill-restart-send.e2e.test.ts 2>&1 | tee "$proof/hardkill.log"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf 'canonical_e2e_exit=%s
        log_exit=%s
        ' "${statuses[0]}" "${statuses[1]}" > "$proof/hardkill-status.txt"
        if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
        exit "${statuses[1]}"
    - name: Preserve frozen source, patches, raw logs and results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: release-114-queue-custody-v2-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .artifacts/
          test-results/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
