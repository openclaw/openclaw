name: Release three-file canonical format repair 11a
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed workflow SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-format-three-11a
  cancel-in-progress: false
env:
  CI: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  CANDIDATE_SHA: 11a0a9680d22977f0570409dbe8016c85a1ec3fd
  SOURCE_TREE: 66430b2810752b2d6e43f6df8849607cf289c53c
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 11a0a9680d22977f0570409dbe8016c85a1ec3fd
        persist-credentials: false
        fetch-depth: 1
    - name: Bind exact source
      shell: bash
      run: 'set -euo pipefail

        test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

        test -z "$(git status --porcelain)"

        mkdir -p .artifacts/format-three

        python3 - <<''ID''

        import json,os

        from pathlib import Path

        Path(''.artifacts/format-three/identity.json'').write_text(json.dumps({k:os.environ[k] for k in [''CANDIDATE_SHA'',''SOURCE_TREE'',''WORKFLOW_SHA'',''GITHUB_RUN_ID'',''GITHUB_RUN_ATTEMPT'']}))

        ID

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - name: Canonical format and check three files only
      shell: bash
      run: 'set -euo pipefail

        timeout --signal=KILL 300s pnpm exec oxfmt -- src/config/sessions/session-entry-list.worker.ts src/config/sessions/session-entry-read-runtime.ts src/gateway/server-startup-post-attach.test.ts

        timeout --signal=KILL 300s pnpm exec oxfmt --check -- src/config/sessions/session-entry-list.worker.ts src/config/sessions/session-entry-read-runtime.ts src/gateway/server-startup-post-attach.test.ts

        git diff --check

        python3 - <<''VERIFY''

        import json,subprocess,hashlib

        from pathlib import Path

        files=["src/config/sessions/session-entry-list.worker.ts","src/config/sessions/session-entry-read-runtime.ts","src/gateway/server-startup-post-attach.test.ts"]

        changed=subprocess.check_output([''git'',''diff'',''--name-only'',''HEAD'',''--'']).decode().splitlines()

        assert set(changed)==set(files), changed

        Path(''.artifacts/format-three/formatted-sha256.json'').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files},indent=2))

        VERIFY

        git diff --binary HEAD -- src/config/sessions/session-entry-list.worker.ts src/config/sessions/session-entry-read-runtime.ts src/gateway/server-startup-post-attach.test.ts > .artifacts/format-three/formatted.patch

        '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: format-three-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/format-three/identity.json

          .artifacts/format-three/formatted-sha256.json

          .artifacts/format-three/formatted.patch'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
