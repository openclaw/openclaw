name: "Original shard diagnostics \u2014 not qualification"
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: original-shard-diagnostics
  cancel-in-progress: false
env:
  CI: 'true'
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENCLAW_VITEST_MAX_WORKERS: '2'
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_E2E_USE_PREBUILT_DIST: ''
      OPENCLAW_CI_TEST_RUNTIME_POLICY: node
      FROZEN_TARGET: 'false'
      RUNNER_ENVIRONMENT: github-hosted
      OPENCLAW_NODE_TEST_CONFIGS_JSON: 'null'
      OPENCLAW_NODE_TEST_ENV_JSON: 'null'
      OPENCLAW_NODE_TEST_INCLUDE_PATTERNS_JSON: 'null'
      OPENCLAW_NODE_TEST_TARGETS_JSON: 'null'
      OPENCLAW_VITEST_SHARD_NAME: ''
      OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: '300000'
      OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: ''
      LANE: transport
      PRIVATE_PROOF: ${{ github.workspace }}/../original-shard-private/transport
      SAFE_PROOF: ${{ github.workspace }}-original-shard-safe/transport
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: a38363bbb0eacaab78485eba79a45affc6338f1d
        persist-credentials: false
        fetch-depth: 1
    - name: Initialize private evidence directories
      shell: bash
      run: 'set -euo pipefail

        umask 077

        mkdir -p "$PRIVATE_PROOF" "$SAFE_PROOF"

        '
    - name: Transport hosted.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/hosted.py.b64"

        '
    - name: Verify hosted.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/hosted.py.b64" > "$PRIVATE_PROOF/hosted.py"

        printf ''%s\n'' ''76b1d69674240e194577af81acafcf49964f9a856b185928d92f7679d19e5b43  ''"$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        '
    - name: Transport containment.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/containment.py.b64"

        '
    - name: Verify containment.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/containment.py.b64" > "$PRIVATE_PROOF/containment.py"

        printf ''%s\n'' ''f8d859f25661719c3dcbf8d3e503e9399b2f6f1526f0128a7da228f1de385c79  ''"$PRIVATE_PROOF/containment.py" | sha256sum --check --strict

        '
    - name: Transport diagnostic_data.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/diagnostic_data.py.b64"

        '
    - name: Verify diagnostic_data.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/diagnostic_data.py.b64" > "$PRIVATE_PROOF/diagnostic_data.py"

        printf ''%s\n'' ''ac4ab0adaef6ed85c03fc4c59b14c47f532e4d8f8dce8a1805d94a50c0c98048  ''"$PRIVATE_PROOF/diagnostic_data.py" | sha256sum --check --strict

        '
    - name: Transport transport_data.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/transport_data.py.b64"

        '
    - name: Verify transport_data.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/transport_data.py.b64" > "$PRIVATE_PROOF/transport_data.py"

        printf ''%s\n'' ''ee89f0a5a416e096b8fc1512e9a78db6373f6cb164ff1be254f5c723e8fee2ca  ''"$PRIVATE_PROOF/transport_data.py" | sha256sum --check --strict

        '
    - name: Transport extract_observations.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/extract_observations.py.b64"

        '
    - name: Verify extract_observations.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/extract_observations.py.b64" > "$PRIVATE_PROOF/extract_observations.py"

        printf ''%s\n'' ''1b80d46d817468fcd12188ef684e33ed1390f0d1172d3a0b1a49edfab496fd4c  ''"$PRIVATE_PROOF/extract_observations.py" | sha256sum --check --strict

        '
    - name: Transport manifest.json 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 2
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 3
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 4
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 5
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 6
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 7
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 8
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 9
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 10
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 11
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 12
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 13
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Verify manifest.json transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/manifest.json.b64" > "$PRIVATE_PROOF/manifest.json"

        printf ''%s\n'' ''790884624f96e5b1c0bfbad3d2a9c6a2003aa2c08e72d5a15c2c42c30a210b8b  ''"$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        '
    - name: Transport groups.json 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/groups.json.b64"

        '
    - name: Transport groups.json 2
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/groups.json.b64"

        '
    - name: Transport groups.json 3
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/groups.json.b64"

        '
    - name: Verify groups.json transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/groups.json.b64" > "$PRIVATE_PROOF/groups.json"

        printf ''%s\n'' ''e5d4220c8b2248318eb8031034674e0bb238bbfc17f544284bf9a10f7fe303ca  ''"$PRIVATE_PROOF/groups.json" | sha256sum --check --strict

        '
    - name: Transport transport-diagnostic.patch 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/transport-diagnostic.patch.b64"

        '
    - name: Verify transport-diagnostic.patch transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/transport-diagnostic.patch.b64" > "$PRIVATE_PROOF/transport-diagnostic.patch"

        printf ''%s\n'' ''fb3d66641c42a87dfe3630b9813241acba88638324a46eafdc996907fefdf76a  ''"$PRIVATE_PROOF/transport-diagnostic.patch" | sha256sum --check --strict

        '
    - name: Bind exact candidate and diagnostic overlay
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        node-version: 24.22.1
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Collect exact transport diagnostic
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/hosted.py" run

        '
    - name: Upload exact safe transport evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: original-shard-transport-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ github.workspace }}-original-shard-safe/transport/identity.json

          ${{ github.workspace }}-original-shard-safe/transport/report.json

          ${{ github.workspace }}-original-shard-safe/transport/tests.json

          ${{ github.workspace }}-original-shard-safe/transport/inner-status.json

          ${{ github.workspace }}-original-shard-safe/transport/transport-observations.json'
        if-no-files-found: error
        retention-days: 14
