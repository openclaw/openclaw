name: "Node boundary original shard diagnostics \u2014 not qualification"
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: node-boundary-hosted-v1
  cancel-in-progress: false
env:
  CI: 'true'
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENCLAW_VITEST_MAX_WORKERS: '2'
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_E2E_USE_PREBUILT_DIST: ''
      OPENCLAW_CI_TEST_RUNTIME_POLICY: node
      FROZEN_TARGET: 'false'
      RUNNER_ENVIRONMENT: github-hosted
      OPENCLAW_NODE_TEST_CONFIGS_JSON: 'null'
      OPENCLAW_NODE_TEST_ENV_JSON: 'null'
      OPENCLAW_NODE_TEST_INCLUDE_PATTERNS_JSON: 'null'
      OPENCLAW_NODE_TEST_TARGETS_JSON: 'null'
      OPENCLAW_VITEST_SHARD_NAME: ''
      OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: '300000'
      OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: ''
      LANE: transport
      PRIVATE_PROOF: ${{ github.workspace }}/../node-boundary-private/transport
      SAFE_PROOF: ${{ github.workspace }}-node-boundary-safe/transport
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 5fed4f0df99d1d1c3e7a9ac8b9848aac6526af29
        persist-credentials: false
        fetch-depth: 1
    - name: Initialize private evidence directories
      shell: bash
      run: 'set -euo pipefail

        umask 077

        mkdir -p "$PRIVATE_PROOF" "$SAFE_PROOF"

        '
    - name: Transport hosted.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/hosted.py.gz.b64"

        '
    - name: Verify hosted.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/hosted.py.gz.b64" | gzip -d > "$PRIVATE_PROOF/hosted.py"

        printf ''%s\n'' ''d3742d0cb34f175b9dbbc240d83be9872ff4147fa9b0edbfee7c27f37bd055d7  ''"$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        '
    - name: Transport containment.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/containment.py.gz.b64"

        '
    - name: Verify containment.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/containment.py.gz.b64" | gzip -d > "$PRIVATE_PROOF/containment.py"

        printf ''%s\n'' ''f8d859f25661719c3dcbf8d3e503e9399b2f6f1526f0128a7da228f1de385c79  ''"$PRIVATE_PROOF/containment.py" | sha256sum --check --strict

        '
    - name: Transport diagnostic_data.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/diagnostic_data.py.gz.b64"

        '
    - name: Verify diagnostic_data.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/diagnostic_data.py.gz.b64" | gzip -d > "$PRIVATE_PROOF/diagnostic_data.py"

        printf ''%s\n'' ''ac4ab0adaef6ed85c03fc4c59b14c47f532e4d8f8dce8a1805d94a50c0c98048  ''"$PRIVATE_PROOF/diagnostic_data.py" | sha256sum --check --strict

        '
    - name: Transport transport_data.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/transport_data.py.gz.b64"

        '
    - name: Verify transport_data.py transport
