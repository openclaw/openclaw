name: Final release ports exact-candidate proof
'on':
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        type: string
        description: Exact frozen candidate SHA; prerequisite diagnostic, not final FRV
permissions:
  contents: read
concurrency:
  group: release-ports-${{ inputs.target_ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  BASE_SHA: 89f5912fbe1d26ad81758d6f07e116b39a4e45f9
  REQUIRED_CHECKS_BASE: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  BEFORE_SHA: f38131f934b45447558cf6f431353a49656198d5
  PREREQUISITE_PARENT: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  CAPACITY_PROOF_SHA: 7af9ee549e45948707162d9d8cfa8c068a084fe6
  PREREQUISITE_PATCH_SHA256: 5d8f8bb9a93331eb4a01ca2aefcf2d655dd0e36821f44353663e62d2751f7dc5
  CANDIDATE_SHA: f5e51d9e464afc9f240c5f18f16f0de0954cf04a
  SOURCE_TREE: 704de441b1c922005ff8431fb86218f6aea41cd5
  PATHS_SHA256: 8b35c727dbdea25568ab11fb98e887f95a2b42c40ce134122d056f34e9866f05
  TRUSTED_P: 68aff7f864148760c3800c95435cc36ddaa91654
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - &id001
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 0
        persist-credentials: false
    - &id002
      name: Bind exact candidate
      shell: bash
      run: 'set -euo pipefail

        test "${{ inputs.target_ref }}" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

        test -z "$(git status --porcelain)"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        mkdir -p .artifacts/final-ci

        git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort > .artifacts/final-ci/source-paths.txt

        echo "$PATHS_SHA256  .artifacts/final-ci/source-paths.txt" | sha256sum -c -

        printf ''C=%s

        Q=%s

        P=%s

        workflow=%s

        run=%s

        attempt=%s

        '' "$CANDIDATE_SHA" "$CANDIDATE_SHA" "$TRUSTED_P" "${{ github.workflow_sha }}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
        > .artifacts/final-ci/identity.txt

        '
    - &id003
      uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - &id004
      uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Required real UI and locale preflight
      run: 'set -euo pipefail

        pnpm ui:build

        node --import ./scripts/tsx.mjs scripts/check-control-ui-performance.mts --json | tee .artifacts/final-ci/ui-performance.json

        node --input-type=module -e ''import fs from "node:fs"; import assert from "node:assert/strict"; const report=JSON.parse(fs.readFileSync(".artifacts/final-ci/ui-performance.json","utf8"));
        assert.deepEqual(report.violations, [], "Blocking UI asset budget violations");''

        pnpm ui:i18n:check

        pnpm native:i18n:check

        pnpm ui:i18n:verify

        pnpm native:i18n:verify

        git diff --exit-code'
    - id: plan
      name: Materialize native changed-check graph plan
      run: 'node --input-type=module <<''NODE''

        import fs from ''node:fs'';

        const paths=fs.readFileSync(''.artifacts/final-ci/source-paths.txt'',''utf8'').trim().split(''\n'');

        const input={changedBaseRef:process.env.BASE_SHA,changedPaths:paths,changedCoreTestPaths:null,typeGraphBoundaryOwner:''changed-check'',runnerProfile:''github'',preserveFullChecks:false,checkMatrix:{include:[{task:''prod-types'',check_name:''production
        types'',runner:''ubuntu-24.04''},{task:''test-types'',check_name:''test types'',runner:''ubuntu-24.04''}]},coreTypeMatrix:{include:[1,2,3,4,5].map(stripe=>({stripe}))},lintCoreMatrix:{include:[]},lintExtensionMatrix:{include:[]}};

        fs.writeFileSync(''.artifacts/final-ci/plan-input.json'',JSON.stringify(input));

        NODE

        OPENCLAW_CI_CHECK_PLAN_INPUT_JSON="$(cat .artifacts/final-ci/plan-input.json)" node scripts/ci-check-plan.mts'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    outputs:
      check_matrix: ${{ steps.plan.outputs.check_matrix }}
      core_type_matrix: ${{ steps.plan.outputs.core_type_matrix }}
  noncompiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - uses: ./.github/actions/setup-ripgrep
    - name: Run all unchanged noncompiler checks
      run: 'set -euo pipefail

        mapfile -t paths < .artifacts/final-ci/source-paths.txt

        pnpm check:changed --base "$BASE_SHA" --head HEAD --delegate-compilers --paths-from-git -- "${paths[@]}" 2>&1 | tee
        .artifacts/final-ci/checks.log'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: noncompiler-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    needs:
    - plan
  compiler-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - uses: ./.github/actions/setup-ripgrep
    - name: Execute both returned graph lists
      env:
        TYPE: ${{ matrix.type_graph_names_json }}
        CORE: ${{ matrix.core_type_graph_names_json }}
        CORE_CONCURRENCY: ${{ matrix.core_type_concurrency }}
        OPENCLAW_CI_STATIC_EVIDENCE: '1'
      run: "set -euo pipefail\nsource scripts/ci-static-step.sh tsgo\nif [ -n \"$CORE\" ] && [ \"$CORE\" != '[]' ]; then\n\
        \ run_static_check node scripts/run-tsgo-core-test-shards.mjs --ci-graphs-json \"$CORE\" --concurrency \"${CORE_CONCURRENCY:-1}\"\
        \nfi\nif [ -n \"$TYPE\" ] && [ \"$TYPE\" != '[]' ]; then\n run_static_check node scripts/run-tsgo-core-test-shards.mjs\
        \ --ci-graphs-json \"$TYPE\"\nfi\nfinish_static_checks"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: graphs-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    needs:
    - plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.check_matrix != '' && toJSON(fromJSON(needs.plan.outputs.check_matrix).include)
      != '[]' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.check_matrix) }}
  compiler-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - uses: ./.github/actions/setup-ripgrep
    - name: Execute native core graph and root stripe
      env:
        TYPE: ${{ matrix.type_graph_names_json }}
        ROOT: ${{ matrix.root_type_stripe }}
        OPENCLAW_CI_STATIC_EVIDENCE: '1'
      run: "set -euo pipefail\nsource scripts/ci-static-step.sh tsgo\nif [ -n \"$TYPE\" ] && [ \"$TYPE\" != '[]' ]; then\n\
        \ run_static_check node scripts/run-tsgo-core-test-shards.mjs --ci-graphs-json \"$TYPE\" --concurrency 2\nfi\nif [\
        \ -n \"$ROOT\" ]; then\n run_static_check env OPENCLAW_LOCAL_CHECK=0 node scripts/run-tsgo-core-test-shards.mjs --root-stripe\
        \ \"$ROOT\"\nfi\nfinish_static_checks"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: core-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    needs:
    - plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.core_type_matrix != '' && toJSON(fromJSON(needs.plan.outputs.core_type_matrix).include)
      != '[]' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.core_type_matrix) }}
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - uses: ./.github/actions/setup-ripgrep
    - name: Canonical test project router
      shell: bash
      run: 'set -euo pipefail

        mapfile -t suites < <(node -e ''for(const p of JSON.parse(process.env.TESTS_JSON)) console.log(p)'')

        node scripts/test-projects.mts "${suites[@]}" -- --reporter=default --reporter=json --outputFile="$GITHUB_WORKSPACE/.artifacts/final-ci/tests.json"
        2>&1 | tee .artifacts/final-ci/tests.log'
    - name: Require executed suite coverage
      shell: bash
      run: "node --input-type=module <<'NODE'\nimport fs from 'node:fs'; import assert from 'node:assert/strict';\nconst selected=JSON.parse(process.env.TESTS_JSON);\n\
        const report=JSON.parse(fs.readFileSync('.artifacts/final-ci/tests.json','utf8'));\nassert.equal(report.numFailedTests,0);\
        \ assert.equal(report.numFailedTestSuites,0);\nfor (const path of selected) {\n const matches=report.testResults.filter(x=>x.name.replaceAll('\\\
        \\','/').endsWith('/'+path));\n assert.equal(matches.length,1,'Missing/duplicate suite '+path);\n assert(matches[0].assertionResults.some(x=>x.status==='passed'),'No\
        \ executed case '+path);\n assert(matches[0].assertionResults.every(x=>['passed','pending','skipped','todo','disabled'].includes(x.status)),'Failed\
        \ case '+path);\n}\nfor (const path of ['src/agents/code-mode.catalog-lifetime.test.ts','src/gateway/server.delegated-administration.product.test.ts','test/system-agent-delegation-authority.e2e.test.ts','ui/src/e2e/session-management.trailing-state.e2e.test.ts'])\
        \ {\n if (!selected.includes(path)) continue;\n const suite=report.testResults.find(x=>x.name.replaceAll('\\\\','/').endsWith('/'+path));\n\
        \ assert(suite && suite.assertionResults.length>0 && suite.assertionResults.every(x=>x.status==='passed'),'Critical\
        \ cases must all pass '+path);\n}\nif (process.env.REQUIRE_STRESS==='1') {\n const suite=report.testResults.find(x=>x.name.endsWith('/packages/memory-host-sdk/src/host/session-files-large-export.test.ts'));\n\
        \ assert(suite && suite.assertionResults.length>0 && suite.assertionResults.every(x=>x.status==='passed'),'Stress\
        \ must execute, never skip');\n}\nif (process.platform==='win32') {\n const suite=report.testResults.find(x=>x.name.replaceAll('\\\
        \\','/').endsWith('/src/infra/update-retained-runtime-imports.process.test.ts'));\n for (const runtime of ['node-short-path','node-junction'])\
        \ assert(suite?.assertionResults.some(x=>x.title.includes(runtime)&&x.status==='passed'),'Missing real '+runtime+'\
        \ pass');\n}\nNODE"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: tests-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    needs:
    - plan
    strategy:
      fail-fast: false
      matrix:
        include:
        - lane: capacity-27
          tests_json: '["src/agents/cli-runner.before-agent-reply-cron.test.ts","src/agents/cli-runner.reliability.test.ts","src/agents/code-mode-shell-source.test.ts","src/agents/code-mode.agent-loop.test.ts","src/agents/code-mode.bridge.test.ts","src/agents/code-mode.catalog-index.test.ts","src/agents/code-mode.catalog-lifetime.test.ts","src/agents/code-mode.failure-phase.test.ts","src/agents/code-mode.wait.test.ts","src/agents/embedded-agent-runner/run/attempt-before-agent-run.test.ts","src/agents/embedded-agent-runner/run/attempt-prompt-phase.test.ts","src/agents/tools/gateway-caller-context.test.ts","src/agents/tools/openclaw-delegate-tool.exec-preparation.test.ts","src/agents/tools/openclaw-delegate-tool.test.ts","src/commands/doctor-session-title-repair.test.ts","src/config/runtime-snapshot.test.ts","src/config/zod-schema.agents.test.ts","src/gateway/dashboard-session-title.test.ts","src/gateway/server-methods/system-agent-approval-authority.test.ts","src/gateway/server-methods/system-agent-approval.test.ts","src/gateway/server-methods/system-agent.host-lifecycle.test.ts","src/gateway/server.delegated-administration.product.test.ts","src/gateway/session-utils.permissions.test.ts","src/gateway/tool-resolution.exclude.test.ts","src/gateway/worker-environments/worker-turn-execution.test.ts","test/system-agent-delegation-authority.e2e.test.ts","ui/src/e2e/session-management.trailing-state.e2e.test.ts"]'
        - lane: initial-policy-skills
          tests_json: '["extensions/agentsapi/agentsapi-harness.persistence.test.ts","extensions/agentsapi/agentsapi-harness.startup.test.ts","extensions/anthropic/cli-auth-seam.test.ts","extensions/irc/src/monitor.test.ts","extensions/openshell/src/backend.e2e.test.ts","extensions/openshell/src/backend.exec-workdir.test.ts","extensions/openshell/src/mirror.test.ts","packages/agent-core/src/harness/compaction/compaction-request-scope.test.ts","packages/agent-core/src/harness/compaction/compaction.test.ts","packages/ai/src/providers/clean-for-gemini.test.ts","src/agents/agent-hooks/compaction-safeguard.test.ts","src/agents/conversation-capability-profile.test.ts","src/agents/embedded-agent-runner/run/llm-idle-timeout.test.ts","src/agents/subagents/announce/subagent-announce.format.e2e.test.ts","src/agents/subagents/registry/subagent-announcement-delivery.worker.test.ts","src/agents/subagents/registry/subagent-registry-read.prepared.test.ts","src/agents/subagents/registry/subagent-registry.completion-authority.test.ts","src/agents/tool-search-runtime.test.ts","src/agents/workspace-state-dirs.test.ts","src/auto-reply/reply/session-event-config-readmission.test.ts","src/auto-reply/tool-meta.test.ts","src/cli/update-cli/update-command-original-service.test.ts","src/commands/doctor-maintenance.agent-schema.test.ts","src/commands/doctor-maintenance.settlement.test.ts","src/commands/doctor-original-capture-admission.test.ts","src/commands/doctor-session-entry-state.test.ts","src/flows/doctor-health-startup.test.ts","src/flows/doctor-health.managed-approvals.test.ts","src/gateway/agent-turn/agent-session-persist.rollover.test.ts","src/gateway/server-startup-workspace-readiness.test.ts","src/gateway/tool-resolution.cron-capture.test.ts","src/gateway/tool-resolution.swarm-collector.test.ts","src/gateway/tool-resolution.terminal.test.ts","src/gateway/tool-resolution.test.ts","src/infra/database-engine/port-command.integration.test.ts","src/infra/exec-approvals-authorization.wor