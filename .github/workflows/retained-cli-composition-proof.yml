name: Release 7420 cron fixture recovery
'on':
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        type: string
        description: Exact frozen candidate SHA; prerequisite diagnostic, not final FRV
permissions:
  contents: read
concurrency:
  group: release-7420-cron-fixture-recovery
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  BASE_SHA: 89f5912fbe1d26ad81758d6f07e116b39a4e45f9
  REQUIRED_CHECKS_BASE: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  BEFORE_SHA: f38131f934b45447558cf6f431353a49656198d5
  PREREQUISITE_PARENT: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  CAPACITY_PROOF_SHA: 7af9ee549e45948707162d9d8cfa8c068a084fe6
  PREREQUISITE_PATCH_SHA256: 5d8f8bb9a93331eb4a01ca2aefcf2d655dd0e36821f44353663e62d2751f7dc5
  CANDIDATE_SHA: 7420e1f380799b5239b5e4df6d83f9f6c3a3c196
  SOURCE_TREE: 9140361d86556cc42db5f3cdcd17a8d0057ee253
  PATHS_SHA256: 96842e1bf3c8f61606eca9e4266211a9317d6a0be12655d928f1fd654badd5e9
  TRUSTED_P: 68aff7f864148760c3800c95435cc36ddaa91654
jobs:
  cron-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VARIANT: after
      OPENCLAW_SKIP_CRON: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 0
        persist-credentials: false
    - name: Bind exact candidate
      shell: bash
      run: 'set -euo pipefail

        test "${{ inputs.target_ref }}" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

        test -z "$(git status --porcelain)"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        mkdir -p .artifacts/final-ci

        git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort > .artifacts/final-ci/source-paths.txt

        echo "$PATHS_SHA256  .artifacts/final-ci/source-paths.txt" | sha256sum -c -

        printf ''C=%s

        Q=%s

        P=%s

        workflow=%s

        run=%s

        attempt=%s

        '' "$CANDIDATE_SHA" "$CANDIDATE_SHA" "$TRUSTED_P" "${{ github.workflow_sha }}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
        > .artifacts/final-ci/identity.txt

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Prove explicit cron fixtures with inherited skip enabled
      shell: bash
      run: 'set -euo pipefail

        mkdir -p .artifacts/final-ci/formatted

        echo "871979fefdd72ef8c0cfb29e076887bfc13fb16cc00ead9b3065344d592afa0f  src/gateway/server-cron-lazy.test.ts" | sha256sum
        -c -

        printf %s 
        | base64 --decode > src/gateway/server-cron-lazy.test.ts

        echo "6f02a9f15361ba10f6bdbb030d39266cf757274a69bf93105ff28a24454608fc  src/gateway/server-cron-lazy.test.ts" | sha256sum
        -c -

        echo "571f941714df4fa5dca5b77d14629c38eac86f72d7c059d316213e562109f64b  src/gateway/server-cron.drain.test.ts" | sha256sum
        -c -

        printf %s 
        | base64 --decode > src/gateway/server-cron.drain.test.ts

        echo "cbb24f7592c1502f586d3602594ba3382dc5c6c45f0cddc03d17d0dc1b896aee  src/gateway/server-cron.drain.test.ts" | sha256sum
        -c -

        sha256sum src/gateway/server-cron-lazy.test.ts src/gateway/server-cron.drain.test.ts > .artifacts/final-ci/overlay-sha256.txt

        pnpm exec oxfmt -- src/gateway/server-cron-lazy.test.ts src/gateway/server-cron.drain.test.ts

        pnpm exec oxfmt --check -- src/gateway/server-cron-lazy.test.ts src/gateway/server-cron.drain.test.ts

        sha256sum src/gateway/server-cron-lazy.test.ts src/gateway/server-cron.drain.test.ts > .artifacts/final-ci/formatted-sha256.txt

        cp src/gateway/server-cron-lazy.test.ts .artifacts/final-ci/formatted/

        cp src/gateway/server-cron.drain.test.ts .artifacts/final-ci/formatted/

        node scripts/run-vitest.mjs src/gateway/server-cron-lazy.test.ts src/gateway/server-cron.drain.test.ts --maxWorkers=1
        2>&1 | tee .artifacts/final-ci/tests.log

        node scripts/run-oxlint.mjs --type-aware --deny-warnings --tsconfig config/tsconfig/oxlint.core.json src/gateway/server-cron-lazy.test.ts
        src/gateway/server-cron.drain.test.ts 2>&1 | tee .artifacts/final-ci/lint.log

        '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: cron-fixture-recovery-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
