name: Native activity diagnostic 5eb2 (not qualification)
on:
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed publication commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-activity-diagnostic-5eb2
  cancel-in-progress: false
env:
  CI: "true"
  NODE_VERSION: "24.22.1"
  TARGET_SHA: 5eb2d8052ddc363245bea3ca4ec0833815ab6e93
  TARGET_TREE: 89729107e8146fe5b5f3a14fe53bc50338c4346a
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
jobs:
  native-activity:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      PROOF: ${{ runner.temp }}/native-activity-5eb2
    defaults:
      run:
        shell: bash
    steps:
      - name: Require hosted immutable workflow identity
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" == "$EXPECTED_WORKFLOW_SHA" && "$GITHUB_SHA" == "$WORKFLOW_SHA" ]]
          umask 077
          mkdir -p "$PROOF"
          printf 'target=%s\ntree=%s\nworkflow=%s\nrun=%s\nattempt=%s\n' "$TARGET_SHA" "$TARGET_TREE" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$PROOF/identity.txt"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: 5eb2d8052ddc363245bea3ca4ec0833815ab6e93
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source and select frozen Xcode owner
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse HEAD^{tree})" == "$TARGET_TREE" ]]
          git diff --exit-code HEAD
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain
          xcodebuild -version | grep -E '^Xcode 27([. ]|$)'
          [[ "$(sysctl -n hw.logicalcpu)" -ge 2 ]]
          sysctl -n hw.logicalcpu hw.memsize > "$PROOF/resources.txt"
      - name: Setup Node and pnpm from candidate
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.22.1"
          cache-mode: "off"
          install-bun: "false"
          install-deps: "false"
      - name: Native asset dependencies (frozen CI command)
        run: |
          set -euo pipefail
          [[ "$(node -p process.versions.node)" == 24.22.1 ]]
          pnpm install --frozen-lockfile --prefer-offline --optional             --filter '@openclaw/mermaid-renderer...'             --filter '@openclaw/gateway-protocol...'             --config.ignore-scripts=false --config.engine-strict=false             --config.enable-pre-post-scripts=true --config.side-effects-cache=true
          node scripts/prepare-apple-mermaid.mjs
      - name: Compile coverage-enabled debug tests (frozen CI flags)
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          run_apple_command_logged "$PROOF/build.log" swift build             --package-path apps/macos --build-system native --enable-code-coverage             --disable-index-store -Xswiftc -gline-tables-only --build-tests > "$PROOF/build-console.log" 2>&1
      - name: Selected suites together through native owner
        id: native
        timeout-minutes: 10
        run: |
          set -euo pipefail
          date -u '+%Y-%m-%d %H:%M:%S' > "$PROOF/test-start.txt"
          source scripts/lib/swift-toolchain.sh
          code=0
          run_apple_command_logged "$PROOF/tests.log" node scripts/test-macos-native.mts default             --package-path apps/macos --build-system native --enable-code-coverage             --disable-index-store -Xswiftc -gline-tables-only --skip-build             --experimental-maximum-parallelization-width 2             --filter 'WorkActivityStoreTests|DashboardSameEndpointHTTPRecoveryTests' > "$PROOF/tests-console.log" 2>&1 || code=$?
          date -u '+%Y-%m-%d %H:%M:%S' > "$PROOF/test-end.txt"
          printf '%s\n' "$code" > "$PROOF/test-exit.txt"
          exit "$code"
      - name: Bounded passive OSLog capture
        if: ${{ always() && steps.native.outcome != 'skipped' }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # Same log show / subsystem / category contract as scripts/clawlog.sh.
          # Raw descriptors stay on this disposable runner until bounded export below.
          python3 - "$PROOF" <<'PY'
          import datetime, json, pathlib, re, subprocess, sys
          p = pathlib.Path(sys.argv[1])
          predicate = 'subsystem == "ai.openclaw" AND (category == "gateway" OR category == "control")'
          cmd = ['sudo', '-n', '/usr/bin/log', 'show', '--style', 'ndjson', '--timezone', 'UTC', '--debug', '--info', '--last', '10m', '--predicate', predicate]
          with (p/'oslog.raw').open('wb') as out, (p/'oslog.stderr').open('wb') as err:
              try:
                  result = subprocess.run(cmd, stdout=out, stderr=err, timeout=60)
                  code = result.returncode
              except subprocess.TimeoutExpired:
                  code = 124
          start = (p/'test-start.txt').read_text().strip() if (p/'test-start.txt').exists() else None
          end = (p/'test-end.txt').read_text().strip() if (p/'test-end.txt').exists() else None
          def valid_bound(value):
              if not isinstance(value, str) or not re.fullmatch(r'[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}', value): return False
              try: datetime.datetime.strptime(value, '%Y-%m-%d %H:%M:%S')
              except ValueError: return False
              return True
          bounds_valid = valid_bound(start) and valid_bound(end) and start <= end
          rows = []; overflow = False; invalid = 0
          with (p/'oslog.raw').open('rb') as raw:
              for line in raw:
                  if len(line) > 65536:
                      overflow = True; continue
                  try: row = json.loads(line)
                  except ValueError:
                      invalid += 1; continue
                  if not isinstance(row, dict) or row.get('subsystem') != 'ai.openclaw' or row.get('category') not in ['gateway', 'control'] or not isinstance(row.get('eventMessage'), str):
                      invalid += 1; continue
                  timestamp = row.get('timestamp')
                  if not isinstance(timestamp, str) or not re.fullmatch(r'[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}(?:[.][0-9]{1,6})?(?:Z|[+]0000|[+]00:00)?', timestamp) or not valid_bound(timestamp[:19]):
                      invalid += 1; continue
                  stamp = timestamp[:19]
                  if not bounds_valid or stamp < start or stamp > end: continue
                  message = row['eventMessage'].lower()
                  # Publish fixed categories/counts only; never log content or identities.
                  kind = 'tick-missed' if 'tick missed' in message else 'reconnect' if 'reconnect' in message else 'other'
                  if len(rows) < 4096: rows.append({'timestamp': stamp, 'category': row['category'], 'kind': kind})
                  else: overflow = True
          (p/'oslog-summary.json').write_text(json.dumps({'exit':code,'start':start,'end':end,'overflow':overflow,'invalidLines':invalid,'rows':rows,'boundsValid':bounds_valid,'complete':code==0 and bounds_valid and invalid==0 and not overflow},indent=2))
          PY
      - name: Export bounded evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p "$PROOF/export"
          python3 - "$PROOF" <<'PY'
          import pathlib, re, sys
          p=pathlib.Path(sys.argv[1]); out=p/'export'
          for name in ['identity.txt','resources.txt','test-start.txt','test-end.txt','test-exit.txt','oslog-summary.json','build.log','tests.log','build-console.log','tests-console.log']:
              source=p/name
              if not source.exists(): continue
              data=source.read_bytes()
              if len(data)>16*1024*1024:
                  (out/(name+'.overflow')).write_text('Capture exceeds 16 MiB; incomplete evidence, not green.')
                  data=data[-16*1024*1024:]
              text=data.decode('utf-8','replace')
              text=re.sub(r'(?i)(bearer\s+)[^\s]+',r'\1<redacted>',text)
              text=re.sub(r'(?i)((?:token|password|secret)["\s:=]+)[^\s,"}]+',r'\1<redacted>',text)
              (out/name).write_text(text)
          PY
      - name: Upload diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-activity-5eb2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-activity-5eb2/export/
          if-no-files-found: error
          retention-days: 7
