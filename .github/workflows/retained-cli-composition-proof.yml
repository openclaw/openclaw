name: Release 11.4 UI attachment diagnostics
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-114-ui-diagnostics-7957bf32
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  connection-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact C only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7957bf3258707ba5d5860393990a67aa53ef2f91
          fetch-depth: 1
          persist-credentials: false
      - name: Bind exact C and frozen test-only patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7957bf3258707ba5d5860393990a67aa53ef2f91
          test "$(git rev-parse HEAD^{tree})" = 33c1d06b7b1bc65e9a538a6acf21cd2510f42208
          test -z "$(git status --porcelain)"
          proof="$RUNNER_TEMP/ui-attachment-private"
          mkdir -m 700 "$proof"
          base64 --decode > "$proof/payload.tar.gz" <<'FROZEN'
          
          FROZEN
          printf '%s  %s\n' 'd563c6c81860ade05278c61ab4740fff442e533d8dc5d77e87c93266e4d2ea1f' "$proof/payload.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$proof/payload.tar.gz" --directory "$proof" --no-same-owner --no-same-permissions regression.patch manifest.json run.py
          python3 "$proof/run.py" prepare
      - name: Setup exact-C Node and dependencies
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: 'true'
          install-bun: 'false'
          cache-mode: restore
      - name: Setup canonical test Bun
        id: bun
        uses: ./.github/actions/setup-test-bun
      - name: Attached exported entry (supported path)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.bun.outcome == 'success' }}
        shell: bash
        run: python3 "$RUNNER_TEMP/ui-attachment-private/run.py" attached
      - name: Held-detached tree (diagnostic only, not routed proof)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.bun.outcome == 'success' }}
        shell: bash
        run: python3 "$RUNNER_TEMP/ui-attachment-private/run.py" detached
      - name: Complete connection-page file (26 expected cases)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.bun.outcome == 'success' }}
        shell: bash
        run: python3 "$RUNNER_TEMP/ui-attachment-private/run.py" complete
      - name: Require all three recorded outcomes, no expected-failure mask
        if: ${{ always() }}
        shell: bash
        run: python3 "$RUNNER_TEMP/ui-attachment-private/run.py" finalize
      - name: Upload strict allowlisted diagnostic summary only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-attachment-exactC-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/ui-attachment-public/identity.json
            .artifacts/ui-attachment-public/manifest.json
            .artifacts/ui-attachment-public/regression.patch
            .artifacts/ui-attachment-public/attached.json
            .artifacts/ui-attachment-public/detached.json
            .artifacts/ui-attachment-public/complete.json
            .artifacts/ui-attachment-public/summary.json
            .artifacts/ui-attachment-public/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
