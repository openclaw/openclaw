name: Artifact consumer capsule rootDir v5 11a
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed workflow SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: artifact-consumer-static-v5-11a
  cancel-in-progress: false
env:
  CI: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 11a0a9680d22977f0570409dbe8016c85a1ec3fd
        persist-credentials: false
        fetch-depth: 1
    - name: Initialize reviewed static capsule
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$PRIVATE_PROOF"

        : > "$PRIVATE_PROOF/static.py.b64"

        : > "$PRIVATE_PROOF/manifest.json.b64"

        : > "$PRIVATE_PROOF/static-manifest.json.b64"

        : > "$PRIVATE_PROOF/formatted.patch.b64"

        : > "$PRIVATE_PROOF/semantic-result.json.b64"

        : > "$PRIVATE_PROOF/tsconfig.scripts.json.b64"

        : > "$PRIVATE_PROOF/tsconfig.scripts.corrected.json.b64"

        '
    - name: Transport static.py chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/static.py.b64"

        '
    - name: Transport manifest.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport static-manifest.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/static-manifest.json.b64"

        '
    - name: Transport formatted.patch chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/formatted.patch.b64"

        '
    - name: Transport semantic-result.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/semantic-result.json.b64"

        '
    - name: Transport tsconfig.scripts.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s H4sIAAAAAAAC/21OOw7CMAzde4oqc5vu7MwcADGE1AFXTlLFKapU9e44DYIFyYP9Pn5va9pWwZohjKxOrdJ6kMlsY3D40GwTzpn1xDGormht9DMSpMucMYbi2QQWIsSzxyx3Tgt0FcNgE3gI2ZAQzhCDEPvxyMmXYr9WaQ3+5A1uIeoTEBiG3qSMzlip4SdW3T894X0QRWn0lctin/iCwyWm2xErlWgZoQRXANYf0OzNG+ONsRgRAQAA >> "$PRIVATE_PROOF/tsconfig.scripts.json.b64"

        '
    - name: Transport tsconfig.scripts.corrected.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s H4sIAAAAAAAC/21OOw7CMAzde4oqcz87M8wcADGE1AGjfKrYRZWq3h2ngbIgebDfx+8tVV0rmBnCQOpQq67rZZhMDBbvHZmEI1P3pBhUk7Um+hEdpPPIGEP2LAILEeLJI8vNaYKmYBhMAg+BtRPCakdfJsXIR0x7pBJ43QKsfM9vL0VYCn169HZyrk3gQBO0OjFabaSef5Jq/ukd3npR5Ka7XBbzwBdsLjFdt1ip6qYBcnABYP4B1Vq9AVU4/MMpAQAA >> "$PRIVATE_PROOF/tsconfig.scripts.corrected.json.b64"

        '
    - name: Verify static capsule and exact source
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/static.py.b64" | gzip -d > "$PRIVATE_PROOF/static.py"

        echo 404185c7ec136cab183b9ed2a812c98ff54f29f4d4a174d37e411027ff573a38  "$PRIVATE_PROOF/static.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/manifest.json.b64" | gzip -d > "$PRIVATE_PROOF/manifest.json"

        echo 6f88858308648295022c53c9c0f6aaacc116a088d841c7398f10ac8f7cf1c679  "$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/static-manifest.json.b64" | gzip -d > "$PRIVATE_PROOF/static-manifest.json"

        echo 69af4108bfa075d2160017eac817388951d0ddde5c10e98b0af68228d5ea0039  "$PRIVATE_PROOF/static-manifest.json" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/formatted.patch.b64" | gzip -d > "$PRIVATE_PROOF/formatted.patch"

        echo 21e0150b949b74d39fd766aaa46398360f5b19bd7ad594fbb6bed09515105f41  "$PRIVATE_PROOF/formatted.patch" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/semantic-result.json.b64" | gzip -d > "$PRIVATE_PROOF/semantic-result.json"

        echo c3b4485a8fec90204f8190677560896d2b2fda5d5142be7a6c63c10717e7337b  "$PRIVATE_PROOF/semantic-result.json" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/tsconfig.scripts.json.b64" | gzip -d > "$PRIVATE_PROOF/tsconfig.scripts.json"

        echo 1d1ce6d0e9076c740a9b9e5f223e3f4636fc3a67530667921832713b97d16896  "$PRIVATE_PROOF/tsconfig.scripts.json" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/tsconfig.scripts.corrected.json.b64" | gzip -d > "$PRIVATE_PROOF/tsconfig.scripts.corrected.json"

        echo 4f70b8b950a3619cffa897f8c1ade6d4395ec7d170b12bac0e4d5424d1f9a752  "$PRIVATE_PROOF/tsconfig.scripts.corrected.json" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/static.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'true'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - name: Check corrected focused script configuration
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/static.py" run

        '
    - name: Retain terminal status
      if: always()
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/static.py" finalize

        '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: artifact-consumer-static-v5-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/artifact-consumer-safe/identity.json

          .artifacts/artifact-consumer-safe/report.json

          .artifacts/artifact-consumer-safe/prior-proof.json

          .artifacts/artifact-consumer-safe/prior-static-proof.json

          .artifacts/artifact-consumer-safe/formatted-hashes.json

          .artifacts/artifact-consumer-safe/formatted.patch

          .artifacts/artifact-consumer-safe/retention.json

          .artifacts/artifact-consumer-safe/semantic-summary.json

          .artifacts/artifact-consumer-safe/tsconfig.scripts.json

          .artifacts/artifact-consumer-safe/tsconfig.scripts.corrected.json

          .artifacts/artifact-consumer-safe/types-scripts-corrected-diagnostics.json'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
      if: always()
    env:
      PRIVATE_PROOF: ${{ github.workspace }}/.artifacts/artifact-consumer-private
      SAFE_PROOF: .artifacts/artifact-consumer-safe
