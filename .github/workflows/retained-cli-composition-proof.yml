name: Required Backports Desktop Touch Proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-backports-desktop-ui-258908e6b943c0197bca8d0306dbbbbf503bcb22
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  desktop-touch:
    if: github.repository == 'openclaw/openclaw'
    name: Desktop touch (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: before
            sha: 89f5912fbe1d26ad81758d6f07e116b39a4e45f9
            test_sha: 702e3ffb297c3e620051d90b838f72cd030853565ccdb34d0b6bb8e96f70bfdf
            css_sha: 6cfd21b495b4df7e46da69e934e5b09c2ed6eb9be0b330dbc2d1d6ebc06ab13b
          - label: after
            sha: 258908e6b943c0197bca8d0306dbbbbf503bcb22
            test_sha: 372d6866f407b1dcd8c916b4545a785f8636d4f00b8f838b49a7aa9a19bf637e
            css_sha: 73d55a0019288b29c5a13b25ca0b55730f6c84289747ce357ed4388619b35e9e
    steps:
      - name: Checkout exact source, separate from workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and install identical evidence overlay
        id: prepare
        env:
          SOURCE_SHA: ${{ matrix.sha }}
          LABEL: ${{ matrix.label }}
          EXPECTED_TEST_SHA: ${{ matrix.test_sha }}
          EXPECTED_CSS_SHA: ${{ matrix.css_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          OVERLAY_B64: 
          PAYLOAD_B64: 
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          printf '%s' "$OVERLAY_B64" | base64 --decode > "$RUNNER_TEMP/ui-evidence.patch"
          printf '%s' "$PAYLOAD_B64" | base64 --decode > "$RUNNER_TEMP/ui-evidence-payload.sh"
          printf '%s  %s\n' \
            7ff60c081bc5f375a29f24d75e5141d13b1eff0df66977d6a468a82a378926ae "$RUNNER_TEMP/ui-evidence.patch" \
            9bf0e5a3de77b78d77d0602a273534b5c462f0abc133a2f3ed7fb0c8c13b816f "$RUNNER_TEMP/ui-evidence-payload.sh" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/ui-evidence.patch"
          git apply "$RUNNER_TEMP/ui-evidence.patch"
          [[ "$(git diff --name-only)" == ui/src/e2e/session-management.trailing-state.e2e.test.ts ]]
          git diff --check
          printf '%s  %s\n' \
            "$EXPECTED_TEST_SHA" ui/src/e2e/session-management.trailing-state.e2e.test.ts \
            "$EXPECTED_CSS_SHA" ui/src/styles/layout.css | sha256sum --check --strict
          mkdir -p .artifacts/ui-touch-proof
          printf 'label=%s\nsource=%s\nworkflow=%s\nrun=%s\nattempt=%s\n' \
            "$LABEL" "$SOURCE_SHA" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > .artifacts/ui-touch-proof/workflow-identity.txt
          sha256sum "$RUNNER_TEMP/ui-evidence.patch" "$RUNNER_TEMP/ui-evidence-payload.sh" \
            > .artifacts/ui-touch-proof/tooling-hashes.txt

      - name: Setup canonical Node environment
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "false"

      - name: Capture and test original desktop touch navigation
        id: proof
        env:
          LABEL: ${{ matrix.label }}
          SOURCE_SHA: ${{ matrix.sha }}
          EXPECTED_TEST_SHA: ${{ matrix.test_sha }}
          EXPECTED_CSS_SHA: ${{ matrix.css_sha }}
        run: |
          bash "$RUNNER_TEMP/ui-evidence-payload.sh" \
            "$LABEL" "$SOURCE_SHA" "$EXPECTED_TEST_SHA" "$EXPECTED_CSS_SHA"

      - name: Record outcomes without converting a failed proof to success
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set -euo pipefail
          out=.artifacts/ui-touch-proof
          printf 'setup=%s\nproof=%s\n' "$SETUP_OUTCOME" "$PROOF_OUTCOME" > "$out/step-outcomes.txt"
          (cd "$out" && find . -type f ! -name SHA256SUMS.workflow -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.workflow)

      - name: Upload actual screenshots and diagnostics even on base failure
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: required-backports-desktop-ui-${{ matrix.label }}-${{ matrix.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ui-touch-proof/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
