name: Managed startup allocation diagnostic (NOT qualification)
run-name: Allocation diagnostic a233af0b84e0 run ${{ github.run_id }}
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: managed-allocation-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE: a233af0b84e093845c62e88c2702cbd9b297f22c
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout reviewed diagnostic transport, not candidate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/diagnostics/managed-startup
      - name: Node 24.22.1 exactly
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Checkout pinned trusted package consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 68aff7f864148760c3800c95435cc36ddaa91654
          path: .package-consumer
          persist-credentials: false
          sparse-checkout: scripts
      - name: Verify and download immutable prepared bundle
        id: prepared_bundle
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_BUNDLE_JSON: '{"schema":"openclaw.prepared-npm-bundle/v1","source":{"sha":"a233af0b84e093845c62e88c2702cbd9b297f22c"},"artifact":{"id":"13990795798","name":"openclaw-npm-package-43315959396-1","digest":"39193ed65816266e2ea409508ff529dc618197a88983278f763de67b790c3c92","runId":"43315959396","runAttempt":"1"},"producer":{"repository":"openclaw/openclaw","workflowRef":"openclaw/openclaw/.github/workflows/full-release-artifacts.yml@refs/heads/release-ci/a233af0b84e0-15239718717656028761794520507436","workflowSha":"a233af0b84e093845c62e88c2702cbd9b297f22c","runId":"43315959396","runAttempt":"1","jobId":"131524096910","jobName":"Prepare npm artifacts / Prepare publishable npm package","producerWorkflowPath":".github/workflows/openclaw-npm-preflight.yml"},"manifestSha256":"0be06dcf3df3ef78b522f224428f6d2b62920ef39585b9dc48d3164dd3a50499","package":{"name":"openclaw","fileName":"openclaw-2026.11.4.tgz","sha256":"ba6190966e8caa741ea238a6759ccdc45e4db664b404b29f61f2611b5c5e9948","version":"2026.11.4","sourceSha":"a233af0b84e093845c62e88c2702cbd9b297f22c"},"corePackages":[{"packageName":"@openclaw/ai","packageVersion":"2026.11.4","tarballName":"openclaw-ai-2026.11.4.tgz","tarballSha256":"b9271eb9fc9ef8def0606cf6a633d1906f163cc2756f9b1b4b141ef2d7dca89e"},{"packageName":"@openclaw/gateway-protocol","packageVersion":"2026.11.4","tarballName":"openclaw-gateway-protocol-2026.11.4.tgz","tarballSha256":"9041fb6fc0c482c5344a7945f58e6bb076f7b402dae2549a043b0e387d3f61e7"},{"packageName":"@openclaw/gateway-client","packageVersion":"2026.11.4","tarballName":"openclaw-gateway-client-2026.11.4.tgz","tarballSha256":"7849b97c41450df432bf4994ceb0adb704cdbb3a36b48d84ab210d8be8cfa78c"}]}'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C .package-consumer rev-parse HEAD)" == 68aff7f864148760c3800c95435cc36ddaa91654 ]]
          mkdir -p "$RUNNER_TEMP/allocation-input" "$RUNNER_TEMP/allocation-evidence"
          printf '%s\n' "$PREPARED_BUNDLE_JSON" > "$RUNNER_TEMP/allocation-input/descriptor.json"
          node .package-consumer/scripts/npm-prepared-bundle.mjs download \
            --descriptor "$RUNNER_TEMP/allocation-input/descriptor.json" \
            --repository openclaw/openclaw --source-sha "$CANDIDATE" --tooling-sha "$CANDIDATE" \
            --output-dir "$RUNNER_TEMP/allocation-input/bundle" --npm-dist-tag beta
          cp "$RUNNER_TEMP/allocation-input/descriptor.json" "$RUNNER_TEMP/allocation-evidence/descriptor.json"
      - name: Install exact core bundle in credentialless disposable prefix
        env:
          PREPARED_TARBALL: ${{ steps.prepared_bundle.outputs.tarball_path }}
          CORE_TARBALL_DIR: ${{ steps.prepared_bundle.outputs.core_tarball_dir }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(node -p process.version)" == v24.22.1 ]]
          mkdir -p "$RUNNER_TEMP/allocation-install-home" "$RUNNER_TEMP/allocation-install"
          # npm direct file dependencies match the packed-install contract in release-check.ts.
          # All four paths came from the digest/identity-verified canonical bundle consumer.
          env -i HOME="$RUNNER_TEMP/allocation-install-home" PATH="$PATH" \
            npm install --prefix "$RUNNER_TEMP/allocation-install" --omit=dev --no-audit --no-fund \
            "$PREPARED_TARBALL" "$CORE_TARBALL_DIR"/*.tgz
      - name: Capture first five seconds after Kova-compatible readiness
        shell: bash
        run: |
          set -euo pipefail
          # No linger change, user-manager restart or fallback to system scope.
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user show-environment >/dev/null
          sha256sum .github/diagnostics/managed-startup/* > "$RUNNER_TEMP/allocation-evidence/diagnostic-sha256.txt"
          bash .github/diagnostics/managed-startup/run.sh \
            "$RUNNER_TEMP/allocation-install/node_modules/openclaw" "$RUNNER_TEMP/allocation-evidence"
      - name: Upload numeric evidence only, even if incomplete
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: managed-allocation-a233af0b84e0-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/allocation-evidence/
          if-no-files-found: error
          retention-days: 7
