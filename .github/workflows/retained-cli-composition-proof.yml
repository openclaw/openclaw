name: Release 11.4 worker fixture cleanup proof
'on':
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-114-worker-cleanup-7957bf32
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  EXPECTED_TARGET: 7957bf3258707ba5d5860393990a67aa53ef2f91
  EXPECTED_TREE: 33c1d06b7b1bc65e9a538a6acf21cd2510f42208
jobs:
  baseline:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 1
        persist-credentials: false
    - name: Bind exact C, source tree and frozen fixture-only proposal
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target_ref }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
        LANE: baseline
      run: |
        set -euo pipefail
        test "$INPUT_TARGET" = "$EXPECTED_TARGET"
        test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
        test -z "$(git status --porcelain)"
        proof=.artifacts/worker-cleanup-proof
        mkdir -p "$proof"
        printf 'source=%s
        source_tree=%s
        workflow=%s
        run=%s
        attempt=%s
        lane=%s
        ' "$EXPECTED_TARGET" "$EXPECTED_TREE" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$LANE" > "$proof/identity.txt"
        base64 --decode > "$proof/payload.tar.gz" <<'FROZEN_BUNDLE'
        
        FROZEN_BUNDLE
        printf '%s  %s\n' '43b4b2c2b5aad71ead94732716db309bfed6dd670b4a799338c5d29b9b9e3f34' "$proof/payload.tar.gz" | sha256sum --check --strict
        tar --extract --gzip --file "$proof/payload.tar.gz" --directory "$proof" --no-same-owner --no-same-permissions repair.patch bound-paths.txt bound-base.sha256 baseline-effective.sha256 expected-tests.json origin-failure.json reduce.py
        printf '%s  %s\n' 'ffd711a99338ea8012e8340a5c83e8f440df171f8af4791938a60b595cded640' "$proof/repair.patch" | sha256sum --check --strict
        printf '%s  %s\n' '1524111b96bf4e9a8d23e00a4d22ea2a40d3764cb9fdb8c65c4520c3946e3e76' "$proof/bound-paths.txt" | sha256sum --check --strict
        printf '%s  %s\n' '94418a13df750db31ee66772a4207bf071d35bc578b453bfcad572a958533fa7' "$proof/bound-base.sha256" | sha256sum --check --strict
        printf '%s  %s\n' '94418a13df750db31ee66772a4207bf071d35bc578b453bfcad572a958533fa7' "$proof/baseline-effective.sha256" | sha256sum --check --strict
        printf '%s  %s\n' 'd62ce73f7930d970c22b587896f4c787b59763ce340f168a154f86545dfcb5f7' "$proof/expected-tests.json" | sha256sum --check --strict
        printf '%s  %s\n' '04a36cff273919bc87207f43b28fd165083f3c036fb0f4386f3f2bb3ccb6b91f' "$proof/origin-failure.json" | sha256sum --check --strict
        printf '%s  %s\n' 'ac43a76ec115e1592ff6973416a6fd09c87b5148f3fa150bf0da14ab8a509617' "$proof/reduce.py" | sha256sum --check --strict
        sha256sum --check --strict "$proof/bound-base.sha256"
        git ls-tree -r HEAD > "$proof/base-git-tree.txt"
        git archive --format=tar HEAD | gzip -n > "$proof/base-source.tar.gz"
        while IFS= read -r path; do
          mkdir -p "$proof/source/$(dirname "$path")"
          cp "$path" "$proof/source/$path"
        done < "$proof/bound-paths.txt"
        sha256sum --check --strict "$proof/baseline-effective.sha256"
        git diff --name-only | LC_ALL=C sort > "$proof/actual-paths.txt"
        printf '' > "$proof/expected-paths.txt"
        diff -u "$proof/expected-paths.txt" "$proof/actual-paths.txt"
        git diff --check
        git diff --binary --full-index > "$proof/effective.patch"
        while IFS= read -r path; do
          mkdir -p "$proof/effective-source/$(dirname "$path")"
          cp "$path" "$proof/effective-source/$path"
        done < "$proof/bound-paths.txt"
        test ! -d dist
        test ! -d dist-runtime
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: live
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/worker-cleanup-proof
        set +e
        node scripts/run-vitest.mjs src/gateway/worker-environments/live-events-settlement.test.ts --config test/vitest/vitest.gateway-database-workers.config.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile="$GITHUB_WORKSPACE/$proof/live-results.json" 2>&1 | tee "$proof/live.log"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf 'command_exit=%s
        log_exit=%s
        ' "${statuses[0]}" "${statuses[1]}" > "$proof/live-status.txt"
        exit "${statuses[1]}"
    - name: resources
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/worker-cleanup-proof
        set +e
        node scripts/run-vitest.mjs src/state/openclaw-agent-db-resources.test.ts --config test/vitest/vitest.unit.config.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile="$GITHUB_WORKSPACE/$proof/resources-results.json" 2>&1 | tee "$proof/resources.log"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf 'command_exit=%s
        log_exit=%s
        ' "${statuses[0]}" "${statuses[1]}" > "$proof/resources-status.txt"
        exit "${statuses[1]}"
    - name: Require complete original case coverage and classify baseline honestly
      shell: bash
      run: |
        set -euo pipefail
        python3 .artifacts/worker-cleanup-proof/reduce.py
    - name: Digest retained artifacts even on failure
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/worker-cleanup-proof
        if test -d "$proof"; then
          find "$proof" -type f ! -name artifact-digests.sha256 -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum > "$proof/artifact-digests.sha256"
        fi
    - name: Preserve frozen source, patches, raw logs and results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: release-114-worker-cleanup-baseline-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .artifacts/
          test-results/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
  repair:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 1
        persist-credentials: false
    - name: Bind exact C, source tree and frozen fixture-only proposal
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target_ref }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
        LANE: repair
      run: |
        set -euo pipefail
        test "$INPUT_TARGET" = "$EXPECTED_TARGET"
        test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
        test -z "$(git status --porcelain)"
        proof=.artifacts/worker-cleanup-proof
        mkdir -p "$proof"
        printf 'source=%s
        source_tree=%s
        workflow=%s
        run=%s
        attempt=%s
        lane=%s
        ' "$EXPECTED_TARGET" "$EXPECTED_TREE" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$LANE" > "$proof/identity.txt"
        base64 --decode > "$proof/payload.tar.gz" <<'FROZEN_BUNDLE'
        
        FROZEN_BUNDLE
        printf '%s  %s\n' '7077f874e606d2ce051adc4d8ee375c255db8fb5348539b6dd0cc68e9b3c1f33' "$proof/payload.tar.gz" | sha256sum --check --strict
        tar --extract --gzip --file "$proof/payload.tar.gz" --directory "$proof" --no-same-owner --no-same-permissions repair.patch bound-paths.txt bound-base.sha256 repair-effective.sha256 expected-tests.json origin-failure.json reduce.py
        printf '%s  %s\n' 'ffd711a99338ea8012e8340a5c83e8f440df171f8af4791938a60b595cded640' "$proof/repair.patch" | sha256sum --check --strict
        printf '%s  %s\n' '1524111b96bf4e9a8d23e00a4d22ea2a40d3764cb9fdb8c65c4520c3946e3e76' "$proof/bound-paths.txt" | sha256sum --check --strict
        printf '%s  %s\n' '94418a13df750db31ee66772a4207bf071d35bc578b453bfcad572a958533fa7' "$proof/bound-base.sha256" | sha256sum --check --strict
        printf '%s  %s\n' '7566996a9768da17d445af2c027180736e549f503b2443245e0009c6b4d270ef' "$proof/repair-effective.sha256" | sha256sum --check --strict
        printf '%s  %s\n' 'd62ce73f7930d970c22b587896f4c787b59763ce340f168a154f86545dfcb5f7' "$proof/expected-tests.json" | sha256sum --check --strict
        printf '%s  %s\n' '04a36cff273919bc87207f43b28fd165083f3c036fb0f4386f3f2bb3ccb6b91f' "$proof/origin-failure.json" | sha256sum --check --strict
        printf '%s  %s\n' 'ac43a76ec115e1592ff6973416a6fd09c87b5148f3fa150bf0da14ab8a509617' "$proof/reduce.py" | sha256sum --check --strict
        sha256sum --check --strict "$proof/bound-base.sha256"
        git ls-tree -r HEAD > "$proof/base-git-tree.txt"
        git archive --format=tar HEAD | gzip -n > "$proof/base-source.tar.gz"
        while IFS= read -r path; do
          mkdir -p "$proof/source/$(dirname "$path")"
          cp "$path" "$proof/source/$path"
        done < "$proof/bound-paths.txt"
        git apply --check "$proof/repair.patch"
        git apply "$proof/repair.patch"
        sha256sum --check --strict "$proof/repair-effective.sha256"
        git diff --name-only | LC_ALL=C sort > "$proof/actual-paths.txt"
        printf '%s
        ' 'src/gateway/worker-environments/live-events-settlement.test.ts' > "$proof/expected-paths.txt"
        diff -u "$proof/expected-paths.txt" "$proof/actual-paths.txt"
        git diff --check
        git diff --binary --full-index > "$proof/effective.patch"
        while IFS= read -r path; do
          mkdir -p "$proof/effective-source/$(dirname "$path")"
          cp "$path" "$proof/effective-source/$path"
        done < "$proof/bound-paths.txt"
        test ! -d dist
        test ! -d dist-runtime
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: live
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/worker-cleanup-proof
        set +e
        node scripts/run-vitest.mjs src/gateway/worker-environments/live-events-settlement.test.ts --config test/vitest/vitest.gateway-database-workers.config.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile="$GITHUB_WORKSPACE/$proof/live-results.json" 2>&1 | tee "$proof/live.log"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf 'command_exit=%s
        log_exit=%s
        ' "${statuses[0]}" "${statuses[1]}" > "$proof/live-status.txt"
        exit "${statuses[1]}"
    - name: resources
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/worker-cleanup-proof
        set +e
        node scripts/run-vitest.mjs src/state/openclaw-agent-db-resources.test.ts --config test/vitest/vitest.unit.config.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile="$GITHUB_WORKSPACE/$proof/resources-results.json" 2>&1 | tee "$proof/resources.log"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf 'command_exit=%s
        log_exit=%s
        ' "${statuses[0]}" "${statuses[1]}" > "$proof/resources-status.txt"
        exit "${statuses[1]}"
    - name: Require complete original case coverage and classify baseline honestly
      shell: bash
      run: |
        set -euo pipefail
        python3 .artifacts/worker-cleanup-proof/reduce.py
    - name: fixture-format
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/worker-cleanup-proof
        set +e
        pnpm format:check -- src/gateway/worker-environments/live-events-settlement.test.ts 2>&1 | tee "$proof/fixture-format.log"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf 'command_exit=%s
        log_exit=%s
        ' "${statuses[0]}" "${statuses[1]}" > "$proof/fixture-format-status.txt"
        if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
        exit "${statuses[1]}"
    - name: fixture-lint
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/worker-cleanup-proof
        set +e
        node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json src/gateway/worker-environments/live-events-settlement.test.ts 2>&1 | tee "$proof/fixture-lint.log"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf 'command_exit=%s
        log_exit=%s
        ' "${statuses[0]}" "${statuses[1]}" > "$proof/fixture-lint-status.txt"
        if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
        exit "${statuses[1]}"
    - name: affected-typegraph
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/worker-cleanup-proof
        set +e
        env -u OPENCLAW_LOCAL_CHECK node scripts/run-tsgo-core-test-shards.mjs --changed-paths-json '["src/gateway/worker-environments/live-events-settlement.test.ts"]' --concurrency 2 2>&1 | tee "$proof/affected-typegraph.log"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf 'command_exit=%s
        log_exit=%s
        ' "${statuses[0]}" "${statuses[1]}" > "$proof/affected-typegraph-status.txt"
        if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
        exit "${statuses[1]}"
    - name: Digest retained artifacts even on failure
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/worker-cleanup-proof
        if test -d "$proof"; then
          find "$proof" -type f ! -name artifact-digests.sha256 -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum > "$proof/artifact-digests.sha256"
        fi
    - name: Preserve frozen source, patches, raw logs and results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: release-114-worker-cleanup-repair-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .artifacts/
          test-results/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    needs: baseline
