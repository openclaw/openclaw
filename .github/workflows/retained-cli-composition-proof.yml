name: Release locale generated-evidence recovery
'on':
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        type: string
        description: Exact frozen candidate SHA; prerequisite diagnostic, not final FRV
permissions:
  contents: read
concurrency:
  group: release-ports-${{ inputs.target_ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  BASE_SHA: 89f5912fbe1d26ad81758d6f07e116b39a4e45f9
  REQUIRED_CHECKS_BASE: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  BEFORE_SHA: f38131f934b45447558cf6f431353a49656198d5
  PREREQUISITE_PARENT: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  CAPACITY_PROOF_SHA: 7af9ee549e45948707162d9d8cfa8c068a084fe6
  PREREQUISITE_PATCH_SHA256: 5d8f8bb9a93331eb4a01ca2aefcf2d655dd0e36821f44353663e62d2751f7dc5
  CANDIDATE_SHA: db633cbcc3c95a0ce67b5bf12e2fdcc7b0c4d618
  SOURCE_TREE: 51e674cbb705bdd672b3fc619ea6b0fe868a626c
  PATHS_SHA256: 852f8bc68d54b761dd85a9835c9b12bdf3ddd73217e1464e6a94a07798ddbd88
  TRUSTED_P: 68aff7f864148760c3800c95435cc36ddaa91654
jobs:
  locale-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 0
        persist-credentials: false
    - name: Bind exact candidate
      shell: bash
      run: 'set -euo pipefail

        test "${{ inputs.target_ref }}" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

        test -z "$(git status --porcelain)"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        mkdir -p .artifacts/final-ci

        git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort > .artifacts/final-ci/source-paths.txt

        echo "$PATHS_SHA256  .artifacts/final-ci/source-paths.txt" | sha256sum -c -

        printf ''C=%s

        Q=%s

        P=%s

        workflow=%s

        run=%s

        attempt=%s

        '' "$CANDIDATE_SHA" "$CANDIDATE_SHA" "$TRUSTED_P" "${{ github.workflow_sha }}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
        > .artifacts/final-ci/identity.txt

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Record all original locale check results
      run: 'set -uo pipefail

        mkdir -p .artifacts/locale

        set +e

        bash scripts/ci-collect-checks.sh ''pnpm ui:i18n:check'' ''pnpm native:i18n:check'' ''pnpm ui:i18n:verify'' ''pnpm
        native:i18n:verify'' 2>&1 | tee .artifacts/locale/original-checks.log

        status=${PIPESTATUS[0]}

        printf ''%s

        '' "$status" > .artifacts/locale/original-checks-exit.txt

        exit "$status"'
    - name: Generate canonical locale repair evidence without provider credentials
      if: always()
      run: 'set -uo pipefail

        mkdir -p .artifacts/locale

        set +e

        pnpm ui:i18n:sync 2>&1 | tee .artifacts/locale/sync.log

        sync_status=${PIPESTATUS[0]}

        printf ''%s

        '' "$sync_status" > .artifacts/locale/sync-exit.txt

        bash scripts/ci-collect-checks.sh ''pnpm ui:i18n:check'' ''pnpm native:i18n:check'' ''pnpm ui:i18n:verify'' ''pnpm
        native:i18n:verify'' 2>&1 | tee .artifacts/locale/generated-checks.log

        check_status=${PIPESTATUS[0]}

        printf ''%s

        '' "$check_status" > .artifacts/locale/generated-checks-exit.txt

        set -e

        git diff --binary --full-index > .artifacts/locale/generated.patch

        git diff --name-only > .artifacts/locale/changed-paths.txt

        git status --porcelain > .artifacts/locale/status.txt

        git diff --check

        git diff --name-only -z | tar --null -T - -cf .artifacts/locale/generated-files.tar

        find .artifacts -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > .artifacts/SHA256SUMS

        exit "$sync_status"'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: locale-recovery-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
