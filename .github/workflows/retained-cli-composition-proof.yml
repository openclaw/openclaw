        \  } else {\\n      expect(fixture.registryOwner.registry).toBe(fixture.previousRegistry);\\n      expect(fixture.firstStop).not.toHaveBeenCalled();\\\
        n      expect(events).toEqual([\"close:start\"]);\\n      release.resolve();\\n    }\\n    expect(await reloading).toMatchObject({\
        \ runtime: { pluginIds: [\"first\"] } });\\n    if (mode === \"held-close\") {\\n      expect(events.slice(-2)).toEqual([\"\
        close:end\", \"publish\"]);\\n      expect(close).toHaveBeenCalledOnce();\\n    }\\n    expect(getPluginInstance(fixture.previousRegistry.plugins[0]!)?.lifecycle.signal.aborted).toBe(\\\
        n      true,\\n    );\\n    await expect(old.manager.probeEmbeddingAvailability()).rejects.toThrow(\"closed\");\\\
        n    expect(fixture.registryOwner.registry.memoryCapabilities[0]?.capability.runtime).toBe(runtime);\\n    const fresh\
        \ = await runtime.getMemorySearchManager({ cfg: config, agentId: \"main\" });\\n    assert(fresh.manager, fresh.error\
