name: Release sidebar touch geometry causal proof
'on':
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        type: string
        description: Exact frozen candidate SHA; prerequisite diagnostic, not final FRV
permissions:
  contents: read
concurrency:
  group: release-sidebar-touch-${{ inputs.target_ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  BASE_SHA: 89f5912fbe1d26ad81758d6f07e116b39a4e45f9
  REQUIRED_CHECKS_BASE: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  BEFORE_SHA: f38131f934b45447558cf6f431353a49656198d5
  PREREQUISITE_PARENT: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  CAPACITY_PROOF_SHA: 7af9ee549e45948707162d9d8cfa8c068a084fe6
  PREREQUISITE_PATCH_SHA256: 5d8f8bb9a93331eb4a01ca2aefcf2d655dd0e36821f44353663e62d2751f7dc5
  CANDIDATE_SHA: a233af0b84e093845c62e88c2702cbd9b297f22c
  SOURCE_TREE: fefba51180be86548a58cc0438ba340716110bd7
  PATHS_SHA256: 56a1d5118580b0ea7c50e12d42dac3d95dfabcee58ecf5561b6797c92ae0ef93
  TRUSTED_P: 68aff7f864148760c3800c95435cc36ddaa91654
jobs:
  sidebar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant:
        - before
        - after
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 0
        persist-credentials: false
    - name: Bind exact candidate
      shell: bash
      run: 'set -euo pipefail

        test "${{ inputs.target_ref }}" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

        test -z "$(git status --porcelain)"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        mkdir -p .artifacts/final-ci

        git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort > .artifacts/final-ci/source-paths.txt

        echo "$PATHS_SHA256  .artifacts/final-ci/source-paths.txt" | sha256sum -c -

        printf ''C=%s

        Q=%s

        P=%s

        workflow=%s

        run=%s

        attempt=%s

        '' "$CANDIDATE_SHA" "$CANDIDATE_SHA" "$TRUSTED_P" "${{ github.workflow_sha }}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .artifacts/final-ci/identity.txt

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Apply exact sidebar overlay
      run: 'set -euo pipefail

        git diff --exit-code

        if [ "$VARIANT" = after ]; then

        printf ''%s'' '''' | base64 --decode | git
        apply -

        echo ''076b6a9fcd03aa16fa0b6472300cae39864ba0120bb62f984f5578faa7bf86cd  ui/src/styles/sidebar-agent-roster.css'' | sha256sum -c -

        fi

        git diff --binary > .artifacts/final-ci/overlay.patch

        sha256sum ui/src/styles/sidebar-agent-roster.css > .artifacts/final-ci/overlay-sha256.txt'
    - name: Prepare production UI and Chromium
      run: 'pnpm ui:build

        pnpm --dir ui exec playwright install --with-deps chromium

        git diff --binary > .artifacts/final-ci/post-build.patch

        cmp .artifacts/final-ci/overlay.patch .artifacts/final-ci/post-build.patch'
    - name: Exercise four sidebar geometries and retain screenshots
      env:
        OPENCLAW_CAPTURE_UI_PROOF: '1'
        OPENCLAW_UI_E2E_ARTIFACT_DIR: ${{ github.workspace }}/.artifacts/sidebar-visual
      run: 'set -uo pipefail

        set +e

        node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-e2e.config.ts --configLoader runner ui/src/e2e/sidebar-agent-first.e2e.test.ts --reporter=default --reporter=json --outputFile="$GITHUB_WORKSPACE/.artifacts/final-ci/tests.json" 2>&1 | tee .artifacts/final-ci/tests.log

        result=$?

        git diff --binary > .artifacts/final-ci/post-test.patch

        cmp .artifacts/final-ci/overlay.patch .artifacts/final-ci/post-test.patch || exit 1

        set -e

        printf ''%s'' "$result" > .artifacts/final-ci/test-exit.txt

        node --input-type=module <<''NODE''

        import fs from ''node:fs'';import assert from ''node:assert/strict'';

        const r=JSON.parse(fs.readFileSync(''.artifacts/final-ci/tests.json'',''utf8''));const t=r.testResults.flatMap(x=>x.assertionResults).filter(x=>[''passed'',''failed''].includes(x.status));assert.equal(t.length,4); const names=t.map(x=>x.fullName); for(const marker of [''light at 258 px (touch=false)'',''light at 334 px (touch=false)'',''dark at 286 px (touch=false)'',''light at 334 px (touch=true)'']) assert.equal(names.filter(x=>x.includes(marker)).length,1);

        if(process.env.VARIANT===''before''){assert.equal(t.filter(x=>x.status===''failed'').length,1);const failed=t.find(x=>x.status===''failed'');assert.ok(failed.fullName.includes(''touch=true''));const messages=JSON.stringify(failed.failureMessages);assert.ok(messages.includes(''168'') && messages.includes(''260.5'') && messages.includes(''to be close to''));assert.notEqual(fs.readFileSync(''.artifacts/final-ci/test-exit.txt'',''utf8''),''0'');}else{assert.ok(t.every(x=>x.status===''passed''));assert.equal(fs.readFileSync(''.artifacts/final-ci/test-exit.txt'',''utf8''),''0'');}

        NODE

        for name in agent-first-light-258-pointer.png agent-first-light-334-pointer.png agent-first-dark-286-pointer.png agent-first-light-334-touch.png; do find .artifacts/sidebar-visual -name "$name" -type f -size +0c | grep -q . || exit 1; done'
    - name: Targeted static proof
      if: matrix.variant == 'after'
      run: node scripts/check-changed.mjs -- ui/src/styles/sidebar-agent-roster.css
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: sidebar-touch-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
