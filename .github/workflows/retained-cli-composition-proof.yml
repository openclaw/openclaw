name: Main Windows harness-pin adoption proof
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: windows-pin-main-proof
  cancel-in-progress: false
env:
  CI: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: main
  TARGET_SHA: c799490838360928ef4ef56401910f50ef367031
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
  OPENCLAW_VITEST_MAX_WORKERS: '1'
  OPENCLAW_TEST_WORKERS: '1'
  OPENCLAW_TEST_PROJECTS_SERIAL: '1'
  OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: '300000'
  RAYON_NUM_THREADS: '2'
  TOKIO_WORKER_THREADS: '2'
jobs:
  main-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANE: main-pin
      PRIVATE_PROOF: ${{ github.workspace }}/../windows-pin-main-private/main-pin
      SAFE_PROOF: ${{ github.workspace }}-windows-pin-main-safe/main-pin
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: c799490838360928ef4ef56401910f50ef367031
        persist-credentials: false
        fetch-depth: 1
    - name: Initialize private evidence directories
      shell: bash
      run: 'set -euo pipefail

        umask 077

        mkdir -p "$PRIVATE_PROOF" "$SAFE_PROOF"

        '
    - name: Transport hosted.py 1/1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/hosted.py.b64"

        '
    - name: Verify hosted.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/hosted.py.b64" > "$PRIVATE_PROOF/hosted.py"

        printf ''%s\n'' ''c16e9f54b0dea569dd937c5fe8aa46aeca2e219ee067f38cbfecc88c2a52930d  ''"$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        '
    - name: Transport containment.py 1/1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/containment.py.b64"

        '
    - name: Verify containment.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/containment.py.b64" > "$PRIVATE_PROOF/containment.py"

        printf ''%s\n'' ''f8d859f25661719c3dcbf8d3e503e9399b2f6f1526f0128a7da228f1de385c79  ''"$PRIVATE_PROOF/containment.py" | sha256sum --check --strict

        '
    - name: Transport proof_data.py 1/1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/proof_data.py.b64"

        '
    - name: Verify proof_data.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/proof_data.py.b64" > "$PRIVATE_PROOF/proof_data.py"

        printf ''%s\n'' ''3f35a83bddb70ad9032e426cb31d39eba5dcc8ab98ad16b80eaea54675a715a7  ''"$PRIVATE_PROOF/proof_data.py" | sha256sum --check --strict

        '
    - name: Transport native_diagnostics.py 1/1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/native_diagnostics.py.b64"

        '
    - name: Verify native_diagnostics.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/native_diagnostics.py.b64" > "$PRIVATE_PROOF/native_diagnostics.py"

        printf ''%s\n'' ''05aca935a4e30e32ec66dbd23c82a3062fc59dc250fec46d8ce4fcd471c9668a  ''"$PRIVATE_PROOF/native_diagnostics.py" | sha256sum --check --strict

        '
    - name: Transport manifest.json 1/4
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 2/4
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 3/4
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 4/4
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Verify manifest.json transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/manifest.json.b64" > "$PRIVATE_PROOF/manifest.json"

        printf ''%s\n'' ''1b5a7baa2ade6191257a110c8cfb63d64792c5f99c40496f77523ace45372b09  ''"$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        '
    - name: Bind exact candidate tree and workflow
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Run exact main-pin proof
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/hosted.py" run

        '
    - name: Upload exact safe main-pin evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-pin-main-main-pin-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ github.workspace }}-windows-pin-main-safe/main-pin/identity.json

          ${{ github.workspace }}-windows-pin-main-safe/main-pin/report.json

          ${{ github.workspace }}-windows-pin-main-safe/main-pin/tests.json

          ${{ github.workspace }}-windows-pin-main-safe/main-pin/inner-status.json

          ${{ github.workspace }}-windows-pin-main-safe/main-pin/native-diagnostics.json'
        if-no-files-found: error
        retention-days: 14
