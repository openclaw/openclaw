name: Release 11.4 FIFO and hardkill committed-candidate diagnostics
'on':
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-114-fifo-hardkill-73bef956-diagnostics
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  EXPECTED_TARGET: 73bef956a886abbbe6aef0c87efd5bcbfd6f8921
jobs:
  proof:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane:
        - fifo
        - hardkill
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 1
        persist-credentials: false
    - name: Bind committed candidate and exact diagnostic overlay
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target_ref }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
        LANE: ${{ matrix.lane }}
      run: |
        set -euo pipefail
        test "$INPUT_TARGET" = "$EXPECTED_TARGET"
        test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
        test -z "$(git status --porcelain)"
        proof=.artifacts/drained-repair-proof
        mkdir -p "$proof"
        printf 'source=%s
        workflow=%s
        run=%s
        attempt=%s
        lane=%s
        ' "$EXPECTED_TARGET" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$LANE" > "$proof/identity.txt"
        base64 --decode > "$proof/diagnostic.patch" <<'BOUND_0'
        
        BOUND_0
        base64 --decode > "$proof/source.sha256" <<'BOUND_1'
        
        BOUND_1
        base64 --decode > "$proof/overlays.sha256" <<'BOUND_2'
        
        BOUND_2
        base64 --decode > "$proof/source-paths.txt" <<'BOUND_3'
        
        BOUND_3
        base64 --decode > "$proof/diagnostic-paths.txt" <<'BOUND_4'
        c3JjL2F1dG8tcmVwbHkvcmVwbHkvcXVldWUvZHJhaW4udHMKdGVzdC9nYXRld2F5LXN0ZWVyLWZpZm8uZTJlLnRlc3QudHMK
        BOUND_4
        base64 --decode > "$proof/prerequisites.sha256" <<'BOUND_5'
        
        BOUND_5
        sha256sum --check --strict "$proof/source.sha256"
        sha256sum --check --strict "$proof/prerequisites.sha256"
        while IFS= read -r path; do
          mkdir -p "$proof/source/$(dirname "$path")"
          cp "$path" "$proof/source/$path"
        done < "$proof/source-paths.txt"
        printf '%s  %s\n' '28513b7477a4142c79b69f391847da6b65edfe924e293f8caec8be7474ed06a0' "$proof/diagnostic.patch" | sha256sum --check --strict
        git apply --check "$proof/diagnostic.patch"
        git apply "$proof/diagnostic.patch"
        sha256sum --check --strict "$proof/overlays.sha256"
        git diff --name-only | LC_ALL=C sort > "$proof/actual-diagnostic-paths.txt"
        diff -u "$proof/diagnostic-paths.txt" "$proof/actual-diagnostic-paths.txt"
        git diff --check
        git diff --binary --full-index > "$proof/combined-diagnostic.patch"
        while IFS= read -r path; do
          mkdir -p "$proof/overlays/$(dirname "$path")"
          cp "$path" "$proof/overlays/$path"
        done < "$proof/source-paths.txt"
        # No build bypass or inherited prebuilt runtime.
        test -z "${OPENCLAW_E2E_SKIP_BUILD:-}"
        test -z "${OPENCLAW_E2E_USE_PREBUILT_DIST:-}"
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Canonical fifo E2E diagnostic
      if: matrix.lane == 'fifo'
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/drained-repair-proof
        node --version
        set +e
        OPENCLAW_E2E_VERBOSE=1 OPENCLAW_E2E_WORKERS=1 pnpm test:e2e:gateway test/gateway-steer-fifo.e2e.test.ts -t "dispatches terminal A before a later ordinary B queued during the same turn" 2>&1 | tee "$proof/fifo.log"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf 'canonical_e2e_exit=%s
        log_exit=%s
        ' "${statuses[0]}" "${statuses[1]}" > "$proof/fifo-status.txt"
        if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
        exit "${statuses[1]}"
    - name: Canonical hardkill E2E diagnostic
      if: matrix.lane == 'hardkill'
      shell: bash
      run: |
        set -euo pipefail
        proof=.artifacts/drained-repair-proof
        node --version
        set +e
        OPENCLAW_E2E_VERBOSE=1 OPENCLAW_E2E_WORKERS=1 pnpm test:e2e:gateway extensions/qa-lab/src/gateway-kill-restart-send.e2e.test.ts 2>&1 | tee "$proof/hardkill.log"
        statuses=("${PIPESTATUS[@]}")
        set -e
        printf 'canonical_e2e_exit=%s
        log_exit=%s
        ' "${statuses[0]}" "${statuses[1]}" > "$proof/hardkill-status.txt"
        if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
        exit "${statuses[1]}"
    - name: Preserve exact source and failure diagnostics
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: release-114-fifo-hardkill-73bef956-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .artifacts/
          test-results/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
