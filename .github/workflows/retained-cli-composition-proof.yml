name: Final candidate pre-FRV and complete capacity proof
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: final-66a5-proof
  cancel-in-progress: false
env:
  CI: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  TARGET_SHA: 66a5ab2b520bfb49a25efb87657b92d329920d28
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LANE: preflight
      SAFE_PROOF: .artifacts/final-candidate-proof/preflight
      PRIVATE_PROOF: ${{ github.workspace }}/../final-candidate-private-proof/preflight
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 66a5ab2b520bfb49a25efb87657b92d329920d28
        persist-credentials: false
        fetch-depth: 1
    - name: Bind exact candidate, tree, source hashes and workflow
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$PRIVATE_PROOF"

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/hosted.py"

        echo ''a33df53b949b710bf796187032dc98b568b8c694283baa4471d2aa35841f6761  ''"$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/verify_results.py"

        echo ''0d6022dc1a7d0e9510036f49b1e79889ee17a15fd7ff9adf9479a6346c8ff376  ''"$PRIVATE_PROOF/verify_results.py" | sha256sum --check --strict

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/manifest.json"

        echo ''4f6ab2268221f00c9564b6f08010029f697e51d1cc0f47ce21a4d49bd3103127  ''"$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'false'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - name: Run complete preflight proof and sanitize results
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/hosted.py" preflight

        '
    - name: Upload only explicit safe evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: final-66a5-preflight-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/final-candidate-proof/preflight/identity.txt

          .artifacts/final-candidate-proof/preflight/report.json'
        if-no-files-found: error
        retention-days: 14
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANE: capacity
      SAFE_PROOF: .artifacts/final-candidate-proof/capacity
      PRIVATE_PROOF: ${{ github.workspace }}/../final-candidate-private-proof/capacity
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 66a5ab2b520bfb49a25efb87657b92d329920d28
        persist-credentials: false
        fetch-depth: 1
    - name: Bind exact candidate, tree, source hashes and workflow
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$PRIVATE_PROOF"

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/hosted.py"

        echo ''a33df53b949b710bf796187032dc98b568b8c694283baa4471d2aa35841f6761  ''"$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/verify_results.py"

        echo ''0d6022dc1a7d0e9510036f49b1e79889ee17a15fd7ff9adf9479a6346c8ff376  ''"$PRIVATE_PROOF/verify_results.py" | sha256sum --check --strict

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/manifest.json"

        echo ''4f6ab2268221f00c9564b6f08010029f697e51d1cc0f47ce21a4d49bd3103127  ''"$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Install candidate Playwright Chromium prerequisite
      shell: bash
      run: 'set -euo pipefail

        pnpm --dir ui exec playwright install --with-deps chromium > "$PRIVATE_PROOF/browser-install.log" 2>&1

        '
    - name: Run complete capacity proof and sanitize results
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/hosted.py" capacity

        '
    - name: Upload only explicit safe evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: final-66a5-capacity-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/final-candidate-proof/capacity/identity.txt

          .artifacts/final-candidate-proof/capacity/report.json

          .artifacts/final-candidate-proof/capacity/tests.json'
        if-no-files-found: error
        retention-days: 14
