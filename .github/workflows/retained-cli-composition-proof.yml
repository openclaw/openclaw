        echo 299982d315b9865b4b709050a9cd9384832faa05354fbff23214a9e139f8d125  "$PRIVATE_PROOF/static_checks.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/manifest.json.b64" | gzip -d > "$PRIVATE_PROOF/manifest.json"

