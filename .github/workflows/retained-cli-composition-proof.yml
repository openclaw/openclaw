name: Clean instrumented 005030 publication progress - not qualification
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact independently reviewed workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ui-publication-clean-diagnostic-005030
  cancel-in-progress: false
env:
  CI: 'true'
  OPENCLAW_BUILD_PRIVATE_QA: '1'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  OPENCLAW_CAPTURE_UI_PROOF: '0'
  OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: '300000'
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
jobs:
  ui-original-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PRIVATE_PROOF: ${{ github.workspace }}/../ui-publication-clean-private/005030
      SAFE_PROOF: ${{ github.workspace }}-ui-publication-clean-safe/005030
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 5b9341dcce423b730dee002989448a2cd586cdc7
        persist-credentials: false
        fetch-depth: 2
    - name: Initialize private evidence directories
      shell: bash
      run: 'set -euo pipefail

        umask 077

        test ! -e "$PRIVATE_PROOF"

        test ! -e "$SAFE_PROOF"

        mkdir -p "$PRIVATE_PROOF" "$SAFE_PROOF"

        '
    - name: Transport and verify hosted.py
      shell: bash
      run: 'set -euo pipefail

        umask 077

        printf %s ''''
        | base64 --decode > "$PRIVATE_PROOF/hosted.py"

        printf ''%s\n'' ''b133b48891cc1ac94df77d721e8baddac979bb0f7ace3bdc860cb8aae0de6af0  ''"$PRIVATE_PROOF/hosted.py" |
        sha256sum --check --strict

        '
    - name: Transport and verify containment.py
      shell: bash
      run: 'set -euo pipefail

        umask 077

        printf %s ''''
        | base64 --decode > "$PRIVATE_PROOF/containment.py"

        printf ''%s\n'' ''4407da3114659b3dc109be58b87956449cb98e9d4392a49119a6f227f6cf8d56  ''"$PRIVATE_PROOF/containment.py"
        | sha256sum --check --strict

        '
    - name: Transport and verify progress.py
      shell: bash
      run: 'set -euo pipefail

        umask 077

        printf %s ''''
        | base64 --decode > "$PRIVATE_PROOF/progress.py"

        printf ''%s\n'' ''5f686c5b01fd2eb0a9c166007a5dee3e688cca07abdee6318c3aca5ba865a1b6  ''"$PRIVATE_PROOF/progress.py"
        | sha256sum --check --strict

        '
    - name: Transport and verify candidate-test.ts
      shell: bash
      run: 'set -euo pipefail

        umask 077

        printf %s ''''
        | base64 --decode > "$PRIVATE_PROOF/candidate-test.ts"

        printf ''%s\n'' ''56a585c5f780942bd83f92d6afa5d3b14254e127dc3ec904592ca262c6313b4a  ''"$PRIVATE_PROOF/candidate-test.ts"
        | sha256sum --check --strict

        '
    - name: Transport and verify diagnostic.patch
      shell: bash
      run: 'set -euo pipefail

        umask 077

        printf %s ''''
        | base64 --decode > "$PRIVATE_PROOF/diagnostic.patch"

        printf ''%s\n'' ''da25227b8dca7adb0d945c214830f820c71dc0c32e06afdf5238471e1b3410e7  ''"$PRIVATE_PROOF/diagnostic.patch"
        | sha256sum --check --strict

        '
    - name: Transport and verify include.json
      shell: bash
      run: 'set -euo pipefail

        umask 077

        printf %s ''''
        | base64 --decode > "$PRIVATE_PROOF/include.json"

        printf ''%s\n'' ''19bb49a3109d7386e044078a8bc8cecc5d95cd976e3e5ea2b7ceb43882ad7d32  ''"$PRIVATE_PROOF/include.json"
        | sha256sum --check --strict

        '
    - name: Transport and verify manifest.json
      shell: bash
      run: 'set -euo pipefail

        umask 077

        printf %s ''''
        | base64 --decode > "$PRIVATE_PROOF/manifest.json"

        printf ''%s\n'' ''3dff7df22318baeb2d6fa1cdc4b9a36c125f634a7f5a3f9163cdba837de7a18a  ''"$PRIVATE_PROOF/manifest.json"
        | sha256sum --check --strict

        '
    - name: Verify clean diagnostic commit, sole base parent and source hashes before setup
      shell: bash
      run: python3 -B "$PRIVATE_PROOF/hosted.py" bind
    - uses: ./.github/actions/setup-node-env
      timeout-minutes: 20
      with:
        node-version: 24.22.1
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
      timeout-minutes: 5
    - name: Build clean diagnostic commit then run original twenty-file shard once
      shell: bash
      run: python3 -B "$PRIVATE_PROOF/hosted.py" run
    - name: Retain only allowlisted raw diagnostic evidence
      if: always()
      shell: bash
      run: python3 -B "$PRIVATE_PROOF/hosted.py" export
    - name: Upload bounded diagnostic evidence even on failure
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ui-publication-clean-005030-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ github.workspace }}-ui-publication-clean-safe/005030/identity.json

          ${{ github.workspace }}-ui-publication-clean-safe/005030/report.json

          ${{ github.workspace }}-ui-publication-clean-safe/005030/shard-exit.json

          ${{ github.workspace }}-ui-publication-clean-safe/005030/artifacts.json

          ${{ github.workspace }}-ui-publication-clean-safe/005030/shard.log

          ${{ github.workspace }}-ui-publication-clean-safe/005030/build.log

          ${{ github.workspace }}-ui-publication-clean-safe/005030/browser-install.log

          ${{ github.workspace }}-ui-publication-clean-safe/005030/publication.json

          ${{ github.workspace }}-ui-publication-clean-safe/005030/gateway.log

          ${{ github.workspace }}-ui-publication-clean-safe/005030/publication-progress.log

          ${{ github.workspace }}-ui-publication-clean-safe/005030/publication-progress-gateway.log

          ${{ github.workspace }}-ui-publication-clean-safe/005030/progress-assessment.json

          ${{ github.workspace }}-ui-publication-clean-safe/005030/.buildstamp

          ${{ github.workspace }}-ui-publication-clean-safe/005030/.runtime-postbuildstamp

          ${{ github.workspace }}-ui-publication-clean-safe/005030/build-info.json

          ${{ github.workspace }}-ui-publication-clean-safe/005030/build-provenance.json'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
