      run: 'set -euo pipefail

        pnpm test test/vitest-projects-config.test.ts test/vitest-scoped-config.test.ts --maxWorkers=1 2>&1 | tee .artifacts/final-ci/config.log'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
