name: Release detached lifecycle causal proof
'on':
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        type: string
        description: Exact frozen candidate SHA; prerequisite diagnostic, not final FRV
permissions:
  contents: read
concurrency:
  group: release-detached-scope-${{ inputs.target_ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  BASE_SHA: 89f5912fbe1d26ad81758d6f07e116b39a4e45f9
  REQUIRED_CHECKS_BASE: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  BEFORE_SHA: f38131f934b45447558cf6f431353a49656198d5
  PREREQUISITE_PARENT: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  CAPACITY_PROOF_SHA: 7af9ee549e45948707162d9d8cfa8c068a084fe6
  PREREQUISITE_PATCH_SHA256: 5d8f8bb9a93331eb4a01ca2aefcf2d655dd0e36821f44353663e62d2751f7dc5
  CANDIDATE_SHA: a233af0b84e093845c62e88c2702cbd9b297f22c
  SOURCE_TREE: fefba51180be86548a58cc0438ba340716110bd7
  PATHS_SHA256: 56a1d5118580b0ea7c50e12d42dac3d95dfabcee58ecf5561b6797c92ae0ef93
  TRUSTED_P: 68aff7f864148760c3800c95435cc36ddaa91654
jobs:
  detached:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant:
        - before
        - after
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 0
        persist-credentials: false
    - name: Bind exact candidate
      shell: bash
      run: 'set -euo pipefail

        test "${{ inputs.target_ref }}" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

        test -z "$(git status --porcelain)"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        mkdir -p .artifacts/final-ci

        git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort > .artifacts/final-ci/source-paths.txt

        echo "$PATHS_SHA256  .artifacts/final-ci/source-paths.txt" | sha256sum -c -

        printf ''C=%s

        Q=%s

        P=%s

        workflow=%s

        run=%s

        attempt=%s

        '' "$CANDIDATE_SHA" "$CANDIDATE_SHA" "$TRUSTED_P" "${{ github.workflow_sha }}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .artifacts/final-ci/identity.txt

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Apply exact detached lifecycle overlay
      run: 'set -euo pipefail

        printf ''%s'' ''''
        | base64 --decode | git apply -

        echo ''9c9de6445019d1c5242a3d056a4ffd716751ce97dc2bc5d4c1de2fc0e4cac4ea  src/agents/subagents/registry/subagent-registry-lifecycle.test.ts'' | sha256sum -c -

        if [ "$VARIANT" = after ]; then

        printf ''%s'' ''''
        | base64 --decode | git apply -

        echo ''434b5ad6781bd02f564761f33394a74f6a4e9f591c4ac0b01c265160f9374a29  src/agents/subagents/registry/subagent-registry-lifecycle.ts'' | sha256sum -c -

        printf ''%s'' ''''
        | base64 --decode | git apply -

        echo ''b12479cb6d07e93ac746ac424c0ef416a36e9b4f0f45ef6bd0660555497ea54e  src/agents/subagents/registry/subagent-registry-lifecycle-cleanup.ts'' | sha256sum -c -

        printf ''%s'' ''''
        | base64 --decode | git apply -

        echo ''afecadf3f12de2221a3b61afce61b3b47623a2831d26b68ed71d85b47f8d5acf  src/agents/subagents/registry/subagent-registry-lifecycle-bookkeeping.ts'' | sha256sum -c -

        fi

        git diff --binary > .artifacts/final-ci/overlay.patch

        sha256sum src/agents/subagents/registry/subagent-registry-lifecycle.test.ts src/agents/subagents/registry/subagent-registry-lifecycle.ts src/agents/subagents/registry/subagent-registry-lifecycle-cleanup.ts src/agents/subagents/registry/subagent-registry-lifecycle-bookkeeping.ts > .artifacts/final-ci/overlay-sha256.txt'
    - name: Exercise detached lifecycle entrypoints
      shell: bash
      run: "set -uo pipefail\nset +e\nnode scripts/test-projects.mts src/agents/subagents/registry/subagent-registry-lifecycle.test.ts -- --testNamePattern='runs independent .* after the spawning plugin invocation closes|owns context cleanup after its caller scope drains|runs a detached settle wake outside disposed requester transcript and plugin scopes' --reporter=default --reporter=json --outputFile=\"$GITHUB_WORKSPACE/.artifacts/final-ci/tests.json\" 2>&1 | tee .artifacts/final-ci/tests.log\nresult=$?\nset -e\nprintf '%s\n' \"$result\" > .artifacts/final-ci/test-exit.txt\nnode --input-type=module <<'NODE'\nimport fs from 'node:fs'; import assert from 'node:assert/strict';\nconst r=JSON.parse(fs.readFileSync('.artifacts/final-ci/tests.json','utf8'));\nconst tests=r.testResults.flatMap(s=>s.assertionResults).filter(t=>t.status==='passed'||t.status==='failed');\nassert.equal(tests.length,6);\nif(process.env.VARIANT==='before'){\n const failures=tests.filter(t=>t.status==='failed');assert.ok(failures.length>0);\n\
        \ assert.ok(failures.some(t=>JSON.stringify(t.failureMessages).includes('Plugin invocation scope is closed')));\n assert.notEqual(fs.readFileSync('.artifacts/final-ci/test-exit.txt','utf8').trim(),'0');\n}else{assert.ok(tests.every(t=>t.status==='passed'));assert.equal(r.numFailedTests,0);assert.equal(fs.readFileSync('.artifacts/final-ci/test-exit.txt','utf8').trim(),'0');}\nNODE"
    - name: Targeted static proof
      if: matrix.variant == 'after'
      run: node scripts/check-changed.mjs -- src/agents/subagents/registry/subagent-registry-lifecycle.test.ts src/agents/subagents/registry/subagent-registry-lifecycle.ts src/agents/subagents/registry/subagent-registry-lifecycle-cleanup.ts src/agents/subagents/registry/subagent-registry-lifecycle-bookkeeping.ts
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: detached-scope-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
