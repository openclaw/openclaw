name: "UI cron publication diagnostic v4 \u2014 not qualification"
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ui-publication-diagnostic-v4
  cancel-in-progress: false
env:
  CI: 'true'
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: '300000'
  OPENCLAW_BUILD_PRIVATE_QA: '1'
  OPENCLAW_UI_PUBLICATION_DIAGNOSTIC: '1'
jobs:
  cron-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANE: cron-catalog
      PRIVATE_PROOF: ${{ github.workspace }}/../ui-publication-private/cron-catalog
      SAFE_PROOF: ${{ github.workspace }}-ui-publication-safe/cron-catalog
      OPENCLAW_UI_E2E_ARTIFACT_DIR: ${{ github.workspace }}/../ui-publication-private/cron-catalog/ui-artifacts
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: c24cc3d81fcf6afc68b6a489602ed2848f958b71
        persist-credentials: false
        fetch-depth: 1
    - name: Initialize private evidence directories
      shell: bash
      run: 'set -euo pipefail

        umask 077

        mkdir -p "$PRIVATE_PROOF" "$SAFE_PROOF"

        '
    - name: Transport hosted.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/hosted.py.b64"

        '
    - name: Verify hosted.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/hosted.py.b64" > "$PRIVATE_PROOF/hosted.py"

        printf ''%s\n'' ''325a79a3dbb44534e3dd2d1c7689a8b381052f158177555c38a08d344356b79c  ''"$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        '
    - name: Transport containment.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/containment.py.b64"

        '
    - name: Verify containment.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/containment.py.b64" > "$PRIVATE_PROOF/containment.py"

        printf ''%s\n'' ''f8d859f25661719c3dcbf8d3e503e9399b2f6f1526f0128a7da228f1de385c79  ''"$PRIVATE_PROOF/containment.py" | sha256sum --check --strict

        '
    - name: Transport proof_data.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/proof_data.py.b64"

        '
    - name: Verify proof_data.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/proof_data.py.b64" > "$PRIVATE_PROOF/proof_data.py"

        printf ''%s\n'' ''11aea41df279645d62c9757989d04301132e5866fb2a7a69e5758402af4b70d4  ''"$PRIVATE_PROOF/proof_data.py" | sha256sum --check --strict

        '
    - name: Transport diagnostic_data.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/diagnostic_data.py.b64"

        '
    - name: Transport diagnostic_data.py 2
      shell: bash
      run: 'set -euo pipefail

        printf %s ''YXRpb24tb3V0Y29tZSd9Cg=='' >> "$PRIVATE_PROOF/diagnostic_data.py.b64"

        '
    - name: Verify diagnostic_data.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/diagnostic_data.py.b64" > "$PRIVATE_PROOF/diagnostic_data.py"

        printf ''%s\n'' ''33570660a0605115fd39b7a018f3922dc76030c135abb0b2b5250801c0178068  ''"$PRIVATE_PROOF/diagnostic_data.py" | sha256sum --check --strict

        '
    - name: Transport manifest.json 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Verify manifest.json transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/manifest.json.b64" > "$PRIVATE_PROOF/manifest.json"

        printf ''%s\n'' ''c9e50854bcd94e6298a6533e9d6c27faf9880225086dcb6b92334dd7a737f43c  ''"$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        '
    - name: Transport diagnostic-only.patch 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/diagnostic-only.patch.b64"

        '
    - name: Transport diagnostic-only.patch 2
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/diagnostic-only.patch.b64"

        '
    - name: Verify diagnostic-only.patch transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/diagnostic-only.patch.b64" > "$PRIVATE_PROOF/diagnostic-only.patch"

        printf ''%s\n'' ''9fd791d801b0dd7b480c076b462ec9ab769479c7c19d5a817d7b3225b58a0fd7  ''"$PRIVATE_PROOF/diagnostic-only.patch" | sha256sum --check --strict

        '
    - name: Bind exact candidate and diagnostic overlay
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Collect exact cron-catalog diagnostic
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/hosted.py" run

        '
    - name: Upload exact safe cron-catalog evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ui-publication-cron-catalog-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ github.workspace }}-ui-publication-safe/cron-catalog/identity.json

          ${{ github.workspace }}-ui-publication-safe/cron-catalog/report.json

          ${{ github.workspace }}-ui-publication-safe/cron-catalog/diagnostics.json

          ${{ github.workspace }}-ui-publication-safe/cron-catalog/native-status.json'
        if-no-files-found: error
        retention-days: 14
