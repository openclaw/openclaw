name: Required Backports Generated Patch

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Reviewed four-backport candidate full commit SHA (not a branch or tag)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: required-backports-generated-patch-${{ inputs.target_ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BASE_SHA: 89f5912fbe1d26ad81758d6f07e116b39a4e45f9
  EXPECTED_PATHS_SHA256: d3e7d95f86730273c8d8df822b34488842f92ba09c18d333cd72397a8abb870c

jobs:
  generate:
    if: github.repository == 'openclaw/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require exact candidate identity
        env:
          TARGET_SHA: ${{ inputs.target_ref }}
        run: |
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1

      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify bounded source and record identity
        id: source
        env:
          TARGET_SHA: ${{ inputs.target_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          mkdir -p "$RUNNER_TEMP/backport-generated"
          git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort > "$RUNNER_TEMP/backport-generated/source-paths.txt"
          echo "$EXPECTED_PATHS_SHA256  $RUNNER_TEMP/backport-generated/source-paths.txt" | sha256sum -c -
          git diff --binary "$BASE_SHA" HEAD > "$RUNNER_TEMP/backport-generated/source.patch"
          printf 'base=%s\ncandidate=%s\nworkflow=%s\nrun=%s\nattempt=%s\n' \
            "$BASE_SHA" "$TARGET_SHA" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/backport-generated/identity.txt"

      - name: Setup canonical Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "false"

      - name: Generate canonical config docs and format only the reviewed scope
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/backport-generated"
          pnpm config:docs:gen
          git diff --binary HEAD -- docs/.generated/config-baseline.counts.json docs/.generated/config-baseline.sha256 > "$out/config-docs.patch"
          mapfile -t paths < "$out/source-paths.txt"
          pnpm format --no-error-on-unmatched-pattern -- "${paths[@]}" \
            docs/.generated/config-baseline.counts.json docs/.generated/config-baseline.sha256

      - name: Export generated delta and content hashes
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/backport-generated"
          [[ -f "$out/source.patch" ]]
          git diff --binary HEAD > "$out/generated-format.patch"
          cp docs/.generated/config-baseline.counts.json docs/.generated/config-baseline.sha256 "$out/"
          { cat "$out/source-paths.txt"; printf '%s\n' docs/.generated/config-baseline.counts.json docs/.generated/config-baseline.sha256; } | LC_ALL=C sort -u > "$out/allowed-output-paths.txt"
          git diff --name-only HEAD | LC_ALL=C sort > "$out/generated-paths.txt"
          comm -23 "$out/generated-paths.txt" "$out/allowed-output-paths.txt" > "$out/unexpected-paths.txt"
          [[ ! -s "$out/unexpected-paths.txt" ]]
          (cd "$out" && sha256sum source.patch config-docs.patch generated-format.patch config-baseline.counts.json config-baseline.sha256 > SHA256SUMS)

      - name: Verify generated baseline and scoped formatting
        run: |
          set -euo pipefail
          pnpm config:docs:check
          mapfile -t paths < "$RUNNER_TEMP/backport-generated/source-paths.txt"
          pnpm format:check --no-error-on-unmatched-pattern -- "${paths[@]}" \
            docs/.generated/config-baseline.counts.json docs/.generated/config-baseline.sha256
          git diff --check

      - name: Record owner-selected check plan for next exact candidate
        run: |
          pnpm check:changed --base "$BASE_SHA" --head HEAD --dry-run \
            > "$RUNNER_TEMP/backport-generated/check-plan.log" 2>&1

      - name: Upload generated patch for review, never commit or publish it
        if: ${{ always() && steps.source.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: required-backports-generated-${{ inputs.target_ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backport-generated/
          if-no-files-found: error
          retention-days: 14
