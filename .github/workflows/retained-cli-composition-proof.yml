name: Placement owner diagnostic proof

# Scratch diagnostic only: install alongside the pinned patch, never on a candidate ref.
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact diagnostic source, not a qualification target
        required: true
        type: string
        default: db48e205e03f5a0458af2cb78bcf5434fc9a70a0

permissions:
  contents: read

concurrency:
  group: placement-owner-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Placement owner diagnostic (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - lane: unit
            config: ""
          - lane: static
            config: ""
          - lane: types-core
            config: tsconfig.core.json
          - lane: types-gateway-methods
            config: test/tsconfig/tsconfig.core.test.gateway-methods.json
          - lane: types-gateway-other
            config: test/tsconfig/tsconfig.core.test.gateway-other.json
          - lane: types-infra
            config: test/tsconfig/tsconfig.core.test.infra.json
          - lane: types-ui-e2e-chat
            config: test/tsconfig/tsconfig.core.test.ui-e2e-chat.json
          - lane: types-root-e2e
            config: test/tsconfig/tsconfig.test.root.e2e.json
    env:
      PROOF_LANE: ${{ matrix.lane }}
      TYPE_CONFIG: ${{ matrix.config }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SOURCE_SHA: db48e205e03f5a0458af2cb78bcf5434fc9a70a0
      OVERLAY_SHA256: 91749b303ce7d34e5e7a4d00a1f6be60ad6ae681a022dc3a9d8edddc9d92100a
    steps:
      - name: Initialize failure-safe run binding
        shell: bash
        env:
          PROOF_DIR: ${{ runner.temp }}/placement-owner-proof
          INPUT_TARGET: ${{ inputs.target_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          printf 'PROOF_DIR=%s\n' "$PROOF_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PROOF_DIR"
          printf 'repository=%s\nworkflow_sha=%s\nworkflow_ref=%s\nrun_id=%s\nrun_attempt=%s\nsource_sha=%s\noverlay_sha256=%s\nlane=%s\n' \
            "$REPOSITORY" "$WORKFLOW_SHA" "$WORKFLOW_REF" "$RUN_ID" "$RUN_ATTEMPT" \
            "$SOURCE_SHA" "$OVERLAY_SHA256" "$PROOF_LANE" > "$PROOF_DIR/binding.txt"
          printf '%s\n' 'Diagnostic code proof only; live/native/provider proof NOT RUN.' > "$PROOF_DIR/scope.txt"
          test "$INPUT_TARGET" = "$SOURCE_SHA"
      - name: Checkout diagnostic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Preserve exact harness and overlay
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/retained-cli-composition-proof.yml "$PROOF_DIR/workflow.yml"
          cp .github/diagnostics/placement-owner-db48.patch "$PROOF_DIR/overlay.patch"
          printf '%s  %s\n' "$OVERLAY_SHA256" "$PROOF_DIR/overlay.patch" | sha256sum --check
          sha256sum "$PROOF_DIR/workflow.yml" > "$PROOF_DIR/workflow.sha256"
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: db48e205e03f5a0458af2cb78bcf5434fc9a70a0
          persist-credentials: false
      - name: Apply and bind seven-file diagnostic overlay
        id: overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git apply --check "$PROOF_DIR/overlay.patch"
          git apply "$PROOF_DIR/overlay.patch"
          git diff --check
          git -c diff.algorithm=myers -c diff.indentHeuristic=false diff --full-index --binary --no-ext-diff --no-textconv --no-color --no-renames --unified=3 --src-prefix=a/ --dst-prefix=b/ > "$PROOF_DIR/applied.patch"
          printf '%s  %s\n' "$OVERLAY_SHA256" "$PROOF_DIR/applied.patch" | sha256sum --check
          git diff --name-only > "$PROOF_DIR/changed-files.txt"
          test "$(wc -l < "$PROOF_DIR/changed-files.txt")" -eq 7
          git status --short > "$PROOF_DIR/source-status.txt"
      - name: Setup pinned source toolchain
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          semantic-checks: "true"
          cache-mode: "off"
      - name: Record canonical runtime versions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node --version | tee "$PROOF_DIR/node.txt"
          pnpm --version | tee "$PROOF_DIR/pnpm.txt"
      - name: Prove complete coordinator admission file
        id: unit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.lane == 'unit' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm test src/gateway/worker-environments/placement-dispatch-coordinator-admission.test.ts \
            --maxWorkers=1 --reporter=default --reporter=junit \
            --outputFile.junit="$PROOF_DIR/coordinator.junit.xml" 2>&1 | tee "$PROOF_DIR/coordinator.log"
          python3 - "$PROOF_DIR/coordinator.junit.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = list(root.iter('testcase'))
          assert len(cases) == 22, f'Expected all 22 coordinator cases, got {len(cases)}'
          assert not any(c.find('skipped') is not None for c in cases), 'Coordinator proof skipped cases'
          assert not any(c.find('failure') is not None or c.find('error') is not None for c in cases), 'Coordinator proof failed'
          print(f'Coordinator admission: {len(cases)} cases, zero skipped/failures/errors')
          PY
      - name: Check exact seven-file formatting
        id: format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.lane == 'static' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < "$PROOF_DIR/changed-files.txt"
          pnpm format:check -- "${files[@]}" 2>&1 | tee "$PROOF_DIR/format.log"
      - name: Lint exact changed core and UI files
        id: lint_core
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.lane == 'static' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -E '^(src|ui)/' "$PROOF_DIR/changed-files.txt")
          test "${#files[@]}" -eq 5
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json "${files[@]}" 2>&1 | tee "$PROOF_DIR/lint-core.log"
      - name: Lint exact changed root E2E files
        id: lint_root
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.lane == 'static' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(grep '^test/' "$PROOF_DIR/changed-files.txt")
          test "${#files[@]}" -eq 2
          node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.test.root.json "${files[@]}" 2>&1 | tee "$PROOF_DIR/lint-root.log"
      - name: Typecheck exact owning graph
        id: types
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && startsWith(matrix.lane, 'types-') }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$TYPE_CONFIG" > "$PROOF_DIR/type-config.txt"
          node scripts/run-tsgo.mjs -p "$TYPE_CONFIG" --incremental \
            --tsBuildInfoFile ".artifacts/tsgo-cache/$PROOF_LANE.tsbuildinfo" 2>&1 | tee "$PROOF_DIR/types.log"
      - name: Record all outcomes even on failure
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_DIR"
          printf '%s\n' "$OUTCOMES" > "$PROOF_DIR/steps.json"
          if test -d .git; then
            git rev-parse HEAD > "$PROOF_DIR/final-head.txt"
            git -c diff.algorithm=myers -c diff.indentHeuristic=false diff --full-index --binary --no-ext-diff --no-textconv --no-color --no-renames --unified=3 --src-prefix=a/ --dst-prefix=b/ > "$PROOF_DIR/final.patch"
            sha256sum "$PROOF_DIR/final.patch" > "$PROOF_DIR/final-patch.sha256"
          fi
          if test -f "$PROOF_DIR/applied.patch"; then
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
            printf '%s  %s\n' "$OVERLAY_SHA256" "$PROOF_DIR/final.patch" | sha256sum --check
          fi
      - name: Upload exact proof including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: placement-owner-db48-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/placement-owner-proof/
          if-no-files-found: error
          retention-days: 14
