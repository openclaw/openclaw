name: Bounded exact-candidate E2E preparation diagnosis
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      SAFE_PROOF: .artifacts/preparation-probe
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: c89139757f2c6728863a740309027562004163f8
        persist-credentials: false
        fetch-depth: 1
      timeout-minutes: 4
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
      timeout-minutes: 4
    - uses: ./.github/actions/setup-test-bun
      timeout-minutes: 4
    - name: Observe only E2E preparation, hard 180-second child budget
      timeout-minutes: 4
      shell: bash
      run: set -e; export PRIVATE_PROOF="$RUNNER_TEMP/preparation-probe-private"; mkdir -p "$PRIVATE_PROOF"; printf %s  | base64 --decode > "$PRIVATE_PROOF/probe.py"; echo 0508459b946d3d18eb34b57b2f90a35ecbc13ecc9dfe25191c6e45418cd523e9  "$PRIVATE_PROOF/probe.py" | sha256sum --check --strict; python3 "$PRIVATE_PROOF/probe.py"
    - name: Upload bounded preparation evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: preparation-probe-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/preparation-probe/identity.json

          .artifacts/preparation-probe/report.json'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
