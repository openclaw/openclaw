name: Bounded delegation snapshot and types V3 safe log diagnostics
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      SAFE_PROOF: .artifacts/delegation-followup-safe
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: c89139757f2c6728863a740309027562004163f8
        persist-credentials: false
        fetch-depth: 1
      timeout-minutes: 4
    - name: Bind candidate and exact proof capsule
      shell: bash
      run: 'set -euo pipefail

        export PRIVATE_PROOF="$RUNNER_TEMP/delegation-followup"

        mkdir -p "$PRIVATE_PROOF"

        printf %s  | base64 --decode > "$PRIVATE_PROOF/hosted.py"

        echo e7aed8a660ea1197168750d86a71893180fc05c9672b5c4ec9e346ae2ef3e57d  "$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        printf %s  | base64 --decode > "$PRIVATE_PROOF/results.py"

        echo 625b47d631f7a5221f4b70c9312ec6715dd83db5b500f8103bdb03f79c3f65dc  "$PRIVATE_PROOF/results.py" | sha256sum --check --strict

        printf %s  | base64 --decode > "$PRIVATE_PROOF/diagnostics.py"

        echo 371984306d5dfffe8320caa67f6bb9d8cf68524946f862420b497d3645169365  "$PRIVATE_PROOF/diagnostics.py" | sha256sum --check --strict

        printf %s  | base64 --decode > "$PRIVATE_PROOF/logs.py"

        echo ce45379c261705bcea866d7326354152a034f6046797c58e1005c32fa6baf05e  "$PRIVATE_PROOF/logs.py" | sha256sum --check --strict

        printf %s  | base64 --decode > "$PRIVATE_PROOF/manifest.json"

        echo 9aa03c7e5c611f39cc1c48c7e69cf6c9ea4c560b5a3770e5c987b05d37e522fb  "$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        printf %s  | base64 --decode > "$PRIVATE_PROOF/combined.patch"

        echo 202c6ff885e5f92ae3c8bcb9d801e4fedc69f168e9370bc8a29b44c0b437e6a8  "$PRIVATE_PROOF/combined.patch" | sha256sum --check --strict

        printf %s  | base64 --decode > "$PRIVATE_PROOF/production.tsconfig.json"

        echo 8a76302bc5946ee2e0e3555c1c5fd43b6cc1dd1f976638878fe23d7e5f3e1306  "$PRIVATE_PROOF/production.tsconfig.json" | sha256sum --check --strict

        printf %s  | base64 --decode > "$PRIVATE_PROOF/tests.tsconfig.json"

        echo 0be1824f8c25d64f63c28f8f6d5df1969614c57e588d711cee095b0c6274d078  "$PRIVATE_PROOF/tests.tsconfig.json" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/hosted.py" bind'
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
      timeout-minutes: 5
    - uses: ./.github/actions/setup-test-bun
      timeout-minutes: 5
    - name: Run bounded serial sibling and static commands
      shell: bash
      timeout-minutes: 25
      run: export PRIVATE_PROOF="$RUNNER_TEMP/delegation-followup"; python3 "$PRIVATE_PROOF/hosted.py" run
    - name: Retain prior outcome
      if: always()
      shell: bash
      run: export PRIVATE_PROOF="$RUNNER_TEMP/delegation-followup"; python3 "$PRIVATE_PROOF/hosted.py" finalize
    - name: Upload only sanitized bounded evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: delegation-followup-v3-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/delegation-followup-safe/identity.json

          .artifacts/delegation-followup-safe/report.json'
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 7
