name: Release memory error reporting proof
'on':
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        type: string
        description: Exact frozen candidate SHA; prerequisite diagnostic, not final FRV
        default: 2779e031a5ad39019bdbda5d9b696f54bd7a233b
permissions:
  contents: read
concurrency:
  group: release-memory-reporting-2779e031a5ad39019bdbda5d9b696f54bd7a233b
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  BASE_SHA: 89f5912fbe1d26ad81758d6f07e116b39a4e45f9
  REQUIRED_CHECKS_BASE: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  BEFORE_SHA: f38131f934b45447558cf6f431353a49656198d5
  PREREQUISITE_PARENT: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  CAPACITY_PROOF_SHA: 7af9ee549e45948707162d9d8cfa8c068a084fe6
  PREREQUISITE_PATCH_SHA256: 5d8f8bb9a93331eb4a01ca2aefcf2d655dd0e36821f44353663e62d2751f7dc5
  CANDIDATE_SHA: 2779e031a5ad39019bdbda5d9b696f54bd7a233b
  SOURCE_TREE: e58f753f60643f9c1461dfaef1c89ba858dd02f3
  PATHS_SHA256: c6b9bda9fd4108f93953a5a3ae37a223edaba11f0888c4a03eb05206dca710cc
  TRUSTED_P: 68aff7f864148760c3800c95435cc36ddaa91654
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 0
        persist-credentials: false
    - name: Bind exact candidate
      shell: bash
      run: 'set -euo pipefail

        test "${{ inputs.target_ref }}" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

        test -z "$(git status --porcelain)"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        mkdir -p .artifacts/final-ci

        git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort > .artifacts/final-ci/source-paths.txt

        echo "$PATHS_SHA256  .artifacts/final-ci/source-paths.txt" | sha256sum -c -

        printf ''C=%s

        Q=%s

        P=%s

        workflow=%s

        run=%s

        attempt=%s

        '' "$CANDIDATE_SHA" "$CANDIDATE_SHA" "$TRUSTED_P" "${{ github.workflow_sha }}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
        > .artifacts/final-ci/identity.txt

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Canonical test project router
      shell: bash
      run: 'set -euo pipefail

        mapfile -t suites < <(node -e ''for(const p of JSON.parse(process.env.TESTS_JSON)) console.log(p)'')

        node scripts/test-projects.mts "${suites[@]}" -- --reporter=default --reporter=json --outputFile="$GITHUB_WORKSPACE/.artifacts/final-ci/tests.json"
        2>&1 | tee .artifacts/final-ci/tests.log'
    - name: Require executed suite coverage
      shell: bash
      run: "node --input-type=module <<'NODE'\nimport fs from 'node:fs'; import assert from 'node:assert/strict';\nconst selected=JSON.parse(process.env.TESTS_JSON);\n\
        const report=JSON.parse(fs.readFileSync('.artifacts/final-ci/tests.json','utf8'));\nassert.equal(report.numFailedTests,0);\
        \ assert.equal(report.numFailedTestSuites,0);\nfor (const path of selected) {\n const matches=report.testResults.filter(x=>x.name.replaceAll('\\\
        \\','/').endsWith('/'+path));\n assert.equal(matches.length,1,'Missing/duplicate suite '+path);\n assert(matches[0].assertionResults.some(x=>x.status==='passed'),'No\
        \ executed case '+path);\n assert(matches[0].assertionResults.every(x=>['passed','pending','skipped','todo','disabled'].includes(x.status)),'Failed\
        \ case '+path);\n}\nfor (const path of ['src/agents/code-mode.catalog-lifetime.test.ts','src/gateway/server.delegated-administration.product.test.ts','test/system-agent-delegation-authority.e2e.test.ts','ui/src/e2e/session-management.trailing-state.e2e.test.ts'])\
        \ {\n if (!selected.includes(path)) continue;\n const suite=report.testResults.find(x=>x.name.replaceAll('\\\\','/').endsWith('/'+path));\n\
        \ assert(suite && suite.assertionResults.length>0 && suite.assertionResults.every(x=>x.status==='passed'),'Critical\
        \ cases must all pass '+path);\n}\nif (process.env.REQUIRE_STRESS==='1') {\n const suite=report.testResults.find(x=>x.name.endsWith('/packages/memory-host-sdk/src/host/session-files-large-export.test.ts'));\n\
        \ assert(suite && suite.assertionResults.length>0 && suite.assertionResults.every(x=>x.status==='passed'),'Stress\
        \ must execute, never skip');\n}\nif (process.platform==='win32') {\n const suite=report.testResults.find(x=>x.name.replaceAll('\\\
        \\','/').endsWith('/src/infra/update-retained-runtime-imports.process.test.ts'));\n for (const runtime of ['node-short-path','node-junction'])\
        \ assert(suite?.assertionResults.some(x=>x.title.includes(runtime)&&x.status==='passed'),'Missing real '+runtime+'\
        \ pass');\n}\nNODE\nnode --input-type=module <<'NODE'\nimport fs from 'node:fs'; import assert from 'node:assert/strict';\n\
        const expected={ 'queued-inputs':3, permissions:4 }[process.env.PROOF_LANE];\nif (expected) {\n const report=JSON.parse(fs.readFileSync('.artifacts/final-ci/tests.json','utf8'));\n\
        \ assert.equal(report.numPassedTests,expected);\n assert.equal(report.numPendingTests,0);\n}\nNODE\n\nif [ \"$PROOF_LANE\"\
        \ = consumed-contract ]; then node -e 'const r=require(\"./.artifacts/final-ci/tests.json\"); require(\"node:assert/strict\"\
        ).equal(r.numPendingTests,0)'; fi\n"
    - name: Require all selected cases
      run: 'node -e ''const r=require("./.artifacts/final-ci/tests.json");require("node:assert/strict").equal(r.numPendingTests,0)'' '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: tests-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    strategy:
      fail-fast: false
      matrix:
        include:
        - lane: memory-original-shard
          tests_json: '["src/gateway/server-plugin-reload-cleanup.test.ts","src/gateway/server-plugin-reload-recovery.test.ts","src/gateway/server-plugin-reload.installed-package.test.ts","src/gateway/server-plugin-reload.meeting-transcripts.test.ts","src/gateway/server-plugin-reload.prepared-borrow.test.ts","src/gateway/server-plugin-reload.recovery.test.ts","src/gateway/server-request-entry.test.ts","src/gateway/server-run-shutdown.recovery.test.ts","src/gateway/server.operator-observer-lifetime.test.ts","src/gateway/session-automation-index.maintenance.test.ts","src/gateway/session-automation-index.test.ts","src/gateway/session-row-projection.automation.test.ts","src/gateway/session-row-projection.selection-progress.test.ts","src/gateway/session-utils.test.ts","src/gateway/worker-environments/worker-turn-context-engine.test.ts"]'
    env:
      TESTS_JSON: ${{ matrix.tests_json }}
      OPENCLAW_SESSION_EXPORT_STRESS: '1'
      REQUIRE_STRESS: ${{ matrix.lane == 'memory-replay' && '1' || '0' }}
      PROOF_LANE: ${{ matrix.lane }}
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 0
        persist-credentials: false
    - name: Bind exact candidate
      shell: bash
      run: 'set -euo pipefail

        test "${{ inputs.target_ref }}" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

        test -z "$(git status --porcelain)"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        mkdir -p .artifacts/final-ci

        git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort > .artifacts/final-ci/source-paths.txt

        echo "$PATHS_SHA256  .artifacts/final-ci/source-paths.txt" | sha256sum -c -

        printf ''C=%s

        Q=%s

        P=%s

        workflow=%s

        run=%s

        attempt=%s

        '' "$CANDIDATE_SHA" "$CANDIDATE_SHA" "$TRUSTED_P" "${{ github.workflow_sha }}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
        > .artifacts/final-ci/identity.txt

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Verify static
      run: 'set -euo pipefail

        ( node scripts/run-oxlint.mjs --tsconfig tsconfig.json src/gateway/server-plugin-reload.memory.test-support.ts src/gateway/config-reload-plugin-drain.ts
        src/gateway/agent-turn/agent-run-execution-phase.owner.test.ts src/gateway/server-methods/config.shared-auth.test.ts
        src/gateway/server-plugin-reload.prepared-borrow.test.ts src/gateway/server-plugin-reload.recovery.test-support.ts
        src/gateway/worker-environments/worker-turn-context-engine.test.ts src/plugins/services.ts src/plugins/services.scheduler-context.test.ts
        && pnpm exec oxfmt --check --no-error-on-unmatched-pattern -- src/gateway/server-plugin-reload.memory.test-support.ts
        src/gateway/config-reload-plugin-drain.ts src/gateway/agent-turn/agent-run-execution-phase.owner.test.ts src/gateway/server-methods/config.shared-auth.test.ts
        src/gateway/server-plugin-reload.prepared-borrow.test.ts src/gateway/server-plugin-reload.recovery.test-support.ts
        src/gateway/worker-environments/worker-turn-context-engine.test.ts src/plugins/services.ts src/plugins/services.scheduler-context.test.ts
        && node scripts/run-tsgo-core-test-shards.mjs --ci-graphs-json ''["core","core-test-gateway-other","core-test-gateway-root","core-test-gateway-server","core-test-plugins-platform"]''
        ) 2>&1 | tee .artifacts/final-ci/static.log

        git diff --exit-code

        '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: drain-recovery-static-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
  reporter-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: '${{ matrix.source }}'
        fetch-depth: 0
        persist-credentials: false
    - name: Bind exact candidate
      shell: bash
      run: 'set -euo pipefail

        test "${{ inputs.target_ref }}" = "2779e031a5ad39019bdbda5d9b696f54bd7a233b"

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

        test -z "$(git status --porcelain)"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        mkdir -p .artifacts/final-ci

        git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort > .artifacts/final-ci/source-paths.txt

        echo "$PATHS_SHA256  .artifacts/final-ci/source-paths.txt" | sha256sum -c -

        printf ''C=%s

        Q=%s

        P=%s

        workflow=%s

        run=%s

        attempt=%s

        '' "$CANDIDATE_SHA" "$CANDIDATE_SHA" "$TRUSTED_P" "${{ github.workflow_sha }}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
        > .artifacts/final-ci/identity.txt

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Apply nonqualifying reporting regression overlay
      shell: bash
      run: "set -euo pipefail\npython3 <<'PY'\nimport os,json,pathlib,hashlib,subprocess\nall_records={'reporter-before':\
        \ [{'path': 'src/gateway/server-plugin-reload.memory.test-support.ts', 'beforeSha256': 'e80f7dbe6955f451bd2263ff696e214a0de86f0a7355f602b1e7bdea5e64fc64',\
        \ 'afterSha256': 'd3bfb54da64f6665f5d419f66f762c16b1a43eae4778d439b026e15fb0dc51e9', 'content': 'import assert from\
        \ \"node:assert/strict\";\\nimport { AsyncLocalStorage } from \"node:async_hooks\";\\nimport fs from \"node:fs/promises\"\
        ;\\nimport path from \"node:path\";\\nimport { expect, vi } from \"vitest\";\\nimport {\\n  buildFileEntry,\\n  buildMultimodalChunkForIndexing,\\\
        n  listMemoryFiles,\\n} from \"../../packages/memory-host-sdk/src/host/internal.js\";\\nimport { readMemoryFile }\
        \ from \"../../packages/memory-host-sdk/src/host/read-file.js\";\\nimport { awaitGateBeforeSettlement, withinTest\
        \ } from \"../../test/helpers/promise.js\";\\nimport { registerAgentWorkspaceAccess } from \"../agents/workspace-access.js\"\
        ;\\nimport type { OpenClawConfig } from \"../config/types.openclaw.js\";\\nimport { memoryStopDiagnosticLog } from\
        \ \"../plugins/services.js\";\\nimport { getMemoryEmbeddingProvider } from \"../plugins/memory-embedding-provider-runtime.js\"\
        ;\\nimport { PluginInstanceUnavailableError } from \"../plugins/plugin-instance-error.js\";\\nimport { getPluginInstance,\
        \ getPluginOriginalValue } from \"../plugins/plugin-instance-scope.js\";\\nimport type {\\n  MemoryPluginRuntime,\\\
        n  RegisteredMemorySearchManager,\\n} from \"../plugins/registry-contribution-types.js\";\\nimport { createPluginRegistry\
        \ } from \"../plugins/registry.js\";\\nimport { disposePluginRegistryInstances } from \"../plugins/runtime.js\";\\\
        nimport {\\n  getPluginRuntimeGatewayRequestScope,\\n  withPluginRuntimeRegistryScope,\\n} from \"../plugins/runtime/gateway-request-scope.js\"\
        ;\\nimport { createPluginRuntime } from \"../plugins/runtime/index.js\";\\nimport { createPluginRecord } from \"../plugins/status.test-helpers.js\"\
        ;\\nimport type { OpenClawPluginApi } from \"../plugins/types.js\";\\nimport { createDeferredCore } from \"../shared/deferred.js\"\
        ;\\nimport { resolveRelativeBundledPluginPublicModuleId } from \"../test-utils/bundled-plugin-public-surface.js\"\
        ;\\nimport { createOpenClawTestState } from \"../test-utils/openclaw-test-state.js\";\\nimport type { createPluginReloadRecoveryFixture\
        \ } from \"./server-plugin-reload.recovery.test-support.js\";\\n\\nconst { createMemoryRuntime, configureMemoryCoreDreamingState\
        \ } = await vi.importActual<{\\n  configureMemoryCoreDreamingState: (\\n    open: OpenClawPluginApi[\"runtime\"][\"\
        state\"][\"openKeyedStore\"],\\n  ) => void;\\n  createMemoryRuntime: (host: {\\n    runInBackgroundContext: <T>(run:\
        \ () => T) => T;\\n  }) => MemoryPluginRuntime;\\n}>(\\n  resolveRelativeBundledPluginPublicModuleId({\\n    fromModuleUrl:\
        \ import.meta.url,\\n    pluginId: \"memory-core\",\\n    artifactBasename: \"runtime-api.js\",\\n  }),\\n);\\n\\\
        nexport async function verifyGatewayMemoryReplacement(\\n  createRecoveryFixture: (\\n    options: Parameters<typeof\
        \ createPluginReloadRecoveryFixture>[1],\\n  ) => ReturnType<typeof createPluginReloadRecoveryFixture>,\\n  mode:\
        \ \"held-close\" | \"failed-close\",\\n) {\\n  const state = await createOpenClawTestState({\\n    scenario: \"minimal\"\
        ,\\n    label: \"gateway-memory-reload\",\\n  });\\n  const providerId = \"gateway-memory-probe\";\\n  const config:\
        \ OpenClawConfig = {\\n    plugins: { allow: [\"first\", \"sibling\"], slots: { memory: \"sibling\" } },\\n    agents:\
        \ { defaults: { workspace: state.workspaceDir } },\\n    memory: {\\n      search: {\\n        provider: providerId,\\\
        n        model: \"synthetic-embedding\",\\n        fallback: \"none\",\\n        store: { vector: { enabled: false\
        \ } },\\n      },\\n    },\\n  };\\n  const entered = createDeferredCore();\\n  const release = createDeferredCore();\\\
        n  const events: string[] = [];\\n  let refuseClose = mode === \"failed-close\";\\n  let generations = 0;\\n  const\
        \ created: number[] = [];\\n  const embedding = (close: () => Promise<void>) => ({\\n    id: providerId,\\n    model:\
        \ \"synthetic-embedding\",\\n    embed: async () => [1, 0, 0],\\n    embedBatch: async () => [[1, 0, 0]],\\n    close,\\\
        n  });\\n  const close = vi.fn(async () => {\\n    const instance = getPluginInstance(fixture.previousRegistry.plugins[0]!);\\\
        n    expect(instance?.lifecycle.signal.aborted).toBe(false);\\n    expect(getPluginRuntimeGatewayRequestScope()?.pluginId).toBe(\"\
        first\");\\n    events.push(\"close:start\");\\n    entered.resolve();\\n    if (refuseClose) {\\n      throw new\
        \ Error(\"memory provider cleanup refused\");\\n    }\\n    if (mode === \"held-close\") {\\n      await release.promise;\\\
        n    }\\n    events.push(\"close:end\");\\n  });\\n  const fixture = await createRecoveryFixture({\\n    config,\\\
        n    abortOnCandidateStart: false,\\n    register(api, owner, record) {\\n      if (owner === \"sibling\") {\\n  \
        \      record.kind = \"memory\";\\n        record.memorySlotSelected = true;\\n        assert(api.lifecycle.runInBackgroundContext);\\\
        n        api.registerMemoryCapability({\\n          runtime: createMemoryRuntime({\\n            runInBackgroundContext:\
        \ api.lifecycle.runInBackgroundContext,\\n          }),\\n        });\\n      } else {\\n        record.contracts\
