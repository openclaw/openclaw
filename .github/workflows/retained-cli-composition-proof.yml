name: "UI publication targeted diagnostic v2 \u2014 not qualification"
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ui-publication-diagnostic-v2
  cancel-in-progress: false
env:
  CI: 'true'
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: '300000'
  OPENCLAW_BUILD_PRIVATE_QA: '1'
  OPENCLAW_UI_PUBLICATION_DIAGNOSTIC: '1'
jobs:
  model-picker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANE: model-picker
      PRIVATE_PROOF: ${{ github.workspace }}/../ui-publication-private/model-picker
      SAFE_PROOF: ${{ github.workspace }}-ui-publication-safe/model-picker
      OPENCLAW_UI_E2E_ARTIFACT_DIR: ${{ github.workspace }}/../ui-publication-private/model-picker/ui-artifacts
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: c24cc3d81fcf6afc68b6a489602ed2848f958b71
        persist-credentials: false
        fetch-depth: 1
    - name: Initialize private evidence directories
      shell: bash
      run: 'set -euo pipefail

        umask 077

        mkdir -p "$PRIVATE_PROOF" "$SAFE_PROOF"

        '
    - name: Transport hosted.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/hosted.py.b64"

        '
    - name: Verify hosted.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/hosted.py.b64" > "$PRIVATE_PROOF/hosted.py"

        printf ''%s\n'' ''e5b91d1ab3785fca6426e489db2131c97a3484c65618139b81cfd98217e40ec5  ''"$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        '
    - name: Transport containment.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/containment.py.b64"

        '
    - name: Verify containment.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/containment.py.b64" > "$PRIVATE_PROOF/containment.py"

        printf ''%s\n'' ''f8d859f25661719c3dcbf8d3e503e9399b2f6f1526f0128a7da228f1de385c79  ''"$PRIVATE_PROOF/containment.py" | sha256sum --check --strict

        '
    - name: Transport proof_data.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/proof_data.py.b64"

        '
    - name: Verify proof_data.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/proof_data.py.b64" > "$PRIVATE_PROOF/proof_data.py"

        printf ''%s\n'' ''64138c3245972ac59442100f5a7571a97eaf69238476dcb63b4f9708206f6d61  ''"$PRIVATE_PROOF/proof_data.py" | sha256sum --check --strict

        '
    - name: Transport diagnostic_data.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/diagnostic_data.py.b64"

        '
    - name: Verify diagnostic_data.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/diagnostic_data.py.b64" > "$PRIVATE_PROOF/diagnostic_data.py"

        printf ''%s\n'' ''871695621432c62939c562aad46e078a56d9cc1b6a3ea3323e7327a41bde4edb  ''"$PRIVATE_PROOF/diagnostic_data.py" | sha256sum --check --strict

        '
    - name: Transport manifest.json 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Verify manifest.json transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/manifest.json.b64" > "$PRIVATE_PROOF/manifest.json"

        printf ''%s\n'' ''409ebfb3529e7455a7dd6756c129f78734eff96903c0b91b3bebc0ebbc72501c  ''"$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        '
    - name: Transport diagnostic-only.patch 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/diagnostic-only.patch.b64"

        '
    - name: Transport diagnostic-only.patch 2
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/diagnostic-only.patch.b64"

        '
    - name: Verify diagnostic-only.patch transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/diagnostic-only.patch.b64" > "$PRIVATE_PROOF/diagnostic-only.patch"

        printf ''%s\n'' ''9fd791d801b0dd7b480c076b462ec9ab769479c7c19d5a817d7b3225b58a0fd7  ''"$PRIVATE_PROOF/diagnostic-only.patch" | sha256sum --check --strict

        '
    - name: Bind exact candidate and diagnostic overlay
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Collect exact model-picker diagnostic
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/hosted.py" run

        '
    - name: Upload exact safe model-picker evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ui-publication-model-picker-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ github.workspace }}-ui-publication-safe/model-picker/identity.json

          ${{ github.workspace }}-ui-publication-safe/model-picker/report.json

          ${{ github.workspace }}-ui-publication-safe/model-picker/diagnostics.json

          ${{ github.workspace }}-ui-publication-safe/model-picker/native-status.json'
        if-no-files-found: error
        retention-days: 14
  cron-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANE: cron-catalog
      PRIVATE_PROOF: ${{ github.workspace }}/../ui-publication-private/cron-catalog
