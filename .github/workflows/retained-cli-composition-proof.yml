name: Paired delegation binding repair diagnostic
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane:
        - baseline
        - repaired
    env:
      CI: 'true'
      PROOF_LANE: ${{ matrix.lane }}
      SAFE_PROOF: .artifacts/delegation-binding-repair
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: c89139757f2c6728863a740309027562004163f8
        persist-credentials: false
        fetch-depth: 1
      timeout-minutes: 4
    - name: Bind clean candidate and exact lane patch
      shell: bash
      run: 'set -euo pipefail

        export PRIVATE_PROOF="$RUNNER_TEMP/delegation-binding-repair"

        mkdir -p "$PRIVATE_PROOF"

        printf %s  | base64 --decode > "$PRIVATE_PROOF/hosted.py"

        echo 88226c6c01b9831c5a9c92119d55aac2f93e105fdf59a35f30deccf96443db88  "$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        printf %s  | base64 --decode > "$PRIVATE_PROOF/verify_results.py"

        echo 72048764b6db26c305d0bdc335f2cda85a628ebbfd1dd49d5ebc13cbbe3a638e  "$PRIVATE_PROOF/verify_results.py" | sha256sum --check --strict

        printf %s  | base64 --decode > "$PRIVATE_PROOF/failure_details.py"

        echo 08aeb8af92f7851107bfba8fde679bed0b83d8d51d99648beef297688dcef2ee  "$PRIVATE_PROOF/failure_details.py" | sha256sum --check --strict

        case "$PROOF_LANE" in

        baseline)

        printf %s  | base64 --decode > "$PRIVATE_PROOF/manifest.json"

        echo 1d8c9279ea0eb63103650a0e420f9dae7e828409df3ea5d09d829aa4f6e5f99f  "$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        printf %s  | base64 --decode > "$PRIVATE_PROOF/proposed.patch"

        echo d884610c03e4d77f70c0ec33716b607464ec1a77ebbc6e7de013b05c8c03d3e9  "$PRIVATE_PROOF/proposed.patch" | sha256sum --check --strict

        ;;

        repaired)

        printf %s  | base64 --decode > "$PRIVATE_PROOF/manifest.json"

        echo 49c5939d1a33f0f9dd39ae3fc63c98ff7af56cbb000820d02ae51fd7c3fc9523  "$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        printf %s  | base64 --decode > "$PRIVATE_PROOF/proposed.patch"

        echo fe1d10f0ef68b35ffeab8ee87e962ac5a49d09b93a2bee6c5d19bf0cfb61843d  "$PRIVATE_PROOF/proposed.patch" | sha256sum --check --strict

        ;;

        *) exit 1 ;;

        esac

        python3 "$PRIVATE_PROOF/hosted.py" bind'
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
      timeout-minutes: 4
    - uses: ./.github/actions/setup-test-bun
      timeout-minutes: 4
    - name: Run same three diagnostic cases with lane patch
      shell: bash
      timeout-minutes: 6
      run: export PRIVATE_PROOF="$RUNNER_TEMP/delegation-binding-repair"; python3 "$PRIVATE_PROOF/hosted.py" run
    - name: Finalize without promoting diagnostic failure
      if: always()
      shell: bash
      run: export PRIVATE_PROOF="$RUNNER_TEMP/delegation-binding-repair"; if [ -f "$PRIVATE_PROOF/hosted.py" ]; then python3 "$PRIVATE_PROOF/hosted.py" finalize; fi
    - name: Upload only safe lane evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: delegation-binding-repair-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/delegation-binding-repair/identity.json

          .artifacts/delegation-binding-repair/report.json

          .artifacts/delegation-binding-repair/tests.json'
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 7
