name: Release 11a bounded performance attribution (NOT qualification)
run-name: 11a Kova Beam attribution ${{ github.run_id }}
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-11a-performance-attribution
  cancel-in-progress: false
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CANDIDATE_SHA: 11a0a9680d22977f0570409dbe8016c85a1ec3fd
  SOURCE_TREE: 66430b2810752b2d6e43f6df8849607cf289c53c
  PUBLISHER_SHA: 514a224c6eab039a926e4c47b22bb42e51484408
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
  KOVA_REPOSITORY: openclaw/Kova
  KOVA_REF: 8c8764f443ecc703ec6d035fc322c2b0b3c9e96b
  OCM_VERSION: v0.2.48
  OCM_LINUX_X64_SHA256: d0bdb49d69fa8bf3c3487ff04f4be82126828876f81690afdc002c427e22c1ac
jobs:
  diagnostic:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
    - name: Prepare Git owner
      uses: openclaw/openclaw/.github/actions/git-owner@a379bbd73e30b84a89aca4d54744ab9ca19082e7
    - name: Checkout immutable candidate
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 11a0a9680d22977f0570409dbe8016c85a1ec3fd
        fetch-depth: 1
        persist-credentials: false
    - name: Stage bounded gzip-base64 diagnostic payload
      id: stage
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
        test -z "$(git status --porcelain --untracked-files=no)"
        python3 - <<'PY'
        import base64,gzip,hashlib,json,os,pathlib
        p=pathlib.Path(os.environ['PREP_DIR']);p.mkdir(parents=True)
        blobs={'run-hosted.sh': '', 'beam-observer.patch': '', 'export-safe.py': '', 'finalize-safe.py': '', 'manifest.json': ''}
        for name,encoded in blobs.items():
            (p/name).write_bytes(gzip.decompress(base64.b64decode(encoded,validate=True)))
        PY
      env:
        PREP_DIR: ${{ runner.temp }}/attribution-prep
        KOVA_HOME: ${{ runner.temp }}/attribution-home/kova
    - name: Bind source and verify diagnostic payload hashes
      id: bind
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
        test -z "$(git status --porcelain --untracked-files=no)"
        python3 - <<'PY'
        import hashlib,json,os,pathlib
        p=pathlib.Path(os.environ['PREP_DIR'])
        assert hashlib.sha256((p/'manifest.json').read_bytes()).hexdigest()=='5faf9cbea841fbcb68f6b96923362787cbc99f9c641609c99e67bacda96f2721'
        m=json.loads((p/'manifest.json').read_text())
        assert all(hashlib.sha256((p/name).read_bytes()).hexdigest()==expected for name,expected in m['payloads'].items())
        e=pathlib.Path(os.environ['RUNNER_TEMP'])/'attribution-egress';e.mkdir()
        (e/'identity-before.json').write_text(json.dumps({'candidate':m['candidate'],'publisher':m['publisher'],'sourceTree':m['sourceTree'],'payloads':m['payloads'],'manifestSha256':'5faf9cbea841fbcb68f6b96923362787cbc99f9c641609c99e67bacda96f2721','workflowSha':os.environ['WORKFLOW_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'qualification':False},indent=2))
        PY
      env:
        PREP_DIR: ${{ runner.temp }}/attribution-prep
        KOVA_HOME: ${{ runner.temp }}/attribution-home/kova
    - name: Frozen Node dependencies and managed systemd setup
      id: setup
      timeout-minutes: 10
      uses: ./.github/actions/setup-node-env
      with:
        node-version: 24.22.1
        semantic-checks: 'true'
        cache-mode: 'off'
        install-bun: 'false'
        frozen-lockfile: 'true'
    - name: Install OCM and Kova
      env:
        GH_TOKEN: ${{ github.token }}
        PREP_DIR: ${{ runner.temp }}/attribution-prep
        KOVA_HOME: ${{ runner.temp }}/attribution-home/kova
      shell: bash
      run: |
        set -euo pipefail
        KOVA_SRC="${RUNNER_TEMP}/kova-src"
        echo "KOVA_SRC=$KOVA_SRC" >> "$GITHUB_ENV"
        mkdir -p "$HOME/.local/bin" "$(dirname "$KOVA_SRC")" "${RUNNER_TEMP}/ocm-install"

        ocm_archive="${RUNNER_TEMP}/ocm-${OCM_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
        # retry-max-time only gates new retries; cap an active transfer separately
        # so a stalled release asset cannot consume the entire Kova job deadline.
        curl -fsSL --proto '=https' --tlsv1.2 \
          --max-time 180 \
          --retry 8 --retry-max-time 180 --retry-all-errors --retry-connrefused \
          -o "$ocm_archive" \
          "https://github.com/openclaw/ocm/releases/download/${OCM_VERSION}/ocm-x86_64-unknown-linux-gnu.tar.gz"
        echo "${OCM_LINUX_X64_SHA256}  ${ocm_archive}" | sha256sum -c -
        tar -xzf "$ocm_archive" -C "${RUNNER_TEMP}/ocm-install"
        install -m 0755 "${RUNNER_TEMP}/ocm-install/ocm" "$HOME/.local/bin/ocm"

        python3 -I -S "$CI_GIT_OWNER" --policy - "$KOVA_SRC" <<'PYTHON'
        import base64
        import os
        import sys
        from ci_git_owner import checkout_environment, fetch, fetch_timeout_seconds, git_auth_environment, run_git

        remote = f"https://github.com/{os.environ['KOVA_REPOSITORY']}.git"
        token = os.environ.pop("GH_TOKEN")
        print("::add-mask::" + base64.b64encode(f"x-access-token:{token}".encode()).decode(), flush=True)
        checkout_environment.update(git_auth_environment(remote, token))
        del token
        source = sys.argv[3]
        os.makedirs(source, exist_ok=True)
        run_git(source, "init", "-b", "main")
        run_git(source, "remote", "add", "origin", remote)
        fetch(source, os.environ["KOVA_REF"], blobless=True, max_attempts=3, retry_failures=True)
        # Filtered checkout can fetch promised blobs; retain process-only auth
        # and the network deadline until the complete worktree is available.
        run_git(source, "checkout", "--detach", "FETCH_HEAD", timeout=fetch_timeout_seconds)
        PYTHON
        unset GH_TOKEN
        npm --prefix "$KOVA_SRC" ci --ignore-scripts --no-audit --no-fund
        node - "$KOVA_SRC" <<'NODE'
        const fs = require("node:fs");
        const path = require("node:path");

        const root = process.argv[2];
        const packageJsonPath = require.resolve("mock-ai-provider/package.json", {
          paths: [root],
        });
        const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, "utf8"));
        const bin =
          typeof packageJson.bin === "string"
            ? packageJson.bin
            : packageJson.bin?.["mock-ai-provider"];
        if (typeof bin !== "string" || bin.length === 0) {
          throw new Error("mock-ai-provider does not declare its CLI entrypoint");
        }
        fs.accessSync(path.resolve(path.dirname(packageJsonPath), bin), fs.constants.R_OK);
        fs.accessSync(
          path.join(root, "node_modules", ".bin", "mock-ai-provider"),
          fs.constants.X_OK,
        );
        require.resolve("zod", { paths: [root] });
        NODE
        cat > "$HOME/.local/bin/kova" <<EOF
        #!/usr/bin/env bash
        export KOVA_HOME="${KOVA_HOME}"
        exec node "${KOVA_SRC}/bin/kova.mjs" "\$@"
        EOF
        chmod 0755 "$HOME/.local/bin/kova"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      id: install
      timeout-minutes: 5
    - name: Two profiled samples and Beam exit observer
      id: workload
      timeout-minutes: 38
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test "$(node --version)" = v24.22.1
        systemctl --user show-environment >/dev/null
        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
        test -z "$(git status --porcelain --untracked-files=no)"
        mkdir -p "$RUNNER_TEMP/attribution-home"
        # No Actions tokens, auth, inherited NODE_OPTIONS or user config enter the workload.
        env -i HOME="$RUNNER_TEMP/attribution-home" PATH="$PATH" CI=true   XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-}"   KOVA_SRC="$KOVA_SRC" PREP_DIR="$PREP_DIR" GITHUB_WORKSPACE="$GITHUB_WORKSPACE"   PNPM_CONFIG_FROZEN_LOCKFILE=true   bash "$PREP_DIR/run-hosted.sh"
      env:
        PREP_DIR: ${{ runner.temp }}/attribution-prep
        KOVA_HOME: ${{ runner.temp }}/attribution-home/kova
    - name: Always bind final source and project safe artifacts
      id: finalize
      if: always() && steps.bind.outcome == 'success'
      timeout-minutes: 2
      shell: bash
      env:
        SETUP_OUTCOME: ${{ steps.setup.outcome }}
        INSTALL_OUTCOME: ${{ steps.install.outcome }}
        WORKLOAD_OUTCOME: ${{ steps.workload.outcome }}
        PREP_DIR: ${{ runner.temp }}/attribution-prep
        KOVA_HOME: ${{ runner.temp }}/attribution-home/kova
      run: python3 "$PREP_DIR/finalize-safe.py"
    - name: Always collect only explicitly allowlisted evidence
      if: always()
      timeout-minutes: 2
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: attribution-11a-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          ${{ runner.temp }}/attribution-egress/identity-before.json
          ${{ runner.temp }}/attribution-egress/identity-after.json
          ${{ runner.temp }}/attribution-egress/summary.json
          ${{ runner.temp }}/attribution-egress/kova-exit-code.txt
          ${{ runner.temp }}/attribution-egress/beam-exit-code.txt
          ${{ runner.temp }}/attribution-egress/beam-os/import-exit-*.txt
        if-no-files-found: error
        retention-days: 7
