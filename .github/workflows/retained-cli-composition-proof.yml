name: Release Compiler Delegation Prerequisite Diagnostic
on:
  workflow_dispatch:
    inputs:
      static_only:
        description: Recover only static checks for the same bound source
        type: boolean
        default: false
      target_ref:
        description: Exact reviewed release backport commit (must equal CANDIDATE_SHA)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: compiler-delegation-targeted-${{ inputs.target_ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Prerequisite diagnostic only; not final C/Q/P or Full Release Validation.
  BASE_SHA: 1a4aebe30bac1a4cc33410c2c4790d8dbe3ca732
  CANDIDATE_SHA: db633cbcc3c95a0ce67b5bf12e2fdcc7b0c4d618
  SOURCE_TREE: 51e674cbb705bdd672b3fc619ea6b0fe868a626c
  PATCH_SHA256: 48ee8fef0385741e8a719b256d00c7105cc8a5771a28ba5e27b3a7c37f2c549b
  MAIN_PROVENANCE: ff148c221cf59a377331815c632f908482bc7e77
  WORKFLOW_PATH: .github/workflows/retained-cli-composition-proof.yml
jobs:
  tests:
    if: ${{ !inputs.static_only }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        revision: [before, after]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROOF_LANE: tests-${{ matrix.revision }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false
      - &bind
        id: bind
        name: Bind reviewed source and evidence
        env:
          TARGET_SHA: ${{ inputs.target_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          evidence=.artifacts/compiler-delegation
          mkdir -p "$evidence"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$TARGET_SHA" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(git rev-parse HEAD^)" = 6d20d6026844359417e196606b19855f809de958
          test "$(git rev-parse HEAD~2)" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA..HEAD")" = 2
          test -z "$(git status --porcelain)"
          git diff --name-only "$BASE_SHA" HEAD > "$evidence/changed-paths.txt"
          cat > "$evidence/expected-paths.txt" <<'PATHS'
          docs/ci/local-proof.md
          scripts/check-changed.mts
          scripts/ci-check-plan.mts
          test/scripts/changed-lanes.test.ts
          test/scripts/check-changed-compiler-delegation.test.ts
          test/scripts/ci-workflow-manifest.test-support.ts
          PATHS
          cmp "$evidence/expected-paths.txt" "$evidence/changed-paths.txt"
          git diff --no-ext-diff --no-textconv --no-renames --binary --full-index "$BASE_SHA" HEAD > "$evidence/source.patch"
          echo "$PATCH_SHA256  $evidence/source.patch" | sha256sum --check --strict
          git ls-tree -r HEAD -- $(cat "$evidence/expected-paths.txt") > "$evidence/source-blobs.txt"
          git show "$WORKFLOW_SHA:$WORKFLOW_PATH" > "$evidence/workflow.yml"
          printf 'candidate=%s\nbase=%s\ntree=%s\npatch_sha256=%s\nmain_provenance=%s\nscope=prerequisite-diagnostic-only-not-final-C-Q-P-FRV\nworkflow=%s\nrun=%s\nattempt=%s\nlane=%s\n' "$CANDIDATE_SHA" "$BASE_SHA" "$SOURCE_TREE" "$PATCH_SHA256" "$MAIN_PROVENANCE" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PROOF_LANE" > "$evidence/identity.txt"
      - &select
        name: Select bound revision
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          if [[ "$REVISION" == before ]]; then
            git switch --detach "$BASE_SHA"
          else
            test "$REVISION" = after
          fi
          printf 'execution_commit=%s\nexecution_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" >> .artifacts/compiler-delegation/identity.txt
      - &setup
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          install-bun: "false"
          cache-mode: "restore"
      - &bun
        id: bun
        uses: ./.github/actions/setup-test-bun
      - &ripgrep
        id: ripgrep
        uses: ./.github/actions/setup-ripgrep
      - name: BEFORE isolated regression inputs
        if: matrix.revision == 'before'
        run: |
          set -euo pipefail
          file=test/scripts/check-changed-compiler-delegation.test.ts
          git show "$CANDIDATE_SHA:$file" > "$file"
          cmp <(git show "$CANDIDATE_SHA:$file") "$file"
          git diff --quiet
          test "$(git status --porcelain -- "$file")" = "?? $file"
          test "$(git status --porcelain --untracked-files=all | grep -v '^?? .artifacts/' | wc -l)" -eq 1
          git status --porcelain --untracked-files=all > .artifacts/compiler-delegation/before-overlay-status.txt
          sha256sum "$file" > .artifacts/compiler-delegation/before-overlay-sha256.txt
      - name: BEFORE exact missing API and flag proof
        if: matrix.revision == 'before'
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/.artifacts/compiler-delegation"
          set +e
          node scripts/test-projects.mts test/scripts/check-changed-compiler-delegation.test.ts -- --maxWorkers=1 --testNamePattern='^delegates only mapped compiler commands for ' --reporter=default --reporter=json --outputFile="$evidence/tests.json" 2>&1 | tee "$evidence/tests.log"
          codes=("${PIPESTATUS[@]}")
          test_code=${codes[0]}
          set -e
          test "${codes[1]}" -eq 0
          if (( test_code == 124 || test_code >= 128 )); then exit "$test_code"; fi
          set +e
          node scripts/check-changed.mjs --delegate-compilers --dry-run --paths-from-git -- docs/ci/local-proof.md > "$evidence/cli.log" 2>&1
          cli_code=$?
          set -e
          printf '%s\n' "$test_code" > "$evidence/test-exit.txt"
          printf '%s\n' "$cli_code" > "$evidence/cli-exit.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const root = '.artifacts/compiler-delegation/';
          const report = JSON.parse(fs.readFileSync(root + 'tests.json', 'utf8'));
          assert.equal(fs.readFileSync(root + 'test-exit.txt', 'utf8').trim(), '1');
          assert.equal(report.numFailedTests, 2);
          assert.equal(report.numPassedTests, 0);
          assert.equal(report.numFailedTestSuites, 1);
          assert.equal(report.numRuntimeErrorTestSuites ?? 0, 0);
          const suites = report.testResults.filter(item => item.name.replaceAll(String.fromCharCode(92), '/').endsWith('/test/scripts/check-changed-compiler-delegation.test.ts'));
          assert.equal(suites.length, 1);
          const failed = suites[0].assertionResults.filter(item => item.status === 'failed');
          assert.equal(report.numTotalTestSuites, 1);
          assert.equal(suites[0].message, '');
          const selected = suites[0].assertionResults.filter(item => item.title.startsWith('delegates only mapped compiler commands for '));
          assert.equal(selected.length, 2);
          assert.equal(failed.length, 2);
          assert.equal(new Set(failed.map(item => item.fullName)).size, 2);
          for (const item of selected) {
            assert.equal(item.status, 'failed');
            assert.equal(item.failureMessages.length, 1);
            assert.match(item.failureMessages[0], /expected undefined to deeply equal \[\]/);
            // The exact overlaid source first reads the absent property at line 39.
            assert.match(item.failureMessages[0], /check-changed-compiler-delegation\.test\.ts:39:\d+/);
          }
          assert.equal(fs.readFileSync(root + 'cli-exit.txt', 'utf8').trim(), '1');
          assert.equal(fs.readFileSync(root + 'cli.log', 'utf8').trim(), 'Unknown option: --delegate-compilers\n[check:changed] FAILED (exit 1)');
          fs.writeFileSync(root + 'classification.json', JSON.stringify({ expectedRegression: true, failedDelegateCases: 2, api: 'missing delegatedTypeGraphs', cli: 'unknown --delegate-compilers', setupFailureAccepted: false }, null, 2) + '\n');
          NODE
      - name: AFTER touched and sibling owner suites
        if: matrix.revision == 'after'
        env:
          OPENCLAW_NODE_TEST_PLAN_CONTINUE_ON_FAILURE: "1"
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/.artifacts/compiler-delegation"
          cat > "$evidence/test-paths.txt" <<'PATHS'
          test/scripts/check-changed-compiler-delegation.test.ts
          test/scripts/changed-lanes.test.ts
          test/scripts/changed-lanes-env-budget.test.ts
          test/scripts/changed-lanes-generated-extension-lint.test.ts
          test/scripts/changed-lanes.format-argv.test.ts
          test/scripts/changed-lanes.stylelint.test.ts
          test/scripts/changed-lanes.max-lines.test.ts
          test/scripts/check-changed-delegation.test.ts
          test/scripts/check-changed-cancellation.test.ts
          test/scripts/ci-check-plan.test.ts
          test/scripts/ci-collect-checks.test.ts
          test/scripts/tsgo-core-test-shards.test.ts
          test/scripts/tsgo-shard-cancellation.test.ts
          test/scripts/tsgo-ci-continuation.test.ts
          PATHS
          mapfile -t tests < "$evidence/test-paths.txt"
          test "${#tests[@]}" -eq 14
          set +e
          node scripts/test-projects.mts "${tests[@]}" -- --maxWorkers=1 --reporter=default --reporter=json --outputFile="$evidence/tests.json" 2>&1 | tee "$evidence/tests.log"
          codes=("${PIPESTATUS[@]}")
          code=${codes[0]}
          set -e
          test "${codes[1]}" -eq 0
          printf '%s\n' "$code" > "$evidence/test-exit.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const root = '.artifacts/compiler-delegation/';
          assert.equal(fs.readFileSync(root + 'test-exit.txt', 'utf8').trim(), '0');
          const report = JSON.parse(fs.readFileSync(root + 'tests.json', 'utf8'));
          assert.equal(report.numFailedTests, 0);
          assert.equal(report.numFailedTestSuites, 0);
          assert.equal(report.numRuntimeErrorTestSuites ?? 0, 0);
          const selected = fs.readFileSync(root + 'test-paths.txt', 'utf8').trim().split('\n');
          assert.equal(selected.length, 14);
          for (const file of selected) {
            const matches = report.testResults.filter(item => item.name.replaceAll(String.fromCharCode(92), '/').endsWith('/' + file));
            assert.equal(matches.length, 1, file);
            assert(matches[0].assertionResults.some(item => item.status === 'passed'), file + ': no passed cases');
            assert(matches[0].assertionResults.every(item => ['passed', 'pending', 'skipped', 'todo', 'disabled'].includes(item.status)), file + ': failed cases');
          }
          fs.writeFileSync(root + 'classification.json', JSON.stringify({ passedSelectedSuites: selected }, null, 2) + '\n');
          NODE
      - &hashes
        name: Record complete evidence hashes
        if: always()
        run: |
          set -euo pipefail
          if test -d .artifacts/compiler-delegation; then
            (cd .artifacts/compiler-delegation && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
          fi
      - &upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: compiler-delegation-${{ env.PROOF_LANE }}-${{ inputs.target_ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/compiler-delegation/
          if-no-files-found: error
          retention-days: 14
  types:
    if: ${{ !inputs.static_only }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        revision: [before, after]
        graph: [scripts, root-stripe-1, root-stripe-2]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROOF_LANE: types-${{ matrix.revision }}-${{ matrix.graph }}
    steps:
      - *checkout
      - *bind
      - *select
      - *setup
      - *bun
      - *ripgrep
      - name: Run release-native scripts graph or root stripe
        env:
          GRAPH: ${{ matrix.graph }}
        run: |
          set -euo pipefail
          evidence=.artifacts/compiler-delegation
          case "$GRAPH" in
            scripts) args=(--ci-graphs-json '["scripts"]') ;;
            root-stripe-1) args=(--root-stripe 1/4) ;;
            root-stripe-2) args=(--root-stripe 2/4) ;;
            *) echo "Unexpected compiler lane: $GRAPH" >&2; exit 1 ;;
          esac
          printf '%s\n' "${args[@]}" > "$evidence/type-args.txt"
          set +e
          node scripts/run-tsgo-core-test-shards.mjs "${args[@]}" 2>&1 | tee "$evidence/types.log"
          codes=("${PIPESTATUS[@]}")
          code=${codes[0]}
          set -e
          test "${codes[1]}" -eq 0
          printf '%s\n' "$code" > "$evidence/types-exit.txt"
          exit "$code"
      - *hashes
      - *upload
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROOF_LANE: static-after
    steps:
      - *checkout
      - *bind
      - *setup
      - *bun
      - *ripgrep
      - id: static_checks
        name: Targeted lint, format, script syntax and docs sanity
        run: |
          set -euo pipefail
          trap 'code=$?; if (( code == 124 || code >= 128 )); then echo stopped=true >> "$GITHUB_OUTPUT"; fi; exit "$code"' EXIT
          source scripts/ci-collect-checks.sh
          {
            run_check format pnpm exec oxfmt --check scripts/check-changed.mts scripts/ci-check-plan.mts test/scripts/changed-lanes.test.ts test/scripts/check-changed-compiler-delegation.test.ts test/scripts/ci-workflow-manifest.test-support.ts docs/ci/local-proof.md
            run_check script-lint node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.scripts.json scripts/check-changed.mts scripts/ci-check-plan.mts
            run_check test-lint node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.test.root.json test/scripts/changed-lanes.test.ts test/scripts/check-changed-compiler-delegation.test.ts test/scripts/ci-workflow-manifest.test-support.ts
            run_check script-erasability pnpm check:script-erasability
            run_check docs-mdx node scripts/check-docs-mdx.mjs docs/ci/local-proof.md --json-out .artifacts/compiler-delegation/docs-mdx.json
            run_check docs-links pnpm docs:check-links
            run_check patch-whitespace git diff --check "$BASE_SHA" HEAD
            finish_checks
          } 2>&1 | tee .artifacts/compiler-delegation/static.log
      - name: Emit canonical formatting repair for exact integration
        if: ${{ always() && !cancelled() && steps.bind.outcome == 'success' && steps.setup.outcome == 'success' && steps.bun.outcome == 'success' && steps.ripgrep.outcome == 'success' && (steps.static_checks.outcome == 'success' || steps.static_checks.outcome == 'failure') && steps.static_checks.outputs.stopped != 'true' }}
        env:
          OPENCLAW_FORMAT_TOOL: oxfmt
          INPUT_CHECKS_OUTCOME: ${{ steps.static_checks.outcome }}
        run: |
          set -euo pipefail
          evidence=.artifacts/compiler-delegation
          git diff --quiet
          mapfile -t files < "$evidence/expected-paths.txt"
          set +e
          pnpm exec oxfmt --write --threads=1 "${files[@]}" 2>&1 | tee "$evidence/formatter-write.log"
          write_status=("${PIPESTATUS[@]}")
          pnpm exec oxfmt --check "${files[@]}" 2>&1 | tee "$evidence/formatter-parity.log"
          parity_status=("${PIPESTATUS[@]}")
          set -e
          printf 'write_exit=%s\nwrite_log_exit=%s\nparity_exit=%s\nparity_log_exit=%s\ninput_checks_outcome=%s\n' "${write_status[0]}" "${write_status[1]}" "${parity_status[0]}" "${parity_status[1]}" "$INPUT_CHECKS_OUTCOME" > "$evidence/formatter-status.txt"
          git diff --name-only HEAD > "$evidence/formatted-paths.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read = name => fs.readFileSync('.artifacts/compiler-delegation/' + name, 'utf8').trim().split('\n').filter(Boolean);
          const allowed = new Set(read('expected-paths.txt'));
          for (const name of read('formatted-paths.txt')) assert(allowed.has(name), 'Unexpected formatting mutation: ' + name);
          NODE
          git diff --no-ext-diff --no-textconv --no-renames --binary --full-index HEAD > "$evidence/formatter.patch"
          git diff --check
          index="$RUNNER_TEMP/compiler-delegation-format.index"
          GIT_INDEX_FILE="$index" git read-tree HEAD
          GIT_INDEX_FILE="$index" git add -- "${files[@]}"
          GIT_INDEX_FILE="$index" git write-tree > "$evidence/formatted-tree.txt"
          GIT_INDEX_FILE="$index" git ls-files -s -- "${files[@]}" > "$evidence/formatted-blobs.txt"
          printf 'input_commit=%s\ninput_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$evidence/formatter-identity.txt"
          mkdir -p "$evidence/formatted-source"
          cp --parents -- "${files[@]}" "$evidence/formatted-source/"
          test "${write_status[0]}" -eq 0
          test "${write_status[1]}" -eq 0
          test "${parity_status[0]}" -eq 0
          test "${parity_status[1]}" -eq 0
      - *hashes
      - *upload
