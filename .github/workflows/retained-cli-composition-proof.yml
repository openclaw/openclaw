    - name: Transport manifest.json chunk 29
      shell: bash
      run: 'set -euo pipefail

        export PRIVATE_PROOF="$RUNNER_TEMP/delegation-followup"

        printf %s  >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport combined.patch chunk 1
      shell: bash
      run: 'set -euo pipefail

        export PRIVATE_PROOF="$RUNNER_TEMP/delegation-followup"

        printf %s  >> "$PRIVATE_PROOF/combined.patch.b64"

        '
    - name: Transport production.tsconfig.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        export PRIVATE_PROOF="$RUNNER_TEMP/delegation-followup"

        printf %s  >> "$PRIVATE_PROOF/production.tsconfig.json.b64"

        '
    - name: Verify decoded capsule and bind candidate
      shell: bash
      run: 'set -euo pipefail

        export PRIVATE_PROOF="$RUNNER_TEMP/delegation-followup"

        base64 --decode "$PRIVATE_PROOF/hosted.py.b64" | python3 -c "import lzma,sys;sys.stdout.buffer.write(lzma.decompress(sys.stdin.buffer.read()))" > "$PRIVATE_PROOF/hosted.py"

        echo 0091e88fa39e0c0e873217918445d914eae3f5c245c9ed1240dcf6b5df3347c9  "$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/results.py.b64" | python3 -c "import lzma,sys;sys.stdout.buffer.write(lzma.decompress(sys.stdin.buffer.read()))" > "$PRIVATE_PROOF/results.py"

        echo 625b47d631f7a5221f4b70c9312ec6715dd83db5b500f8103bdb03f79c3f65dc  "$PRIVATE_PROOF/results.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/diagnostics.py.b64" | python3 -c "import lzma,sys;sys.stdout.buffer.write(lzma.decompress(sys.stdin.buffer.read()))" > "$PRIVATE_PROOF/diagnostics.py"

        echo 371984306d5dfffe8320caa67f6bb9d8cf68524946f862420b497d3645169365  "$PRIVATE_PROOF/diagnostics.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/logs.py.b64" | python3 -c "import lzma,sys;sys.stdout.buffer.write(lzma.decompress(sys.stdin.buffer.read()))" > "$PRIVATE_PROOF/logs.py"

        echo 1babca0165d776ea806fd44ff95a67ec0ca18d5f2fd36b2820772f0864dbb1d9  "$PRIVATE_PROOF/logs.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/manifest.json.b64" | python3 -c "import lzma,sys;sys.stdout.buffer.write(lzma.decompress(sys.stdin.buffer.read()))" > "$PRIVATE_PROOF/manifest.json"

        echo 08dae3e849ed54a9c428e66454a3fae4589ebde4d7931170550aad8ad263afd8  "$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/combined.patch.b64" | python3 -c "import lzma,sys;sys.stdout.buffer.write(lzma.decompress(sys.stdin.buffer.read()))" > "$PRIVATE_PROOF/combined.patch"

        echo 202c6ff885e5f92ae3c8bcb9d801e4fedc69f168e9370bc8a29b44c0b437e6a8  "$PRIVATE_PROOF/combined.patch" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/production.tsconfig.json.b64" | python3 -c "import lzma,sys;sys.stdout.buffer.write(lzma.decompress(sys.stdin.buffer.read()))" > "$PRIVATE_PROOF/production.tsconfig.json"

        echo 8a76302bc5946ee2e0e3555c1c5fd43b6cc1dd1f976638878fe23d7e5f3e1306  "$PRIVATE_PROOF/production.tsconfig.json" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
      timeout-minutes: 5
    - uses: ./.github/actions/setup-test-bun
      timeout-minutes: 5
    - name: Run sole bounded targeted production diagnostic
      shell: bash
      timeout-minutes: 6
      run: export PRIVATE_PROOF="$RUNNER_TEMP/delegation-followup"; python3 "$PRIVATE_PROOF/hosted.py" run
    - name: Retain prior outcome
      if: always()
      shell: bash
      run: export PRIVATE_PROOF="$RUNNER_TEMP/delegation-followup"; python3 "$PRIVATE_PROOF/hosted.py" finalize
    - name: Upload only sanitized bounded evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: delegation-followup-v7-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/delegation-followup-safe/identity.json

          .artifacts/delegation-followup-safe/report.json'
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 7
