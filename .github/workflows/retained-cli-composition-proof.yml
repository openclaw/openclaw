name: Prepared lease parent lifetime causal proof
'on':
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        type: string
        description: Exact frozen candidate SHA; prerequisite diagnostic, not final FRV
      workflow_ref:
        required: true
        type: string
        description: Exact workflow commit W; must equal github.workflow_sha
permissions:
  contents: read
concurrency:
  group: prepared-lease-lifetime-${{ inputs.target_ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CANDIDATE_SHA: a7c0c704f48bc4ef6cd842ffac2f6fef088c9ef2
  SOURCE_TREE: 13a56f5e3ee0e94e186151122f218a3e6d468ec1
jobs:
  lease:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant:
        - before
        - after
    env:
      VARIANT: ${{ matrix.variant }}
      PRIVATE_PROOF: ${{ runner.temp }}/lease-proof-${{ matrix.variant }}
      SAFE_PROOF: .artifacts/lease-proof
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 0
        persist-credentials: false
    - name: Bind exact C and W, source closure and private harness
      shell: bash
      env:
        TARGET_SHA: ${{ inputs.target_ref }}
        INPUT_WORKFLOW: ${{ inputs.workflow_ref }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
      run: 'set -euo pipefail

        [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]

        test "$WORKFLOW_SHA" = "$INPUT_WORKFLOW"

        test "$TARGET_SHA" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

        test -z "$(git status --porcelain)"

        mkdir -p "$PRIVATE_PROOF" "$SAFE_PROOF"

        printf ''candidate=%s

        tree=%s

        workflow=%s

        run=%s

        attempt=%s

        variant=%s

        '' "$CANDIDATE_SHA" "$SOURCE_TREE" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$VARIANT" > "$SAFE_PROOF/identity.txt"

        printf ''%s'' ''''
        | base64 --decode > "$PRIVATE_PROOF/source-paths.gz"

        echo ''c3f8c1f72668a7db9718521c7ce57736cace96cbe10065ab8fec9952212cbf2d  ''"$PRIVATE_PROOF/source-paths.gz"
        | sha256sum --check --strict

        printf ''%s'' ''''
        | base64 --decode > "$PRIVATE_PROOF/hash-source.py"

        echo ''279b18e0d60823a0b6c52c7a74dc3449c58b6797b516422a443de37b4afe4cd0  ''"$PRIVATE_PROOF/hash-source.py"
        | sha256sum --check --strict

        printf ''%s'' ''''
        | base64 --decode > "$PRIVATE_PROOF/reduce.py"

        echo ''f7b829cbecadb045e1e57af541a4b5a2b8bb7f4829c70721b24ce55c4eb132e3  ''"$PRIVATE_PROOF/reduce.py" |
        sha256sum --check --strict

        python3 "$PRIVATE_PROOF/hash-source.py" base c5cd77875a43492c51ab1a691407a2f122f495e406c002eb2025e451afe304c5

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Apply bounded regression and work-owner repair
      run: "set -euo pipefail\nprintf '%s' ''\
        \ | base64 --decode | git apply -\necho '19358bd6af83be6f08e34cec7addf6536eda82b413c0148e1b8b960f566e4800\
        \  src/agents/prepared-model-runtime.lease-scope.test.ts' | sha256sum --check --strict\nif [ \"$VARIANT\"\
        \ = after ]; then\nprintf '%s' ''\
        \ | base64 --decode | git apply -\necho 'd89568cc43e13b56ad78fb36b4f760ee46ee4f134a09225188d077d0e2da59e5\
        \  src/plugins/plugin-invocation-scope.ts' | sha256sum --check --strict\nfi\ngit diff --check\nif [ \"$VARIANT\"\
        \ = after ]; then\n test \"$(git diff --name-only)\" = src/plugins/plugin-invocation-scope.ts\nelse\n test\
        \ -z \"$(git diff --name-only)\"\nfi\ngit diff --binary --full-index -- src/plugins/plugin-invocation-scope.ts\
        \ > \"$SAFE_PROOF/actual.patch\"\ngit diff --no-index -- /dev/null src/agents/prepared-model-runtime.lease-scope.test.ts\
        \ >> \"$SAFE_PROOF/actual.patch\" || test \"$?\" -eq 1\nif [ \"$VARIANT\" = before ]; then\n expected=4d6a7ff37309cbfb10848a98ac404f4858813dc232915a039f0c9d5bcc3f231f\n\
        else\n expected=6101ac24f3804ecffe179dd56f9531fe2c91678bbbc7191fc38198ac624b1486\nfi\npython3 \"$PRIVATE_PROOF/hash-source.py\"\
        \ \"$VARIANT\" \"$expected\"\n"
    - name: Require exact baseline failure or repaired whole-file success
      shell: bash
      run: "set -euo pipefail\ntests=(src/agents/prepared-model-runtime.lease-scope.test.ts)\nif [ \"$VARIANT\"\
        \ = after ]; then\n tests+=(src/plugins/plugin-invocation-scope.test.ts src/agents/runtime-plugin-work.test.ts\
        \ src/agents/runtime-plugins.work.test.ts src/agents/runtime-plugins.hooks.integration.test.ts)\nfi\nset\
        \ +e\nnode scripts/test-projects.mts \"${tests[@]}\" -- --maxWorkers=1 --reporter=default --reporter=json\
        \ --outputFile=\"$PRIVATE_PROOF/tests.json\" > \"$PRIVATE_PROOF/tests.log\" 2>&1\ncode=$?\nset -e\nprintf\
        \ '%s\n' \"$code\" > \"$PRIVATE_PROOF/test-exit.txt\"\npython3 \"$PRIVATE_PROOF/reduce.py\"\n"
    - name: Targeted static proof
      if: matrix.variant == 'after'
      run: "set -euo pipefail\nprintf 'result=not-completed\nowner=scripts/check-changed.mjs\n' > \"$SAFE_PROOF/static.txt\"\
        \nset +e\nnode scripts/check-changed.mjs -- src/plugins/plugin-invocation-scope.ts src/agents/prepared-model-runtime.lease-scope.test.ts\
        \ > \"$PRIVATE_PROOF/static.log\" 2>&1\ncode=$?\nset -e\nif [ \"$code\" -eq 0 ]; then\n result=passed\n\
        else\n result=failed\nfi\nprintf 'result=%s\nowner=scripts/check-changed.mjs\ncommand_exit=%s\n' \"$result\"\
        \ \"$code\" > \"$SAFE_PROOF/static.txt\"\nexit \"$code\"\n"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: prepared-lease-scope-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/lease-proof/identity.txt

          .artifacts/lease-proof/base.sha256

          .artifacts/lease-proof/effective.sha256

          .artifacts/lease-proof/actual.patch

          .artifacts/lease-proof/classification.txt

          .artifacts/lease-proof/static.txt'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
