  before-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: f38131f934b45447558cf6f431353a49656198d5
        fetch-depth: 0
        persist-credentials: false
    - name: Bind BEFORE source and identical prerequisite plus regression inputs
      env:
        TARGET_SHA: ${{ inputs.target_ref }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
      run: "set -euo pipefail\ntest \"$TARGET_SHA\" = \"$CANDIDATE_SHA\"\ntest \"$(git rev-parse HEAD)\" = \"$BEFORE_SHA\"\
        \ntest \"$(git rev-parse HEAD^{tree})\" = a2b41999e8f0ac728cec97457e0500a76a7fd71e\ntest -z \"$(git status --porcelain)\"\
        \ntest \"$(git rev-parse \"$CANDIDATE_SHA^{tree}\")\" = \"$SOURCE_TREE\"\n\ntest \"$(git rev-parse \"$PREREQUISITE_PARENT^\"\
        )\" = \"$BEFORE_SHA\"\nmkdir -p .artifacts/before-capacity\nprintf 'candidate=%s\\nbefore=%s\\nworkflow=%s\\nrun=%s\\\
        nattempt=%s\\n' \"$CANDIDATE_SHA\" \"$BEFORE_SHA\" \"$WORKFLOW_SHA\" \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" >\
        \ .artifacts/before-capacity/identity.txt\n# Apply only the reviewed build prerequisites, identically to the AFTER\
        \ tree.\ngit diff --binary --full-index \"$PREREQUISITE_PARENT\" \"$CAPACITY_PROOF_SHA\" > .artifacts/before-capacity/prerequisite.patch\n\
        echo \"$PREREQUISITE_PATCH_SHA256  .artifacts/before-capacity/prerequisite.patch\" | sha256sum -c -\ngit apply --check\
        \ .artifacts/before-capacity/prerequisite.patch\ngit apply .artifacts/before-capacity/prerequisite.patch\nfor path\
        \ in src/agents/openclaw-tools.types.ts src/config/runtime-snapshot.ts src/system-agent/delegated-change-policy.ts;\
        \ do\n  test \"$(git hash-object \"$path\")\" = \"$(git rev-parse \"$CAPACITY_PROOF_SHA:$path\")\"\ndone\nfor path\
        \ in src/agents/code-mode.catalog-lifetime.test.ts test/vitest/vitest.database-worker-core-paths.mjs; do\n  git show\
        \ \"$CAPACITY_PROOF_SHA:$path\" > \"$path\"\n  test \"$(git hash-object \"$path\")\" = \"$(git rev-parse \"$CAPACITY_PROOF_SHA:$path\"\
        )\"\ndone\nprintf '%s\\n' src/agents/code-mode.catalog-lifetime.test.ts src/agents/openclaw-tools.types.ts src/config/runtime-snapshot.ts\
        \ src/system-agent/delegated-change-policy.ts test/vitest/vitest.database-worker-core-paths.mjs > .artifacts/before-capacity/expected-overlay.txt\n\
        git diff --name-only | LC_ALL=C sort > .artifacts/before-capacity/actual-overlay.txt\ndiff -u .artifacts/before-capacity/expected-overlay.txt\
        \ .artifacts/before-capacity/actual-overlay.txt\ngit diff --exit-code -- src/agents/code-mode-execution.ts src/agents/code-mode-state.ts\n\
        git diff --binary > .artifacts/before-capacity/overlay.patch\nsha256sum src/agents/openclaw-tools.types.ts src/config/runtime-snapshot.ts\
        \ src/system-agent/delegated-change-policy.ts src/agents/code-mode.catalog-lifetime.test.ts test/vitest/vitest.database-worker-core-paths.mjs\
        \ src/agents/code-mode-execution.ts src/agents/code-mode-state.ts > .artifacts/before-capacity/source-sha256.txt\n"
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - name: Execute unchanged native capacity regression on BEFORE owners
      id: regression
      env:
        OPENCLAW_TEST_FILE_LOG: '1'
        OPENCLAW_LOG_LEVEL: error
      run: 'set -uo pipefail

        set +e

        node scripts/test-projects.mts src/agents/code-mode.catalog-lifetime.test.ts -- --maxWorkers=1 --reporter=default
        --reporter=json --outputFile="$GITHUB_WORKSPACE/.artifacts/before-capacity/tests.json" 2>&1 | tee .artifacts/before-capacity/tests.log

        pipeline_status=("${PIPESTATUS[@]}")

        set -e

        test "${pipeline_status[1]}" -eq 0

        status=${pipeline_status[0]}

        printf ''%s\n'' "$status" > .artifacts/before-capacity/exit-code.txt

        # The classifier below alone admits the specific expected assertion failure.

        exit 0

        '
    - name: Require named native capacity failure, never generic failure
      if: always()
      env:
        REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
      run: "node --input-type=module <<'NODE'\nimport fs from 'node:fs';\nimport assert from 'node:assert/strict';\nconst\
        \ root = '.artifacts/before-capacity/';\nfs.mkdirSync(root, { recursive: true });\nconst result = { classification:\
        \ 'failed', before: process.env.BEFORE_SHA, candidate: process.env.CANDIDATE_SHA };\ntry {\n  assert.equal(process.env.REGRESSION_OUTCOME,\
        \ 'success', 'Regression command did not complete');\n  const exitCode = Number(fs.readFileSync(root + 'exit-code.txt',\
        \ 'utf8').trim());\n  assert.equal(exitCode, 1, 'Expected ordinary assertion exit 1, not pass or infrastructure failure');\n\
        \  const report = JSON.parse(fs.readFileSync(root + 'tests.json', 'utf8'));\n  assert.equal(report.numFailedTests,\
        \ 1);\n  assert.equal(report.numTotalTests, 1);\n  assert.equal(report.testResults.length, 1);\n  const suite = report.testResults[0];\n\
        \  assert(suite.name.replaceAll('\\\\', '/').endsWith('/src/agents/code-mode.catalog-lifetime.test.ts'));\n  assert.equal(suite.assertionResults.length,\
        \ 1);\n  const test = suite.assertionResults[0];\n  assert.equal(test.title, 'keeps the suspension limit while required\
        \ observers collect existing process results');\n  assert.equal(test.status, 'failed');\n  const failure = test.failureMessages.join('\\\
        n');\n  // Native toMatchObject output may omit received fields outside the expected subset.\n  // Read the frozen\
        \ product's existing structured diagnostic, not a generic log match.\n  const diagnostics = [];\n  for (const name\
        \ of fs.readdirSync('.artifacts/test-logs')) {\n    if (!name.endsWith('.log')) continue;\n    for (const line of\
        \ fs.readFileSync('.artifacts/test-logs/' + name, 'utf8').split('\\n').filter(Boolean)) {\n      const record = JSON.parse(line);\n\
        \      const fields = Object.values(record).find((value) => value && typeof value === 'object' && value.toolCallId\
        \ === 'required-observer');\n      if (record.message === 'Code Mode execution failed' && fields && fields.error ===\
        \ 'too many suspended code mode runs.' && fields.bridgeDispatchStarted === false) {\n        diagnostics.push({ toolCallId:\
        \ fields.toolCallId, error: fields.error, failurePhase: fields.failurePhase, bridgeDispatchStarted: fields.bridgeDispatchStarted\
        \ });\n      }\n    }\n  }\n  assert(diagnostics.length > 0, 'Missing producer diagnostic: required-observer rejected\
        \ at capacity before dispatch');\n  result.diagnostics = diagnostics;\n  assert(failure.includes('AssertionError')\
        \ && failure.includes('failed') && failure.includes('to match object'), 'Expected native completion-versus-rejection\
        \ assertion');\n  const { stripVTControlCharacters } = await import('node:util');\n  const nativeLog = stripVTControlCharacters(fs.readFileSync(root\
        \ + 'tests.log', 'utf8'));\n  assert(/src\\/agents\\/code-mode\\.catalog-lifetime\\.test\\.ts:141:7/.test(nativeLog),\
        \ 'Wrong native-result collection assertion site');\n  assert(nativeLog.includes('benchmark-result') && /status[\\\
        \"':\\s]+completed/.test(nativeLog), 'Missing required native-result expectation in the native assertion diff');\n\
        \  result.classification = 'expected-capacity-failure';\n  result.exitCode = exitCode;\n  result.suite = suite.name;\n\
        \  result.test = test.title;\n  result.failureMessages = test.failureMessages;\n} catch (error) {\n  result.reason\
        \ = String(error);\n  process.exitCode = 1;\n}\nfs.writeFileSync(root + 'classification.json', JSON.stringify(result,\
        \ null, 2) + '\\n');\nconsole.log(JSON.stringify(result));\nNODE\n"
    - name: Record BEFORE artifact hashes
      if: always()
      run: "if test -d .artifacts/before-capacity; then\n  (cd .artifacts/before-capacity && find . -type f ! -name SHA256SUMS\
        \ -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)\nfi\n"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: required-backports-before-capacity-${{ inputs.target_ref }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/before-capacity/
        if-no-files-found: error
        retention-days: 14
    needs:
    - plan
