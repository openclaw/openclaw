        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Capture canonical formatting only
      shell: bash
      run: 'set -euo pipefail

        mapfile -t paths < .artifacts/final-ci/source-paths.txt

        pnpm exec oxfmt --write --no-error-on-unmatched-pattern -- "${paths[@]}" 2>&1 | tee .artifacts/final-ci/format.log

        pnpm exec oxfmt --check --no-error-on-unmatched-pattern -- "${paths[@]}" 2>&1 | tee .artifacts/final-ci/format-check.log

        git diff --check

        git diff --binary --full-index > .artifacts/final-ci/generated.patch

        git diff --name-only -z > .artifacts/final-ci/changed-paths.nul

        git status --porcelain=v1 > .artifacts/final-ci/status.txt

        tar --null -T .artifacts/final-ci/changed-paths.nul -cf .artifacts/final-ci/generated.tar

        (cd .artifacts/final-ci && sha256sum identity.txt source-paths.txt format.log format-check.log generated.patch changed-paths.nul
        status.txt generated.tar > SHA256SUMS)

        '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
