    - name: Verify transport-groups.json transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/transport-groups.json.gz.b64" | gzip -d > "$PRIVATE_PROOF/transport-groups.json"

        printf ''%s\n'' ''a43065b45d6516380b7535b336fe94e9d30f23fb7e19862fcb8723a0677afb6b  ''"$PRIVATE_PROOF/transport-groups.json" | sha256sum --check --strict

        '
    - name: Transport transport-diagnostic.patch 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/transport-diagnostic.patch.gz.b64"

        '
    - name: Verify transport-diagnostic.patch transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/transport-diagnostic.patch.gz.b64" | gzip -d > "$PRIVATE_PROOF/transport-diagnostic.patch"

        printf ''%s\n'' ''754658f8982a3258451e7dcf50e591bc36221d98c96ec40a986ab6511e353a3c  ''"$PRIVATE_PROOF/transport-diagnostic.patch" | sha256sum --check --strict

        '
    - name: Bind exact candidate and diagnostic overlay
      shell: bash
      run: 'set -euo pipefail

        python3 -B "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        node-version: 24.22.1
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Collect exact transport diagnostic
      shell: bash
      run: 'set -euo pipefail

        python3 -B "$PRIVATE_PROOF/hosted.py" run

        '
    - name: Upload exact safe transport evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: original-shard-transport-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ github.workspace }}-node-boundary-safe/transport/identity.json

          ${{ github.workspace }}-node-boundary-safe/transport/report.json

          ${{ github.workspace }}-node-boundary-safe/transport/tests.json

          ${{ github.workspace }}-node-boundary-safe/transport/inner-status.json

          ${{ github.workspace }}-node-boundary-safe/transport/boundary-observations.json'
