name: Final committed candidate striped static proof
'on':
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        type: string
        description: Exact final committed C including release notes; no overlay
      workflow_ref:
        required: true
        type: string
        description: Exact workflow commit W; must equal github.workflow_sha
      baseline_ref:
        required: true
        type: string
        description: Exact final C comparison baseline; original 35-command plan
        default: c89139757f2c6728863a740309027562004163f8
permissions:
  contents: read
concurrency:
  group: final-committed-static-c89139757f2c6728863a740309027562004163f8
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CANDIDATE_SHA: c89139757f2c6728863a740309027562004163f8
  SOURCE_TREE: e50202fa892e7fd69a13bd78dc61e6d62f3ae478
  ORIGINAL_WORKFLOW_SHA: adf18f3490bea2f89afa19cf6613a67bc17ce0a2
  ORIGINAL_RUN: '43408783712'
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane:
        - core-types
        - core-test-types-1
        - core-test-types-2
        - core-test-types-3
        - core-test-types-4
        - core-test-types-5
        - style
        - audits
        - guards-0
        - guards-1
    env:
      VARIANT: committed
      STATIC_LANE: ${{ matrix.lane }}
      SAFE_PROOF: .artifacts/final-static
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 0
        persist-credentials: false
    - name: Bind exact final C, full tracked inventory and original command plan
      shell: bash
      env:
        TARGET_SHA: ${{ inputs.target_ref }}
        INPUT_WORKFLOW: ${{ inputs.workflow_ref }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
        PRIVATE_PROOF: ${{ runner.temp }}/final-static-${{ matrix.lane }}
        BASELINE_SHA: ${{ inputs.baseline_ref }}
      run: 'set -euo pipefail

        [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]

        test "$WORKFLOW_SHA" = "$INPUT_WORKFLOW"

        test "$TARGET_SHA" = "$CANDIDATE_SHA"

        test "$BASELINE_SHA" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

        test -z "$(git status --porcelain)"

        mkdir -p "$PRIVATE_PROOF" "$SAFE_PROOF"

        printf ''candidate=%s

        tree=%s

        workflow=%s

        run=%s

        attempt=%s

        variant=%s

        '' "$CANDIDATE_SHA" "$SOURCE_TREE" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$VARIANT" > "$SAFE_PROOF/identity.txt"

        git update-ref refs/remotes/origin/main "$BASELINE_SHA"

        printf ''baseline=%s

        original_workflow=%s

        original_run=%s

        lane=%s

        '' "$BASELINE_SHA" "$ORIGINAL_WORKFLOW_SHA" "$ORIGINAL_RUN" "$STATIC_LANE" >> "$SAFE_PROOF/identity.txt"

        printf ''%s'' '''' | base64 --decode > "$PRIVATE_PROOF/source-paths.gz"

        echo ''7f6295c943e7056268d8e0b41c9d43eeea9f169f87fe1039e871fbb92862e717  ''"$PRIVATE_PROOF/source-paths.gz" | sha256sum --check --strict

        printf ''%s'' '''' | base64 --decode > "$PRIVATE_PROOF/hash-source.py"

        echo ''cee83ff62a55dc02c2d5916da82d919ef4545942f11aacafc1bd712ec8ef57cb  ''"$PRIVATE_PROOF/hash-source.py" | sha256sum --check --strict

        printf ''%s'' '''' | base64 --decode > "$PRIVATE_PROOF/original-plan.json"

        echo ''862ed424a9f59a61d001755c3ac410fc734de3180d9ade6090930eb6a0947439  ''"$PRIVATE_PROOF/original-plan.json" | sha256sum --check --strict

        printf ''%s'' '''' | base64 --decode > "$PRIVATE_PROOF/canonical-graphs.json"

        echo ''ab4d4a51f34a76870f3a051d078a5d9b5944504c5eca4f81367679cd3d35c345  ''"$PRIVATE_PROOF/canonical-graphs.json" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/hash-source.py" base b6cd79b4af990ea142b4870bd74922adc4d06f714a660e28900a730666631c4e

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Verify unchanged committed source; no patches
      shell: bash
      env:
        PRIVATE_PROOF: ${{ runner.temp }}/final-static-${{ matrix.lane }}
      run: 'set -euo pipefail

        test -z "$(git status --porcelain --untracked-files=no)"

        python3 "$PRIVATE_PROOF/hash-source.py" effective b6cd79b4af990ea142b4870bd74922adc4d06f714a660e28900a730666631c4e

        '
    - name: Run bounded static partition only
      timeout-minutes: 22
      shell: bash
      env:
        PRIVATE_PROOF: ${{ runner.temp }}/final-static-${{ matrix.lane }}
      run: 'set -euo pipefail

        printf ''%s'' '''' | base64 --decode > "$PRIVATE_PROOF/run-static.mjs"

        echo ''0b9908153d3bc646aebfca6d73f9612f9daabbb76e2dc615719afb51d9380722  ''"$PRIVATE_PROOF/run-static.mjs" | sha256sum --check --strict

        node --import tsx "$PRIVATE_PROOF/run-static.mjs" > "$PRIVATE_PROOF/static.log" 2>&1

        python3 "$PRIVATE_PROOF/hash-source.py" effective b6cd79b4af990ea142b4870bd74922adc4d06f714a660e28900a730666631c4e

        '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: final-committed-static-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/final-static/identity.txt

          .artifacts/final-static/base.sha256

          .artifacts/final-static/effective.sha256

          .artifacts/final-static/static.json'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
