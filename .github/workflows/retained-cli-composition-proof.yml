name: Exact H76 Windows candidate and source proof

# SOURCE-ONLY draft for existing .github/workflows/retained-cli-composition-proof.yml.
# Workflow ID 414827824; parent owns publication and dispatch. No new registration.
# Caller repository MUST be openclaw/openclaw (original artifact owner).
on:
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed workflow commit SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  resolve_windows_node_release_artifacts:
    name: Resolve Windows-node release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      stable_tag: ${{ steps.resolve.outputs.stable_tag }}
      stable_release_sha: ${{ steps.resolve.outputs.stable_release_sha }}
      stable_asset_name: ${{ steps.resolve.outputs.stable_asset_name }}
      stable_asset_sha256: ${{ steps.resolve.outputs.stable_asset_sha256 }}
      prerelease_tag: ${{ steps.resolve.outputs.prerelease_tag }}
      prerelease_release_sha: ${{ steps.resolve.outputs.prerelease_release_sha }}
      prerelease_asset_name: ${{ steps.resolve.outputs.prerelease_asset_name }}
      prerelease_asset_sha256: ${{ steps.resolve.outputs.prerelease_asset_sha256 }}
    steps:
      - name: Admit exact reviewed caller identity
        env:
          ACTUAL_CALLER_SHA: ${{ github.sha }}
          EXPECTED_CALLER_SHA: ${{ inputs.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_CALLER_SHA" =~ ^[0-9a-f]{40}$ || "$ACTUAL_CALLER_SHA" != "$EXPECTED_CALLER_SHA" ]]; then
            echo "Caller identity admission failed."
            exit 1
          fi
      - name: Select immutable stable and prerelease assets
        if: ${{ github.sha == inputs.workflow_ref }}
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Windows-node owns its release channels: stable vX.Y.Z[-N] corrections
          # and installable vX.Y.Z-alpha.N prereleases. Throwaway signing releases
          # are not candidates (docs/VERSIONING.md in openclaw-windows-node).
          stable_tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$'
          prerelease_tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$'

          # GitHub returns releases newest-first. One 100-item page is enough to
          # resolve the current stable and prerelease without concatenating pages.
          releases="$(gh api 'repos/openclaw/openclaw-windows-node/releases?per_page=100')"

          select_release() {
            local prerelease="$1"
            local tag_pattern="$2"
            jq -cer --argjson prerelease "$prerelease" --arg tag_pattern "$tag_pattern" '
              [ .[]
                | select(.draft == false and .prerelease == $prerelease)
                | select(.tag_name | test($tag_pattern))
              ]
              | sort_by(.published_at)
              | last
              | select(. != null)
              | . as $release
              | [.assets[]
                  | select(.state == "uploaded")
                  | select(.name | test("^OpenClawTray-[0-9A-Za-z.+-]+-win-x64\\.zip$|^OpenClaw\\.Tray\\.WinUI_[0-9A-Za-z.+-]+_x64\\.msix$"))
                  | select((.digest // "") | test("^sha256:[a-f0-9]{64}$"))] as $assets
              | [$assets[] | select(.name | endswith(".zip"))] as $zip_assets
              | [$assets[] | select(.name | endswith(".msix"))] as $msix_assets
              | (if ($zip_assets | length) == 1 then $zip_assets[0]
                 elif ($zip_assets | length) == 0 and ($msix_assets | length) == 1 then $msix_assets[0]
                 else empty
                 end) as $asset
              | {
                  published_at: $release.published_at,
                  tag: $release.tag_name,
                  asset_name: $asset.name,
                  asset_sha256: ($asset.digest | sub("^sha256:"; ""))
                }
            ' <<< "$releases"
          }

          stable="$(select_release false "$stable_tag_pattern")" || {
            echo "No published stable Windows-node release (vX.Y.Z or vX.Y.Z-N) exposes a hashed x64 ZIP or MSIX tray artifact." >&2
            exit 1
          }
          prerelease="$(select_release true "$prerelease_tag_pattern")" || {
            echo "::warning::No published Windows-node production prerelease (vX.Y.Z-alpha.N) exposes a hashed x64 ZIP or MSIX tray artifact. Stable validation will still run."
            prerelease=""
          }

          # `docs/VERSIONING.md` keeps release tags plus GitVersion SemVer as the
          # versioning contract, so `vX.Y.Z-alpha.N` is the prerelease of `X.Y.Z`.
          # A superseded alpha is unavailable advisory coverage, not evidence
          # against the current preview channel and not a stable-lane blocker.
          if [[ -n "$prerelease" ]] && ! jq -ne --argjson stable "$stable" --argjson prerelease "$prerelease" '
              def semver_key:
                ltrimstr("v")
                | capture("^(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)(?:-alpha\\.(?<alpha>[0-9]+)|-(?<correction>[0-9]+))?$")
                | [
                    (.major | tonumber),
                    (.minor | tonumber),
                    (.patch | tonumber),
                    (if .alpha == null then 1 else 0 end),
                    ((.correction // .alpha // "0") | tonumber)
                  ];
              ($prerelease.tag | semver_key) > ($stable.tag | semver_key)
            ' > /dev/null; then
            echo "::warning::Windows-node prerelease $(jq -r .tag <<< "$prerelease") is superseded by stable $(jq -r .tag <<< "$stable"); the alpha channel has no current production prerelease to validate."
            prerelease=""
          fi

          resolve_tag_sha() {
            local tag="$1"
            local ref object_type object_sha
            ref="$(gh api "repos/openclaw/openclaw-windows-node/git/ref/tags/$tag")"
            object_type="$(jq -r '.object.type' <<< "$ref")"
            object_sha="$(jq -r '.object.sha' <<< "$ref")"
            if [[ "$object_type" == "tag" ]]; then
              object_sha="$(gh api "repos/openclaw/openclaw-windows-node/git/tags/$object_sha" --jq '.object.sha')"
              object_type="$(gh api "repos/openclaw/openclaw-windows-node/git/tags/$(jq -r '.object.sha' <<< "$ref")" --jq '.object.type')"
            fi
            [[ "$object_type" == "commit" && "$object_sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Windows-node release tag $tag does not resolve to an immutable commit." >&2
              exit 1
            }
            printf '%s\n' "$object_sha"
          }

          for channel in stable prerelease; do
            selection="${!channel}"
            [[ -n "$selection" ]] || continue
            tag="$(jq -er '.tag | select(type == "string" and length > 0)' <<< "$selection")"
            asset_name="$(jq -er '.asset_name | select(type == "string" and length > 0)' <<< "$selection")"
            asset_sha256="$(jq -er '.asset_sha256 | select(test("^[a-f0-9]{64}$"))' <<< "$selection")"
            [[ -n "${tag// }" && "$tag" != "null" ]] || {
              echo "Windows-node $channel release is missing its tag." >&2
              exit 1
            }
            if ! release_sha="$(resolve_tag_sha "$tag")"; then
              if [[ "$channel" == "stable" ]]; then
                exit 1
              fi
              echo "::warning::Windows-node prerelease tag could not be bound to a commit. Stable validation will still run."
              prerelease=""
              continue
            fi
            echo "${channel}_tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "${channel}_release_sha=${release_sha}" >> "$GITHUB_OUTPUT"
            echo "${channel}_asset_name=${asset_name}" >> "$GITHUB_OUTPUT"
            echo "${channel}_asset_sha256=${asset_sha256}" >> "$GITHUB_OUTPUT"
          done

          {
            echo "## Windows-node release artifacts"
            echo
            echo "- Stable: \`$(jq -r .tag <<< "$stable")\` / \`$(jq -r .asset_name <<< "$stable")\` (published $(jq -r .published_at <<< "$stable"))"
            if [[ -n "$prerelease" ]]; then
              echo "- Prerelease (advisory): \`$(jq -r .tag <<< "$prerelease")\` / \`$(jq -r .asset_name <<< "$prerelease")\` (published $(jq -r .published_at <<< "$prerelease"))"
            else
              echo "- Prerelease (advisory): unavailable; see resolver warnings."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  windows_node_prerelease_e2e:
    name: Run Windows-node prerelease E2E
    needs: [resolve_windows_node_release_artifacts]
    if: ${{ github.sha == inputs.workflow_ref && needs.resolve_windows_node_release_artifacts.outputs.prerelease_tag != '' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: openclaw/openclaw-windows-node/.github/workflows/release-candidate-e2e.yml@76a48a68607d8cb7cc0ae607dbc46c920f07495a
    with:
      candidate_artifact_name: "windows-node-candidate-43549813680-1"
      candidate_artifact_run_id: "43549813680"
      candidate_sha256: "8b7ee61e2c129a7806c65546ba29f7f3a733a40fc9bd18b4a2cafceae9d0f4cb"
      candidate_version: "2026.11.4"
      windows_node_source: release
      windows_node_source_sha: ${{ needs.resolve_windows_node_release_artifacts.outputs.prerelease_release_sha }}
      windows_node_workflow_sha: 76a48a68607d8cb7cc0ae607dbc46c920f07495a
      windows_node_release_tag: ${{ needs.resolve_windows_node_release_artifacts.outputs.prerelease_tag }}
      windows_node_release_asset_name: ${{ needs.resolve_windows_node_release_artifacts.outputs.prerelease_asset_name }}
      windows_node_release_asset_sha256: ${{ needs.resolve_windows_node_release_artifacts.outputs.prerelease_asset_sha256 }}
      allow_protocol_mismatch: false

  windows_node_stable_e2e:
    if: ${{ github.sha == inputs.workflow_ref }}
    name: Run Windows-node stable E2E
    needs: [resolve_windows_node_release_artifacts]
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: openclaw/openclaw-windows-node/.github/workflows/release-candidate-e2e.yml@76a48a68607d8cb7cc0ae607dbc46c920f07495a
    with:
      candidate_artifact_name: "windows-node-candidate-43549813680-1"
      candidate_artifact_run_id: "43549813680"
      candidate_sha256: "8b7ee61e2c129a7806c65546ba29f7f3a733a40fc9bd18b4a2cafceae9d0f4cb"
      candidate_version: "2026.11.4"
      windows_node_source: release
      windows_node_source_sha: ${{ needs.resolve_windows_node_release_artifacts.outputs.stable_release_sha }}
      windows_node_workflow_sha: 76a48a68607d8cb7cc0ae607dbc46c920f07495a
      windows_node_release_tag: ${{ needs.resolve_windows_node_release_artifacts.outputs.stable_tag }}
      windows_node_release_asset_name: ${{ needs.resolve_windows_node_release_artifacts.outputs.stable_asset_name }}
      windows_node_release_asset_sha256: ${{ needs.resolve_windows_node_release_artifacts.outputs.stable_asset_sha256 }}
      allow_protocol_mismatch: false

  windows_node_main_e2e:
    if: ${{ github.sha == inputs.workflow_ref }}
    name: Run Windows-node main E2E
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: openclaw/openclaw-windows-node/.github/workflows/release-candidate-e2e.yml@76a48a68607d8cb7cc0ae607dbc46c920f07495a
    with:
      candidate_artifact_name: "windows-node-candidate-43549813680-1"
      candidate_artifact_run_id: "43549813680"
      candidate_sha256: "8b7ee61e2c129a7806c65546ba29f7f3a733a40fc9bd18b4a2cafceae9d0f4cb"
      candidate_version: "2026.11.4"
      windows_node_source: main
      windows_node_source_sha: 34e8b6099f4cbf225c4247fa814e4823dd75c9d2
      windows_node_workflow_sha: 76a48a68607d8cb7cc0ae607dbc46c920f07495a
      allow_protocol_mismatch: false


  exact_h76_source_proof:
    if: ${{ github.sha == inputs.workflow_ref }}
    name: Exact H76 default-All and regression proof
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      OPENCLAW_REPO_ROOT: ${{ github.workspace }}
      OPENCLAW_CI_COLLECT_COVERAGE: 'false'
      GitVersion_NoNormalizeEnabled: 'true'
      GitVersion_NoFetchEnabled: 'true'
    steps:
      - name: Check out exact reviewed harness
        uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw-windows-node
          ref: 76a48a68607d8cb7cc0ae607dbc46c920f07495a
          fetch-depth: 0
          persist-credentials: false
      - name: Set up native .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Prove exact source with private raw results
        shell: pwsh
        env:
          OPENCLAW_TRAY_DATA_DIR: ${{ runner.temp }}/h76-tray-data
          NUGET_PACKAGES: ${{ runner.temp }}/h76-nuget
          PROOF_CALLER_SHA: ${{ github.sha }}
          PROOF_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PROOF_CALLER_RUN_ID: ${{ github.run_id }}
          PROOF_CALLER_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # Source-only hosted proof payload; embedded verbatim in combined caller.
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $h = '76a48a68607d8cb7cc0ae607dbc46c920f07495a'
          $baseline = 'f0592215f27100d9ecece33d3069daac76a4125c'
          $relative = '.github/workflows/release-candidate-e2e.yml'
          $method = 'Workflow_InitializesMainAppDependenciesFromDeclaredSource'
          $class = 'OpenClaw.Tray.Tests.ReleaseCandidateE2EWorkflowTests'
          $root = Join-Path $env:RUNNER_TEMP 'h76-proof'
          $raw = Join-Path $root 'private'
          $public = Join-Path $root 'public'
          New-Item -ItemType Directory -Path $raw, $public -ErrorAction Stop | Out-Null
          $script:stage = 'bind-checkout'
          $script:nativeIndex = 0
          $summary = [ordered]@{ caller_sha = $env:PROOF_CALLER_SHA; workflow_sha = $env:PROOF_WORKFLOW_SHA; run_id = $env:PROOF_CALLER_RUN_ID; run_attempt = $env:PROOF_CALLER_RUN_ATTEMPT; harness = $h; baseline = $baseline; outcome = 'failed'; stage = $script:stage; native = @(); restored = $false; clean = $false }
          $original = $null
          $path = Join-Path (Get-Location) $relative
          function Invoke-PrivateNative {
              param([string]$File, [string[]]$Arguments, [string]$Label, [int]$ExpectedExit = 0)
              $script:stage = $Label
              $script:nativeIndex++
              $log = Join-Path $raw ("native-{0}.log" -f $script:nativeIndex)
              & $File @Arguments *> $log
              $code = $LASTEXITCODE
              $summary.native += [ordered]@{ label = $Label; exit = $code }
              if ($code -ne $ExpectedExit) { throw 'Unexpected native exit; raw output remains private.' }
          }
          function Read-PrivateTrx {
              param([string]$Path)
              $settings = [Xml.XmlReaderSettings]::new()
              $settings.DtdProcessing = [Xml.DtdProcessing]::Prohibit
              $settings.XmlResolver = $null
              $reader = [Xml.XmlReader]::Create($Path, $settings)
              try {
                  $xml = [Xml.XmlDocument]::new()
                  $xml.XmlResolver = $null
                  $xml.Load($reader)
              } finally { $reader.Dispose() }
              if ($xml.DocumentElement.LocalName -cne 'TestRun' -or $xml.DocumentElement.NamespaceURI -cne 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010') { throw 'Unexpected TRX document.' }
              $ns = [Xml.XmlNamespaceManager]::new($xml.NameTable)
              $ns.AddNamespace('t', $xml.DocumentElement.NamespaceURI)
              return [pscustomobject]@{ xml = $xml; ns = $ns }
          }
          try {
              $head = (& git rev-parse HEAD).Trim()
              if ($LASTEXITCODE -ne 0 -or $head -cne $h) { throw 'Wrong checkout.' }
              $dirty = & git status --porcelain --untracked-files=all
              if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Checkout is not clean.' }
              $original = [IO.File]::ReadAllBytes($path)
              $summary.original_workflow_sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              . ./scripts/TestResultContract.ps1
              $script:stage = 'default-all-build'
              Invoke-PrivateNative -File pwsh -Arguments @('-NoProfile', '-File', './build.ps1') -Label $script:stage
              $script:stage = 'focused-restore-build'
              Invoke-PrivateNative -File dotnet -Arguments @('restore', 'tests/OpenClaw.Tray.Tests', '-r', 'win-x64') -Label 'restore-focused-tray'
              Invoke-PrivateNative -File dotnet -Arguments @('build', 'tests/OpenClaw.Tray.Tests', '-c', 'Debug', '-r', 'win-x64', '--no-restore') -Label 'build-focused-tray'
              $script:stage = 'baseline-red'
              $red = New-TestInvocation -ResultsDirectory (Join-Path $raw 'red') -TrxFileName 'red.trx'
              try {
                  # Copy binary stdout, not decoded PowerShell text, to preserve baseline blob bytes.
                  $start = [Diagnostics.ProcessStartInfo]::new()
                  $start.FileName = 'git'
                  $start.UseShellExecute = $false
                  $start.RedirectStandardOutput = $true
                  $start.RedirectStandardError = $true
                  $start.ArgumentList.Add('cat-file')
                  $start.ArgumentList.Add('blob')
                  $start.ArgumentList.Add("$($baseline):$relative")
                  $process = [Diagnostics.Process]::Start($start)
                  $stream = [IO.File]::Create($path)
                  try { $process.StandardOutput.BaseStream.CopyTo($stream) } finally { $stream.Dispose() }
                  $null = $process.StandardError.ReadToEnd()
                  $process.WaitForExit()
                  $baselineExit = $process.ExitCode
                  $process.Dispose()
                  if ($baselineExit -ne 0) { throw 'Could not materialize baseline blob.' }
                  $summary.baseline_workflow_sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($summary.baseline_workflow_sha256 -cne 'f1fecf0714d1711ac185332200468171e4a8994e57f9457ba39561c9a5ae9d86') { throw 'Baseline blob hash mismatch.' }
                  Invoke-PrivateNative -File dotnet -Arguments @('test', 'tests/OpenClaw.Tray.Tests/OpenClaw.Tray.Tests.csproj', '--no-build', '-c', 'Debug', '-r', 'win-x64', '--filter', "FullyQualifiedName=$class.$method", '--results-directory', $red.directory, '--logger', 'trx;LogFileName=red.trx', '--blame-hang', '--blame-hang-timeout', '300s', '--blame-hang-dump-type', 'none') -Label 'focused-baseline-red' -ExpectedExit 1
                  # The native owner admits successes only. Never alter a failed TRX to pass it.
                  $script:stage = 'red-trx-parse'
                  $doc = Read-PrivateTrx -Path $red.report
                  $x = $doc.xml; $n = $doc.ns
                  $script:stage = 'red-shape-counters'
                  $results = @($x.SelectNodes('/t:TestRun/t:Results/t:UnitTestResult', $n))
                  $defs = @($x.SelectNodes('/t:TestRun/t:TestDefinitions/t:UnitTest', $n))
                  $c = $x.SelectSingleNode('/t:TestRun/t:ResultSummary/t:Counters', $n)
                  if ($results.Count -ne 1 -or $defs.Count -ne 1 -or $null -eq $c) { throw 'Expected exactly one negative test.' }
                  foreach ($attribute in $c.Attributes) {
                      $expected = if ($attribute.Name -in @('total', 'executed', 'failed')) { 1 } else { 0 }
                      $value = -1
                      if (-not [int]::TryParse($attribute.Value, [ref]$value) -or $value -ne $expected) { throw 'Negative counters mismatch.' }
                  }
                  foreach ($key in @('total', 'executed', 'failed')) { if ($c.GetAttribute($key) -cne '1') { throw 'Missing negative counter.' } }
                  $script:stage = 'red-test-identity'
                  $r = $results[0]; $d = $defs[0]; $m = $d.SelectSingleNode('t:TestMethod', $n)
                  if ($null -eq $m -or $m.GetAttribute('className') -cne $class -or $m.GetAttribute('name') -cne $method -or $r.GetAttribute('testId') -cne $d.GetAttribute('id') -or $r.GetAttribute('outcome') -cne 'Failed' -or $r.GetAttribute('executionId') -eq '') { throw 'Negative test identity mismatch.' }
                  $script:stage = 'red-initializer-assertion'
                  $message = $r.SelectSingleNode('t:Output/t:ErrorInfo/t:Message', $n)
                  $stack = $r.SelectSingleNode('t:Output/t:ErrorInfo/t:StackTrace', $n)
                  if ($null -eq $message -or $null -eq $stack -or $message.InnerText -notmatch '^Assert\.True\(\) Failure' -or $stack.InnerText -notmatch ([regex]::Escape("$class.$method()") + '.*ReleaseCandidateE2EWorkflowTests\.cs:line 118(?:\D|$)')) { throw 'Negative failure was not the expected initializer assertion.' }
                  $script:stage = 'red-invocation-time'
                  $times = $x.SelectSingleNode('/t:TestRun/t:Times', $n)
                  if ($null -eq $times) { throw 'Missing negative invocation time.' }
                  $startUtc = [DateTimeOffset]::Parse($times.GetAttribute('start')).UtcDateTime
                  $finishUtc = [DateTimeOffset]::Parse($times.GetAttribute('finish')).UtcDateTime
                  if ($startUtc -lt ([DateTime]$red.startedUtc).ToUniversalTime().AddSeconds(-1) -or $finishUtc -lt $startUtc -or $finishUtc -gt [DateTime]::UtcNow.AddSeconds(1)) { throw 'Negative report time mismatch.' }
                  $summary.red = [ordered]@{ executed = 1; failed = 1; expected_assertion = 'app-owned-initializer'; assertion_line = 118; trx_sha256 = (Get-FileHash $red.report -Algorithm SHA256).Hash.ToLowerInvariant() }
              } finally {
                  [IO.File]::WriteAllBytes($path, $original)
                  $summary.restored_workflow_sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
                  $summary.restored = $summary.restored_workflow_sha256 -ceq $summary.original_workflow_sha256
                  if (-not $summary.restored) { throw 'Workflow restoration mismatch.' }
              }
              $script:stage = 'restored-source-check'
              & git diff --quiet
              if ($LASTEXITCODE -ne 0) { throw 'Tracked sources changed before fixed proof.' }
              $script:stage = 'fixed-six-green'
              $greenRoot = Join-Path $raw 'green'
              Invoke-PrivateNative -File pwsh -Arguments @('-NoProfile', '-File', './scripts/Invoke-CiTest.ps1', '-Project', 'tests/OpenClaw.Tray.Tests', '-ResultsDirectory', $greenRoot, '-TrxFileName', 'green.trx', '-Runtime', 'win-x64', '-Filter', "FullyQualifiedName~$class", '-HangTimeoutSeconds', '300', '-RequireAllTestsPassed') -Label $script:stage
              $script:stage = 'green-report-cardinality'
              $reports = @(Get-ChildItem -LiteralPath $greenRoot -Recurse -Filter 'green.trx' -File)
              if ($reports.Count -ne 1) { throw 'Expected one green report.' }
              $script:stage = 'green-trx-parse'
              $greenDoc = Read-PrivateTrx -Path $reports[0].FullName
              $script:stage = 'green-six-method-coverage'
              $greenMethods = @($greenDoc.xml.SelectNodes('/t:TestRun/t:TestDefinitions/t:UnitTest/t:TestMethod', $greenDoc.ns))
              $expectedMethods = @('PowerShellRunBlocks_DoNotInterpolateWorkflowCallInputs', 'Workflow_BindsCheckoutTagAndArtifactToImmutableIdentities', 'Workflow_BuildsOnlyTheDeclaredMainSourceTray', 'Workflow_RestoresHostedBuildPrerequisites', 'Workflow_InitializesMainAppDependenciesFromDeclaredSource', 'Workflow_RecordsOnlyExplicitProtocolMismatchOutcome')
              $names = @($greenMethods | ForEach-Object { if ($_.GetAttribute('className') -cne $class) { throw 'Unexpected green class.' }; $_.GetAttribute('name') })
              if ($names.Count -ne 6 -or @(Compare-Object ($expectedMethods | Sort-Object) ($names | Sort-Object)).Count -ne 0) { throw 'Green class coverage mismatch.' }
              $summary.green = [ordered]@{ executed = 6; passed = 6; skipped = 0; trx_sha256 = (Get-FileHash $reports[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
              foreach ($suite in @('Shared', 'Tray')) {
                  $script:stage = "full-$suite"
                  $project = "./tests/OpenClaw.$suite.Tests/OpenClaw.$suite.Tests.csproj"
                  # Restore default targets for the literal root-policy command. Tray declares RIDs.
                  Invoke-PrivateNative -File dotnet -Arguments @('restore', $project) -Label "restore-full-$suite"
                  $invocation = New-TestInvocation -ResultsDirectory (Join-Path $raw $suite) -TrxFileName "$suite.trx"
                  $previousIntegration = $env:OPENCLAW_RUN_INTEGRATION
                  try {
                      if ($suite -eq 'Shared') { $env:OPENCLAW_RUN_INTEGRATION = '1' }
                      Invoke-PrivateNative -File dotnet -Arguments @('test', $project, '--no-restore', '--results-directory', $invocation.directory, '--logger', "trx;LogFileName=$suite.trx", '--blame-hang', '--blame-hang-timeout', '300s', '--blame-hang-dump-type', 'none') -Label $script:stage
                  } finally { $env:OPENCLAW_RUN_INTEGRATION = $previousIntegration }
                  $result = Read-TestResultContract -Path $invocation.report -StartedUtc $invocation.startedUtc -ExitCode 0 -AllowSkipped
                  $summary[$suite] = [ordered]@{ discovered = $result.discovered; executed = $result.executed; passed = $result.passed; failed = $result.failed; skipped = $result.skipped; outcome = $result.outcome; trx_sha256 = (Get-FileHash $invocation.report -Algorithm SHA256).Hash.ToLowerInvariant() }
              }
              $summary.outcome = 'passed'
          } catch {
              # No exception messages, native logs, XML content, tokens, or fixture data at egress.
              $summary.failure_type = $_.Exception.GetType().Name
              $summary.outcome = 'failed'
          } finally {
              $summary.stage = $script:stage
              if ($null -ne $original) {
                  [IO.File]::WriteAllBytes($path, $original)
                  $summary.restored_workflow_sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
                  $summary.restored = $summary.restored_workflow_sha256 -ceq $summary.original_workflow_sha256
              }
              $dirty = & git status --porcelain --untracked-files=all
              $statusExit = $LASTEXITCODE
              $finalHead = & git rev-parse HEAD
              $headExit = $LASTEXITCODE
              $summary.clean = $statusExit -eq 0 -and -not $dirty -and $headExit -eq 0 -and $finalHead -ceq $h
              if (-not $summary.restored -or -not $summary.clean) { $summary.outcome = 'failed' }
              $summary | ConvertTo-Json -Depth 7 | Set-Content -LiteralPath (Join-Path $public 'summary.json') -Encoding utf8
          }
          if ($summary.outcome -cne 'passed') { Write-Host "Exact-H proof failed at $($summary.stage); only allowlisted summary is published."; exit 1 }
          Write-Host 'Exact-H build, expected-red, six-green, and full Shared/Tray commands completed; see summary for permitted suite skips.'
      - name: Publish content-free proof summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exact-h76-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h76-proof/public/summary.json
          if-no-files-found: error
          retention-days: 7
