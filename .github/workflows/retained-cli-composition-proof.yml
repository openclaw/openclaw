name: Exact final candidate capacity failure diagnostics
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed diagnostic workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: final-02021f-capacity-recovery
  cancel-in-progress: false
env:
  CI: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  TARGET_SHA: 02021f24d731ebba531c3ff40ba022da948eaf95
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LANE: preflight
      SAFE_PROOF: .artifacts/final-recovery/preflight
      PRIVATE_PROOF: ${{ github.workspace }}/../final-recovery-private/preflight
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 02021f24d731ebba531c3ff40ba022da948eaf95
        persist-credentials: false
        fetch-depth: 1
    - name: Bind exact final candidate and reviewed helper
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$PRIVATE_PROOF"

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/hosted.py"

        echo ''210798cfed51c319931b8a4f7a000516e9d71e85b224da1804d4c8918e5f5185  ''"$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/verify_results.py"

        echo ''422c62c167fa30213e7748efde74c4e4c85693d1e32cc76c0fb758fdf0113227  ''"$PRIVATE_PROOF/verify_results.py" | sha256sum --check --strict

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/manifest.json"

        echo ''8cfa97e03ac204e4af0313f70ee51cf98b634edee5b7642e3aab95978e7dc66c  ''"$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'false'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - name: Run exact final candidate lane
      shell: bash
      run: 'python3 "$PRIVATE_PROOF/hosted.py" run

        '
    - name: Capture safe diagnostics even after failure
      if: always()
      shell: bash
      run: 'if [ -f "$PRIVATE_PROOF/hosted.py" ]; then python3 "$PRIVATE_PROOF/hosted.py" finalize; fi

        '
    - name: Upload explicit safe evidence only
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: final-02021f-preflight-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/final-recovery/preflight/identity.json

          .artifacts/final-recovery/preflight/report.json'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANE: capacity
      SAFE_PROOF: .artifacts/final-recovery/capacity
      PRIVATE_PROOF: ${{ github.workspace }}/../final-recovery-private/capacity
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 02021f24d731ebba531c3ff40ba022da948eaf95
        persist-credentials: false
        fetch-depth: 1
    - name: Bind exact final candidate and reviewed helper
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$PRIVATE_PROOF"

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/hosted.py"

        echo ''210798cfed51c319931b8a4f7a000516e9d71e85b224da1804d4c8918e5f5185  ''"$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/verify_results.py"

        echo ''422c62c167fa30213e7748efde74c4e4c85693d1e32cc76c0fb758fdf0113227  ''"$PRIVATE_PROOF/verify_results.py" | sha256sum --check --strict

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/manifest.json"

        echo ''8cfa97e03ac204e4af0313f70ee51cf98b634edee5b7642e3aab95978e7dc66c  ''"$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Install candidate Chromium prerequisite
      shell: bash
      run: 'set -euo pipefail

        pnpm --dir ui exec playwright install --with-deps chromium > "$PRIVATE_PROOF/browser-install.log" 2>&1

        '
    - name: Run exact final candidate lane
      shell: bash
      run: 'python3 "$PRIVATE_PROOF/hosted.py" run

        '
    - name: Capture safe diagnostics even after failure
      if: always()
      shell: bash
      run: 'if [ -f "$PRIVATE_PROOF/hosted.py" ]; then python3 "$PRIVATE_PROOF/hosted.py" finalize; fi

        '
    - name: Upload explicit safe evidence only
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: final-02021f-capacity-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/final-recovery/capacity/identity.json

          .artifacts/final-recovery/capacity/report.json

          .artifacts/final-recovery/capacity/tests.json

          .artifacts/final-recovery/capacity/inner-status.json'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANE: ${{ matrix.lane }}
      SAFE_PROOF: .artifacts/final-recovery/${{ matrix.lane }}
      PRIVATE_PROOF: ${{ github.workspace }}/../final-recovery-private/${{ matrix.lane }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 02021f24d731ebba531c3ff40ba022da948eaf95
        persist-credentials: false
        fetch-depth: 1
    - name: Bind exact final candidate and reviewed helper
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$PRIVATE_PROOF"

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/hosted.py"

        echo ''210798cfed51c319931b8a4f7a000516e9d71e85b224da1804d4c8918e5f5185  ''"$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/verify_results.py"

        echo ''422c62c167fa30213e7748efde74c4e4c85693d1e32cc76c0fb758fdf0113227  ''"$PRIVATE_PROOF/verify_results.py" | sha256sum --check --strict

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/manifest.json"

        echo ''8cfa97e03ac204e4af0313f70ee51cf98b634edee5b7642e3aab95978e7dc66c  ''"$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Run exact final candidate lane
      shell: bash
      run: 'python3 "$PRIVATE_PROOF/hosted.py" run

        '
    - name: Capture safe diagnostics even after failure
      if: always()
      shell: bash
      run: 'if [ -f "$PRIVATE_PROOF/hosted.py" ]; then python3 "$PRIVATE_PROOF/hosted.py" finalize; fi

        '
    - name: Upload explicit safe evidence only
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: final-02021f-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/final-recovery/${{ matrix.lane }}/identity.json

          .artifacts/final-recovery/${{ matrix.lane }}/report.json

          .artifacts/final-recovery/${{ matrix.lane }}/tests.json

          .artifacts/final-recovery/${{ matrix.lane }}/inner-status.json'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        lane:
        - telegram
        - lease
        - large-store
