    env:
      RELOAD_ROLE: ${{ matrix.role }}
      RELOAD_PRODUCT_SHA: ${{ matrix.product_ref }}
      RELOAD_BEFORE_SHA: 9e2959c8816c90e913ebad872bc9e6c4d2222738
      RELOAD_BEFORE_TREE: b544b925feaf720363ed0a5c0830ad457f559886
      RELOAD_TEST_SOURCE: f5e51d9e464afc9f240c5f18f16f0de0954cf04a
      RELOAD_PATCH_SHA256: 38b29885045114487b2258bc5f635be21836d4872b4e1a9cb9f6325e18912da3
      RELOAD_TEST_HASHES: '051acfd311c28eeae0fa27a9565f336bf6f7052f8b4e6a867b7b0b99cc6f5960  src/gateway/server-plugin-reload.prepared-borrow.test.ts

        aa6c38fef0efb27c65f879a8e4210173bed3d4610a8c0a0701128fee48d3e711  src/gateway/server-plugin-reload.recovery.test.ts'
      RELOAD_EXPECTED_CASES: '["prepared Gateway plugin borrowing borrows unchanged Gateway instances into prepared turns
        across automatic busy","prepared Gateway plugin borrowing borrows unchanged Gateway instances into prepared turns
