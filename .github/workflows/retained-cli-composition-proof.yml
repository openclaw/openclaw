        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.gz.b64"

        '
    - name: Transport manifest.json 3
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.gz.b64"

        '
    - name: Transport manifest.json 4
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.gz.b64"

        '
    - name: Transport manifest.json 5
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.gz.b64"

        '
    - name: Transport manifest.json 6
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.gz.b64"

        '
    - name: Verify manifest.json transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/manifest.json.gz.b64" | gzip -d > "$PRIVATE_PROOF/manifest.json"

        printf ''%s\n'' ''18cbc5492e9ce41a01e3853e6d314b73d0d78add958fbd1c22663fcf45052f84  ''"$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        '
    - name: Transport transport-groups.json 1
