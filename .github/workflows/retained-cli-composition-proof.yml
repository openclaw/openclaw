name: Patched delegation authority binding diagnostic
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: 'true'
      SAFE_PROOF: .artifacts/delegation-binding
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: c89139757f2c6728863a740309027562004163f8
        persist-credentials: false
        fetch-depth: 1
      timeout-minutes: 4
    - name: Bind exact unmodified base and immutable diagnostic patch
      shell: bash
      run: 'set -euo pipefail

        export PRIVATE_PROOF="$RUNNER_TEMP/delegation-binding"

        mkdir -p "$PRIVATE_PROOF"

        printf %s  | base64 --decode > "$PRIVATE_PROOF/hosted.py"

        echo 71064ddfe4e600fbc4960f1d1c19942f5f14044f89a84bde1616e0ee5961876c  "$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        printf %s  | base64 --decode > "$PRIVATE_PROOF/verify_results.py"

        echo f8e7de58a315c06d5443cdf1c96c7b4f21a44a253155ee2396797036f13abed6  "$PRIVATE_PROOF/verify_results.py" | sha256sum --check --strict

        printf %s  | base64 --decode > "$PRIVATE_PROOF/manifest.json"

        echo e17954eee1451141790ad5980287d5aab6e36c17f12727998e3f767f3d7d08d5  "$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        printf %s  | base64 --decode > "$PRIVATE_PROOF/proposed.patch"

        echo d884610c03e4d77f70c0ec33716b607464ec1a77ebbc6e7de013b05c8c03d3e9  "$PRIVATE_PROOF/proposed.patch" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/hosted.py" bind'
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
      timeout-minutes: 4
    - uses: ./.github/actions/setup-test-bun
      timeout-minutes: 4
    - name: Apply test-only patch and run three bounded diagnostic cases
      shell: bash
      timeout-minutes: 6
      run: export PRIVATE_PROOF="$RUNNER_TEMP/delegation-binding"; python3 "$PRIVATE_PROOF/hosted.py" run
    - name: Finalize safe diagnostic status
      if: always()
      shell: bash
      run: export PRIVATE_PROOF="$RUNNER_TEMP/delegation-binding"; if [ -f "$PRIVATE_PROOF/hosted.py" ]; then python3 "$PRIVATE_PROOF/hosted.py" finalize; fi
    - name: Upload only safe patched diagnostic evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: delegation-binding-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/delegation-binding/identity.json

          .artifacts/delegation-binding/report.json

          .artifacts/delegation-binding/tests.json'
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 7
