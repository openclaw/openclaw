name: Matrix public-message-actions collision diagnostic
'on':
  workflow_dispatch:
    inputs:
      runner_group:
        type: string
        default: ''
        description: Existing release runner group; empty preserves default
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_VERSION: 24.22.1
  OPENCLAW_CI_OPENAI_MODEL: ${{ vars.OPENCLAW_CI_OPENAI_MODEL || 'openai/gpt-5.6-luna' }}
  OPENCLAW_CI_OPENAI_FALLBACK_MODEL: ${{ vars.OPENCLAW_CI_OPENAI_FALLBACK_MODEL || 'openai/gpt-5.4' }}
  OPENCLAW_BUILD_PRIVATE_QA: '1'
  OPENCLAW_ENABLE_PRIVATE_QA_CLI: '1'
  EXPECTED_TARGET: 73bef956a886abbbe6aef0c87efd5bcbfd6f8921
jobs:
  matrix_diagnostic:
    name: Matrix collision diagnostic (not qualification)
    runs-on: ${{ inputs.runner_group != '' && fromJSON(format('{{"group":{0},"labels":{1}}}', toJSON(inputs.runner_group),
      toJSON(vars.OPENCLAW_CI_RUNNER_BACKEND == 'github' && 'ubuntu-24.04' || 'blacksmith-16vcpu-ubuntu-2404'))) || (vars.OPENCLAW_CI_RUNNER_BACKEND
      == 'github' && 'ubuntu-24.04' || 'blacksmith-16vcpu-ubuntu-2404') }}
    timeout-minutes: 90
    concurrency:
      group: matrix-collision-diagnostic-73bef956a886abbbe6aef0c87efd5bcbfd6f8921
      cancel-in-progress: false
      queue: max
    environment: qa-live-shared
    steps:
    - name: Checkout selected ref
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 73bef956a886abbbe6aef0c87efd5bcbfd6f8921
        fetch-depth: 1
    - name: Bind candidate and diagnostic-only overlay
      shell: bash
      env:
        WORKFLOW_SHA: ${{ github.workflow_sha }}
      run: 'set -euo pipefail

        proof=.artifacts/matrix-collision-binding

        mkdir -p "$proof"

        env | grep -E "^(EXPECTED_TARGET|WORKFLOW_SHA|GITHUB_RUN_ID|GITHUB_RUN_ATTEMPT)=" > "$proof/identity.txt"

        test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"

        test -z "$(git status --porcelain)"

        base64 --decode > "$proof/collision-observability.patch" <<''BOUND''

        

        BOUND

        base64 --decode > "$proof/originals.sha256" <<''BOUND''

        YWI4OTg4Y2U5ZTU4NzU5NmZmNDE3Y2QyN2FhNWVjNzAzMjMwMzExZjA3ZDU0MGMzYTk3ODYxMTAxNTk3YTgyZCAgc3JjL2dhdGV3YXkvc2VydmVyL2h0dHAtbGlzdGVuLnRzCjhjOTgxMzI3OWJjZmQwZTNmNjY5OTE3YjJkNjY0ODA0ZWE1MDk0ZTg3MmI0MzdmZGM4ZDU3MjkxNTc3YWIxMjMgIGV4dGVuc2lvbnMvcWEtbGFiL3NyYy9nYXRld2F5LWNoaWxkLXNldHVwLnRzCg==

        BOUND

        base64 --decode > "$proof/overlays.sha256" <<''BOUND''

        MmEwYWQ5Yjk3YzI5YjMyZWU5ZTcwYWQ2YTRkN2Y3OTcwMjg2YTI3NDE3N2U3MGU5M2ZjNzA1NDE2NDA2N2M4MyAgc3JjL2dhdGV3YXkvc2VydmVyL2h0dHAtbGlzdGVuLnRzCmQzZmFhYWUyOTQ2MmIyZTI5NWM4OWQ0Y2M0MTEzY2I0OWNkYjRmZGEzMTUyZGI3NjhkNDAyOTk4ODA0MDljM2IgIGV4dGVuc2lvbnMvcWEtbGFiL3NyYy9nYXRld2F5LWNoaWxkLXNldHVwLnRzCg==

        BOUND

        base64 --decode > "$proof/prerequisites.sha256" <<''BOUND''

        

        BOUND

        echo "290b71f104ae73e8eb6c8a7318aa17668d51a8ae3f27936057c81c5c048d0697  $proof/collision-observability.patch" | sha256sum
        --check --strict

        sha256sum --check --strict "$proof/originals.sha256"

        sha256sum --check --strict "$proof/prerequisites.sha256"

        git apply --check "$proof/collision-observability.patch"

        git apply "$proof/collision-observability.patch"

        sha256sum --check --strict "$proof/overlays.sha256"

        git diff --check

        git diff --binary --full-index > "$proof/applied.patch"

        git diff --name-only | LC_ALL=C sort > "$proof/changed-paths.txt"

        echo ''extensions/qa-lab/src/gateway-child-setup.ts

        src/gateway/server/http-listen.ts'' > "$proof/expected-paths.txt"

        diff -u "$proof/expected-paths.txt" "$proof/changed-paths.txt"

        '
    - name: Setup Node environment
      uses: ./.github/actions/setup-node-env
      with:
        cache-mode: restore
        node-version: ${{ env.NODE_VERSION }}
        install-bun: 'true'
    - name: Build private QA runtime
      env:
        NODE_OPTIONS: --max-old-space-size=12288
      run: pnpm build
    - name: Run Matrix live lane
      id: run_lane
      shell: bash
      env:
        OPENCLAW_QA_REDACT_PUBLIC_METADATA: '1'
        FAIL_FAST: 'false'
        INPUT_SCENARIO: matrix-public-message-actions
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENCLAW_LIVE_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: "set -euo pipefail\n\noutput_dir=\".artifacts/qa-e2e/matrix-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\nmkdir\
        \ -p \"${output_dir}\"\n\nmatrix_args=(\n  --repo-root . \\\n  --output-dir \"${output_dir}\" \\\n  --provider-mode\
        \ mock-openai \\\n  --fast\n)\nif [[ -n \"${INPUT_SCENARIO// }\" ]]; then\n  IFS=',' read -r -a raw_scenarios <<<\"\
        ${INPUT_SCENARIO}\"\n  for raw in \"${raw_scenarios[@]}\"; do\n    scenario=\"$(printf '%s' \"${raw}\" | sed -e 's/^[[:space:]]*//'\
        \ -e 's/[[:space:]]*$//')\"\n    if [[ -n \"${scenario}\" ]]; then\n      matrix_args+=(--scenario \"${scenario}\"\
        )\n    fi\n  done\nfi\nif [[ \"$FAIL_FAST\" == \"true\" ]] && pnpm openclaw qa matrix --help 2>/dev/null | grep -F\
        \ -q -- \"--fail-fast\"; then\n  matrix_args+=(--fail-fast)\nfi\npnpm openclaw qa matrix \"${matrix_args[@]}\"\n"
    - name: Upload Matrix QA artifacts
      id: upload_artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: matrix-collision-raw-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/qa-e2e/matrix-live-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 14
        if-no-files-found: error
    - name: Upload binding and raw diagnostic overlay
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: matrix-collision-binding-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/matrix-collision-binding
        retention-days: 14
        if-no-files-found: error
