name: Combined Gateway write-boundary diagnostic 11a
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed diagnostic workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: delegation-write-boundary-11a
  cancel-in-progress: false
env:
  CI: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  TARGET_SHA: 11a0a9680d22977f0570409dbe8016c85a1ec3fd
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANE: boundary
      SAFE_PROOF: .artifacts/delegation-write-boundary
      PRIVATE_PROOF: ${{ github.workspace }}/../delegation-write-boundary-private
      OPENCLAW_BOUNDARY_DIAGNOSTIC: ${{ github.workspace }}/../delegation-write-boundary-private/boundary-raw.json
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 11a0a9680d22977f0570409dbe8016c85a1ec3fd
        persist-credentials: false
        fetch-depth: 1
    - name: Initialize exact diagnostic transport
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$PRIVATE_PROOF"

        : > "$PRIVATE_PROOF/hosted.py.b64"

        : > "$PRIVATE_PROOF/verify_results.py.b64"

        : > "$PRIVATE_PROOF/boundary_data.py.b64"

        : > "$PRIVATE_PROOF/manifest.json.b64"

        : > "$PRIVATE_PROOF/proposed.patch.b64"

        '
    - name: Transport hosted.py chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/hosted.py.b64"

        '
    - name: Transport verify_results.py chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/verify_results.py.b64"

        '
    - name: Transport boundary_data.py chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/boundary_data.py.b64"

        '
    - name: Transport manifest.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport proposed.patch chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/proposed.patch.b64"

        '
    - name: Verify decoded capsule and bind exact candidate
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/hosted.py.b64" | gzip -d > "$PRIVATE_PROOF/hosted.py"

        echo bec19c05d09284a70dc9c803ecb2542f70b3cd8f11d11b4c1ff315988225e3ba  "$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/verify_results.py.b64" | gzip -d > "$PRIVATE_PROOF/verify_results.py"

        echo 17290a0c3cda5a8ca5966746d4b4ce807f1ce8d1eb0e6824d05a03cf4b99f09b  "$PRIVATE_PROOF/verify_results.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/boundary_data.py.b64" | gzip -d > "$PRIVATE_PROOF/boundary_data.py"

        echo 2f22dc76718fc926e388c6b31a2c30073b5ad2d422370f26551eee682512faa4  "$PRIVATE_PROOF/boundary_data.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/manifest.json.b64" | gzip -d > "$PRIVATE_PROOF/manifest.json"

        echo c07995b7eeef07e2aaa6cdbdd18868e45700bbd7cad155bb86427e2a153eb16a  "$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/proposed.patch.b64" | gzip -d > "$PRIVATE_PROOF/proposed.patch"

        echo 6dcd973c3b5e9d798a5c679156d4710ff17b5e34c5d4b58e133de09001527f5b  "$PRIVATE_PROOF/proposed.patch" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Run exact final candidate lane
      shell: bash
      run: 'python3 "$PRIVATE_PROOF/hosted.py" run

        '
    - name: Capture safe diagnostics even after failure
      if: always()
      shell: bash
      run: 'if [ -f "$PRIVATE_PROOF/hosted.py" ]; then python3 "$PRIVATE_PROOF/hosted.py" finalize; fi

        '
    - name: Upload explicit safe evidence only
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: delegation-write-boundary-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/delegation-write-boundary/identity.json

          .artifacts/delegation-write-boundary/report.json

          .artifacts/delegation-write-boundary/tests.json

          .artifacts/delegation-write-boundary/inner-status.json

          .artifacts/delegation-write-boundary/boundary.json'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
