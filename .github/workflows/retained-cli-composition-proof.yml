name: Exact candidate agents-sessions compiler diagnosis
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: final-02021f-agents-sessions-diagnosis
  cancel-in-progress: false
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
  OPENCLAW_CI_STATIC_EVIDENCE: '1'
  PRIVATE_PROOF: ${{ github.workspace }}/../agents-sessions-private
  SAFE_PROOF: .artifacts/agents-sessions-safe
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 02021f24d731ebba531c3ff40ba022da948eaf95
        persist-credentials: false
        fetch-depth: 1
    - name: Bind reviewed diagnostic helper
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$PRIVATE_PROOF" "$SAFE_PROOF"

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/diagnose.py"

        echo 86d7505684cb7d77def482009dc642ada98c81f7f5b7ced10439caeebd30106e  "$PRIVATE_PROOF/diagnose.py" | sha256sum --check --strict'
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Run canonical failed graph only
      timeout-minutes: 22
      shell: bash
      run: python3 "$PRIVATE_PROOF/diagnose.py"
    - name: Upload safe numeric diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: agents-sessions-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/agents-sessions-safe/diagnosis.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
