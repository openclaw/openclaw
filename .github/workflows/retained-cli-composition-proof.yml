name: Repaired candidate narrow compiler and fixture proof
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: fixture-repair-d8e9f1eb92b3903f022d6d5cdf9f426182a62668
  cancel-in-progress: false
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
  OPENCLAW_CI_STATIC_EVIDENCE: '1'
  PRIVATE_PROOF: ${{ github.workspace }}/../agents-sessions-private
  SAFE_PROOF: .artifacts/agents-sessions-safe
  TARGET_SHA: d8e9f1eb92b3903f022d6d5cdf9f426182a62668
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: d8e9f1eb92b3903f022d6d5cdf9f426182a62668
        persist-credentials: false
        fetch-depth: 1
    - name: Bind reviewed diagnostic helper
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$PRIVATE_PROOF" "$SAFE_PROOF"

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/diagnose.py"

        echo 6cac63fe02da44db55f5478c4a2cd70a937b61133ece550699abcb2bff394bbc  "$PRIVATE_PROOF/diagnose.py" | sha256sum --check --strict

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Run canonical failed graph only
      timeout-minutes: 22
      shell: bash
      run: python3 "$PRIVATE_PROOF/diagnose.py"
    - name: Upload safe numeric diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: agents-sessions-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/agents-sessions-safe/diagnosis.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANE: large-store
      SAFE_PROOF: .artifacts/final-recovery/large-store
      PRIVATE_PROOF: ${{ github.workspace }}/../final-recovery-private/large-store
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: d8e9f1eb92b3903f022d6d5cdf9f426182a62668
        persist-credentials: false
        fetch-depth: 1
    - name: Bind exact final candidate and reviewed helper
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$PRIVATE_PROOF"

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/hosted.py"

        echo ''210798cfed51c319931b8a4f7a000516e9d71e85b224da1804d4c8918e5f5185  ''"$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/verify_results.py"

        echo ''422c62c167fa30213e7748efde74c4e4c85693d1e32cc76c0fb758fdf0113227  ''"$PRIVATE_PROOF/verify_results.py" | sha256sum --check --strict

        printf %s '''' | base64 --decode > "$PRIVATE_PROOF/manifest.json"

        echo ''7d5dc8f66838ef0489cc07c6291471bc5f0da87cae5ecb968e5f1c52adbfc54f  ''"$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Run exact final candidate lane
      shell: bash
      run: 'python3 "$PRIVATE_PROOF/hosted.py" run

        '
    - name: Capture safe diagnostics even after failure
      if: always()
      shell: bash
      run: 'if [ -f "$PRIVATE_PROOF/hosted.py" ]; then python3 "$PRIVATE_PROOF/hosted.py" finalize; fi

        '
    - name: Upload explicit safe evidence only
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: fixture-runtime-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/final-recovery/large-store/identity.json

          .artifacts/final-recovery/large-store/report.json

          .artifacts/final-recovery/large-store/tests.json

          .artifacts/final-recovery/large-store/inner-status.json'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
