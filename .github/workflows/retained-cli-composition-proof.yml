name: Exact-C 005030 UI publication diagnostic - not qualification
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact independently reviewed workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ui-publication-diagnostic-005030
  cancel-in-progress: false
env:
  CI: 'true'
  OPENCLAW_BUILD_PRIVATE_QA: '1'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  OPENCLAW_CAPTURE_UI_PROOF: '0'
  OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: '300000'
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
jobs:
  ui-original-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PRIVATE_PROOF: ${{ github.workspace }}/../ui-publication-private/005030
      SAFE_PROOF: ${{ github.workspace }}-ui-publication-safe/005030
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 005030c3a09843601af3de546dbff77240175a66
        persist-credentials: false
        fetch-depth: 1
    - name: Initialize private evidence directories
      shell: bash
      run: 'set -euo pipefail

        umask 077

        mkdir -p "$PRIVATE_PROOF" "$SAFE_PROOF"

        '
    - name: Transport and verify hosted.py
      shell: bash
      run: 'set -euo pipefail

        umask 077

        printf %s ''''
        | base64 --decode > "$PRIVATE_PROOF/hosted.py"

        printf ''%s\n'' ''61e821800f61769e323dd407deaba9bf663cb5990baa3e251d8356b42e59ad94  ''"$PRIVATE_PROOF/hosted.py" |
        sha256sum --check --strict

        '
    - name: Transport and verify containment.py
      shell: bash
      run: 'set -euo pipefail

        umask 077

        printf %s ''''
        | base64 --decode > "$PRIVATE_PROOF/containment.py"

        printf ''%s\n'' ''4407da3114659b3dc109be58b87956449cb98e9d4392a49119a6f227f6cf8d56  ''"$PRIVATE_PROOF/containment.py"
        | sha256sum --check --strict

        '
    - name: Transport and verify include.json
      shell: bash
      run: 'set -euo pipefail

        umask 077

        printf %s ''''
        | base64 --decode > "$PRIVATE_PROOF/include.json"

        printf ''%s\n'' ''19bb49a3109d7386e044078a8bc8cecc5d95cd976e3e5ea2b7ceb43882ad7d32  ''"$PRIVATE_PROOF/include.json"
        | sha256sum --check --strict

        '
    - name: Transport and verify manifest.json
      shell: bash
      run: 'set -euo pipefail

        umask 077

        printf %s ''''
        | base64 --decode > "$PRIVATE_PROOF/manifest.json"

        printf ''%s\n'' ''428be47131ab78833776834b269c100b86f8a5f5f05af669da7b9dc3bd3b491f  ''"$PRIVATE_PROOF/manifest.json"
        | sha256sum --check --strict

        '
    - name: Bind exact candidate before setup
      shell: bash
      run: python3 -B "$PRIVATE_PROOF/hosted.py" bind
    - uses: ./.github/actions/setup-node-env
      timeout-minutes: 20
      with:
        node-version: 24.22.1
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
      timeout-minutes: 5
    - name: Build then run original twenty-file shard once
      shell: bash
      run: python3 -B "$PRIVATE_PROOF/hosted.py" run
    - name: Retain only allowlisted raw diagnostic evidence
      if: always()
      shell: bash
      run: python3 -B "$PRIVATE_PROOF/hosted.py" export
    - name: Upload bounded diagnostic evidence even on failure
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ui-publication-005030-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ github.workspace }}-ui-publication-safe/005030/identity.json

          ${{ github.workspace }}-ui-publication-safe/005030/report.json

          ${{ github.workspace }}-ui-publication-safe/005030/shard-exit.json

          ${{ github.workspace }}-ui-publication-safe/005030/artifacts.json

          ${{ github.workspace }}-ui-publication-safe/005030/shard.log

          ${{ github.workspace }}-ui-publication-safe/005030/build.log

          ${{ github.workspace }}-ui-publication-safe/005030/browser-install.log

          ${{ github.workspace }}-ui-publication-safe/005030/publication.json

          ${{ github.workspace }}-ui-publication-safe/005030/gateway.log'
        if-no-files-found: error
        retention-days: 14
