name: "PowerShell original Linux startup diagnostic \u2014 not qualification"
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: powershell-startup-diagnostic
  cancel-in-progress: false
env:
  CI: 'true'
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
jobs:
  selected-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENCLAW_VITEST_MAX_WORKERS: '2'
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_E2E_USE_PREBUILT_DIST: ''
      OPENCLAW_CI_TEST_RUNTIME_POLICY: dual
      FROZEN_TARGET: 'false'
      RUNNER_ENVIRONMENT: github-hosted
      OPENCLAW_NODE_TEST_CONFIGS_JSON: 'null'
      OPENCLAW_NODE_TEST_ENV_JSON: 'null'
      OPENCLAW_NODE_TEST_INCLUDE_PATTERNS_JSON: 'null'
      OPENCLAW_NODE_TEST_TARGETS_JSON: 'null'
      OPENCLAW_VITEST_SHARD_NAME: ''
      OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: '300000'
      OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: ''
      OPENCLAW_NODE_TEST_VITEST_ARGS_JSON: '[]'
      PRIVATE_PROOF: ${{ github.workspace }}/../powershell-private
      SAFE_PROOF: ${{ github.workspace }}-powershell-safe
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: ec5b98921312f748fb32ebdb19336b802f3092b2
        persist-credentials: false
        fetch-depth: 1
    - name: Initialize private evidence
      shell: bash
      run: 'set -euo pipefail

        umask 077

        mkdir -p "$PRIVATE_PROOF" "$SAFE_PROOF"

        '
    - name: Transport and verify hosted.py
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' | base64 --decode | gzip -d > "$PRIVATE_PROOF/hosted.py"

        printf ''%s\n'' ''c2755c921241a77158186187e40c2f15120976612187542720a4e382cb5fbd8a  ''"$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        '
    - name: Transport and verify containment.py
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' | base64 --decode | gzip -d > "$PRIVATE_PROOF/containment.py"

        printf ''%s\n'' ''f8d859f25661719c3dcbf8d3e503e9399b2f6f1526f0128a7da228f1de385c79  ''"$PRIVATE_PROOF/containment.py" | sha256sum --check --strict

        '
    - name: Transport and verify observe.py
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' | base64 --decode | gzip -d > "$PRIVATE_PROOF/observe.py"

        printf ''%s\n'' ''86dbbc4da5ef0bf961a2de9d73785e8cc56640b103bdca2e41b3de1e34b38baa  ''"$PRIVATE_PROOF/observe.py" | sha256sum --check --strict

        '
    - name: Transport and verify run_observed.py
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' | base64 --decode | gzip -d > "$PRIVATE_PROOF/run_observed.py"

        printf ''%s\n'' ''3d8ada23be1f1f0c5469ee25066acbe0f3f26b6895386c468c8540173ef6bb07  ''"$PRIVATE_PROOF/run_observed.py" | sha256sum --check --strict

        '
    - name: Transport and verify native_data.py
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' | base64 --decode | gzip -d > "$PRIVATE_PROOF/native_data.py"

        printf ''%s\n'' ''769d42335031bd75b4573f43d535ade4c70d8bdb9b81a4201f41f04af394fdbb  ''"$PRIVATE_PROOF/native_data.py" | sha256sum --check --strict

        '
    - name: Transport and verify project_observations.py
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' | base64 --decode | gzip -d > "$PRIVATE_PROOF/project_observations.py"

        printf ''%s\n'' ''17075a5fcbde7363dd0a7316768b6e41aee2cf582937522ba9a993b37ad6788e  ''"$PRIVATE_PROOF/project_observations.py" | sha256sum --check --strict

        '
    - name: Transport and verify manifest.json
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' | base64 --decode | gzip -d > "$PRIVATE_PROOF/manifest.json"

        printf ''%s\n'' ''6e0f3f82b5c2dfa5cce77056bd2c94adfc61a4523e370992c00fcbcbc04eca5b  ''"$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        '
    - name: Bind exact diagnostic source
      shell: bash
      run: 'set -euo pipefail

        python3 -B "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        node-version: 24.22.1
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
        vitest-fs-cache: 'true'
        node-compile-cache: 'true'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Run original dual-runtime shard with passive observer
      shell: bash
      run: 'set -euo pipefail

        python3 -B "$PRIVATE_PROOF/hosted.py" run

        '
    - name: Upload bounded evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: powershell-startup-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ github.workspace }}-powershell-safe/identity.json

          ${{ github.workspace }}-powershell-safe/report.json

          ${{ github.workspace }}-powershell-safe/native.json

          ${{ github.workspace }}-powershell-safe/observations.json'
        if-no-files-found: error
        retention-days: 14
