name: Release canonical locale translation repair
'on':
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        type: string
        description: Exact frozen candidate SHA; prerequisite diagnostic, not final FRV
permissions:
  contents: read
concurrency:
  group: release-ports-${{ inputs.target_ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  BASE_SHA: 89f5912fbe1d26ad81758d6f07e116b39a4e45f9
  REQUIRED_CHECKS_BASE: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  BEFORE_SHA: f38131f934b45447558cf6f431353a49656198d5
  PREREQUISITE_PARENT: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  CAPACITY_PROOF_SHA: 7af9ee549e45948707162d9d8cfa8c068a084fe6
  PREREQUISITE_PATCH_SHA256: 5d8f8bb9a93331eb4a01ca2aefcf2d655dd0e36821f44353663e62d2751f7dc5
  CANDIDATE_SHA: 915956a6d60f4cf67099b47286ebafaf0cd11cff
  SOURCE_TREE: f3866ec8fa1dfa83d090bf93504ef13dc6bf335e
  PATHS_SHA256: 64cad89471288e6b5a8064919010f3d98cd9d1fee1fefb734382f4c8cb97b2ae
  TRUSTED_P: 68aff7f864148760c3800c95435cc36ddaa91654
jobs:
  locale-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 0
        persist-credentials: false
    - name: Bind exact candidate
      shell: bash
      run: 'set -euo pipefail

        test "${{ inputs.target_ref }}" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

        test -z "$(git status --porcelain)"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        mkdir -p .artifacts/final-ci

        git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort > .artifacts/final-ci/source-paths.txt

        echo "$PATHS_SHA256  .artifacts/final-ci/source-paths.txt" | sha256sum -c -

        printf ''C=%s

        Q=%s

        P=%s

        workflow=%s

        run=%s

        attempt=%s

        '' "$CANDIDATE_SHA" "$CANDIDATE_SHA" "$TRUSTED_P" "${{ github.workflow_sha }}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
        > .artifacts/final-ci/identity.txt

        '
      id: bind
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
      id: setup
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Record all original locale check results
      run: 'set -uo pipefail

        mkdir -p .artifacts/locale

        set +e

        bash scripts/ci-collect-checks.sh ''pnpm ui:i18n:check'' ''pnpm native:i18n:check'' ''pnpm ui:i18n:verify'' ''pnpm
        native:i18n:verify'' 2>&1 | tee .artifacts/locale/original-checks.log

        status=${PIPESTATUS[0]}

        printf ''%s

        '' "$status" > .artifacts/locale/original-checks-exit.txt

        exit "$status"'
    - name: Generate canonical translations using existing locale provider configuration
      if: always() && steps.bind.outcome == 'success' && steps.setup.outcome == 'success'
      run: "set -uo pipefail\nmkdir -p .artifacts/locale\nif [[ -z \"${OPENAI_API_KEY}\" || -z \"${OPENCLAW_CONTROL_UI_I18N_MODEL}\"\
        \ || -z \"${OPENCLAW_I18N_FALLBACK_MODEL}\" ]]; then\n  echo 'Existing translation API key and private primary/fallback\
        \ model settings are required.' >&2\n  exit 1\nfi\nset -uo pipefail\nmkdir -p .artifacts/locale\nset +e\npnpm ui:i18n:sync\
        \ 2>&1 | tee .artifacts/locale/sync.log\nsync_status=${PIPESTATUS[0]}\nprintf '%s\n' \"$sync_status\" > .artifacts/locale/sync-exit.txt\n\
        bash scripts/ci-collect-checks.sh 'pnpm ui:i18n:check' 'pnpm native:i18n:check' 'pnpm ui:i18n:verify' 'pnpm native:i18n:verify'\
        \ 2>&1 | tee .artifacts/locale/generated-checks.log\ncheck_status=${PIPESTATUS[0]}\nprintf '%s\n' \"$check_status\"\
        \ > .artifacts/locale/generated-checks-exit.txt\nset -e\ngit diff --binary --full-index > .artifacts/locale/generated.patch\n\
        git diff --name-only > .artifacts/locale/changed-paths.txt\ngit status --porcelain > .artifacts/locale/status.txt\n\
        git diff --check\ngit diff --name-only -z | tar --null -T - -cf .artifacts/locale/generated-files.tar\nfind .artifacts\
        \ -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > .artifacts/SHA256SUMS\nexit \"$sync_status\""
      env:
        OPENAI_API_KEY: ${{ secrets.OPENCLAW_DOCS_I18N_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
        OPENCLAW_CONTROL_UI_I18N_PROVIDER: openai
        OPENCLAW_CONTROL_UI_I18N_MODEL: ${{ secrets.OPENCLAW_I18N_MODEL }}
        OPENCLAW_I18N_FALLBACK_MODEL: ${{ secrets.OPENCLAW_I18N_FALLBACK_MODEL }}
        OPENCLAW_CONTROL_UI_I18N_THINKING: low
        OPENCLAW_CONTROL_UI_I18N_AUTH_OPTIONAL: '0'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: locale-recovery-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
