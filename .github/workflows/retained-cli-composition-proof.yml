  required-complete:
    runs-on: ubuntu-24.04
    if: always()
    needs:
    - plan
    - noncompiler
    - compiler-check
    - compiler-core
    - tests
    - before-capacity
    - windows-retained
    - controller
    - visual
    - reload-comparison
    steps:
    - name: Fail closed on absent, failed, cancelled or unexpected skipped work
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: "node --input-type=module <<'NODE'\nimport assert from 'node:assert/strict';\nconst n=JSON.parse(process.env.NEEDS_JSON);\n\
        assert.equal(n.plan.result,'success');\nfor (const [name,job] of Object.entries(n)) {\n if (name==='compiler-check'||name==='compiler-core')\
        \ {\n  const key=name==='compiler-check'?'check_matrix':'core_type_matrix';\n  assert(n.plan.outputs[key], 'Missing\
        \ planner output '+key);\n  const rows=JSON.parse(n.plan.outputs[key]).include;\n  assert.equal(job.result,rows.length?'success':'skipped',name);\n\
        \ } else assert.equal(job.result,'success',name);\n}\nNODE"
