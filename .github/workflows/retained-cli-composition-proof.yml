name: Narrow confirmed repair proof
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: next-repairs-proof
  cancel-in-progress: false
env:
  CI: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  TARGET_SHA: c24cc3d81fcf6afc68b6a489602ed2848f958b71
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
  OPENCLAW_VITEST_MAX_WORKERS: '2'
  OPENCLAW_TEST_WORKERS: '2'
  OPENCLAW_TEST_PROJECTS_SERIAL: '1'
  OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: '300000'
  RAYON_NUM_THREADS: '2'
  TOKIO_WORKER_THREADS: '2'
jobs:
  repairs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANE: repairs
      PRIVATE_PROOF: ${{ github.workspace }}/../next-repairs-private/repairs
      SAFE_PROOF: ${{ github.workspace }}-next-repairs-safe/repairs
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: c24cc3d81fcf6afc68b6a489602ed2848f958b71
        persist-credentials: false
        fetch-depth: 1
    - name: Initialize private evidence directories
      shell: bash
      run: 'set -euo pipefail

        umask 077

        mkdir -p "$PRIVATE_PROOF" "$SAFE_PROOF"

        '
    - name: Transport hosted.py 1/1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/hosted.py.b64"

        '
    - name: Verify hosted.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/hosted.py.b64" > "$PRIVATE_PROOF/hosted.py"

        printf ''%s\n'' ''53d4b31da15e1de05d6887b0cd0da16b4dc4b02571fdbe6f2717207060eeb4ea  ''"$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        '
    - name: Transport containment.py 1/1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/containment.py.b64"

        '
    - name: Verify containment.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/containment.py.b64" > "$PRIVATE_PROOF/containment.py"

        printf ''%s\n'' ''f8d859f25661719c3dcbf8d3e503e9399b2f6f1526f0128a7da228f1de385c79  ''"$PRIVATE_PROOF/containment.py" | sha256sum --check --strict

        '
    - name: Transport proof_data.py 1/1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/proof_data.py.b64"

        '
    - name: Verify proof_data.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/proof_data.py.b64" > "$PRIVATE_PROOF/proof_data.py"

        printf ''%s\n'' ''61feb0b79bddabd75520c773e53e0bf67a877204f3937992fd7e009e4a8264ec  ''"$PRIVATE_PROOF/proof_data.py" | sha256sum --check --strict

        '
    - name: Transport native_diagnostics.py 1/1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/native_diagnostics.py.b64"

        '
    - name: Verify native_diagnostics.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/native_diagnostics.py.b64" > "$PRIVATE_PROOF/native_diagnostics.py"

        printf ''%s\n'' ''05aca935a4e30e32ec66dbd23c82a3062fc59dc250fec46d8ce4fcd471c9668a  ''"$PRIVATE_PROOF/native_diagnostics.py" | sha256sum --check --strict

        '
    - name: Transport manifest.json 1/4
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 2/4
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 3/4
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 4/4
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Verify manifest.json transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/manifest.json.b64" > "$PRIVATE_PROOF/manifest.json"

        printf ''%s\n'' ''b37981f618c177d55b233ae6b2ef534d8734424fff588a4d0eb8e2978a9652a6  ''"$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        '
    - name: Bind exact candidate tree and workflow
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Run exact repairs proof
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/hosted.py" run

        '
    - name: Upload exact safe repairs evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: next-repairs-repairs-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ github.workspace }}-next-repairs-safe/repairs/identity.json

          ${{ github.workspace }}-next-repairs-safe/repairs/report.json

          ${{ github.workspace }}-next-repairs-safe/repairs/tests.json

          ${{ github.workspace }}-next-repairs-safe/repairs/inner-status.json

          ${{ github.workspace }}-next-repairs-safe/repairs/native-diagnostics.json'
        if-no-files-found: error
        retention-days: 14
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANE: ui
      PRIVATE_PROOF: ${{ github.workspace }}/../next-repairs-private/ui
      SAFE_PROOF: ${{ github.workspace }}-next-repairs-safe/ui
