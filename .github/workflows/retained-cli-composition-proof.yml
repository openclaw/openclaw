    - name: Canonical test project router
      shell: bash
      run: 'set +e

        set -uo pipefail

        mapfile -t suites < <(node -e ''for(const p of JSON.parse(process.env.TESTS_JSON)) console.log(p)'')

        node scripts/test-projects.mts "${suites[@]}" -- --reporter=default --reporter=json --outputFile="$GITHUB_WORKSPACE/.artifacts/final-ci/tests.json"
        2>&1 | tee .artifacts/final-ci/tests.log

        status=$?

        printf "%s\n" "$status" > .artifacts/final-ci/exit-code.txt

        exit 0

        '
    - name: Require exact causal reporting outcome
      shell: bash
      run: 'set -euo pipefail

        python3 <<''PY''

        import json,pathlib,os

        p=pathlib.Path(''.artifacts/final-ci'');d=json.loads((p/''tests.json'').read_text());cases=[a for s in d[''testResults'']
        for a in s[''assertionResults'']]

        assert len(cases)==109,len(cases)

        needle=''diagnostic: preserves reload rejection beside the watcher assertion''

        probe=[x for x in cases if needle in x[''fullName'']];assert len(probe)==1

        assert all(x[''status'']==''passed'' for x in cases if x is not probe[0])

        assert d[''numPendingTests'']==0

        before=os.environ[''PROOF_LANE'']==''reporter-before'';rc=int((p/''exit-code.txt'').read_text())

        assert (rc!=0)==before,(before,rc)

        assert probe[0][''status'']==(''failed'' if before else ''passed'')

        assert d[''numFailedTests'']==(1 if before else 0)

        assert d[''numPassedTests'']==(108 if before else 109)

        print(json.dumps({''qualification'':False,''before'':before,''passed'':d[''numPassedTests''],''failed'':d[''numFailedTests''],''count'':len(cases)}))

        PY

        '
