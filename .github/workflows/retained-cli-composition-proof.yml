name: Release routing missing static proof
'on':
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        type: string
        description: Exact frozen candidate SHA; prerequisite diagnostic, not final FRV
permissions:
  contents: read
concurrency:
  group: release-routing-static-${{ inputs.target_ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  BASE_SHA: 89f5912fbe1d26ad81758d6f07e116b39a4e45f9
  REQUIRED_CHECKS_BASE: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  BEFORE_SHA: f38131f934b45447558cf6f431353a49656198d5
  PREREQUISITE_PARENT: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  CAPACITY_PROOF_SHA: 7af9ee549e45948707162d9d8cfa8c068a084fe6
  PREREQUISITE_PATCH_SHA256: 5d8f8bb9a93331eb4a01ca2aefcf2d655dd0e36821f44353663e62d2751f7dc5
  CANDIDATE_SHA: a233af0b84e093845c62e88c2702cbd9b297f22c
  SOURCE_TREE: fefba51180be86548a58cc0438ba340716110bd7
  PATHS_SHA256: 56a1d5118580b0ea7c50e12d42dac3d95dfabcee58ecf5561b6797c92ae0ef93
  TRUSTED_P: 68aff7f864148760c3800c95435cc36ddaa91654
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VARIANT: after
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 0
        persist-credentials: false
    - name: Bind exact candidate
      shell: bash
      run: 'set -euo pipefail

        test "${{ inputs.target_ref }}" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

        test -z "$(git status --porcelain)"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        mkdir -p .artifacts/final-ci

        git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort > .artifacts/final-ci/source-paths.txt

        echo "$PATHS_SHA256  .artifacts/final-ci/source-paths.txt" | sha256sum -c -

        printf ''C=%s

        Q=%s

        P=%s

        workflow=%s

        run=%s

        attempt=%s

        '' "$CANDIDATE_SHA" "$CANDIDATE_SHA" "$TRUSTED_P" "${{ github.workflow_sha }}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .artifacts/final-ci/identity.txt

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Apply exact routing overlay
      run: 'set -euo pipefail

        printf ''%s'' ''''
        | base64 --decode | git apply -

        echo ''22704317485167aa0fc81ed130d0cc206ff38b17deac8896099bc0f36f20c509  test/scripts/ci-workflow-planning.test.ts'' | sha256sum -c -

        if [ "$VARIANT" = after ]; then

        printf ''%s'' ''''
        | base64 --decode | git apply -

        echo ''c02578a64896d1e8152dcfed33987173086981aa8bf6ffce03bff55c46ffa825  .github/workflows/ci.yml'' | sha256sum -c -

        fi

        git diff --binary > .artifacts/final-ci/overlay.patch

        sha256sum .github/workflows/ci.yml test/scripts/ci-workflow-planning.test.ts > .artifacts/final-ci/overlay-sha256.txt'
    - name: Targeted static proof
      run: 'set -euo pipefail

        node scripts/check-changed.mjs -- .github/workflows/ci.yml test/scripts/ci-workflow-planning.test.ts 2>&1 | tee .artifacts/final-ci/static.log

        '
      shell: bash
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: routing-static-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
