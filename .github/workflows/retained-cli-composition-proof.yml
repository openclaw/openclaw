        printf ''%s\n'' ''aca6b908a82b40bcf5d8dcfcf9faa34cb872b4a049a30dcc0de24324b03620d9  ''"$PRIVATE_PROOF/transport_data.py" | sha256sum --check --strict

        '
    - name: Transport extract_observations.py 1
