name: Exact candidate two residual files
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  residual:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane:
        - delegation
        - ui
    env:
      CI: 'true'
      LANE: ${{ matrix.lane }}
      SAFE_PROOF: .artifacts/residual/${{ matrix.lane }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: c89139757f2c6728863a740309027562004163f8
        persist-credentials: false
        fetch-depth: 1
      timeout-minutes: 4
    - name: Bind exact source and bounded helpers
      shell: bash
      run: 'set -euo pipefail

        export PRIVATE_PROOF="$RUNNER_TEMP/residual-$LANE"

        mkdir -p "$PRIVATE_PROOF"

        printf %s  | base64 --decode > "$PRIVATE_PROOF/hosted.py"

        echo e15bd3f854ea630a475466c6db81b9a8f4ef2a87d00839082d36f367e045ab86  "$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        printf %s  | base64 --decode > "$PRIVATE_PROOF/verify_results.py"

        echo 02ad922cc31253a3ed5b4ed73723b61c0a020d941f016274094cf85ac2870292  "$PRIVATE_PROOF/verify_results.py" | sha256sum --check --strict

        printf %s  | base64 --decode > "$PRIVATE_PROOF/manifest.json"

        echo 36375acbadf9dfe787fb69e9c783762063ee69f98ecea9622f11969f644bb506  "$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/hosted.py" bind'
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
      timeout-minutes: 4
    - uses: ./.github/actions/setup-test-bun
      timeout-minutes: 4
    - name: Install Chromium for selected UI file
      if: matrix.lane == 'ui'
      timeout-minutes: 3
      shell: bash
      run: mkdir -p "$RUNNER_TEMP/residual-$LANE"; pnpm --dir ui exec playwright install --with-deps chromium > "$RUNNER_TEMP/residual-$LANE/browser-install.log" 2>&1
    - name: Run only residual file with 300 second whole-tree budget
      timeout-minutes: 6
      shell: bash
      run: export PRIVATE_PROOF="$RUNNER_TEMP/residual-$LANE"; python3 "$PRIVATE_PROOF/hosted.py" run
    - name: Finalize safe evidence
      if: always()
      shell: bash
      run: export PRIVATE_PROOF="$RUNNER_TEMP/residual-$LANE"; if [ -f "$PRIVATE_PROOF/hosted.py" ]; then python3 "$PRIVATE_PROOF/hosted.py" finalize; fi
    - name: Upload explicit safe residual evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: residual-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/residual/${{ matrix.lane }}/identity.json

          .artifacts/residual/${{ matrix.lane }}/report.json

          .artifacts/residual/${{ matrix.lane }}/tests.json

          .artifacts/residual/${{ matrix.lane }}/inner-status.json'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
