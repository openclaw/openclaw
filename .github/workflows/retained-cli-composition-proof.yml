name: Release auth publication causal proof
'on':
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        type: string
        description: Exact frozen candidate SHA; prerequisite diagnostic, not final FRV
permissions:
  contents: read
concurrency:
  group: release-auth-publication-${{ inputs.target_ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  BASE_SHA: 89f5912fbe1d26ad81758d6f07e116b39a4e45f9
  REQUIRED_CHECKS_BASE: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  BEFORE_SHA: f38131f934b45447558cf6f431353a49656198d5
  PREREQUISITE_PARENT: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  CAPACITY_PROOF_SHA: 7af9ee549e45948707162d9d8cfa8c068a084fe6
  PREREQUISITE_PATCH_SHA256: 5d8f8bb9a93331eb4a01ca2aefcf2d655dd0e36821f44353663e62d2751f7dc5
  CANDIDATE_SHA: a233af0b84e093845c62e88c2702cbd9b297f22c
  SOURCE_TREE: fefba51180be86548a58cc0438ba340716110bd7
  PATHS_SHA256: 56a1d5118580b0ea7c50e12d42dac3d95dfabcee58ecf5561b6797c92ae0ef93
  TRUSTED_P: 68aff7f864148760c3800c95435cc36ddaa91654
jobs:
  auth-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant:
        - before
        - after
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 0
        persist-credentials: false
    - name: Bind exact candidate
      shell: bash
      run: 'set -euo pipefail

        test "${{ inputs.target_ref }}" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

        test -z "$(git status --porcelain)"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        mkdir -p .artifacts/final-ci

        git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort > .artifacts/final-ci/source-paths.txt

        echo "$PATHS_SHA256  .artifacts/final-ci/source-paths.txt" | sha256sum -c -

        printf ''C=%s

        Q=%s

        P=%s

        workflow=%s

        run=%s

        attempt=%s

        '' "$CANDIDATE_SHA" "$CANDIDATE_SHA" "$TRUSTED_P" "${{ github.workflow_sha }}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .artifacts/final-ci/identity.txt

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Apply exact auth publication overlay
      run: 'set -euo pipefail

        printf ''%s'' ''''
        | base64 --decode | git apply -

        echo ''387653ef52064be4ad224f38ed4d9baaec704d03a37030ebe9f4e0a4a5294d0c  src/agents/prepared-model-runtime.reload-auth.test.ts'' | sha256sum -c -

        if [ "$VARIANT" = after ]; then

        printf ''%s'' ''''
        | base64 --decode | git apply -

        echo ''bb86276d4fd62a8733861c37d03c7b5f9290dd29cda26a0a0999be815c157701  src/agents/prepared-model-runtime.ts'' | sha256sum -c -

        fi

        git diff --binary > .artifacts/final-ci/overlay.patch

        sha256sum src/agents/prepared-model-runtime.reload-auth.test.ts src/agents/prepared-model-runtime.ts > .artifacts/final-ci/overlay-sha256.txt'
    - name: Exercise queued auth publication and retirement controls
      shell: bash
      run: "set -uo pipefail\nset +e\nif [ \"$VARIANT\" = before ]; then\n node scripts/test-projects.mts src/agents/prepared-model-runtime.reload-auth.test.ts -- --testNamePattern='owns queued auth publication after the emitting invocation closes' --reporter=default --reporter=json --outputFile=\"$GITHUB_WORKSPACE/.artifacts/final-ci/tests.json\" 2>&1 | tee .artifacts/final-ci/tests.log\n result=$?\nelse\n node scripts/test-projects.mts src/agents/prepared-model-runtime.reload-auth.test.ts src/agents/prepared-model-runtime.cancelled-admission.test.ts src/agents/prepared-model-runtime.auth-recovery.test.ts src/agents/prepared-model-runtime.plugin-drain.test.ts -- --reporter=default --reporter=json --outputFile=\"$GITHUB_WORKSPACE/.artifacts/final-ci/tests.json\" 2>&1 | tee .artifacts/final-ci/tests.log\n result=$?\nfi\nset -e\nprintf '%s' \"$result\" > .artifacts/final-ci/test-exit.txt\nnode --input-type=module <<'NODE'\nimport fs from 'node:fs'; import assert from 'node:assert/strict';\n\
        const r=JSON.parse(fs.readFileSync('.artifacts/final-ci/tests.json','utf8'));\nconst tests=r.testResults.flatMap(s=>s.assertionResults).filter(t=>t.status==='passed'||t.status==='failed');\nconst regression=tests.filter(t=>t.fullName.includes('owns queued auth publication after the emitting invocation closes'));\nassert.equal(regression.length,1);\nconst exit=fs.readFileSync('.artifacts/final-ci/test-exit.txt','utf8').trim();\nif(process.env.VARIANT==='before') { assert.equal(tests.length,1); assert.equal(regression[0].status,'failed'); assert.ok(JSON.stringify(regression[0].failureMessages).includes('Plugin invocation scope is closed')); assert.equal(r.numRuntimeErrorTestSuites ?? 0,0); assert.equal(r.unhandledErrors?.length ?? 0,0); assert.notEqual(exit,'0'); }\nelse { assert.equal(regression[0].status,'passed'); assert.ok(tests.length>1); assert.ok(tests.every(t=>t.status==='passed')); assert.equal(r.numFailedTests,0); assert.equal(exit,'0'); }\nNODE"
    - name: Targeted static proof
      if: matrix.variant == 'after'
      run: node scripts/check-changed.mjs -- src/agents/prepared-model-runtime.reload-auth.test.ts src/agents/prepared-model-runtime.ts
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: auth-publication-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
