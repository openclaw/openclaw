name: Recovery store exact 11a before-after diagnosis
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed diagnostic workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: recovery-store-11a-before-after
  cancel-in-progress: false
env:
  CI: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  TARGET_SHA: 11a0a9680d22977f0570409dbe8016c85a1ec3fd
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANE: ${{ matrix.phase }}-${{ matrix.runtime }}
      SAFE_PROOF: .artifacts/recovery-store
      PRIVATE_PROOF: ${{ github.workspace }}/../recovery-store-private
      OPENCLAW_RECOVERY_BINDING_DIAGNOSTIC: ${{ github.workspace }}/../recovery-store-private/binding-raw.json
      OPENCLAW_VITEST_RUNTIME: ${{ matrix.runtime }}
      OPENCLAW_NODE_TEST_PLAN_CONTINUE_ON_FAILURE: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 11a0a9680d22977f0570409dbe8016c85a1ec3fd
        persist-credentials: false
        fetch-depth: 1
    - name: Initialize exact recovery transport
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$PRIVATE_PROOF"

        : > "$PRIVATE_PROOF/hosted.py.b64"

        : > "$PRIVATE_PROOF/verify_results.py.b64"

        : > "$PRIVATE_PROOF/binding_data.py.b64"

        : > "$PRIVATE_PROOF/manifest.json.b64"

        : > "$PRIVATE_PROOF/diagnostic.patch.b64"

        : > "$PRIVATE_PROOF/repair.patch.b64"

        '
    - name: Transport hosted.py chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/hosted.py.b64"

        '
    - name: Transport verify_results.py chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/verify_results.py.b64"

        '
    - name: Transport binding_data.py chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/binding_data.py.b64"

        '
    - name: Transport manifest.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport diagnostic.patch chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/diagnostic.patch.b64"

        '
    - name: Transport repair.patch chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/repair.patch.b64"

        '
    - name: Verify decoded capsule and bind exact candidate
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/hosted.py.b64" | gzip -d > "$PRIVATE_PROOF/hosted.py"

        echo a94aa5d45624e975b7174a39915c2055556085ef329313502e9b9aa755536145  "$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/verify_results.py.b64" | gzip -d > "$PRIVATE_PROOF/verify_results.py"

        echo eff138ba24bd5c1379341f17adab85e6d95da3892c20eadabedbd1e4999c6553  "$PRIVATE_PROOF/verify_results.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/binding_data.py.b64" | gzip -d > "$PRIVATE_PROOF/binding_data.py"

        echo fb3f678a1f352f00a2216b14e7157d272f6f92323c4d4fbe9bcf5bad9ec2de06  "$PRIVATE_PROOF/binding_data.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/manifest.json.b64" | gzip -d > "$PRIVATE_PROOF/manifest.json"

        echo b4527b2d1b68d686a09ea92cf750d3274e4485c4207fc6f63582400f63c8f078  "$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/diagnostic.patch.b64" | gzip -d > "$PRIVATE_PROOF/diagnostic.patch"

        echo ae9ea6c01e7501fd3dca836013f72d3f3e03f7591b7cfa9d47c562f2a1f637bd  "$PRIVATE_PROOF/diagnostic.patch" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/repair.patch.b64" | gzip -d > "$PRIVATE_PROOF/repair.patch"

        echo acc22aee427b1ab549cfee1e9c973eb90212a354f4c29adbad8529663e6b0112  "$PRIVATE_PROOF/repair.patch" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Run exact final candidate lane
      shell: bash
      run: 'python3 "$PRIVATE_PROOF/hosted.py" run

        '
    - name: Capture safe diagnostics even after failure
      if: always()
      shell: bash
      run: 'if [ -f "$PRIVATE_PROOF/hosted.py" ]; then python3 "$PRIVATE_PROOF/hosted.py" finalize; fi

        '
    - name: Upload explicit safe evidence only
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: recovery-store-${{ matrix.phase }}-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/recovery-store/identity.json

          .artifacts/recovery-store/report.json

          .artifacts/recovery-store/tests.json

          .artifacts/recovery-store/inner-status.json

          .artifacts/recovery-store/binding.json'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    strategy:
      fail-fast: false
      matrix:
        phase:
        - before
        - after
        runtime:
        - node
        - bun
