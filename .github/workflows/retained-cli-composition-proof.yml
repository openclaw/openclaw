name: Release 11.4 corrected plugin repair proof
on:
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-114-corrected-plugin-43372397865-proof
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EXPECTED_TARGET: db48e205e03f5a0458af2cb78bcf5434fc9a70a0
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [plugins, static, types-plugins-platform]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind original source and exact repair overlays
        shell: bash
        env:
          INPUT_TARGET: ${{ inputs.target_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$INPUT_TARGET" = "$EXPECTED_TARGET"
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
          test -z "$(git status --porcelain)"
          mkdir -p .artifacts/drained-repair-proof
          proof=.artifacts/drained-repair-proof
          printf 'source=%s\nworkflow=%s\nrun=%s\nattempt=%s\n' "$EXPECTED_TARGET" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$proof/identity.txt"
          base64 --decode > "$proof/repair.patch" <<'BOUND_repair_patch'
          
          BOUND_repair_patch
          base64 --decode > "$proof/diagnostic.patch" <<'BOUND_diagnostic_patch'
          
          BOUND_diagnostic_patch
          base64 --decode > "$proof/originals.sha256" <<'BOUND_originals_sha256'
          
          BOUND_originals_sha256
          base64 --decode > "$proof/repaired.sha256" <<'BOUND_repaired_sha256'
          
          BOUND_repaired_sha256
          base64 --decode > "$proof/overlays.sha256" <<'BOUND_overlays_sha256'
          
          BOUND_overlays_sha256
          base64 --decode > "$proof/prerequisites.sha256" <<'BOUND_prerequisites_sha256'
          
          BOUND_prerequisites_sha256
          base64 --decode > "$proof/repair-paths.txt" <<'BOUND_repair_paths_txt'
          
          BOUND_repair_paths_txt
          base64 --decode > "$proof/all-paths.txt" <<'BOUND_all_paths_txt'
          
          BOUND_all_paths_txt
          base64 --decode > "$proof/selection-paths.txt" <<'BOUND_selection_paths_txt'
          
          BOUND_selection_paths_txt
          sha256sum --check --strict "$proof/originals.sha256"
          sha256sum --check --strict "$proof/prerequisites.sha256"
          while IFS= read -r path; do test -f "$path"; done < "$proof/selection-paths.txt"
          while IFS= read -r path; do
            mkdir -p "$proof/originals/$(dirname "$path")"
            cp "$path" "$proof/originals/$path"
          done < "$proof/all-paths.txt"
          printf '%s  %s\n' '15d233d2a77fd36cd90c01b421d3f3cd013e3ac0eeb15119704d57dfc93a062d' "$proof/repair.patch" '28513b7477a4142c79b69f391847da6b65edfe924e293f8caec8be7474ed06a0' "$proof/diagnostic.patch" | sha256sum --check --strict
          git apply --check "$proof/repair.patch"
          git apply "$proof/repair.patch"
          sha256sum --check --strict "$proof/repaired.sha256"
          git diff --name-only | LC_ALL=C sort > "$proof/actual-repair-paths.txt"
          diff -u "$proof/repair-paths.txt" "$proof/actual-repair-paths.txt"
          # Diagnostic-only overlay is never written back to the source candidate.
          git apply --check "$proof/diagnostic.patch"
          git apply "$proof/diagnostic.patch"
          sha256sum --check --strict "$proof/overlays.sha256"
          git diff --name-only | LC_ALL=C sort > "$proof/actual-all-paths.txt"
          diff -u "$proof/all-paths.txt" "$proof/actual-all-paths.txt"
          git diff --check
          git diff --binary --full-index > "$proof/combined.patch"
          while IFS= read -r path; do
            mkdir -p "$proof/overlays/$(dirname "$path")"
            cp "$path" "$proof/overlays/$path"
          done < "$proof/all-paths.txt"
          # These are the canonical E2E build owners; no skip/reused-dist flags are supplied.
          test -z "${OPENCLAW_E2E_SKIP_BUILD:-}"
          test -z "${OPENCLAW_E2E_USE_PREBUILT_DIST:-}"
      - uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          install-bun: "false"
          cache-mode: restore
      - uses: ./.github/actions/setup-test-bun
      - uses: ./.github/actions/setup-ripgrep
      - name: Plugin invocation and transcript cleanup
        if: matrix.lane == 'plugins'
        shell: bash
        run: |
          set -euo pipefail
          OPENCLAW_NODE_TEST_PLAN_CONTINUE_ON_FAILURE=1 pnpm test src/plugins/plugin-invocation-scope.test.ts src/plugins/plugin-instance.consumer.test.ts src/plugins/registry-inspection-resources.invocation.test.ts src/plugins/capability-provider-acquisition.test.ts src/transcripts/capture-stop.test.ts --maxWorkers=1 2>&1 | tee .artifacts/drained-repair-proof/plugins.log
      - name: Format corrected assertion file
        if: matrix.lane == 'static'
        shell: bash
        run: |
          set -euo pipefail
          proof=.artifacts/drained-repair-proof
          set +e
          pnpm format:check src/plugins/plugin-invocation-scope.test.ts 2>&1 | tee .artifacts/drained-repair-proof/format.log
          check_statuses=("${PIPESTATUS[@]}")
          set -e
          check_status="${check_statuses[0]}"
          printf 'format_check_exit=%s\nformat_check_log_exit=%s\n' "$check_status" "${check_statuses[1]}" > "$proof/format-status.txt"
          if (( check_status != 0 )); then
            # Recovery evidence only: never replace the failed qualifying check.
            set +e
            pnpm format src/plugins/plugin-invocation-scope.test.ts 2>&1 | tee "$proof/format-recovery.log"
            recovery_statuses=("${PIPESTATUS[@]}")
            set -e
            printf 'format_recovery_exit=%s\nformat_recovery_log_exit=%s\n' "${recovery_statuses[0]}" "${recovery_statuses[1]}" >> "$proof/format-status.txt"
            git diff --binary --full-index > "$proof/formatted-working-tree.patch"
            while IFS= read -r path; do
              mkdir -p "$proof/formatted/$(dirname "$path")"
              cp "$path" "$proof/formatted/$path"
            done < "$proof/repair-paths.txt"
            (cd "$proof/formatted" && while IFS= read -r path; do sha256sum "$path"; done < ../repair-paths.txt) > "$proof/formatted.sha256"
            # Subsequent lint remains bound to the original repair, not formatter output.
            while IFS= read -r path; do
              cp "$proof/overlays/$path" "$path"
            done < "$proof/repair-paths.txt"
            sha256sum --check --strict "$proof/overlays.sha256"
          fi
          exit "$check_status"
      - name: Lint plugins-platform
        if: always() && matrix.lane == 'static'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.core.test.plugins-platform.json src/plugins/plugin-invocation-scope.test.ts 2>&1 | tee .artifacts/drained-repair-proof/lint-plugins-platform.log
      - name: Typegraph plugins-platform
        if: matrix.lane == 'types-plugins-platform'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.plugins-platform.json --incremental --tsBuildInfoFile .artifacts/drained-repair-proof/plugins-platform.tsbuildinfo 2>&1 | tee .artifacts/drained-repair-proof/types-plugins-platform.log
      - name: Preserve repair evidence and failure artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-114-corrected-plugin-43372397865-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/
            test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
