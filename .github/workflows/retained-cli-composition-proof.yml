name: Minimal transport-plugin diagnostic01-02 exact11a
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: minimal-transport-plugin-diagnostic-exact11a
  cancel-in-progress: false
env:
  CI: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
  NODE_OPTIONS: --max-old-space-size=8192
  OPENCLAW_VITEST_MAX_WORKERS: '2'
  OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: '300000'
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        lane:
        - transport
        - plugin
    env:
      LANE: ${{ matrix.lane }}
      SAFE_PROOF: .artifacts/transport-plugin
      PRIVATE_PROOF: ${{ github.workspace }}/../transport-plugin-private
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 11a0a9680d22977f0570409dbe8016c85a1ec3fd
        persist-credentials: false
        fetch-depth: 1
    - name: Initialize private diagnostic capsule
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$PRIVATE_PROOF"'
    - name: Decode hosted.py
      shell: bash
      run: 'set -euo pipefail

        printf %s 
        | base64 --decode | gzip -d > "$PRIVATE_PROOF/hosted.py"

        echo "c80737cac799ff5fdc786550bb693e666227ab1b4dd1c16b451760d9f46ed873  $PRIVATE_PROOF/hosted.py" | sha256sum --check
        --strict'
    - name: Decode verify_results.py
      shell: bash
      run: 'set -euo pipefail

        printf %s 
        | base64 --decode | gzip -d > "$PRIVATE_PROOF/verify_results.py"

        echo "ff892e3e4329a9676f488f2c1a2882147d40fcb2d60e5cb279bc6ec9052b3b0d  $PRIVATE_PROOF/verify_results.py" | sha256sum
        --check --strict'
    - name: Decode manifest.json
      shell: bash
      run: 'set -euo pipefail

        printf %s 
        | base64 --decode | gzip -d > "$PRIVATE_PROOF/manifest.json"

        echo "aaec2f7f40dfe73e52106046e15ad310bdc893c8a04a662929911f33ccfa335b  $PRIVATE_PROOF/manifest.json" | sha256sum
        --check --strict'
    - name: Decode proposed.patch
      shell: bash
      run: 'set -euo pipefail

        printf %s 
        | base64 --decode | gzip -d > "$PRIVATE_PROOF/proposed.patch"

        echo "8b3aff927be24ec8751f275c05b9453d73603869e8d89fe1a733ce966f477d89  $PRIVATE_PROOF/proposed.patch" | sha256sum
        --check --strict'
    - name: Decode transport-groups.json
      shell: bash
      run: 'set -euo pipefail

        printf %s 
        | base64 --decode | gzip -d > "$PRIVATE_PROOF/transport-groups.json"

        echo "f87b3127464d6440f2f6c557e938dd66a2f7e2e1ddb9e967853bdecf84499727  $PRIVATE_PROOF/transport-groups.json" | sha256sum
        --check --strict'
    - name: Decode plugin-groups.json
      shell: bash
      run: 'set -euo pipefail

        printf %s H4sIAAAAAAAC/12OywrCMBBF9/2KkLVJcetXuBeRIR3TwXQqmbFaxH83fQjqYrhw4Zw7h8qYZzljbOj5TFHszhzmolSKovVAX+EjKN5hdIJ5wOwXyKvYmTluFhdxSLcG96CKmX+ckkO9SupF4q7pFonFJzpjGENCH1pgxiR+3vy3Swu5OTF0WMQWIrJScOUVzX0qNmB0rep1Fbu72JVU6ojj6YLjRDYEkXuZ4FJTB+lD4AOCbrcw7b6qY/UGO3KiSScBAAA=
        | base64 --decode | gzip -d > "$PRIVATE_PROOF/plugin-groups.json"

        echo "df1e2b7d0f94753dd88c0a516e902bb52c2c3e3e1fcd297aea181d2e12e51455  $PRIVATE_PROOF/plugin-groups.json" | sha256sum
        --check --strict'
    - name: Bind exact source and workflow
      shell: bash
      run: python3 "$PRIVATE_PROOF/hosted.py" bind
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Run bounded Node subset through canonical router
      shell: bash
      run: python3 "$PRIVATE_PROOF/hosted.py" run
    - name: Capture bounded outcomes even on failure
      if: always()
      shell: bash
      run: if [ -f "$PRIVATE_PROOF/hosted.py" ]; then python3 "$PRIVATE_PROOF/hosted.py" finalize; fi
    - name: Upload explicit safe evidence only
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: transport-plugin-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/transport-plugin/identity.json

          .artifacts/transport-plugin/report.json

          .artifacts/transport-plugin/outcomes.json

          .artifacts/transport-plugin/tests.json

          .artifacts/transport-plugin/inner-status.json'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
