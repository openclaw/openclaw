        \ \"$RELOAD_BEFORE_SHA\")\" = src/gateway/server-plugin-reload.ts\ntest \"$(git diff --no-ext-diff --no-textconv --binary\
        \ --full-index \"$RELOAD_TEST_SOURCE\" \"$RELOAD_BEFORE_SHA\" -- src/gateway/server-plugin-reload.ts | sha256sum |\
        \ cut -d' ' -f1)\" = \"$RELOAD_PATCH_SHA256\"\nif [ \"$RELOAD_ROLE\" = after ]; then\n test \"$(git rev-parse HEAD^{tree})\"\
        \ = \"$SOURCE_TREE\"\nfi\nmkdir -p .artifacts/final-ci\nprintf '%s\\n' \"$RELOAD_TEST_HASHES\" | sha256sum -c -\n\
        printf 'role=%s\\nproduct=%s\\ncandidate=%s\\nbefore=%s\\nworkflow=%s\\nrun=%s\\nattempt=%s\\n' \"$RELOAD_ROLE\" \"\
        $RELOAD_PRODUCT_SHA\" \"$CANDIDATE_SHA\" \"$RELOAD_BEFORE_SHA\" \"${{ github.workflow_sha }}\" \"$GITHUB_RUN_ID\"\
        \ \"$GITHUB_RUN_ATTEMPT\" > .artifacts/final-ci/reload-identity.txt\n"
    - *id003
    - *id004
    - uses: ./.github/actions/setup-ripgrep
    - name: Run the two named reload cases through the canonical owner
      shell: bash
      run: 'set -euo pipefail

        set +e

        node scripts/test-projects.mts src/gateway/server-plugin-reload.prepared-borrow.test.ts -- -t "automatic (busy|superseded)"
        --reporter=default --reporter=json --outputFile="$GITHUB_WORKSPACE/.artifacts/final-ci/reload-tests.json" 2>&1 | tee
        .artifacts/final-ci/reload-tests.log

        statuses=("${PIPESTATUS[@]}")

        set -e

        printf ''%s\n'' "${statuses[0]}" > .artifacts/final-ci/reload-exit.txt

        test "${statuses[1]}" -eq 0

        '
    - name: Require exact AFTER passes or BEFORE barrier-identity assertions
      shell: bash
      run: "node --input-type=module <<'NODE'\n// Diagnostic-only result classification; product execution remains in test-projects.mts.\n\
        import assert from \"node:assert/strict\";\nimport fs from \"node:fs\";\nconst root = \".artifacts/final-ci\";\nconst\
        \ role = process.env.RELOAD_ROLE;\nassert([\"before\", \"after\"].includes(role), \"Unknown comparison role\");\n\
        const report = JSON.parse(fs.readFileSync(root + \"/reload-tests.json\", \"utf8\"));\nconst exit = Number(fs.readFileSync(root\
        \ + \"/reload-exit.txt\", \"utf8\").trim());\nconst log = fs.readFileSync(root + \"/reload-tests.log\", \"utf8\").replace(/\\\
        u001b\\[[0-9;]*m/g, \"\");\nconst names = JSON.parse(process.env.RELOAD_EXPECTED_CASES);\nassert.equal(names.length,\
        \ 2);\nassert.equal(new Set(names).size, 2);\nconst label = \"Automatic reload refusal must preserve the in-flight\
        \ publication barrier\";\nassert.equal(exit, role === \"before\" ? 1 : 0, \"Wrong process exit (signal, timeout or\
        \ infrastructure failure is not proof)\");\nassert(Array.isArray(report.testResults));\nassert.equal(report.testResults.length,\
        \ 1, \"Expected exactly the focused source suite\");\nconst suite = report.testResults[0];\nassert(suite.name.replaceAll(String.fromCharCode(92),\
        \ \"/\").endsWith(\"/src/gateway/server-plugin-reload.prepared-borrow.test.ts\"));\nassert(!suite.testExecError, \"\
        Suite setup/import failure is not proof\");\nassert.equal(report.numRuntimeErrorTestSuites ?? 0, 0, \"Runtime suite\
        \ errors are not proof\");\nassert.equal(report.numPassedTests, role === \"after\" ? 2 : 0);\nassert.equal(report.numFailedTests,\
        \ role === \"before\" ? 2 : 0);\nassert.equal(report.success, role === \"after\");\nif (role === \"after\") assert.equal(report.numFailedTestSuites,\
        \ 0);\nelse assert(report.numFailedTestSuites > 0);\nassert(Array.isArray(suite.assertionResults));\nconst forbidden\
        \ = /test timed out|hook timed out|timeout of|timed out after|unhandled (?:error|rejection)|uncaught exception|failed\
        \ to (?:load|resolve)|cannot find (?:module|package)|ERR_MODULE_NOT_FOUND|SyntaxError:|ReferenceError:|TypeError:|RangeError:/i;\n\
        assert(!forbidden.test(log), \"Timeout, setup/import or unhandled failure is not causal proof\");\nfor (const name\
        \ of names) {\n  const matches = suite.assertionResults.filter(x => x.fullName?.trim() === name);\n  assert.equal(matches.length,\
        \ 1, \"Missing/duplicate exact case: \" + name);\n  const test = matches[0];\n  assert.equal(test.status, role ===\
        \ \"before\" ? \"failed\" : \"passed\", name);\n  const messages = test.failureMessages ?? [];\n  if (role === \"\
        after\") assert.equal(messages.length, 0, name);\n  else {\n    assert.equal(messages.length, 1, \"Multiple failures\
        \ including cleanup are not causal proof: \" + name);\n    const message = messages[0].replace(/\\u001b\\[[0-9;]*m/g,\
        \ \"\");\n    assert(message.includes(label), \"Wrong assertion: \" + name);\n    assert(/AssertionError/.test(message),\
        \ \"Expected ordinary assertion failure: \" + name);\n    assert(/Object\\.is equality|expected[\\s\\S]*to be/.test(message),\
        \ \"Expected identity assertion: \" + name);\n    assert(!forbidden.test(message), \"Non-assertion failure: \" + name);\n\
        \  }\n}\nfor (const test of suite.assertionResults) {\n  if (names.includes(test.fullName?.trim())) continue;\n  assert([\"\
        pending\", \"skipped\", \"todo\", \"disabled\"].includes(test.status), \"Unexpected executed case: \" + test.fullName);\n\
        \  assert.equal((test.failureMessages ?? []).length, 0);\n}\nfs.writeFileSync(root + \"/reload-classification.json\"\
        , JSON.stringify({\n  role, product: process.env.RELOAD_PRODUCT_SHA, candidate: process.env.CANDIDATE_SHA,\n  before:\
        \ process.env.RELOAD_BEFORE_SHA, exit, cases: names,\n  outcome: role === \"before\" ? \"expected-barrier-identity-assertions\"\
        \ : \"both-focused-cases-passed\",\n  workflow: process.env.GITHUB_WORKFLOW_SHA, run: process.env.GITHUB_RUN_ID, attempt:\
        \ process.env.GITHUB_RUN_ATTEMPT,\n}, null, 2) + \"\\n\");\n\nNODE"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: reload-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
