name: Frozen 2026.11.4 native failure diagnostics
'on':
  workflow_dispatch:
    inputs:
      target_ref:
        type: string
        required: true
        default: 7957bf3258707ba5d5860393990a67aa53ef2f91
        description: Exact frozen candidate; diagnostic only
      reviewed_workflow_sha:
        type: string
        required: true
        description: Exact parent-reviewed canonical workflow commit, must equal workflow_sha
permissions:
  contents: read
concurrency:
  group: native-diagnostics-7957bf325870
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  EXPECTED_TARGET: 7957bf3258707ba5d5860393990a67aa53ef2f91
  EXPECTED_TREE: 33c1d06b7b1bc65e9a538a6acf21cd2510f42208
jobs:
  static:
    if: ${{ github.repository == 'openclaw/openclaw' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - &id001
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: ${{ inputs.target_ref }}
        fetch-depth: 1
        persist-credentials: false
    - name: Bind exact candidate, reviewed workflow, and diagnostic overlay
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target_ref }}
        REVIEWED_WORKFLOW_SHA: ${{ inputs.reviewed_workflow_sha }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
      run: |
        set -euo pipefail
        test "$INPUT_TARGET" = "$EXPECTED_TARGET"
        test "$REVIEWED_WORKFLOW_SHA" = "$WORKFLOW_SHA"
        [[ "$REVIEWED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
        test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
        test -z "$(git status --porcelain)"
        proof=.artifacts/native-diagnostics
        mkdir -p "$proof"
        base64 --decode > "$proof/bound-bundle.json.gz" <<'BOUND_DATA'
        
        BOUND_DATA
        printf '%s  %s\n' b0fe22b9e1a87ae0e6db46c1bc848d985ff70ac9c70036a9d654979834b64cad "$proof/bound-bundle.json.gz" | sha256sum --check --strict
        python3 - <<'PY'
        import gzip,hashlib,json,pathlib
        proof=pathlib.Path('.artifacts/native-diagnostics')
        bundle=json.loads(gzip.decompress((proof/'bound-bundle.json.gz').read_bytes()))
        payload=bundle['payload']
        manifest=bundle['manifest']
        assert payload['source']=='7957bf3258707ba5d5860393990a67aa53ef2f91'
        assert [f['path'] for f in payload['files']]==[
         'src/gateway/server-methods/sessions-create.visible-spawn.live.test.ts',
         'src/infra/heartbeat-runner.live.test.ts',
         'test/helpers/live-gateway-failure.ts',
         'test/helpers/live-gateway-failure.test.ts',
        ]
        payload_bytes=(json.dumps(payload,sort_keys=True,separators=(',',':'))+'\n').encode()
        assert hashlib.sha256(payload_bytes).hexdigest()==manifest['overlaySha256']
        assert hashlib.sha256(bundle['collector'].encode()).hexdigest()==manifest['collectorSha256']
        for f in payload['files']:
         p=pathlib.Path(f['path'])
         if f['before'] is None:
          assert not p.exists(),f['path']
         else:
          assert hashlib.sha256(p.read_bytes()).hexdigest()==f['before'],f['path']
         assert hashlib.sha256(f['content'].encode()).hexdigest()==f['after']
        for f in payload['files']:
         pathlib.Path(f['path']).write_text(f['content'])
        (proof/'bound-overlay.json').write_bytes(payload_bytes)
        (proof/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
        (proof/'collect.py').write_text(bundle['collector'])
        PY
        git diff --check
        printf 'source=%s\nsource_tree=%s\nworkflow=%s\nrun=%s\nattempt=%s\n' "$EXPECTED_TARGET" "$EXPECTED_TREE" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$proof/identity.txt"
    - uses: ./.github/actions/setup-node-env
      with:
        node-version: 24.22.1
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Validate formatting lint and types without provider credentials
      shell: bash
      run: |
        set -euo pipefail
        node scripts/check-changed.mjs --dry-run -- src/gateway/server-methods/sessions-create.visible-spawn.live.test.ts src/infra/heartbeat-runner.live.test.ts test/helpers/live-gateway-failure.ts test/helpers/live-gateway-failure.test.ts > .artifacts/native-diagnostics/static-plan.log 2>&1
        node scripts/check-changed.mjs -- src/gateway/server-methods/sessions-create.visible-spawn.live.test.ts src/infra/heartbeat-runner.live.test.ts test/helpers/live-gateway-failure.ts test/helpers/live-gateway-failure.test.ts > .artifacts/native-diagnostics/static-checks.log 2>&1
    - name: Prove redaction and bounds using only synthetic data
      shell: bash
      run: |
        set -euo pipefail
        node scripts/run-vitest.mjs test/helpers/live-gateway-failure.test.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile=.artifacts/native-diagnostics/redaction-results.json > .artifacts/native-diagnostics/redaction-tests.log 2>&1
    - name: Require all four synthetic redaction cases to execute
      shell: bash
      run: |
        python3 - <<'PY'
        import json,pathlib
        p=pathlib.Path('.artifacts/native-diagnostics/redaction-results.json')
        r=json.loads(p.read_text())
        cases=[a for suite in r.get('testResults',[]) for a in suite.get('assertionResults',[])]
        assert len(cases)==4, 'missing synthetic redaction cases'
        assert all(a.get('status')=='passed' for a in cases), 'redaction cases failed or skipped'
        assert r.get('numFailedTests')==0
        PY
    - name: Retain secretless static proof
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: native-diagnostics-static-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/native-diagnostics/
        if-no-files-found: error
        retention-days: 14
  native:
    needs:
    - static
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - lane: visible-spawn
          file: src/gateway/server-methods/sessions-create.visible-spawn.live.test.ts
          wake: '0'
          codex: '1'
        - lane: heartbeat
          file: src/infra/heartbeat-runner.live.test.ts
          wake: '1'
          codex: '0'
    steps:
    - *id001
    - name: Bind exact candidate, reviewed workflow, and diagnostic overlay
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target_ref }}
        REVIEWED_WORKFLOW_SHA: ${{ inputs.reviewed_workflow_sha }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
      run: |
        set -euo pipefail
        test "$INPUT_TARGET" = "$EXPECTED_TARGET"
        test "$REVIEWED_WORKFLOW_SHA" = "$WORKFLOW_SHA"
        [[ "$REVIEWED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
        test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
        test -z "$(git status --porcelain)"
        proof=.artifacts/native-diagnostics
        mkdir -p "$proof"
        base64 --decode > "$proof/bound-bundle.json.gz" <<'BOUND_DATA'
        
        BOUND_DATA
        printf '%s  %s\n' b0fe22b9e1a87ae0e6db46c1bc848d985ff70ac9c70036a9d654979834b64cad "$proof/bound-bundle.json.gz" | sha256sum --check --strict
        python3 - <<'PY'
        import gzip,hashlib,json,pathlib
        proof=pathlib.Path('.artifacts/native-diagnostics')
        bundle=json.loads(gzip.decompress((proof/'bound-bundle.json.gz').read_bytes()))
        payload=bundle['payload']
        manifest=bundle['manifest']
        assert payload['source']=='7957bf3258707ba5d5860393990a67aa53ef2f91'
        assert [f['path'] for f in payload['files']]==[
         'src/gateway/server-methods/sessions-create.visible-spawn.live.test.ts',
         'src/infra/heartbeat-runner.live.test.ts',
         'test/helpers/live-gateway-failure.ts',
         'test/helpers/live-gateway-failure.test.ts',
        ]
        payload_bytes=(json.dumps(payload,sort_keys=True,separators=(',',':'))+'\n').encode()
        assert hashlib.sha256(payload_bytes).hexdigest()==manifest['overlaySha256']
        assert hashlib.sha256(bundle['collector'].encode()).hexdigest()==manifest['collectorSha256']
        for f in payload['files']:
         p=pathlib.Path(f['path'])
         if f['before'] is None:
          assert not p.exists(),f['path']
         else:
          assert hashlib.sha256(p.read_bytes()).hexdigest()==f['before'],f['path']
         assert hashlib.sha256(f['content'].encode()).hexdigest()==f['after']
        for f in payload['files']:
         pathlib.Path(f['path']).write_text(f['content'])
        (proof/'bound-overlay.json').write_bytes(payload_bytes)
        (proof/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
        (proof/'collect.py').write_text(bundle['collector'])
        PY
        git diff --check
        printf 'source=%s\nsource_tree=%s\nworkflow=%s\nrun=%s\nattempt=%s\n' "$EXPECTED_TARGET" "$EXPECTED_TREE" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$proof/identity.txt"
    - uses: ./.github/actions/setup-node-env
      with:
        node-version: 24.22.1
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Build normal native runtime before credential admission
      shell: bash
      run: |
        set -euo pipefail
        OPENCLAW_BUILD_PRIVATE_QA=1 pnpm build > .artifacts/native-diagnostics/build.log 2>&1
    - name: Run only the original live file with private raw output
      shell: bash
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        LANE: ${{ matrix.lane }}
        TEST_FILE: ${{ matrix.file }}
        OPENCLAW_LIVE_SESSION_EVENT_WAKE: ${{ matrix.wake }}
        OPENCLAW_LIVE_CODEX_HARNESS: ${{ matrix.codex }}
        OPENCLAW_LIVE_CODEX_HARNESS_AUTH: api-key
        OPENCLAW_VITEST_RUNTIME: node
      run: |
        set -euo pipefail
        test -n "$OPENAI_API_KEY"
        private="$RUNNER_TEMP/native-diagnostics-private"
        mkdir -p "$private"
        chmod 700 "$private"
        # Canonical hydration; only OpenAI is supplied to these native tests.
        bash scripts/ci-hydrate-live-auth.sh "$private/live.profile"
        set +e
        pnpm test:live -- "$TEST_FILE" --reporter=verbose --reporter=json --outputFile="$private/results.json" > "$private/console.log" 2>&1
        code=$?
        set -e
        printf '%s\n' "$code" > "$private/exit-code.txt"
        exit "$code"
    - name: Collect only bounded sanitized diagnostics and original case statuses
      if: always()
      shell: bash
      env:
        LANE: ${{ matrix.lane }}
      run: |
        python3 .artifacts/native-diagnostics/collect.py
    - name: Upload explicit safe files, never raw or private logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: native-diagnostics-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .artifacts/native-diagnostics/identity.txt
          .artifacts/native-diagnostics/manifest.json
          .artifacts/native-diagnostics/outcome.json
          .artifacts/native-diagnostics/diagnostics.json
        if-no-files-found: error
        retention-days: 7
