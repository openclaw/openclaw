name: Provisional exact-final 11a original 27-file capacity regression
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed diagnostic workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: final-27-11a-capacity
  cancel-in-progress: false
env:
  CI: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  TARGET_SHA: 11a0a9680d22977f0570409dbe8016c85a1ec3fd
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANE: capacity
      SAFE_PROOF: .artifacts/final-recovery/capacity
      PRIVATE_PROOF: ${{ github.workspace }}/../final-recovery-private/capacity
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 11a0a9680d22977f0570409dbe8016c85a1ec3fd
        persist-credentials: false
        fetch-depth: 1
    - name: Initialize exact capacity capsule transport
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$PRIVATE_PROOF"

        : > "$PRIVATE_PROOF/hosted.py.b64"

        : > "$PRIVATE_PROOF/verify_results.py.b64"

        : > "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport hosted.py chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/hosted.py.b64"

        '
    - name: Transport verify_results.py chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/verify_results.py.b64"

        '
    - name: Transport manifest.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Verify decoded capsule and bind exact candidate
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/hosted.py.b64" | gzip -d > "$PRIVATE_PROOF/hosted.py"

        echo 210798cfed51c319931b8a4f7a000516e9d71e85b224da1804d4c8918e5f5185  "$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/verify_results.py.b64" | gzip -d > "$PRIVATE_PROOF/verify_results.py"

        echo f20dc1f8b6ebe75de2d9470d9d5a58e3b981ce1a93bf2263ce016351200e4785  "$PRIVATE_PROOF/verify_results.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/manifest.json.b64" | gzip -d > "$PRIVATE_PROOF/manifest.json"

        echo 63775e63b884aca92b132edab896b949fd6d977ddf473dbb933146215c0950aa  "$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Install candidate Chromium prerequisite
      shell: bash
      run: 'set -euo pipefail

        pnpm --dir ui exec playwright install --with-deps chromium > "$PRIVATE_PROOF/browser-install.log" 2>&1

        '
    - name: Run exact final candidate lane
      shell: bash
      run: 'python3 "$PRIVATE_PROOF/hosted.py" run

        '
    - name: Capture safe diagnostics even after failure
      if: always()
      shell: bash
      run: 'if [ -f "$PRIVATE_PROOF/hosted.py" ]; then python3 "$PRIVATE_PROOF/hosted.py" finalize; fi

        '
    - name: Upload explicit safe evidence only
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: final-27-11a-capacity-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/final-recovery/capacity/identity.json

          .artifacts/final-recovery/capacity/report.json

          .artifacts/final-recovery/capacity/tests.json

          .artifacts/final-recovery/capacity/inner-status.json'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
