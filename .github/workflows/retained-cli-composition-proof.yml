name: Release remaining static and format recovery
'on':
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        type: string
        description: Exact frozen candidate SHA; prerequisite diagnostic, not final FRV
permissions:
  contents: read
concurrency:
  group: release-qa-static-recovery-${{ inputs.target_ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  BASE_SHA: 89f5912fbe1d26ad81758d6f07e116b39a4e45f9
  REQUIRED_CHECKS_BASE: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  BEFORE_SHA: f38131f934b45447558cf6f431353a49656198d5
  PREREQUISITE_PARENT: 258908e6b943c0197bca8d0306dbbbbf503bcb22
  CAPACITY_PROOF_SHA: 7af9ee549e45948707162d9d8cfa8c068a084fe6
  PREREQUISITE_PATCH_SHA256: 5d8f8bb9a93331eb4a01ca2aefcf2d655dd0e36821f44353663e62d2751f7dc5
  CANDIDATE_SHA: a233af0b84e093845c62e88c2702cbd9b297f22c
  SOURCE_TREE: fefba51180be86548a58cc0438ba340716110bd7
  PATHS_SHA256: 56a1d5118580b0ea7c50e12d42dac3d95dfabcee58ecf5561b6797c92ae0ef93
  TRUSTED_P: 68aff7f864148760c3800c95435cc36ddaa91654
jobs:
  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VARIANT: after
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 0
        persist-credentials: false
    - name: Bind exact candidate
      shell: bash
      run: 'set -euo pipefail

        test "${{ inputs.target_ref }}" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

        test -z "$(git status --porcelain)"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        mkdir -p .artifacts/final-ci

        git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort > .artifacts/final-ci/source-paths.txt

        echo "$PATHS_SHA256  .artifacts/final-ci/source-paths.txt" | sha256sum -c -

        printf ''C=%s

        Q=%s

        P=%s

        workflow=%s

        run=%s

        attempt=%s

        '' "$CANDIDATE_SHA" "$CANDIDATE_SHA" "$TRUSTED_P" "${{ github.workflow_sha }}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
        > .artifacts/final-ci/identity.txt

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Install frozen QA overlay
      run: 'set -euo pipefail

        if [ "$VARIANT" = after ]; then

        printf ''%s'' ''''
        | base64 --decode > extensions/qa-lab/src/providers/mock-openai/mock-openai-request-log.ts

        echo ''5fbcbfc35da784348600400b701944dc7f240a37efcfc05b0afc640ad2fe5325  extensions/qa-lab/src/providers/mock-openai/mock-openai-request-log.ts''
        | sha256sum -c -

        fi

        if [ "$VARIANT" = after ]; then

        printf ''%s'' ''''
        | base64 --decode > extensions/qa-lab/src/providers/shared/http-json.ts

        echo ''0d3000d730319c5b6fe08d1685665f7fe5334c7b2baf801fa570a39f98645cb2  extensions/qa-lab/src/providers/shared/http-json.ts''
        | sha256sum -c -

        fi

        if [ "$VARIANT" = after ]; then

        printf ''%s'' ''''
        | base64 --decode > extensions/qa-lab/src/suite-provider-artifacts.ts

        echo ''5f92eee633ea271fd032c57b18504daa3ba3d635a0c2db3d582f6696899c35de  extensions/qa-lab/src/suite-provider-artifacts.ts''
        | sha256sum -c -

        fi

        if [ "$VARIANT" = after ]; then

        printf ''%s'' ''''
        | base64 --decode > qa/scenarios/agents/instruction-followthrough-repo-contract.yaml

        echo ''082af292d20bd57a160e795c58169a4ea3e94149a125c32c1e186bf5567893c8  qa/scenarios/agents/instruction-followthrough-repo-contract.yaml''
        | sha256sum -c -

        fi

        printf ''%s'' ''''
        | base64 --decode > extensions/qa-lab/src/providers/mock-openai/mock-openai-request-log.test.ts

        echo ''b2004871c54900edf00604c7abaeb850103f802c1d17c0490db4b676b2cead7e  extensions/qa-lab/src/providers/mock-openai/mock-openai-request-log.test.ts''
        | sha256sum -c -

        printf ''%s'' ''''
        | base64 --decode > extensions/qa-lab/src/suite-provider-artifacts.test.ts

        echo ''ac4cb5dde7cc1f04a1b17fcdb12b205b3f507f45b73a348442bb5bb2b9188e08  extensions/qa-lab/src/suite-provider-artifacts.test.ts''
        | sha256sum -c -

        git diff --binary > .artifacts/final-ci/overlay.patch

        sha256sum extensions/qa-lab/src/providers/mock-openai/mock-openai-request-log.ts extensions/qa-lab/src/providers/shared/http-json.ts
        extensions/qa-lab/src/suite-provider-artifacts.ts qa/scenarios/agents/instruction-followthrough-repo-contract.yaml
        extensions/qa-lab/src/providers/mock-openai/mock-openai-request-log.test.ts extensions/qa-lab/src/suite-provider-artifacts.test.ts
        > .artifacts/final-ci/overlay-sha256.txt'
    - name: Missing canonical type graph
      shell: bash
      run: 'set -euo pipefail

        node scripts/run-tsgo-core-test-shards.mjs ${{ matrix.args }} 2>&1 | tee .artifacts/final-ci/static.log'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: qa-static-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    strategy:
      fail-fast: false
      matrix:
        include:
        - id: ui-chat
          args: --ci-graphs-json '["core-test-ui-chat"]'
        - id: agents-sessions
          args: --ci-graphs-json '["core-test-agents-sessions"]'
        - id: services-cron
          args: --ci-graphs-json '["core-test-services-cron"]'
        - id: ui-app
          args: --ci-graphs-json '["core-test-ui-app"]'
        - id: ui-components
          args: --ci-graphs-json '["core-test-ui-components"]'
        - id: ui-e2e-chat
          args: --ci-graphs-json '["core-test-ui-e2e-chat"]'
        - id: extensions
          args: --ci-graphs-json '["extensions"]'
        - id: extensions-test
          args: --ci-graphs-json '["extensions-test"]'
        - id: scripts
          args: --ci-graphs-json '["scripts"]'
        - id: root-1
          args: --root-stripe 1/4
        - id: root-2
          args: --root-stripe 2/4
        - id: root-3
          args: --root-stripe 3/4
        - id: root-4
          args: --root-stripe 4/4
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VARIANT: after
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 0
        persist-credentials: false
    - name: Bind exact candidate
      shell: bash
      run: 'set -euo pipefail

        test "${{ inputs.target_ref }}" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

        test -z "$(git status --porcelain)"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        mkdir -p .artifacts/final-ci

        git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort > .artifacts/final-ci/source-paths.txt

        echo "$PATHS_SHA256  .artifacts/final-ci/source-paths.txt" | sha256sum -c -

        printf ''C=%s

        Q=%s

        P=%s

        workflow=%s

        run=%s

        attempt=%s

        '' "$CANDIDATE_SHA" "$CANDIDATE_SHA" "$TRUSTED_P" "${{ github.workflow_sha }}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
        > .artifacts/final-ci/identity.txt

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Install frozen QA overlay
      run: 'set -euo pipefail

        if [ "$VARIANT" = after ]; then

        printf ''%s'' ''''
        | base64 --decode > extensions/qa-lab/src/providers/mock-openai/mock-openai-request-log.ts

        echo ''5fbcbfc35da784348600400b701944dc7f240a37efcfc05b0afc640ad2fe5325  extensions/qa-lab/src/providers/mock-openai/mock-openai-request-log.ts''
        | sha256sum -c -

        fi

        if [ "$VARIANT" = after ]; then

        printf ''%s'' ''''
        | base64 --decode > extensions/qa-lab/src/providers/shared/http-json.ts

        echo ''0d3000d730319c5b6fe08d1685665f7fe5334c7b2baf801fa570a39f98645cb2  extensions/qa-lab/src/providers/shared/http-json.ts''
        | sha256sum -c -

        fi

        if [ "$VARIANT" = after ]; then

        printf ''%s'' ''''
        | base64 --decode > extensions/qa-lab/src/suite-provider-artifacts.ts

        echo ''5f92eee633ea271fd032c57b18504daa3ba3d635a0c2db3d582f6696899c35de  extensions/qa-lab/src/suite-provider-artifacts.ts''
        | sha256sum -c -

        fi

        if [ "$VARIANT" = after ]; then

        printf ''%s'' ''''
        | base64 --decode > qa/scenarios/agents/instruction-followthrough-repo-contract.yaml

        echo ''082af292d20bd57a160e795c58169a4ea3e94149a125c32c1e186bf5567893c8  qa/scenarios/agents/instruction-followthrough-repo-contract.yaml''
        | sha256sum -c -

        fi

        printf ''%s'' ''''
        | base64 --decode > extensions/qa-lab/src/providers/mock-openai/mock-openai-request-log.test.ts

        echo ''b2004871c54900edf00604c7abaeb850103f802c1d17c0490db4b676b2cead7e  extensions/qa-lab/src/providers/mock-openai/mock-openai-request-log.test.ts''
        | sha256sum -c -

        printf ''%s'' ''''
        | base64 --decode > extensions/qa-lab/src/suite-provider-artifacts.test.ts

        echo ''ac4cb5dde7cc1f04a1b17fcdb12b205b3f507f45b73a348442bb5bb2b9188e08  extensions/qa-lab/src/suite-provider-artifacts.test.ts''
        | sha256sum -c -

        git diff --binary > .artifacts/final-ci/overlay.patch

        sha256sum extensions/qa-lab/src/providers/mock-openai/mock-openai-request-log.ts extensions/qa-lab/src/providers/shared/http-json.ts
        extensions/qa-lab/src/suite-provider-artifacts.ts qa/scenarios/agents/instruction-followthrough-repo-contract.yaml
        extensions/qa-lab/src/providers/mock-openai/mock-openai-request-log.test.ts extensions/qa-lab/src/suite-provider-artifacts.test.ts
        > .artifacts/final-ci/overlay-sha256.txt'
    - name: Remaining full lint and import cycles
      shell: bash
      run: 'set -uo pipefail

        status=0

        pnpm lint 2>&1 | tee .artifacts/final-ci/lint.log || status=$?

        pnpm check:import-cycles 2>&1 | tee .artifacts/final-ci/import-cycles.log || status=$?

        exit "$status"'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: qa-static-lint-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
  detached-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VARIANT: after
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 0
        persist-credentials: false
    - name: Bind exact candidate
      shell: bash
      run: 'set -euo pipefail

        test "${{ inputs.target_ref }}" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"

        test -z "$(git status --porcelain)"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        mkdir -p .artifacts/final-ci

        git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort > .artifacts/final-ci/source-paths.txt

        echo "$PATHS_SHA256  .artifacts/final-ci/source-paths.txt" | sha256sum -c -

        printf ''C=%s

        Q=%s

        P=%s

        workflow=%s

        run=%s

        attempt=%s

        '' "$CANDIDATE_SHA" "$CANDIDATE_SHA" "$TRUSTED_P" "${{ github.workflow_sha }}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
        > .artifacts/final-ci/identity.txt

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: restore
    - uses: ./.github/actions/setup-test-bun
    - uses: ./.github/actions/setup-ripgrep
    - name: Apply exact detached lifecycle overlay
      run: 'set -euo pipefail

        printf ''%s'' ''''
        | base64 --decode | git apply -

        echo ''9c9de6445019d1c5242a3d056a4ffd716751ce97dc2bc5d4c1de2fc0e4cac4ea  src/agents/subagents/registry/subagent-registry-lifecycle.test.ts''
        | sha256sum -c -

        if [ "$VARIANT" = after ]; then

        printf ''%s'' ''''
        | base64 --decode | git apply -

        echo ''434b5ad6781bd02f564761f33394a74f6a4e9f591c4ac0b01c265160f9374a29  src/agents/subagents/registry/subagent-registry-lifecycle.ts''
        | sha256sum -c -

        printf ''%s'' ''''
        | base64 --decode | git apply -

        echo ''b12479cb6d07e93ac746ac424c0ef416a36e9b4f0f45ef6bd0660555497ea54e  src/agents/subagents/registry/subagent-registry-lifecycle-cleanup.ts''
        | sha256sum -c -

        printf ''%s'' ''''
        | base64 --decode | git apply -

        echo ''afecadf3f12de2221a3b61afce61b3b47623a2831d26b68ed71d85b47f8d5acf  src/agents/subagents/registry/subagent-registry-lifecycle-bookkeeping.ts''
        | sha256sum -c -

        fi

        git diff --binary > .artifacts/final-ci/overlay.patch

        sha256sum src/agents/subagents/registry/subagent-registry-lifecycle.test.ts src/agents/subagents/registry/subagent-registry-lifecycle.ts
        src/agents/subagents/registry/subagent-registry-lifecycle-cleanup.ts src/agents/subagents/registry/subagent-registry-lifecycle-bookkeeping.ts
        > .artifacts/final-ci/overlay-sha256.txt'
    - name: Canonical formatting repair only
      shell: bash
      run: 'set -euo pipefail

        pnpm exec oxfmt -- src/agents/subagents/registry/subagent-registry-lifecycle-bookkeeping.ts src/agents/subagents/registry/subagent-registry-lifecycle-cleanup.ts
        src/agents/subagents/registry/subagent-registry-lifecycle.test.ts src/agents/subagents/registry/subagent-registry-lifecycle.ts

        pnpm exec oxfmt --check -- src/agents/subagents/registry/subagent-registry-lifecycle-bookkeeping.ts src/agents/subagents/registry/subagent-registry-lifecycle-cleanup.ts
        src/agents/subagents/registry/subagent-registry-lifecycle.test.ts src/agents/subagents/registry/subagent-registry-lifecycle.ts

        mkdir -p .artifacts/formatted/src/agents/subagents/registry

        cp src/agents/subagents/registry/subagent-registry-lifecycle-bookkeeping.ts src/agents/subagents/registry/subagent-registry-lifecycle-cleanup.ts
        src/agents/subagents/registry/subagent-registry-lifecycle.test.ts src/agents/subagents/registry/subagent-registry-lifecycle.ts
        .artifacts/formatted/src/agents/subagents/registry/

        sha256sum src/agents/subagents/registry/subagent-registry-lifecycle-bookkeeping.ts src/agents/subagents/registry/subagent-registry-lifecycle-cleanup.ts
        src/agents/subagents/registry/subagent-registry-lifecycle.test.ts src/agents/subagents/registry/subagent-registry-lifecycle.ts
        > .artifacts/final-ci/formatted-sha256.txt

        git diff --binary > .artifacts/final-ci/formatted.patch

        '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
