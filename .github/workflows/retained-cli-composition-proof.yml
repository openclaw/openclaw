      run: 'set -euo pipefail

        export PRIVATE_PROOF="$RUNNER_TEMP/delegation-followup"

        printf %s  >> "$PRIVATE_PROOF/logs.py.b64"

        '
    - name: Transport manifest.json chunk 1
