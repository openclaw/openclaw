name: Artifact consumer static diagnosis 11a
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed workflow SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: artifact-consumer-static-11a
  cancel-in-progress: false
env:
  CI: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 11a0a9680d22977f0570409dbe8016c85a1ec3fd
        persist-credentials: false
        fetch-depth: 1
    - name: Initialize reviewed static capsule
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$PRIVATE_PROOF"

        : > "$PRIVATE_PROOF/static.py.b64"

        : > "$PRIVATE_PROOF/manifest.json.b64"

        : > "$PRIVATE_PROOF/static-manifest.json.b64"

        : > "$PRIVATE_PROOF/production.patch.b64"

        : > "$PRIVATE_PROOF/tests.patch.b64"

        : > "$PRIVATE_PROOF/tsconfig.scripts.json.b64"

        : > "$PRIVATE_PROOF/tsconfig.scripts.corrected.json.b64"

        : > "$PRIVATE_PROOF/tsconfig.tests.json.b64"

        : > "$PRIVATE_PROOF/tsconfig.tests.corrected.json.b64"

        '
    - name: Transport static.py chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/static.py.b64"

        '
    - name: Transport manifest.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport static-manifest.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/static-manifest.json.b64"

        '
    - name: Transport production.patch chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/production.patch.b64"

        '
    - name: Transport tests.patch chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/tests.patch.b64"

        '
    - name: Transport tsconfig.scripts.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s H4sIAAAAAAAC/21OOw7CMAzde4oqc5vu7MwcADGE1AFXTlLFKapU9e44DYIFyYP9Pn5va9pWwZohjKxOrdJ6kMlsY3D40GwTzpn1xDGormht9DMSpMucMYbi2QQWIsSzxyx3Tgt0FcNgE3gI2ZAQzhCDEPvxyMmXYr9WaQ3+5A1uIeoTEBiG3qSMzlip4SdW3T894X0QRWn0lctin/iCwyWm2xErlWgZoQRXANYf0OzNG+ONsRgRAQAA >> "$PRIVATE_PROOF/tsconfig.scripts.json.b64"

        '
    - name: Transport tsconfig.scripts.corrected.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s H4sIAAAAAAAC/22OsQ7CMAxE935FlbmkOzszH4AYQuqAq8SpEhdVqvrvOE0FC1IG5/nOd2vTtgoWBhqyOrdK614eZxvJ4VNnm3DirMccSXVFa2OY0EO6ToyRimcVLAuKl4Asf04zdJUh2QQBiI0/FsK3/Y6TI8V9q8qae8T1bvb+lMCDyXAyidEZKy3CmFX3T+/x0YuiFPrKZbAvfMPuEtN9j5VGfh6gBFcAyw80W/MBzBscOhABAAA= >> "$PRIVATE_PROOF/tsconfig.scripts.corrected.json.b64"

        '
    - name: Transport tsconfig.tests.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s H4sIAAAAAAAC/3WOQQrDIBBF9zlFcJ2Yffdd9wClC2vGMmWi4oxQCLl7xwbSbgou9H/f561d3xt4CcSZzak31k56BFgmYZ9iwMdxsS22JSWxT07RDI31aclIUC5ZMMW2sWqsRUznBUXfUioMe4bRF1ggiiMtgiMGLbbPUNCVhl/3rz8i7Atm4SlUorEAgWMYXREMzgvvVsJm+Atmqg+MY653Qu+a54EftMK3j4c6Up2hmewBvL5Bt3VvPyJA1zIBAAA= >> "$PRIVATE_PROOF/tsconfig.tests.json.b64"

        '
    - name: Transport tsconfig.tests.corrected.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s H4sIAAAAAAAC/3WOsQrDIBBA93xFcE7M3r1zP6B0sOYMV4yKd0Ig5N97JiXtUnDQd77jrU3bKlgYwkjq0iqtBzkMxAOTjcHhdF50xTrHyPpFMaiuujbOCT3kW2KMoe5YBcsgxOuMLG/OBbqDYbAZZghs/GcgfNv3OFlS7fvx86eDbMbENLjifZ/BgyHoTWZ0xjIdUUyq+ysmXyYMfSpPj9bUzFM/bZEfe4ck+jJCLTkALF/QbM0bTt0pPTEBAAA= >> "$PRIVATE_PROOF/tsconfig.tests.corrected.json.b64"

        '
    - name: Verify static capsule and exact source
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/static.py.b64" | gzip -d > "$PRIVATE_PROOF/static.py"

        echo d65b5e691af6d50bf62607429f8d7510585b51827f315eeea825ee39027b28e6  "$PRIVATE_PROOF/static.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/manifest.json.b64" | gzip -d > "$PRIVATE_PROOF/manifest.json"

        echo f9b7d49f78a513c168ca4ca651d7df75eb246b50c545dbcefe7981bea26103c0  "$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/static-manifest.json.b64" | gzip -d > "$PRIVATE_PROOF/static-manifest.json"

        echo eccd7d929640c8e8603be789c79a72d0e57a68fb66d3241c0c6ca1505bf75447  "$PRIVATE_PROOF/static-manifest.json" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/production.patch.b64" | gzip -d > "$PRIVATE_PROOF/production.patch"

        echo b7a95efea61f872e8fd4a315ea7a5f116aa88217079329aeaa7117d7b3adb333  "$PRIVATE_PROOF/production.patch" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/tests.patch.b64" | gzip -d > "$PRIVATE_PROOF/tests.patch"

        echo 52f48b013bed14915bc6bbaf564c7122b41f35a604a6b3907f2a75d48b10b5d6  "$PRIVATE_PROOF/tests.patch" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/tsconfig.scripts.json.b64" | gzip -d > "$PRIVATE_PROOF/tsconfig.scripts.json"

        echo 1d1ce6d0e9076c740a9b9e5f223e3f4636fc3a67530667921832713b97d16896  "$PRIVATE_PROOF/tsconfig.scripts.json" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/tsconfig.scripts.corrected.json.b64" | gzip -d > "$PRIVATE_PROOF/tsconfig.scripts.corrected.json"

        echo fca8e7215eee5d40e8bca65c6955e8bfb397b2630e50bb9393795f281dfb9308  "$PRIVATE_PROOF/tsconfig.scripts.corrected.json" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/tsconfig.tests.json.b64" | gzip -d > "$PRIVATE_PROOF/tsconfig.tests.json"

        echo 552e5033fe4de339ebc6deb87b1335c4f5fc02676fac04f716e2ae81f1d36a5b  "$PRIVATE_PROOF/tsconfig.tests.json" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/tsconfig.tests.corrected.json.b64" | gzip -d > "$PRIVATE_PROOF/tsconfig.tests.corrected.json"

        echo 9e2abc4a8dcb473ad4bd5416b6646d80027ef774f8c33f2ded324304476a04c7  "$PRIVATE_PROOF/tsconfig.tests.corrected.json" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/static.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'true'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - name: Observe original configs then targeted static proof
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/static.py" run

        '
    - name: Retain terminal status
      if: always()
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/static.py" finalize

        '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: artifact-consumer-static-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/artifact-consumer-safe/identity.json

          .artifacts/artifact-consumer-safe/report.json

          .artifacts/artifact-consumer-safe/prior-proof.json

          .artifacts/artifact-consumer-safe/formatted-hashes.json

          .artifacts/artifact-consumer-safe/formatted.patch

          .artifacts/artifact-consumer-safe/tsconfig.scripts.json

          .artifacts/artifact-consumer-safe/tsconfig.scripts.corrected.json

          .artifacts/artifact-consumer-safe/tsconfig.tests.json

          .artifacts/artifact-consumer-safe/tsconfig.tests.corrected.json

          .artifacts/artifact-consumer-safe/types-scripts-original-diagnostics.json

          .artifacts/artifact-consumer-safe/types-scripts-corrected-diagnostics.json

          .artifacts/artifact-consumer-safe/types-tests-original-diagnostics.json

          .artifacts/artifact-consumer-safe/types-tests-corrected-diagnostics.json'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
      if: always()
    env:
      PRIVATE_PROOF: ${{ github.workspace }}/.artifacts/artifact-consumer-private
      SAFE_PROOF: .artifacts/artifact-consumer-safe
