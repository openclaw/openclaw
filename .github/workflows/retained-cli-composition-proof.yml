{
  "name": "Claw offline owner diagnostic proof",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "workflow_ref": {
          "description": "Exact reviewed workflow commit",
          "required": true,
          "type": "string"
        },
        "diagnostic_commit": {
          "description": "Clean direct child of C containing only reviewed patch",
          "required": true,
          "type": "string"
        },
        "diagnostic_tree": {
          "description": "Expected diagnostic tree",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "claw-owner-diagnostic-${{ inputs.diagnostic_commit }}",
    "cancel-in-progress": false
  },
  "env": {
    "CI": "true",
    "PYTHONDONTWRITEBYTECODE": "1",
    "WORKFLOW_SHA": "${{ github.workflow_sha }}",
    "EXPECTED_WORKFLOW_SHA": "${{ inputs.workflow_ref }}",
    "DIAGNOSTIC_COMMIT": "${{ inputs.diagnostic_commit }}",
    "DIAGNOSTIC_TREE": "${{ inputs.diagnostic_tree }}",
    "OPENCLAW_VITEST_MAX_WORKERS": "2",
    "OPENCLAW_TEST_WORKERS": "2",
    "OPENCLAW_TEST_PROJECTS_SERIAL": "1",
    "OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS": "300000",
    "RAYON_NUM_THREADS": "2",
    "TOKIO_WORKER_THREADS": "2"
  },
  "jobs": {
    "static": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 110,
      "env": {
        "LANE": "static",
        "PRIVATE_PROOF": "${{ github.workspace }}/../claw-owner-private/static",
        "SAFE_PROOF": "${{ github.workspace }}-claw-owner-safe/static"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "openclaw/openclaw",
            "ref": "${{ inputs.diagnostic_commit }}",
            "persist-credentials": false,
            "fetch-depth": 2
          }
        },
        {
          "name": "Initialize private evidence directories",
          "shell": "bash",
          "run": "set -euo pipefail\numask 077\nmkdir -p \"$PRIVATE_PROOF\" \"$SAFE_PROOF\"\n"
        },
        {
          "name": "Transport hosted.py 1",
          "shell": "bash",
          "run": "set -euo pipefail\nprintf %s '' > \"$PRIVATE_PROOF/hosted.py.b64\"\n"
        },
        {
          "name": "Verify hosted.py transport",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode \"$PRIVATE_PROOF/hosted.py.b64\" > \"$PRIVATE_PROOF/hosted.py\"\nprintf '%s\\n' '81830a1db1bd2dbc36921f4a2351eda83a53007bca55ae22ad172c8c86ca3229  '\"$PRIVATE_PROOF/hosted.py\" | sha256sum --check --strict\n"
        },
        {
          "name": "Transport containment.py 1",
          "shell": "bash",
          "run": "set -euo pipefail\nprintf %s '' > \"$PRIVATE_PROOF/containment.py.b64\"\n"
        },
        {
          "name": "Verify containment.py transport",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode \"$PRIVATE_PROOF/containment.py.b64\" > \"$PRIVATE_PROOF/containment.py\"\nprintf '%s\\n' 'f8d859f25661719c3dcbf8d3e503e9399b2f6f1526f0128a7da228f1de385c79  '\"$PRIVATE_PROOF/containment.py\" | sha256sum --check --strict\n"
        },
        {
          "name": "Transport proof_data.py 1",
          "shell": "bash",
          "run": "set -euo pipefail\nprintf %s '' > \"$PRIVATE_PROOF/proof_data.py.b64\"\n"
        },
        {
          "name": "Verify proof_data.py transport",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode \"$PRIVATE_PROOF/proof_data.py.b64\" > \"$PRIVATE_PROOF/proof_data.py\"\nprintf '%s\\n' '64138c3245972ac59442100f5a7571a97eaf69238476dcb63b4f9708206f6d61  '\"$PRIVATE_PROOF/proof_data.py\" | sha256sum --check --strict\n"
        },
        {
          "name": "Transport native_diagnostics.py 1",
          "shell": "bash",
          "run": "set -euo pipefail\nprintf %s '' > \"$PRIVATE_PROOF/native_diagnostics.py.b64\"\n"
        },
        {
          "name": "Verify native_diagnostics.py transport",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode \"$PRIVATE_PROOF/native_diagnostics.py.b64\" > \"$PRIVATE_PROOF/native_diagnostics.py\"\nprintf '%s\\n' '05aca935a4e30e32ec66dbd23c82a3062fc59dc250fec46d8ce4fcd471c9668a  '\"$PRIVATE_PROOF/native_diagnostics.py\" | sha256sum --check --strict\n"
        },
        {
          "name": "Transport manifest.json 1",
          "shell": "bash",
          "run": "set -euo pipefail\nprintf %s '' > \"$PRIVATE_PROOF/manifest.json.b64\"\n"
        },
        {
          "name": "Transport manifest.json 2",
          "shell": "bash",
          "run": "set -euo pipefail\nprintf %s '' >> \"$PRIVATE_PROOF/manifest.json.b64\"\n"
        },
        {
          "name": "Verify manifest.json transport",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode \"$PRIVATE_PROOF/manifest.json.b64\" > \"$PRIVATE_PROOF/manifest.json\"\nprintf '%s\\n' 'bdc6ee54ab984c7accda4861e6c4c706d539d0db15a4f280d2b8e54dba9ea358  '\"$PRIVATE_PROOF/manifest.json\" | sha256sum --check --strict\n"
        },
        {
          "name": "Transport candidate.patch 1",
          "shell": "bash",
          "run": "set -euo pipefail\nprintf %s '' > \"$PRIVATE_PROOF/candidate.patch.b64\"\n"
        },
        {
          "name": "Verify candidate.patch transport",
          "shell": "bash",
          "run": "set -euo pipefail\nbase64 --decode \"$PRIVATE_PROOF/candidate.patch.b64\" > \"$PRIVATE_PROOF/candidate.patch\"\nprintf '%s\\n' '25a146dbd0c82b2fe9ac999afc38d13ea8b017ad7b4b124713c9fa5f99f16ec9  '\"$PRIVATE_PROOF/candidate.patch\" | sha256sum --check --strict\n"
        },
        {
          "name": "Bind exact candidate tree and workflow",
          "shell": "bash",
          "run": "python3 -B \"$PRIVATE_PROOF/hosted.py\" bind"
        },
        {
          "uses": "./.github/actions/setup-node-env",
          "with": {
            "semantic-checks": "true",
            "install-bun": "false",
            "cache-mode": "off",
            "frozen-lockfile": "true"
          }
        },
        {
          "name": "Run exact static proof",
          "shell": "bash",
          "run": "python3 -B \"$PRIVATE_PROOF/hosted.py\" run"
        },
        {
          "name": "Upload exact safe static evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "claw-owner-static-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ github.workspace }}-claw-owner-safe/static/identity.json\n${{ github.workspace }}-claw-owner-safe/static/report.json",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    },
