# TEMPLATE: parent reviews/seals/publishes; no dispatch performed.
name: Swift causal readiness proof
run-name: Swift causal readiness ${{ inputs.candidate_sha }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Clean direct child of C5fed containing only the reviewed test-only causal readiness patch
        required: true
        type: string
      tooling_sha:
        description: Exact reviewed workflow commit (must equal github.workflow_sha)
        required: true
        type: string
permissions:
  contents: read
jobs:
  selected-native:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      NODE_VERSION: "24.22.1"
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      EXPECTED_WORKFLOW_SHA: ${{ inputs.tooling_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Checkout clean candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout reviewed proof owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: ${{ github.workflow_sha }}
          path: proof
          persist-credentials: false
      - name: Checkout frozen CI harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: 5fed4f0df99d1d1c3e7a9ac8b9848aac6526af29
          path: harness
          persist-credentials: false
      - name: Bind before any product-capable setup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PRIVATE_PROOF="$RUNNER_TEMP/swift-causal-private"
          export SAFE_PROOF="$RUNNER_TEMP/swift-causal-safe"
          printf 'PRIVATE_PROOF=%s\nSAFE_PROOF=%s\n' "$PRIVATE_PROOF" "$SAFE_PROOF" >> "$GITHUB_ENV"
          mkdir -p "$PRIVATE_PROOF" "$SAFE_PROOF"
          python3 proof/scripts/swift-causal-proof/verify.py bind "$PWD" "$GITHUB_WORKSPACE/harness"
      - name: Setup Node environment for Apple assets
        uses: ./harness/.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: off
          install-bun: "false"
          install-deps: "false"
      - name: Build exact head and run selected default-profile suite
        id: native
        shell: bash
        run: bash proof/scripts/swift-causal-proof/hosted.sh
      - name: Collect bounded facts only
        if: always()
        id: collect
        env:
          NATIVE_STEP_OUTCOME: ${{ steps.native.outcome }}
        shell: bash
        run: python3 proof/scripts/swift-causal-proof/verify.py collect "$PWD" "$GITHUB_WORKSPACE/harness"
      - name: Upload only allowlisted selected-test facts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: swift-causal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swift-causal-safe/identity.json
            ${{ runner.temp }}/swift-causal-safe/result.json
          if-no-files-found: error
          retention-days: 7
# NO raw log upload: Actions artifact visibility is not private to this conversation.
