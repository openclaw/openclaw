    - name: Require original selection defect in baseline
      shell: bash
      run: 'set -euo pipefail

        python3 <<''PY''

        import json,pathlib

        p=pathlib.Path(''.artifacts/final-ci'');r=json.loads((p/''tests.json'').read_text());assert int((p/''exit-code.txt'').read_text())!=0

        assert r[''numPassedTests'']==4 and r[''numFailedTests'']==1 and r[''numPendingTests'']==0

        cases=[a for s in r[''testResults''] for a in s[''assertionResults'']];assert len(cases)==5

        hit=[a for a in cases if a[''title'']==''drains unresolved managers only when adapters retire and fences their late
        provider work''];assert len(hit)==1 and hit[0][''status'']==''failed''

        assert all(a[''status'']==''passed'' for a in cases if a is not hit[0])

        msg='' ''.join(hit[0][''failureMessages'']);assert ''called once'' in msg and ''0'' in msg,msg

        print(json.dumps({''qualification'':False,''expectedRegressionFailure'':True,''passed'':4,''failed'':1}))

        PY

        '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: tests-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    strategy:
      fail-fast: false
      matrix:
        include:
        - lane: registry-before
          tests_json: '["extensions/memory-core/src/memory/manager-registry.reload.test.ts"]'
    env:
      TESTS_JSON: ${{ matrix.tests_json }}
      OPENCLAW_SESSION_EXPORT_STRESS: '1'
      REQUIRE_STRESS: ${{ matrix.lane == 'memory-replay' && '1' || '0' }}
      PROOF_LANE: ${{ matrix.lane }}
      CANDIDATE_SHA: 63432e1f987b84c6ac022ca3def0ab0394e3ee01
      SOURCE_TREE: 141a1a3df9d5909e7f2c6365714750318c1bcc93
      PATHS_SHA256: c6b9bda9fd4108f93953a5a3ae37a223edaba11f0888c4a03eb05206dca710cc
