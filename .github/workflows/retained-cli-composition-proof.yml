name: Artifact metadata consumer bounded repair proof 11a
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed workflow SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: artifact-consumer-repair-11a
  cancel-in-progress: false
env:
  CI: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 11a0a9680d22977f0570409dbe8016c85a1ec3fd
        persist-credentials: false
        fetch-depth: 1
    - name: Initialize reviewed capsule
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$PRIVATE_PROOF"

        : > "$PRIVATE_PROOF/hosted.py.b64"

        : > "$PRIVATE_PROOF/manifest.json.b64"

        : > "$PRIVATE_PROOF/tests.patch.b64"

        : > "$PRIVATE_PROOF/production.patch.b64"

        : > "$PRIVATE_PROOF/runtime-plan.mts.b64"

        : > "$PRIVATE_PROOF/tsconfig.scripts.json.b64"

        : > "$PRIVATE_PROOF/tsconfig.tests.json.b64"

        '
    - name: Transport hosted.py chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/hosted.py.b64"

        '
    - name: Transport manifest.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport tests.patch chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/tests.patch.b64"

        '
    - name: Transport production.patch chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/production.patch.b64"

        '
    - name: Transport runtime-plan.mts chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/runtime-plan.mts.b64"

        '
    - name: Transport tsconfig.scripts.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s H4sIAAAAAAAC/21OOw7CMAzde4oqc5vu7MwcADGE1AFXTlLFKapU9e44DYIFyYP9Pn5va9pWwZohjKxOrdJ6kMlsY3D40GwTzpn1xDGormht9DMSpMucMYbi2QQWIsSzxyx3Tgt0FcNgE3gI2ZAQzhCDEPvxyMmXYr9WaQ3+5A1uIeoTEBiG3qSMzlip4SdW3T894X0QRWn0lctin/iCwyWm2xErlWgZoQRXANYf0OzNG+ONsRgRAQAA >> "$PRIVATE_PROOF/tsconfig.scripts.json.b64"

        '
    - name: Transport tsconfig.tests.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s H4sIAAAAAAAC/3WOQQrDIBBF9zlFcJ2Yffdd9wClC2vGMmWi4oxQCLl7xwbSbgou9H/f561d3xt4CcSZzak31k56BFgmYZ9iwMdxsS22JSWxT07RDI31aclIUC5ZMMW2sWqsRUznBUXfUioMe4bRF1ggiiMtgiMGLbbPUNCVhl/3rz8i7Atm4SlUorEAgWMYXREMzgvvVsJm+Atmqg+MY653Qu+a54EftMK3j4c6Up2hmewBvL5Bt3VvPyJA1zIBAAA= >> "$PRIVATE_PROOF/tsconfig.tests.json.b64"

        '
    - name: Verify capsule and exact source
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/hosted.py.b64" | gzip -d > "$PRIVATE_PROOF/hosted.py"

        echo 81cdcf54933abb80b138ccf354a47c920b22b0980e89a47802373e3800022274  "$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/manifest.json.b64" | gzip -d > "$PRIVATE_PROOF/manifest.json"

        echo f9b7d49f78a513c168ca4ca651d7df75eb246b50c545dbcefe7981bea26103c0  "$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/tests.patch.b64" | gzip -d > "$PRIVATE_PROOF/tests.patch"

        echo 52f48b013bed14915bc6bbaf564c7122b41f35a604a6b3907f2a75d48b10b5d6  "$PRIVATE_PROOF/tests.patch" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/production.patch.b64" | gzip -d > "$PRIVATE_PROOF/production.patch"

        echo b7a95efea61f872e8fd4a315ea7a5f116aa88217079329aeaa7117d7b3adb333  "$PRIVATE_PROOF/production.patch" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/runtime-plan.mts.b64" | gzip -d > "$PRIVATE_PROOF/runtime-plan.mts"

        echo 7905d012aa68fec0a69d38bfa6f182b7f81dd65ff52f0a35d2abc11e89b9fa93  "$PRIVATE_PROOF/runtime-plan.mts" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/tsconfig.scripts.json.b64" | gzip -d > "$PRIVATE_PROOF/tsconfig.scripts.json"

        echo 1d1ce6d0e9076c740a9b9e5f223e3f4636fc3a67530667921832713b97d16896  "$PRIVATE_PROOF/tsconfig.scripts.json" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/tsconfig.tests.json.b64" | gzip -d > "$PRIVATE_PROOF/tsconfig.tests.json"

        echo 552e5033fe4de339ebc6deb87b1335c4f5fc02676fac04f716e2ae81f1d36a5b  "$PRIVATE_PROOF/tsconfig.tests.json" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'true'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - name: Baseline regression then focused patched proof
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/hosted.py" run

        '
    - name: Retain terminal status
      if: always()
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/hosted.py" finalize

        '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: artifact-consumer-repair-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/artifact-consumer-safe/identity.json

          .artifacts/artifact-consumer-safe/report.json

          .artifacts/artifact-consumer-safe/baseline.json

          .artifacts/artifact-consumer-safe/baseline-tests-summary.json

          .artifacts/artifact-consumer-safe/runtime-plan.json

          .artifacts/artifact-consumer-safe/patched-*.json

          .artifacts/artifact-consumer-safe/formatted-hashes.json

          .artifacts/artifact-consumer-safe/formatted.patch'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
      if: always()
    env:
      PRIVATE_PROOF: ${{ github.workspace }}/.artifacts/artifact-consumer-private
      SAFE_PROOF: .artifacts/artifact-consumer-safe
