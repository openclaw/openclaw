name: Release 11.4 targeted tooling proof
on:
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-114-tooling-proof
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EXPECTED_TARGET: 569263b0083542f3ae0df8ee82dd23d43d14cebb
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [policy, windows, static]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind reviewed source
        shell: bash
        env:
          INPUT_TARGET: ${{ inputs.target_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$INPUT_TARGET" = "$EXPECTED_TARGET"
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
          test -z "$(git status --porcelain)"
          mkdir -p .artifacts/tooling-proof
          printf "source=%s\nworkflow=%s\nrun=%s\nattempt=%s\n" "$EXPECTED_TARGET" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .artifacts/tooling-proof/identity.txt
          sha256sum .github/workflows/openclaw-release-checks.yml scripts/lib/release-validation-waivers.mjs scripts/pr-lib/wrapper-components.txt test/scripts/package-acceptance-workflow.test.ts test/scripts/release-validation-waivers.test.ts > .artifacts/tooling-proof/source-sha256.txt
      - uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          install-bun: "false"
          cache-mode: restore
      - uses: ./.github/actions/setup-test-bun
      - uses: ./.github/actions/setup-ripgrep
      - name: Policy and consumer contracts
        if: matrix.lane == 'policy'
        shell: bash
        run: |
          set -euo pipefail
          pnpm test test/scripts/release-validation-waivers.test.ts test/scripts/full-release-validation-state.test.ts test/scripts/release-ci-summary.test.ts test/scripts/pr-wrapper-source-closure.test.ts --maxWorkers=1 2>&1 | tee .artifacts/tooling-proof/tests.log
      - name: Windows immutable tuple contract
        if: matrix.lane == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          pnpm test test/scripts/package-acceptance-workflow.test.ts --maxWorkers=1 -t "binds Windows-node release and main E2E calls to immutable source tuples" 2>&1 | tee .artifacts/tooling-proof/windows.log
      - name: Changed file formatting
        if: matrix.lane == 'static'
        shell: bash
        run: |
          set -euo pipefail
          pnpm format:check .github/workflows/openclaw-release-checks.yml scripts/lib/release-validation-waivers.mjs scripts/pr-lib/wrapper-components.txt test/scripts/package-acceptance-workflow.test.ts test/scripts/release-validation-waivers.test.ts 2>&1 | tee .artifacts/tooling-proof/format.log
      - name: Changed file lint
        if: always() && matrix.lane == 'static'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.test.root.tooling.json scripts/lib/release-validation-waivers.mjs test/scripts/package-acceptance-workflow.test.ts test/scripts/release-validation-waivers.test.ts 2>&1 | tee .artifacts/tooling-proof/lint.log
      - name: Tooling test types
        if: always() && matrix.lane == 'static'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.test.root.tooling.json --incremental 2>&1 | tee .artifacts/tooling-proof/types.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-114-tooling-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/tooling-proof/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
