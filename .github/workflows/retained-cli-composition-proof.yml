name: Release 11.4 actual Connection router baseline
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-114-ui-router-7957bf32
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  connection-router:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact C only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7957bf3258707ba5d5860393990a67aa53ef2f91
          fetch-depth: 1
          persist-credentials: false
      - name: Bind exact C and frozen test-only patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7957bf3258707ba5d5860393990a67aa53ef2f91
          test "$(git rev-parse HEAD^{tree})" = 33c1d06b7b1bc65e9a538a6acf21cd2510f42208
          test -z "$(git status --porcelain)"
          proof="$RUNNER_TEMP/ui-router-private"
          mkdir -m 700 "$proof"
          base64 --decode > "$proof/payload.tar.gz" <<'FROZEN'
          
          FROZEN
          printf '%s  %s\n' '17c16a12adcc4973a1e224c7b571424d7cbc82cbf1f006619dc8f4b6933faf43' "$proof/payload.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$proof/payload.tar.gz" --directory "$proof" --no-same-owner --no-same-permissions regression.patch manifest.json run.py
          python3 "$proof/run.py" prepare
      - name: Setup exact-C Node and dependencies
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: 'true'
          install-bun: 'false'
          cache-mode: restore
      - name: Setup canonical test Bun
        id: bun
        uses: ./.github/actions/setup-test-bun
      - name: Complete Connection file with actual routed entry (25 cases)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.bun.outcome == 'success' }}
        shell: bash
        run: python3 "$RUNNER_TEMP/ui-router-private/run.py" complete
      - name: Require recorded complete-file outcome
        if: ${{ always() }}
        shell: bash
        run: python3 "$RUNNER_TEMP/ui-router-private/run.py" finalize
      - name: Upload strict allowlisted result only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-router-exactC-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/ui-router-public/identity.json
            .artifacts/ui-router-public/manifest.json
            .artifacts/ui-router-public/regression.patch
            .artifacts/ui-router-public/complete.json
            .artifacts/ui-router-public/summary.json
            .artifacts/ui-router-public/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
