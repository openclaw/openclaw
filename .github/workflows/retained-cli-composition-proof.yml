        node scripts/run-tsgo-core-test-shards.mjs --ci-graphs-json ''["scripts","core-test-other","core-test-agents-root"]''
        --concurrency 2 2>&1 | tee .artifacts/final-ci/types.log'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
