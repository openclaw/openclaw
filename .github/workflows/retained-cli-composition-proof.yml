name: Bounded targeted production V7 compact capsule transport
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      SAFE_PROOF: .artifacts/delegation-followup-safe
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: c89139757f2c6728863a740309027562004163f8
        persist-credentials: false
        fetch-depth: 1
      timeout-minutes: 4
    - name: Initialize exact diagnostic capsule transport
      shell: bash
      run: 'set -euo pipefail

        export PRIVATE_PROOF="$RUNNER_TEMP/delegation-followup"

        mkdir -p "$PRIVATE_PROOF"

        : > "$PRIVATE_PROOF/hosted.py.b64"

        : > "$PRIVATE_PROOF/results.py.b64"

        : > "$PRIVATE_PROOF/diagnostics.py.b64"

        : > "$PRIVATE_PROOF/logs.py.b64"

        : > "$PRIVATE_PROOF/manifest.json.b64"

        : > "$PRIVATE_PROOF/combined.patch.b64"

        : > "$PRIVATE_PROOF/production.tsconfig.json.b64"

        '
    - name: Transport hosted.py chunk 1
      shell: bash
      run: 'set -euo pipefail

        export PRIVATE_PROOF="$RUNNER_TEMP/delegation-followup"

        printf %s  >> "$PRIVATE_PROOF/hosted.py.b64"

        '
    - name: Transport results.py chunk 1
      shell: bash
      run: 'set -euo pipefail

        export PRIVATE_PROOF="$RUNNER_TEMP/delegation-followup"

        printf %s  >> "$PRIVATE_PROOF/results.py.b64"

        '
    - name: Transport diagnostics.py chunk 1
      shell: bash
      run: 'set -euo pipefail

        export PRIVATE_PROOF="$RUNNER_TEMP/delegation-followup"

        printf %s  >> "$PRIVATE_PROOF/diagnostics.py.b64"

        '
    - name: Transport logs.py chunk 1
