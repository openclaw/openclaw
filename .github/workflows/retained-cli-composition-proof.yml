name: Delegation owner repair proof 11a
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed diagnostic workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: delegation-owner-repair-11a
  cancel-in-progress: false
env:
  CI: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  TARGET_SHA: 11a0a9680d22977f0570409dbe8016c85a1ec3fd
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
jobs:
  negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANE: negative
      SAFE_PROOF: .artifacts/delegation-owner-negative
      PRIVATE_PROOF: ${{ github.workspace }}/../delegation-owner-negative-private
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_VITEST_MAX_WORKERS: '2'
      OPENCLAW_CI_TEST_RUNTIME_POLICY: dual
      OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: '300000'
      FROZEN_TARGET: 'false'
      RUNNER_ENVIRONMENT: github-hosted
      OPENCLAW_NODE_TEST_GROUPS_JSON: '[{"configs":["test/vitest/vitest.gateway-server.config.ts"],"includePatterns":["src/gateway/server.config-policy-response.test.ts","src/gateway/server.config-security-policy.test.ts","src/gateway/server.delegated-administration.product.test.ts"],"shard_name":"agentic-control-plane-runtime-state"}]'
      OPENCLAW_NODE_TEST_GROUPS_GZIP_BASE64: ''
      OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: ''
      OPENCLAW_NODE_TEST_PLAN_CONTINUE_ON_FAILURE: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 11a0a9680d22977f0570409dbe8016c85a1ec3fd
        persist-credentials: false
        fetch-depth: 1
    - name: Initialize exact reviewed proof transport
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$PRIVATE_PROOF"

        : > "$PRIVATE_PROOF/hosted.py.b64"

        : > "$PRIVATE_PROOF/safe_data.py.b64"

        : > "$PRIVATE_PROOF/writer_data.py.b64"

        : > "$PRIVATE_PROOF/static_data.py.b64"

        : > "$PRIVATE_PROOF/static_checks.py.b64"

        : > "$PRIVATE_PROOF/manifest.json.b64"

        : > "$PRIVATE_PROOF/negative.patch.b64"

        '
    - name: Transport hosted.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/hosted.py.b64"

        '
    - name: Transport safe_data.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/safe_data.py.b64"

        '
    - name: Transport writer_data.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/writer_data.py.b64"

        '
    - name: Transport static_data.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/static_data.py.b64"

        '
    - name: Transport static_checks.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/static_checks.py.b64"

        '
    - name: Transport manifest.json 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport negative.patch 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/negative.patch.b64"

        '
    - name: Verify capsule and bind exact candidate
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/hosted.py.b64" | gzip -d > "$PRIVATE_PROOF/hosted.py"

        echo 0c449cee86ca9a82ee7dcc416e07dd4d6f55717a71cc30f0c9e5c40e557031e8  "$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/safe_data.py.b64" | gzip -d > "$PRIVATE_PROOF/safe_data.py"

        echo 8b587db186980f916068f93606d982f4213b7eddf9ba8d764dd6051cb088fe0d  "$PRIVATE_PROOF/safe_data.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/writer_data.py.b64" | gzip -d > "$PRIVATE_PROOF/writer_data.py"

        echo a70ebc133d1d6c5685ff5094cc346602844954e92112b6f0caa84a0293812739  "$PRIVATE_PROOF/writer_data.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/static_data.py.b64" | gzip -d > "$PRIVATE_PROOF/static_data.py"

        echo 2c4cc60f47d7a99c702c8c61af11a407ce823aaa1e1a65f9677bfe59700a4631  "$PRIVATE_PROOF/static_data.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/static_checks.py.b64" | gzip -d > "$PRIVATE_PROOF/static_checks.py"

        echo f6287fdc7a8b430ffb635496d72c739407ae3971f3a37e58d8b31d0b104a1cd4  "$PRIVATE_PROOF/static_checks.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/manifest.json.b64" | gzip -d > "$PRIVATE_PROOF/manifest.json"

        echo 3ec276143e79e496ed3496dd42cec7a3e23fcc83b59cf08d5eefabaf13234be2  "$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/negative.patch.b64" | gzip -d > "$PRIVATE_PROOF/negative.patch"

        echo ba0508dcae1389dded115747b6e914e0fa039e993effe4728989745132fbe48c  "$PRIVATE_PROOF/negative.patch" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Run negative through reviewed bounded harness
      shell: bash
      run: 'python3 "$PRIVATE_PROOF/hosted.py" run

        '
    - name: Retain sanitized outcomes after failure
      if: always()
      shell: bash
      run: 'if [ -f "$PRIVATE_PROOF/hosted.py" ]; then python3 "$PRIVATE_PROOF/hosted.py" finalize; fi

        '
    - name: Upload explicit safe evidence only
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: delegation-owner-negative-${{ github.run_id }}-${{ github.run_attempt }}
