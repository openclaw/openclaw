name: Modal event-only cold diagnostic 11a
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed diagnostic workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: modal-event-only-diagnostic-11a
  cancel-in-progress: false
env:
  CI: 'true'
  OPENCLAW_RELEASE_CONTEXT_REF: release/2026.11.4
  TARGET_SHA: 11a0a9680d22977f0570409dbe8016c85a1ec3fd
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
jobs:
  modal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SAFE_PROOF: .artifacts/modal-event-only-public
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: 11a0a9680d22977f0570409dbe8016c85a1ec3fd
        persist-credentials: false
        fetch-depth: 1
    - name: Initialize private capsule
      shell: bash
      run: 'set -euo pipefail

        PRIVATE_PROOF="$RUNNER_TEMP/modal-event-only-private"

        PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/modal-event-only-browsers"

        export PRIVATE_PROOF PLAYWRIGHT_BROWSERS_PATH

        printf ''%s\n'' "PRIVATE_PROOF=$PRIVATE_PROOF" "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"

        mkdir -m 700 "$PRIVATE_PROOF"

        : > "$PRIVATE_PROOF/hosted.py.b64"

        : > "$PRIVATE_PROOF/verify_results.py.b64"

        : > "$PRIVATE_PROOF/modal_data.py.b64"

        : > "$PRIVATE_PROOF/manifest.json.b64"

        : > "$PRIVATE_PROOF/proposed.patch.b64"

        '
    - name: Transport hosted.py chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/hosted.py.b64"

        '
    - name: Transport verify_results.py chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/verify_results.py.b64"

        '
    - name: Transport modal_data.py chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/modal_data.py.b64"

        '
    - name: Transport manifest.json chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport proposed.patch chunk 1
      shell: bash
      run: 'set -euo pipefail

        printf %s  >> "$PRIVATE_PROOF/proposed.patch.b64"

        '
    - name: Verify exact capsule and apply test-only overlay
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/hosted.py.b64" | gzip -d > "$PRIVATE_PROOF/hosted.py"

        echo 03258f0cc21daf36debbfb3138c4b56f4770a7c213d3c105b4ff545c136bb4ee  "$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/verify_results.py.b64" | gzip -d > "$PRIVATE_PROOF/verify_results.py"

        echo a35f424ae1c0fe86dd44c034ad7125f166bbbc9749617720a70288430541a32c  "$PRIVATE_PROOF/verify_results.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/modal_data.py.b64" | gzip -d > "$PRIVATE_PROOF/modal_data.py"

        echo 6c6753cf07b8921a3acd6444705f681e3a900587461212af4a38951c238e5a9b  "$PRIVATE_PROOF/modal_data.py" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/manifest.json.b64" | gzip -d > "$PRIVATE_PROOF/manifest.json"

        echo ebc129101b1945ce6a8922ffed7653f344f5cec134858cc728c9e4a8880e5d7d  "$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        base64 --decode "$PRIVATE_PROOF/proposed.patch.b64" | gzip -d > "$PRIVATE_PROOF/proposed.patch"

        echo 3ef14e72e3e4b4a1bc03972232785d7c04c8c49a02b0a6a70cbdc5b147dbde8b  "$PRIVATE_PROOF/proposed.patch" | sha256sum --check --strict

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
        node-version: 24.22.1
      timeout-minutes: 15
    - uses: ./.github/actions/setup-test-bun
    - name: Install canonical Chromium prerequisite
      shell: bash
      timeout-minutes: 5
      run: 'set -euo pipefail

        pnpm --dir ui exec playwright install --with-deps chromium > "$PRIVATE_PROOF/browser-install.log" 2>&1

        '
    - name: Run entire modal file through normal router
      shell: bash
      run: 'python3 "$PRIVATE_PROOF/hosted.py" run

        '
    - name: Capture safe diagnostics after any outcome
      if: always()
      shell: bash
      run: 'if [ -f "$PRIVATE_PROOF/hosted.py" ]; then python3 "$PRIVATE_PROOF/hosted.py" finalize; fi

        '
    - name: Upload explicit synthetic evidence only
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: modal-event-only-11a-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.artifacts/modal-event-only-public/identity.json

          .artifacts/modal-event-only-public/report.json

          .artifacts/modal-event-only-public/tests.json

          .artifacts/modal-event-only-public/inner-status.json

          .artifacts/modal-event-only-public/modal.json

          .artifacts/modal-event-only-public/images.json

          .artifacts/modal-event-only-public/capture-error.json

          .artifacts/modal-event-only-public/modal-event-only-drawer.png

          .artifacts/modal-event-only-public/modal-event-only-viewport-edge-to-edge.png

          .artifacts/modal-event-only-public/file-hashes.json'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
