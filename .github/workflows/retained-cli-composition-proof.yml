name: "Original shard diagnostics \u2014 not qualification"
'on':
  workflow_dispatch:
    inputs:
      workflow_ref:
        description: Exact reviewed workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: original-shard-diagnostics
  cancel-in-progress: false
env:
  CI: 'true'
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_ref }}
jobs:
  delegated:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENCLAW_NODE_TEST_GROUPS_GZIP_BASE64: 
      OPENCLAW_CI_TEST_RUNTIME_POLICY: dual
      OPENCLAW_VITEST_MAX_WORKERS: '2'
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_NODE_TEST_VITEST_ARGS_JSON: '[]'
      OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: '300000'
      LANE: delegated
      PRIVATE_PROOF: ${{ github.workspace }}/../original-shard-private/delegated
      SAFE_PROOF: ${{ github.workspace }}-original-shard-safe/delegated
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openclaw/openclaw
        ref: a38363bbb0eacaab78485eba79a45affc6338f1d
        persist-credentials: false
        fetch-depth: 1
    - name: Initialize private evidence directories
      shell: bash
      run: 'set -euo pipefail

        umask 077

        mkdir -p "$PRIVATE_PROOF" "$SAFE_PROOF"

        '
    - name: Transport hosted.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/hosted.py.b64"

        '
    - name: Verify hosted.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/hosted.py.b64" > "$PRIVATE_PROOF/hosted.py"

        printf ''%s\n'' ''9351b1a818cd5c60cbfb0984b4306b52c4fbde76fefc954de6b9c7292cc4958e  ''"$PRIVATE_PROOF/hosted.py" | sha256sum --check --strict

        '
    - name: Transport containment.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/containment.py.b64"

        '
    - name: Verify containment.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/containment.py.b64" > "$PRIVATE_PROOF/containment.py"

        printf ''%s\n'' ''f8d859f25661719c3dcbf8d3e503e9399b2f6f1526f0128a7da228f1de385c79  ''"$PRIVATE_PROOF/containment.py" | sha256sum --check --strict

        '
    - name: Transport diagnostic_data.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/diagnostic_data.py.b64"

        '
    - name: Verify diagnostic_data.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/diagnostic_data.py.b64" > "$PRIVATE_PROOF/diagnostic_data.py"

        printf ''%s\n'' ''ac4ab0adaef6ed85c03fc4c59b14c47f532e4d8f8dce8a1805d94a50c0c98048  ''"$PRIVATE_PROOF/diagnostic_data.py" | sha256sum --check --strict

        '
    - name: Transport manifest.json 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 2
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 3
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Transport manifest.json 4
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' >> "$PRIVATE_PROOF/manifest.json.b64"

        '
    - name: Verify manifest.json transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/manifest.json.b64" > "$PRIVATE_PROOF/manifest.json"

        printf ''%s\n'' ''5981b27fdca0879177d5522ac8fae6d191085448f79f265b6ecff35373a97d79  ''"$PRIVATE_PROOF/manifest.json" | sha256sum --check --strict

        '
    - name: Transport delegated-diagnostic.patch 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/delegated-diagnostic.patch.b64"

        '
    - name: Verify delegated-diagnostic.patch transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/delegated-diagnostic.patch.b64" > "$PRIVATE_PROOF/delegated-diagnostic.patch"

        printf ''%s\n'' ''07597995bce618e01943acb67438b6bbf2056ba05f2b90c82bdb09d5b04cd3a7  ''"$PRIVATE_PROOF/delegated-diagnostic.patch" | sha256sum --check --strict

        '
    - name: Transport delegated-sanitize.py 1
      shell: bash
      run: 'set -euo pipefail

        printf %s '''' > "$PRIVATE_PROOF/delegated-sanitize.py.b64"

        '
    - name: Verify delegated-sanitize.py transport
      shell: bash
      run: 'set -euo pipefail

        base64 --decode "$PRIVATE_PROOF/delegated-sanitize.py.b64" > "$PRIVATE_PROOF/delegated-sanitize.py"

        printf ''%s\n'' ''1c3a9986ee0cbdb797253275a938c9e95d9c9155256946b153375ef0700d29c9  ''"$PRIVATE_PROOF/delegated-sanitize.py" | sha256sum --check --strict

        '
    - name: Bind exact candidate and diagnostic overlay
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/hosted.py" bind

        '
    - uses: ./.github/actions/setup-node-env
      with:
        node-version: 24.22.1
        semantic-checks: 'true'
        install-bun: 'false'
        cache-mode: 'off'
        frozen-lockfile: 'true'
    - uses: ./.github/actions/setup-test-bun
    - name: Collect exact delegated diagnostic
      shell: bash
      run: 'set -euo pipefail

        python3 "$PRIVATE_PROOF/hosted.py" run

        '
    - name: Upload exact safe delegated evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: original-shard-delegated-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ github.workspace }}-original-shard-safe/delegated/identity.json

          ${{ github.workspace }}-original-shard-safe/delegated/report.json

          ${{ github.workspace }}-original-shard-safe/delegated/diagnostics.json

          ${{ github.workspace }}-original-shard-safe/delegated/native-status.json'
        if-no-files-found: error
        retention-days: 14
