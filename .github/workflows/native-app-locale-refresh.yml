name: Native App Locale Refresh

on:
  push:
    branches:
      - main
    paths:
      - apps/android/app/src/main/**
      - apps/android/app/src/play/**
      - apps/android/app/src/thirdParty/**
      - apps/android/wear/src/main/**
      - apps/ios/**
      - apps/macos/Sources/**
      - apps/macos/Package.swift
      - apps/shared/OpenClawKit/Sources/**
      - apps/.i18n/native/**
      - apps/.i18n/native-source.json
      - scripts/control-ui-i18n.ts
      - scripts/lib/control-ui-i18n-catalog-values.ts
      - scripts/lib/control-ui-i18n-config.json
      - scripts/lib/control-ui-i18n-config.ts
      - scripts/lib/control-ui-i18n-sync-plan.ts
      - scripts/android-app-i18n.ts
      - scripts/apple-app-i18n.ts
      - scripts/native-app-i18n.ts
      - scripts/native-i18n-inventory.ts
      - scripts/native-i18n-locales.ts
      - ui/src/i18n/.i18n/glossary.*.json
      - .github/actions/create-generated-pr-tokens/action.yml
      - .github/actions/publish-generated-pr/action.yml
      - .github/actions/publish-generated-pr/policy.py
      - .github/workflows/native-app-locale-refresh.yml
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Retranslate every source string, including existing translations.
        required: false
        default: false
        type: boolean
      publish:
        description: Publish the generated locale PR after validation.
        required: false
        default: true
        type: boolean
      preflight_only:
        description: Verify an exact branch dispatch without translation or publishing secrets.
        required: false
        default: false
        type: boolean
      source_sha:
        description: Exact reviewed pull request head to translate in non-publishing mode.
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.preflight_only &&
      format('native-app-locale-preflight-{0}', github.ref) ||
      'native-app-locale-refresh' }}
  # Finish the active full refresh; GitHub retains only the newest pending run for this group.
  # Publisher overlap checks defer stale generated paths to that queued reconciliation run.
  cancel-in-progress: false

jobs:
  resolve-base:
    if: >-
      github.repository == 'openclaw/openclaw' &&
      (github.event_name != 'workflow_dispatch' ||
        (inputs.publish && !inputs.preflight_only && github.ref == 'refs/heads/main') ||
        (!inputs.publish && !inputs.preflight_only && github.ref == 'refs/heads/main') ||
        (inputs.preflight_only && github.ref_type == 'branch'))
    runs-on: ubuntu-latest
    outputs:
      reviewed-pr: ${{ steps.review.outputs.pr }}
      sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Resolve source commit
        id: base
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NON_PUBLISHING: >-
            ${{ github.event_name == 'workflow_dispatch' &&
              (!inputs.publish || inputs.preflight_only) }}
          PREFLIGHT_ONLY: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.preflight_only }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ "${PREFLIGHT_ONLY}" == "true" ]]; then
            sha="${WORKFLOW_SHA}"
          elif [[ "${NON_PUBLISHING}" == "true" ]]; then
            sha="${REQUESTED_SOURCE_SHA}"
          else
            sha="$(
              timeout --signal=TERM --kill-after=10s 60s \
                gh api --method GET "repos/${REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq .sha
            )"
          fi
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve an exact source commit." >&2
            exit 1
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Require reviewed source for translation
        id: review
        if: github.event_name == 'workflow_dispatch' && !inputs.publish && !inputs.preflight_only
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          pull_requests="$(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/commits/${SOURCE_SHA}/pulls?per_page=100" \
              --jq '.[]' | jq -s '.'
          )"
          pull_request="$(
            jq -cer \
              --arg base "${DEFAULT_BRANCH}" \
              --arg repository "${REPOSITORY}" \
              --arg sha "${SOURCE_SHA}" \
              '[.[] | select(
                .state == "open" and
                .draft == false and
                .base.ref == $base and
                .base.repo.full_name == $repository and
                .head.sha == $sha
              )] | if length == 1 then .[0] else error("source must be the exact head of one open pull request") end' \
              <<< "${pull_requests}"
          )"
          pr="$(jq -er '.number' <<< "${pull_request}")"
          decision="$(
            gh api graphql \
              -f query='query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) { headRefOid reviewDecision }
                }
              }' \
              -f owner="${REPOSITORY%%/*}" \
              -f name="${REPOSITORY#*/}" \
              -F number="${pr}" \
              --jq '.data.repository.pullRequest'
          )"
          if ! jq -e --arg sha "${SOURCE_SHA}" \
            'select(.headRefOid == $sha and .reviewDecision == "APPROVED")' \
            <<< "${decision}" >/dev/null; then
            echo "Source ${SOURCE_SHA} needs an exact-head approval from a repository reviewer before translation credentials may be used." >&2
            exit 1
          fi
          current="$(gh api "repos/${REPOSITORY}/pulls/${pr}")"
          jq -e \
            --arg base "${DEFAULT_BRANCH}" \
            --arg repository "${REPOSITORY}" \
            --arg sha "${SOURCE_SHA}" \
            'select(
              .state == "open" and
              .draft == false and
              .base.ref == $base and
              .base.repo.full_name == $repository and
              .head.sha == $sha
            )' \
            <<< "${current}" >/dev/null
          echo "pr=${pr}" >> "${GITHUB_OUTPUT}"

  publisher-preflight:
    name: Verify generated PR App permissions
    needs: resolve-base
    if: >-
      needs.resolve-base.result == 'success' &&
      (github.event_name != 'workflow_dispatch' ||
        (inputs.publish && !inputs.preflight_only))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-base.outputs.sha }}
          persist-credentials: false
          submodules: false

      - name: Create generated PR tokens
        id: tokens
        uses: ./.github/actions/create-generated-pr-tokens
        with:
          contents-client-id: Iv23liOECG0slfuhz093
          contents-private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          pull-request-client-id: Iv23liPJCozR0uHm6P7G
          pull-request-private-key: ${{ secrets.MANTIS_GITHUB_APP_PRIVATE_KEY }}
          pull-request-contents-permission: write

      - name: Verify repository auto-merge setting
        env:
          GH_TOKEN: ${{ steps.tokens.outputs.pull-request-token }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          auto_merge_allowed="$(
            gh api graphql \
              -f query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { autoMergeAllowed } }' \
              -f owner="${REPOSITORY_OWNER}" \
              -f name="${REPOSITORY_NAME}" \
              --jq '.data.repository.autoMergeAllowed'
          )"
          if [[ "${auto_merge_allowed}" != "true" ]]; then
            echo "Repository auto-merge must be enabled before generated locale publication." >&2
            exit 1
          fi

  refresh:
    needs: [resolve-base, publisher-preflight]
    if: >-
      always() &&
      needs.resolve-base.result == 'success' &&
      (needs.publisher-preflight.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && !inputs.publish &&
          needs.publisher-preflight.result == 'skipped')) &&
      !(github.event_name == 'workflow_dispatch' && inputs.preflight_only)
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        locale:
          [
            zh-CN,
            zh-TW,
            pt-BR,
            de,
            es,
            ja-JP,
            ko,
            fr,
            hi,
            ar,
            it,
            tr,
            uk,
            id,
            pl,
            th,
            vi,
            nl,
            fa,
            ru,
            sv,
          ]
    runs-on: ubuntu-latest
    name: Refresh native ${{ matrix.locale }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-base.outputs.sha }}
          persist-credentials: false
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "false"

      - name: Revalidate reviewed source
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVIEWED_PR: ${{ needs.resolve-base.outputs.reviewed-pr }}
          SOURCE_SHA: ${{ needs.resolve-base.outputs.sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${REPOSITORY}/pulls/${REVIEWED_PR}")"
          jq -e \
            --arg base "${DEFAULT_BRANCH}" \
            --arg repository "${REPOSITORY}" \
            --arg sha "${SOURCE_SHA}" \
            'select(
              .state == "open" and
              .draft == false and
              .base.ref == $base and
              .base.repo.full_name == $repository and
              .head.sha == $sha
            )' \
            <<< "${current}" >/dev/null
          decision="$(
            gh api graphql \
              -f query='query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) { headRefOid reviewDecision }
                }
              }' \
              -f owner="${REPOSITORY%%/*}" \
              -f name="${REPOSITORY#*/}" \
              -F number="${REVIEWED_PR}" \
              --jq '.data.repository.pullRequest'
          )"
          if ! jq -e --arg sha "${SOURCE_SHA}" \
            'select(.headRefOid == $sha and .reviewDecision == "APPROVED")' \
            <<< "${decision}" >/dev/null; then
            echo "Source ${SOURCE_SHA} no longer has a current exact-head approval; refusing translation credential use." >&2
            exit 1
          fi

      - name: Refresh locale translations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENCLAW_DOCS_I18N_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
          OPENCLAW_CONTROL_UI_I18N_PROVIDER: openai
          OPENCLAW_CONTROL_UI_I18N_MODEL: ${{ secrets.OPENCLAW_I18N_MODEL }}
          OPENCLAW_I18N_FALLBACK_MODEL: ${{ secrets.OPENCLAW_I18N_FALLBACK_MODEL }}
          OPENCLAW_CONTROL_UI_I18N_THINKING: low
          OPENCLAW_CONTROL_UI_I18N_AUTH_OPTIONAL: "0"
          FULL_REFRESH: ${{ inputs.full_refresh || false }}
          LOCALE: ${{ matrix.locale }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY}" || -z "${OPENCLAW_CONTROL_UI_I18N_MODEL}" || -z "${OPENCLAW_I18N_FALLBACK_MODEL}" ]]; then
            echo "Translation API key and private primary/fallback model secrets are required." >&2
            exit 1
          fi
          args=()
          if [[ "${FULL_REFRESH}" == "true" ]]; then
            args+=(--force)
          fi
          node --import tsx scripts/native-app-i18n.ts sync --write --locale "${LOCALE}" "${args[@]}"

      - name: Prepare locale artifact
        env:
          LOCALE: ${{ matrix.locale }}
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/native-locale-${LOCALE}"
          mkdir -p "${artifact_dir}"
          git add -A apps/.i18n/native
          git diff --cached --binary --full-index -- apps/.i18n/native > "${artifact_dir}/${LOCALE}.patch"

      - name: Upload locale artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-locale-${{ matrix.locale }}
          path: ${{ runner.temp }}/native-locale-${{ matrix.locale }}/${{ matrix.locale }}.patch
          if-no-files-found: error
          retention-days: 1

  finalize:
    name: Finalize native locale refresh
    needs: [resolve-base, publisher-preflight, refresh]
    if: >-
      always() &&
      needs.resolve-base.result == 'success' &&
      (needs.publisher-preflight.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && !inputs.publish &&
          needs.publisher-preflight.result == 'skipped')) &&
      needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-base.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Download locale artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-locale-*
          path: ${{ runner.temp }}/native-locale-artifacts
          merge-multiple: true

      - name: Apply locale artifacts
        run: |
          set -euo pipefail
          while IFS= read -r patch; do
            if [ -s "${patch}" ]; then
              git apply "${patch}"
            fi
          done < <(find "${RUNNER_TEMP}/native-locale-artifacts" -type f -name '*.patch' | sort)

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "false"

      # Source PRs own the stable-ID inventory. Locale workers only contribute
      # translations; derive every platform artifact once after combining them.
      - name: Refresh native generated artifacts
        run: node --import tsx scripts/native-app-i18n.ts sync --write

      - name: Validate native locale refresh
        run: node --import tsx scripts/native-app-i18n.ts check

      - name: Prepare non-publishing locale patch
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: |
          set -euo pipefail
          patch="${RUNNER_TEMP}/native-app-locale-refresh.patch"
          git add -A
          while IFS= read -r path; do
            case "${path}" in
              apps/.i18n/native/* | \
              apps/android/app/src/main/java/ai/openclaw/app/i18n/NativeStringResources.kt | \
              apps/android/app/src/main/res/values*/assistant.xml | \
              apps/android/app/src/main/res/values*/strings.xml | \
              apps/android/app/src/thirdParty/res/values*/accessibility_strings.xml | \
              apps/android/wear/src/main/res/values*/strings.xml | \
              apps/ios/Resources/Localizable.xcstrings | \
              apps/macos/Sources/OpenClaw/Resources/Localizable.xcstrings | \
              apps/ios/Sources/*.lproj/InfoPlist.strings | \
              apps/ios/WatchApp/*.lproj/InfoPlist.strings | \
              apps/ios/ShareExtension/*.lproj/InfoPlist.strings | \
              apps/ios/ActivityWidget/*.lproj/InfoPlist.strings) ;;
              *) echo "Unexpected generated path: ${path}" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          git diff --cached --binary --full-index > "${patch}"

      - name: Upload non-publishing locale patch
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-app-locale-refresh-${{ needs.resolve-base.outputs.sha }}
          path: ${{ runner.temp }}/native-app-locale-refresh.patch
          if-no-files-found: error
          retention-days: 1

      - name: Open or update generated locale PR
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: ./.github/actions/publish-generated-pr
        with:
          contents-client-id: Iv23liOECG0slfuhz093
          contents-private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          pull-request-client-id: Iv23liPJCozR0uHm6P7G
          pull-request-private-key: ${{ secrets.MANTIS_GITHUB_APP_PRIVATE_KEY }}
          base-branch: ${{ github.event.repository.default_branch }}
          head-branch: automation/native-app-locale-refresh
          commit-message: "chore(i18n): refresh native locales"
          pr-title: "chore(i18n): refresh native locales"
          auto-merge: "true"
          generated-paths: |
            apps/.i18n/native
            apps/android/app/src/main/res/values*/assistant.xml
            apps/android/app/src/main/res/values*/strings.xml
            apps/android/app/src/thirdParty/res/values*/accessibility_strings.xml
            apps/android/wear/src/main/res/values*/strings.xml
            apps/ios/Resources/Localizable.xcstrings
            apps/macos/Sources/OpenClaw/Resources/Localizable.xcstrings
            apps/ios/Sources/*.lproj/InfoPlist.strings
            apps/ios/WatchApp/*.lproj/InfoPlist.strings
            apps/ios/ShareExtension/*.lproj/InfoPlist.strings
            apps/ios/ActivityWidget/*.lproj/InfoPlist.strings
          invalidation-paths: |
            apps/.i18n/native-source.json
            apps/android/app/src/main
            apps/android/app/src/play
            apps/android/app/src/thirdParty
            apps/android/wear/src/main
            apps/ios
            apps/macos/Sources
            apps/macos/Package.swift
            apps/shared/OpenClawKit/Sources
            scripts/control-ui-i18n.ts
            scripts/lib/control-ui-i18n-catalog-values.ts
            scripts/lib/control-ui-i18n-config.json
            scripts/lib/control-ui-i18n-config.ts
            scripts/lib/control-ui-i18n-sync-plan.ts
            scripts/android-app-i18n.ts
            scripts/apple-app-i18n.ts
            scripts/native-app-i18n.ts
            scripts/native-i18n-inventory.ts
            scripts/native-i18n-locales.ts
            ui/src/i18n/.i18n/glossary.*.json
            .github/actions/create-generated-pr-tokens/action.yml
            .github/actions/publish-generated-pr/action.yml
            .github/actions/publish-generated-pr/policy.py
            .github/workflows/native-app-locale-refresh.yml
          pr-body: |
            ## What Problem This Solves

            Keeps generated native app locales synchronized without bypassing protected-branch checks.

            ## Why This Change Was Made

            The Native App Locale Refresh workflow generated this update from `${{ needs.resolve-base.outputs.sha }}` and published it through a reviewable automation branch.

            ## User Impact

            No direct user-facing change beyond refreshed translations.

            ## Evidence

            - [Locale refresh run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - `node --import tsx scripts/native-app-i18n.ts check`
