name: Composer queue recovery proof
on:
  push:
    branches: [solid2/w-chat-5]
permissions:
  contents: read
concurrency:
  group: composer-queue-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  queue-recovery:
    if: github.repository == 'openclaw/openclaw'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: openclaw/openclaw/.github/actions/git-owner@dd4528b6393e7d00063067a080ca7241b48ce475
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          cache-mode: restore
          install-bun: "false"
      - uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore
      - name: Inspect recovery
        id: recovery
        continue-on-error: true
        shell: bash
        env:
          OPENCLAW_CAPTURE_UI_PROOF: "1"
          OPENCLAW_UI_E2E_SKIP_REAL_GATEWAY: "1"
        run: |
          set -euo pipefail
          mkdir -p .artifacts/composer-proof
          export OPENCLAW_UI_E2E_ARTIFACT_DIR="$GITHUB_WORKSPACE/.artifacts/composer-proof/screenshots"
          export OPENCLAW_UI_E2E_DIAGNOSTIC_DIR="$GITHUB_WORKSPACE/.artifacts/composer-proof/diagnostics"
          node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-e2e.config.ts --configLoader runner --maxWorkers 1 ui/src/e2e/chat-queue-update-reload.e2e.test.ts 2>&1 | tee .artifacts/composer-proof/recovery.log
      - name: Generate and fingerprint manifest
        shell: bash
        run: |
          set -euo pipefail
          g() { python3 -I -S "$CI_GIT_OWNER" --git 0 "$@"; }
          test "$(g rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .artifacts/composer-proof
          g rev-parse HEAD:ui > .artifacts/composer-proof/original-ui-tree.txt
          pnpm ui:boot-manifest:gen
          test -z "$(g diff --name-only HEAD -- . ':!ui/config/control-ui-boot-modules.json')"
          cp ui/config/control-ui-boot-modules.json .artifacts/composer-proof/
          g add -- ui/config/control-ui-boot-modules.json
          g diff --exit-code
          g rev-parse "$(g write-tree):ui" > .artifacts/composer-proof/generated-ui-tree.txt
          printf '%s\n' "$GITHUB_SHA" > .artifacts/composer-proof/source-head.txt
          sha256sum ui/config/control-ui-boot-modules.json > .artifacts/composer-proof/manifest.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: composer-proof-${{ github.sha }}
          path: .artifacts/composer-proof
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Report recovery failure
        if: steps.recovery.outcome == 'failure'
        run: exit 1
