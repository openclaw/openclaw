name: Composer manifest proof

on:
  push:
    branches: [solid2/w-chat-5]

permissions:
  contents: read

concurrency:
  group: composer-manifest-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    if: github.repository == 'openclaw/openclaw'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out exact composer head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare Git owner
        uses: openclaw/openclaw/.github/actions/git-owner@dd4528b6393e7d00063067a080ca7241b48ce475

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          cache-mode: restore
          install-bun: "false"

      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore

      - name: Generate and fingerprint manifest
        shell: bash
        run: |
          set -euo pipefail
          g() { python3 -I -S "$CI_GIT_OWNER" --git 0 "$@"; }
          test "$(g rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .artifacts/composer-manifest
          g rev-parse HEAD:ui > .artifacts/composer-manifest/original-ui-tree.txt
          pnpm ui:boot-manifest:gen
          test -z "$(g diff --name-only HEAD -- . ':!ui/config/control-ui-boot-modules.json')"
          cp ui/config/control-ui-boot-modules.json .artifacts/composer-manifest/
          g diff HEAD -- ui/config/control-ui-boot-modules.json > .artifacts/composer-manifest/manifest.patch
          g add -- ui/config/control-ui-boot-modules.json
          g diff --exit-code
          g rev-parse "$(g write-tree):ui" > .artifacts/composer-manifest/generated-ui-tree.txt
          printf '%s\n' "$GITHUB_SHA" > .artifacts/composer-manifest/source-head.txt
          sha256sum ui/config/control-ui-boot-modules.json > .artifacts/composer-manifest/manifest.sha256

      - name: Upload generated manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: composer-manifest-${{ github.sha }}
          path: .artifacts/composer-manifest
          if-no-files-found: error
          retention-days: 7
