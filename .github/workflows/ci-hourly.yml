name: Main CI Hourly

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci-hourly-dispatch-${{ github.event_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dispatch:
    if: github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.OPENCLAW_RELEASE_PRIORITY_RUN == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      # Reuse the full manual CI path rather than treating the last main commit
      # as an hourly diff: that would miss changes coalesced between hourly runs.
      # Leave target_ref unset: GitHub pins the child workflow and its checkout
      # to the same main SHA at dispatch, even if main moved since this event.
      - name: Dispatch full CI for main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const dispatchId = `hourly-main-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "ci.yml",
              ref: "main",
              inputs: {
                include_android: "true",
                release_gate: "false",
                release_scope: "full",
                dispatch_id: dispatchId,
              },
            });
            await core.summary
              .addHeading("Full main CI dispatched")
              .addRaw(`Follow the **CI ${dispatchId}** run in the CI workflow. ` +
                "This dispatcher succeeding is not a passing CI result.")
              .write();
