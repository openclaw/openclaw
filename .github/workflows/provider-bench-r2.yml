name: RunsOn on-demand pilot
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
# One attempt per cell; later report pushes must not buy another benchmark.
env:
  CI: "true"
  NODE_OPTIONS: --max-old-space-size=8192
  OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: "1"
  OPENCLAW_VITEST_NO_OUTPUT_RETRY: "0"
  OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: "300000"
jobs:
  cold:
    if: &pilot_guard >-
      github.repository == 'openclaw/openclaw' &&
      github.head_ref == 'ci-burden/r2-runson-pilot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'steipete' &&
      github.run_attempt == 1
    name: pilot / ${{ matrix.name }} / ${{ matrix.phase }}
    runs-on: ${{ matrix.label }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {
              "name": "large-bm32",
              "workload": "large",
              "instance": "",
              "storage": "cold",
              "workers": 8,
              "phase": "cold",
              "label": "blacksmith-32vcpu-ubuntu-2404",
            }
          - {
              "name": "large-c8i",
              "workload": "large",
              "instance": "c8i.4xlarge",
              "storage": "cold",
              "workers": 8,
              "phase": "cold",
              "label": "runs-on=${{ github.run_id }}/family=c8i.4xlarge/spot=false/retry=false/image=ubuntu24-full-x64/volume=80gb",
            }
          - {
              "name": "large-nvme",
              "workload": "large",
              "instance": "c8id.4xlarge",
              "storage": "nvme",
              "workers": 8,
              "phase": "cold",
              "label": "runs-on=${{ github.run_id }}/family=c8id.4xlarge/spot=false/retry=false/image=ubuntu24-full-x64/volume=80gb",
            }
          - {
              "name": "large-sticky",
              "workload": "large",
              "instance": "c8id.4xlarge",
              "storage": "sticky",
              "workers": 8,
              "phase": "cold",
              "label": "runs-on=${{ github.run_id }}/family=c8id.4xlarge/spot=false/retry=false/image=ubuntu24-full-x64/volume=80gb/sticky=r2-${{ github.run_id }}-large:30gb",
            }
          - {
              "name": "small-bm32",
              "workload": "small",
              "instance": "",
              "storage": "cold",
              "workers": 8,
              "phase": "cold",
              "label": "blacksmith-32vcpu-ubuntu-2404",
            }
          - {
              "name": "small-c8i",
              "workload": "small",
              "instance": "c8i.4xlarge",
              "storage": "cold",
              "workers": 8,
              "phase": "cold",
              "label": "runs-on=${{ github.run_id }}/family=c8i.4xlarge/spot=false/retry=false/image=ubuntu24-full-x64/volume=80gb",
            }
          - {
              "name": "small-nvme",
              "workload": "small",
              "instance": "c8id.4xlarge",
              "storage": "nvme",
              "workers": 8,
              "phase": "cold",
              "label": "runs-on=${{ github.run_id }}/family=c8id.4xlarge/spot=false/retry=false/image=ubuntu24-full-x64/volume=80gb",
            }
          - {
              "name": "small-sticky",
              "workload": "small",
              "instance": "c8id.4xlarge",
              "storage": "sticky",
              "workers": 8,
              "phase": "cold",
              "label": "runs-on=${{ github.run_id }}/family=c8id.4xlarge/spot=false/retry=false/image=ubuntu24-full-x64/volume=80gb/sticky=r2-${{ github.run_id }}-small:30gb",
            }
          - {
              "name": "cron-c8i.8xlarge-w8",
              "workload": "cron",
              "instance": "c8i.8xlarge",
              "storage": "cold",
              "workers": 8,
              "phase": "cold",
              "label": "runs-on=${{ github.run_id }}/family=c8i.8xlarge/spot=false/retry=false/image=ubuntu24-full-x64/volume=80gb",
            }
          - {
              "name": "cron-c8i.8xlarge-w12",
              "workload": "cron",
              "instance": "c8i.8xlarge",
              "storage": "cold",
              "workers": 12,
              "phase": "cold",
              "label": "runs-on=${{ github.run_id }}/family=c8i.8xlarge/spot=false/retry=false/image=ubuntu24-full-x64/volume=80gb",
            }
          - {
              "name": "cron-c8i.8xlarge-w16",
              "workload": "cron",
              "instance": "c8i.8xlarge",
              "storage": "cold",
              "workers": 16,
              "phase": "cold",
              "label": "runs-on=${{ github.run_id }}/family=c8i.8xlarge/spot=false/retry=false/image=ubuntu24-full-x64/volume=80gb",
            }
          - {
              "name": "cron-c8a.8xlarge-w8",
              "workload": "cron",
              "instance": "c8a.8xlarge",
              "storage": "cold",
              "workers": 8,
              "phase": "cold",
              "label": "runs-on=${{ github.run_id }}/family=c8a.8xlarge/spot=false/retry=false/image=ubuntu24-full-x64/volume=80gb",
            }
          - {
              "name": "cron-c8a.8xlarge-w16",
              "workload": "cron",
              "instance": "c8a.8xlarge",
              "storage": "cold",
              "workers": 16,
              "phase": "cold",
              "label": "runs-on=${{ github.run_id }}/family=c8a.8xlarge/spot=false/retry=false/image=ubuntu24-full-x64/volume=80gb",
            }
          - {
              "name": "gateway-c8i.8xlarge-w8",
              "workload": "gateway",
              "instance": "c8i.8xlarge",
              "storage": "cold",
              "workers": 8,
              "phase": "cold",
              "label": "runs-on=${{ github.run_id }}/family=c8i.8xlarge/spot=false/retry=false/image=ubuntu24-full-x64/volume=80gb",
            }
          - {
              "name": "gateway-c8i.8xlarge-w12",
              "workload": "gateway",
              "instance": "c8i.8xlarge",
              "storage": "cold",
              "workers": 12,
              "phase": "cold",
              "label": "runs-on=${{ github.run_id }}/family=c8i.8xlarge/spot=false/retry=false/image=ubuntu24-full-x64/volume=80gb",
            }
          - {
              "name": "gateway-c8i.8xlarge-w16",
              "workload": "gateway",
              "instance": "c8i.8xlarge",
              "storage": "cold",
              "workers": 16,
              "phase": "cold",
              "label": "runs-on=${{ github.run_id }}/family=c8i.8xlarge/spot=false/retry=false/image=ubuntu24-full-x64/volume=80gb",
            }
          - {
              "name": "gateway-c8a.8xlarge-w8",
              "workload": "gateway",
              "instance": "c8a.8xlarge",
              "storage": "cold",
              "workers": 8,
              "phase": "cold",
              "label": "runs-on=${{ github.run_id }}/family=c8a.8xlarge/spot=false/retry=false/image=ubuntu24-full-x64/volume=80gb",
            }
          - {
              "name": "gateway-c8a.8xlarge-w16",
              "workload": "gateway",
              "instance": "c8a.8xlarge",
              "storage": "cold",
              "workers": 16,
              "phase": "cold",
              "label": "runs-on=${{ github.run_id }}/family=c8a.8xlarge/spot=false/retry=false/image=ubuntu24-full-x64/volume=80gb",
            }
    steps: &linux_steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: RunsOn and sticky store
        id: sticky
        if: matrix.instance != ''
        uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d # v2
        with:
          sticky_cache: ${{ matrix.storage == 'sticky' && 'custom,path=/home/runner/.pnpm-store' || '' }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Machine and storage facts
        env:
          EXPECTED_TYPE: ${{ matrix.instance }}
          STORAGE: ${{ matrix.storage }}
          PHASE: ${{ matrix.phase }}
          CELL: ${{ matrix.workload }}
          STICKY_HIT: ${{ steps.sticky.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const os=require("node:os"); console.log("BENCH_FACTS "+JSON.stringify({node:process.version,cpus:os.availableParallelism(),ram:os.totalmem(),model:os.cpus()[0].model}))'
          node -e 'console.log("BENCH_LAUNCH "+JSON.stringify({launchedAt:process.env.RUNS_ON_INSTANCE_LAUNCHED_AT,region:process.env.RUNS_ON_AWS_REGION}))'
          lscpu
          cat /proc/cmdline
          cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo "CPU quota counter unavailable"
          if [[ -n "$EXPECTED_TYPE" ]]; then
            imds_token=$(curl -fsS --connect-timeout 2 --max-time 5 -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)
            for fact in instance-type instance-life-cycle placement/region; do
              value=$(curl -fsS --connect-timeout 2 --max-time 5 -H "X-aws-ec2-metadata-token: $imds_token" "http://169.254.169.254/latest/meta-data/$fact")
              echo "BENCH_EC2 $fact=$value"
              case "$fact" in
                instance-type) test "$value" = "$EXPECTED_TYPE" ;;
                instance-life-cycle) test "$value" = on-demand ;;
                placement/region) test "$value" = us-east-1 ;;
              esac
            done
          fi
          store="$HOME/.pnpm-store/r2-$GITHUB_RUN_ID-$CELL"
          mkdir -p "$store"
          echo "PNPM_CONFIG_STORE_DIR=$store" >> "$GITHUB_ENV"
          echo "PNPM_CONFIG_CACHE_DIR=$store/cache" >> "$GITHUB_ENV"
          if [[ "$STORAGE" == nvme || "$STORAGE" == sticky ]]; then
            lsblk -o NAME,MODEL,SIZE,MOUNTPOINTS
            findmnt -T /tmp
            findmnt -T "$store"
            nvme_dev=$(stat -Lc '%d' /mnt/ephemeral)
            assert_nvme_writes() {
              local path="$1" writable="$1"
              # RunsOn overlays image contents; new files live in the upper layer.
              if [[ "$(findmnt -nr -o FSTYPE -T "$path")" == overlay ]]; then
                writable=$(findmnt -nr -o OPTIONS -T "$path" | sed -n 's/.*upperdir=\([^,]*\).*/\1/p')
                test -n "$writable"
              fi
              echo "BENCH_STORAGE path=$path writable=$writable"
              test "$(stat -Lc '%d' "$writable")" = "$nvme_dev"
            }
            assert_nvme_writes /tmp
            block=$(findmnt -nr -o MAJ:MIN -T "$(realpath /mnt/ephemeral)")
            lsblk --inverse --json --output NAME,TYPE,MODEL "/dev/block/$block" | node -e '
              const tree = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
              const flatten = nodes => nodes.flatMap(n => [n, ...flatten(n.children || [])]);
              const disks = flatten(tree.blockdevices).filter(n => n.type === "disk");
              console.log("BENCH_NVME " + JSON.stringify(disks));
              if (!disks.length || disks.some(n => n.model?.trim() !== "Amazon EC2 NVMe Instance Storage")) process.exit(1);
            '
            if [[ "$STORAGE" == nvme ]]; then
              assert_nvme_writes "$store"
            else
              mountpoint "$RUNS_ON_STICKYDISK_DIR"
              sticky_dev=$(stat -Lc '%d' "$RUNS_ON_STICKYDISK_DIR")
              test "$(stat -Lc '%d' "$store")" = "$sticky_dev"
              test "$sticky_dev" != "$nvme_dev"
            fi
          fi
          if [[ "$PHASE" == warm ]]; then
            test "$STICKY_HIT" = true
            test "$(cat "$store/r2-head")" = "$BENCH_HEAD_SHA"
          elif [[ "$STORAGE" == sticky ]]; then
            test "$STICKY_HIT" != true
          fi
          if [[ "$PHASE" == cold ]]; then
            test -z "$(find "$store" -mindepth 1 -maxdepth 1 -print -quit)"
          fi
          echo "BENCH_CACHE phase=$PHASE sticky_hit=$STICKY_HIT"
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          node-version: 24.19.0
          cache-mode: off
      - name: Install dependencies
        run: python3 scripts/ci-provider-bench-phase.py install pnpm install --frozen-lockfile --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true --prefer-offline
      - name: Select preserved workload
        env:
          WORKLOAD: ${{ matrix.workload }}
          WORKERS: ${{ matrix.workers }}
          LARGE_GROUPS: 
          SMALL_GROUPS: 
        run: |
          node --import tsx --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { gunzipSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          const { WORKLOAD, WORKERS } = process.env;
          const groups = WORKLOAD === 'large' || WORKLOAD === 'small'
            ? JSON.parse(gunzipSync(Buffer.from(process.env[WORKLOAD.toUpperCase()+'_GROUPS'], 'base64')))
            : [{shard_name: WORKLOAD, configs: [`test/vitest/vitest.${WORKLOAD === 'gateway' ? 'gateway-core' : 'cron'}.config.ts`]}];
          process.env.OPENCLAW_VITEST_MAX_WORKERS = WORKERS;
          for (const config of new Set(groups.flatMap(group => group.configs))) {
            const test = (await import('./'+config)).default.test;
            console.log('BENCH_CONFIG '+JSON.stringify({config, workers:test.maxWorkers, fileParallelism:test.fileParallelism}));
            if (!['large','small'].includes(WORKLOAD) && (test.maxWorkers !== Number(WORKERS) || test.fileParallelism === false)) throw Error('Worker ceiling not effective');
          }
          appendFileSync(process.env.GITHUB_ENV, `OPENCLAW_VITEST_MAX_WORKERS=${WORKERS}\nOPENCLAW_NODE_TEST_GROUPS_JSON=${JSON.stringify(groups)}\n`);
          console.log('BENCH_GROUP '+JSON.stringify({groups,digest:createHash('sha256').update(JSON.stringify(groups)).digest('hex')}));
          JS
      - name: Mark populated sticky store
        if: matrix.storage == 'sticky'
        run: echo "$BENCH_HEAD_SHA" > "$PNPM_CONFIG_STORE_DIR/r2-head"
      - name: Test workload
        run: python3 scripts/ci-provider-bench-phase.py test node --import tsx scripts/ci-run-node-test-shard.mts
      - name: Final resources
        if: always()
        run: |
          df -h / /tmp
          free -b
          cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo "Memory peak counter unavailable"
    env:
      BENCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  warm:
    needs: cold
    if: >-
      always() && !cancelled() &&
      github.repository == 'openclaw/openclaw' &&
      github.head_ref == 'ci-burden/r2-runson-pilot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'steipete' &&
      github.run_attempt == 1
    name: pilot / ${{ matrix.name }} / warm
    runs-on: ${{ matrix.label }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {
              "name": "large-sticky",
              "workload": "large",
              "instance": "c8id.4xlarge",
              "storage": "sticky",
              "workers": 8,
              "phase": "warm",
              "label": "runs-on=${{ github.run_id }}/family=c8id.4xlarge/spot=false/retry=false/image=ubuntu24-full-x64/volume=80gb/sticky=r2-${{ github.run_id }}-large:30gb",
            }
          - {
              "name": "small-sticky",
              "workload": "small",
              "instance": "c8id.4xlarge",
              "storage": "sticky",
              "workers": 8,
              "phase": "warm",
              "label": "runs-on=${{ github.run_id }}/family=c8id.4xlarge/spot=false/retry=false/image=ubuntu24-full-x64/volume=80gb/sticky=r2-${{ github.run_id }}-small:30gb",
            }
    env:
      BENCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps: *linux_steps
  windows:
    if: *pilot_guard
    name: pilot / windows-part-1 / cold
    runs-on: runs-on=${{ github.run_id }}/family=c8i.4xlarge/spot=false/retry=false/image=windows25-full-x64/volume=100gb
    timeout-minutes: 25
    env:
      OPENCLAW_VITEST_MAX_WORKERS: "1"
      OPENCLAW_TEST_PROJECTS_PARALLEL: "1"
      OPENCLAW_TEST_SKIP_FULL_EXTENSIONS_SHARD: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: RunsOn
        uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d # v2
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Match CI Defender exclusions
        shell: pwsh
        run: |
          if (Get-Command Add-MpPreference -ErrorAction SilentlyContinue) {
            try {
              Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
              Add-MpPreference -ExclusionProcess "node.exe" -ErrorAction Stop
            } catch {
              Write-Warning "Defender exclusions unavailable; continuing as CI does."
            }
          }
      - name: Machine facts
        run: |
          echo "PNPM_CONFIG_STORE_DIR=$(cygpath -w "$RUNNER_TEMP/r2-pnpm-store")" >> "$GITHUB_ENV"
          node -e 'console.log("BENCH_LAUNCH "+JSON.stringify({launchedAt:process.env.RUNS_ON_INSTANCE_LAUNCHED_AT,region:process.env.RUNS_ON_AWS_REGION}))'
          node -e 'const os=require("node:os"); console.log("BENCH_FACTS "+JSON.stringify({node:process.version,cpus:os.availableParallelism(),ram:os.totalmem(),model:os.cpus()[0].model}))'
          imds_token=$(curl -fsS --connect-timeout 2 --max-time 5 -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)
          for fact in instance-type instance-life-cycle placement/region; do
            value=$(curl -fsS --connect-timeout 2 --max-time 5 -H "X-aws-ec2-metadata-token: $imds_token" "http://169.254.169.254/latest/meta-data/$fact")
            echo "BENCH_EC2 $fact=$value"
            case "$fact" in
              instance-type) test "$value" = c8i.4xlarge ;;
              instance-life-cycle) test "$value" = on-demand ;;
              placement/region) test "$value" = us-east-1 ;;
            esac
          done
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          node-version: 24.19.0
          cache-mode: off
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true
      - name: Test Windows part 1
        run: pnpm test:windows:ci:1
