# REVIEW ARTIFACT ONLY: not installed/dispatched. NONQUALIFICATION.
# On a separately authorized diagnostic-only ref, place this at
# .github/workflows/openclaw-performance.yml and the unchanged helper at
# scripts/diagnostics/release37-causal.py. Never modify candidate or main.
name: Release 37 causal diagnostic (nonqualification)
on:
  workflow_dispatch:
    inputs:
      artifact_recipient_certificate:
        description: Public PEM X.509 encryption certificate; retain matching private key OFF runner
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release37-causal-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Read reviewed diagnostic helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
          sparse-checkout: scripts/diagnostics/release37-causal.py
          sparse-checkout-cone-mode: false
      - name: Frozen OpenClaw seed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: e2db37f28cc774d75a54d963817d0f153387a229
          path: seed/openclaw
          persist-credentials: false
      - name: Frozen Kova seed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/kova
          ref: 4b8b1681446b868a44193ed6e97253a6c8bcbbbf
          path: seed/kova
          persist-credentials: false
      - name: Prepare exclusive executor and verified inputs
        shell: bash
        env:
          RECIPIENT_CERT: ${{ inputs.artifact_recipient_certificate }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/causal-private"
          printf '%s\n' "$RECIPIENT_CERT" > "$RUNNER_TEMP/causal-private/recipient.pem"
          openssl x509 -in "$RUNNER_TEMP/causal-private/recipient.pem" -noout >/dev/null 2>&1
          # Prove this certificate supports encryption before any raw evidence exists.
          printf 'preflight' | openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -out "$RUNNER_TEMP/causal-private/preflight.p7m" "$RUNNER_TEMP/causal-private/recipient.pem"
          git -C seed/openclaw fetch --no-tags --depth=1 https://github.com/openclaw/openclaw.git b764253ddf0edf89887ecc0dcc2a8615ad791bc2:refs/heads/causal-b764
          test "$(git -C seed/openclaw rev-parse HEAD)" = e2db37f28cc774d75a54d963817d0f153387a229
          git -C seed/openclaw cat-file -e b764253ddf0edf89887ecc0dcc2a8615ad791bc2^{commit}
          test "$(git -C seed/kova rev-parse HEAD)" = 4b8b1681446b868a44193ed6e97253a6c8bcbbbf
          echo '7c42225724cfbcbca15361652ef4cdd8bcc57476319cc0e7922dd78bd3926795  control/scripts/diagnostics/release37-causal.py' | sha256sum --check
          sudo install -d -m 0700 /srv/causal-inputs
          sudo cp -a seed/openclaw seed/kova /srv/causal-inputs/
          sudo install -m 0700 control/scripts/diagnostics/release37-causal.py /srv/causal-inputs/causal-diagnostic.py
          sudo curl --fail --location --silent --show-error https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz -o /srv/causal-inputs/node.tar.xz
          sudo curl --fail --location --silent --show-error https://github.com/openclaw/ocm/releases/download/v0.2.47/ocm-x86_64-unknown-linux-gnu.tar.gz -o /srv/causal-inputs/ocm.tar.gz
          sudo useradd --create-home --shell /bin/bash --user-group openclaw-causal
          uid=$(id -u openclaw-causal)
          printf '%s\n' "$uid" > "$RUNNER_TEMP/causal-private/executor.uid"
          sudo loginctl enable-linger openclaw-causal
          sudo systemctl start "user@$uid.service"
          sudo chown -R openclaw-causal:openclaw-causal /srv/causal-inputs
          sudo install -d -m 0700 -o openclaw-causal -g openclaw-causal /srv/causal-work
      - name: Execute both serial frozen arms (not qualification)
        shell: bash
        run: |
          set -euo pipefail
          uid=$(id -u openclaw-causal)
          # No token, provider secret, or ambient NODE_OPTIONS enters this account.
          # Redirect source/build/error output to the encrypted-evidence staging area.
          sudo -u openclaw-causal env -i \
            HOME=/home/openclaw-causal USER=openclaw-causal LOGNAME=openclaw-causal \
            PATH=/usr/bin:/bin XDG_RUNTIME_DIR=/run/user/$uid \
            DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus \
            /usr/bin/python3 /srv/causal-inputs/causal-diagnostic.py \
            --exclusive-account openclaw-causal --root /srv/causal-work/run \
            --openclaw-repo /srv/causal-inputs/openclaw --kova-repo /srv/causal-inputs/kova \
            --node-archive /srv/causal-inputs/node.tar.xz --ocm-archive /srv/causal-inputs/ocm.tar.gz \
            > "$RUNNER_TEMP/causal-private/controller.log" 2>&1
      - name: Seal all evidence and dispose executor
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Quiesce ONLY the fresh UID recorded after this job's successful useradd.
          # No archive while an orphaned controller can still mutate evidence.
          if test -f "$RUNNER_TEMP/causal-private/executor.uid"; then
            uid=$(cat "$RUNNER_TEMP/causal-private/executor.uid")
            test "$uid" = "$(id -u openclaw-causal)"
            test "$uid" -gt 0
            test "$uid" != "$(id -u)"
            sudo timeout 30s loginctl disable-linger openclaw-causal || true
            sudo timeout 30s systemctl stop "user@$uid.service" || true
            sudo pkill -TERM -u "$uid" || test "$?" -eq 1
            for attempt in {1..20}; do
              if ! pgrep -u "$uid" >/dev/null; then break; fi
              sleep 1
            done
            if pgrep -u "$uid" >/dev/null; then
              sudo pkill -KILL -u "$uid" || test "$?" -eq 1
            fi
            for attempt in {1..5}; do
              if ! pgrep -u "$uid" >/dev/null; then break; fi
              sleep 1
            done
            ! pgrep -u "$uid" >/dev/null
          fi
          mkdir -p "$RUNNER_TEMP/causal-sealed"
          if test -f "$RUNNER_TEMP/causal-private/recipient.pem"; then
            # No raw profile, source, log, path, or synthetic message is uploaded.
            # Archive both arms separately inside one encrypted, access-restricted object.
            sudo tar -czf "$RUNNER_TEMP/causal-private/evidence.tar.gz" \
              --ignore-failed-read --exclude="*/source" --exclude="*/toolchain" \
              --exclude="*/tools" --exclude="*/ocm-home" --exclude="*/run/kova" \
              /srv/causal-work "$RUNNER_TEMP/causal-private/controller.log" \
              2> "$RUNNER_TEMP/causal-private/archive.log"
            sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/causal-private/evidence.tar.gz"
            openssl cms -encrypt -binary -aes-256-cbc -outform DER \
              -in "$RUNNER_TEMP/causal-private/evidence.tar.gz" \
              -out "$RUNNER_TEMP/causal-sealed/nonqualification-evidence.p7m" \
              "$RUNNER_TEMP/causal-private/recipient.pem"
          fi
      - name: Retain encrypted nonqualification evidence for seven days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release37-causal-nonqualification-${{ github.run_id }}
          path: ${{ runner.temp }}/causal-sealed/*.p7m
          if-no-files-found: error
          retention-days: 7
