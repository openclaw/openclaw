name: Temporary stdio cleanup proof

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/stdio-cleanup-proof.yml
      - src/process/owned-stdio.ts
      - src/process/supervisor/service-child-relay-host.ts
      - src/process/supervisor/service-child-relay-host.test.ts
      - src/process/supervisor/adapters/child.ts
      - src/process/supervisor/adapters/child.test.ts
      - src/process/supervisor/adapters/child.test-support.ts
      - src/agents/mcp-stdio-transport.test.ts
      - src/agents/mcp-stdio-transport.windows.test.ts

permissions:
  contents: read

concurrency:
  group: stdio-cleanup-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=8192
  SOURCE_PINS: '{"src/agents/mcp-stdio-transport.test.ts":"77a2ffe0c413d2fd7f8aee85ff6e98e293daa360de278889dee09825ba865b34","src/agents/mcp-stdio-transport.windows.test.ts":"ebe0c6e53a1e0a2bb1b3bc69f473549291fb2d39af89854cb2c89f14c70ed036","src/process/owned-stdio.ts":"b8ddeb89684c9453587ce49a840217c3046a36187c4b05d5ca855b3cdd140457","src/process/supervisor/adapters/child.test-support.ts":"78d5253a9d90693b18f445e8d1f51c02d430522aa20fa3582be5bd78faacf2f8","src/process/supervisor/adapters/child.test.ts":"21fbdd360bd8d7a796535034145e9927a83d24e8e4c62b81474a318bd3e51cea","src/process/supervisor/adapters/child.ts":"471d6afab07067b962676f32bb8b44a16b2a47385d38b58c4bbfddbc6b74ae38","src/process/supervisor/service-child-relay-host.test.ts":"7c9f9996252dc23a84f5daf153c012966a3466c802be255659aa775a878b1fc0","src/process/supervisor/service-child-relay-host.ts":"5eb61a5debfc0340b930ace9762ef36b00da87ba1b6ddbb2e41d724d9579e163"}'

jobs:
  linux-checks:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/stdio-cleanup-completion'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      OPENCLAW_VITEST_MAX_WORKERS: "2"
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 8
          persist-credentials: false
      - &identity
        name: Verify exact source
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git show --no-patch --format='%H %P'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          for (const [file, expected] of Object.entries(JSON.parse(process.env.SOURCE_PINS))) {
            const actual = createHash('sha256').update(readFileSync(file)).digest('hex');
            assert.equal(actual, expected, file);
            console.log(`${actual}  ${file}`);
          }
          NODE
      - &setup
        name: Setup frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          install-bun: "false"
          cache-mode: "off"
      - name: Verify frozen comparison base
        env:
          BASE_SHA: 77124fdbd35b2e907c6f6c1729f89825dc99cea0
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git ls-tree --name-only "$BASE_SHA" -- config/max-lines-baseline.txt
          node -v
          pnpm -v
      - name: Verify corrected adapter fixture on Linux
        run: node scripts/run-vitest.mjs src/process/supervisor/adapters/child.test.ts
      - name: Canonical remaining checks against frozen base
        run: >-
          node scripts/check-changed.mjs --base 77124fdbd35b2e907c6f6c1729f89825dc99cea0 --
          src/agents/mcp-stdio-transport.test.ts
          src/agents/mcp-stdio-transport.windows.test.ts
          src/process/owned-stdio.ts
          src/process/supervisor/adapters/child.test-support.ts
          src/process/supervisor/adapters/child.test.ts
          src/process/supervisor/adapters/child.ts
          src/process/supervisor/service-child-relay-host.test.ts
          src/process/supervisor/service-child-relay-host.ts
      - name: Final source verification
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          for (const [file, expected] of Object.entries(JSON.parse(process.env.SOURCE_PINS))) {
            assert.equal(createHash('sha256').update(readFileSync(file)).digest('hex'), expected, file);
          }
          NODE

  windows-owner:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/stdio-cleanup-completion'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      OPENCLAW_VITEST_MAX_WORKERS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - *checkout
      - *identity
      - *setup
      - name: Verify native Windows and run direct-child contract
        run: |
          node -e 'if(process.platform!=="win32")process.exit(1); console.log(JSON.stringify({platform:process.platform,node:process.version,arch:process.arch}))'
          pnpm -v
          node scripts/run-vitest.mjs src/process/supervisor/adapters/child.test.ts src/process/owned-stdio.test.ts src/agents/mcp-stdio-transport.windows.test.ts
      - *identity
